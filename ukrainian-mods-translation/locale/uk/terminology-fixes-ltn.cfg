[virtual-signal-name]
ltn-requester-stack-threshold=Поріг запиту в стосах
ltn-provider-stack-threshold=Поріг постачання в стосах

[mod-setting-name]
ltn-provider-show-existing-cargo=Постачальники виводять наявний вантаж
ltnc-use-stacks=Запитувати стосами

[mod-setting-description]
ltn-dispatcher-requester-delivery-reset=Ні (типово):\nДоставка та розклад скидаються, коли поїзд прибуває у депо.\nЗміни в поїздах на станції запиту не діють.\n\nТак:\nДоставка та розклад скидаються, коли поїзд відходить від запитувача.\nЗміни у поїздах на станції запиту видаляють доставку та скидають розклад.
ltn-dispatcher-finish-loading=Так (типово):\nЗапобігає відходу поїздів під час роботи маніпуляторів/насосів, даючи їм 2 секунди.\n\nНі:\nПоїзди відправлятимуться негайно, коли всі предмети будуть завантажені.\nМаніпулятори на станціях можуть зависнути з вантажем.
ltn-depot-reset-filters=Так (типово):\nУ вантажних вагонів очищаються фільтри та обмеження стосів, коли вони заїжджають у депо.
ltn-provider-show-existing-cargo=Так (типово):\nВантаж, що вже є в потязі при прибутті до постачальника, показується у виводі LTN.\nВключно з предметами, які маніпулятори тримають над коліями.
ltnc-use-stacks=Якщо позначено, запити на предмети вводяться в стосах, а не поштучно.\n\n[color=blue]Типово:[/color] [color=green]Так[/color]

[ltnc]
label-stacks=Стоси
blueprint-bug=Креслення, яке ви щойно оновили, імовірно, зламане через давню помилку, коли креслення лежить у бібліотеці, а не в інвентарі: https://forums.factorio.com/viewtopic.php?f=182&t=88100\nПеремістіть креслення в інвентар і знову виберіть об'єкти.

[ltnc-signal-tips]
ltn-requester-threshold=Необхідний дефіцит товару/рідини, який має бути до того, як буде ініційовано запит.\nЦе значення буде проігноровано для товарів, якщо задано поріг запиту в стосах.
ltn-requester-stack-threshold=Потрібний дефіцит предмета в стосах, після якого спрацьовує запит.\nДля рідин цей сигнал ігнорується.
ltn-provider-threshold=Необхідний запас предмета/рідини, який потрібно мати перед тим, як станція запропонує постачання до мережі.\nЦе значення буде проігноровано для предметів, якщо встановлено поріг постачання в стосах.
ltn-provider-stack-threshold=Потрібний запас предмета в стосах, після якого станція пропонує постачання в мережу.\nДля рідин цей сигнал ігнорується.
ltn-locked-slots=Кількість заблокованих слотів на вагон для цієї станції-постачальника.

[string-mod-setting-description]
ltnc-disable-built-combinators-none=Ні запитувач, ні постачальник не будуть примусово переведені у вимкнений стан.  У нових комбінаторів обидва сервіси залишаться увімкненими.\n\n[color=red]Примітка:[/color]Якщо комбінатор будується з креслення або копіюється, сервіси зберігають стан креслення або вихідного об'єкта.
ltnc-disable-built-combinators-requester=Службу запитувача буде вимкнено у всіх нових комбінаторах.  Це вимкне службу запитувачів у комбінаторах із креслень, навіть якщо в кресленні її увімкнено.\n\n[color=red]Примітка:[/color] Вимкнено означає, що для комбінатора буде встановлено високий поріг запиту.
ltnc-disable-built-combinators-provider=Службу постачальника буде вимкнено в усіх нових комбінаторах.  Це вимкне службу постачальника в комбінаторах із креслень, навіть якщо в кресленні її увімкнено.\n\n[color=red]Примітка:[/color] вимкнено означає, що для комбінатора буде встановлено високий поріг постачання.
ltnc-disable-built-combinators-all=Сервіси запитувача і постачальника буде примусово переведено у вимкнений стан.  Це перевизначить налаштування у комбінаторах із креслень.\n\n[color=red]Примітка:[/color] Вимкнено означає, що для комбінатора буде встановлено високі пороги запиту і надання.

