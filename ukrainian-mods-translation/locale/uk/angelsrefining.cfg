pollution-setting=Щоб змінити налаштування забруднення, перейдіть на вкладку «Розширені» генератора мапи та перемкніть прапорець біля «Забруднення».
enemy-setting=Щоб змінити налаштування ворогів, перейдіть на вкладку «Ворог» генератора мапи та змініть повзунок розміру «Angel's enemy multiplier».
evolution-setting=Щоб змінити налаштування еволюції ворогів, перейдіть на вкладку «Ворог» генератора мапи та перемкніть прапорець «Еволюція».
