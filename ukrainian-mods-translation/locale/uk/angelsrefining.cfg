[tips-and-tricks-description]
angelsrefining=Мод, що додає складні руди, які потрібно рафінувати, перш ніж їх можна буде виплавити метал і відлити в пластини.
angels-ore-generation=Мод [tooltip=Angels refining,tips-and-tricks-description.angelsrefining] замінює всі родовища руд новими, які потрібно рафінувати перед виплавкою. Усі руди, придатні для виплавки (з базової гри/Bob's/YI), буде замінено новими складними рудами: \n\n__1__\n Також є нове джерело: __2__
angels-ore-refining=Видобуті складні руди потрібно рафінувати, перш ніж їх можна буде виплавити метал і відлити в пластини. Досконаліші методи рафінування дають більший вихід оброблених руд і можуть відкривати нові рафіновані руди.\n\nНаразі є 3 режими:\n    - Ванільний: рафінування для збільшення виходу залізної та мідної руди.\n    - Чистий Angel's: рафінування для отримання різноманітних матеріалів.\n    - Bob's-Angel's (також BA або AB): рафінування для отримання багатьох руд з модів.\n\nДобре працює разом з Bob's Mods і підтримує інші моди, як-от Yuoki Industries (і, на жаль, втрачені моди Uranium Power та Nuclear).\nМод також додає вдосконалену обробку руд — подрібнення, флотацію, кислотне вилуговування та кристалізацію — для підвищення виходу й ефективності. Крім того, мод містить системи очищення стічних вод для використання в цих та інших виробничих ланцюжках.\nЛанцюжки обробки води та рафінування розкриваються поступово в дереві технологій.
angels-crushing=Першим кроком після видобутку руду потрібно подрібнити до стану, з яким можна працювати. Подрібнення відокремлює твердий камінь від корисних матеріалів.\n\nЗагальний рецепт перетворює [img=item/angels-ore4] складну руду на [img=item/angels-ore4-crushed] подрібнену руду та [item=angels-stone-crushed].\n[item=angels-stone-crushed] можна переробити на інші матеріали в середині гри, а на початку — на [item=stone], [item=stone-brick] та [item=stone-wall]. [img=item/angels-ore4-crushed] Подрібнену руду в деяких випадках можна одразу пустити на виплавку або обробляти далі й зрештою відсортувати.
angels-crushing-notes=\n\n[font=default-bold]ПРИМІТКА[/font]: У реальному світі для подрібнення руди використовують кульові, щокові, пневматичні та ударні дробарки. Руда розбивається на менші шматки, що збільшує площу поверхні для хімічної обробки, особливо на наступному етапі — флотації.
angels-floatation=Флотація — вторинний етап рафінування, що додатково промиває подрібнену руду для видалення домішок. Це перший з етапів хімічного рафінування, що використовує очищену воду. Радимо мати поруч систему очищення води та систему очищення стічних вод для побічних продуктів, як-от жеод. Жеоди — кристалічні утворення, що часто трапляються в ґрунтах і каменях.\n\nЗагальний рецепт перетворює подрібнену руду з невеликою кількістю [fluid=angels-water-purified] на шматки руди, з певним шансом жеоду та трохи стічних вод.\nЖеоди можна переробляти на різні речі залежно від встановлених модів.\nШматки можна відсортувати або додатково очистити на наступному етапі — вилуговуванні.
angels-floatation-notes=\n\n[font=default-bold]ПРИМІТКА[/font]: У реальному світі флотацію руди застосовують широко, здебільшого з мильноподібною речовиною та кислим або лужним водним розчином. Це розділяє матеріали в розчині за різними фізичними та хімічними властивостями. Якщо хочете дізнатися більше, пошукайте «пінна флотація» — це загальніша назва процесу.
angels-leaching=Третій етап рафінування — кислотне вилуговування. Цей процес розчиняє шматки з попереднього етапу в сильній кислоті, залишаючи трохи шлаку (вважаємо, що на цьому етапі це не проблема). Суміш руди й кислоти кристалізується у відносно однорідні кристали високої чистоти. Процес знову використовує хімічні властивості руди.\n\nЗагальний рецепт перетворює шматки руди з 10 одиницями кислоти на 2 кристали руди.\nБільшість кислоти для цього етапу можна отримати з попереднього етапу — флотації, але може знадобитися трохи додаткової. Це перший етап без відходів.
angels-leaching-notes=\n\n[font=default-bold]ПРИМІТКА[/font]: У реальному світі кислотне вилуговування зазвичай стосується відвалів. Щебінь та інші тверді відходи системи очищення руди скидають у великий котлован із герметичним бетонним дном (як великий басейн) і зрошують кислотами, які просочуються крізь купу й розчиняють корисні складові, що були пропущені раніше. Розчин, зібраний на дні, багатий на мінерали, які зазвичай кристалізують і повертають у систему виплавки.
angels-purification=Останній етап обробки руди — найвища ступінь очищення, що видаляє останні домішки й дає найчистішу руду. Поєднання рекуперативного нагрівання, хімічної обробки та електролізу означає, що в цьому процесі не потрібні й не витрачаються додаткові тверді чи рідкі матеріали.\n\nЗагальний рецепт перетворює кристали руди на очищену руду.\nЦей етап «полірування» руди використовують рідко — лише для найекзотичніших і найрідкісніших речовин, щоб виправдати їхню високу якість перед виплавкою.
angels-ore-sorting=Рудосортувальна установка — це гігантський вдосконалений гравітаційний сепаратор, центрифуга та решітчастий сепаратор, що розділяє рафіновану руду на складові (або метали) для виплавки високоякісних металів.
angels-ore-sorting-vanilla=\n\nСортувальна установка перетворює 4 складні руди різних ступенів рафінування на придатну для виплавки руду, самородки та гальку в різних пропорціях. Самородки й гальку можна далі перетворити на металеву руду. Вищий ступінь очищення руди дає більше придатної для виплавки руди. Очищена руда також дає металевий шлак.
angels-ore-sorting-overhaul=\n\nСортувальна установка перетворює 6 основних руд різних ступенів рафінування на різноманітні металеві руди:\n4×[img=item/angels-ore4-crushed] подрібненої руди дають 2 первинні руди, 1 вторинну руду та 1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] шматків руди дають 2 первинні руди, 1 вторинну руду та 2 третинні руди, а також 1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] кристалів руди дають 3 первинні руди, 1 вторинну руду та 3 третинні руди, а також 1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] очищеної руди дають 3 первинні руди, 2 вторинні руди та 4 третинні руди.\n\nЩо дасть кожна руда, можна побачити, навівши курсор на руду на землі.\nПервинні та вторинні руди наведено нижче:\n- [item=angels-ore1] та [item=angels-ore2]: первинна [item=iron-ore], вторинна [item=copper-ore]\n- [item=angels-ore3] та [item=angels-ore4]: первинна [item=copper-ore], вторинна [item=iron-ore]\n- [item=angels-ore6]: первинна [item=angels-tin-ore], вторинна [item=angels-quartz]\n- [item=angels-ore5]: первинна [item=angels-lead-ore], вторинна [item=angels-nickel-ore]
angels-ore-sorting-bobs=\n\nСортувальна установка перетворює 6 основних руд різних ступенів рафінування на різноманітні металеві руди:\n4×[img=item/angels-ore4-crushed] подрібненої руди дають 2 первинні руди, 1 вторинну руду та 1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] шматків руди дають 2 первинні руди, 1 вторинну руду та 2 третинні руди, а також 1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] кристалів руди дають 3 первинні руди, 1 вторинну руду та 3 третинні руди, а також 1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] очищеної руди дають 3 первинні руди, 2 вторинні руди та 4 третинні руди.\n\nЩо дасть кожна руда, можна побачити, навівши курсор на руду на землі.\nПервинні та вторинні руди наведено нижче:\n- [item=angels-ore1] та [item=angels-ore2]: первинна [item=iron-ore], вторинна [item=copper-ore]\n- [item=angels-ore3] та [item=angels-ore4]: первинна [item=copper-ore], вторинна [item=iron-ore]\n- [item=angels-ore6]: первинна [item=angels-tin-ore], вторинна [item=angels-quartz]\n- [item=angels-ore5]: первинна [item=angels-lead-ore], вторинна [item=angels-nickel-ore]
angels-watertype=Приклади рідин водного типу:\n[fluid=angels-water-saline] Солона вода\n[fluid=angels-water-purified] Очищена вода\n[fluid=angels-water-mineralized] Мінералізована вода
angels-wastewaters=Приклади стічних вод:\n[fluid=angels-water-yellow-waste] Сірчанокислі стічні води\n[fluid=angels-water-greenyellow-waste] Фтористі стічні води\n[fluid=angels-water-green-waste] Хлористі стічні води\n[fluid=angels-water-red-waste] Азотнокислі стічні води
angels-water-processing=Переробляйте морську воду та стічні води на очищену воду й видобувайте корисні тверді речовини в [entity=angels-hydro-plant].
angels-water-processing-vanilla=\nПеретворюйте воду на [fluid=angels-water-saline] для отримання солей та [fluid=angels-water-purified] для обробки руд, як-от флотації. \nВидобувайте [item=sulfur] з [fluid=angels-water-yellow-waste], щоб повертати її в процес.
angels-water-processing-overhaul=\nПеретворюйте воду на [fluid=angels-water-saline] для отримання солей та [fluid=angels-water-purified] для обробки руд, як-от флотації.\n\n
angels-water-processing-voiding=\nЗайві [tooltip=рідини водного типу,tips-and-tricks-description.angels-watertype] та [tooltip=стічні води,tips-and-tricks-description.angels-wastewaters] можна вилучити з гри за допомогою [entity=angels-clarifier].\n\n[font=default-bold]ПРИМІТКА[/font]: Повний перелік рідин, які можна освітлити, див. у комірці рідинного входу рецепта освітлювача.\n

