bpsb-surface-props-gui-property-preset-reset=Застосувати цей шаблон ще раз
bpsb-surface-props-gui-property-ignore-conditions=Чи використовуватиме Factorio ці умови для обмеження будівель/рецептів. Деяких обмежень уникнути не можна, як-от будівництва збирачів блискавок.
