bpsb-isolation-level-full=Повна

[string-mod-setting-description]
bpsb-isolation-level-none=Пісочниці доступні лише через віддалений перегляд, і будь-що в них потенційно може вплинути на решту гри. Може бути не найкращим варіантом для мережевих збережень.
bpsb-isolation-level-full=Пісочниця використовується від імені іншої фракції, що має низку переваг і недоліків. Передусім ви отримуєте більше можливостей, пряме керування й окрему статистику; проте перебування в пісочниці майже як гра в іншу гру — от тільки час у цій грі теж плине.

