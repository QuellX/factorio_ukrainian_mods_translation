bpsb-surface-props-gui-equipment-blueprint-input=Задає вміст лабораторії після скидання.\nКлацніть із кресленням, щоб задати початкове обладнання.\nКлацніть без креслення, щоб отримати його.\nПКМ — повернути типове обладнання.

