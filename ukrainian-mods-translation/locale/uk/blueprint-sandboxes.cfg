[mod-setting-description]
bpsb-isolation-level=Наскільки пісочниці «відокремлені» від гри, якщо це можливо. Повне пояснення — у порадах і підказках або на сторінці мода.
bpsb-allow-all-technology=Діє лише за повної ізоляції.
bpsb-only-admins-force-reset=У мережевій грі не дозволяти неадміністраторам скидати будь-які пісочниці фракції.
bpsb-craft-to-cursor=Під час «виготовлення» в пісочницях класти результат одразу в курсор. Діє лише за повної ізоляції.
bpsb-extra-mining-speed=Додатковий множник швидкості видобування в пісочницях. Діє лише за повної ізоляції.
bpsb-god-async-tick=Як часто обробляти асинхронні об'єкти.
bpsb-god-async-create-per-tick=Якщо 0 — обробляти одразу; якщо >0 — планувати обробку на майбутній тік для щонайбільше такої кількості об'єктів. Докладніше — у порадах і підказках.
bpsb-god-async-upgrade-per-tick=Якщо 0 — обробляти одразу; якщо >0 — планувати обробку на майбутній тік для щонайбільше такої кількості об'єктів. Докладніше — у порадах і підказках.
bpsb-god-async-delete-per-tick=Якщо 0 — обробляти одразу; якщо >0 — планувати обробку на майбутній тік для щонайбільше такої кількості об'єктів. Докладніше — у порадах і підказках.
bpsb-labs-absorb-pollution=Плитки в лабораторії поглинають забруднення, як трава, зменшуючи втрату UPS від додаткових чанків
bpsb-quality-entity-planners=Вибір об'єктів для появи в пісочниці містить вибір якості

[string-mod-setting]
