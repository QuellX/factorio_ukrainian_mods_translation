[tips-and-tricks-item-description]
bpsb-intro-introduction=Ласкаво просимо до мода Blueprint Sandboxes!\nВін дає змогу користуватися деякими можливостями режиму редактора й режиму бога, не залишаючи поточну гру, у середовищах на кшталт лабораторії.\n\nНайкращі способи переносити креслення в пісочниці й з них — копіювання/вставлення та бібліотека креслень. Іноді креслення можна також «пронести» в пісочницю чи з неї, тримаючи його в курсорі.\n\nЩоб потрапити в першу пісочницю, натисніть __CONTROL__bpsb-toggle-gui-sb-toggle-shortcut__ або кнопку на панелі швидких дій. Так само можна вийти з пісочниці.
bpsb-intro-isolation=Налаштування рівня ізоляції визначає, наскільки пісочниці інтегровані з грою. Кожен варіант має важливі переваги й недоліки. Подробиці — на сторінці мода.\n\nПовна — історично типовий варіант, що максимально відокремлює пісочниці від решти гри. Це потребує скриптів, щоб повернути деякі корисні речі, втрачені через такий підхід. Використання фракцій і контролерів принципово визначає, що можливо, а що ні з цим налаштуванням.\n\nНемає — новіший варіант, який став можливим завдяки віддаленому перегляду у 2.0; він лише запобігає відвертому шахрайству в пісочниці, що могло б вплинути на решту гри.\n\nОсновні відмінності між ними:\n\nБезпека:\n- Повна: різні небезпеки\n- Немає: цілком безпечно\n\nПростота:\n- Повна: складно\n- Немає: просто\n\nДоступність:\n- Повна: з обмеженнями\n- Немає: завжди\n\nВидимість:\n- Повна: особиста / фракції\n- Немає: фракції\n\nВіддалений перегляд:\n- Повна: неможливий\n- Немає: повністю інтегрований\n\nТехнології:\n- Повна: частково синхронізуються через Lua\n- Немає: синхронізовані\n\nДослідження:\n- Повна: вимкнено\n- Немає: вимкнено\n\nНалаштування «всі технології»:\n- Повна: можна використовувати\n- Немає: не можна використовувати\n\nСповіщення:\n- Повна: окремі\n- Немає: синхронізовані\n\nЧат:\n- Повна: пересилається через Lua\n- Немає: синхронізований\n\nПерсонаж:\n- Повна: замінюється режимом бога\n- Немає: залишається вашим\n\nДосягнення:\n- Повна: можуть спрацювати\n- Немає: спрацюють\n\nВіхи:\n- Повна: окремі\n- Немає: синхронізовані\n\nСтатистика:\n- Повна: окрема\n- Немає: входить до глобальної\n\nЛогістичні групи / групи потягів:\n- Повна: окремі\n- Немає: синхронізовані\n\nНескінченні контейнери / завантажувачі:\n- Повна: видимі лише в пісочниці\n- Немає: видимі всім членам фракції\n\nСкасування / повторення:\n- Повна: скидаються під час входу/виходу\n- Немає: працюють як очікується
bpsb-intro-multiple-sandboxes=Коли ви в пісочниці, з'являється меню пісочниці, і першим ви помітите, що можна змінити пісочницю:\n\nОсобиста: пісочниця на кшталт лабораторії, унікальна для вас.\nФракції: ще одна пісочниця на кшталт лабораторії, спільна для всієї вашої фракції.\n\nЯкщо ви не використовуєте повну ізоляцію, ці пісочниці також можна бачити й відкривати з віддаленого перегляду — зокрема пісочниці членів вашої фракції.
bpsb-intro-reset-v2=Далі в меню пісочниці ви можете помітити кнопку скидання. Вона повністю скидає поточну пісочницю, якщо хочете почати спочатку. Зважайте на інших, коли використовуєте її в пісочниці фракції!
bpsb-intro-surface-properties=Це меню допомагає налаштувати конкретну пісочницю. Наприклад, можна зафіксувати певний час доби або електрифікувати підлогу, щоб не ставити опори ЛЕП.\n\nЯкщо ви граєте в Space Age або з цікавими модами, то можете помітити, що деякі об'єкти й рецепти мають умови поверхні — інакше їх не можна збудувати чи вибрати. Це меню дозволяє вибрати шаблон на основі реальних локацій або налаштувати на свій розсуд. Шаблони можуть містити приховані, але важливі відмінності у властивостях, тож краще спершу вибрати найближчий шаблон, а вже потім щось змінювати!
bpsb-intro-sandbox-force=Коли ви в пісочниці з повною ізоляцією, вас насправді переносять до іншої фракції, дуже схожої на вашу початкову, — без ізоляції це не діє. Оскільки в пісочницях у вас ширші права, це дозволяє чітко відокремити їх від звичайних дій.\n\nЦе також означає, що ви більше не «володієте» об'єктами в реальному світі, як-от потягами, платформами чи турелями. На жаль, через це ви не отримуєте сповіщень про їх пошкодження чи знищення. Подбайте про надійний захист бази або частіше повертайтеся, щоб на вас не чекала катастрофа.\n\nЗалежно від налаштувань мода ця фракція або синхронізує відкриті вами дослідження, або має всі дослідження вже відкритими. У першому випадку «прогрес» окремої технології не оновлюється в реальному часі, але черга досліджень синхронізується.\n\nОскільки ця фракція базується на вашій, у разі зміни фракції у вас будуть інші пісочниці фракції, а особисту пісочницю, можливо, доведеться скинути (бо ви більше нічим у ній не володієте).
bpsb-intro-new-recipes-v2=У пісочниці також доступні нові рецепти й інструменти для зручніших експериментів.\n\nПо-перше, вмикаються приховані завантажувачі Factorio, якщо їх ще не ввімкнув інший мод. Для тих самих навантажувальних тестів вмикаються також нескінченні акумулятор, скриня й труба. Їх можна використовувати як абстрактні входи й виходи для перевірки ваших проєктів.\n\nДалі — планувальник вибору об'єктів: за допомогою __CONTROL__select-for-blueprint__ можна створювати в пісочниці цікаві речі, а альтернативним вибором (__CONTROL__reverse-select__) — прибирати їх!\n\nЄ й простіший планувальник вибору плиток, щоб змінювати плитки під ногами (або повертати лабораторні через __CONTROL__reverse-select__).\n\nНарешті, у пісочницях можна виготовляти предмети миттєво й одразу в курсор: замість виготовлення в інвентар і подальшого вибору результату все, що ви виготовляєте кліком, одразу готове до використання! Це також замінює те, що було в курсорі, тож можна просто натиснути __CONTROL__open-character-gui__, клацнути рецепт, __CONTROL__confirm-gui__, продовжувати проєктувати й повторювати. Це налаштовується для кожного гравця окремо.
bpsb-intro-god-mode=Коли ви входите в пісочницю без ізоляції, ви бачите її через віддалений перегляд — а ще можна відкривати пісочниці, клацаючи на них у віддаленому перегляді. У цих пісочницях більшість операцій, які зазвичай виконують роботи, обробляються автоматично (через Lua), тож зазвичай усе гаразд.\n\nЯкщо ви входите з повною ізоляцією, то стаєте богом із прямішим керуванням. Ваше тіло залишається там, де ви його покинули (будьте обережні!), а ви вільно літаєте тут. Інвентар бога постійний і окремий від звичайного інвентарю гравця. Це не завжди можливо, бо потрібно відокремити вас від тіла й переконатися, що згодом вас можна безпечно повернути назад.
bpsb-intro-auto-building=Окрім режиму бога, у вас є й деякі можливості режиму редактора! Зазвичай режим бога розміщує привиди об'єктів без предметів в інвентарі, але тут привиди заповнюються автоматично. Плани поліпшення й знесення також діють миттєво.\n\nОскільки режим редактора тут використати не можна — усе відбувається в Lua, — на жаль, це повільніше за налаштування «миттєве будівництво» режиму редактора. Крім того, щоб обійти деякі можливі помилки з порядком операцій, є кілька налаштувань для цієї поведінки.\n\nСтворення, знищення й поліпшення можуть відбуватися синхронно (у тому ж тіку, що й подія) або асинхронно (у періодичному тіку після події). Типово у Factorio < 1.1.61, щоб обійти помилку з налаштуванням «розумних конвеєрів», асинхронним є лише створення.\n\nУ налаштуваннях мода значення «асинхронних за тік» більше нуля вмикає таку поведінку й визначає кількість оброблюваних запитів для кожної пісочниці окремо. Якщо вимкнено, запит обробляється саме тоді, коли спрацьовує подія. Якщо увімкнено, запити відкладаються й плануються на майбутній тік. Налаштування визначає, скільки запитів обробляється за ітерацію; звісно, це налаштування продуктивності — що для вас важливіше: пропускна здатність чи затримка?\n\nНарешті, ручне знесення також типово відбувається миттєво. Це досягається шаленим збільшенням швидкості видобування в пісочниці. Це збільшення налаштовується в налаштуваннях мода.
bpsb-factorissimo-introduction=Сумісність із Factorissimo можлива, якщо ви використовуєте форк від notnotmelon, бо він додає API, що уможливлюють інтеграцію.\n\nЗдебільшого фабрики, розміщені в пісочницях, отримують додаткові можливості цієї пісочниці. Наприклад, автоматичне заповнення привидів і швидке виготовлення працюють усередині фабрик Factorissimo. Проте є кілька неминучих обмежень.\n\nОскільки фабрики зберігаються на спільній поверхні, деякі загальноповерхневі функції всередині них вимкнено. Не можна змінювати яскравість у фабриках і не можна їх скидати. Також «збереження» вашого невидимого тіла було б надто складно обробити, тож не можна залишити пісочницю чи перейти в іншу, поки ви у фабриці всередині неї — спершу вийдіть із фабрики.

[messages]
universe-of-sandboxes-intro=Ласкаво просимо до Всесвіту пісочниць! Кожна планета матиме лабораторні плитки, але в іншому збереже всі звичайні властивості.\nЗа потреби змінюйте ландшафт за допомогою редактора. Вихід із редактора перемкне вас на слабший режим бога.\nБез персонажа, коли ви переглядаєте іншу поверхню у віддаленому перегляді й виходите з нього, Factorio розмістить вас на цій поверхні. Використовуйте це для прямішої взаємодії без обмежень покриття радарів. Для найкращих результатів установіть у налаштуваннях мода повну ізоляцію.
blueprint-in-cursor-from-library=У вашому курсорі було креслення, але Factorio помилково вважає його недійсним. Найімовірніше, це тому, що воно зараз у бібліотеці креслень (відома помилка Factorio).
character-lost=[img=utility/warning_icon] На жаль, вашого попереднього персонажа повністю втрачено, тож доведеться почати заново.
choose-first-associated-character=[img=utility/warning_icon] У вас кілька пов'язаних персонажів, і пісочниця не знає, якого саме ви хотіли, тож вибирає першого знайденого
god-inventory-almost-full=[img=utility/warning_icon] Ваш інвентар майже повний. Будь ласка, викиньте щось.
factorissimo-cannot-change-sandbox=[img=utility/warning_icon] Ви всередині будівлі фабрики, тож не можете змінити пісочницю.
cannot-build-in-sandbox=[img=utility/warning_icon] Частину того, що ви намагалися збудувати, не можна будувати в пісочниці.
sandbox-force-changed-while-in-sandbox=Ваша фракція змінилася, тож вас прибрано з пісочниці, до якої ви більше не маєте доступу.
sandbox-entrace-from-unsupported-controller=[img=utility/warning_icon] Ви потрапили в пісочницю незвичним способом, використовуючи непідтримуваний контролер. Далі — на ваш страх і ризик.
sandbox-exiting-without-known-entrace=[img=utility/warning_icon] Схоже, ви потрапили в пісочницю незвичним способом, бо вона не знає, звідки ви прийшли. Те, що станеться далі, може бути неочікуваним.
sandbox-unsafe-to-close-remote-view=Ви використовуєте віддалений перегляд, який не можна безпечно закрити, тож не можете увійти в пісочницю. Спершу поверніться до свого персонажа.
sandbox-unsafe-to-replace-controller=Ваш поточний персонаж/контролер нестабільний, тож ви не можете увійти в пісочницю
sandbox-unsafe-to-replace-controller-watching-a-cutscene=перегляд катсцени
sandbox-unsafe-to-replace-controller-using-a-jetpack=використання реактивного ранця
sandbox-unsafe-to-replace-controller-using-the-editor=використання редактора
sandbox-unsafe-to-replace-controller-controller-stashed=основний контролер відкладено
sandbox-unsafe-to-replace-controller-riding-a-rocket=політ на ракеті
sandbox-unsafe-to-replace-controller-remote-view-while-not-physical=фізичний контролер не є фізичним персонажем під час віддаленого перегляду
sandbox-unsafe-to-replace-controller-remote-view-while-driving=керування транспортом під час віддаленого перегляду
sandbox-unsafe-to-replace-controller-riding-a-platform=політ на платформі
sandbox-unsafe-to-replace-controller-in-moving-vehicle=у рухомому транспорті
