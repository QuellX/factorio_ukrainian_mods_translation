[tips-and-tricks-item-description]
nixie-tubes=[entity=nixie-tube] та [entity=nixie-tube-small] показують числові значення з логічної мережі. Лампи Ніксі автоматично об'єднуються з сусідніми лампами ліворуч для показу додаткових цифр. Просто під'єднайте крайню праву цифру й виберіть сигнал.
nixie-tubes-alpha=З [entity=nixie-tube-alpha] можна будувати текстові табло. Кожна лампа має отримувати лише один символьний сигнал і показує відповідний символ. Якщо сигналів кілька, показується символ помилки.
nixie-tubes-color=Усі типи ламп Ніксі можуть отримувати сигнал кольору разом із числовим чи символьним сигналом, коли вибрано «використовувати кольори». Колір застосовується з тим самим пріоритетом, що й у [entity=small-lamp].
nixie-tubes-formatting=[entity=nixie-tube] та [entity=nixie-tube-small] можуть отримувати сигнал форматування разом із числовим сигналом — подібно до кольорів.\n[virtual-signal=signal-hex] показує значення в шістнадцятковому вигляді.\n[virtual-signal=signal-number-type] з різними значеннями змінює тлумачення значення сигналу:\n[virtual-signal=signal-number-type]=1 число з рухомою комою одинарної точності\n[virtual-signal=signal-number-type]=2 число з рухомою комою подвійної точності — старша половина читається з [item=green-wire], молодша — з [item=red-wire].\n[virtual-signal=signal-number-type]=-1 беззнакове ціле\n[virtual-signal=signal-number-type]=4, 8, 16, 32, ... 1073741824 двійкове з фіксованою комою\n[virtual-signal=signal-number-type]=-4, -8, -16, -32, ... -2147483648 беззнакове двійкове з фіксованою комою\n[virtual-signal=signal-number-type]=10, 100, 1000, ... 1000000000 десяткове з фіксованою комою\n[virtual-signal=signal-number-type]=-10, -100, -1000, ... -1000000000 беззнакове десяткове з фіксованою комою\n[virtual-signal=signal-number-type]=60 час\n[virtual-signal=signal-number-type]=-60 беззнаковий час\n[virtual-signal=signal-number-type]=0x41534349 ("ASCI") чотири символи ASCII\n[virtual-signal=signal-number-type]=0x54595045 ("TYPE") код типу\nНевідомі значення [virtual-signal=signal-number-type] ігноруються, і значення тлумачиться як ціле зі знаком.\nСам [virtual-signal=signal-number-type] завжди показується як код типу.

[virtual-signal-description]
signal-hex=Використовується з [entity=nixie-tube] та [entity=nixie-tube-small] для показу чисел у шістнадцятковому вигляді
signal-number-type=Використовується з [entity=nixie-tube] та [entity=nixie-tube-small] для показу різних видів чисел:\n1 : з рухомою комою одинарної точності\n2 : з рухомою комою подвійної точності — старша половина [item=green-wire], молодша [item=red-wire]\n-1 : беззнакове ціле\n4, 8, 16, 32, ... : двійкове з фіксованою комою\n-4, -8, -16, -32, ... : беззнакове двійкове з фіксованою комою\n10, 100, 1000, ... : десяткове з фіксованою комою\n-10, -100, -1000, ... : беззнакове десяткове з фіксованою комою\n60 : час\n-60 : беззнаковий час\n0x41534349 ("ASCI") : чотири символи ASCII\n0x54595045 ("TYPE") : код типу
