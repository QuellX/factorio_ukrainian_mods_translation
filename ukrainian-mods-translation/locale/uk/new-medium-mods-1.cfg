generator-warning=\n[font=default-bold][color=red][img=utility/danger_icon] Для роботи потрібні попит на електрику та місце для виведення рідин.[/color][/font]
max-flow-reached=\nВища температура зменшує споживання (__1__) замість збільшення потужності.
deadlock-loader=Швидко переміщує ресурси між конвеєрами та інвентарями. Поверніть після розміщення, щоб змінити режим входу/виходу.
deadlock-beltbox=Складає в стоси та розпаковує деякі ресурси й продукцію, забезпечуючи 5-кратне стиснення на конвеєрах.
equipment-gantry=Може вставляти спорядження в сітку спорядження предмета. Має 3 внутрішні контейнери для обробки предметів. Кладіть броню чи транспорт із сіткою у вхід предмета із сіткою, а спорядження — у вхід спорядження.
equipment-gantry-remover=Виймає все спорядження із сітки спорядження предмета. Має 3 внутрішні контейнери для обробки предметів. Кладіть броню чи транспорт із сіткою у вхід предмета із сіткою.

