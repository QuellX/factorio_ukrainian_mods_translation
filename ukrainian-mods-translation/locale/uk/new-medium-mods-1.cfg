[equipment-gantry]
menu_equipment-gantry=Портал спорядження  [img=item/equipment-gantry]
title_equipment-gantry=Портал спорядження
page_equipment-gantry_text_1=[font=heading-2]Портал спорядження  [img=item/equipment-gantry][/font]\n\nМоже вставляти спорядження в сітку спорядження предмета. Має 3 внутрішні контейнери для обробки предметів.\n\nКладіть броню чи транспорт із сіткою у вхід предмета із сіткою, а спорядження — у вхід спорядження. Предмет із сіткою потрапить у вихідну комірку, щойно буде вставлено 1 предмет спорядження або процес завершиться невдачею.\n\nСпорядження розміщується в сітці зліва направо, потім згори вниз. Плануйте порядок встановлення як частину своєї лінії порталів.\n\n[font=heading-2]Портал зняття спорядження  [img=item/equipment-gantry-remover][/font]\n\nВиймає все спорядження із сітки спорядження предмета. Має 3 внутрішні контейнери для обробки предметів. Кладіть броню чи транспорт із сіткою у вхід предмета із сіткою. Спорожнений предмет із сіткою переміщується у вихідну комірку. Усе зняте спорядження зберігається у внутрішньому буфері й переміщується в комірку спорядження, щойно там з'являється місце. Наступний предмет не можна спорожнити, доки вихідні комірки предмета із сіткою та спорядження не будуть порожні.\n\n[font=heading-2]Поточні обмеження[/font]\n\nНе вміє працювати з підпредметами спорядження. Не можна (поки що) під'єднувати дроти до внутрішніх скринь.
warning-invalid-ingredient=Предмет, що не є спорядженням, на вході спорядження порталу __1__

