[mod-name]
PicksQuickbarImportExport=Picklocks: імпорт/експорт панелі швидкого доступу
equipment-gantry=Портал спорядження

[mod-description]
PicksQuickbarImportExport=Мод спочатку створив Therenas. Проте він більше не оновлює мод і позначив його як застарілий. Я адаптував мод для Factorio V2.0 і публікую його з люб'язного дозволу Therenas.\n\nЦей мод дозволяє експортувати поточну панель швидкого доступу як рядок та імпортувати її в інше збереження. Так легко перенести панель швидкого доступу зі старого збереження в нове. Панеллю також можна ділитися з іншими гравцями.\n\nВміст панелі експортується/імпортується так:\n- Предмети\n- Якість предметів\n- Креслення, плани поліпшення та плани знесення імпортуються як порожні елементи\n\nІмпорт/експорт можна викликати (залежно від налаштувань мода) власною кнопкою вгорі ліворуч або через панель швидкого доступу й гарячі клавіші.\n\nМод має бути сумісним з іншими модами. Наразі підтримуються німецька, англійська та частково французька мови.\n\n! Імпорт незворотний. Після імпорту рядка стару конфігурацію не відновити. !
equipment-gantry=Дозволяє автоматизувати встановлення спорядження в предмети із сіткою спорядження, як-от павукотрони та силову броню.

[controls]
pi_qie_import=Імпорт панелі швидкого доступу
pi_qie_export=Експорт панелі швидкого доступу

[controls-description]
pi_qie_import=Гаряча клавіша для імпорту рядка панелі швидкого доступу
