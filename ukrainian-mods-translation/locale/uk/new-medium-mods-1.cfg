[mod-setting-description]
kry-spidertron-slot1=Типово — кулемет
kry-spidertron-slot2=Типово — кулемет
kry-spidertron-slot3=Типово — ракетниця
kry-spidertron-slot4=Типово — ракетниця
kry-spidertron-slot5=Типово — немає
kry-spidertron-slot6=Типово — немає
kry-spidertron-recipe=Оновлює рецепт павукотрона відповідно до поточного набору зброї. Якщо якась зброя відкривається окремою технологією, ця технологія також додається до передумов павукотрона.
kry-spidertron-carbon-fiber=Коли увімкнено Space Age, рецепт павукотрона потребуватиме вуглецевого волокна, а отже — науки Ґлеби.\nЯкщо вимкнено, Ґлебу повністю прибрано з вимог, тож павукотрон можна виготовити набагато раніше в дереві технологій (залежно від вибраної зброї)
drp-interval-seconds=Як часто записується файл стану. Discord обмежує супутній застосунок одним оновленням на 15 секунд, тож менші значення не прискорять оновлення статусу.
drp-enabled=Головний перемикач. Вимкніть, щоб припинити публікацію, не видаляючи мод.
drp-show-save=Рядок 1. Супутній застосунок бере назву з журналу гри.
drp-show-planet=Рядок 1. Ваше фізичне розташування: віддалений перегляд його не змінює.
drp-show-overhaul=Рядок 1. Виявлена основна збірка модів, як-от Krastorio2 чи Space Age.
drp-show-research=Рядок 2. Технологія, що досліджується, і її прогрес — вашою мовою.
drp-show-tech-count=При наведенні. Досліджені технології із загальної кількості, без нескінченних.
drp-show-evolution=При наведенні. Еволюція ворогів на вашій поточній поверхні.
drp-show-rockets=При наведенні. Прихований, доки ви не запустили жодної ракети.
drp-show-trees=При наведенні. Зрубані чи спалені дерева на всіх поверхнях. Прихований, доки значення нульове.
drp-show-enemies=При наведенні. Знищені вами кусаки, плюваки, черв'яки та лігва на всіх поверхнях. Прихований, доки значення нульове.
drp-show-deaths=При наведенні. Скільки разів ви загинули. Прихований, доки значення нульове.
drp-show-pollution=При наведенні. Загальне забруднення, викинуте на всіх поверхнях, а не лише вашою фракцією — гра не рахує його окремо для фракцій.
drp-show-afk=При наведенні. Скільки часу минуло з вашої останньої дії.
drp-show-mod-count=При наведенні. Скільки модів у вас увімкнено.
drp-show-mode=При наведенні. А в мережевій грі — скільки гравців під'єднано.
drp-show-player-name=При наведенні. Корисно здебільшого в мережевій грі.
drp-show-server=При наведенні. Показує адресу сервера всім, хто бачить ваш профіль.
drp-timer=Що рахує таймер картки.
pi_qie_display_gui_button=Чи показувати кнопку вгорі ліворуч на екрані. Якщо вимкнено, можна й далі користуватися панеллю швидкого доступу чи гарячими клавішами.
deadlock-stacking-auto-unstack=Автоматично розпаковувати стоси предметів, підібраних із землі чи конвеєрів.
deadlock-stacking-hide-unstacking=Прибирає рецепти розпакування з вкладки виготовлення гравця. Це не дає розпаковувати вручну, але прибирає багато зайвого.
deadlock-loaders-snap-to-belts=Під час розміщення завантажувачі автоматично налаштовують режим і напрямок відповідно до сусідніх конвеєрів (та інвентарів з боку конвеєра)
deadlock-loaders-snap-to-inventories=Під час розміщення завантажувачі автоматично завантажують в інвентарі, до яких вони повернуті передом чи задом
deadlock-stacking-batch-stacking=Стосувальники складають і розпаковують стоси партіями по 4, рівномірно завантажуючи конвеєри та підвищуючи пропускну здатність на надшвидких конвеєрах із модів
deadlock-stacking-show-alt-info=Показує або приховує значок рецепта на стосувальниках у докладному режимі.
deadlock-strict-fast-replace-beltboxes=Стосувальники швидко замінюють лише інші стосувальники
deadlock-strict-fast-replace-loaders=Завантажувачі швидко замінюють лише інші завантажувачі
deadlock-stack-size=Скільки предметів утворюють один стос. Увага: не рекомендовано змінювати для наявних збережень. Якщо розмір стосу предметів не ділиться на це число без остачі, стоси втрачатимуть щільність в інвентарі.
k2sfix-item-sfx-fix=Звуки підбирання/переміщення/викидання предметів K2 — усі типові.\n\nЯкщо увімкнено, предметам K2 буде додано звуки в оригінальному стилі, а для предметів без відповідного стилю в базовій грі — нові звуки.\nСумісне з K2SE та K2SO; лише звуки предметів SE не входять до виправлення.
k2sfix-entity-sfx-fix=Деякі машини K2 досі використовують типові звуки, хоча в оригінальній серії машин є власні звуки відкриття/закриття меню, а багато з них не мають таких звуків зовсім.\n\nЯкщо увімкнено, більшості машин буде додано власні звуки відкриття/закриття меню. Тут також виправлено ліміт звуків бура K2.
k2sfix-decorative-sfx-fix=Якщо увімкнено, звуки кроків на ворожих декораціях узгоджуватимуться з клітинкою криповини.
k2sfix-disable-idle1=Майже всі машини K2 мають звук простою «idle1». Кількість одночасних накладань цього звуку не обмежена, і він не відповідає стилю відповідної машини базової гри.\n\nЯкщо увімкнено, звуки простою більшості машин буде прибрано, окрім особливих машин, як-от [item=kr-planetary-teleporter].
k2sfix-gas-power-station=[item=kr-gas-power-station] має два звуки роботи, які за тоном поділяються на «звук двигуна» та «клацання». «Звук двигуна» значно гучніший. Типово обидва звуки відтворюються випадково.\n\nЦе налаштування має чотири варіанти, описані в підказках до них.
k2sfix-belt-sound-fix=Звук роботи конвеєра K2 не відповідає його швидкості. Крім того, відповідні підземні конвеєри та розподільники зовсім не мають звуку.\n\nУвімкнення виправляє це: [item=kr-superior-transport-belt][item=kr-superior-underground-belt][item=kr-superior-splitter] отримують нові звуки. Також буде додано звуки роботи завантажувачів.
print-equipment-gantry-warnings=Портал спорядження може попереджати, якщо на вході застряг неприпустимий предмет.
nixie-tube-update-speed-alpha=Скільки літерних ламп Ніксі оновлюється за тік. Більше = швидші оновлення
nixie-tube-update-speed-numeric=Скільки груп цифрових ламп Ніксі оновлюється за тік. Більше = швидші оновлення

