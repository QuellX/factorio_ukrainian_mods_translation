[recipe-description]
electrochemical-science-pack=Сірка, платина й сірчана кислота створюють цей пакет!
platinum-plate=Платинові пластини з ливарні!
platinum-plate-production-alt=Платинові пластини з печі!
catalytic-chemical-plant=Виготовте хімічну установку, що спеціалізується на використанні платини як каталізатора реакцій.
pressurized-acid-neutralization=Вищий тиск на Corrundum дає змогу отримувати ще більше енергії з нейтралізації кислоти.
pressurized-acid-neutralization-alt=Щоб уловити всю вивільнену енергію, потрібно більше води, але для початку це допоможе.
dilute-acid-neutralization=Нейтралізація дає достатньо тепла, щоб кип'ятити воду.
hot-water-to-steam=Ще трохи енергії, щоб перетворити гарячу воду на пару 500 градусів.
petroleum-alkylation=Великі кількості сірчаної кислоти можуть утворювати карбокатіони, на яких ґрунтується алкілування — утворення нових вуглець-вуглецевих зв'язків.
light-oil-alkylation=Великі кількості сірчаної кислоти можуть утворювати карбокатіони, на яких ґрунтується алкілування — утворення нових вуглець-вуглецевих зв'язків. Так ми отримуємо мазут.
sulfur-combustion=Спалюючи сірку, отримуємо цей газ, з якого можна зробити і сірчану кислоту, і воду.
hydrogen-sulfide=З платиновим каталізатором нафтовим газом можна гідрувати сірку й отримати сірководень.
sulfur-reduction=Сірка відновлюється до нульового ступеня окиснення, а утворюється вода.
sulfurous-oxidation=У присутності платинового каталізатора діоксид сірки реагує з киснем, утворюючи на місці триоксид сірки. Потім триоксид сірки реагує з водою й утворює сірчану кислоту.
hydrogen-sulfide-combustion=Спалювання сірководню дає більше компонентів для сірчаної кислоти.
chalcopyrite-refining=Халькопірит — це FeCuS. Ми обробляємо руду жаром і концентрованою сірчаною кислотою, щоб повністю окиснити метали й отримати суміш їхніх водних сульфатних солей.
reactive-displacement=Залізо активніше за мідь. Тож ним можна витісняти іони міді з розчину.
force-reduction-iron=Напругою можна закачувати електрони в іонний розчин. Ці електрони відновлюють водні іони заліза до чистого заліза. Чистий продукт треба знову сформувати в пластини.
force-reduction-copper=Подібно до відновлення сульфату заліза, закачані електрони відновлюють іони міді.
sulfonated-plastic=З платиновим каталізатором з діоксиду сірки й кисню утворюємо триоксид сірки. Триоксид сірки реагує із сірчаною кислотою й утворює олеум, який сульфує вуглеводні.
sulfonated-plastic-production-alt=З платиновим каталізатором з діоксиду сірки й кисню утворюємо триоксид сірки. Триоксид сірки реагує із сірчаною кислотою й утворює олеум, який сульфує вуглеводні.
calcium-sulfate-fish=Маючи джерело азоту й фосфору, додаємо більше вуглецю й сульфату кальцію, щоб оптимізувати виробництво поживних речовин.
calcium-sulfate-bioflux=Маючи джерело азоту й фосфору, додаємо більше вуглецю й сульфату кальцію, щоб оптимізувати виробництво поживних речовин.
calcium-sulfate-egg=Маючи джерело азоту й фосфору, додаємо більше вуглецю й сульфату кальцію, щоб оптимізувати виробництво поживних речовин.
calcium-sulfate=Маючи джерело азоту й фосфору, додаємо більше вуглецю й сульфату кальцію, щоб оптимізувати виробництво поживних речовин.
sulfuric-acid-dilution=Додавайте кислоту у воду, щоб безпечно розвести, а не навпаки.
sulfuric-acid-concentration=Витрачаємо багато енергії, випарюючи воду в пару, яку можна знову сконденсувати у воду.
sulfuric-acid-concentration-alt=Витрачаємо багато енергії, випарюючи воду, і не переймаємося її конденсацією.
calcium-sulfate-production-alt=Діоксид сірки й карбонат кальцію реагують, утворюючи сульфат кальцію й вуглекислий газ.
stone-production=Камінь представлено як SiO2 (реагент) і CaSiO3 (продукт). Аналогічно виробництву каменю на Вулканусі.
asphalt-c=Конденсуємо мазут у попередник бетону.
asphalt-c-alt=Надлишок дизельного пального також можна використати для асфальту. Реакція швидша, але менш ефективна.
concrete-production-from-asphalt=Асфальт і камінь дають бетон.
pressure-lab=Поєднайте хімічну установку, лабораторію й парову турбіну, щоб отримати лабораторію тиску — заради науки!
thruster-fuel-oxidizer-to-steam=Спалюйте паливо прискорювача, щоб отримати пару!
carbon-dioxide-to-carbon=Відновлюйте вуглекислий газ до вуглецю за допомогою заліза.
iron-recrystalization=Розчиняйте непотрібні матеріали, щоб отримати сульфатний розчин.
iron-recrystalization-alt=Розчиняйте непотрібні матеріали, щоб отримати сульфатний розчин.
copper-recrystalization=Розчиняйте непотрібні матеріали, щоб отримати сульфатний розчин.
copper-recrystalization-alt=Розчиняйте непотрібні матеріали, щоб отримати сульфатний розчин.
platinum-thruster=Треба мчати швидко.
iron-stick-recrystalization=Розчиняйте непотрібні матеріали, щоб отримати сульфатний розчин.
controlled-petrol-combustion=Обережно спалюйте нафтовий газ, щоб отримати вуглекислий газ.
calcium-sulfate-recovery=Відновлюйте сульфат кальцію з поживних речовин частими промиваннями, що прибирають неполярні молекули.
destructive-dilute-acid-neutralization=Нагрійте воду й випаріть її.
rocket-fuel-catalytic-chemistry=Той самий рецепт — лише в швидшій машині!
super-saturated-displacement=Повторне пересичення й перекристалізація дають змогу витягти більше міді зі змішаного розчину.
super-saturated-displacement-iron=Пересичене витіснення залізом.
sulfur-poison-capsule=Вдосконалена хімічна зброя.
blue-rocket=Вибуховіша ракета, начинена новою потужною вибухівкою.
sulfuric-oxidizer=Сульфуйте вуглеводневий продукт, щоб він мав багато кисневих груп і міг діяти як окисник у вибухових реакціях.
explosives-from-sulfuric-oxidizer=Пакуйте сірчаний окисник у вибухові заряди.
petrol-dehydrogenation-and-combustion=З платиновим каталізатором можна дегідрувати вуглеводні й отримати алкіни, алкени та водень. Це ендотермічний процес, що потребує високого тиску, тож він триває довго. Після дегідрування ненасичені продукти повністю спалюються до вуглекислого газу.
petrol-dehydrogenation-and-combustion-maraxsis=Ми постачаємо O2!
kinetic-reactive-displacement=Більше заліза — швидша реакція витіснення міді.

