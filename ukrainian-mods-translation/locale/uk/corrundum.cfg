[item-description]
platinum-ore=Благородний метал, корисний для прискорення каталітичних реакцій.
chalcopyrite-ore=Гарна синя руда, що складається з міді й заліза, зв'язаних сіркою. FeCuS.
platinum-plate=Платинова руда, перероблена на пластини.
asphalt-c=Очищений гудрон, з якого можна зробити бетон.
catalytic-chemical-plant=Хімічна установка з платиновими компонентами. Ідеальна для каталізу реакцій і електрохімії.
pressure-lab=Нечестиве дитя кохання лабораторії й хімічної установки. Ця механічна потвора виготовляється під високим тиском і досліджує швидше за звичайну лабораторію — і витрачає лише 35% дослідницьких пакетів. Вона працює на парі під тиском, і високий тиск усередині машини пришвидшує дослідження. Однак вона не приймає дослідницькі пакети звичайної якості — звичайні пакети не витримують тиску в цій машині. Працює на парі!
red-boiler=Котел, що перетворює нафтовий газ на гарячий вуглекислий газ. Оскільки більшість газу вловлюється, забруднення небагато
red-steam-engine=Змінений паровий двигун. Використовує термоелектричний ефект для вироблення енергії. Приймає гарячий вуглекислий газ і виробляє енергію — ціною значного забруднення.
ice-box=Пластмасовий ящик, що зберігає продукти, які псуються, на 50% свіжішими!
dry-ice=Вуглекислий газ, охолоджений до твердого стану.
sulfur-poison-capsule=Отруйна капсула, що спалює сірку на отруйні випари.
sulfuric-oxidizer=Паливо, насичене сульфатними групами, щоб діяти як окисник у вибухових реакціях

