[mod-description]
corrundum=○🌐Цей мод додає Corrundum — планету, зосереджену на хімії сірки.

[space-location-name]
corrundum=Corrundum

[space-location-description]
corrundum=Планета, оповита вуглекислим газом з достатньою кількістю кисню для горіння. Через це тиск і температура тут високі. Неконтрольований парниковий ефект зробив умови суворішими, ніж на Вулканусі, і між брудом і грозами немає жодних ознак життя. Високий тиск утримує зазвичай леткий нафтовий газ у рідкому стані — і його тут дуже багато. Залізо й мідь здебільшого пов'язані разом у халькопіриті. Цікавий метал тут — платина, що слугує каталізатором у вдосконаленій обробці сірки та анодом і катодом в електрохімії. Щоб опанувати цю планету, потрібен цілком унікальний виробничий ланцюжок, зосереджений на сірці.

