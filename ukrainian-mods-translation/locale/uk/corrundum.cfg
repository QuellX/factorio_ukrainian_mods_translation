[technology-description]
planet-discovery-corrundum=Планета, оповита вуглекислим газом з достатньою кількістю кисню для горіння. Через це тиск і температура тут високі. Неконтрольований парниковий ефект зробив умови суворішими, ніж на Вулканусі, і між брудом і грозами немає жодних ознак життя. Високий тиск утримує зазвичай леткий нафтовий газ у рідкому стані — і його тут дуже багато. Залізо й мідь здебільшого пов'язані разом у халькопіриті. Цікавий метал тут — платина, що слугує каталізатором у вдосконаленій обробці сірки та анодом і катодом в електрохімії. Щоб опанувати цю планету, потрібен цілком унікальний виробничий ланцюжок, зосереджений на сірці.
platinum-processing=Переробляйте платинову руду на бруски.
catalytic-chemical-plant=Виготовте хімічну установку, що використовує платину як каталізатор і як анод/катод в електрохімії.
electrochemical-science-pack=Виготовляйте електрохімічний дослідницький пакет.
sulfur-redox1=Виробляйте сірководень.
sulfur-redox2=Виробляйте сірку й сірководень.
sulfur-redox3=Виробляйте сірчану кислоту з діоксиду сірки й води.
sulfate-processing-1=Перетворюйте надлишок сірководню на діоксид сірки.
sulfate-processing-2=Перетворюйте халькопірит на придатні матеріали.
sulfur-dilution-concentration=Концентруйте й розводьте сірчану кислоту.
sulfonated-plastic=Виготовляйте пластмасу з олеуму й джерела вуглецю.
calcium-sulfate=Виготовляйте сульфат кальцію.
calcium-sulfate-nutrients=Виготовляйте більше поживних речовин.
stone-production=Виготовляйте камінь.
asphalt-and-concrete=Асфальт і бетон.
pressure-lab=Створіть швидку дослідницьку лабораторію, що використовує дослідницькі пакети незвичайної якості й вище. Звичайні дослідницькі пакети всередині машини витрачаються кожні 0,75 секунди, поки вона працює.
space-steam-production=Використовуйте паливо й окисник прискорювача для керованого горіння, що перетворює воду на пару.
dry-ice=Охолоджуйте вуглекислий газ до твердого стану — сухого льоду. Сухий лід у холодильному ящику зберігає біофлюкс, яйця й сільськогосподарську науку на рівні 50% псування. Працює лише в холодильному ящику.
recrystalization=Розчиняйте надлишок пластин у розчині, щоб потім перекристалізувати його в руди.
platinum-thruster=Створіть прискорювач, що витримує жар від споживання неймовірних об'ємів рідини.
calcium-sulfate-recovery=Відновлюйте сульфат кальцію з надлишку поживних речовин. Спершу використовуємо дизельне пальне як органічну фазу, а воду — як водну фазу в ділильній лійці. З часом іони з поживних речовин дифундують у водну фазу, а шар пального містить увесь органічний матеріал. Потім сірчаною кислотою осаджуємо сульфат кальцію з розчину й ще трохи води використовуємо для перекристалізації, щоб очистити кристали сульфату кальцію.
rocket-fuel-catalysis-productivity=Збільшує вихід ракетного палива на каталітичній хімічній установці (дизельне пальне + паливо). Не впливає на інші способи виробництва ракетного палива.
blue-rocket=Сірчаною кислотою насичуйте тверде паливо сульфатними групами, щоб воно могло слугувати компактним окисником для ракет.
chalcopyrite-processing=Переробляйте халькопірит на залізо й мідь.
sulfur-poison-capsule=Вдосконалена фумігація кусак.
petrol-dehydrogenation-and-combustion=Дегідруйте вуглеводні з утворенням подвійних зв'язків, щоб отримати H2. Потім спаліть продукт, щоб отримати CO2.

