[mod-setting-description]
automatically-populate-pressure-lab=Якщо ввімкнено, data.raw["lab"]["pressure-lab"].inputs ДОРІВНЮЄ data.raw['lab']['lab'].inputs
automatically-populate-labs-with-electrochemical-science=Чи проходити по кожній лабораторії й додавати електрохімічну науку до її входів.
ignore-everything-brute-force-science-into-pressure-lab=Наприкінці data-updates входи лабораторії тиску очищаються. Потім до неї додається вся наука з підгрупою дослідницьких пакетів. Це зламає науку, яку має використовувати лише одна лабораторія, але гарантує сумісність. Набридла помилка "жодна лабораторія не приймає всю науку".
require-vulcanus-before-corrundum=Якщо ввімкнено, для відкриття Corrundum доведеться використовувати металургійну науку.
force-reduction-requires-plates=Якщо ввімкнено, рецепти force-reduction-iron і force-reduction-copper отримують на виході залізні й мідні пластини відповідно та повертають одну додаткову руду. Рецепт змінено, бо здавалося, що надто легко отримувати легендарні предмети, а змусити вас використовувати звичайну якість неможливо. Легендарна залізна пластина дала б змогу повернути 3 легендарні залізні руди із сульфатного розчину...
maraxsis-bonus-content=Якщо ввімкнено й установлено Maraxsis, стануть доступні 1 нова технологія й 2 нові рецепти.
consider-planetslib=Якщо ввімкнено й установлено мод planetslib, входи лабораторій не змінюються й електрохімічна наука не додається до всіх лабораторій. Використовуйте, якщо хочете, щоб сумісністю науки займався planetslib.
