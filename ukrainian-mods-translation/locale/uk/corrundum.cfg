[mod-setting-name]
automatically-populate-pressure-lab=Автоматично додавати науку до лабораторії тиску.
automatically-populate-labs-with-electrochemical-science=Автоматично додавати електрохімічну науку до всіх лабораторій.
consider-planetslib=Враховувати Planetslib.
ignore-everything-brute-force-science-into-pressure-lab=Ігнорувати всі інші налаштування й моди та додати всю науку до лабораторії тиску.
require-vulcanus-before-corrundum=Вимагати Вулканус перед Corrundum.
force-reduction-requires-plates=Рецепти примусового відновлення сульфатних розчинів потребують відповідних пластин.
maraxsis-bonus-content=Бонусний вміст для Maraxsis.

