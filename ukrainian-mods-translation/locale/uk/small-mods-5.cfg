[string-mod-setting-description]
discovery-tree-mode-none=Показувати всі технології незалежно від передумов.
discovery-tree-mode-3-layers=Показувати технологію, коли досліджено хоча б одну передумову передумови її передумови.
discovery-tree-mode-2-layers=Показувати технологію, коли досліджено хоча б одну передумову її передумови.
discovery-tree-mode-single=Показувати технологію, коли досліджено хоча б одну передумову.
discovery-tree-mode-half=Показувати технологію, коли досліджено хоча б половину її передумов.
discovery-tree-mode-almost-all=Показувати технологію, коли досліджено всі передумови, крім однієї.
discovery-tree-mode-all=Показувати технологію, лише коли досліджено всі її передумови.
discovery-tree-consider-researched-researched=Дослідженими вважаються лише досліджені (зелені) технології.
discovery-tree-consider-researched-queued=Також вважати дослідженими технології в черзі.
discovery-tree-consider-researched-available=Також вважати дослідженими доступні технології (усі передумови досліджено, жовті).
discovery-tree-consider-researched-available-after-queue=Додатково вважати дослідженими технології, що стануть доступні після завершення черги (помаранчеві).

