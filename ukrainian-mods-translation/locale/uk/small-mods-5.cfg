[mod-setting-description]
science-tab-always-move-labs=Мод робить це, коли у вас 10 лабораторій; це налаштування змушує завжди переносити лабораторії.
big-accumulator-multiplier-percent=Задає співвідношення (у %) місткості до площі великих акумуляторів порівняно зі звичайними.\nТипово: 600, старе значення: 1500, від 100 до 4000.
big-solar-panel-multiplier-percent=Задає співвідношення (у %) потужності до площі великих сонячних панелей порівняно зі звичайними.\nТипово: 400, старе значення: 666, від 100 до 2000.
wood-walls-fuelvalue=Скільки МДж енергії дає дерев'яна стіна
wood-walls-wall-cost=Скільки деревини потрібно на рецепт стіни
wood-walls-wall-output=Скільки стін дає рецепт
wood-walls-disable-wall=Прибирає рецепт дерев'яних стін (дерев'яні підлоги ставити все одно можна)
wood-walls-hp=Скільки здоров'я мають дерев'яні стіни
nixie-tube-group-updates-per-tick=Максимальна кількість груп __ENTITY__nixie-tube__, що оновлюються за тік. Більше число оновлює індикатори швидше, але більше навантажує систему.
nixie-tube-enable-overflow-notation=Якщо число має більше цифр, ніж може показати група індикаторів, показувати дев'ятки замість обрізання перших цифр (напр., 1024 на трьох індикаторах стане 999, а не 024). Трохи впливає на продуктивність.
moshine_heat_intensity=Кількість спеки (%) на Moshine (від 0 до 10000, типово 100)
moshine_heat_damage_amount=Скільки шкоди (%) спека Moshine завдає вашим машинам (від 0 до 10000, типово 100)
discovery-tree-consider-researched=Використовується логікою приховування технологій вище. Зверніть увагу: в одиночній грі потрібно знову відкрити дерево технологій, щоб побачити зміни відповідно до поточної черги досліджень.
throttling=Для значення N ділить зону пошуку кожного гравця на (N*2)^2 частин. Зменшення числа покращує чутливість, збільшення — зменшує навантаження на процесор.
drone_process_other_player_deconstruction=Дозволити дронам виконувати завдання демонтажу інших гравців
drone_process_other_player_construction=Дозволити дронам виконувати будівельні завдання інших гравців
drone_process_other_player_upgrade=Дозволити дронам виконувати будівельні завдання інших гравців
drone_process_other_player_proxies=Дозволити дронам виконувати проміжні завдання інших гравців (модулі, логістичні запити тощо)
construction-drone-search-radius=Радіус пошуку доступних завдань (в одиницях).
force-player-position-search=Прив'язати зону пошуку до персонажа гравця: дрони не працюватимуть віддалено, якщо завдання не в радіусі пошуку гравця
remote-view-spawn=Дозволити дронам вилітати з віддаленого огляду (не працює між поверхнями). УВАГА: дрони іноді застрягають, повертаючись до гравця
drone-chain-search-radius=Після демонтажу дрони шукатимуть у цьому радіусі (у клітинках) найближчі привиди, які можуть одразу збудувати з предметів, що несуть. 0 — вимкнути ланцюжки завдань.
better-aquilo-tech=Підвищує вартість деяких технологій Аквіло
better-aquilo-fluoroketone=Додає в рецепт дизельне пальне
better-aquilo-fluoroketone-cooling=Додає в рецепт лід
better-aquilo-cryo-plant=Підвищує вартість рецепта
better-aquilo-quantum-processor=Підвищує і вартість, і вихід та замінює надпровідник модулем якості
better-aquilo-quantum-processor-speed=Для виготовлення квантового процесора потрібна точність, тож модулі не можуть його пришвидшити
better-aquilo-fusion-cell=Додає в рецепт квантовий процесор, подвоює вихід і робить гольмій каталізатором
better-aquilo-ice-plateform-in-pack=Замінює лід льодовою платформою (1 на 4 пакети). Лід і аміак нескінченні, тож це налаштування головно ускладнює їхнє виробництво у великих кількостях
better-aquilo-rail-support=З міркувань здорового глузду :)
better-aquilo-roboport-heat-multiplier=Множить ванільне споживання тепла (300 кВт). Типово: x5
better-aquilo-lithium-accumulator=Додає на виході гарячий фторований кетон

