[technology-description]
snouz_better_asteroid_collector=Збирач астероїдів MK2 значно швидший, має більший радіус і вдвічі більше маніпуляторів.
snouz_better_substation_tech=Ця вдосконалена підстанція може під'єднати до електромережі більшу територію.
snouz_long_electric_gun_turret=Кулеметна турель з подвійною дальністю й швидкістю, але потребує електроенергії й має вужче поле зору.
snouz_wall_hull=Надзвичайно стійкі до астероїдів стіни.
electric-energy-big-accumulators=Ці надефективні акумулятори зберігають у 24 рази більше енергії, ніж звичайні, займаючи вчетверо більше місця.
big-solar-energy=Ці надефективні сонячні панелі виробляють у 36 разів більше енергії, ніж звичайні, займаючи вдев'ятеро більшу площу.
thinking-brain-technology=Надзвичайно ефективне складання певних типів предметів.
classic-nixie-tubes=Класичні газорозрядні індикатори для показу значень сигналів логічної мережі. Їх можна з'єднувати в ланцюжок для показу більших значень.
reinforced-nixie-tubes=Посилені й малі посилені газорозрядні індикатори для показу значень сигналів логічної мережі. Їх можна з'єднувати в ланцюжок для показу більших значень.
sun_heat_cooler_1_tech=Захищає електронні машини від сильної спеки.
sun_heat_cooler_2_tech=Захищає електронні машини від сильної спеки. Має значно більший радіус і перетворює частину тепла на електроенергію.
spectral-drones=Вдосконалює всі дрони до «спектрального» варіанта, що проходить крізь усі об'єкти, крім непрохідних клітинок

