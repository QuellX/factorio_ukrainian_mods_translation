[mod-setting-description]
vp-scale-nauvis-size=Розмір планети Наувіс. Використовується як еталон для масштабування інших планет залежно від їхньої гравітації. Збільште значення, якщо хочете, щоб планети здавалися більшими або ближчими до космічних кораблів.
vp-scale-min=Мінімальний множник масштабу відносно Наувіса для планети з дуже слабкою гравітацією.
vp-scale-max=Максимальний множник масштабу відносно Наувіса для планети з дуже сильною гравітацією.
vp-scale-enable-rotation-multiplier=Увімкнути корекцію швидкості обертання залежно від тривалості циклу дня і ночі планети відносно циклу Наувіса. Коротший цикл — швидше обертання, довший — повільніше.
reskins-lib-customize-tier-colors=[img=utility.warning_icon] Власні кольори активно використовують шари спрайтів для предметів і об'єктів, що значно збільшує кількість спрайтів на екрані. Це може негативно вплинути на продуктивність.\n\nУвімкнути налаштування кольорів рівнів, вибраних у палітрах нижче.
solar-matrix-color=Змінює колірну маску (білі ділянки), а не саму панель
solar-matrix-power=Змінює вихідну потужність панелі в кВт: мін. 64 — макс. 6400
link-multiplier-to-cost=Множить вартість рецепта залежно від вихідної потужності; також впливає на Accumulator V2
bobmods-ores-startinggroundwater=Додає родовище ґрунтових вод у початкову область
bobmods-ores-enablewaterores=Включає ґрунтові води та літієву воду
enable-tree-condensing-water=Збір [entity=tree-plant] конденсує 2000 [fluid=water] (153,3/сек)
enable-jellynut-condensing-lubricant=Збір [entity=jellystem] конденсує 420 [fluid=lubricant] (32,2/сек)
enable-yumako-condensing-steam=Збір [entity=yumako-tree] конденсує 810 [fluid=steam] за 165 °C (62,1/сек)
spidertron-enhancements-spiderton-requires-fuel=«Типово» означає, що значення не змінюватиметься щодо заданого ванільною грою або іншим модом.
fh-set-filter-on-inserter=Вмикає прапорець «Використовувати фільтри» під час встановлення фільтра маніпулятору
fh-default-item-on-splitter=Назва предмета, що завжди показуватиметься на розподільниках, напр. deconstruction-planner. Залиште порожнім, щоб вимкнути.
fh-add-fuel-items=Додає сумісне паливо та продукти його спалення, навіть якщо їх немає серед входів і виходів
fh-show-only-unlocked-qualities=Виробник з модулями якості не показуватиме у фільтрах результатів рівні якості, які ще не досліджено
reskins-bobs-do-bobelectronics-colored-circuits=Перефарбовує схеми, додані Bob's Electronics, відповідно до поточної схеми кольорів рівнів.
reskins-bobs-flip-bulk-inserter-icons=Коли увімкнено Bob's Inserter Overhaul, віддзеркалює значки об'ємних маніпуляторів горизонтально для кращого контрасту зі звичайними маніпуляторами.
reskins-bobs-do-inserter-tier-labeling=Коли увімкнено позначки рівнів, також показує їх на маніпуляторах, доданих Bob's Logistics.
reskins-bobs-do-basic-belts-separately=Увімкнути налаштування кольору базових конвеєрів, вибраного в палітрі нижче.
reskins-bobs-do-custom-furnace-variants=Увімкнути налаштування кольорів різних підтипів печей, вибраних у палітрах нижче.
valves-default-threshold-top_up=Типовий поріг під час розміщення нового клапана. Його можна змінити після розміщення.
valves-default-threshold-overflow=Типовий поріг під час розміщення нового клапана. Його можна змінити після розміщення.

