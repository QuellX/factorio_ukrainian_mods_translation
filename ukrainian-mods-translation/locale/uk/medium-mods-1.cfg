[entity-description]
solar-matrix-remnants=Уламки сонячної матриці
bob-heat-pipe=Теплова труба може передавати тепло на великі відстані та з'єднувати пристрої, що виробляють і споживають тепло.\nМакс. температура __1__°C.
bob-reactor-max-temperature=\nМакс. температура __1__°C.
bob-oil-boiler=Спалює рідке паливо, перетворюючи воду на пару.
steam-turbine=Споживає пару для вироблення електроенергії. Має підвищений пріоритет в електромережі.
condensing-agricultural-tower=Висаджує насіння та збирає врожай, під час кожного збору конденсуючи рідину й зберігаючи її у внутрішньому резервуарі. Коли резервуар заповнено, надлишок не зберігається. Докладніше — у факторіопедії.
hidden-condensing-agricultural-tower-tank=Зберігає до 30 тис. одиниць рідини, отриманої під час збору врожаю.
nuclear-reactor=Використовує ядерні паливні елементи для виробництва тепла. Вихід тепла зростає, якщо поруч побудовано інші реактори.
bob-uranium-reactor=Використовує уранові та плутонієві паливні елементи для виробництва тепла. Вихід тепла зростає, якщо поруч побудовано інші реактори.
bob-thorium-reactor=Використовує торієві паливні елементи для виробництва тепла. Вихід тепла зростає, якщо поруч побудовано інші реактори.
bob-deuterium-reactor=Використовує дейтерієві паливні елементи для виробництва тепла. Вихід тепла зростає, якщо поруч побудовано інші реактори.

