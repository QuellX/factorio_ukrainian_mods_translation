[mod-setting-description]
rampantFixed--spaceAge-AddDemolisherScalesContent=Годування спустошувачів дозволить отримувати предмети, корисні наприкінці гри
rampantFixed--allowExternalControl=Дозволити іншим модам не лише читати дані Rampant, а й змінювати їх. Застаріле. Починаючи з версії 1.8.3, зовнішнє керування дозволене завжди.
rampantFixed--unitAndSpawnerFadeTime=Скільки секунд лишаються трупи кусак
rampantFixed--oldRedEnemyMapColor=Повертає ванільний колір ворогів на мапі
rampantFixed--unitSpawnerBreath=Лігва тепер дихають повітрям, тож на них діють, наприклад, капсули з отрутою
rampantFixed--attackWaveGenerationThresholdMax=Загальний рахунок, якого має досягти чанк, щоб з'явилася хвиля атаки. НЕ впливає на ванільні хвилі кусак. Лінійно масштабується з фактором еволюції (початковий поріг за еволюції 0.0)
rampantFixed--attackWaveGenerationThresholdMin=Загальний рахунок, якого має досягти чанк, щоб з'явилася хвиля атаки. НЕ впливає на ванільні хвилі кусак. Лінійно масштабується з фактором еволюції (кінцевий поріг за еволюції 100.0)
rampantFixed--attackWaveMaxSize=Щоб змінити масштабування хвилі атаки з еволюцією, доведеться змінити config.lua в zip-файлі.
rampantFixed--attackWaveMaxSizeEvoPercent=Якщо хочете отримати атаку максимального розміру раніше, вкажіть потрібний відсоток
rampantFixed--agressiveStart=Розмір загону й частота атак рахуватимуться щонайменше від 30% еволюції. Цього рівня буде досягнуто за 1 годину від початку гри
rampantFixed--safeBuildings=Має бути увімкнено, щоб працювали налаштування «безпеки» нижче. Раніше збудовані об'єкти можуть бути знищені, але відновляться автоматично й стануть невразливими
rampantFixed--safeBuildings-straightRail=Захистити рейки й пов'язану інфраструктуру від кусак
rampantFixed--safeBuildings-bigElectricPole=Захистити великі опори ЛЕП від кусак
rampantFixed--safeBuildings-lamps=Захистити ліхтарі від кусак
rampantFixed--safeBuildings-trainStops=Захистити зупинки потягів від кусак
rampantFixed--permanentNocturnal=Якщо увімкнено, хвилі атак Rampant з'являтимуться вночі. Краще працює з модом Clockwork або модом, що подовжує ніч.
rampantFixed--allowDaytimePlayerHunting=Дозволяє кусакам полювати на гравця будь-коли
rampantFixed--allowDaytimeNonRampantActions=Дозволяє будь-коли стандартні атаки через забруднення, розселення та атаки інших модів
rampantFixed--aiPointsScaler=Від 0.0 до 100.0. Визначає, скільки очок дій ШІ отримує за логічний цикл для дій на кшталт створення хвиль атак. 0.3 — дуже легко, 0.75 — легко, 1.0 — середньо, 1.25+ — складно
rampantFixed--aiDifficulty=Складно — типовий рівень. Легко — для комфортнішої гри. Реакція на дії гравця слабша, атаки рідші
rampantFixed--aiPointsPrintSpendingToChat=Виводити повідомлення в чат щоразу, коли Rampant витрачає очки. Містить GPS-координати. Для найскладнішої гри з Rampant залиште вимкненим. Увага: під час жарких боїв може швидко заповнити чат!
rampantFixed--aiPointsPrintGainsToChat=Виводити повідомлення в чат щоразу, коли Rampant отримує очки. Пасивне нарахування очок не показується. Для найскладнішої гри з Rampant залиште вимкненим. Увага: під час жарких боїв може швидко заповнити чат!
rampantFixed--addWallResistanceAcid=Якщо увімкнено, усім стінам буде додано 60% стійкості до кислоти, 75% до отрути та зменшення вибухової шкоди на 30.
rampantFixed--fireproofMines=Встановити стійкість стандартних мін до вогню на 100%
rampantFixed--removeBloodParticles=Частинки крові, що з'являються під час вбивства кусак, можуть спричиняти падіння UPS; це налаштування їх прибирає.
rampantFixed--fireSafety-flamethrower=Ручні вогнемети не спричиняють пожеж, натомість завдаючи прямої шкоди по площі. Значно зменшує підвисання, коли поруч багато кусак
rampantFixed--flamethrowerTurretsRebalance=Зменшує швидкість атаки, зберігаючи загальну шкоду. Для вогнемета Rampant Arsenal прибирає дуже значні підвисання
rampantFixed--rampantArsenalRebalance=Шкода від кислотних і отруйних ефектів завдаватиметься рідше, але сильніше. Значно зменшує підвисання наприкінці гри при використанні отрути й кислоти
rampantFixed--enableSwarm=Зменшує розмір маски зіткнень істот, завдяки чому менше зіткнень під час пошуку шляху й атаки плавніші
rampantFixed--attack-warning=Показує повідомлення, що попереджає гравців про наближення хвилі атаки
rampantFixed--newEnemies=Додає нових ворогів, розкиданих по світу. Це збільшує вимоги до оперативної пам'яті. З 1 варіацією кожного кусаки, черв'яка й лігва та 5 рівнями очікуйте до +2 ГБ ОЗП. З 20 варіаціями й 10 рівнями — до +9 ГБ. Варіації додають випадковості кожному рівню кусак, черв'яків чи лігв. Рівні — це сила кусак.
rampantFixed--allowOtherEnemies=Лише в новій грі або на мапі без Rampant. Обмежує розміщення <нових ворогів>, лишаючи місце для ворогів інших модів. Якщо вимкнено, лігва інших модів зрідка трапляються у випадкових місцях, а стандартні замінюються <новими ворогами>
rampantFixed--newEnemiesSide=Лише в новій грі або на мапі без Rampant. Нові фракції з'являтимуться лише з указаного боку, якщо увімкнено налаштування <дозволити інших ворогів>
rampantFixed--newEnemyVariations=Лише для сумісності з Rampant. Усі нові об'єкти будуть такими, ніби кількість варіантів дорівнює 1
rampantFixed--tierStart=Рівень здоров'я ворога за 0% еволюції. Приблизне здоров'я за рівнями: (1-15,2-75,3-150,4-250,5-1000,6-2000,7-3500,8-7500,9-15000,10-30000). Мін. 1, макс. 10
rampantFixed--tierEnd=Кінцевий рівень здоров'я ворога за 100% еволюції. Приблизне здоров'я за рівнями: (1-15,2-75,3-150,4-250,5-1000,6-2000,7-3500,8-7500,9-15000,10-30000). Мін. 1, макс. 10, рекомендовано = 5 (трохи слабші за звичайних кусак)
rampantFixed--allowLongRangeImmunity=Деякі фракції не можна вбити здалеку. Вогняна й кислотна шкода ігнорують цей імунітет. Вимкнення може зробити ці фракції надто слабкими
rampantFixed--longRangeImmunity_efficiency=100% — імунітет до шкоди з дальності N+. 10% — отримуватиме 90% шкоди
rampantFixed--allowOneshotProtection=Деяких фракцій не вбити одним влучанням. Вогняна й кислотна шкода ігнорують цей захист. Вимкнення може зробити ці фракції надто слабкими
rampantFixed--oneshotProtection_efficiency=100% — отримана шкода не може перевищити поріг надмірної шкоди. 10% — надмірна шкода зменшується на 10%
rampantFixed--buildingsImmuneToElectic=Лігва й черв'яки не отримують електричної шкоди
rampantFixed--enableMigration=ШІ почне захоплювати всю мапу. Враховує налаштування мапи щодо розповсюдження кусак. (Обережно! Це складний режим!)
rampantFixed--printAIStateChanges=Виводить у чат гри інформацію про стан ШІ Rampant. Повідомлення показуються для кожної поверхні. Для найскладнішої гри з Rampant вимкніть.
rampantFixed--debugTemperament=Виводить у чат інформацію про темперамент ШІ, що визначає зміни стану ШІ. Для налагодження.
rampantFixed--max-evo-dist=Що більше значення, то далі від центру з'являються сильні фракції
rampantFixed--enableShrinkNestsAndWorms=Зменшує розмір зони зіткнення лігв і черв'яків на 50%. Об'єкти можуть перекриватися, бо зона зіткнення менша за графіку.
rampantFixed--attackWaveGenerationUsePlayerProximity=Враховувати кількість феромонів гравця в порозі для чанків з лігвами, що створюватимуть хвилю атаки Rampant. НЕ впливає на ванільні хвилі кусак
rampantFixed--attackPlayerThreshold=Рахунок, якого має досягти чанк, щоб впливати на поріг атаки. Збільшення зменшує вплив хмари феромонів гравця.
rampantFixed--unkillableLogisticRobots=Логістичні роботи стануть невразливими до будь-якої шкоди
rampantFixed--unkillableConstructionRobots=Будівельні роботи стануть невразливими до будь-якої шкоди
rampantFixed--unitBiterHealthScaler=Масштабує у відсотках здоров'я всіх нових ворожих кусак
rampantFixed--unitBiterSpeedScaler=Масштабує у відсотках швидкість усіх нових ворожих кусак
rampantFixed--unitBiterDamageScaler=Масштабує у відсотках шкоду всіх нових ворожих кусак
rampantFixed--unitBiterRangeScaler=Масштабує у відсотках дальність атаки всіх нових ворожих кусак
rampantFixed--unitBiterHealingScaler=Масштабує у відсотках лікування всіх нових ворожих кусак
rampantFixed--unitSpitterHealthScaler=Масштабує у відсотках здоров'я всіх нових ворожих плювак
rampantFixed--unitSpitterSpeedScaler=Масштабує у відсотках швидкість усіх нових ворожих плювак
rampantFixed--unitSpitterDamageScaler=Масштабує у відсотках шкоду всіх нових ворожих плювак
rampantFixed--unitSpitterRangeScaler=Масштабує у відсотках дальність усіх нових ворожих плювак
rampantFixed--unitSpitterHealingScaler=Масштабує у відсотках лікування всіх нових ворожих плювак
rampantFixed--unitDroneHealthScaler=Масштабує у відсотках здоров'я всіх нових ворожих дронів. Дрони походять від породжувальної та осиної фракцій
rampantFixed--unitDroneSpeedScaler=Масштабує у відсотках швидкість усіх нових ворожих дронів. Дрони походять від породжувальної та осиної фракцій
rampantFixed--unitDroneDamageScaler=Масштабує у відсотках шкоду всіх нових ворожих дронів. Дрони походять від породжувальної та осиної фракцій
rampantFixed--unitDroneRangeScaler=Масштабує у відсотках дальність усіх нових ворожих дронів. Дрони походять від породжувальної та осиної фракцій
rampantFixed--unitDroneHealingScaler=Масштабує у відсотках лікування всіх нових ворожих дронів. Дрони походять від породжувальної та осиної фракцій
rampantFixed--unitWormHealthScaler=Масштабує у відсотках здоров'я всіх нових ворожих черв'яків
rampantFixed--unitWormDamageScaler=Масштабує у відсотках шкоду всіх нових ворожих черв'яків
rampantFixed--unitWormRangeScaler=Масштабує у відсотках дальність усіх нових ворожих черв'яків
rampantFixed--unitWormHealingScaler=Масштабує у відсотках лікування всіх нових ворожих черв'яків
rampantFixed--unitSpawnerHealthScaler=Масштабує у відсотках здоров'я всіх нових ворожих лігв
rampantFixed--unitSpawnerOwnedScaler=Масштабує у відсотках максимальну кількість істот, якими керує кожне нове вороже лігво
rampantFixed--unitSpawnerSpawnScaler=Масштабує у відсотках кількість істот, що одночасно з'являються в усіх нових ворожих лігвах
rampantFixed--unitSpawnerRespawnScaler=Масштабує у відсотках час появи нових істот у всіх нових ворожих лігвах
rampantFixed--unitSpawnerHealingScaler=Масштабує у відсотках лікування всіх нових ворожих лігв
rampantFixed--unitHiveHealthScaler=Масштабує у відсотках здоров'я всіх нових ворожих вуликів
rampantFixed--unitHiveHealingScaler=Масштабує у відсотках лікування всіх нових ворожих вуликів
rampantFixed--unitHiveRespawnScaler=Масштабує у відсотках час появи нових істот у всіх нових ворожих вуликах
rampantFixed--raidAIToggle=Вмикає рейдові загони ШІ з віддалених лігв
rampantFixed--siegeAIToggle=Вмикає облогові загони ШІ, що селитимуться біля гравця
rampantFixed--siegeMinDistance=Облоги не можуть селитися ближче за вказану кількість чанків від військових будівель
rampantFixed--undergroundAttack=Деякі атаки діставатимуться цілі під землею. Вони віддають перевагу звичайним шляхам, але за потреби пройдуть під будь-якою поверхнею. Видно на мапі. Можуть бути перехоплені турелями. Також під час артилерійського обстрілу загін закопується й продовжує атаку під землею. Не може перетнути непрохідну місцевість ширше 2 чанків, окрім відповіді на артилерійський вогонь
rampantFixed--undergroundAttackProbability=Імовірність залежить від еволюції. Не впливає на закопування під час артилерійського обстрілу
rampantFixed--demolisherAttack_AdditionalTime=Ці хвилини додаються до розрахованого стандартного інтервалу
rampantFixed--laserEnemy=Лазерна фракція кусак: висока стійкість до лазера, помірна до електрики. Має кусак і плювак. Захист від надмірної шкоди 1.5 (~80% макс. здоров'я)
rampantFixed--waspEnemy=Осина фракція кусак: лише плюваки, кожна випльовує малих дронів.
rampantFixed--spawnerEnemy=Породжувальна фракція кусак: лише плюваки, яких породжують лігва, а плюваки відкладають яйця, з яких вилуплюються кусаки. Імунітет до атак здалеку (30+)
rampantFixed--trollEnemy=Регенеративна фракція кусак: висока регенерація здоров'я, лікує союзників після смерті, сильна вразливість до вогню, помірна стійкість до фізичної шкоди, висока стійкість до вибухів. Захист від надмірної шкоди 5 (20% макс. здоров'я)
rampantFixed--fastEnemy=Швидка фракція кусак: висока швидкість руху, помірна стійкість до вибухів. Захист від надмірної шкоди 4 (25% макс. здоров'я), імунітет до атак здалеку (20+)
rampantFixed--infernoEnemy=Пекельна фракція кусак: лише плюваки, що плюються палаючою кислотою, яка спалює все. Надзвичайна стійкість до кислоти й вогню, помірна вразливість до отрути. Сильна вразливість до лазера
rampantFixed--nuclearEnemy=Ядерна фракція кусак: лише кусаки, що вибухають, як ядерна бомба. Висока стійкість до кислоти й вогню. Сильна вразливість до вибухів. Швидкі, мало здоров'я, захист від надмірної шкоди 5 (20% макс. здоров'я)
rampantFixed--electricEnemy=Електрична фракція кусак: лише кусаки з ближньою атакою, що вражає кілька об'єктів на лінії. Висока стійкість до електрики, помірна до лазера.
rampantFixed--fireEnemy=Вогняна фракція кусак: висока стійкість до кислоти. Імунітет до вогню. Вразливість до лазера. Атака струменем вогню.
rampantFixed--ArachnidsEnemy=Вразливі до фізичної шкоди (x2). Після смерті лишають яйця, з яких за 5 секунд вилуплюється новий кусака. Яйця вразливі до фізичної шкоди. Завдання фракції — змусити гравця витрачати боєприпаси.
rampantFixed--suicideEnemy=Фракція кусак-камікадзе: лише кусаки, що вибухають під час атаки. Помірна стійкість до отрути й вогню, сильна вразливість до вибухів. Швидкі, мало здоров'я, захист від надмірної шкоди 4 (25% макс. здоров'я), імунітет до атак здалеку (18+)
rampantFixed--physicalEnemy=Броньована фракція кусак: лише кусаки. Висока стійкість до фізичної шкоди та вибухів, помірна до вогню. Помірна вразливість до електрики й лазера. Захист від надмірної шкоди 2 (50% макс. здоров'я)
rampantFixed--acidEnemy=Кислотна фракція кусак: імунітет до кислоти, помірна стійкість до отрути.
rampantFixed--energyThiefEnemy=Фракція кусак-саперів: висока стійкість до електрики, помірна до лазера. Знищення будівель під живленням створює енерговисмоктувальні кристали.
rampantFixed--poisonEnemy=Отруйна фракція кусак: лише кусаки. Після смерті створюють хмару, що лікує кусак і шкодить об'єктам гравця. Висока стійкість до отрути, помірна до вогню. Помірна вразливість до лазера й електрики.
rampantFixed--JuggernautEnemy=Повільні великі кусаки з надзвичайною стійкістю до фізичної шкоди, кислоти й вогню. Після смерті створюють хмару, що лікує кусак і шкодить об'єктам гравця. Лікують союзників під час атаки. Це перевірка шкоди за секунду вашої лазерної оборони
rampantFixed--disableCollidingProjectiles=Снаряди кусак більше не стикаються з іншими кусаками, черв'яками чи лігвами. Усе інше й далі стикається зі снарядами кусак.
rampantFixed--enableFullMapScan=Мапа гри поволі скануватиметься на об'єкти, створені чи знищені поза системою подій Factorio. (Якщо мод не використовує script_raised_built чи script_raised_destroyed, завдяки цьому Rampant рано чи пізно узгодиться з мапою гри)
rampantFixed--enableFadeTime=Увімкнути час зникнення, щоб зменшити чи збільшити час зникнення трупів кусак, плювак, черв'яків, лігв і вуликів. Якщо вимкнено, час зникнення трупів не змінюється.
rampantFixed--maxNumberOfBuilders=Більше поселенців потребує більше UPS.
rampantFixed--maxNumberOfSquads=Більше загонів потребує більше UPS.
rampantFixed--vengenceProbabilityPercent=Типово = 0.04. Змінює імовірність утворення загонів помсти після кожної смерті кусаки.
rampantFixed--chainVengenceCoefficient=Типово = 0.6. Імовірність кожного наступного загону помсти множиться на цей коефіцієнт. Нові агресивні дії гравця миттєво повертають імовірність до початкової. Стандартні атаки підвищують її поступово. За надлишку очок дій ШІ ефект удвічі слабший
rampantFixed--showAdminMenu=Одиночна гра або гравець-адміністратор. Додає кнопку вгорі екрана. Її меню дозволяє замінити ворогів на стандартних, а також указати, які поверхні/планети ігнорувати
rampantFixed--showSquadAlert=Показувати сповіщення про загони ШІ Rampant
rampantFixed--showExpansionAlert=Показувати сповіщення, якщо ШІ Rampant збудував ворожу базу в розвіданому чанку
rampantFixed--showDemolisherFeedingMessage=Повідомлення показуватиме час наступної атаки та скільки ще ракет подіє під час цієї атаки. Якщо годування автоматизоване, можна вимкнути, щоб не відволікатися

[description]
rampantFixed--EnemySettings1_1_9=Rampant Fixed: з версії 1.1.9 доступне змішане розселення ворогів Rampant та інших (див. налаштування запуску). Лише в новій грі.
rampantFixed--EnemySettings1_1_10=Rampant Fixed: з версії 1.1.10 лігва нових ворогів можна замінити стандартними. Це корисно, якщо хочете продовжити гру без нових ворогів або видалити мод, не втративши лігв (налаштування гравця — «Показати діалог вимкнення нових ворогів»). Лише одиночна гра або гравці-«адміністратори»
rampantFixed--enableShootingAlerts=Rampant Fixed: рекомендуємо знайти спосіб увімкнути сповіщення про стрільбу турелей. Інакше ви ризикуєте пропустити атаки
rampantFixed--disableNewEnemies_text=Лігва замінено на всіх планетах. Їх не буде повернено
rampantFixed--msg-ask-disableNewEnemies=Заміна лігв нових ворогів стандартними. На великих мапах це може зайняти час. Почати заміну?
rampantFixed--button_disableNewEnemies_disable=Так (може зайняти деякий час)
rampantFixed--button_disableNewEnemies_cancel=Скасувати
rampantFixed--msg_replaceNewEnemiesNests=Заміну лігв завершено. Оброблено лігв: __1__. За бажання мод можна видалити.
rampantFixed--K2_SE_CMO_incompatibilityWarning=Виявлено поєднання модів K2+SE + combat-mechanics-overhaul. У цьому поєднанні налаштування мода <combat-mechanics-overhaul>: «Spitter/worm spit blockable» [font=heading-1][color=red]неправильно перетворює атаки [/color][/font] вогняної та пекельної фракцій. Якщо їх увімкнено, увімкніть альтернативну атаку (налаштування Rampant Fixed: Снаряди: замінити парові атаки снарядами, які можна заблокувати)
rampantFixed--undergroundAttackWarning=Увага: __1__: кусаки навчилися підземних атак! Тверда поверхня (швидкість руху 150+) затримає підкоп на хвилину,
rampantFixed--undergroundAttackWarning2=зменшить швидкість руху кусак на 5 сек і сповістить про спробу підкопу чи проходу (якщо в зоні покриття радара)
rampantFixed--firstUndergroundAttackWarning=Виявлено першу підземну атаку (наступні атаки прийдуть без попередження)
rampantFixed--undergroundAttackDigoutWarning=Увага: виявлено спробу підкопу. Тверда поверхня затримає його на 1 хвилину
rampantFixed--undergroundAttackDetectedWarning=Виявлено підземну атаку!
rampantFixed--squadDetectedWarning=Виявлено загін ШІ Rampant. Розмір загону: __1__
rampantFixed--demolisherAttackDetectedWarning=Виявлено спустошувача, що атакує
rampantFixed--JuggernautAlert=Rampant Fixed: УВАГА! ЗА 82% ЕВОЛЮЦІЇ МОЖЛИВА ФРАКЦІЯ ДЖАҐЕРНАУТІВ! Вони надзвичайно стійкі до вогню й фізичної шкоди.
rampantFixed--demolisherNote1=[color=red]__1__: атака спустошувача. Якщо він атакує й піде живим, то приходитиме знову й знову.[/color] Знищивши його, ви відтягнете момент атаки іншого спустошувача.
rampantFixed--demolisherNote2=Коли починаються атаки, у 20% випадків атакує точна копія наявного спустошувача. В інших випадках відбувається мутація. Мутують лише спустошувачі Space Age.
rampantFixed--demolisherNote3=За __1__% еволюції можлива мутація в середнього спустошувача. За __2__% — у великого. Якщо не можете вбити — нагодуйте.
rampantFixed--demolisherNotFeeded=__1__: спустошувач ситий і не реагує на їжу.
rampantFixed--demolisherFeeded_Hunger=__1__: ви нагодували спустошувача, і він прийде до вас лише через __2__ хв. Він може з'їсти ще __3__ раз(и)
rampantFixed--demolisherFeeded_noHunger=__1__: ви нагодували спустошувача, і він прийде до вас лише через __2__ хв. Більше він їсти не хоче
rampantFixed--demolisherFeared=__1__: ви налякали спустошувачів, і вони прийдуть до вас лише через __2__ хв
rampantFixed--demolisherNextAttack=Наступна атака очікується через __1__ хв
rampantFixed--NEW_ENEMIES_SIDE_ignored=Rampant Fixed: налаштування боку нових ворогів змінено. Його можна змінити лише на початку гри, тож зміну буде проігноровано
rampantFixed--AdminMenu=Rampant Fixed. Меню адміністратора
rampantFixed--showDisableNewEnemies=Показати діалог вимкнення ворогів Rampant
rampantFixed--surfaceIteraction_frame=Налаштування обробки поверхонь
rampantFixed--surfaceName_Title=Назва поверхні
rampantFixed--surfaceIgnored_Title=Обробка
rampantFixed--surfaceIgnored_True=Ігнорувати
rampantFixed--surfaceIgnored_False=Обробляти
rampantFixed--planetAISettings_frame=Rampant Fixed. Налаштування обробки планет
rampantFixed--planetAISettings_Note=Примітка: на планетах без стандартних кусак можливе лише стандартне розповсюдження
rampantFixed--planetAISettings_Note2=Відкрити ці налаштування пізніше можна через налаштування гравця
rampantFixed--planetName_Title=Планета
rampantFixed--AIStatus_Title=Обробка ШІ
rampantFixed--AIPeacePeriod_Title=Мирний період, хвилини
rampantFixed--AIMinEvo_Title=Мін. еволюція для атак, %
