rampantFixed--AI_disabled=Не обробляти
rampantFixed--AI_nests=Будь-які лігва
rampantFixed--AI_nestsAndDemolishers=Лігва й спустошувачі
rampantFixed--AI_PlanetOff=__1__: обробку ШІ ВИМКНЕНО
rampantFixed--AI_PlanetOn=__1__: обробку ШІ УВІМКНЕНО
rampantFixed--button_cancel=Скасувати
rampantFixed--button_ok=Гаразд
rampantFixed--peacefullModeNotification=__1__: мирний режим. Атаки почнуться через __2__ хв, якщо еволюція становитиме __3__% або більше.
rampantFixed--peacefullMode_LowEvoNotification=__1__: мирний режим. Атаки почнуться, коли еволюція сягне __2__% або більше
rampantFixed--peacefullModeEndNotification=__1__: мирний режим завершився. Вороги можуть атакувати
