[item-description]
powerup-Combat5min-Capsule-rampantFixed=Зрідка випадає, коли гравець особисто знищує лігва Rampant\nШанс вищий, якщо знищувати зблизька (90<70<40<20<15)[color=green]\nПри використанні дає гравцеві посилення на 5 хвилин: \n -нескінченні боєприпаси (якщо їх більше 1) \n -знищення кусак одним пострілом (лише фізична та вибухова шкода)\n -діє на лігва й черв'яків за шкоди 1000+ \n - збільшена шкода цілям зі здоров'ям 4000+ замість миттєвого вбивства[/color][color=red]\nЯкщо боєприпаси є в основному інвентарі, вони витрачаються[/color]
regenerationCrystal-rampantFixed=Зрідка випадає, коли гравець особисто знищує лігва Rampant з відстані 20 чи менше\nМоже працювати як малий радар, не потребує живлення[color=green]\nРаз на 5 секунд накладає регенерацію на гравців поблизу на 1 хвилину\nНевразливий після першої спроби накласти посилення[/color][color=red]\n1% шанс зламатися під час накладання посилення, незалежно від кількості цілей[/color]
demolisher-food-rocket-rampant=Запускається в спустошувача, що атакує. Він не повернеться щонайменше 2 години. Великі спустошувачі можуть з'їсти більше
unstable-feeding-reactor-rampant=Вибухає після встановлення, випускаючи кілька ракет. Спустошувачі не приходитимуть до вас 8 годин. ДУЖЕ НЕБЕЗПЕЧНО
demolisher-scales-rampant=Випромінює тепло. Інші властивості вивчено не до кінця\nОсновний спосіб отримання — збирати скинуті пластини під час годування спустошувача
refined-prometium-rampant=Займає значно менше місця. Можна використовувати як паливо

