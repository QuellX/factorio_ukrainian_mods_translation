[entity-description]
regenerationCrystal-rampantFixed=[color=green]Можна добути\nДає регенерацію дружнім гравцям, якщо увімкнено\nЕфект утричі сильніший за еволюції 50+ і 70+[/color][color=red]\nМоже зламатися під час накладання посилення[/color]
lootStone_Combat5-rampantFixed=Камінь зі здобиччю\nДобудьте або знищте його
biterSupressor1-rampant=Призначений для зниження загрози на тимчасово покинутих планетах[color=green]\nУтричі зменшує частоту атак ШІ Rampant. Запобігає масовим атакам у разі прориву оборони[/color]\nНе впливає на спустошувачів, атаки через забруднення та реакцію на знищення лігв[color=red]\nПозитивний ефект не діє, коли гравці фізично перебувають на планеті.\nЯкщо розмістити 2 чи більше, позитивний ефект не сумується[/color]
biterSupressor2-rampant=Призначений для зниження загрози на тимчасово покинутих планетах\nМає функції попередньої версії, а також:[color=green]\nЗбільшує інтервал між атаками спустошувачів у 1,5 раза. Також діє на їжу\nЯкщо нагодованих спустошувачів кілька, ефект годування в ослабленому вигляді діє й на них\nВдвічі зменшує максимальний розмір атакувального загону під керуванням ШІ Rampant[/color]
biterSupressor3-rampant=Призначений для зниження загрози на тимчасово покинутих планетах\nМає функції попередньої версії, а також:[color=green]\nЗа 100% безперервного живлення еволюція на планеті не зростатиме[/color]
demolisher-scales-stone-rampant=Іноді залишається під час годування голодного спустошувача
heating-tower-selfpowered-rampant=Не потребує палива. Розморожує 10 клітинок навколо

