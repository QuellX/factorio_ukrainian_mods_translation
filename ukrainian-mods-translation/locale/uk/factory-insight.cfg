[fi-finding]
belt-unloading-limit=__1__ маніпулятор(и) вивантажують __2__ з __3__ на цей конвеєр, і __6__ з них працюють без упину. На папері вони разом переносять ~__4__, а машинам на лінії треба __5__, але, кладучи на рухомий конвеєр, вони ніколи не досягають повної швидкості. У скринях ще багато, тож межа — вивантаження, і останні машини на лінії нічого не отримують. Додайте більше (чи швидших) маніпуляторів вивантаження.
station-activity=__1__ потяг(ів) на __2__: __3__. Саме по собі це не доводить нестачі __4__.
starved-of=Бракує __1__ (на повній швидкості потрібно __2__).
full-speed=Працює на повну. Якщо потрібно більше її продукту, збудуйте більше таких машин.
no-problem=Вузьких місць не знайдено.
measuring=Вимірювання… потримайте мишу тут кілька секунд.
no-recipe=Рецепт не задано.
depleted=Ресурс під цим буром вичерпано.
generic=Стан: __1__
idle=Не працює: __1__
brief-waits=Вона ненадовго чекала на інгредієнти __1__ часу. Це лише машина розганяється після повного виходу або дрібні перерви, які поглинають її буфери. Вона встигає за попитом, тож це нічого не коштує.
backed-up=Вихід переповнений: те, що йде після цієї машини, споживає менше, ніж вона може виробити. Це нормально — вона була потрібна лише __1__ часу, тож тут є запас потужності.
not-plugged=Не під'єднана до електромережі. Поставте поруч опору ЛЕП.
no-power=У цій електромережі взагалі немає енергії.
low-power=Електромережу перевантажено: ця машина отримує лише близько __1__ потрібної енергії й працює повільніше. Збудуйте більше генерації (або налагодьте постачання палива/пари наявної).
low-power-generic=Електромережу перевантажено: цій машині бракувало енергії __1__ часу, і вона працює повільніше. Збудуйте більше генерації (або налагодьте постачання палива/пари наявної).
low-power-harmless=Вона все одно встигає за попитом (її вихід регулярно переповнюється), тож ТУТ це не коштує виробітку — але та сама нестача сповільнює машини деінде.
power-maxed=Усі __1__ генераторів (__2__) цієї мережі вже працюють. Енергії просто замало: збудуйте більше генераторів (і котлів) чи сонячних панелей.
power-generators-troubled=__1__ з __2__ генераторів цієї мережі не виробляють: __3__ — __4__
power-spikes=Усі __1__ генераторів (__2__) працюють лише з навантаженням __3__, тож у середньому енергії вистачає. Нестача — через короткі сплески споживання (лазери, одночасний запуск багатьох машин): їх згладжують акумулятори.
power-earlier=Мала проблеми з енергією __1__ останньої хвилини, але зараз з енергією все гаразд (часто лише тому, що машину поставили раніше за опору ЛЕП).
power-no-generators=У цій мережі ніщо не виробляє енергію: не під'єднано жодного генератора, сонячної панелі чи акумулятора. Перевірте, чи опори справді доходять до вашого джерела енергії.
no-fuel=Паливо закінчилося, і ніщо його не доставляє. Додайте маніпулятор, що подає паливо.
no-fuel-fed=Паливо закінчилося: маніпулятори, що її постачають, не подають паливо (досить швидко).
input-inserter-capacity=__1__ надто повільний для цієї машини: на повній швидкості він має переносити __2__, а встигає лише ~__3__. Машину обмежено приблизно __4__. Використайте швидший маніпулятор, додайте другий або дослідіть бонус розміру стосу.
output-inserter-capacity=__1__ вихідних маніпулятор(и) надто повільні: машина виробляє __2__, а вони встигають забирати лише ~__3__ (це обмежує її приблизно __4__). Використайте швидший маніпулятор або додайте ще один.
inserter-bottleneck=Вузьке місце: __1__, що подає __5__, працює без упину (зайнятий __2__ часу). Він встигає ~__3__, а щоб машина працювала на повну, мав би переносити __4__ (усе, що він переносить, разом). Замініть його швидшим, додайте ще один або дослідіть бонус розміру стосу.
inserter-too-slow=Вузьке місце: __1__ маніпулятор(и), що подають __5__ (__2__), разом встигають лише ~__3__, а потрібно __4__. Використайте швидші маніпулятори, додайте ще один або дослідіть бонус розміру стосу.
supply-unclear=Маніпулятори, що подають __1__, зараз ні на межі, ні в очікуванні, тож нестача лише епізодична. Спостерігайте далі для точного висновку.
output-inserter-bottleneck=Вузьке місце: вихідний __1__ зайнятий __2__ часу. Він встигає лише ~__3__, а машина виробляє __4__. Використайте швидший маніпулятор або додайте ще один.
inserter-status=__1__ не працює: __2__
no-feeders=Жоден маніпулятор нічого не кладе в __1__, тож __2__ туди ніколи не надходить.
no-carrier=Жоден із __1__ маніпуляторів, що постачають цю машину, не може взяти __2__: його немає на їхньому конвеєрі чи в їхній скрині.
inserter-no-source=__1__ нема звідки брати.
waiting-for-train=__1__ чекає на потяг, що привезе __2__. Допомогли б більше чи швидші потяги або більший буфер.
source-unknown=__1__ бере з __2__, що далі проаналізувати не можна.
chain-continues=Проблема тягнеться далі вгору ланцюжком постачання. Огляньте цю машину, щоб простежити.
belt-too-slow-for-machine=__1__ перевозить максимум __2__, а лише цій машині потрібно __3__ з __4__. Вдоскональте конвеєр.
belt-no-source=Конвеєр не везе жодного __1__. Пройдено __2__ клітинок угору конвеєром, і нічого, що кладе на нього __1__, не знайдено.
belt-sparse=__1__ надходить лише тоненькою цівкою. Пройдено __2__ клітинок угору конвеєром, але звідки воно надходить, не знайдено (довгий конвеєр чи залізнична станція?).
belt-fed-by=__1__ на цьому конвеєрі надходить від __2__ виробник(ів), як-от __3__ (__4__ клітинок конвеєра вгору).
belt-fed-by-chest=__1__ на цей конвеєр вивантажується з __2__.
belt-clogged=__1__ забитий __2__, тож __3__ не може пройти. Очистьте конвеєр і тримайте предмети на окремих смугах.
belt-loading-bottleneck=Вузьке місце: __1__, що завантажує конвеєр, працює без упину й кладе на нього лише ~__2__ з __3__. Використайте швидший маніпулятор або завантажуйте кількома маніпуляторами.
belt-between=__1__ переповнені, а тут унизу закінчується __2__, тож межа — конвеєр між ними: він везе максимум __3__, або предмети першими забирають інші машини. Вдоскональте __4__, додайте паралельний конвеєр або дайте цьому споживачу окрему смугу.
chest-empty=У __1__ закінчився __2__, і ніщо його не поповнює.
chest-ran-out=У __1__ закінчився __2__. Відстежую, що її наповнює…
chest-wrong-items=Ніщо з того, що наповнює __1__, не може подати __2__.
chest-logistics=__1__ порожня: логістичні роботи доставляють __2__ недостатньо швидко (замало роботів чи їх немає в мережі).
wagon-empty=У вантажному вагоні не лишилося __1__.
suppliers-starved=__1__ з __2__, що виробляють __3__, самі голодують:
suppliers-blocked=__1__, що виробляють __2__, переповнені, хоча тут його бракує. Перевірте, що з'єднує їх із цією машиною.
supplier-status=__1__: __2__
supplier-output-inserter=Вузьке місце: __1__, що забирає __4__ з __2__, працює без упину й переносить лише ~__3__. Використайте швидший маніпулятор або додайте ще один.
need-more=Усі __1__, що виробляють __2__, уже працюють на повну (__3__ загалом), а його все одно бракує. Потрібно більше: лише ця машина використовує __4__ — стільки, скільки можуть виробити __5__ × __6__.
need-more-exact=Усі __1__, що виробляють __2__, працюють на повну: вони виробляють __3__, а машинам, які вони постачають, потрібно __4__. Збудуйте ще __5__ __6__.
drills-depleted=__1__ з __2__ бурів, що постачають __3__, вичерпали свою руду.
pipe-not-connected=Вхід __1__ не під'єднано до жодної труби.
pipe-no-producer=Ніщо в цій трубній мережі не виробляє __1__ (пройдено __2__ труб).
tanks-empty=__2__ резервуар(ів) цієї трубної мережі спорожніли від __1__, і ніщо їх не поповнює (потяг не їде?).
pipe-balance=Мережа __1__: __2__ виробник(ів) дають до __3__, __4__ споживач(ів) потребують до __5__.
fluid-output-blocks=__1__ заблоковано, бо її вихід __2__ повний. Використайте, розщепіть чи збережіть __2__ — доти вона не може виробляти й нічого іншого.
fluid-output-full=__1__: вихід __2__ повний, ніщо не забирає досить швидко.
no-takers=Ніщо не забирає продукти з __1__. Додайте вихідний маніпулятор.
inserter-at-limit=Цей маніпулятор зайнятий __1__ часу: він на своїй межі ~__2__. Якщо машина, яку він обслуговує, голодує чи переповнена, причина — він.
inserter-waiting-for=Здебільшого чекає на __1__:
inserter-waiting-source=Чекає на предмети __1__ часу: його джерело постачає недостатньо швидко.
inserter-waiting-space=Чекає на місце в цілі __1__ часу. Ціль повна, тож цей маніпулятор — не вузьке місце.
inserter-ok=Добре встигає (зайнятий __1__ часу).
line-overloaded=Ця конвеєрна лінія постачає __1__ машин, яким разом потрібно __2__ з __3__, але __4__ везе максимум __5__. Скільки б ви не виробляли, усе не пройде: вдоскональте конвеєр або постачайте лінію з другого конвеєра (чи з обох кінців).
line-summary=Ця конвеєрна лінія постачає __1__ машин, яким разом потрібно __2__ з __3__ (конвеєр везе до __4__).
line-end-starves=Останнім __1__ з __2__ машин цієї лінії бракує __3__, а першим вистачає: машини на початку забирають усе, і до кінця конвеєр доходить порожнім.
station-no-trains=Жоден потяг не має зупинки __1__ у розкладі, тож сюди ніколи нічого не прибуде.
station-unloading=Зараз на __1__ стоїть потяг із __2__: його розвантажують, межа — маніпулятори (чи буферні скрині).
station-train-empty=Потяг на __1__ не має на борту __2__. Він прибув порожнім (чи вже розвантажений) і блокує зупинку, доки не виконається умова відправлення.
station-train-coming=__1__: __2__ з __3__ потяг(ів) їдуть із __4__, але буфер спорожнів до їхнього прибуття. Більші буферні скрині, ще один потяг чи коротший рейс закрили б розрив.
station-trains-waiting=__1__ з __2__ потяг(ів) цієї зупинки стоять на __3__, чекаючи на завантаження __4__: нестача з боку ЗАВАНТАЖЕННЯ, а не тут. Подивіться, що наповнює ту станцію.
station-no-path=__1__ потяг(ів) не можуть знайти шлях до __2__ (розірвана колія чи сигнал).
station-manual=__1__ потяг(ів) цієї зупинки в ручному режимі чи без розкладу.
station-destination-full=__1__ потяг(ів) чекають, бо досягнуто ліміту потягів зупинки.
robots-no-network=__1__ поза радіусом усіх робопортів: роботи не можуть до неї дістатися.
robots-not-requested=__1__ не запитує __2__ (перевірте її логістичний запит).
robots-none-in-network=У цій логістичній мережі взагалі немає __1__, тож роботам нічого везти. Справжня проблема — виробництво __1__ чи його потрапляння в скрині постачання.
robots-no-robots=У цій логістичній мережі взагалі немає логістичних роботів.
robots-all-busy=Усі __1__ логістичних роботів зайняті, жоден не вільний, щоб привезти __2__. Додайте роботів (і робопортів, якщо вони стоять у черзі на заряджання).
robots-on-the-way=__1__ __2__ вже везуть роботи (вільно __3__ з __4__ роботів). Скриня просто спорожнюється між доставками: запитайте більшу кількість або тримайте буферну скриню ближче.
robots-slow=__1__ є в мережі (__2__), і вільно __3__ з __4__ роботів, але скриня порожня: польоти довгі. Поставте сховище чи буферну скриню ближче або додайте робопорти на шляху.
module-speed=Вільних комірок модулів: __2__. __1__ додасть до +__3__ виробничої потужності (енергія +__4__). Перевірте попередній перегляд вдосконалення: входи, транспорт і попит можуть завадити цьому приросту.
module-productivity=Вільних комірок модулів: __2__. З __1__ вона вироблятиме на +__3__ більше з тих самих інгредієнтів. Вона стане на __4__ повільнішою, що не має значення, поки вона й так чекає на інгредієнти.
module-efficiency=Вільних комірок модулів: __2__. З __1__ ця машина споживатиме на __3__ менше енергії, що допоможе перевантаженій мережі.
module-wasted=Модулі швидкості (__2__) тут марні: машина задіяна лише __3__ часу. __1__ натомість заощадили б енергію за того самого виробітку.
belt-measured=Виміряно на __1__, звідки бере ця машина: надходить __2__ з __3__, потрібно __4__. (Конвеєр загалом везе __5__ з максимуму __6__.)
belt-flow=Виміряно: цей конвеєр везе __1__ зі свого максимуму __2__ (__3__).
belt-lanes=Смуги дуже нерівномірні: ліва __1__, права __2__. Машини, що беруть лише з боку порожнішої смуги, можуть голодувати, хоча конвеєр здається завантаженим.
belt-saturated=Цей конвеєр щільно заповнений і рухається: працює на своєму максимумі __1__. Якщо машини далі голодують, вдоскональте його або додайте другий конвеєр.
belt-backed-up=Цей конвеєр повний і стоїть: тому, що далі, більше не потрібно. Не вузьке місце.
belt-empty=Цей конвеєр порожній.
belt-partial=Заповнено на __1__. Міг би везти до __2__.
ore-left=Руди в зоні досяжності цього бура (__1__) вистачить приблизно на __2__ за поточного темпу.
fuel-left=Ніщо не заправляє цю машину: палива всередині вистачить приблизно на __1__ за повного навантаження.
chest-left=__1__ постачає цю машину, і ніщо її не поповнює: її __2__ вистачить приблизно на __3__.
research-limited=Усі __1__ лабораторій разом досліджують на __2__ своєї швидкості; найбільше їх стримує __3__. Огляд (ALT + P) простежує це до причини.
research-overall=Усі __1__ лабораторій разом досліджують на __2__ своєї швидкості.
power-unknown=Не вдалося перелічити всі джерела енергії цієї мережі (дуже велика база).
power-solar-night-none=Ця мережа працює на __1__× __2__, і зараз вони дають __3__ — ніч. Акумуляторів немає, тож щоночі енергія зникає. Приблизно __4__× __5__ протримають ці панелі всю ніч (25 панелей : 21 акумулятор), або додайте паровий двигун.
power-solar-night-empty=__1__× __2__ порожні: їх замало, щоб протриматися ніч для __3__× __4__. Потрібно приблизно __5__.
power-sunrise=Сонце повернеться приблизно за __1__.
power-solar-small=__1__× __2__ дають у кращому разі __3__ (зараз __4__, у середньому за добу __5__): замало для того, що тут під'єднано. Додайте панелей.
power-accumulators=__1__× __2__ у цій мережі, заряджено __3__.
power-accumulators-only=Цю мережу живлять лише акумулятори (__1__× __2__), і ніщо їх не заряджає.
power-balance=Ця мережа потребує приблизно __1__, а витримує лише __2__: бракує приблизно __3__.
power-balance-ok=У середньому вистачає: мережа потребує приблизно __1__ і витримує __2__.
power-build-steam=Збудуйте ще __1__ __2__ (по __3__) — з відповідними котлами (1 котел на 2 парові двигуни).
power-build-solar=Для __1__ цілодобово потрібно загалом __2__× __3__ і __4__× __5__ (у вас __6__ і __7__).
