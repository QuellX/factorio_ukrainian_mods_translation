efficiency-tooltip=Смуга показує, як минула остання хвилина: [color=0.35,0.9,0.35]робота[/color], [color=1,0.25,0.2]очікування інгредієнтів[/color], [color=1,0.5,0.1]енергія/паливо[/color], [color=1,0.85,0.2]вихід повний[/color], [color=0.55,0.65,0.8]простій[/color] (наведіть на колір, щоб побачити частку).\nЧисло — ефективність: наскільки добре машина працювала, ПОКИ БУЛА ПОТРІБНА, виміряна за її фактичним прогресом виготовлення (тож нестача енергії теж враховується). Час очікування з повним виходом не враховується проти неї: це лише означає, що її продукт нікому не був потрібен. Нижче 100% — щось її стримує: брак інгредієнтів, повільні маніпулятори, енергія...
