[mod-description]
factory-insight=Наведіть на будь-яку машину, щоб побачити, наскільки ефективно вона справді працює, що саме її гальмує (повільний маніпулятор, порожній конвеєр, порожня труба, постачальник вище ланцюжком, енергія, паливо...) і що збудувати чи прибрати, щоб виправити співвідношення. Усе показується для кожного гравця окремо, тож інших гравців у мультиплеєрі це ніколи не турбує.

