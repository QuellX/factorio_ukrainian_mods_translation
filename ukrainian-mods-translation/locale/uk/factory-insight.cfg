root-none=Ніщо виміряне на вашій фабриці не виробляє __1__: це треба збудувати чи завезти
root-starved=__3__ (__2__), що виробляють __1__, чекають на інгредієнти: наведіть на одну, щоб побачити причину
root-power=__3__ (__2__), що виробляють __1__, не отримують досить енергії
