fi-highlight-culprits=Підсвічувати винуватця у світі
fi-signal-planner=Планувальник сигналів
fi-alerts=Сповіщення (прогнози й список спостереження)
fi-alert-ore=Сповіщення: руда закінчується
fi-alert-fuel=Сповіщення: паливо закінчується
fi-alert-trains=Сповіщення: потяги (паливо, взаємоблокування)
fi-alert-sound=Звук під час сповіщень
