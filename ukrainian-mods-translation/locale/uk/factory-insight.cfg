[fi-train]
parked-ahead=Вибраний маршрут потребує блоку сигналів, зайнятого запаркованим потягом __1__. Очікуйте зупинки біля його захисного сигналу, доки той потяг не рушить або колію стоянки не буде відокремлено від наскрізного маршруту. Це попередження про блокування, а не прогноз зіткнення.
wait-fuel-full=Одна з умов відправлення вимагає повних паливних інвентарів локомотивів. Цей локомотив має __1__ предметів палива й ще має місце. Заправте його паливні комірки або перегляньте умову «Паливо повне»; паливо у вантажних вагонах її не задовольняє.
wait-cargo-empty=Умова «Вантаж порожній» досі не виконана. На борту лишається вантаж. Перевірте маніпулятори/помпи розвантаження й буфери призначення або перегляньте цю умову відправлення.
wait-cargo-full=Умова «Вантаж повний» досі не виконана. Частина місткості не заповнена. Перевірте завантаження, фільтри вагонів і всі вагони-цистерни або перегляньте цю умову відправлення.
wait-count=Умову вантажу не виконано: __1__ зараз __2__; потрібно __3__ __4__. Перевірте цю умову та її альтернативи І/АБО в розкладі.
wait-conditions-unknown=Деякі умови відправлення не можна перевірити за поточними спостереженнями. Таймер міг запуститися ще до спостереження; умови логічної мережі й інші непідтримувані умови лишаються невідомими. Умови І утворюють групи, розділені альтернативами АБО.
wait-parked=Потрібний блок сигналів зайнятий запаркованим потягом __1__. Його вагони можуть бути далеко від цього перехрестя, але все одно в тому самому блоці. Переставте його на окрему колію з сигналами або відокремте колії станції/стоянки від наскрізного маршруту.
wait-self-block=Потяг __1__ займає блок, який має зарезервувати знову. Перевірте петлю й хвостові вагони: відокремте зворотний маршрут і забезпечте досить місця для всього потяга за перехрестям.
wait-trace-limited=Очікування біля сигналу не вдалося повністю простежити вздовж вибраного маршруту. Ні вільний маршрут, ні точний блокувальник не стверджуються; перевірте ланцюгові сигнали далі й зайняті блоки.
unsignalled-shared=Цей блок не має сигналів і зараз містить __1__ окремих потягів, зокрема запаркованих. Вони можуть заїхати на ту саму колію, і жоден сигнал їх не зупинить. Поділіть спільну колію на захищені блоки, перш ніж їх запускати; на двоколійному русі зберігайте парні напрямки й місця роз'їзду. Це ризик планування, а не доказ, що ці потяги зіткнуться.
unsignalled-junction-shared=Це перехрестя чи розвилка без сигналів має один блок на __1__ окремих потягів. Захистіть підходи, перш ніж пускати їх разом: ланцюгові сигнали перед зоною конфлікту, рейкові сигнали за виходами з місцем для всього потяга. Зустрічному руху також потрібні роз'їзди. Запарковані потяги теж враховуються; зіткнення можливе, а не неминуче.
unsignalled-junction=Жоден сигнал не захищає цю розвилку чи перехрестя; зараз його блок займають __1__ потягів. Перш ніж ділити його між потягами, захистіть підходи ланцюговими сигналами й поставте рейкові сигнали за вільними виходами з місцем для всього потяга. Це порада з підготовки, а не попередження про неминуче зіткнення.
unsignalled-single=Зараз цей блок без сигналів займає лише __1__ потяг. Сама ця кількість не вказує на зіткнення з іншим потягом. Додайте захист, перш ніж пускати ще один потяг чи під'єднувати спільну колію. Це не гарантує безпеки майбутнього руху чи ручного керування.
unsignalled-empty=Зараз цей блок (__1__) не займає жоден потяг, і він не має сигналів. Поточних зіткнень між потягами немає. Сплануйте межі блоків, перш ніж пускати спільний рух.
unsignalled-incomplete=Цей блок не має сигналів і зараз містить __1__ потягів. Сканування топології зупинилося на ліміті роботи; не відвідані гілки чи перехрестя не перевірено.
mark-unsignalled=Спільний блок без сигналів
scan-progress=Прогнози залізниці: обертова вибірка; огляньте потяг для свіжої перевірки.
last-check=Остання перевірка __1__ с тому. Відкрийте інспектор потяга, щоб оновити.
collision-block=Можливе зіткнення з __1__: обидва потяги вже займають той самий блок сигналів, і їхні прогнозовані шляхи перетинаються. Додайте межі блоків і розведіть потяги; автоматичний режим не скасує небезпечного спільного зайняття блоку.
short-exit=Між виходом з перехрестя й наступною межею зупинки лише близько __1__ клітинок; цьому потягу потрібно близько __2__. Зупинившись, його хвіст може заблокувати перехрестя. Перенесіть межу зупинки далі або тримайте потяг перед перехрестям.
collision-possible=Можливе зіткнення з __1__: потяг на ручному керуванні в русі може ігнорувати сигнали. Близькі рейкові шляхи й орієнтовні вікна прибуття перетинаються. Гальмуйте й перевірте перехрестя; це припущення за поточної швидкості, без прогнозу майбутнього керування чи гальмування.
manual-signals=Ручне керування не підкоряється рейковим сигналам. Прогноз охоплює лише найближчу колію; чистий результат не гарантує безпеки.
forecast-limited=Прогноз найближчих потягів досяг ліміту роботи. Деякі потяги чи пари маршрутів лишилися неперевіреними.
rail-block=Ця рейка належить до блоку сигналів. Автоматичні потяги резервують блоки; самі лише спільні майбутні маршрути не означають зіткнення.
rail-unprotected=Жоден вхідний сигнал не захищає цей блок. Додайте сигнали на його входах, перш ніж пускати кілька потягів. Потяги на ручному керуванні все одно ігнорують сигнали.
rail-crossing=Розвилка чи перехрестя: перевірені вхідні сигнали — ланцюгові. Вони можуть тримати автоматичні потяги перед заблокованим виходом; ручне керування все одно може спричинити зіткнення.
rail-junction-risk=Звичайний сигнал пускає потяги в цей блок перехрестя, навіть коли вихід заблоковано. Використовуйте ланцюгові сигнали перед перехрестям і залиште досить місця для всього потяга за виходом. Це ризик блокування, а не прогноз зіткнення автоматичних потягів.
rail-counts=Зайнятість блоку: потягів __1__; вхідних сигналів __2__; вихідних сигналів __3__.
rail-scan-limited=Сканування блоків колії досягло ліміту роботи. Не відвідані ділянки не перевірено на ризики.
chain-blue=Деякі виходи відкриті (сині); потягу потрібно, щоб був доступний його власний вихід.
chain-none=Стан ланцюга недоступний; перевірте прикріплення й межі блоків.
chain-no-exit=До цього ланцюгового сигналу не прив'язано жодного сигналу далі. Перевірте кінець колії або додайте вихідний рейковий сигнал за перехрестям, де може чекати весь потяг.
signal-loop=Цей сигнал веде назад у власний блок. Додайте ще одну межу, щоб вхідні й вихідні рейки належали різним блокам.
wait-circuit=Логічна мережа тримає цей сигнал червоним. Перевірте його умову логічної мережі; що причина — зайнятий блок, не доведено.
v-activity=На __1__: __2__
temporary-stop=його тимчасова зупинка
st-driving=у русі
st-wait-signal=чекає біля сигналу
st-wait-station=стоїть на станції
st-no-path=без шляху
st-no-schedule=без розкладу
st-manual=у ручному режимі
st-destination-full=чекає на вільну зупинку
v-no-path=Немає шляху до __1__
v-no-path-short=Не знаходить шляху (наведіть на потяг, щоб побачити причину)
v-destination-full=Призначення зайняте: __1__
v-wait-signal=Чекає біля сигналу дорогою до __1__
v-no-schedule=Немає розкладу: цьому потягу нікуди їхати
v-manual=Ручний режим: рухається, лише коли ним хтось керує
v-wait-station=На __1__, доки не виконається умова відправлення
v-driving=Дорогою до __1__
no-stop=На цій поверхні немає зупинки з назвою __1__. Перейменуйте зупинку чи виправте розклад.
stop-no-rail=__1__ існує (__2__×), але не прикріплена до рейки: зупинка має стояти поруч із прямою ділянкою колії.
mark-no-rail=Не прикріплена до рейки
path-exists=Маршрут до __1__ зараз існує: потяг скористається ним під час наступної спроби.
signal-one-way=Цей __1__ робить колію односторонньою ПРОТИ потяга: маршрут до __2__ проходить повз нього ззаду. Поставте сигнал і з протилежного боку колії (це зробить її двосторонньою) або приберіть його.
signal-also=Дорогою є також односторонній __1__ проти потяга.
mark-one-way=Односторонній проти потяга
wrong-side=Колія доходить до __1__, але з неправильного боку: потяг має прибувати так, щоб зупинка була праворуч від нього. Розверніть зупинку або збудуйте петлю, щоб потяги заїжджали з іншого боку.
mark-wrong-side=Досягається з неправильного боку
needs-reverse=До __1__ можна дістатися лише заднім ходом, а цей потяг не має локомотива, поверненого в той бік. Додайте локомотив, повернений в інший бік, або розворотну петлю.
mark-needs-reverse=Немає локомотива, поверненого назад
disconnected=До __1__ не веде жодна з'єднана колія. Найближче рейки підходять глухим кутом за __2__ клітинок від зупинки: бракує ланки рейки або її покладено не там.
disconnected-plain=До __1__ не веде жодна з'єднана колія (перевірено ділянок колії: __2__).
mark-dead-end=Колія закінчується тут
too-big=Перевірено __1__ ділянок колії, а __2__ не досягнуто: мережа завелика для точної відповіді.
unclear=За рейками й сигналами до __1__ можна дістатися, але гра не знаходить шляху: пошукайте щойно прибрану рейку чи вимкнену зупинку на шляху.
full-list=Зупинок з назвою __1__: __2__, усі зайняті чи вимкнені: потягів у дорозі __3__, сума лімітів __4__. Підніміть ліміт або додайте зупинку.
full-disabled=Вимкнено логічною мережею: __1__.
waits-unknown=Чекає, доки звільниться блок за цим __1__.
waits-for=Блок за цим __1__ займає __2__, що __3__.
mark-in-the-way=Заважає
deadlock=Взаємоблокування: __1__ потягів чекають одне на одного по колу (__2__). Виведіть один вручну, а тоді поставте ланцюгові сигнали перед перехрестям і рейкові — після нього.
mark-deadlock=Взаємоблокування
no-fuel=__1__ не має палива
mark-no-fuel=Немає палива
stop-unattached=Не прикріплена до рейки: жоден потяг сюди не приїде
stop-unused=Жоден потяг не має цієї зупинки в розкладі
stop-trains=Сюди їде потягів: __1__; з них __2__ не знаходять шляху
stop-fine=Сюди їде потягів: __1__, усі знаходять шлях
stop-limit=Ліміт потягів __1__, у дорозі __2__
stop-example=__1__ не може сюди доїхати:
dash-fine=Автоматичних потягів: __1__ · поточних сповіщень немає.
dash-full=__1__ чекають на вільну зупинку
dash-summary=__1__ мають проблеми
go-train-tooltip=Перейти до потяга
go-spot-tooltip=Перейти до точного місця проблеми
plan-proven=Перевірено: зі змінами (__1__) маршрут до __2__ відкрито. Клацніть значок сигналу в рядку вище, щоб розмістити його як привид (або кошик, щоб натомість прибрати сигнал).
wrong-way-track=Єдиний маршрут до __2__ проходить проти __1__ чи більше односторонніх сигналів поспіль: це одностороння колія для ІНШОГО напрямку. Не змінюйте ці сигнали — потягу потрібна колія свого напрямку або з'їзд на неї.
mark-wrong-way=Одностороння колія, інший напрямок
mark-build-here=Збудуйте тут __1__
fix-ghost-tooltip=Розмістити __1__ як привид у точно позначеному у світі місці (збудують ваші роботи чи ви)
fix-remove-tooltip=Натомість позначити цей для демонтажу
fix-upgrade-tooltip=Позначити для вдосконалення до __1__
fix-done=Готово — наказ віддано
fix-failed=Тут цього зробити не вдалося (щось заважає)
use-chain=Цей рейковий сигнал пускає потяги на перехрестя: потяг може зупинитися ПРОСТО на ньому й заблокувати всіх — класичне взаємоблокування. На входах перехрестя потрібен __1__; звичайні рейкові сигнали — на його виходах.
mark-use-chain=Має бути ланцюговим сигналом
chain-plain-track=Ланцюговий сигнал перед звичайною колією: працює, але тут досить рейкового сигналу. Ланцюгові сигнали — для входів перехресть.
sig-two-way=Двосторонній: має пару з іншого боку, потяги можуть проїжджати в обох напрямках
sig-one-way=Односторонній: потяги можуть проїжджати, лише коли цей сигнал праворуч від них. Потяги з іншого боку не знаходять шляху тут
sig-should-be-chain=Рейковий сигнал на вході перехрестя: ризик взаємоблокування, використайте ланцюговий
sig-unattached=Не прикріплений до рейки: нічого не робить
sig-block-free=Блок за ним вільний
sig-block-busy=Блок за ним зайнятий (потягів: __1__)
sig-open=відкритий
sig-closed=закритий
sig-reserved=зарезервований потягом
sig-circuit=утримується логічною мережею
deadlock-two-way=Чому: це ДВОСТОРОННЯ колія зі звичайними рейковими сигналами (на цій ділянці їх __1__). Рейковий сигнал бачить лише наступний блок, тож пустив потяг з кожного кінця — і тепер вони стоять ніс до носа. На колії, якою їздять в обох напрямках, кожен сигнал має бути __2__: він не пускає потяг, доки весь шлях не вільний. Клацніть значок, щоб замовити вдосконалення всіх; тоді виведіть один потяг вручну.
two-way-rail=Звичайний рейковий сигнал на колії з рухом в обох напрямках: пускає потяг, хоча назустріч їде інший — лобове взаємоблокування. На двосторонній колії використовуйте __1__ (рейкові сигнали — лише там, де потяг може чекати, нікого не блокуючи, наприклад на роз'їзді).
sig-two-way-rail=Рейковий сигнал на двосторонній колії: ризик лобового взаємоблокування, використайте ланцюгові
route-two-way=Попереду на маршруті: звичайних рейкових сигналів на двосторонній колії — __1__. Потяг, що їде назустріч, можуть пустити одночасно — лобове взаємоблокування не за горами. Зробіть їх __2__.
fix-batch-tooltip=Замовити вдосконалення всіх __1__ до __2__
audit-running=Перевіряю кожен рейковий сигнал на ризики взаємоблокування…
audit-fine=Сигнали перевірено (__1__): попереджень щодо планування немає.
audit-risks=Ризики взаємоблокування: рейкових сигналів на двосторонній колії — __1__, на входах перехресть — __2__
audit-tooltip=Перевіряє парні сигнали на двосторонніх ділянках і звичайні сигнали на входах перехресть. Вдосконалення стосується лише входів перехресть; вихідні сигнали зберігайте, а двосторонні ділянки переглядайте окремо.
audit-fix-tooltip=Вдосконалити вхідні сигнали перехресть (__1__) до ланцюгових; виходи переглядайте окремо.
audit-fixed=Сигналів позначено для вдосконалення до ланцюгових: __1__
net-todo=Сигналізація цієї мережі: розмістити __1__, неправильного типу __2__, прибрати __3__ (правильних __4__). Клацніть ланцюговий сигнал, щоб побачити всі місця у світі й розмістити їх як привиди.
wrong-in-junction=НЕПРАВИЛЬНИЙ ТИП: цей звичайний рейковий сигнал охороняє перехрестя. Рейковий сигнал бачить лише наступний блок, тож пускає потяг на перехрестя, і той може там зупинитися, заблокувавши всі інші маршрути — хоча зазвичай потяги проїжджають. Зробіть його __1__: він пускає потяг, лише коли той зможе й виїхати.
wrong-short-block=НЕПРАВИЛЬНИЙ ТИП: блок за цим рейковим сигналом коротший за ваші потяги (__2__ клітинок). Потяг, що зупиняється біля наступного сигналу, лишає хвіст на перехресті позаду. Зробіть його __1__, щоб потяг натомість чекав перед перехрестям.
wrong-against-route=НЕ ТОЙ БІК: цей сигнал стоїть сам, проти напрямку, яким тут мають їхати потяги. Він робить колію односторонньою не в той бік (звідси й «немає шляху»). Приберіть його або поставте пару з іншого боку, якщо колія справді двостороння.
missing-entrance=ТУТ БРАКУЄ: __1__ перед цим перехрестям. Без нього підхід ділить один блок із перехрестям: другий потяг мусить чекати далеко позаду, або два потяги зустрічаються всередині.
missing-exit=ТУТ БРАКУЄ: __1__ за перехрестям, де вміщується весь потяг. Він звільняє перехрестя, щойно потяг проїде.
missing-exit-chain=ТУТ БРАКУЄ: __1__ за перехрестям. Наступне перехрестя ближче, ніж довжина потяга, тож звичайний рейковий сигнал лишив би хвіст на цьому.
missing-station-exit=ТУТ БРАКУЄ: __1__ одразу після станції, щоб наступний потяг міг заїхати, щойно цей поїде.
missing-station-entrance=ТУТ БРАКУЄ: __1__ за довжину потяга перед станцією: станція отримує власний блок, і потяг, що чекає, не блокує лінію.
missing-block=ТУТ БРАКУЄ: __1__, щоб поділити цю довгу ділянку на блоки й потяги могли їхати один за одним, а не чекати звільнення всієї ділянки.
mark-wrong-signal=Неправильний сигнал
missing-side-track=ТУТ БРАКУЄ: __1__, що відгороджує цю бічну колію від перехрестя. Жоден розклад не використовує цю колію, але те, що на ній стоїть, — запаркований потяг, потяг, яким ви керуєте вручну, — займає блок перехрестя й зупиняє всі потяги на основному маршруті.
size-more-trains=Межа на цьому маршруті — ПОТЯГИ: скрині тут заповнені на __2__, коли потяг від'їжджає, тож __1__ накопичується, поки жоден потяг не завантажується. Зараз звідси вирушає __3__ на потягах: __4__ (приблизно по __5__). Додайте потяг (чи вагони) й подивіться знову після кількох рейсів.
size-more-trains-unload=Межа — ПОТЯГИ: скрині тут спорожнюються між доставками, а __1__ накопичується на станції завантаження. Прибуває __2__ на потягах: __3__ (приблизно по __4__). Додайте потяг (чи вагони).
size-source-limit=Межа — ДЖЕРЕЛО, а не потяги: потяг стоїть тут __2__ часу в очікуванні завантаження, а скрині майже порожні. Тут виробляється приблизно __3__ __1__. Більше потягів не допоможе — розширте шахту чи виробництво. __plural_for_parameter__4__{1=Одного потяга досить.|rest=Менше ніж __4__ потягів дадуть те саме.}__
size-source-limit-unload=Надходить замало __1__ (__2__), і скрині тут спорожнюються — але й на станції завантаження нічого не накопичується. Межа — джерело, а не потяги: розширте те, що його виробляє.
size-demand-limit=Межа — ПОПИТ: потяги стоять тут __2__ часу в очікуванні розвантаження, а скрині повні. Фабрика бере приблизно __3__ __1__. __plural_for_parameter__4__{1=Нічого робити не треба.|rest=Вистачило б менше ніж __4__ потягів — або розвантажуйте швидше, якщо хочете більше.}__
size-balanced=Цей маршрут збалансований: приблизно __2__ __1__ на потягах: __3__.
size-more-platforms=Межа — ПЛАТФОРМА: потяг стоїть тут __1__ часу, а потяги, що прибувають, чекають на неї приблизно __2__ с. Збудуйте ще платформ (__3__) з тією самою назвою (зараз __4__) і задайте ліміт потягів на кожній.
size-facts=Виміряно за __1__ візитів: потяг кожні __2__ с, __3__ с на цій зупинці, __4__ с дорогою сюди, з них __5__ с очікування; платформа зайнята __6__ часу.
size-measuring=Щоб оцінити цей маршрут, потрібно візитів потяга: __1__. Спостерігаю далі.
limit-missing=__1__ потягів їдуть на платформи (__2__) з назвою __3__, і жоден ліміт потягів їх не стримує: ті __4__, що не вміщуються, стають у чергу на основній лінії перед станцією й блокують усіх інших. Задайте ліміт потягів 1 на кожній платформі (клацніть значок зупинки): зайві потяги тоді чекатимуть на станції, з якої їдуть.
stacker-spec=Якщо вони мають чекати поблизу: накопичувач із колій (__1__) по __2__ клітинок, що відгалужується щонайменше за __3__ клітинок до платформи; кожна колія — окрема зупинка чи просто колія. Збудуйте рейки — перевірка сигналів тоді розставить їх за вас.
limit-waiting=Потягів чекають на вільну платформу на __2__: __1__ (приблизно __3__ с на рейс), стоячи на станції, з якої їдуть. Нормально, якщо тій станції більше нічого не потрібно; інакше збудуйте накопичувач: колій (__4__) по __5__ клітинок перед платформою.
limit-even=__1__ платформ мають назву __2__ без лімітів потягів: потяги вибирають найближчу й стають там у чергу. Ліміт 1 на кожній розподілить їх.
fix-limit-tooltip=Задати ліміт потягів __1__ на кожній платформі з цією назвою
steps-stuck=Цей потяг застряг. Що зробити (__1__), у такому порядку — після кроку __2__ він знову рушить, решта підтримає рух.
steps-improve=Що зробити для цього маршруту (__1__), найважливіше першим.
limit-unneeded=__1__ потягів ділять платформи (__2__) з назвою __3__ без ліміту потягів. Поки що це коштує мало: потяги, що прибувають, чекають приблизно __4__ с. Якщо черги колись дійдуть до основної лінії, задайте ліміт 1 (клацніть значок зупинки).
size-nothing-loaded=Потяги їдуть звідси ПОРОЖНІМИ, хоча скрині біля колії заповнені на __1__: нічого не завантажується. Потяг стоїть лише __2__ с. Перевірте маніпулятори завантаження (чи мають вони живлення, чи дістають до вагонів?) і умову відправлення в розкладі — «вантаж повний» чи «бездіяльність» змушує потяг чекати, доки його завантажать.
size-nothing=Потяги приїжджають і їдуть, а їхній вантаж ніколи не змінюється (__1__ візитів по __2__ с): вони катаються дарма. Перевірте маніпулятори чи помпи на цій зупинці й умову відправлення в розкладі.
size-never-unloaded=Потяги возять близько __1__ предметів і ніколи їх не позбуваються: вантаж однаковий під час прибуття й від'їзду (__2__ с на цій зупинці). Кінець розвантаження його не забирає — перевірте маніпулятори розвантаження (живлення, досяжність), чи не повні скрині за ними й умову відправлення («вантаж порожній»).
fix-plan-tooltip=Показати у світі всі відсутні й неправильні сигнали цієї мережі з однією кнопкою, щоб розмістити їх усі як привиди
net-row=Сигнали __1__: бракує __2__, неправильного типу __3__, прибрати __4__
net-row-tooltip=Перевірено за ВСІМА розкладами цієї залізничної мережі: маршрутів __1__ між __2__ зупинками, потяги до __3__ клітинок завдовжки. Клацніть ланцюговий сигнал, щоб побачити всі місця у світі й розмістити їх як привиди; ціль переходить до першого.
