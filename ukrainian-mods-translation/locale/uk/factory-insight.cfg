root-transport=__1__ виробляється (__3__ (__2__) переповнені), але не надходить: виправте конвеєр, маніпулятори чи потяг між ними
root-unclear=__1__ не надходить, хоча його __3__ (__2__) мають запас часу: наведіть на машину, що чекає, щоб простежити маршрут

