[mod-setting-description]
fi-enabled=Для кожного гравця. Гравці, що вимкнули це, ніколи нічого не бачать від цього моду: ні панелі, ні накладки, ні повідомлень.
fi-language=Мова панелей і повідомлень цього моду, незалежна від мови гри. Назви, які надає сама гра (машини, предмети, рядок стану), завжди відповідають мові гри.
fi-hover-mode=Що відкриває інспектор, коли ви на це наводите. Будь-що завжди можна оглянути гарячою клавішею (типово ALT + I).
fi-hover-display=На машині: поки ви наводите на машину, її проблема малюється просто на ній — кільце розподілу останньої хвилини навколо значка того, чого їй бракує, ефективність під ним, а над ним не більше трьох коротких рядків: що не так, чому (ланцюжок причин значками, що закінчується першопричиною) і що робити. Постачальники на шляху й першопричина отримують власні позначки у світі. Вікно не відкривається; закріпіть машину (ALT + I), щоб отримати вікно з усіма подробицями й кнопками. Потяги, зупинки, сигнали й рейки завжди використовують вікно. Бачите це лише ви. У вікні інспектора: вікно відкривається, поки ви на щось наводите, як і раніше.
fi-panel-position=Куди відкривається вікно інспектора: вікно закріпленої машини (ALT + I), коли діагноз показується на машині, або вікно, що відкривається під час наведення, коли діагноз показується у вікні. Усередині власної панелі гри (лише під час наведення, якщо «Показ діагнозу» — у вікні): діагноз пишеться в рядок стану ігрової інформації про об'єкт праворуч; оскільки цей рядок належить машині, інший гравець, що наводить на ту саму машину в ту саму мить, теж його бачить; закріплена машина отримує прикріплене вікно. Праворуч: у тому ж стовпці, що й ігрова інформація про об'єкт, унизу екрана. Прикріплено: у вільному місці внизу ліворуч, між комірками зброї й панеллю швидкого доступу. Вільно: перетягніть куди завгодно, позиція запам'ятовується.
fi-panel-style=Наскільки прозора панель інспектора.
fi-block-reach=Коли ви оглядаєте машину, мод іде за її маніпуляторами, конвеєрами, скринями й трубами (хоч якими довгими), щоб знайти машини, що її постачають, машини, які постачає вона, і всі машини, що виконують ту саму роботу на тих самих лініях. Він обводить їх у світі, показує, що тече між групами, і перевіряє співвідношення. Цей параметр — скільки рівнів постачальників назад він іде: складальний автомат <- його постачальники <- їхні постачальники ...
fi-hide-delay=Діагноз (на машині чи у вікні інспектора) зникає через цей час після того, як миша залишила машину, якщо її не закріплено. 0 — ніколи автоматично.
fi-overlay-radius=Як далеко навколо вас малюються вогники стану накладки світу.
fi-highlight-culprits=Позначає ланцюжок причин у світі: проміжні постачальники отримують жовті дужки й маленьке кільце з тим, чого бракує ЇМ, першопричина — червоні дужки й попереджувальний знак, а одна лінія веде від машини через них до першопричини. Бачите це лише ви.
fi-signal-planner=Автоматично: наведення на потяг, зупинку, сигнал чи рейку й огляд самі перевіряють, де залізниці потрібні сигнали (відсутні, неправильного типу, зайві) — якщо мережа досить мала, щоб спланувати її без підгальмовування гри; більша отримує рядок із кнопкою, або натисніть гарячу клавішу (типово ALT + G). Лише на запит: це відбувається лише після натискання гарячої клавіші. Вимкнено: жодного плану сигналів і жодних підказок щодо сигналів в огляді. «Лікар потягів» (чому потяг не має шляху, хто його блокує) працює в будь-якому разі.
fi-alerts=Показує одне з власних сповіщень гри — лише вам — коли щось ось-ось закінчиться (руда під вашими бурами, паливо машин, що заправляються автоматично, локомотиви з малим запасом палива), коли потяги остаточно блокують одне одного або коли група машин зі списку спостереження падає нижче вашої межі. Вимкнено: жодних сповіщень (ті, що на екрані, одразу зникають). Три параметри нижче вимикають окремі види. Поки сповіщення ввімкнені хоч для когось, мод у фоні переглядає бури й паливні машини, по кілька за тік.
fi-alert-ore=Руда під вашими бурами закінчиться протягом часу попередження.
fi-alert-fuel=У машини, що заправляється автоматично (маніпулятором, завантажувачем чи буром), закінчується паливо: постачання палива припинилося. Машини, які ви заправляєте вручну, — кам'яні печі й паливні бури ранньої гри — ніколи не повідомляються.
fi-alert-trains=Локомотиви майже без палива й потяги, що остаточно блокують одне одного (взаємоблокування).
fi-alert-sound=Короткий звук, коли з'являється нове сповіщення Factory Insight.
fi-runway-horizon=Прогнози, ближчі за цей час, викликають сповіщення (і ще раз, коли лишається лише 5 хвилин). Огляд завжди показує те, що закінчиться протягом удвічі довшого часу.
fi-watch-threshold=Група машин під спостереженням викликає сповіщення, коли її ефективність (поки вона потрібна) тримається нижче цього. Додавайте машини до списку спостереження клавішами SHIFT + ALT + I чи кнопкою з попереджувальним знаком в інспекторі.

