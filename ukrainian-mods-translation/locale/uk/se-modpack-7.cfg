[string-mod-setting-description]
color-coded-pipes-recipe-ingredients-base-ingredients=Кольорові рецепти використовують ті самі інгредієнти, що й базові рецепти \nПриклад: якщо базовий рецепт труби потребує 1 залізну пластину, рецепт червоної труби теж потребуватиме 1 залізну пластину
color-coded-pipes-recipe-ingredients-base-item=Кольорові рецепти використовують базовий предмет як інгредієнт \nПриклад: незалежно від базового рецепта труби, рецепт червоної труби використовуватиме базову трубу

