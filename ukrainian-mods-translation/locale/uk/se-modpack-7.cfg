[mod-setting-description]
color-coded-main-menu-simulations=Увімкніть, щоб замінити труби в симуляціях головного меню кольоровими \nВимкніть, щоб залишити симуляції без змін
color-coded-pipes-show-rainbow-recipes=Увімкніть, щоб показувати кольорові рецепти для кольорів веселки: червоного, помаранчевого, жовтого, зеленого, синього, бузкового, рожевого, чорного та білого \nВимкніть, щоб приховати рецепти
color-coded-pipes-show-fluid-recipes=Увімкніть, щоб показувати кольорові рецепти для кожної рідини \nВимкніть, щоб приховати рецепти
color-coded-pipes-show-pride-recipes=Увімкніть, щоб показувати кольорові рецепти для різних прапорів прайду \nВимкніть, щоб приховати рецепти
color-coded-pipes-regroup-recipes=Увімкніть, щоб перенести базові рецепти на вкладку кольорового виготовлення \nВимкніть, щоб залишити базові рецепти на їхніх місцях
color-coded-pipes-sort-recipes-by-color=Увімкніть, щоб показувати по одному рядку на колір з усіма типами труб у ньому \nВимкніть, щоб залишити по одному рядку на тип труби
color-coded-pipes-recipe-ingredients=Виберіть, чи кольорові рецепти використовують базові інгредієнти (напр. залізну пластину), чи базовий предмет (напр. трубу)
zith-storage-tank-1x1-volume-setting=Типова щільність: 3 тис. одиниць рідини/газу на клітинку.
zith-storage-tank-2x2-volume-setting=Типова щільність: 3 тис. одиниць рідини/газу на клітинку.
zith-storage-tank-3x4-volume-setting=Типова щільність: 6 тис. одиниць рідини/газу на клітинку.
zith-storage-tank-5x5-volume-setting=Типова щільність: 6 тис. одиниць рідини/газу на клітинку.

