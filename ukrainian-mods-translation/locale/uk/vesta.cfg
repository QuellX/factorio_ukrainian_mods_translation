[mod-setting-description]
ske_fusion_thruster_og=Повертає характеристики термоядерного прискорювача до послаблень версії 2.0.31 — це дає шалену тягу. У поєднанні з термоядерними ракетами ваші кораблі долітатимуть надшвидко й надбезпечно.
ske_realistic_gases=Замінює барвисті гази на загальноприйнятіші кольори.
ske_vesta_gases=Якщо вимкнено, Vesta використовує спільні гази. Якщо мод несумісний з іншими модами щодо рідин, увімкніть цей параметр — різні гази Vesta стануть незалежними. Однак це означатиме дублювання.
ske_disable_metal_and_stars_bots=Типово вимкнено. Якщо граєте з Metal and Stars і не хочете отримувати з нього антиматерієвих роботів, увімкніть цей параметр.
ske_vesta_original_generation=Якщо ввімкнено, Vesta матиме оригінальну генерацію: поверхню газового гіганта прикрашатимуть великі скелясті платформи, захоплені його полем тяжіння. Чудово для невимушеної гри. Якщо вимкнено, Vesta буде реалістичним газовим гігантом лише з платформою газового гіганта як місцем появи й без іншої суші. Чудово для тих, хто шукає виклику.
ske_vesta_legacy_recipes=Повертає оригінальні рецепти й ланцюжок технологій версії 1.0; ця версія Vesta має більше проміжних продуктів і будівлі, що можуть працювати лише на планеті. Новий вміст для планети здебільшого додаватиметься сюди. Якщо хочете значно легший і простіший досвід, вимкніть цей параметр.
ske_easy_fluids=Якщо ввімкнено, більшість рецептів на Vesta потребуватимуть значно менше газів. Не впливає на складний режим.

