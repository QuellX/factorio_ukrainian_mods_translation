[technology-description]
dt-fuel=Суміш дейтерію й тритію слугує каталізатором багатьох плазмових реакцій.
hot-lithium-production=Тепло як каталізатор викликає в літії реакцію, що дає змогу видобувати тритій.
tritium-production=Тритій — важливий продукт для плазмових процесів.
hot-heavy-water-production=Нагрівання важкої води й сірководню дає змогу легко видобувати дейтерій.
deuterium-production=Дейтерій — важливий продукт для плазмових процесів.
s1_cluster_processing=На сусідніх скелях знайдено кальциновані сліди заліза й міді. Схоже, на скелях живуть водорості, що відкладають звичайні метали в кристалічній формі.
s1_ammonia_chilled_plate=Сталь і залізо, нагріті разом і швидко охолоджені, утворюють сплав, що витримує екстремальні температури.
s1_brine=Перетворення води на розсіл — важливий крок у виробництві газоподібного тритію. Хм, хіба я не бачив цього процесу десь раніше?
s1_exotic_algae=Можна дослідити екзотичніші рецепти з водоростями.
s1_iridium_plate=Іридієва пластина витримує екстремальні температури, що виникають під час намагнічування.
s1_nutrients_from_co2=Схоже, вуглекислий газ — найсприятливіше середовище для мікроорганізмів Vesta.
s1_vestan_char=Вуглець можна далі нагрівати й обробляти на легкозаймистіший матеріал.
s1_sandceramicmesh=Іноді, щоб досягти великого!.. треба почати з малого. Навіть дрібно подрібненого.
fusion-missile=Магнітні сплави можуть утримувати нестабільну плазму, що водночас потужна й розтікається. Ці ракети завдають високої шкоди у великому радіусі.
ske_fusion_thruster=Наші прискорювачі можна ще вдосконалити: тепер вони використовують силу плазми, щоб штовхати платформи швидше й далі, ніж будь-коли, на енергоефективнішому джерелі живлення.
ske_fusion-thruster=Наші прискорювачі можна ще вдосконалити: тепер вони використовують силу плазми, щоб штовхати платформи швидше й далі, ніж будь-коли, на енергоефективнішому джерелі живлення.
s2_transport-belt-capacity-vesta=Пропускна здатність конвеєру (Vesta)
s2_worker-robots-storage-vesta=Вантажопідйомність роботів-робочих (Vesta)
transport-belt-capacity-vesta=Пропускна здатність конвеєру (Vesta)
worker-robots-storage-vesta=Вантажопідйомність роботів-робочих (Vesta)
s1_dueterium=Виробництво досконалішого термоядерного палива можливе завдяки елементам атмосфери Vesta. Розкладаючи різні сполуки, їх можна переробити на чисті ізотопи водню. Як не дивно, дейтерій і тритій потрібні для виробництва іридію.
s1_iridium=Іридієві пластини достатньо міцні й жаростійкі, щоб створити тепле середовище, де водорості ростуть, не гинучи від спеки.
s1_algea_discovery=Різні гази атмосфери Vesta — дім для багатьох мікробних видів. Сліди цих мікробів можна видобувати з газів, і за ретельного вирощування вони стануть нашим єдиним способом отримувати ресурси, зокрема залізо й мідь.
s1_algea_extracting=Водорості Vesta надзвичайно життєздатні й добре еволюціонували. Якщо згодовувати їм певні гази й тепло, вони змінюють свій склад і нарощують металеві сполуки, подібно до бактеріальних мікробів Ґлеби. Ці металеві сполуки потім можна обробити спалюванням і отримати різні металеві ресурси.
s1_gas_manipulation_science_pack=Дослідження різних вдосконалень технологій, пов'язаних із газами
s2_fusion_enhancements=Подальший розвиток наших проривів у термоядерній енергетиці.
planet-discovery-vesta=Дослідіть переважно газовий гігант Vesta. Схоже, у його газовому полі застрягли скелясті утворення. Газова оболонка — суміш багатьох простих газів, зокрема водню, азоту, вуглекислого газу й гелію. У газовому полі, схоже, є сліди різних домішок, які можна відфільтрувати.
s1_algea_filtering=Фільтри дають змогу легко вловлювати скупчення водоростей, вирощених у наших водоймах. Однак підійде не будь-який фільтр — його треба спеціально розробити, щоб відокремлювати водорості, не пошкоджуючи їхньої структури.
s1_algea_filtering_2=Фільтри можна очищати, повертаючи собі фільтр і трохи додаткових водоростей.
s1_algea_oversaturation=Перегодовування місцевих водоростей Vesta робить їх дуже поживними. Вони можуть слугувати місцевим замінником поживних речовин і не псуються з часом!
s1_algea_culturing=Різні гази атмосфери Vesta — дім для багатьох мікробних видів. Сліди цих мікробів можна видобувати з газів, і за ретельного вирощування вони стануть нашим єдиним способом отримувати ресурси, зокрема залізо й мідь.
s1_algea_treatment=Водорості Vesta надзвичайно життєздатні й добре еволюціонували. Якщо згодовувати їм певні гази й тепло, вони змінюють свій склад і нарощують металеві сполуки, подібно до бактеріальних мікробів Ґлеби. Ці металеві сполуки потім можна обробити спалюванням і отримати різні металеві ресурси.
s1_electrolysis=Іноді відповідь на наші проблеми — не тепло, а електрика. Подаючи велику напругу на різні види речовини, можна змінити її склад. Деякі водорості можуть неочікувано реагувати на електрику.
s1_supermagnet=Великі електричні струми в торі створюють поля інтенсивної магнітної енергії. Ці поля можна використовувати, щоб збуджувати й заряджати різні ресурси, активуючи їх. Деякі водорості можуть реагувати на цю енергію не так, як очікується.
s1_t2d2=Виробництво досконалішого термоядерного палива можливе завдяки елементам атмосфери Vesta. Розкладаючи різні сполуки, їх можна переробити на чисті речовини, що ще більше просунуть наші прориви в термоядерній енергетиці.
s2_fusion_robots=Маючи вдосконалене вироблення енергії, логічно вдосконалити тією ж технологією логістику й роботів. Ці роботи живитимуться термоядерною енергією на ДТ-паливі й споживатимуть менше енергії, тож працюватимуть довше.
s2_plasma_pipes=Плазму з термоядерних реакцій раніше не можна було переміщувати чи керувати нею — до сьогодні. Обмотавши посилений каркас труби мідними котушками й вистеливши нутрощі міцними жаростійкими прометієвими сплавами, можна вільно спрямовувати плазму куди завгодно. Однак через природу цієї речовини такі труби не можна прокладати під землею.
s2_plateworkings=Водень і кисень — чудові каталізатори під час виплавки руди. Вихід базових металів, як-от міді й заліза, можна збільшити, використовуючи під час спалювання один із цих газів. Водень дає більший вихід за трохи повільнішої обробки, а кисень обробляє надзвичайно швидко.
s2_intermediate_productivity=Збільшує виробництво найчастіше виготовлюваних предметів.
s1_algea_rare_metals=Рідкісні метали потрібні для виробництва процесорів та інших предметів, але на Vesta немає їхніх джерел. Можна вивести різновид водоростей, що кальцинуватиме ці метали для нас.
ske_heating_conductor=Іноді лише тепло може змінити молекулярну структуру. Нагрівальний провідник приймає кілька рідин чи предметів і піддає їх інтенсивному нагріванню, створюючи новий матеріал.
hydrogen-sulfide=Сірководень потрібен для виробництва газоподібного дейтерію. Якщо виробляти його поза Vesta, створення термоядерних роботів просто на інших планетах стане не мрією, а реальністю.
ske_carbon_dioxide_offworld=Виробництво вуглекислого газу має бути простим: нагріти джерело вуглецю до екстремальних температур і поєднати з джерелом кисню, як-от водою.
carbon-dioxide=Виробництво вуглекислого газу має бути простим: нагріти джерело вуглецю до екстремальних температур і поєднати з джерелом кисню, як-от водою.
ske_working_with_gases=Гази — більшість ресурсів Vesta. Їх можна видобувати з моря хмар береговими помпами.
ske_gas_giant_platform=Розширюватися над морем хмар не так складно, як здається. Воно достатньо щільне, щоб витримати навіть найважчі фундаментні конструкції, тож розширюватися легко.

