rubia=○🌐Відкрийте вітряну планету Rubia. Уся ваша фабрика має підлаштовуватися під вітер, поки на базу безупинно летить шквал відходів. Конвеєри й маніпулятори на Rubia працюють інакше, що створює унікальні будівельні виклики, яких немає на жодній іншій планеті.

