biofusion-bacteria-release=Розмноження ключових бактерій Ґлеби більше не прив'язане до її поверхні.
rubia-craptonite-lamp=Збільшено радіус освітлення персонажа в западині.
rubia-bio-utility-science-pack-unlock=__ITEM__utility-science-pack__ тепер можна виготовляти в __ENTITY__biochamber__ з вищою ефективністю.
rubia-zoom-modifier=Діапазон масштабу +__1__%
