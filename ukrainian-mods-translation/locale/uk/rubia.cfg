crapapult=Запускайте свої проблеми за вітром, щоб позбутися непотрібних предметів, продовжуючи кругообіг брухту на цій планеті
rubia-sniper-turret=Турель з більшою дальністю
medium-trashsteroid=Сміття, яке вітер жбурляє з великою швидкістю. Його здоров'я залежить від рівнів ваших технологій зброї, але вищі рівні шкоди все одно дуже корисні. Сміттєроїди мають невеликий шанс завдати критичного удару.
rubia-spidertron-remnants=Цікаво, що ця штука везла.
rubia-junk-pile=Зовнішній каркас, мабуть, захистив якісь матеріали всередині.
rubia-bacterial-sludge=Жирна рідина, повна певних бактерій.
rubia-wind-turbine=Перетворює енергію вітру на електрику.
garbo-grabber=Збирає __ITEM__craptonite-chunk__ з __ENTITY__medium-trashsteroid__, знищених у його радіусі.
biorecycling-plant=Завод біопереробки
rci-rocketizer=Розмістіть [entity=rci-rocketizer] поруч із [entity=rocket-silo]. Усі вкладені в нього предмети передаються у вантаж ракети. Це дає змогу експортувати матеріали, з яких виготовляють деталі ракети (як-от [item=craptonite-frame]), без [entity=logistic-robot].
craptonite-wall=Надзвичайно міцні стіни, що можуть блокувати рух [entity=medium-trashsteroid].

