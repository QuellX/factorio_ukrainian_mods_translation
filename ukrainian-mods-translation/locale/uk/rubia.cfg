[tips-and-tricks-item-description]
rubia-briefing=[img=utility/warning_icon][img=utility/warning_icon][color=250,250,0][font=default-semibold]УВАГА![/font][/color][img=utility/warning_icon][img=utility/warning_icon]  Пасажири вантажних капсул отримують СИЛЬНУ шкоду від удару під час входу в повітряний простір Rubia. Щоб безпечно приземлитися на Rubia, треба витримувати велику шкоду від удару, інакше [color=250,250,0][font=default-semibold]ВИ ЗАГИНЕТЕ ПІД ЧАС ПОСАДКИ[/font][/color]. Передумови [technology=planet-discovery-rubia] дають змогу виготовити все потрібне для посадки. Після проходження Rubia [technology=planetslib-rubia-cargo-drops] дає змогу вільно подорожувати без спорядження.\n\n[planet=rubia] — планета-смітник з постійними ураганними вітрами. Вітер обмежує напрямок кількох типів об'єктів і безупинно бомбардує поверхню сміттєроїдами. Планета вкрита багатим на ресурси брухтом, який можна перетворити на корисні матеріали за допомогою мікробів у [entity=biorecycling-plant]. Велика кількість уламків в атмосфері не дає безпечно запускати ракети без [technology=rubia-project-trashdragon] і блокує доставку вантажними капсулами без [technology=planetslib-rubia-cargo-drops].
rubia-trashsteroid-tips=Сміттєроїди — постійна загроза на Rubia:\n   • [entity=medium-trashsteroid] бомбардують вашу базу, і від них потрібно захищатися турелями.\n   • Сміттєроїди, що падають, завдають шкоди з невеликим шансом критичного удару, який визначається один раз для кожного сміттєроїда.\n   • [entity=cargo-pod] отримують СИЛЬНУ шкоду від удару під час входу без [technology=planetslib-rubia-cargo-drops].\n   • [entity=rocket-silo] не може безпечно запускати ракети без [technology=rubia-project-trashdragon].\n   • [entity=garbo-grabber] збирає [item=craptonite-chunk] лише зі сміттєроїдів, знищених фізичною/вибуховою шкодою в його радіусі.\n   • Деякі об'єкти невразливі до бомбардування, як-от [item=rail], [entity=rail-signal], [entity=rubia-armored-locomotive], пов'язані об'єкти й будь-який об'єкт, виготовлений з [item=craptonite-frame].\n   • [entity=craptonite-wall] блокують рух сміттєроїдів, але не їх появу. Самі стіни невразливі до ударів, але інші об'єкти в зоні ураження отримують шкоду як зазвичай.\n   • [technology=physical-projectile-damage-1]/[technology=weapon-shooting-speed-1] тощо роблять [entity=medium-trashsteroid] міцнішими. Вищі рівні технологій усе одно дають суттєву перевагу — просто не таку величезну, як можна очікувати.\n   • Налаштування складності мода Rubia масштабують здоров'я сміттєроїдів і їхню шкоду.\n\n[font=default-semibold]Поради для мегабаз/UPS:[/font]\n   • Якщо не дивитися на Rubia, її навантаження на UPS значно знижується, бо багато часу йде на рендеринг сміттєроїдів.\n   • Сміттєроїди з'являються лише в чанках, де є щось вразливе до них, АБО в чанках у полі зору гравця.\n   • Не бійтеся досліджувати великі ділянки поверхні Rubia. Я тижнями оптимізував сміттєроїди, щоб не витрачати час процесора на непотрібні чанки мапи.\n   • Знищені сміттєроїди не навантажують UPS.\n   • Налаштування мода "Мапа > Rubia > Режим мегабази" зменшує навантаження на UPS для дуже великих баз, але знерухомлює сміттєроїдів.
rubia-wind-tips=Східний вітер має такі ефекти:\n   • [entity=inserter] і [entity=splitter] можуть переміщувати предмети лише праворуч.\n   • [entity=transport-belt], [entity=underground-belt] і [entity=electric-mining-drill] не можуть переміщувати предмети ліворуч.\n   • [entity=logistic-robot] не може безпечно долетіти до [entity=requester-chest], [entity=buffer-chest], [entity=active-provider-chest] чи [entity=rocket-silo].\n   • [entity=locomotive], [entity=cargo-wagon], [entity=recycler] і пов'язані об'єкти не витримують вітру.\n   • [entity=rubia-wind-turbine] вироблятиме енергію.\n\n-----------\nПовний перелік об'єктів, заборонених на Rubia:
rubia-crapapult-tips=[entity=crapapult] може знищити [color=250,250,0][font=default-semibold]майже будь-який предмет[/font][/color], вистріливши його у вітри Rubia.\nБагато технологій досліджуються пострілами великою кількістю певного предмета. Брухтомет НЕ є військовою спорудою.
rubia-garbo-grabber-tips=Якщо знищити [entity=medium-trashsteroid] фізичними/вибуховими боєприпасами в радіусі [entity=garbo-grabber], він збере [item=craptonite-chunk].
rubia-craptonite-wall-tips=[entity=craptonite-wall] може блокувати рух [entity=medium-trashsteroid].
