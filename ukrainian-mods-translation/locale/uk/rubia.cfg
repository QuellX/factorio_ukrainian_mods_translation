[alert]
wind_correction_notification=Вітер повернув вашу машину!
wind_block_notification=Вітер заблокував цей напрямок!
wind_full_block_notification=Вітер заблокував цю машину!
pre-rubia-recommended-difficulty=Рекомендована складність планети Rubia для вашого поточного рівня технологій: [color=0,250,250]"__1__".[/color]\nЇї можна змінити в Налаштування/Налаштування модів/Мапа/Rubia, не виходячи з гри. Рекомендується задати складність до польоту на Rubia.
pre-rubia-cutscene-prepared=Ви почуваєтеся готовим до Rubia, але чи готова Rubia до вас?
pre-rubia-cutscene-unprepared=Вас гризе відчуття, що ви недостатньо озброєні для Rubia — ніби забули прочитати щось критично важливе перед вильотом.
pre-rubia-cutscene-unprepared-naked=Мороз пробігає по спині. Ви геть беззахисні, і ця подорож закінчиться неминучою смертю.
pre-rubia-cutscene-unprepared-low-shield=Ви почуваєтеся майже беззахисним. Вашого захисту й близько не вистачить, щоб приземлитися на Rubia живим.
pre-rubia-cutscene-unprepared-medium-shield=Здається, у вас лише приблизно половина спорядження, потрібного, щоб приземлитися на Rubia й не загинути.
pre-rubia-cutscene-unprepared-almost-shield=Здається, вам зовсім трохи бракує, щоб приземлитися на Rubia й не загинути.
pre-rubia-cutscene-unprepared-too-close=Ви не певні, чи маєте все потрібне, щоб приземлитися на Rubia й не загинути. Шанси надто рівні.
landing-cutscene-part1=[img=utility/danger_icon] Корпус пошкоджено
landing-cutscene-part2=[img=utility/danger_icon] Посадкові двигуни знищено
landing-cutscene-part3=[img=utility/danger_icon] Аварійні двигуни пошкоджено. Приготуйтеся до удару
on-player-died-on-entry=Ви загинули від сильного удару під час входу на планету. Щоб пережити таку подорож, треба витримувати більше шкоди.
landing-cutscene-abort-external-mod=(Rubia): Ви не можете приземлитися на планету Rubia без кращого захисту. Ви використовуєте мод, що пропускає космічні подорожі, але все одно маєте виконати вимоги для безпечної посадки на Rubia. Докладніше — в інструктажі щодо планети Rubia.
promethium_warning=⚠️ У вас досліджено нескінченну продуктивність досліджень, і Rubia додала свій дослідницький пакет до її вартості. Цю поведінку можна вимкнути в налаштуваннях мода, якщо вона вам не потрібна. Це попередження більше не з'явиться в цьому збереженні.
rocketizer-warning=⚠️ У вашій базі був __ENTITY__rci-rocketizer__ ще до встановлення Rubia. Типово Rubia змінює вимоги до відкриття й рецепт цього предмета. Цю поведінку можна змінити в "Налаштуваннях модів". Це попередження більше не з'явиться в цьому збереженні.
rubia-rocket-silo-setting-warning=[img=utility/danger_icon]УВАГА: [entity=logistic-robot] не може долетіти до ракетних шахт на Rubia. Автоматичні логістичні запити вимикаються.

[version-change-warnings]
rubia-trashsteroid-health-scaling=(Loup&Snoop / Rubia): Тож... не сердьтеся, але я виправив баг, через який здоров'я сміттєроїдів не масштабувалося як слід, коли у вас високий рівень технології фізичної шкоди... Цілком зрозуміла помилка! Зате я додав налаштування складності в Налаштування модів => Налаштування мапи. Якщо ваша база раптом почне вибухати, скористайтеся ними. Щасти!
rubia-craptonite-wall=(Loup&Snoop / Rubia): Гарні новини! Скраптонітові стіни посилено в нещодавньому оновленні. Подробиці — в їхній технології або в "Порадах і хитрощах".
rubia-craptonite-wall-recipe=(Loup&Snoop / Rubia): Увага: рецепт скраптонітових стін змінено, а специфічний для Rubia рецепт очищеного бетону видалено.
rubia-factorissimo-destruction_warning=(Rubia): Фабрики Factorissimo на Rubia буде знищено за __1__ хв. Повернення до старішої версії спричинить збій.
rubia-bzmod-silo-recipe-change=(Rubia): Увага: Rubia щойно змінила рецепти ракетних шахт для пакета модів BZ. Базовий рецепт шахти знову використовує припій.
rubia-tangible-projectile-mod-warning=(Loup&Snoop / Rubia): Увага. Ви використовуєте мод, що робить кулі справжніми снарядами (distant misfire). Це робить Rubia значно складнішою, ніж задумано.
rubia-tech-cost-multiplier-warning=(Loup&Snoop / Rubia): Примітка: ви граєте з множниками вартості технологій, але для Rubia стоїть типовий x1. Тригерні технології Rubia мають власний окремий множник вартості, який задається в параметрах запуску мода. Це зовсім необов'язково — просто повідомляємо. Це повідомлення більше не з'явиться.

