[technology-description]
rubia-progression-stage1=Ви виявили бактерію, що їсть брухт, і назвали її __ITEM__rubia-bacteria-A__. Можливо, ви дізнаєтеся щось нове, запускаючи снаряди за вітром.
rubia-progression-stage1B=Маючи початкове розуміння брухтомета, ви готові запускати ще кращі матеріали заради науки.
rubia-progression-stage2=Сумлінне вивчення обробки біобрухту привело вас до нової форми бактерій, що їдять брухт, яку ви назвали __ITEM__rubia-bacteria-B__.
craptonite-processing=Після кількох експериментів на цій планеті ви відкрили один з найміцніших матеріалів у галактиці.
rubia-scrapapalooza=Завдяки складному процесу гібридизації ви навчилися виробляти кілька очищених продуктів одночасно. Однак з такою кількістю змінних результат не такий передбачуваний.
rubia-sniper-turret=Турель великої дальності з ефективнішими руйнівними можливостями.
rubia-postgame-biorecycle-part1=Лише запускаючи нафту на великій швидкості, ви змогли навчитися перетворювати ресурси цієї планети на додаткові очищені нафтопродукти.
rubia-long-bulk-inserter=Оснастіть довгорукі маніпулятори міцним скраптонітовим каркасом, що витримує величезний крутний момент під час швидких поворотів з великою кількістю предметів.
rubia-long-stack-inserter=Перлина Rubia. Завдяки міцному скраптонітовому каркасу, важкій урановій основі й гнучким захватам з вуглецевого волокна цей стосовий маніпулятор швидко скидає стоси предметів на більшу відстань. Повільніший за звичайний стосовий маніпулятор.
craptonite-wall=Використовує скраптонітове армування, щоб створити найміцніші оборонні споруди в галактиці.
craptonite-axe=Замініть свою стару сокиру міцною скраптонітовою, яка видобуває значно ефективніше. Відкриває доступ до різних скраптонітових аксесуарів.
rubia-efficiency-module4=Скрапталітичний перетворювач на вашій машині допомагає вловлювати частинки викидів, роблячи їх нешкідливими для довкілля.
rubia-holmium-craptalysis=Проходження руди крізь скрапталітичний перетворювач збуджує атоми гольмію, дозволяючи їм ефективніше вивільнятися й переходити в розчин.
craptonite-productivity=Нескінченне дослідження для покращення обробки скраптоніту.
rubia-braking-force-8=Нескінченне дослідження гальмування потягів, що дає їм змогу довше триматися на вищих швидкостях.
rubia-biofusion-science-pack=Останнє випробування Rubia: створити нечестиве зілля з ДНК форм життя з різних планет.
rubia-biofusion-science-pack-removed=Прибравши Ґлебу з проходження, ви втрачаєте доступ до вмісту Rubia після основної гри.\nПоточні причини: __1__
rubia-bio-flying-robot-frame=Завдяки біологічним маніпуляціям ви уявляєте, як бактерії складають каркаси роботів, пересуваючи крихітні деталі на місце. Процес швидкий, але марнотратний щодо матеріалів.
rubia-craptonite-boots=Чоботи з армуванням зі скраптоніту, оздобленням і підошвами з гольмієвого сплаву для швидшого бігу.
rubia-craptonite-hook=Скраптонітовий наруч з потужним механізмом, що вистрілює вольфрамовий гак на ланцюзі, щоб діставати на більшу відстань.
rubia-craptonite-satchel=Міцний ранець з тривкого вуглецевого волокна на надійному скраптонітовому каркасі.
rubia-craptonite-cannister=Сумнівний напій у каністрі з армуванням зі скраптоніту, охолоджений аквілонською кріогенікою. Попри шкідливі наслідки для здоров'я, цей напій наповнює вас енергією.
rubia-craptonite-eyedrop=Закапування еліксиру просто в очі (малими дозами) значно покращує зір гравця ціною дедалі більших шкідливих наслідків для здоров'я. Ефекти цього покращення можна вимкнути в налаштуваннях мода.
rubia-craptonite-circlet=Потужний скраптонітовий обруч, інкрустований шматочком найкращого кремнію в галактиці. Він випромінює якийсь наносигнал, що підвищує ефективність модулів.
rubia-craptonite-earring=Скраптонітова сережка, інкрустована плутонієм, підвищує нейтронну ефективність під час виготовлення плутонію.
rubia-craptonite-glove=Рукавиці з платиновим каталізатором на скраптонітовій підкладці дають змогу швидше виготовляти предмети.
rubia-craptonite-lamp=Тримайте на костюмі енергоощадну лампу. Її міцний скраптонітовий каркас витримує високий тиск, щоб освітлювати найтемніші глибини.
rubia-craptonite-belt-buckle=Зробіть скраптонітову пряжку, інкрустовану коштовним метеоритом з __PLANET__muluna__. Носіння її чомусь робить вас легшим і дає змогу бігати швидше.
rubia-craptonite-bracer=Скраптонітовий браслет, що тихо гуде кубічними мріями. Його слабке магнітне тяжіння робить далекі інструменти й розсипані матеріали трохи ближчими.
rubia-craptonite-wood-charm=Самі лише ці скраптонітові пиляльні диски вселяють страх у серце кожного лісу, вимагають шани від дерев і підвищують продуктивність лісопилки.
rubia-craptonite-codpiece=Обробляючи цей позолочений обладунок і припасовуючи його до власного, ви краще зрозуміли процеси переробки.
rubia-craptonite-sunglasses=Похизуйтеся вишуканим смаком у цих стильних сонцезахисних окулярах з етично видобутого скраптоніту. Діамантові лінзи виявляють точки напруження в сировині, підвищуючи продуктивність стиснення.
rubia-craptonite-grillz=Замінює гірші компоненти оцинкованим механічним варіантом, армованим скраптонітом. Ваша підвищена провідність покращує електрохімічну обробку, а також здоров'я гравця.
rubia-craptonite-stopwatch=Ви змайстрували цей секундомір з багатьох крихітних деталей з екзотичних актинідів, напханих у скраптонітовий корпус. Попри ваш сумнівний смак у моді, світний циферблат вициджує трохи більше збагаченого урану з кожного циклу виготовлення, і ваші запаси світяться трохи яскравіше.
rubia-craptonite-carrot=Механізм Rabbasca цього енергетичного підсилювача збирає слабкі енергетичні сигнатури в заряджене скраптонітове ядро. У поєднанні з рушієм "Кроликострибун" дає змогу кожному стрибку летіти далі, ніж раніше.
planet-discovery-rubia=Вітряна планета, вкрита сміттям. Низька гравітація й сильні вітри постійно підхоплюють уламки й жбурляють їх з великою швидкістю, зокрема й на низькій орбіті. На цій планеті живуть корисні мікроби, що дають змогу перетворювати мотлох на корисніші матеріали. \n[img=utility/warning_icon]Інструктаж щодо планети — у [font=default-semibold]"Порадах і хитрощах"[/font].
operation-iron-man=Вдосконалені системи наведення й броньовані капсули дають змогу безпечно скидати вантажні капсули крізь ворожий повітряний простір Rubia.
rubia-unknown-technology=Щоб побачити, що чекає попереду, потрібно провести більше досліджень на Rubia.
rubia-progression-stage3=Ви вивчали сміття. Купалися в ньому. Воно вас сформувало. Нарешті ви готові вивести свої навички роботи з мотлохом на новий рівень.
rubia-armored-train=Нарешті ви можете створювати потяги, здатні протистояти вітрам планети Rubia.
rubia-project-trashdragon=Створюйте броньовані ракети, що витримують сильний шквал уламків у повітряному просторі Rubia.
rubia-nutrients-from-sludge=Навчіться фільтрувати й переробляти корисну органіку з бактеріального шламу на зручне біопаливо на Rubia.
rubia-nutrient-productivity=Виробляйте поживні речовини ефективніше.
rubia-biochamber-productivity-bonus=Великий досвід роботи з біологічними матеріалами дає змогу ефективніше використовувати біокамеру.
rubia-biofusion-promethium-science-pack=Використайте знання міжпланетної біології, щоб ефективніше виготовляти __ITEM__promethium-science-pack__.
rubia-cargo-landing-pad-capacity=Досвід керування скинутими вантажами крізь ворожий повітряний простір Rubia дає змогу облаштувати ще одну зону приземлення на кожній планеті.
rubia-bio-utility-science-pack=Ваш біологічний досвід дає змогу бачити життя навіть у роботах! Виготовляйте __ITEM__utility-science-pack__ у __ENTITY__biochamber__ з вищою ефективністю. З нетерпінням чекаємо вашого пояснення, як це працює, пане Експерте.
rubia-craptonite-hip-replacement=Сумнівними методами замініть хрящ стегна міцним скраптонітовим кульовим суглобом, закріпленим на кістках титаном Jahtran. Міцніший суглоб дає змогу носити важчі вантажі [font=default-tiny-bold]з кількома спотворювальними побічними ефектами.[/font]
rubia-craptonite-mask=Ця кричуща маска змушує вас вірити, що ви бачите крізь час.
rubia-craptonite-tiber-implant=Цей імплант боляче встромляє голки під шкіру, щоб ваша кров завжди мала тісний контакт із тиберієм. Тепер ви бачите тиберій у всьому.
rubia-craptonite-rainbow-brooch=Ця вишукана скраптонітова прикраса містить потужний призматичний самоцвіт, що робить власника сяйливим.
rubia-progression-stage1-compat-k2so=Дух Крастора тече у ваших жилах. Давні бактеріальні знання про виготовлення непотрібних дрібничок проникають у вашу товсту голову.

[achievement-name]
visit-rubia=Фотограф-брухтолюб
rubia-lore-complete=Досвідчений історик
rubia-easy-mode=Легкий шлях
rubia-very-very-hard-clear=Вижити в екстремальних умовах
land-on-rubia=Я вижив після падіння, і все, що отримав, — це дурне досягнення
research-with-biorecycling=Дослідження з наукою біопереробки

[achievement-description]
rubia-very-very-hard-clear=Пройдіть Rubia на екстремальній складності — від моменту посадки до злету.
land-on-rubia=Приземліться на Rubia й не загиньте.
research-with-biorecycling=Відкрийте дослідження, використовуючи в лабораторії науку біопереробки.
rubia-lore-complete=Знайдіть усі записи, досліджуючи купи сміття Rubia.
rubia-easy-mode=Виберіть відповідніший рівень складності для Rubia.

[mod-setting-name]
rubia-rabbasca-icon=Значок технології сумісності з Rabbasca
disable-lyrical-music=Вимкнути музику зі словами
remove-rubia-from-promethium_sci=Прибрати науку Rubia з прометієвих досліджень
require-rubia-for-endgame-planets=Вимагати проходження Rubia для відкриття планет кінця гри
rubia-difficulty-setting=Складність планети Rubia
rubia-rocketizer-early-unlock=Раннє відкриття ракетизатора
invert-trashsteroid-scaling=Інвертувати візуальне масштабування сміттєроїдів
rubia-megabase-mode=Режим мегабази
rubia-tech-cost-multiplier=Множник вартості тригерних технологій Rubia
rubia-zoom-change=Дозволити очні краплі
rubia-renai-special-trajectories=Унікальні траєкторії маніпуляторів-метальників на Rubia
rubia-buttplug-integration=Інтеграція з Buttplug

[mod-setting-description]
disable-lyrical-music=Робить саме те, що написано. Типово вимкнено — так мод задумано грати.
rubia-rabbasca-icon=Змінює значок технології сумісності з Rabbasca на один з варіантів нижче:\nваріант Saf the Lamb (з ракети й особистої батареї)\nваріант Osmo (більше схожий на моркву з дротами)
rubia-difficulty-setting=Посилює здоров'я сміттєроїдів, їхню шкоду й шкоду, отриману під час входу на планету Rubia. Ресурси й виготовлення не змінюються. Типово = Звичайна.\n[img=utility/warning_icon]УВАГА: "Дуже складна" вимагає фульґорських технологій (дерево технологій їх явно не вимагає), щоб узагалі приземлитися на Rubia.\n[img=utility/warning_icon]УВАГА: "Екстремальна" додатково вимагає обладнання якості [quality=epic], щоб приземлитися на Rubia.
rubia-buttplug-integration=Це налаштування нічого не робить, але його не можна приховати з набридливих ігрових причин. Воно має завжди залишатися вимкненим — заради вашого ж здорового глузду.
remove-rubia-from-promethium_sci=Якщо ввімкнено, дослідницький пакет Rubia НЕ буде потрібен для нескінченної технології продуктивності досліджень прометієвої науки. Типово вимкнено.
require-rubia-for-endgame-planets=Якщо ввімкнено, для відкриття планет кінця гри, як-от Аквіло, ТА планет кінця гри з модів, як-от Maraxsis, потрібно пройти Rubia. Типово ввімкнено.
rubia-rocketizer-early-unlock=Відкриває ракетизатор разом з ракетними шахтами (ніби Rubia не встановлено). Це налаштування для зворотної сумісності зі збереженнями, де "Rocket Cargo Insertion" встановили до завантаження Rubia. Будь ласка, не вмикайте, якщо це не ваш випадок. Типово вимкнено.
invert-trashsteroid-scaling=Сміттєроїди зменшуються під час удару (а не збільшуються). Лише візуально. Типово вимкнено.
rubia-megabase-mode=Якщо ввімкнено, сміттєроїди споживають менше UPS, стаючи нерухомими, але ЛИШЕ коли їх з'являється дуже багато. Змінює механіку. Типово вимкнено.
rubia-tech-cost-multiplier=На тригерні технології Rubia не діють стандартні налаштування множника вартості технологій. Це налаштування множить їхню вартість окремо. Більше число — дорожче. Типово = 1.
rubia-zoom-change=Якщо вимкнено, очні краплі не діятимуть. Типово ввімкнено.
rubia-renai-special-trajectories=Якщо ввімкнено, маніпулятори-метальники на Rubia матимуть унікальні траєкторії. Це більше навантажує UPS у Renai Transportation. Типово ввімкнено.

[string-mod-setting]
rubia-difficulty-setting-easy=1) Легка
rubia-difficulty-setting-normal=2) Звичайна
rubia-difficulty-setting-hard=3) Складна
rubia-difficulty-setting-very-hard=4) Дуже складна
rubia-difficulty-setting-very-very-hard=5) Екстремальна

[rubia-crapapult]
yeet-item=Запустити: __1__
yeet-recipe=Запустити: __1__
yeet-item-description=Запустити __1__ за вітром за допомогою __ENTITY__crapapult__
yeet-recipe-description=Запустити __1__ за вітром за допомогою __ENTITY__crapapult__.

[rubia-lore]
spidertron-mine-hint-part1=Ви знаходите дивну бактерію, що перетравлює металевий каркас павукотрона. Ви називаєте цей вид [font=compi]"__ITEM__rubia-bacteria-A__"[/font].
spidertron-mine-hint-part2=Ви не можете перестати думати про ті перші уламки павукотрона. Вас надихає ідея збудувати велику гармату, що [font=compi]вистрілює непотрібні предмети за вітром.[/font] Ви називаєте свою нову конструкцію [font=compi]"__ENTITY__crapapult__"[/font].
train-stop-mine-part5=Під цією зупинкою ви знаходите пошарпану книгу з історією вітру на цій планеті.
train-stop-mine-part5-2=Щойно ви гортаєте кілька сторінок, вітер вириває книгу з рук.
train-stop-mine-part7=Ви знаходите схованку з документами, що пропонують технології нейтралізації вітру. Результати експериментів, схоже, непереконливі.
rubia-notice-prestring=(Rubia)
spidertron-mine-part1=На цьому павукотроні був логістичний запит на якийсь куб.
spidertron-mine-part2=У вантажі цього павукотрона була зношена "Contem□□□□□on Card". Не маючи як її використати, ви кидаєте її назад за вітром, щоб більше ніколи не побачити.
spidertron-mine-part3=У цього павукотрона є диск з написом "Fas□□□ □□□n Light Th□□□□: □□rt C.". Він безнадійно пошкоджений і остаточно розсипається у вашому інвентарі.
spidertron-mine-part4=З усіх обшуканих павукотронів ясно, що куба — якщо він тут колись і був — на цій планеті вже точно немає.
spidertron-mine-destroyer-trap=Порпаючись у цьому павукотроні, ви випадково активуєте кілька капсул з руйнівниками всередині.
spidertron-mine-destroyer-trap-2=Ви замислюєтеся, що ж відбувалося на Rubia, якщо знадобилося будувати тих роботів-руйнівників.
train-stop-mine-part1=На цій іржавій зупинці висить потерта записка: "Я зіпсував співвідношення. Будь ласка, виправте — Trangar"
train-stop-mine-part2=На цьому стовпі знову й знову вирізано слово "ZIGGURAT".
train-stop-mine-part3=Колись ця зупинка називалася "Grak Pack".
train-stop-mine-part4=На цьому стовпі записка від "□□skid" з подробицями спроб приховати своє спагетімантство від колег.
train-stop-mine-part6=У цих уламках застряг запис, але його неможливо розібрати. Ви передаєте дані на головну базу для аналізу.
train-stop-mine-part6-2=Аналіз знайденого раніше запису завершено. Записи вказують на будівництво величезної залізничної лінії, що мала сягнути "краю світу". Незрозуміло, чи вдалося "Zyl□□□□".
train-stop-mine-part8-rand1=На цій зупинці була скриня "дживоліту". Заздрячи, що хтось інший першим так несмачно назвав цей мінерал, ви сердито розчавлюєте скриню.
train-stop-mine-part8-rand2=На цій зупинці була скриня "бобмонію". Ви сердито розчавлюєте скриню, заздрячи, що хтось дав цьому мінералу ще несмачнішу назву, ніж могли б ви.
train-stop-mine-part8-rand3=На цій зупинці була скриня "імерситу". Ви сумно викидаєте скриню, знаючи, що могли б дати цьому мінералу значно смішнішу назву.
train-stop-mine-part8-rand4=На цій зупинці була скриня "ступідію". Ви хихочете сам до себе, задоволений безглуздою назвою, яку хтось дав цьому елементу.
train-stop-mine-part8-rand5=На цій зупинці була скриня "некселіту". Він виглядає значно складнішим, ніж ви уявляли, тож ви обережно відходите від скрині.
train-stop-gun-turret-trap=Порпаючись у мотлоху, ви знаходите під уламками кулеметну турель з написом "□□□□ласність Боба". Ваша незграбність змушує її ожити.
junk-mine-part1=У цій купі ви знаходите пошарпане креслення від "Fr□□□". Воно не має сенсу, доки ви не нахилите його на 45 градусів. Ви сердито його викидаєте.
junk-mine-part2=У цій купі є малюнки когось на ім'я "HideBoar". Ви надійно ховаєте їх там, де інші не зможуть вас за них засудити.
junk-mine-part3=У цій купі мотлоху є відгук: "Maraxsis: 7/10. Забагато води". Ви спантеличені, але все одно не згодні.
junk-mine-part4-rand1=Ви знаходите розбиту фоторамку. На звороті написано "Jul□□□, □□ali, Lo□□, and □□ppy". Фото подряпане до невпізнанності.
junk-mine-part4-rand2=Ви знаходите розбиту фоторамку. На звороті написано "□□□vik, Ju□□□□, □□garre, and Buf□□□". Ви не знаєте цих людей, але сподіваєтеся, що в них усе гаразд.
junk-mine-part4-rand3=Ви знаходите розбиту фоторамку. На звороті написано "De□□□□□r, □0X, □□□□hiri, and □earw□□□". Фото подряпане до невпізнанності.
junk-mine-part4-rand4=Ви знаходите розбиту фоторамку. На звороті написано "□oj□, □□□itri, Fox□□□□". Ви замислюєтеся, чи ці люди ще знають одне одного.
junk-mine-part4-rand5=Ви знаходите розбиту фоторамку. На звороті написано "Grak□□□□, □□□□eymint, Ma□□, □□□□wuka". Фото ледь пахне піцою.
junk-mine-part4-rand6=Ви знаходите розбиту фоторамку. На звороті написано "Be□□□, □□□cado, Recor□□□, □□□box". Ви їх не знаєте, але сподіваєтеся, що в них усе добре.
junk-mine-part5=У цій купі був шматок "greel". На перший погляд він ні до чого не придатний, але видно, що на його виготовлення пішло чимало часу.
junk-mine-part6-rand1=Ви знаходите зламану гітару. На звороті підпис "□□□□□□ Dan". Цю гітару дуже любили.
junk-mine-part6-rand2=Ви знаходите зламану гітару. На звороті підпис "JJ". На ній ледь помітні сліди декоративних кольорів.
junk-mine-part6-rand3=Ви знаходите зламану гітару. На звороті підпис "□□□□□rat". Вона дуже зношена.
junk-mine-part7=У цій купі ви знаходите кам'яно-твердий тороїд у порваній обгортці з чеком на "Lau□□□□". Як жорстоко... Пліснява зробила його неїстівним!
junk-mine-grenade-trap=У цих уламках є коробка з маркуванням "□□ig□□□□/□□_□rt". Ви необережно її відкриваєте, і вміст вилітає назовні.
junk-mine-grenade-trap-2=Вибух знищив усе в тій коробці, зокрема якісь документи. Її вміст явно був призначений лише для їхніх очей.
all-lore-done=Навряд чи ви знайдете ще якісь цікаві послання з минулого.

[rubia-taunt]
rubia-first-blast-off-part1=(Rubia) І ось інженер злетів з Rubia, прагнучи підкорити нові планети.
forgot-roboport-failsafe=(Loup&Snoop) Ви забули взяти на Rubia особистий робопорт. Перевірте інвентар.
forgot-roboport-failsafe-part2=(Loup&Snoop) І цей робопорт не безкоштовний. Як компенсацію я з'їм вашу ліву ногу.
rubia-first-blast-off-part2=(Rubia): У космосі справді немає місця, безпечного від цієї загрози.
rubia-first-blast-off-part3=(Loup&Snoop): Вітаю з перемогою над Rubia. Я завжди в тобі сумнівався.
rubia-first-blast-off-part4-mp=(Loup&Snoop): А, я бачу, що тут сталося. Дякую всім, що так люб'язно дотягли __1__ до перемоги. Без вас нічого б не вийшло.
rubia-first-blast-off-part5-mp=(Loup&Snoop): Ні, справді. __1__ понад годину нічого не робив, поки всі інші виконували більшість роботи.
rubia-shield-warning-convo-part1=(exfret): Він нізащо не здогадається. Він надто дурний.
rubia-shield-warning-convo-part2=(Loup&Snoop): Я хочу вірити
rubia-shield-warning-convo-part3=(exfret): він точно розплющиться лол
rubia-shield-warning-convo-part4=(Loup&Snoop): ні-ні-ні. він повернеться. от побачиш!

