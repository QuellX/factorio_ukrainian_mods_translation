[controls]
spidertron-enhancements-open-vehicle-inventory=Відкритий інтерфейс автомобіля

[controls-description]
spidertron-enhancements-enter-vehicles=Результат залежить від того, чи перебуваєте ви у транспортному засобі, чи ні, і може бути налаштований у налаштуваннях мода.\n[color=red]Не встановлюйте те саме, що й у ванільному контролі [font=default-bold]Вхід/вихід з транспортного засобу[/font] (__CONTROL__toggle-driving__)[/color].
spidertron-enhancements-spidertron-patrol-pipette=Функціонує лише за умови встановлення Spidertron Patrols.\nВибирає пульт патрулювання, підключений до поточного вибраного павукотрона, і поміщає його під курсор.\nЯкщо поточний вибраний павукотрон відсутній, вибирає пульт патрулювання, підключений до павукотрона, яким ви керуєте наразі.

[string-mod-setting]
spidertron-enhancements-enter-entity-none=Нічого
spidertron-enhancements-enter-entity-trains=Тільки поїзди
spidertron-enhancements-enter-entity-all=Всі
spidertron-enhancements-spiderton-requires-fuel-Default=За замовчанням

[mod-setting-description]
spidertron-enhancements-enter-entity=Налаштуйте елементи керування у вкладці налаштувань [font=default-bold]На гравця[/font].

[entity-name]
spidertron-enhancements-dummy-spidertron=Подорожую __1__

[cursor-message]
spidertron-enhancements-player-contains-spidertron=Гравець вже містить __1__
spidertron-enhancements-robots-left-behind=__1__ будівельних роботів все ще активні
spidertron-enhancements-cannot-create-spidertron=__1__ не може бути розміщено тут

[gui]
instruction-to-queue-spidertron-order=__1__, щоб поставити команду переміщення в чергу.\n- __ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__, щоб відправити павукотрона з пошуком шляху.\n- __CONTROL__spidertron-enhancements-open-in-map__, щоб побачити павукотрона на мапі.\n- __CONTROL__spidertron-enhancements-open-vehicle-inventory__, щоб відкрити інвентар павукотрона.

[tips-and-tricks-item-name]
spidertron-enhancements=Удосконалення павукотрона
spidertron-enhancements-quick-toggle=Павукотрон швидкого перемикання

[tips-and-tricks-item-description]
spidertron-enhancements-enter-train=Натисніть __CONTROL__toggle-driving__ та/або __CONTROL__spidertron-enhancements-enter-vehicles__ (залежно від налаштувань), перебуваючи біля транспортного засобу, щоб увійти до нього.
