[pi]
inventory-button=Закріплений інвентар
crafting-button=Закріплене виготовлення
inventory-title=Інвентар
crafting-title=Виготовлення
inventory-toggle=ЛКМ: показати/сховати інвентар. ПКМ: скинути його розмір і позицію.\nКлавіші: Ctrl + Shift + I (можна змінити в керуванні).
crafting-toggle=ЛКМ: показати/сховати виготовлення. ПКМ: скинути його розмір і позицію.\nКлавіші: Ctrl + Shift + C (можна змінити в керуванні).
close=Сховати панель
pin=Закріпити
pin-help=Зафіксувати позицію й розмір панелі. Зніміть позначку, щоб перемістити чи змінити розмір.
resize-hint=Відкріпіть, щоб перемістити чи змінити розмір
resize-help=Перетягніть цей нижній правий кут і відпустіть, щоб змінити розмір панелі.\nПеретягніть заголовок, щоб перемістити її. Позначте «Закріпити», щоб зафіксувати позицію й розмір.
no-inventory=Поверніться до огляду персонажа, щоб користуватися інвентарем.
slot-help=ЛКМ: взяти, об'єднати чи поміняти.\nПКМ: взяти половину чи покласти один.\nДля фільтрів і масового перенесення використовуйте звичайний інвентар.
modifier-help=Закріплений інвентар: тут використовуйте ЛКМ/ПКМ без модифікаторів. Для дій із Shift/Ctrl/Alt використовуйте звичайний інвентар.
all-categories=Усі категорії
all=Усі
trash-label=Смітник — заберіть, перш ніж закривати
trash-help=Тримаючи справжній стос предметів, клацніть тут ЛКМ, щоб покласти його в смітник.\nПопередній стос у смітнику безповоротно видаляється, коли додається новий.\nКлацніть ЛКМ із порожнім курсором, щоб забрати цей стос.\nЗакриття/приховування закріпленого інвентарю безповоротно видаляє вміст смітника.\nЗміна розміру, переміщення, скидання чи перебудова панелі його не видаляють.
trash-modifier=Смітник: клацайте ЛКМ без модифікаторів. Порожній курсор забирає; стос у руці замінює вміст смітника.
trash-permission=Ваші дозволи в мультиплеєрі не дають викидати предмети.
ready=Можна виготовити
ready-help=Показувати лише рецепти, які можна виготовити вручну з наявних зараз інгредієнтів, зокрема з урахуванням проміжних продуктів, які можна виготовити.
search-help=Пошук за назвами рецептів чи продуктів. Пробіли відповідають дефісам і підкресленням. Використовуються внутрішні англійські назви.
clear-search=Очистити пошук
craft-help=ЛКМ: виготовити 1 рецепт.\nПКМ: виготовити 5 рецептів.\nShift+клацання: виготовити все доступне.\nЧисло показує, скільки разів можна виконати рецепт, а не кількість продукту.
no-recipes=Немає відповідних рецептів. Спробуйте очистити пошук чи фільтр «Можна виготовити».
no-crafting=Поверніться до огляду персонажа, щоб виготовляти вручну.
queue-title=Черга (__1__)
queue-empty=Черга порожня
queue-help=ЛКМ: скасувати 1 виготовлення.\nПКМ: скасувати 5 виготовлень.\nShift+клацання: скасувати весь цей запис черги.\nСкасування передумов може скасувати й залежні виготовлення.
