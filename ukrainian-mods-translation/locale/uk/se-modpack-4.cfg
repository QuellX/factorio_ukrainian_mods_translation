[mod-setting-description]
inserter-fuel-leech-inserters-enabled=Типи маніпуляторів, які обробляються під час гри.\nПрапорець прототипу allow_burner_leech завжди ввімкнено для всіх маніпуляторів незалежно від цього параметра.
inserter-fuel-leech-discover-per-tick=Скільки вже наявних на мапі маніпуляторів (повторно) виявляти за тік.\nЗбільште, якщо використовуєте моди, що створюють багато маніпуляторів без відповідних подій, а ви хочете, щоб вони оброблялися.\nІнакше залиште 1. Нуль не допоможе з UPS навіть на найслабшому комп'ютері.
inserter-fuel-leech-discover-empty-chunks-per-tick=Максимум порожніх чанків, що пропускаються за тік під час (повторного) виявлення маніпуляторів.\nЦе здебільшого налагоджувальний параметр. Типове значення підходить для будь-якої системи.
inserter-fuel-leech-self-leech-from-drop-enabled=Якщо паливному маніпулятору потрібне паливо, він може брати його не лише з цілі підбирання, а й з цілі вивантаження.
inserter-fuel-leech-self-refuel-cheat-enabled=Якщо паливний маніпулятор застряг без палива, а паливо є в нього в руці чи в цілі підбирання або вивантаження, один предмет цього палива телепортується в його паливний інвентар.
inserter-fuel-leech-target-item-count-min=Скільки предметів підтримувати в цільовому інвентарі. Ванільні маніпулятори кладуть 5 предметів палива в паливні інвентарі, окрім транспорту.
inserter-fuel-leech-pickup-margin-ticks=Маніпулятори телепортують паливо собі в руку з цілі підбирання до цієї кількості тіків раніше або з цілі вивантаження — пізніше. Якщо значення замале, маніпулятор може вже підібрати інший предмет або проґавити можливість взяти паливо з цілі вивантаження, коли оцінка часу неточна.
inserter-fuel-leech-no-use-for-fuel-seconds-to-wait=Скільки секунд чекати до наступного оновлення, якщо маніпулятор чи його ціль не використовують паливо.\nЦе також затримка реакції на зміну цілі вивантаження.\nЗбільште цей параметр першим, якщо падає UPS.
inserter-fuel-leech-missing-resource-seconds-to-wait=Скільки секунд чекати до наступного оновлення, якщо маніпулятор має взяти паливо для себе чи цілі, але палива немає.\nЦе також затримка реакції на появу палива.\nЗбільште, якщо UPS падає через хронічно недозаправлені ряди печей.
inserter-fuel-leech-missing-power-seconds-to-wait=Скільки секунд чекати до наступного оновлення, якщо маніпулятор, що не спалює паливо, без живлення.\nЦе також затримка реакції на відновлення електрики (чи рідин для деяких модових маніпуляторів).\nЗбільште, якщо UPS падає на фабриках, де багато вимикачів живлення чи модових маніпуляторів на рідинах.
inserter-fuel-leech-vanilla-self-refuel-seconds-to-wait=Скільки секунд чекати до наступного оновлення, якщо паливний маніпулятор не має палива й може заправитися з паливного інвентарю в місці підбирання (стандартна поведінка рушія) [с]
inserter-fuel-leech-wait-variation-seconds=Максимальна тривалість у секундах, що додається до інших затримок, щоб рівномірніше розподілити навантаження оновлень.\nЗбільште, якщо після швидкого будівництва багатьох маніпуляторів якийсь час повторюються стрибки UPS з інтервалом, що збігається з одним з інших параметрів.\nНе допомагає, якщо UPS постійно нижче 60.
inserter-fuel-leech-log-low-traffic=Виводити повідомлення в чат про рідкісні події, як-от (повторна) ініціалізація стану.
inserter-fuel-leech-log-discovery-cycle=Виводити повідомлення в чат, коли завершується цикл (повторного) виявлення маніпуляторів.
inserter-fuel-leech-watch-last-inserter=Засипає ваш особистий чат повідомленнями про останній збудований маніпулятор — для налагодження скрипту керування цього моду.\nВідстежується останній збудований вами маніпулятор. Збудуйте й приберіть маніпулятор, щоб припинити відстеження.
aircraft-realism-turn-radius=Збільшує радіус повороту літаків
aircraft-realism-acceleration=Зменшує прискорення літаків, тож для зльоту потрібен довший розбіг
aircraft-realism-braking-speed=Зменшує силу гальмування, збільшуючи гальмівний шлях
aircraft-realism-takeoff-health=Літак отримує більше шкоди, врізаючись в об'єкти під час зльоту/посадки
aircraft-realism-fuel-usage-multiplier-grounded=Множник витрати палива літаків на землі
aircraft-realism-fuel-usage-multiplier-airborne=Множник витрати палива літаків у повітрі
aircraft-realism-strict-runway-checking=Літаки мають злітати й сідати на клітинках злітної смуги — клітинках з модифікатором тертя транспорту, меншим за максимальний
aircraft-realism-strict-runway-checking-maximum-tile-vehicle-friction=Якщо потрібна злітна смуга, літаки мають злітати з клітинок, модифікатор тертя транспорту яких менший за вказане тут значення
aircraft-realism-strict-runway-max-taxi-speed=Максимальна швидкість літаків поза злітною смугою; перевищення завдає літаку шкоди
aircraft-realism-environmental-impact=Зіткнення зі скелями й водою на швидкості понад 40 км/год знищують літак, а не зупиняють його
aircraft-emit-pollution=Літаки забруднюють, поки в них хтось сидить
aircraft-pollution-amount=Скільки забруднення викидати, поки в літаку хтось сидить; множиться на швидкість і тип палива літака
aircraft-realism-airborne-damage-immunity=Літаки в повітрі не отримують шкоди
aircraft-speed-unit=Чи швидкість зльоту/посадки задано в метричних (км/год) чи імперських одиницях (миль/год)
aircraft-realism-user-enable-gauges=Показувати прилади швидкості й палива у верхньому лівому куті екрана, коли ви в літаку
aircraft-realism-user-low-fuel-warning-percentage=Відсоток від максимуму палива, за якого вмикаються попереджувальні вогні на паливомірі
aircraft-realism-user-speed-unit=Чи показують прилади швидкість у метричних (км/год) чи імперських одиницях (миль/год)
aircraft-realism-sounds-enabled=Подавати звуковий сигнал, коли палива менше заданого відсотка
pinned-inventory-columns=Початкова ширина в комірках (і після скидання). Зміна скидає панель інвентарю до налаштованого розміру. Перетягніть кут, щоб вибрати інший розмір.
pinned-inventory-rows=Початкова висота в рядках (і після скидання). Зміна скидає панель інвентарю до налаштованого розміру. Перетягніть кут, щоб вибрати інший розмір.

