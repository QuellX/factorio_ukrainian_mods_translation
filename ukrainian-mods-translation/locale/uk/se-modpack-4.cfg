[mod-description]
pinned_inventory=Плаваючі панелі інвентарю й виготовлення в рідному стилі гри: значки категорій, рядки сімейств рецептів, досліджені рівні вдосконалень, збереження позицій, закріплення, зміна розміру, пошук і керування чергою. Для Factorio 2.0.77.
vehicle-control-center=Центр керування для віддаленого керування машинами й підключення до них. Інтегрується з модом Neural Spider Control, якщо його встановлено.

