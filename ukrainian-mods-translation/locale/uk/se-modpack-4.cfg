inserter-fuel-leech-inserters-enabled-itemfueled=Обробка паливних маніпуляторів на предметах. Вартість залежить від кількості таких маніпуляторів.
inserter-fuel-leech-inserters-enabled-all=Обробка всіх маніпуляторів. Найвища вартість для продуктивності.

