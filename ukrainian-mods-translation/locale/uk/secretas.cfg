[mod-setting-description]
modify-loaders-for-belt-stack-size-limit=Якщо увімкнено, усі прототипи завантажувачів змінюються: ліміт стосів на конвеєрі збільшується, щоб вони працювали й зі збільшеним розміром стосу на конвеєрі
ignore-dea-dia-compatibility=Якщо увімкнено, мод поводиться так, ніби dea-dia не встановлено, навіть якщо він є. Наразі типово ввімкнено, бо сумісність ще в розробці
restrict-steam-recycler-crafting-to-frozeta=Якщо увімкнено, паровий переробник можна виготовити лише на Фрозеті.
condense-level-4-modules-into-one-technology=Якщо увімкнено, усі модулі 4-го рівня відкриваються однією технологією. Якщо вимкнено, кожен модуль 4-го рівня має власну технологію
check-this-if-frozeta-start=Має бути ввімкнено, щоб старт на Фрозеті працював правильно.
automatically-populate-science-pack-productivity-research=Якщо увімкнено, мод спробує додати всі наявні дослідницькі пакети до дослідження продуктивності дослідницьких пакетів. Вимкніть, якщо виникає конфлікт модів.

