[mod-description]
secretas=○🌐Цей мод додає Секретас і Фрозету. Секретас — газовий гігант. Фрозета — один з його супутників розміром із планету. Фрозета — планета-випробування: переробляйте брухт космічних кораблів — щось на кшталт потворного дитяти кохання Фульґори й Аквіло

[space-location-name]
secretas=Секретас
frozeta=Фрозета

[space-location-description]
secretas=Охоронець галактики. Великі об'єкти, що могли б урізатися в планети, зазвичай захоплює Секретас, а сама планета настільки масивна, що викривляє орбіти найвіддаленіших небесних тіл. Цей газовий велетень має щільне кільце астероїдів, через яке вийти на стабільну орбіту навколо нього непросто. Багато хто прилітав сюди по астероїди з рідкісними металами навколо Секретаса, але зазнавав нищівної поразки. Уламки кораблів або падали на його найбільший супутник Фрозету, або назавжди зникали в надрах Секретаса.
frozeta=Укритий щільним шаром льоду, цей світ поритий астероїдами й заповнений кладовищами кораблів, знищених щільним астероїдним полем Секретаса. Брухту космічних кораблів тут удосталь, а з уламків можна видобути передові технології. Отримує менше сонячного світла, ніж Аквіло, і так само потребує інфраструктури обігріву для роботи будь-яких машин.

