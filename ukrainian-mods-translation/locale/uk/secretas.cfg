[mod-description]
secretas=○🌐Цей мод додає Secretas і Frozeta. Secretas — газовий гігант. Frozeta — один з його супутників розміром із планету. Frozeta — планета-випробування: переробляйте брухт космічних кораблів — щось на кшталт потворного дитяти кохання Фульґори й Аквіло

[space-location-name]
secretas=Secretas
frozeta=Frozeta

[space-location-description]
secretas=Охоронець галактики. Великі об'єкти, що могли б урізатися в планети, зазвичай захоплює Secretas, а сама планета настільки масивна, що викривляє орбіти найвіддаленіших небесних тіл. Цей газовий велетень має щільне кільце астероїдів, через яке вийти на стабільну орбіту навколо нього непросто. Багато хто прилітав сюди по астероїди з рідкісними металами навколо Secretas, але зазнавав нищівної поразки. Уламки кораблів або падали на його найбільший супутник Frozeta, або назавжди зникали в надрах Secretas.
frozeta=Укритий щільним шаром льоду, цей світ поритий астероїдами й заповнений кладовищами кораблів, знищених щільним астероїдним полем Secretas. Брухту космічних кораблів тут удосталь, а з уламків можна видобути передові технології. Отримує менше сонячного світла, ніж Аквіло, і так само потребує інфраструктури обігріву для роботи будь-яких машин.

