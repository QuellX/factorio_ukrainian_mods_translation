[technology-description]
cannon-turret=Великокаліберна турель, корисна проти важких цілей.\nСтріляє великокаліберними снарядами.
heavy-gun-turret=Посилена кулеметна турель.\nСтріляє більш ніж удвічі швидше за стандартну модель — ідеально для інтенсивної оборони.
tiny-advanced-solar-panel=Навчіться мініатюризувати вдосконалені сонячні панелі.
tiny-solar-panel=Мініатюрні сонячні панелі не такі ефективні, як більші, зате вміщаються в кожен куточок.
plasma-nuclear-fuel=Підвищує калорійність [item=rocket-fuel], доки транспорт не зможе спалювати його так само швидко, як [item=nuclear-fuel].
plasma-rocket-fuel-enrichment=Підвищує калорійність [item=rocket-fuel], доки транспорт не зможе спалювати його так само швидко, як [item=nuclear-fuel].
plasma-processing-unit=Плазмове травлення [item=processing-unit] дає змогу масово виробляти їх і позбавляє потреби в [fluid=sulfuric-acid]
plasma-carbon-fiber=Обробка синтетичних тканин плазмовим розрядом забезпечує неперевершене зчеплення й підвищує продуктивність [item=carbon-fiber].
plasma-weaponry=Тримайте силу сонця на долоні. [item=plasma-railgun-ammo] випаровується, щойно покидає рейкотрон, і завдає меншої шкоди на значно більшій площі, тоді як [item=plasma-artillery-shell] доставляє одну вольфрамову пластину, розігнану плазмою, і завдає неймовірної шкоди одній цілі.

