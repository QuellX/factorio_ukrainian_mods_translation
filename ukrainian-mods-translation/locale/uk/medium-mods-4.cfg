[mod-setting-description]
space-locomotive-speed-setting=Задайте бажану максимальну швидкість локомотива космічного потяга.
space-cargo-wagon-capacity-setting=Задайте бажану максимальну вантажомісткість космічного вантажного вагона.
space-fluid-wagon-capacity-setting=Задайте бажану максимальну місткість космічного вагона-цистерни.
space-battery-pack-energy-density-setting=Задайте бажану максимальну густину енергії енергоблоків космічних потягів.
space-battery-decay-enable-setting=Увімкнути або вимкнути зношування енергоблоків космічних потягів і їх відновлення. Якщо вимкнено, енергоблоки ніколи не зношуються.
tmt-cannon-turret-range-angle=Від 0.1 (36°) до 0.5 (180°)
tmt-cannon-turret-damage-multiplier=Великокаліберні снаряди дуже потужні; це налаштування дає змогу їх послабити
tmt-cannon-turret-attack-speed=Швидкість атаки великокаліберної турелі в тіках (1 с = 60 тіків)
pba_show_player_camera=Якщо увімкнено, показує камеру, що стежить за ворогом-викрадачем
flamethrower-plasma=Дозволяє використовувати термоядерну плазму у вогнеметах. Страшенно весело, але не дуже реалістично; типово вимкнено.
Clockwork-cycle-length=Множник загальної тривалості сонячного циклу дня й ночі. Ванільна доба триває 6 хвилин 56,6 секунди. Наприклад, значення 4 дасть добу тривалістю 27 хвилин 47 секунд.\nУвага: це налаштування можна змінити будь-коли, але зміна місткості акумуляторів потребує перезапуску гри.
Clockwork-dusk=Час, коли починається захід сонця. Ці значення не можуть бути рівними й мають іти в такому порядку від найменшого до найбільшого:\nзахід -> ніч -> світанок -> день.\nТипово 0.5 (середина між ніччю й світанком) — це північ.
Clockwork-evening=Час, коли починається ніч. Після цього ніч найтемніша. Ці значення не можуть бути рівними й мають іти в такому порядку від найменшого до найбільшого:\nзахід -> ніч -> світанок -> день.\nЩоб ніч була довшою, розведіть ніч і світанок далі один від одного.
Clockwork-morning=Час, коли починається світанок. Після цього найтемніша частина ночі минає. Ці значення не можуть бути рівними й мають іти в такому порядку від найменшого до найбільшого:\nзахід -> ніч -> світанок -> день.
Clockwork-dawn=Час, коли починається день. Ці значення не можуть бути рівними й мають іти в такому порядку від найменшого до найбільшого:\nзахід -> ніч -> світанок -> день.
Clockwork-permanight=Режим нескінченної ночі. Щойно сонце зайде, воно більше не зійде.\nВимкніть під час гри, щоб відновити звичайний цикл дня й ночі.
Clockwork-permanight-grace=Затримка, перш ніж годинник почне рухатися до ночі. Для використання з «Сонце ніколи не сходить».\nЗміна цього значення під час гри запускає відстрочку спочатку.\nЗверніть увагу: з множником 4 і типовим часом початку ніч настане приблизно за 20 хвилин. Відстрочка додається до цього часу. Щоб скоротити його, зменште множник і/або змініть час початку.
Clockwork-permanight-grace-warn=Попереджає, коли наближається нескінченна ніч.
Clockwork-mod-accumulators=Коригує місткість акумуляторів пропорційно до нової загальної тривалості циклу.
Clockwork-mod-accumulators-capacity=Множник місткості акумулятора. Зазвичай має дорівнювати «Множнику тривалості доби», але винесений окремо, бо акумулятори не можна змінювати динамічно.
Clockwork-enable-flares=Вмикає джерело світла для ранньої гри: освітлювальні капсули, які можна кидати. Тривалість залежить від множника місткості акумуляторів.
Clockwork-flares-simple=Спрощує рецепт освітлювальних капсул, щоб не потрібні були електронні схеми. Призначено для модів, де схеми значно важче отримати (Bob, Angels, Krastorio, Py, Dyworld тощо), бо капсули мають бути раннім джерелом світла.
Clockwork-starttime=Час доби на початку гри. 0.0 — полудень (12:00) за ванільних налаштувань світанку й заходу. Не ставте нічний час, якщо використовуєте «Відстрочку перед першою ніччю». Діє лише в новій грі або коли вмикається «Сонце ніколи не сходить».
Clockwork-darknight=Ночі цілком чорні — без освітлення нічого не видно.
Clockwork-multisurface=Якщо увімкнено, Clockwork застосовує свої налаштування до інших поверхонь, крім позначених нижче винятків.
Clockwork-disable-nv=Вимикає рецепт і технологію нічного бачення для силової броні. Factorio аварійно завершиться, якщо немає жодного предмета/обладнання нічного бачення, тож якщо увімкнути це налаштування під час гри, уже збудовані пристрої нічного бачення стануть неактивними, а не зникнуть.
Clockwork-darknight-percent=Дає змогу зробити ночі непроглядними або чимось середнім.\n\n100% — повна темрява, 0% — ванільна темрява Factorio.
Clockwork-multisurface-ignore-always-day=У режимі кількох поверхонь ігнорує поверхні, де завжди день.
Clockwork-multisurface-ignore-frozen=У режимі кількох поверхонь ігнорує поверхні, де плин часу заморожено. Цей параметр автоматично вимикається в режимі нескінченної ночі.

