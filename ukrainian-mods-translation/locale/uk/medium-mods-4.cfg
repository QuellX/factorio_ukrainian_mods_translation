hd-mod=Plasma Industries незабаром почне використовувати мод hd-plasma-duct! Якщо хочете, можете вже встановити його й мати дешевші й гарніші плазмові повітроводи: https://mods.factorio.com/mod/hd-plasma-duct

[description]
grace-end-prelude=Чуже сонце тепло світить на вас, легкий вітерець смикає одяг. І все ж...
grace-end=Ви відчуваєте, що попереду довга ніч...
