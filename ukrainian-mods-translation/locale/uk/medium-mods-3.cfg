[tips-and-tricks-item-description]
rigor-module-list=[item=rigor-module] Модуль ретельності \n[item=rigor-module-2] Модуль ретельності 2 \n[item=rigor-module-3] Модуль ретельності 3
rigor-module-mod-tip-1=Ретельність — новий ефект модулів, який надають [tooltip=модулі ретельності,tips-and-tricks-item-description.rigor-module-list]. Ретельність збільшує шанси, що рецепт дасть свою найціннішу продукцію. Ретельність впливає лише на продукт з імовірнісним виходом і лише на один продукт у рецепті. Також ретельність не впливає на рецепти перероблення, окрім [recipe=scrap-recycling].\nЩоб дізнатися, чи (і як саме) ретельність впливає на рецепт, перегляньте статтю рецепта у факторіопедії.
rigor-module-mod-tip-2=Ретельність збільшує шанси рецепта дати певний продукт.\nДля імовірності «p» шанси = «p/(1-p)».\nДля імовірності «p» та ретельності «r» імовірність масштабується за формулою: «rp/(rp - p + 1)».\nРецепти також можуть мати «чутливість» до ретельності. Чутливість більше «1» означає, що ретельність сильніше масштабує шанси, а менше «1» — слабше (для чутливості «s» ефективна ретельність дорівнює «r*s»). Від'ємна чутливість означає, що ретельність зменшує шанси замість збільшення (масштабує «1 - p» замість «p»).

