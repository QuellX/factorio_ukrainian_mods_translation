[tips-and-tricks-description]
angelsaddons-storage=Цей мод додає різноманітні силоси, склади та резервуари під тиском Angel's незалежно від набору модів Angel's.
angelsaddons-storage-notes=\n\n[font=default-bold]ПРИМІТКА[/font]: Силоси — це сховища 4x4 на 256 комірок (логістичні версії відрізняються)\n[font=default-bold]ПРИМІТКА[/font]: Склади — це сховища 6x6 на 768 комірок (логістичні версії відрізняються)\n[font=default-bold]ПРИМІТКА[/font]: Резервуари для рідин вміщують більше, ніж ванільні
angelsaddons-mobility=Цей мод додає різноманітні тематичні потяги Angel's незалежно від набору модів Angel's.\nТри тематичні потяги: [img=item/angels-crawler-locomotive]Гусеничний, [img=item/angels-smelting-locomotive]Металургійний та [img=item/angels-petro-locomotive]Нафтохімічний.\nКожна тема потяга має різні робочі характеристики: масу, потужність, місткість, гальмування та максимальну швидкість.\n\n[font=default-bold]ПРИМІТКА[/font]: Кожен потяг (з невеликими винятками) підтримує копіювання/вставлення налаштувань, зокрема розкладу й кольору, а також сумісний із кресленнями.
angelsaddons-mobility-notes=\n[font=default-bold]ПРИМІТКА[/font]: Тендери — це локомотиви з високим опором повітря, але великою потужністю; добре підходять як допоміжні локомотиви для довших потягів.\n[font=default-bold]ПРИМІТКА[/font]: Вагони для роботів — це вантажні вагони, що можуть використовувати спорядження робопорта.
angelsaddons-cab=Вкрай експериментальна гусенична машина, якою можна керувати та яка може брати й постачати енергію в мережу. Це дає змогу створити тимчасовий мобільний виробничий майданчик під час дослідження мапи. Заплановано більше можливостей.
angelsaddons-cab-notes=\n\n[font=default-bold]ПРИМІТКА[/font]: Щоб скористатися, просто переведіть машину в розгорнутий режим — вона постачатиме енергію в мережу, в якій перебуває.\nЕнергію можуть забезпечувати мобільні генератори або спеціальні заряджені батареї.

