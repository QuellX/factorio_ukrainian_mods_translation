[factoriopedia-description]
bob-basic-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact]. [/color][/font]
bob-basic-enemy-2=[font=default-semibold][color=240,180,20]Створює перешкоди. [/color][color=230,230,20]Сповільнювальна кислота.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: вибухів.[/color][/font]\n\nЦі істоти — домінантна форма життя на Наувісі. Вони мають кілька виразних форм, але всі належать до одного виду.\n\n[font=default-semibold][color=255,230,192]Плюваки та черв'яки[/color][/font] атакують липкою роз'їдальною жовчю, прагнучи сповільнити жертву й перетравити її на місці. Тим часом [font=default-semibold][color=255,230,192]кусаки[/color][/font] намагаються оточити ціль і розірвати її потужними передніми лапами та щелепами, даючи жовчі час подіяти.\n\nПроти добре броньованої цілі [font=default-semibold][color=255,230,192]жовч цих істот — найнебезпечніша їхня риса.[/color][/font] Жовч черв'яків і плювак цієї породи має дещо різний склад залежно від їхнього розміру, і різні види можуть діяти разом, [font=default-semibold][color=255,230,192]посилюючи сповільнення[/color][/font]. Якщо транспорт змушений зупинитися під такою дією, зрушити його з місця може бути майже неможливо.
bob-piercing-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact-blue]. [/color][/font]
bob-piercing-enemy-2=[font=default-semibold][color=40,200,200]Реакція на шкоду: неелектрична, некислотна.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: вибухів, вогню, фізичної шкоди, пробиття.[/color][/font]\n[font=default-semibold][color=60,200,60]Вразливі до: кислоти, електрики, лазера, отрути.[/color][/font]\n\nЦя порода ворогів відмовилася від травної жовчі в атаках на відстані на користь [font=default-semibold][color=255,230,192]бронебійних шипів[/color][/font], що вилітають на великій швидкості. Хоча вони не завдають тривалої шкоди, як деякі інші породи, для ухилення від цих шипів потрібна добра рухливість. Утім, [font=default-semibold][color=255,230,192]їхні снаряди не пролітають над стінами[/color][/font].\n\nЦі вороги особливо [font=default-semibold][color=255,230,192]стійкі до будь-яких кінетичних ударів[/color][/font], швидко регенерують і [font=default-semibold][color=255,230,192]різко прискорюються, коли їх атакують[/color][/font], хоча й так рухаються швидко. Через ці риси [font=default-semibold][color=255,230,192]їхні кусаки значно небезпечніші[/color][/font] за кусак інших порід. [font=default-semibold][color=255,230,192]Електрика не викликає в них люті[/color][/font].
bob-electric-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact-orange]. [/color][/font]
bob-electric-enemy-2=[font=default-semibold][color=255,120,40]Загроза для повітряних цілей. [/color][color=230,230,20]Сповільнювальна кислота. [/color][color=40,200,200]Реакція на шкоду: електрика. [/color][color=180,60,230]Вогонь по своїх.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: електрики, лазера.[/color][/font]\n[font=default-semibold][color=60,200,60]Вразливі до: кислоти, вогню, отрути.[/color][/font]\n\nЕлектричні розряди в атаках дозволяють кусакам цієї породи [font=default-semibold][color=255,230,192]уражати цілі безпосередньо за стінами[/color][/font]. Жовч, яку електричні плюваки й черв'яки використовують в атаках на відстані, також застосовує електрику, спричиняючи короткочасний параліч. Примітно, що [font=default-semibold][color=255,230,192]вороги інших порід також вразливі до цього ефекту[/color][/font], як і літальні об'єкти, що зазвичай ігнорують калюжі кислоти на землі.\n\nУдар електрикою змушує кусак і плювак цієї породи [font=default-semibold][color=255,230,192]значно прискорюватися[/color][/font], а [font=default-semibold][color=255,230,192]їхні власні калюжі наелектризованої жовчі можуть викликати в них лють[/color][/font].
bob-acid-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact-purple]. [/color][/font]
bob-acid-enemy-2=[font=default-semibold][color=200,60,60]Тривала шкода. [/color][color=40,200,200]Реакція на шкоду: зіткнення. [/color][color=70,130,220]Посмертна атака.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: кислоти, отрути.[/color][/font]\n[font=default-semibold][color=60,200,60]Вразливі до: електрики.[/color][/font]\n\nКислотну жовч цих ворогів змінено для максимальної роз'їдальності та стійкості ціною втрати сповільнювальної дії. Вона прилипає до будь-якого ворога, що пройде чи проїде по ній, [font=default-semibold][color=255,230,192]завдаючи не лише миттєвої, а й тривалої шкоди[/color][/font]. Також вона здатна завдавати [font=default-semibold][color=255,230,192]більше шкоди спорудам[/color][/font], ніж інші подібні кислоти. [font=default-semibold][color=255,230,192]Після смерті вороги можуть вибухнути бризками кислоти або виділити кислоту від удару великим об'єктом[/color][/font].
bob-explosive-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact-yellow]. [/color][/font]
bob-explosive-enemy-2=[font=default-semibold][color=255,120,40]Загроза для повітряних цілей. [/color][color=70,130,220]Посмертна атака.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: кислоти, вибухів.[/color][/font]\n[font=default-semibold][color=60,200,60]Вразливі до: електрики, вогню, лазера.[/color][/font]\n\nВибухова порода покладається на миттєву шкоду по великій площі замість повільніших методів, як-от травна жовч. Утім, їхні атаки не такі хаотичні, як здається: вони спрямовані так, щоб не зачіпати союзників. На щастя, [font=default-semibold][color=255,230,192]ширше коло вибухової шкоди, схоже, не зачіпає небойову інфраструктуру[/color][/font].\n\nХоча калюжі, що залишаються після їхніх атак, не мають травного чи сповільнювального ефекту, їх все одно варто уникати. Ці калюжі висмоктують органічні сполуки з ґрунту під собою, переробляючи їх на нову вибухівку. Тож [font=default-semibold][color=255,230,192]калюжі можуть вибухнути знову через деякий час, і це може повторюватися кілька разів[/color][/font]. Кусаки й плюваки цієї породи також можуть вибухати після смерті.
bob-poison-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact-green]. [/color][/font]
bob-poison-enemy-2=[font=default-semibold][color=200,60,60]Тривала шкода. [/color][color=255,120,40]Загроза для повітряних цілей. [/color][color=60,200,60]Лікувальний ефект. [/color][color=40,200,200]Реакція на шкоду.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: кислоти, отрути.[/color][/font]\n[font=default-semibold][color=60,200,60]Вразливі до: вогню[/color][/font]\n\nЗамість звичайних хімічних токсинів вороги цієї породи використовують суміш ферментів, вироблених вільноплаваючими клітинами, пристосованих атакувати будь-який матеріал, з яким вони стикаються. Клітини поширюються через слину істот або хмарами газу навколо їхніх тіл і також здатні [font=default-semibold][color=255,230,192]загоювати рани союзних істот[/color][/font].\n\nЦі вороги завдають [font=default-semibold][color=255,230,192]помірної тривалої шкоди на великій площі[/color][/font], але найнебезпечніша їхня риса — здатність лікувати, особливо в поєднанні з іншими породами ворогів.
bob-fire-enemy-1=[font=default-semibold][color=255,230,192]Після смерті залишає [item=bob-alien-artifact-red]. [/color][/font]
bob-fire-enemy-2=[font=default-semibold][color=200,60,60]Тривала шкода. [/color][color=255,120,40]Загроза для повітряних цілей. [/color][color=180,60,230]Вогонь по своїх.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Стійкі до: вибухів, вогню, лазера.[/color][/font]\n[font=default-semibold][color=60,200,60]Вразливі до: зіткнень, фізичної шкоди, пробиття.[/color][/font]\n\nАтаки всіх істот цієї породи спричиняють пожежі. Вогонь підживлюють хімічні речовини, що є водночас горючими й вельми кислотними, тож [font=default-semibold][color=255,230,192]навіть повністю вогнестійкі споруди не мають імунітету[/color][/font]. Спочатку слабкий, [font=default-semibold][color=255,230,192]вогонь посилюється, коли повторні атаки додають пального[/color][/font], і врешті стає найруйнівнішою формою атаки на оборонні споруди серед усіх порід ворожих істот Наувіса. Полум'я також може [font=default-semibold][color=255,230,192]поширюватися на невелику відстань[/color][/font] від місця виникнення.

