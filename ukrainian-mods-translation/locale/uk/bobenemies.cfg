[mod-setting-description]
bobmods-enemies-factionsappear=Рівень еволюції ворогів, за якого на мапі почнуть з'являтися нові ворожі фракції. Значення 0 зробить початок гри дуже складним.
bobmods-enemies-qualityenemies=Нові ворожі бази можуть з'являтися з підвищеною якістю, створюючи вищої якості бійців і здобич.
bobmods-enemies-originalcolors=Ворожі лігва показуватимуться на мапі оригінальним червоним кольором замість кольорів фракцій, що полегшують їх розпізнавання.
bobmods-enemies-radarscanlimit=Обмежує кількість предметів на землі, які ґрунтовий радар позначає для знесення за один цикл. Це може трохи впливати на продуктивність, але головна мета — не давати будівельним роботам надовго займатися збиранням предметів. Значення 0 знімає обмеження.
bobmods-enemies-randomizeenemies=Нові ворожі фракції відкриватимуться у випадковому порядку. Діє лише на початку гри або під час першого додавання мода.
bobmods-enemies-factionlist=Список усіх фракцій, що з'являються, у невипадковому порядку відкриття (його можна вільно змінювати). Розділяйте назви однією комою без пробілів. Вилучення більш ніж однієї фракції може ускладнити збирання всіх типів артефактів. Фракції цього мода, вилучені посеред гри, не зникнуть з мапи, але нові бази не з'являтимуться.

