[technology-description]
planet-discovery-muria=Невелика планета із сильним парниковим ефектом. Мілкі озера вкрай корозійного [fluid=muriatic-solution] виділяють гази, що зігрівають планету. Рідину з озер можна викачувати [entity=offshore-pump]. Схоже, на поверхні є життя.
lichen-cultivation=Схоже, [item=acidophile-lichen] живиться енергією, що вивільняється з [item=chlorine-salts], коли [fluid=chlorine] відокремлюється від металів. Розміщуючи солі на [tile=acidophile-lichen], можна надійно отримувати метали на планеті. Однак їхні колонії, схоже, виділяють у повітря надзвичайно сильні корозійні речовини, що становлять загрозу для фабрики.
eschatotaxite-farming=Високі колонії грибів, що живляться власними частинами, які гниють. Надзвичайно багаті на вуглець і сірку. Схоже, вони поглинають корозійні кислоти, які виділяють [entity=metallic-lichen-colony] і [entity=cotunnite-lichen-colony].
lead-processing=Розміщуйте [item=cotunnite], видобутий з [fluid=muriatic-solution], на [tile=acidophile-lichen], щоб вивільнити [item=lead], що міститься в ньому, і почати обробку цього стійкого до корозії металу.
acidworking=Нові процеси для роботи з вкрай корозійними матеріалами. [entity=acidworking-plant] потребує для роботи [item=chloric-fuel].
advanced-lead-processing=За допомогою [item=chloric-fuel] можна запустити вдосконалений ланцюжок обробки [item=lead] у спеціалізованому [entity=smelting-plant]. Разом з цим розробіть свинцеві гранули й важкі дробові набої.
acidworking-science-pack=Дає змогу вдосконалено застосовувати кислоти й токсичні матеріали. Технологія також дає змогу будувати ракети, здатні покинути Мурію.
offworld-chlorine-compounds-production=Процеси отримання й обробки [fluid=chlorine] і [fluid=hydrogen-chloride] за межами [planet=muria].
toxic-rounds-magazine=Кулі, змінені так, щоб містити кислотні заряди.
hydrogen-chloride-explosives=Альтернативний рецепт [item=explosives] з використанням властивостей [fluid=hydrogen-chloride].
hydrogen-chloride-lead-battery=Альтернативний рецепт [item=battery] з використанням [item=lead-plate].
acid-weaponization=Почніть створювати вдосконалений хімічний арсенал.
refined-acid-weaponry=Збільшує шкоду кислотної зброї.
hydronium-destruction-productivity=Досконаліші методи розкладання [fluid=hydronium] дають змогу відновити більше молекул [fluid=oxygen] і [fluid=hydrogen].
oxygenated-bacteria-cultivation=Додаючи кисень у середовище вирощування бактерій, можна збільшити вихід культур.
holmium-chloride=Краще дослідження хлоридних солей дає змогу штучно синтезувати хлорид гольмію, щоб розширити ланцюжок обробки гольмію й збільшити його виробництво на Фульґорі. Разом з цим отримайте можливість штучно створювати колонії лишайників, здатні жити на нафтовому океані Фульґори й у глибших частинах муріатичних озер самої Мурії.
shotgun-turret=Змінена конструкція кулеметної турелі, здатна стріляти потужними дробовими пострілами.
advanced-paste-applications=Застосовуючи численні властивості есхатотакситової пасти, можна замінити пластмасу й пюре юмако у важливих процесах.
shotgun-turret-damage=Збільшена шкода дробовикової турелі.
murian-oil-processing=Переробляючи біомасу з [entity=eschatotaxite] разом з іншими ресурсами Мурії, можна отримувати нафту й нафтопродукти на Мурії.
leaded-fuel=За допомогою свинцевих гранул можна створити вдосконалене ракетне паливо з неймовірними модифікаторами швидкості, але величезним множником забруднення.
air-scrubbing=Використовуючи [fluid=water] і різні каталізатори, можна очищати атмосферу різних планет, щоб зменшити кількість забруднювачів і отримувати слідові ресурси з повітря.
hydrogen-chloride-from-biter-egg=Обережно видобуваючи кислотні залози кусак і плювак, що ростуть, можна отримати просте джерело [fluid=hydrogen-chloride] на Наувісі.
explosive-shotgun-shell=Змінені дробові набої з вибуховими зарядами з [fluid=chlorine] і [item=carbon]. Ідеальні для знищення великих астероїдів у космосі.
advanced-acid-processing=Вдосконалені процеси використання й виробництва [fluid=sulfuric-acid] і [fluid=hydrogen-chloride].
lead-robots=Роботи, посилені [item=anti-corrosion-cladding]. Мають вищі стійкості, можуть переносити більше вантажу й витримують кислоти Мурії, але повільніші.
pickled-casting=Досконаліший метод лиття. Додаючи [fluid=hydrogen-chloride] до розплавленого металу, можна зменшити відходи, витравлюючи домішки, і використовувати на 25% менше розплавленого металу в рецептах лиття проміжних продуктів.

