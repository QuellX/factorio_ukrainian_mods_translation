acidworking-plant=Дає змогу вдосконалено працювати з кислотами. На Мурії ця машина виробляє кислоти й роз'їдає корозією вразливі об'єкти поблизу.
smelting-plant=Будівля для виплавки матеріалів і металургійних процесів. Дає змогу обробляти свинець. На Мурії ця машина виробляє кислоти й роз'їдає корозією вразливі об'єкти поблизу.
fungicultural-tower=Машина для вирощування грибів і лишайників.
acidthrower-turret=Подібно до вогнеметної турелі, ця кислотна бойова машина розплавить ваших супротивників.
metallic-lichen-colony=Колонія кислотолюбних лишайників, що ростуть на хлоридних солях.
cotunnite-lichen-colony=Колонія кислотолюбних лишайників, що ростуть на котунніті.
holmium-lichen-colony=Колонія кислотолюбних лишайників, що ростуть на хлориді гольмію.
eschatotaxite=Висока колонія грибів, що поглинає корозійні кислоти з повітря.
chlorine-salt-deposit=Поклад хлоридних солей.
biovat=Неефективна машина для біологічних процесів. На Мурії поглинає частину кислот з повітря.
big-chloric-rock=Велике скупчення хлоридних солей і каменю.
scrubber=Машина, що за допомогою каталізатора поглинає з атмосфери забруднювачі й атмосферні компоненти.
lead-construction-robot=Повільніший будівельний робот з вищими стійкостями. Може переносити більше вантажу.
lead-logistic-robot=Повільніший логістичний робот з вищими стійкостями. Може переносити більше вантажу.

