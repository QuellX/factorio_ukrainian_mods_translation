[tips-and-tricks-item-description]
muria-briefing=[planet=muria] — вкрай токсичний світ, багатий на життя. [tile=acidophile-lichen] і гриби [entity=eschatotaxite] вкривають сушу планети, а решту поверхні займають озера [fluid=muriatic-solution]. [entity=chlorine-salt-deposit] і [item=cotunnite] — солі [fluid=chlorine], що трапляються на поверхні в різному вигляді. Обидві можна очистити до руд за допомогою [entity=fungicultural-tower] і лишайників. Стережіться корозійного повітря, що виділяють лишайники. Есхатотаксити можуть захистити вашу фабрику від його шкоди.
acid-immunity-list=Збирання [entity=metallic-lichen-colony] і [entity=cotunnite-lichen-colony] вивільняє корозійні гази. Ці гази пошкоджують більшість ваших машин. Шар забруднення на мапі показує, які ділянки небезпечні для машин. Корозійність атмосфери можна зменшити, садячи й збираючи [entity=eschatotaxite].\nБільшість об'єктів гравця на забруднених клітинках [planet=muria] постійно отримують шкоду від корозійних кислот, за деякими винятками.\nСтійкі об'єкти:\n- [entity=fungicultural-tower], очевидно, стійка, бо це головне джерело й головний поглинач кислот. \n- [entity=acidworking-plant] і [entity=smelting-plant] (ці дві машини навіть збільшують корозійні кислоти, тож будьте обережні).\n- [entity=biovat] (біочан поглинає частину кислот з повітря.) \n- [entity=scrubber] (машина створена для поглинання кислот та інших забруднювачів.) \n- Усі енергетичні об'єкти (опори ЛЕП, генератори й акумулятори)\n- Усі логістичні об'єкти не отримують шкоди, крім роботів. Робопорти не отримують шкоди. Вдосконалені освинцьовані роботи стійкі до кислот. \n- Потяги ([entity=locomotive], [item=rail] тощо) також стійкі.\n- [entity=rocket-silo], [entity=cargo-landing-pad] і [entity=cargo-bay]. \n- Усі бури. \n- [entity=beacon]. \n- Усі труби. \n- Усі скрині.

