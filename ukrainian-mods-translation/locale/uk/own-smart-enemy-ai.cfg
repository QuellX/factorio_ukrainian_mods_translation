welcome-normal=[Smart Enemies] Складність: звичайна. Кусаки можуть обходити стіни відкритими шляхами, відступати після втрат і набувати стійкості до типів шкоди, які часто використовуються. Керування — у налаштуваннях модів. Інтенсивність рейдів визначає їхню частоту та розмір.
welcome-easy=[Smart Enemies] Складність: легка. Стіни відновлюються швидше, стійкість має нижчу межу, а загони відступають раніше. Керування — у налаштуваннях модів. Інтенсивність рейдів визначає їхню частоту та розмір.
welcome-hard=[Smart Enemies] Складність: важка. Кусаки погоджуються на довші обходи, відступають після більших втрат і мають вищу межу стійкості. Відновлення стін триває вдвічі довше, ніж на звичайній складності. Інтенсивність рейдів визначає їхню частоту та розмір.
welcome-custom=[Smart Enemies] Складність: власна. Ваші власні налаштування визначають стійкість, відступ, обходи, відновлення стін і радіус прориву. Ці параметри — у налаштуваннях модів. Інтенсивність рейдів визначає їхню частоту та розмір.
welcome-umbrella-off=[Smart Enemies] Розширений ШІ вимкнено. Перемикачі відновлення стін і зіткнення снарядів залишаються незалежними. Звичайною поведінкою ворогів керує гра або інші моди. Щоб увімкнути наступальні можливості цього мода, увімкніть «Розширений ШІ ворогів» у налаштуваннях модів.
difficulty-hard-warning=[Smart Enemies] Складність змінено на важку. Кусаки погоджуються на довші обходи, відступають після більших втрат і мають вищу межу стійкості. Відновлення стін триває вдвічі довше, ніж на звичайній складності. Частота й розмір рейдів залежать від інтенсивності рейдів.
research-pressure-warning=[Smart Enemies] «Дослідницький тиск» створив нових кусак (__1__) біля лігва на поверхні __2__. __3__
research-pressure-grandfather-banner=[Smart Enemies] «Дослідницький тиск» потребує явної згоди для цього наявного збереження. Він створює нових ворогів після досліджень. Виконайте /smart-enemy-ai-research-pressure-opt-in, щоб увімкнути його. Або змініть його інтенсивність у налаштуваннях модів.
research-pressure-opt-in-confirm=[Smart Enemies] «Дослідницький тиск» увімкнено для цього збереження. Завершені дослідження посилюють ворогів через вибраний ефект. Еволюція та вартість технологій обмежують кількість додаткових юнітів.
