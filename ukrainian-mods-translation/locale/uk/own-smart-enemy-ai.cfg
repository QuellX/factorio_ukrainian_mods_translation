[smart-enemy-ai]
foreign-repair-pending=Автоматичне відновлення юнітів: залишилося __1__ юнітів. Продовжте гру, щоб відновлення тривало. Незавершені варіанти зникнуть після видалення мода.
foreign-repair-complete=Автоматичне відновлення повернуло __1__ юнітів. Звичайні замінники мають нові номери юнітів. Інші моди можуть втратити посилання на замінених юнітів.
foreign-repair-incomplete=Автоматичне відновлення зупинилося: не оброблено __1__ юнітів. Початкові варіанти залишаються. Вони зникнуть після видалення мода.
prepare-uninstall-foreign-pending=Триває автоматичне відновлення юнітів. Залишилося __1__ юнітів. Продовжте гру, щоб відновлення тривало. Підготовка нічого не змінила.
prepare-uninstall-foreign-incomplete=Автоматичне відновлення не вдалося для __1__ юнітів. Підготовку зупинено до внесення будь-яких змін. Пряме видалення мода прибере решту варіантів зі стійкістю.
friendly-fire-policy-retired=Smart Enemies більше не змінює дружній вогонь боків. Оновлення повернуло типове значення рушія (увімкнено) для __1__ ворожих боків без записаних початкових значень.
resistant-enemy-name=__1__ (стійкість — __2__: __3__%)
target-adapter-help=Створіть креслення логічного адаптера командою /smart-enemy-ai-target-adapter [enemy-prototype|all]. Без аргументу команда використовує пріоритети вибраної турелі.
target-adapter-created=Креслення містить адаптери для такої кількості родин ворогів: __1__.\nЗалиште наявний ЧЕРВОНИЙ дріт між контролером і турелями.\nПід'єднайте до цієї мережі ЧЕРВОНИЙ вхід адаптивного множника цілей.\nНе під'єднуйте адаптивну маску цілей.\nНе чіпайте внутрішні ЗЕЛЕНІ дроти.\nПодайте на адаптер електроенергію.\n\nПодавайте лише сигнали базових ворогів. Сигнали варіантів надходять на один тік пізніше. Допоміжні об'єкти зникнуть після видалення мода.\nПісля змін у модах на ворогів або в рівнях стійкості створіть нове креслення.
target-adapter-no-families=Не вибрано жодної підтримуваної родини ворогів. Виберіть турель із пріоритетами або скористайтеся командою /smart-enemy-ai-target-adapter small-biter. Аргумент all вибирає всі підтримувані родини.
target-adapter-player-required=Ця команда потребує гравця.
target-adapter-cursor-unavailable=Цей контролер не має курсора. Перейдіть на контролер із курсором. Потім виконайте команду ще раз.
target-adapter-invalid-blueprint=Не вдалося створити креслення. Ваш курсор залишився без змін.
target-adapter-cursor-full=Курсор не може прийняти креслення. Звільніть місце в інвентарі. Потім виконайте команду ще раз.
prepare-uninstall-filters=Smart Enemies неактивний. Підготовка не змогла відновити списки пріоритетів турелей: __1__.\nЩоб завершити підготовку, не видаляйте мод.\nЗнайдіть відповідні турелі в журналі.\nОчистіть їхні списки.\nПотім запустіть підготовку ще раз.
prepare-uninstall-help=За бажання збережіть ворогів-варіантів перед видаленням командою /smart-enemy-ai-prepare-uninstall [true|false]. Необов'язкове значення задає дружній вогонь для старих збережень без записаного початкового значення.
prepare-uninstall-unknown=Підготовка нічого не змінила. У цьому старому збереженні немає записаного значення дружнього вогню.\nВиконайте /smart-enemy-ai-prepare-uninstall true, щоб увімкнути дружній вогонь.\nАбо виконайте /smart-enemy-ai-prepare-uninstall false, щоб залишити його вимкненим.
prepare-uninstall-done=Підготовка відновила ворогів-варіантів: __1__, і звільнила груп: __2__. Smart Enemies неактивний у цьому збереженні.\nЗбережіть гру.\nПотім видаліть мод.\nЩоб скасувати підготовку, завантажте попереднє збереження.
prepare-uninstall-incomplete=Smart Enemies неактивний. Підготовка не змогла відновити ворогів-варіантів: __1__.\nЩоб зберегти їх, не видаляйте мод.\nУсуньте проблему з відсутніми базовими прототипами або заблокованими позиціями.\nПотім запустіть підготовку ще раз.
restore-friendly-fire-help=Відновіть записані значення командою /smart-enemy-ai-restore-friendly-fire [true|false]. Цю команду може використовувати лише адміністратор. Необов'язковий аргумент задає значення для невідомих старих налаштувань.
restore-friendly-fire-admin=Лише адміністратор може відновити налаштування дружнього вогню ворогів.
restore-friendly-fire-done=Відновлення завершено. Smart Enemies більше не керує налаштуваннями дружнього вогню ворогів у цьому збереженні, зокрема після перезавантажень і оновлень.
restore-friendly-fire-unknown=Старіші версії не записували початкові значення дружнього вогню. Ця команда нічого не змінила.\nВиконайте /smart-enemy-ai-restore-friendly-fire true, щоб увімкнути дружній вогонь.\nАбо виконайте /smart-enemy-ai-restore-friendly-fire false, щоб залишити його вимкненим.
raid-warning=[font=default-bold][color=red]Наближається рейд на поверхні __1__![/color][/font]
first-raid-banner=Перший рейд через __1__
raid-intensity-changed=[Smart Enemies] Інтенсивність рейдів змінено на __1__.
adaptation-alert=[Smart Enemies] Рейди тепер мають стійкість до типу шкоди «__1__». Використовуйте різні типи зброї.
