[mod-setting-description]
smart-enemy-ai-divider-difficulty=Цей роздільник позначає налаштування складності. Його прапорець ні на що не впливає.
smart-enemy-ai-divider-raids=Цей роздільник позначає налаштування рейдів. Його прапорець ні на що не впливає.
smart-enemy-ai-divider-research-pressure=Цей роздільник позначає налаштування «Дослідницького тиску». Його прапорець ні на що не впливає.
smart-enemy-ai-divider-alerts=Цей роздільник позначає налаштування сповіщень та інтерфейсу. Його прапорець ні на що не впливає.
smart-enemy-ai-difficulty-preset=Цей пресет визначає стійкість, відступ, обходи шляху, радіус прориву та відновлення стін. Зміни не потребують перезапуску.\n\n«Легка» використовує межу стійкості 30 відсотків і швидше відновлення. «Звичайна» використовує межу 50 відсотків. «Важка» використовує межу 70 відсотків і повільніше відновлення. «Власна» використовує параметри нижче. Загальний бюджет стійкості також множить ці межі.\n\nІнтенсивність рейдів окремо визначає їхню частоту та розмір.\n\nЗміни стійкості впливають на нові лігва та подальші рейди. Наявні лігва зберігають свої профілі.
smart-enemy-ai-custom-resist-cap=Це значення діє лише для власної складності. Воно задає загальний бюджет адаптації до застосування множника загального бюджету стійкості. Родини шкоди ділять цей бюджет відповідно до записаних убивств.\n\nДіапазон — від 0.0 до 1.0. Типове значення — 0.50, що відповідає звичайній складності. Значення 0.70 відповідає важкій, а нуль вимикає адаптацію. Дві однаково вживані родини шкоди отримують приблизно по половині.\n\nЗа загального бюджету 1.0 або вище один домінантний тип шкоди може досягти імунітету. Використовуйте різні типи шкоди, щоб оборона не стала неефективною.\n\nЗміни стійкості впливають на нові лігва та подальші рейди. Наявні лігва зберігають свої профілі.
smart-enemy-ai-resistance-budget=Цей множник застосовується до бюджету адаптації на кожному пресеті складності. Родини шкоди ділять отриманий бюджет відповідно до записаних убивств.\n\nДіапазон — від 0.0 до 3.0. Типове значення 1.0 використовує межу пресета як загальний бюджет. За значення 2.0 дві однаково вживані родини можуть кожна досягти межі пресета. Нуль вимикає адаптацію. Стійкість кожної родини обмежена 100 відсотками.\n\nЗміни стійкості впливають на нові лігва та подальші рейди. Наявні лігва зберігають свої профілі.
smart-enemy-ai-custom-retreat-threshold=Цей множник діє лише для власної складності. Звичайна складність використовує 50 відсотків початкової кількості учасників. За значення 1.2 загони відступають, коли їх стає менше ніж 60 відсотків. За значення 0.6 — менше ніж 30 відсотків.\n\nПерша записана втрата запускає п'ятихвилинне вікно. Відступ залежить від кількості вцілілих учасників, а не від очок здоров'я. Заплановані рейди не відступають.\n\nФактичний поріг не може перевищувати 90 відсотків. Тому значення понад 1.8 дають той самий результат, що й 1.8. Діапазон — від 0.1 до 5.0, типове значення — 1.0.
smart-enemy-ai-custom-path-detour=Цей множник діє лише для власної складності. Звичайна складність дозволяє шлях, до двох разів довший за пряму відстань. Вищі значення дозволяють довші обходи. Нижчі значення змушують раніше переходити до прямого штурму. Діапазон — від 0.1 до 5.0, типове значення — 1.0.
smart-enemy-ai-custom-regen-cooldown=Цей множник діє лише для власної складності. Він змінює і затримку без шкоди, і тривалість повного відновлення.\n\nЗа значення 1.0 кожна тривалість становить десять секунд. За значення 2.0 — двадцять секунд. За значення 0.5 — п'ять секунд. Діапазон — від 0.1 до 5.0, типове значення — 1.0.
smart-enemy-ai-custom-breach-radius=Цей множник діє лише для власної складності. Звичайна складність використовує радіус 192 плитки для підкріплення після знищення турелі. Вищі значення можуть перенаправляти ворогів із більшої відстані. Діапазон — від 0.1 до 5.0, типове значення — 1.0.
smart-enemy-ai-raid-intensity=Це налаштування визначає інтервали та розміри запланованих рейдів. «Вимкнено» забороняє нові заплановані рейди. «Низька» дає менші й рідші рейди. «Висока» дає більші й частіші рейди.\n\nАктивні модовані склади отримують додатковий множник розміру: 0.5 на низькій або 0.75 на звичайній інтенсивності. «Висока» та «Власна» зберігають повний розмір складу. «Власна» використовує параметри перерви та розміру нижче. Іншою поведінкою ворогів керує складність.
smart-enemy-ai-custom-raid-cooldown=Цей множник діє лише для власної інтенсивності рейдів. Він змінює інтервали між рейдами та початкову відстрочку. За значення 1.0 початкова відстрочка становить 60 хвилин. Інтервал між рейдами — приблизно п'ять хвилин за повної еволюції, до необов'язкових поправок на ніч чи несподіваність.\n\nЗначення 0.5 скорочує інтервал удвічі. Значення 2.0 подвоює його. Діапазон — від 0.1 до 5.0.
smart-enemy-ai-custom-raid-size=Цей множник діє лише для власної інтенсивності рейдів. За значення 1.0 і повної еволюції базова кількість становить 1000 юнітів. Значення 0.5 зменшує кількість удвічі, а 2.0 подвоює її. Діапазон — від 0.1 до 5.0. Також діють інші обмеження розміру рейду та необов'язкова варіативність.
smart-enemy-ai-multiplanet-raids=«Вимк» обмежує нові заплановані рейди поверхнями, де присутній гравець. Присутністю вважається під'єднаний гравець або будівництво під керуванням гравця протягом останніх десяти хвилин, зокрема віддалене будівництво.\n\n«Увімк» дозволяє рейди також на поверхнях без присутності гравця. На таких поверхнях потрібен бій протягом останніх п'яти хвилин, якщо не ввімкнено рейди на неактивних поверхнях. Кожна поверхня використовує власний фактор еволюції.\n\nНа всіх поверхнях потрібні придатні стандартні лігва та немирний режим. Це налаштування змінює охоплення поверхонь, а не інтенсивність рейдів. Типово вимкнено.
smart-enemy-ai-idle-raids=Це налаштування стосується поверхонь без присутності гравця, коли ввімкнено рейди на кількох планетах. «Вимк» вимагає загибелі стандартного ворога протягом останніх п'яти хвилин. «Увімк» скасовує цю вимогу бою.\n\nПридатні лігва та немирний режим залишаються обов'язковими. Поверхні з присутнім гравцем і так дозволяють рейди без боїв. Частоту та розмір визначає інтенсивність рейдів. Типово вимкнено.
smart-enemy-ai-surprise-raids=«Увімк» додає випадкову варіативність до інтервалів і розмірів запланованих рейдів. Розкид зменшується з еволюцією, але за повної еволюції зберігається мінімальний. «Вимк» використовує фіксовані розрахунки. Типово вимкнено. Це налаштування не діє, коли інтенсивність рейдів вимкнено.
smart-enemy-ai-night-raids=«Увімк» дозволяє запуск запланованих рейдів лише вночі. Коротші інтервали зберігають очікувану кількість рейдів за повну добу. Рейд, що припадає на світлий час, чекає ночі, і зворотні відліки враховують цю затримку. Хвиля, яка завершила збір після світанку, також чекає ночі. На інших поверхнях рейди можуть тривати.\n\nПочаткова відстрочка не змінюється. Поверхні без придатної ночі зберігають звичайний розклад. Типово вимкнено. Це налаштування не діє, коли інтенсивність рейдів вимкнено.
smart-enemy-ai-raid-alerts=«Усі сповіщення» показує червоний череп на мапі та попередження в чаті. «Лише значок на мапі» показує череп без попередження в чаті. «Без сповіщень» приховує обидва, а також банер першого рейду.\n\nІнші режими зберігають банер першого рейду. Це налаштування не змінює поведінку рейдів. «Дослідницький тиск» пише в чат лише в режимі «Усі сповіщення».
smart-enemy-ai-show-status-gui=«Увімк» дозволяє відкривати панель стану через ярлик, призначену клавішу або команду /smart-enemy-ai-status. «Вимк» закриває відкриті панелі та вимикає ці дії. Ярлик залишається видимим. Це налаштування не керує банером першого рейду.
smart-enemy-ai-feature-enemy-advanced-ai=Цей головний перемикач керує наступальною навігацією, відступом, вибором цілей, рейдами, «Дослідницьким тиском» і адаптивною стійкістю. «Вимк» вимикає ці можливості незалежно від їхніх окремих перемикачів. Відновлення стін і зіткнення снарядів залишаються незалежними.
smart-enemy-ai-feature-projectile-block=«Увімк» перетворює підтримувані кислотні струмені ворогів на снаряди, які зіштовхуються зі стінами та воротами. Снаряди гравців зберігають початкову поведінку.
smart-enemy-ai-feature-wall-regen=«Увімк» відновлює стіни та ворота після затримки без шкоди. На звичайній складності затримка становить десять секунд, а повне відновлення з нульового здоров'я триває десять секунд. Частково пошкоджена стіна потребує менше часу. Нова шкода перезапускає затримку. Складність і власні налаштування змінюють обидві тривалості.
smart-enemy-ai-feature-adaptive-resistance=Нові лігва отримують фіксовані профілі стійкості на основі записаних смертей. Кожне лігво зберігає свій профіль на весь час існування. Рейди використовують поточні спостереження.\n\n«Вимк» зберігає лігва та юнітів. Їхні прототипи використовують базову стійкість.
smart-enemy-ai-dense-resistance-levels=«Увімк» запитує кожен крок у 10 відсотків для варіантів рейдів. Профілі звичайних лігв використовують рівні 10, 30, 50, 70 і 100 відсотків.\n\nБюджет прототипів може зменшити кількість доступних варіантів.
smart-enemy-ai-cede-foreign-biter-groups=«Увімк» залишає природно утворені групи та групи інших модів під їхнім наявним керуванням. Smart Enemies керує власними рейдами. Відновлення стін, зіткнення снарядів і адаптація залишаються доступними.\n\nЦе налаштування призначене для поєднання з іншими модами на ШІ ворогів. Типово вимкнено. Зміна потребує перезапуску.
smart-enemy-ai-research-pressure-effect=«Окремі підкріплення» зберігає наявну поведінку. Новими юнітами біля лігва керує рушій. «Наступний рейд» додає юнітів до наступного запланованого рейду на кожній придатній поверхні.\n\nНадбавка не може перевищувати подвійну еталонну хвилю фази, максимум — 180 юнітів. Рейд не може отримати більше ніж половину своєї звичайної кількості юнітів. Множники модованих складів також зменшують кількість додаткових юнітів. Надлишок надбавки не переноситься.\n\n«Наступний рейд» не діє, поки інтенсивність рейдів вимкнено. Зміна ефекту або значення «Вимкнено» скидає невикористані надбавки. Типове значення — «Окремі підкріплення».
smart-enemy-ai-research-pressure=Завершені дослідження посилюють ворогів через вибраний ефект. «Окремі підкріплення» створює нових кусак біля одного перевіреного лігва на кожній придатній поверхні. Вартість технології та еволюція обмежують хвилю. Новими юнітами керує рушій.\n\nПеревага надається придатному для рейдів лігву, а потім — забрудненій ділянці. Поверхням потрібен повний реєстр лігв і рідна система, здатна залучити юнітів. Якщо недоступні й атаки через забруднення, і розповсюдження, функція пропускає створення та сповіщення.\n\n«Вимкнено» вимикає функцію. «Низька», «Звичайна» та «Висока» використовують множники 0.5, 1.0 і 1.5. «Власна» використовує параметри нижче в межах обмежень фази. У нових іграх типове значення — «Звичайна». Наявні збереження, які потребують явної згоди, можуть скористатися командою /smart-enemy-ai-research-pressure-opt-in.
smart-enemy-ai-custom-research-pressure-chunks=Цей множник діє лише для власного «Дослідницького тиску». Значення 1.0 відповідає звичайній інтенсивності. Значення 2.0 подвоює розраховану кількість, а 0.5 зменшує її вдвічі. Результат не може перевищувати подвійну еталонну хвилю фази. Діапазон — від 0.1 до 5.0.
smart-enemy-ai-custom-research-pressure-damp=Цей множник діє лише для власного «Дослідницького тиску». Він змінює коефіцієнт згладжування вартості відносно базового значення 25. Вище значення зменшує розрахований базовий рівень технології. Нижче значення збільшує його, доки не спрацює стеля вартості. Діапазон — від 0.1 до 5.0.
smart-enemy-ai-custom-research-pressure-cap=Цей множник діє лише для власного «Дослідницького тиску». Він змінює стелю вартості відносно базового значення 20. Технології на рівні стелі дають повну еталонну хвилю до масштабування за інтенсивністю.\n\nВища стеля вимагає дорожчих досліджень для повної сили. Нижча стеля дозволяє досягти її дешевшим дослідженням. Діапазон — від 0.1 до 5.0.

