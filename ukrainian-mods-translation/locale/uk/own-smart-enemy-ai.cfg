status-command-help=Показати або сховати панель стану Smart Enemies.
research-pressure-opt-in-command-help=Як адміністратор, увімкніть «Дослідницький тиск» для старого збереження, яке потребує явної згоди.
research-pressure-opt-in-admin=Лише адміністратор може ввімкнути «Дослідницький тиск» для цього збереження.
