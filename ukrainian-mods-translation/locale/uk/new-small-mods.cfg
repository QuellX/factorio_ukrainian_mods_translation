[entity-description]
ship-loading-pump=Помпа з довгою вихідною стрілою для завантаження кораблів, що перевозять рідини. Довгий бік з'єднується лише з кораблями, короткий — лише з трубами та потягами. Можна розміщувати на воді.
ship-unloading-pump=Помпа з довгою вхідною стрілою для розвантаження кораблів, що перевозять рідини. Довгий бік з'єднується лише з кораблями, короткий — лише з трубами та потягами. Можна розміщувати на воді.

[cargo-ship-message]
migration-11-warning=[color=yellow] УВАГА >>> Не вдалося перенести Cargo Ships <<< УВАГА[/color]\nВи завантажили мапу з Factorio 1.1 або старішої. Будь ласка, завантажте й збережіть цю мапу у Factorio 2.0, перш ніж оновлюватися до 2.1.\nЗавантажте ZIP для версії Factorio 2.0.77 з factorio.com, щоб не пошкодити встановлену через Steam гру.
migration-21-warning=[color=yellow] УВАГА >>> Cargo Ships більше не містить нафтову вишку та плавучу опору ЛЕП. <<< УВАГА[/color]\n[color=red]НЕ ЗБЕРІГАЙТЕ ЦЮ МАПУ без них, якщо хочете зберегти ці можливості.[/color]\nБудь ласка, встановіть їх окремо з порталу модів.

