[mod-setting-description]
kry-stdlib-max-entity-checks=Скільки окремих об'єктів перевіряти за тік. Це значення спільне для всіх модів, що використовують цю функцію stdlib.\nПРИМІТКА: не впливає на моди, які не покладаються на функції stdlib під час гри.
dectorio-fence=Вмикає стіни-загорожі з дерев'яних барикад і сітки-рабиці
flow-control-new-group=Переносить труби, помпи й клапани в окремий рядок меню виготовлення.
flow-control-revert-to-normal-pipe=Підібрані трійникові, кутові чи прямі труби знову стають звичайними трубами.
se-add-menu-simulations=Якщо позначено, симуляції меню Space Exploration додаються до випадкового вибору.
se-remove-vanilla-simulations=Якщо позначено, симуляції меню базової гри прибираються з випадкового вибору.
se-default-simulation-length=Скільки триває симуляція меню Space Exploration перед завантаженням наступної.\nЗверніть увагу: деякі симуляції (зазвичай зі скриптовими діями) мають фіксовану тривалість, і це налаштування на них не впливає.
aai-loaders-belt-stacking-mode=Без мода для складання в стоси на конвеєрах це налаштування ні на що не впливає.
robot-attrition-repair=Параметри ремонту роботів. Знищені (будь-яким чином) логістичні роботи залишають предмет, який можна відновити в нового робота за автоматично створеним рецептом.
sqt-blacklist-types=Типи об'єктів через кому, які не слід змінювати, напр. "tree, inserter, electric-pole"
sqt-blacklist-names=Назви об'єктів через кому, які не слід змінювати, напр. "fast-inserter, small-electric-pole"
sqt-remove-collision=Прибрати зіткнення з гравцем для об'єктів, перелічених нижче.
sqt-remove-collision-types=Типи об'єктів через кому, з яких слід прибрати зіткнення, напр. "tree, inserter, electric-pole"
sqt-remove-collision-names=Назви об'єктів через кому, з яких слід прибрати зіткнення, напр. "fast-inserter, small-electric-pole"\nУВАГА: для об'єктів із поліпшеннями/погіршеннями зміни застосовуються до всієї групи поліпшень.
