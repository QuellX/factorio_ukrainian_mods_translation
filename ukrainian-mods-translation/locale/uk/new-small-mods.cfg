[tips-and-tricks-item-description]
cargo-ships-tip-1=Водні шляхи можна отримати, натиснувши кнопку водного шляху на панелі швидких дій або натиснувши __CONTROL__give-waterway__.
cargo-ships-tip-2=[entity=oil_tanker] можна під'єднати до шести [entity=ship-loading-pump] або [entity=ship-unloading-pump] для завантаження й розвантаження рідин.
cargo-ships-tip-3=[item=boat] можна розміщувати на водних шляхах або окремо — тоді ним можна керувати як автомобілем.
