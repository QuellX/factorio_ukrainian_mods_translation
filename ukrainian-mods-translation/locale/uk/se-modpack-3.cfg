[mod-setting-description]
factory-inspector-enable-verification=Періодично порівнює відстеження Factory Inspector із вбудованою статистикою виробництва Factorio, щоб виявляти помилки відстеження. Призначено для розробки й налагодження моду.
factory-inspector-display-window-seconds=За скільки секунд підсумовувати дані виробництва/споживання для відображення. Менші значення показують свіжішу активність, більші — згладжують коливання. Максимум 300 секунд (дані зберігаються лише 5 хвилин).
k2ag-matter-connectors=Використовувати втоплені ванільні муфти й заглушки труб на квантовому стабілізаторі замість окремих фітингів складального автомата. Зберігає всі чотири оригінальні рідинні порти.
k2ag-chemical-connectors=Використовувати підігнані ванільні муфти й стандартні заглушки труб з усіх боків хімічного каскаду.
k2ag-disable-ai-generated-content=Використовувати графіку, створену художниками, замість згенерованих зображень. Згенеровані зображення включають хімічний каскад і деяку відсутню замерзлу графіку.
k2ag-photometric-panel-tint=Фарбує вибрані нижній металевий корпус і фітинги фотометричної лабораторії в пурпуровий. Кругла облямівка лишається сріблястою, сині елементи, отвір вентилятора, труби й світіння зберігаються. Діє, лише якщо ввімкнено новий вигляд станції зарядки.
k2ag-quantum-panel-tint=Фарбує вибрані корпус і верхні панелі квантового стабілізатора в пурпуровий, зберігаючи камеру, труби, попереджувальні смуги й світіння. Діє, лише якщо ввімкнено новий вигляд складального автомата матерії.
k2ag-kr-fuel-refinery=Використовувати модель і анімації Fuel Refinery від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-advanced-assembling-machine=Використовувати модель і анімації Gravity Assembler від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-advanced-furnace=Використовувати модель і анімації Alloy Forge від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-advanced-chemical-plant=Використовувати модель і анімації Chemical Stager від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-atmospheric-condenser=Використовувати модель і анімації Scrubber від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-quarry-drill=Використовувати модель і анімації Core Extractor від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-greenhouse=Використовувати модель і анімації Greenhouse від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-bio-lab=Використовувати модель і анімації Pathogen Lab від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-matter-associator=Використовувати модель і анімації Quantum Stabilizer від Hurricane046. Масштабовано під розмір K2.
k2ag-kr-stabilizer-charging-station=Використовувати модель і анімації Photometric Lab від Hurricane046. Масштабовано під розмір 2×2 станції зарядки K2.
k2ag-kr-gas-power-station=Використовувати модель і анімації Thermal Plant від Hurricane046. Масштабовано під розмір K2.
generate-resources-underground=Якщо ввімкнено, ресурси генеруватимуться й на підземних рівнях, а на поверхні їх буде менше. Стартові родовища не змінюються й під землею не генеруються.\nЯкщо граєте на особливих типах світу, як-от railworld, можете вимкнути цей параметр.\n[color=yellow]Зміна цього параметра не впливає на наявні ресурси![/color]
enable-challenges=Якщо ввімкнено, підземні рівні стають складнішими — з ефектами забруднення й появою ворогів, — але натомість пропонують більше можливостей.\nЯкщо хочете використовувати мод лише для розвантаження бази без додаткових випробувань і можливостей, можете вимкнути цей параметр.
show-prospector-range=Показувати радіус розвідки на мапі.
dolly-save-entity=Тимчасово запам'ятовує об'єкти на X секунд, щоб їх можна було переміщувати, не вибираючи щоразу. 0 вимикає запам'ятовування.
dolly-clear-entity=Забувати запам'ятований об'єкт, щойно вибрано інший.
dolly-ignore-collisions=Дозволяє переміщувати об'єкти так, щоб вони перетиналися/накладалися. Типово заборонено глобальним параметром. Небезпечно й схоже на чит.
dolly-allow-ignore-collisions=Дозволити гравцям використовувати параметр "Ігнорувати колізії".
dolly-debug=Виводити налагоджувальну інформацію під час переміщення об'єктів. Якщо з модом виникли проблеми, спершу ввімкніть цей параметр.
dolly-ghost-move=Дозволити переміщувати привиди об'єктів.
dolly-item-destroy=Коли об'єкти переміщуються, а на землі лежать предмети, їх "засмоктує" в інвентар. Якщо інвентар повний, предмети знищуються замість відмови переміщувати об'єкт.
dolly-transporter-mode=Переміщує об'єкти, які зазвичай не можна перемістити, створюючи ідентичну копію й знищуючи оригінал (саме так насправді працює телепорт у "Зоряному шляху").
dolly-remote-move=Дозволяє переміщувати об'єкти, коли гравець не поруч, а дивиться на об'єкт у віддаленому огляді.
dolly-biter-move=Дозволяє переміщувати кусак і лігва кусак. Також стосується захоплених лігв.

