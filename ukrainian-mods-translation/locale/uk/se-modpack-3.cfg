[tips-and-tricks-item-description]
subsurface=Спустіться в темряву своєї планети! Натисніть __CONTROL__toggle-driving__, щоб змінити рівень.\n[entity=tunnel-entrance-cable] і вихід можна під'єднати до електромережі й логічної мережі, щоб передавати енергію й сигнали між рівнями.\nВикористовуйте [entity=wooden-support] чи [entity=steel-support], щоб розподіляти енергію. Опори також освітлюють простір.
clear-subsurface-deconstruction=Позначайте ділянки на підземних рівнях для розчищення будівельними роботами планувальником демонтажу (__CONTROL__select-for-cancel-deconstruct__). Роботи автоматично видобудуть усі стіни, що торкаються ділянки. Якщо ділянка повністю в порожнечі, нічого не станеться.\nЗверніть увагу: тут треба використовувати дію "скасувати наказ на демонтаж".
inter-surface-transport=Переміщуйте предмети, рідини чи тепло між рівнями. Маркери показують правильне місце для другої частини. Після розміщення перемикайте вхід і вихід клавішею __CONTROL__rotate__, а __CONTROL__reverse-rotate__ повертає проти годинникової стрілки (лише для ліфтів предметів і рідин).
subways=Метро дає потягам змогу їздити між рівнями.\nРозмістіть [entity=subway] на обох рівнях за маркерами (як у [tip=inter-surface-transport]).\nДодайте метро в розклад потяга. У списку доступні всі зупинки з усіх рівнів, тож можна складати багаторівневі розклади. Але з перериваннями будьте обережні: переконайтеся, що вони спрацьовують на правильному рівні.\nПотяги, що заїжджають у метро, зберігають швидкість. Ними не можна керувати, і вони не кермують, доки повністю не з'являться, тож переконайтеся, що ваша підземна залізниця вміщує найдовший потяг, який ви туди відправляєте, і він не застрягне. Один потяг може бути у двох метро одночасно.

