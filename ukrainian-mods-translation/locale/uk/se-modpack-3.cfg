[entity-description]
fluid-elevator=Використовуйте __CONTROL__rotate__ (поворот), щоб змінити напрямок потоку.\n__CONTROL__reverse-rotate__ (зворотний поворот) і далі повертає проти годинникової стрілки.
item-elevator=Використовуйте __CONTROL__rotate__ (поворот), щоб змінити напрямок транспортування.\n__CONTROL__reverse-rotate__ (зворотний поворот) і далі повертає проти годинникової стрілки.
active-air-vent=Активна вентиляційна шахта переміщує забруднення знизу вгору, але для роботи потребує електрики.\n\nПропускна здатність визначається базовою швидкістю виготовлення плюс подвоєним бонусом швидкості модулів, зі зменшенням на 80% за кожен підземний рівень.
air-vent=Пасивна вентиляційна шахта вирівнює забруднення між обома поверхнями. Якщо забрудненіша поверхня, воно розсіюватиметься під землю, тож переконайтеся, що там достатньо місця для розсіювання. Не потребує електрики.
prospector=Шукає найбагатше родовище в певному радіусі.
support=Опора, що запобігає обвалам, із проводкою й освітленням.
subway=Залізничне з'єднання між поверхнями.

