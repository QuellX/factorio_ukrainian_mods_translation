[mod-description]
AsphaltRoadsPatched=Асфальтове покриття для більшої швидкості транспорту. Також містить клітинки дорожньої розмітки (одинарні й подвійні лінії) і різні небезпечні зони. Оригінальний мод від Arcitos, оновлений до 2.0 MrFastZombie.

