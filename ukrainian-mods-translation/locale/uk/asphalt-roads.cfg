[mod-setting-description]
AR-use-items-from-bioindustries=Якщо ввімкнено, для виробництва асфальтових клітинок потрібен подрібнений камінь замість кам'яної цегли.
AR-use-items-from-woodgasification=Якщо ввімкнено, для виробництва асфальтових клітинок потрібна смола замість сирої нафти.
AR-use-items-from-corrundum=Якщо ввімкнено, для виробництва асфальтових клітинок потрібен 1 асфальтовий блок замість мазуту. Технологія асфальту з Corrundum стане передумовою. Вихід асфальтових клітинок також збільшиться до 15 замість 10.
AR-use-items-from-pypetrol=Якщо ввімкнено, для виробництва асфальтових клітинок потрібні гравій, смола й бітум.\n[img=utility/warning_white] [font=default-semibold][color=red]Цей параметр зазвичай перекриває інші параметри сумісності з модами.[/color][/font]
AR-use-stone=Якщо ввімкнено, для виробництва асфальтових клітинок не потрібна кам'яна цегла.\nЯкщо ввімкнено сумісність із Bio Industries чи Pyanodons, цей параметр нічого не робить.
AR-use-crude-oil=Якщо ввімкнено, для виробництва асфальтових клітинок не потрібна сира нафта.\nЯкщо ввімкнено сумісність із Wood Gasification чи Pyanodons, цей параметр нічого не робить.
AR-research-cost=Визначає вартість дослідження асфальту.\n\nЗнижена: потрібні лише дослідницькі пакети автоматизації й логістики\n\nЗвичайна: додатково потрібні хімічні дослідницькі пакети\n\nДорога: потрібні ще й виробничі дослідницькі пакети.
AR-require-adv-oil-processing=За звичайної чи дорогої вартості дослідження цей параметр вимагає дослідити технологію «Вдосконалена нафтопереробка».
AR-item-group=Вибрана група предметів містить усі рецепти, пов'язані з асфальтом. Типово рецепти показуються на вкладці логістики.
AR-asphalt-stack-size=Типовий розмір стосу — 100 предметів.\nМаксимум: 1000\nМінімум: 10
AR-enable-basic-marking-tiles=Позначте, якщо хочете використовувати асфальт із базовою розміткою.\n\nЗВЕРНІТЬ УВАГУ: якщо цей параметр вимкнено й ви завантажуєте збереження, де використано ці клітинки розмітки, усі вони будуть видалені!\n\nЯкщо ввімкнено, цей параметр займає 8 із 255 можливих слотів для клітинок.
AR-enable-colored-hazard-marking=Позначте, якщо хочете використовувати асфальт із кольоровою попереджувальною розміткою.\n\nЗВЕРНІТЬ УВАГУ: якщо цей параметр вимкнено й ви завантажуєте збереження, де використано ці клітинки розмітки, усі вони будуть видалені!\n\nЯкщо ввімкнено, цей параметр займає 8 із 255 можливих слотів для клітинок.
AR-enable-white-single-lines=Позначте, якщо хочете використовувати асфальт із білою дорожньою розміткою (одинарні лінії).\n\nЗВЕРНІТЬ УВАГУ: якщо цей параметр вимкнено й ви завантажуєте збереження, де використано ці клітинки розмітки, усі вони будуть видалені!\n\nЯкщо ввімкнено, цей параметр займає 12 із 255 можливих слотів для клітинок.
AR-enable-white-double-lines=Позначте, якщо хочете використовувати асфальт із білою дорожньою розміткою (подвійні лінії).\n\nЗВЕРНІТЬ УВАГУ: якщо цей параметр вимкнено й ви завантажуєте збереження, де використано ці клітинки розмітки, усі вони будуть видалені!\n\nЯкщо ввімкнено, цей параметр займає 12 із 255 можливих слотів для клітинок.
AR-enable-yellow-single-lines=Позначте, якщо хочете використовувати асфальт із жовтою дорожньою розміткою (одинарні лінії).\n\nЗВЕРНІТЬ УВАГУ: якщо цей параметр вимкнено й ви завантажуєте збереження, де використано ці клітинки розмітки, усі вони будуть видалені!\n\nЯкщо ввімкнено, цей параметр займає 12 із 255 можливих слотів для клітинок.
AR-enable-yellow-double-lines=Позначте, якщо хочете використовувати асфальт із жовтою дорожньою розміткою (подвійні лінії).\n\nЗВЕРНІТЬ УВАГУ: якщо цей параметр вимкнено й ви завантажуєте збереження, де використано ці клітинки розмітки, усі вони будуть видалені!\n\nЯкщо ввімкнено, цей параметр займає 12 із 255 можливих слотів для клітинок.
AR-enable-tile-reconverter=Якщо ввімкнено, предмети кольорового асфальту чи бетону можна перетворити назад на відповідний базовий предмет-клітинку клавішею __CONTROL__AR-event-revert-tiles__
AR-asphalt-walking-mod=Множник швидкості ходьби гравця асфальтовими клітинками. \nДля порівняння: в удосконаленого бетону типово 1,5.
AR-asphalt-friction-mod=Множник тертя транспорту на асфальтових клітинках. Менші значення дають транспорту швидше прискорення й вищу максимальну швидкість. Колісний транспорт це відчуває сильніше за інший. \nДля порівняння: в удосконаленого бетону типово 0,8.

