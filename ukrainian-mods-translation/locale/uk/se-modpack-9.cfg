[item-description]
small-fast-boats-ski-boat=Базова максимальна швидкість: 75 км/год без бонусів палива. Вантаж: 40 слотів. Потужність на повному газу: як у стандартного човна Cargo Ships.
small-fast-boats-go-fast-boat=Базова максимальна швидкість: 160 км/год без бонусів палива. Вантаж: 40 слотів. Потужність на повному газу: утричі більша, ніж у стандартного човна Cargo Ships.
small-fast-boats-racing-catamaran=Базова максимальна швидкість: 250 км/год без бонусів палива. Вантаж: 40 слотів. Потужність на повному газу: уп'ятеро більша, ніж у стандартного човна Cargo Ships.
small-fast-boats-hydroplane=Базова максимальна швидкість: 330 км/год без бонусів палива. Вантаж: 40 слотів. Потужність на повному газу: всемеро більша, ніж у стандартного човна Cargo Ships.

