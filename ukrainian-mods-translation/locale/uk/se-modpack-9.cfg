[technology-description]
hovercraft=Беззбройний ховеркрафт, швидкий і маневрений, з мінімальним бронюванням.
electric-hovercraft=Беззбройний ховеркрафт на електриці. Жертвує бронею заради найкращої швидкості й маневреності.
missile-hovercraft=Ховеркрафт, озброєний ракетами. Жертвує швидкістю й маневреністю заради значно кращої броні та стійкості до шкоди.
laser-hovercraft=Озброєна версія електричного ховеркрафта. Добре збалансований: швидкість, спритність, легка броня й стійкість до шкоди.
ehvt-equipment=Трансформатор, що регулює живлення для роботи потужних електродвигунів.
small-fast-boats-ski-boat=Побудуйте компактний буксирувальний катер для швидкого особистого пересування.
small-fast-boats-go-fast-boat=Побудуйте потужний швидкісний катер для швидких далеких подорожей.
small-fast-boats-racing-catamaran=Використайте структури малої щільності, щоб побудувати екстремальний гоночний катамаран.
small-fast-boats-hydroplane=Побудуйте глісер необмеженого класу — майже на практичній межі швидкості на воді.

