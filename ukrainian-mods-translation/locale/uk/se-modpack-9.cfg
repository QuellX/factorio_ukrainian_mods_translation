[mod-description]
small-fast-boats=Швидко перетинайте великі водойми на чотирьох човнах для Cargo Ships. У кожного 40 вантажних слотів. Базова максимальна швидкість — від 75 до 330 км/год. Керуйте ними вручну або пускайте за розкладом водними шляхами.
