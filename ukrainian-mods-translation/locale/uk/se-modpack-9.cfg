[mod-setting-description]
laserfix-color=Червоний = ванільний\nДиско = випадковий колір (двічі на секунду)\nВласний = виберіть колір значеннями нижче
laserfix-doubletint=Робить колір променя насиченішим
laserfix-r=Значення червоного (0-255)
laserfix-g=Значення зеленого (0-255)
laserfix-b=Значення синього (0-255)
laserfix-glow-r=Колір світіння на землі. (0-255)\nМалі числа роблять світіння менш помітним.\n(Рекомендую максимум 128)
laserfix-glow-g=Колір світіння на землі. (0-255)\nМалі числа роблять світіння менш помітним.\n(Рекомендую максимум 128)
laserfix-glow-b=Колір світіння на землі. (0-255)\nМалі числа роблять світіння менш помітним.\n(Рекомендую максимум 128)
glowing-science-colored-glow=Кожен дослідницький пакет світиться своїм кольором. Вимкніть для простого білого світіння.
glowing-science-glow-size=Масштабує світіння довкола кожного пакета, від 0.25 до 10 (типово: 1.8). Менше значення може підвищити FPS, коли вночі на екрані багато пакетів.
hovercraft-drifting=Дає ховеркрафту заносити на поворотах ("Старий"/"Новий") або те саме зі зменшеною затримкою введення в мультиплеєрі ціною трохи слабшого заносу ("Мала затримка A і B"). Увага: можна застрягти на скелях, каменях і об'єктах.
hovercrafts-electric=Вмикає електричний і лазерний ховеркрафти. Обидва працюють на електриці: встановіть у сітку обладнання трансформатор і портативні реактори або сонячні панелі. Вимкніть, щоб прибрати обидва.
hovercrafts-combat=Вмикає ракетний і лазерний ховеркрафти (озброєні варіанти). Вимкніть, щоб прибрати обидва. Примітка: лазерний ховеркрафт також потребує налаштування "Електричні ховеркрафти", бо працює на електриці.
port-crane-transfer-speed-multiplier=Множить швидкість руху стріли крана і під час завантаження, і під час розвантаження. Типове значення 10 — кран працює вдесятеро швидше за базову швидкість.

