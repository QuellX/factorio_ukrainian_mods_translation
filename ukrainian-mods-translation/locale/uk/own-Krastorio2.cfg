[technology-description]
automation-science-pack=З проривом ядра автоматизації багато процесів, які раніше виконувалися вручну, потенційно можуть бути автоматизовані.
kr-additional-engine-equipment=Додатковий двигун для транспорту, що збільшує прискорення та максимальну швидкість.
kr-advanced-additional-engine-equipment=Ще більш потужний додатковий двигун для автомобілів, що збільшує прискорення та максимальну швидкість.
kr-advanced-chemical-plant=Більш потужний хімічний завод.
kr-advanced-chemistry=Більш досконалі хімічні процеси для створення ще більш складних матеріалів.
kr-advanced-exoskeleton-equipment=Швидший екзоскелет.
kr-advanced-fuel=Ще більше потужного пального для ваших автомобілів та техніки.
kr-advanced-furnace=Більш потужна піч.
kr-advanced-lab=Більш ефективна лабораторія. Несумісна з базовими технологічними картами.
kr-advanced-pickaxe=Збільшує швидкість ручного добування.
kr-advanced-radar=Потужніший радар з більшим радіусом дії.
kr-advanced-roboports=Більш гнучкі способи зберігання та підзарядки ваших роботів.
kr-advanced-solar-panel=Більша та потужніша сонячна панель, наповнена імерситом.
kr-advanced-tank=Дуже важкоброньована і повільна штурмова машина, оснащена багатьма видами озброєння.
kr-advanced-tech-card=Імерсит відкрив абсолютно нову категорію передових, ефективних машин.
kr-ai-core=Розумна машина, що уможливлює абсолютно новий клас автоматизації.
kr-air-purification=Поглинання забруднення з атмосфери.
kr-antimatter-ammo=Розбирайте своїх ворогів на молекулярному рівні за допомогою цього передового боєприпасу.
kr-antimatter-reactor-equipment=Мініатюрний реактор на антиматерії, що забезпечує енергією ваші транспортні засоби та обладнання.
kr-antimatter-reactor=Перетворення матерії в чисту електричну енергію.
kr-atmosphere-condensation=Повільне втягування газів безпосередньо з атмосфери.
kr-automation=Більш потужна складальна машина. Має доступ до деяких передових процесів перетворення руд безпосередньо в проміжні продукти.
kr-automation-core=Стандартизоване механічне ядро машини багаторазового використання є першим кроком до повної автоматизації.
kr-battery-mk3-equipment=Ще більш потужний акумулятор для ваших автомобілів та техніки.
kr-bio-fuel=Більш потужне паливо для ваших автомобілів та техніки.
kr-bio-processing=Забезпечує автоматизоване збирання та використання біомаси.
kr-biter-virus=Потужний вірус, який знищить значну частину популяції кусак.
kr-containers=Більші контейнери для ваших речей.
kr-crusher=Дроблення будь-яких предметів. Деякі предмети повернуть компоненти, але більшість предметів будуть розчавлені повністю!
kr-decorations=Немає нічого подібного на штучну природу.
kr-efficient-fabrication=Більш ефективні способи виготовлення базових компонентів.
kr-electric-mining-drill-mk2=Швидші та ефективніші методи автоматичного видобутку корисних копалин.
kr-electric-mining-drill-mk3=Більш швидкі та ефективні методи автоматичного видобутку корисних копалин.
kr-energy-control-unit=Потужний трансформатор, що використовується для контролю енергії в електронних частинах, які мають високі енергетичні коливання.
kr-energy-shield-mk3-equipment=Більш ефективні засоби самозахисту.
kr-energy-shield-mk4-equipment=Більш ефективні засоби самозахисту.
kr-energy-storage=Більш ефективні засоби зберігання енергії.
kr-fission-reactor-equipment=Мініатюрний термоядерний реактор, здатний забезпечити пристойну кількість енергії для ваших транспортних засобів та спорядження.
kr-fluid-excess-handling=Спалювання будь-якої рідини, що призводить до виділення великої кількості забруднень та іноді деяких побічних продуктів.
kr-fluids-chemistry=Передові хімічні процеси для отримання нових матеріалів.
kr-fuel=Спеціалізоване паливо для вашого автотранспорту та спорядження.
kr-fusion-energy=Використовуйте силу зірки для виробництва величезної кількості енергії.
kr-gas-power-station=Безпосереднє спалювання рідин для отримання енергії.
kr-greenhouse=Вирощування деревини для заготівлі, а також вирощування рослин для прикраси та/або відновлення.
kr-imersium-processing=Винятково жорсткий, дуже легкий і високопровідний сплав. Його висока температура плавлення і вдосконалений хімічний склад роблять його надзвичайно ефективним, але дуже повільним у виробництві.
kr-intergalactic-transceiver=Використовуючи мікроскопічну чорну діру, ця машина забезпечує миттєвий зв'язок з будь-яким іншим передавачем у будь-якій точці Всесвіту. Активація цього передавача дозволить вам послати сигнал лиха на вашу рідну планету, щоб ви могли сподіватися на порятунок у майбутньому.
kr-iron-pickaxe=Збільшує швидкість видобутку.
kr-laser-artillery-turret=Концентрована енергія, що завдає величезної шкоди на дуже великій відстані.
kr-light-armor=Легка броня для певного захисту.
kr-lithium-processing=Речовина з низькою щільністю і високою реакційною здатністю, особливо корисна для зберігання енергії.
kr-lithium-sulfur-battery=Удосконалена батарея з використанням переваг літію.
kr-logistic-containers-1=Більші логістичні контейнери для ваших товарів.
kr-logistic-containers-2=Ще більші логістичні контейнери для ваших товарів.
kr-matter-cube=Стабілізована матерія, яку можна легко утримувати й транспортувати.
kr-matter-processing=Дозволяє перетворювати багато матеріалів у матерію, і навпаки.
kr-matter-tech-card=Сучасна квантова теорія відкрила можливість перетворення одного виду матерії в інший на фундаментальному рівні.
kr-mineral-water-gathering=Дозволяє видобувати [entity=kr-mineral-water] за допомогою [entity=pumpjack].
kr-nuclear-locomotive=Локомотив, що працює від мініатюрного ядерного реактора. Має значно збільшену максимальну швидкість та прискорення у порівнянні зі стандартними локомотивами.
kr-personal-laser-defense-mk2-equipment=Більш потужні засоби лазерного захисту.
kr-personal-laser-defense-mk3-equipment=Більш потужні засоби лазерного захисту.
kr-personal-laser-defense-mk4-equipment=Більш потужні засоби лазерного захисту.
kr-planetary-teleporter=Миттєве переміщення між двома точками на поверхні.
kr-portable-generator-equipment=Більший портативний генератор, здатний виробляти більше енергії для вашого спорядження.
kr-power-armor-mk3=Досягнення матеріалознавства дозволили створити дуже легку і міцну броню, значно збільшивши її вантажність.
kr-power-armor-mk4=Імерситові сплави та вдосконалення тіла за допомогою штучного інтелекту дозволили отримати найвищу форму особистого захисту та допомоги.
kr-quantum-computer=Високоспеціалізований дослідницький комп'ютер, здатний створювати найсучасніші технологічні карти та дослідницькі дані.
kr-quarry-minerals-extraction=Забезпечує видобуток і основне перероблення імерситу.
kr-radar=Безперервно контролює територію середнього розміру і періодично сканує велику площу.
kr-railgun-turret=Надзвичайно потужна турель, що спеціалізувалася на знищенні великих груп ворогів за один раз.
kr-rare-metal-mining=Дозволяє видобувати [entity=kr-rare-metal-ore] за допомогою бурів.
kr-rare-metal-processing=Руду рідкісних металів можна обробити для використання у різноманітних спорудах та процесах.
kr-reinforced-plates=Міцне, гладке покриття, по якому легко ходити.
kr-research-server=Сучасний комп'ютер, здатний виготовляти складні технологічні карти.
kr-robot-battery=Більш потужний акумулятор для ваших роботів.
kr-robot-battery-plus=Ще більш потужний акумулятор для ваших роботів.
kr-rocket-turret=Стрімка стрільба та потужний боєкомплект роблять ракетну турель ефективним засобом боротьби з ворожими полчищами.
kr-sentinel=Постійно контролює невелику територію.
kr-shelter=Після смерті ви відродитесь у своєму укритті. Кожна команда може мати лише одне укриття на поверхні.
kr-silicon-processing=Тверда, крихка речовина з надзвичайно поганою електропровідністю при кімнатній температурі, що дозволяє широко використовувати її в електроніці.
kr-singularity-beacon=Значно менший за розміром і потужніший маяк.
kr-singularity-lab=Високотехнологічна дослідницька лабораторія для складних технологічних карт.
kr-singularity-tech-card=Були відкриті методи вдосконаленого викривлення простору-часу, що дозволяють зловживати законами фізики для побудови ще більш ефективних і дивовижних машин.
kr-steel-fluid-handling=Якісніші труби, здатні до більшої пропускної здатності.
kr-steel-fluid-tanks=Більші резервуари для зберігання більшої кількості рідини.
kr-stone-processing=Завдяки силі скла багато раніше нездійсненних завдань стали можливими.
kr-superior-exoskeleton-equipment=Ще швидший екзоскелет.
kr-superior-inserters=Вдосконалені маніпулятори, виготовлені з імерситу, забезпечують неперевершену швидкість та місткість.
kr-superior-night-vision-equipment=Оптичні властивості імерситу дозволяють надати нічне бачення з ще більшою чіткістю.
kr-superior-solar-panel-equipment=Більш потужні сонячні панелі для ваших транспортних засобів та спорядження.
kr-tesla-coil=Забезпечує бездротову передачу енергії в сітку спорядження.
optimization-tech-card=Експерименти, що проводяться в умовах мікрогравітації, дають надзвичайно корисні дані, які приносять велику користь технологіям на землі.
rocket-silo=Надзвичайно складні апарати, здатні виводити себе на орбіту. Можуть проводити експерименти в умовах мікрогравітації.

