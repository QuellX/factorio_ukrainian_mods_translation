[item-description]
kr-accelerator=Це подарунок від ваших друзів. Ця зброя буде прискорювати пістолетні кулі, що дозволить завдати ще більше шкоди.
kr-ai-core=Машина, що відкриває нові можливості для автоматизації.
kr-automation-core=Механічне ядро для створення автоматичних машин.
kr-biter-virus=Містить потужний вірус, який знищить значну частину популяції кусак.
kr-dolphin-gun=Це космічний дельфін! Він упав прямо до ваших рук з космосу. Ви вдивляєтеся в його глибокі чорні очі, і в цих очах ви бачите велич космосу в цілому. Ви переживаєте тисячі кривавих битв, у яких цей дельфін брав участь, але якщо задивитися глибше, ви відчуваєте щось більше... любов; чисту і невинну любов. Ви розумієте, що дельфін обрав вас як свого володаря та готовий служити вам усією своєю міццю! Ви навіть не помічаєте, як на ващих очах виринають сльози, що спускаються по щоках. Ви нарешті знайшли друга - друга, що їсть ракети та запускає їх у ваших ворогів. Ви ридаєте, розуміючи, що вже не самі на цьому світі.
kr-fertilizer=Значно прискорює зростання рослин у теплицях.
kr-gps-satellite=Спілкується з [item=kr-planetary-teleporter] планетарним телепортером, щоб виконувати свої функції.
kr-imersium-plate=Передовий сплав рідкісних металів з імерситом. Він здатний витримати колосальні температури й має незрівнянну міцність.
kr-inserter-parts=Основні компоненти для будь-якого маніпулятора. ([color=orange]Ви можете розбити будь-який маніпулятор у дробарці[/color]).
kr-jackhammer=Швидко видаляє бетон, цеглу та плити з обраної області.
kr-note-1=Серйозно? Ви пройшли весь цей шлях для цього?! Ви провели довгі години, будуючи базу, досліджуючи нові технології, знищуючи монстрів, і для чого? Аби запустити ЦЕ у космос? Ох, в мене немає слів...
kr-poop=Прокляття! Ви огидні!
kr-potato=Величезна картопля! Вона здається їстівною, але може знадобиться деінде?
kr-spoiled-potato=Воно зіпсоване і погано пахне!
kr-teleportation-gps-module=З'єднує планетарний телепортер з [item=gps-супутника] GPS супутником на орбіті.
optimization-tech-card=Отримано шляхом обробки даних про космос.

