kr-about-k2=Krastorio - це глобальна модифікація, яка привносить в гру величезну кількість нового контенту: понад 40 нових сутностей (більше 60, якщо врахувати колірні варіації), більше сотні предметів, близько сотні нових технологій, нова зброя, нові бойові та паливні системи, нові сигнали, радіацію та багато іншого. \n[color=green]Багато аспектів моду можна змінити в налаштуваннях гри[/color].\n\n[font=default-bold]А В Т О Р И[/font]\n\n[font=default-bold]Основні автори моду:[/font]\n     - Krastor\n     - Linver\n\n[font=default-bold]Поточні підтримувачі моду:[/font]\n     - raiguard\n\n[font=default-bold]Перекладачі:[/font]\n     [font=default-semibold]- Італійська:[/font] TheRealPagi, Wip -Sama, Lorenzo Rosei\n     [font=default-semibold]- Російська:[/font] Nodonoz, NickLatkovich, Murenion\n     [font=default-semibold]- Спрощена Китайська:[/font] Figsoda, Larry Wang, Xiaolianyy04, Naclfish, Nonoroazoro\n     [font=default-semibold]- Традиційна Китайська:[/font] Kingyu\n     [font=default-semibold]- Японська:[/font] BIRD, Onsen, Ym, Twistane\n     [font=default-semibold]- Польська:[/font] Virthalas, Nershir\n     [font=default-semibold]- Корейська:[/font] Kuhave, Seojy0619, Sindaehyeon338\n     [font=default-semibold]- Українська:[/font] Met_en_Bouldry, RMuskovets, Yuriy (de_jure), Shmotya, Володимир Кость, Anton Fedorenko, RayInDay, gazlowned\n     [font=default-semibold]- Турецька:[/font] Sarp Hangisi, Sinanbasar, Hasan Tunca Uysal\n     [font=default-semibold]- Німецька:[/font] Stimpatch, Fighter1000, Learbor, Fuggschen, Klaus Zinsmeister, Kildjan, Tobias Franz, BluePsyduck, Julian1701, Arcitos, Andreas_CH, RobocrafterLP, Bambam33, Heiko Domeier, Stefan Walesch, та інші!\n\n[font=default-bold]Особлива подяка:[/font]\n     - AstaZora\n     - Bilka\n     - BiusArt\n     - Xon\n\n[font=default-bold]І особлива подяка нашим давнім прихильникам Patreon:[/font]\nmkaito, Brayden McLean, bob, James Kelley, John Wrangle, Senard, Chris Hazen, Egdod, Josh Strunk, Andromeda Fallen, Andrew Deren, Aski Raven, Austin, Dmitrii, George Simpson, GeneralTank, Jonas Rejman, Jan Šipr, lordfiSh, Ivan Devyatko, Mark Harrison, Maximilian Bork, Matt Tyler, Koshirun Treebone, Konstantin Popichev, ReysDad, Rivsung, Russell Obets, Saulius Zilis, Сергій Руденко, Alright, George Elliott-Hunter, Jan Dragsbæk, rcobbe, donut7163, circk, dr.feelgood999, DarkStroker, Vladimir Kravtsov, Windsinger, Tobi, Arun Bhat, Zoey Oliva, sollevix, Andrew Spade, Adrian Leonhard, billbo99, Chanz, craig a, Charles Paquin, Chosen, Dang Quang, Daniel Vollmer, Deterlo, Dirk M, Donny, Gareth Knowles, JustSoul, Kai-Chi Huang, Kartikay Bagla, Loïc Gremaud, Niv, Nozoki, Pavlo Bulanchuk, Peter Zelenay, peter50216, Paweł G., Raymond, Ryan Barker, Seleck, Shafnir, Simon Harvey, Srdis, Сергей Ложкин, Charles Paquin, Dang Quang, Hackerman, Igor Borisov, jmsantos94, Marco Montemarani, Mopolo, Raymond Lau, Ryan, Showwin, Wolfgang Weber, webchip, antt1995, Влад.
kr-intergalactic-transceiver=Запуск ракети призводить лише до виробництва дослідницьких даних для технологічних карт оптимізації. Щоб виграти гру, вам потрібно побудувати [entity=kr-intergalactic-transceiver] та активувати його.\n\nМіжгалактичний передавач потребує 30 ТДж (тераджоулів) енергії та має максимальну швидкість зарядки 60 ГВт. Після повного заряджання він автоматично активується, надаючи перемогу команді гравців, яка його розмістила. Потім він перестане поглинати електроенергію і замість цього почне подавати енергію зі швидкістю 10 ГВт, подібно до одноразового акумулятора, але забезпечить енергією назавжди.\n\nЯк тільки передавач почне заряджатися, йому потрібен постійний потік електроенергії для підтримки сингулярності під контролем. [color=red]Якщо він перестане отримувати електроенергію більше ніж на 2 секунди, він буде втрачати енергію зі швидкістю 20% кожні дві секунди, поки не досягне 2 ГДж.[/color], і врешті-решт вимкнеться.\n\nУвага! Після видобутку міжгалактичний передавач [color=orange]втратить всю накопичену енергію[/color].
kr-new-gun-play=Бойова частина гри була повністю перероблена. Тепер кулі — це фізичні об’єкти, які мають свою швидкість і опір повітря. Крім того, кулі пофарбовані у свій колір і мають унікальні особливості:\n — Жовті кулі є найбільш поширеними. Стандартна швидкість, але збільшена скорострільність.\n – Червоні кулі мають збільшену шкоду та стандартну швидкість.\n – Зелені кулі – це кулі зі збідненим ураном. Вони мають стандартну швидкість, але завдають додаткової радіаційної шкоди.\n — Пурпурні кулі — це кулі, які містять імерсит. Ці кулі мають підвищену початкову швидкість і завдають додаткової енергетичної шкоди.\n\nТакож дальність пострілу та швидкість кулі залежать від її розміру та довжини зброї. Відповідно, кулі снайперської гвинтівки є найшвидшими, кулі гвинтівки трохи повільніші, а пістолетні — найповільніші. \n\n[color=orange]Ця опція рекомендована для покращення одноосібного ігрового процесу Krastorio 2, але затримка в багатоосібному режимі може спричинити проблеми, оскільки кожна куля є фізичним об’єктом, який потрібно синхронізувати між усіма гравцями. Щоб це виправити, скористайтеся опцією автоматичного прицілювання в налаштуваннях гри[/color]!
kr-radiation=Krastorio 2 додає радіаційну шкоду [img=virtual-signal/kr-nuclear-2]. Коли гравці наближаються до родовищ [item=uranium-ore], вони можуть постраждати від радіації. Це також трапляється, якщо в їхньому інвентарі є предмети зроблені з урану.\n\nЩоб зменшити цей ефект, достатньо носити броню. Ліпша броня дає краще зменшення радіаційного ураження.\n\nБоєприпаси на основі урану не є радіоактивними, але завдають радіаційної шкоди своїм цілям. Цей тип шкоди є дуже ефективним проти кусак, оскільки вони не мають стійкості до радіації.
kr-roboports-hotkey=У Krastorio 2 ви можете натиснути __CONTROL__kr-change-roboport-state__ під час наведення миші на робопорт, щоб змінити його робочий режим. Доступні режими:\n\n - Звичайний режим: мала дальність логістики, середня дальність будівництва.\n - Режим логістики: середня дальність логістики, відсутнє будівництво.\n - Режим будівництва: відсутня логістика, велика дальність будівництва.
