kr-advanced-steam-turbine=Споживає високотемпературну пару з [entity=kr-fusion-reactor] Термоядерного реактора для виробництва електричної енергії.
kr-air-purifier=Вбирає забруднення в чанку, де він розміщений. Фільтри мають 10% шансу бути знищеними.
kr-atmospheric-condenser=Повільно виділяє гази з атмосфери.
kr-bio-lab=Вирощує біомасу та інші біологічні продукти.
kr-burner-leech-description=Цей маніпулятор може забирати паливо з печей (або будь-якого іншого об'єкта), до якого він може дотягнутися.
kr-crusher=Розбиває предмети. З деяких повернуться компоненти, але більшість буде знищена!
kr-electrolysis-plant=Пропускає електрику крізь рідини для хімічних реакцій.
kr-filtration-plant=Фільтрує деякі матеріали з рідин.
kr-flare-stack=Спалює будь-яку рідину, створюючи велику кількість забруднення та іноді деякі побічні продукти.
kr-fusion-reactor=Зливає атоми в [item=dt-fuel] паливі для отримання великої кількості енергії. Один ядерний реактор може підтримувати 20 покращених парових турбін.
kr-gas-power-station=Спалює рідину для виробництва енергії. Це не вигідно, але просто!
kr-greenhouse=Вирощує деревину для заготівлі, а також культивує рослини для прикраси та/або відновлення.
kr-legacy-steel-pipe-to-ground=Підземна труба, яка підтримує більший тиск. Цей об'єкт забезпечує міграцію збережень до версії 2.0. Якщо ви розберете цей об'єкт, ви не зможете його отримати назад!
kr-matter-associator=Перетворює матерію на проміжні продукти.
kr-matter-plant=Перетворює матеріали у матерію.
kr-planetary-teleporter=Миттєво телепортує одного гравця до іншого телепорту на тій же поверхні.
kr-rocket-silo=Створює та запускає ракети в космос.
kr-sentinel=Постійно стежить за невеликою ділянкою.
kr-shelter-plus=Покращений будинок для енергетичних демонів! Встановлює точку появи вашої команди. Команда може мати лише одне укриття на поверхню.
kr-shelter=Встановлює точку появи вашої команди. Команда може мати лише одне укриття на поверхню.
kr-stabilizer-charging-station=Заряджає стабілізатори матерії.
kr-steel-pipe=Труба, яка підтримує більший тиск.
kr-steel-pipe-to-ground=Підземна труба, яка підтримує більший тиск.
kr-tesla-coil=Підзаряджає сітки спорядження, які мають [item=energy-absorber] Поглинач енергії. Дві вежі не можна розміщувати занадто близько одна до одної!
kr-wind-turbine=Виробляє невелику кількість енергії з повітря. Не можна розмістити на відстані меншій ніж три клітинки від іншої турбіни.

