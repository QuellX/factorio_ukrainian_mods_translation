[mod-setting-description]
kr-containers=Додає середні та великі контейнери для зберігання. Вимкніть, щоб використовувати контейнери з інших модів (наприклад, AAI Containers).
kr-finite-oil=Робить нафту і мінеральну воду скінченними з постійною швидкістю видобутку.
kr-loaders=Додає завантажувачі. Вимкніть, щоб використовувати завантажувачі з інших модів (наприклад, miniloaders).
kr-main-menu-background=Для перегляду фону меню вимкніть "Показувати ігрові симуляції у фоновому режимі" в налаштуваннях графіки.
kr-realistic-weapons=Додає нові види боєприпасів, зброї та турелей. Кулі - це фізичні об'єкти, які мають аеродинаміку і можуть бути заблоковані ігровими об'єктами. Вам доведеться самостійно цілитися - гра не буде цілитися за вас.\n[color=orange]Це рекомендується для поліпшення одноосібної гри в Krastorio 2, але в багатоосібній грі затримки можуть викликати проблеми, так як кожна куля є фізичним об'єктом, який повинен бути синхронізований між усіма гравцями.[/color] (За замовчуванням: увімкнено)
kr-realistic-weapons-auto-aim=Увімкніть цю опцію, щоб знову увімкнути автоматичне наведення зброї при використанні більш реалістичної зброї. Особливо корисно для багатокористувацької гри, де затримка може ускладнити влучання в ціль.
kr-shelter-tint=Змінює колір укриття+.\n[color=cyan]Ця опція тільки для інженерів, які підтримували розробку К2[/color]!

