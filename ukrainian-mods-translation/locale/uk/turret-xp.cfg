[mod-setting-description]
turret-xp-xp-per-damage=Досвід за кожну одиницю фінальної шкоди, завданої кулеметними турелями. Типово низький, бо сума шкоди швидко зростає.
turret-xp-xp-per-kill-credit=Досвід за одне повне зарахування вбивства. Ділиться між кулеметними турелями пропорційно до внеску в шкоду.
turret-xp-level-base-xp=Досвід, потрібний для переходу з рівня 0 на рівень 1 до застосування зростання.
turret-xp-level-growth=Лінійний крок зростання вимоги досвіду для кожного наступного рівня. За типового значення 1.65 кожен рівень додає 65% базового досвіду до наступної вимоги.
turret-xp-travelling-asteroid-xp-multiplier=Множник досвіду за шкоду й вбивства астероїдів і їхніх уламків, поки платформа летить між космічними локаціями. Діє під час отримання досвіду й не складається з множником платформи для боїв не з астероїдами.
turret-xp-stopped-asteroid-xp-multiplier=Множник досвіду за шкоду й вбивства астероїдів і їхніх уламків, поки платформа стоїть, на паузі чи інакше не рухається між космічними локаціями. Типово нижчий, бо потік астероїдів на місці повторюваний і малоризиковий. Діє під час отримання досвіду.
