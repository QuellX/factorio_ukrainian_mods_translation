[technology-description]
eRisel-advanced-anti-materiel-ammo=Відкриває магазини крупнокаліберної гвинтівки з отруйними, вибуховими й запалювальними зарядами.
eRisel-advanced-ammo=Відкриває гвинтівкові боєприпаси з отруйними, вибуховими й запалювальними зарядами.
eRisel-advanced-shotgun-ammo=Відкриває дробові набої зі спеціальними отруйними, вибуховими й запалювальними зарядами.
eRisel-cannon-shells=Відкриває великокаліберні снаряди з отруйними, фугасними й запалювальними зарядами.
eRisel-advanced-rockets=Відкриває ракети з отруйними, фугасними й запалювальними зарядами.
eRisel-shotgun-turrets=Відкриває автоматичну турель, що стріляє дробовими набоями.
eRisel-focused-sniper-turret=Відкриває спрямовану турель великої дальності, призначену стріляти крупнокаліберними набоями по важкоброньованих цілях.
eRisel-advanced-flamethrower-fuel=Відкриває виробництво напалму й різні типи запалювальних боєприпасів.
eRisel-light-railgun-turret=Відкриває легку рейкотронову турель і базові боєприпаси до неї ще до повної технології рейкотрона.
cds-cannon-turret-rapid-tech=Відкриває автоматичну гарматну турель для оборонних ліній. Стріляє стандартними великокаліберними снарядами на середню відстань з безпечною мінімальною дистанцією ураження.
basic-missile-defense-system=Відкриває низькотехнологічну ракетну турель з вузьким сектором обстрілу й середньою дальністю. Найкраще для запланованої периметральної оборони, а не для захисту зблизька.
advanced-missile-defense-system=Відкриває кругову ракетну турель з вищою швидкістю стрільби й збалансованою дальністю. Дає гнучке покриття навколо позиції й тримає цілі подалі від пускової установки.
ballistic-missile-defense-system=Відкриває найліпшу ракетну систему оборони ближньої дії для важкої периметральної оборони.
eRisel-ballistic-missile-defense-system-long-range=Відкриває найліпшу ракетну систему оборони далекої дії зі значно збільшеною дальністю за меншої швидкості стрільби.
eRisel-advanced-railgun-shells=Відкриває снаряди рейкотрона з фугасними, запалювальними й отруйними зарядами.
eRisel-advanced-artillery-shells=Відкриває артилерійські снаряди із запалювальними й отруйними зарядами для масштабного блокування території.
eRisel-armory=Відкриває спеціалізоване високопродуктивне виробництво військового спорядження.
eRisel-repair-turret=Ремонтна турель, перебудована з нуля з упором на найкращу продуктивність. Оптимізована для мінімального навантаження на UPS. Якщо ви раніше користувалися ремонтними турелями, ця версія суттєво відрізняється й потребує постачання ремонтних наборів у кожну турель окремо.
eRisel-armory-productivity=Підвищує продуктивність збройової майстерні на 25%.
eRisel-armory-productivity-2=Ще підвищує продуктивність збройової майстерні на 25%.
eRisel-armory-productivity-3=Ще підвищує продуктивність збройової майстерні на 25%.
maintenance-hub=Відтворює фульґорську ремонтну технологію як автоматичну станцію для ремонту на великій площі з живленням від електрики. УВАГА: створення матерії з електрики — енергоємний і нестабільний процес. Будь-що не допустіть знищення цієї споруди.
eRisel-advanced-repair-pack=Відкриває вдосконалений ремонтний набір, що підвищує швидкість і ефективність ремонту в ремонтній турелі.
eRisel-superior-repair-pack=Найкраще рішення для ремонту вашої бази.
eRisel-concrete-walls=Відкриває бетонні стіни й брами.
eRisel-refined-concrete-walls=Відкриває стіни й брами з очищеного бетону.
eRisel-reinforced-walls=Відкриває чорні й білі посилені стіни й брами.
cds-cannon-turret-tech=Ця гармата — перший крок до використання справді великокаліберних боєприпасів проти ворога. Важкоброньована турель, що стріляє смертоносними гарматними снарядами з пристойною швидкістю. Її справжня слабкість — швидкість наведення.
cds-cannon-turret-heavy-tech=Ця турель — сміливий новий напрям гарматної оборони. Вогнева міць зростає завдяки ще більшому калібру снаряда з небаченою кількістю вибухівки. Ствол і основу турелі суттєво посилено, щоб витримувати силу пострілів. Несподіваний, але приємний побічний ефект цих змін — значно більша ефективна дальність ціною швидкості стрільби.
dw-deer-tech=Зброя блокування території з обмеженим сектором і значною мінімальною дальністю. Послаблює нападників і стримує розширення ворогів.

