[item-description]
eRisel-poison-rifle-magazine=Бронебійні гвинтівкові набої, оброблені токсином. Після влучання завдають тривалої шкоди отрутою.
eRisel-he-rifle-magazine=Бронебійні гвинтівкові набої з невеликим вибуховим зарядом для додаткового вибухового удару й легкого відкидання.
eRisel-incendiary-rifle-magazine=Бронебійні гвинтівкові набої, заповнені напалмом. Підпалюють ціль, і вона ще недовго горить.
eRisel-poison-shotgun-shell=Дробові набої зі шротом, вкритим токсином. Ефективні проти щільних груп на близькій відстані.
eRisel-high-explosive-shotgun-shell=Дробові набої з дрібним вибуховим шротом. Завдають вибухового удару й легкого відкидання на широкій площі.
eRisel-incendiary-shotgun-shell=Дробові набої із запалювальним шротом, що підпалює цілі на близькій відстані.
eRisel-uranium-shotgun-shell=Дробові набої з щільним урановим шротом для кращого пробиття броні.
eRisel-high-explosive-anti-materiel-rifle-magazine=Важкі крупнокаліберні набої з вибуховим зарядом для міцних цілей, із сильнішим відкиданням.
eRisel-incendiary-anti-materiel-rifle-magazine=Важкі крупнокаліберні набої, що підпалюють ціль і дають сильніше горіння.
eRisel-poison-anti-materiel-rifle-magazine=Важкі крупнокаліберні набої з концентрованим токсином для сильної тривалої шкоди отрутою.
eRisel-poison-cannon-shell=Вибухові великокаліберні снаряди, що під час влучання випускають стійку токсичну хмару.
eRisel-high-explosive-cannon-shell=Великокаліберні снаряди зі збільшеним вибуховим зарядом і ширшим радіусом вибуху.
eRisel-incendiary-cannon-shell=Великокаліберні снаряди, що розкидають палаючий напалм по зоні влучання.
eRisel-poison-rocket=Вибухові ракети з токсичним зарядом, що залишає стійку отруйну хмару.
eRisel-high-explosive-rocket=Вибухові ракети з важчою бойовою частиною й ширшим радіусом вибуху.
eRisel-incendiary-rocket=Вибухові ракети, що розкидають палаючий напалм на великій площі.
eRisel-napalm-ammo=Боєприпаси для вогнемета з загущеним запалювальним паливом. Горять довше й б'ють сильніше за стандартне паливо.
eRisel-shotgun-turret=Автоматична турель, пристосована стріляти дробовими набоями. Розкид дробу прикриває близькі підходи.
eRisel-focused-sniper-turret=Вдосконалена кулеметна турель, що використовує крупнокаліберні набої. Має збільшену дальність і високу шкоду за постріл, але потребує трохи електроенергії, щоб розганяти снаряди до потрібної швидкості. Добре пробиває важкоброньовані цілі.
eRisel-concrete-wall=Міцніша стіна з бетону з покращеною стійкістю до отрути, вибухів, лазерів і фізичної шкоди.
eRisel-refined-concrete-wall=Міцніша бетонна стіна з сильнішим фізичним захистом.
eRisel-black-reinforced-wall=Важка посилена стіна з чорних посилених плит. Дуже міцна й стійка до фізичної шкоди.
eRisel-white-reinforced-wall=Важка посилена стіна зі світлих посилених плит. Дуже міцна й стійка до фізичної шкоди.
eRisel-concrete-gate=Посилена брама для бетонних стін.
eRisel-refined-concrete-gate=Посилена брама для стін з очищеного бетону.
eRisel-black-reinforced-gate=Посилена брама для чорних посилених стін.
eRisel-white-reinforced-gate=Посилена брама для білих посилених стін.
eRisel-high-explosive-railgun-shell=Снаряди рейкотрона з важчим вибуховим зарядом і ширшим радіусом вибуху.
eRisel-incendiary-railgun-shell=Вибухові снаряди рейкотрона, заповнені напалмом. Розкидають палаюче паливо по зоні влучання.
eRisel-poison-railgun-shell=Вибухові снаряди рейкотрона з токсичним зарядом, що випускає стійку отруйну хмару.
eRisel-incendiary-artillery-shell=Артилерійські снаряди, заповнені напалмом. Завдають сильної ударної шкоди й поширюють вогонь на великій площі.
eRisel-poison-artillery-shell=Артилерійські снаряди з токсичним зарядом. Завдають сильної ударної шкоди й накривають зону ураження отрутою.
eRisel-armory=Спеціалізоване військове виробництво з вбудованою продуктивністю 25%. Продуктивність можна ще підвищити спеціальними технологіями.
eRisel-repair-turret=Ремонтна турель, перебудована з нуля з упором на найкращу продуктивність. Оптимізована для мінімального навантаження на UPS. Для роботи потребує ремонтних наборів у внутрішньому слоті.
maintenance-hub=Ремонтує дружні споруди лише за рахунок електрики. УВАГА: створення матерії з електрики — енергоємний і нестабільний процес. Будь-що не допустіть знищення цієї споруди.
eRisel-advanced-repair-pack=Підвищує швидкість і ефективність ремонту в ремонтній турелі.
eRisel-superior-repair-pack=Підвищує швидкість і ефективність ремонту в ремонтній турелі.
dw-deer-turret=Ракетна артилерійська турель з фіксованим напрямком
dw-deer-ammo-basic=Базова артилерійська ракета з зарядом площинної детонації
dw-deer-ammo-basic-crate=Ящик щільно запакованих артилерійських ракет. Будь ласка, розпакуйте перед використанням, інакше гарантія втрачається. doeWorks не відповідає за будь-яку шкоду (психічну, фізичну чи духовну) від спроби вистрілити запакованим ящиком вибухівки з D.E.E.R.

