[mod-setting-description]
eRisel-incendiary-ammo-balance=Якщо ввімкнено, у рецептах запалювальних боєприпасів дизельне пальне замінюється напалмом. Баланс мода розрахований на ввімкнене налаштування.
eRisel-vanilla-space-age-rocket-turret-rebalance=Якщо ввімкнено, значно посилює ванільну ракетну турель Space Age, щоб вона лишалася сильнішою за альтернативи на Наувісі. Вимкніть, якщо хочете використовувати ванільну ракетну турель переважно для захисту космічних платформ від астероїдів.
eRisel-balanced-space-platform-turret-placement=Для гравців, які хочуть зберегти ванільний досвід Space Age із захистом космічних платформ від астероїдів. Якщо ввімкнено, вибрані неванільні турелі не можна будувати на космічних платформах.
eRisel-k2-late-game-combat-buffs=Зберігає вибрані турелі й бойовий транспорт пізньої гри K2SO конкурентоспроможними в збірках із сильнішими варіантами ворогів. Вмикає посилення лазерної артилерії K2, далекобійної ракетної турелі, дальності легкої рейкотронової турелі, вдосконаленого танка й важкої броньованої машини.
eRisel-k2-light-railgun-early-unlock=Переносить легку рейкотронову турель K2 на раніше окрему технологію й робить її шкоду та швидкість стрільби залежними від стандартних технологій шкоди снарядів і швидкості стрільби. Вимкніть, щоб зберегти оригінальне розміщення технології та масштабування вдосконалень K2SO.
eRisel-disable-standard-repairs=УВАГА: вимикає ремонт ремонтними наборами і для будівельних роботів, і для гравця. Увімкніть, якщо хочете, щоб ремонтом займалися лише спеціальні ремонтні споруди, як-от ремонтна турель і ремонтний вузол. Може зменшити навантаження на UPS у сильно пошкоджених автоматизованих базах.
eRisel-organize-combat-crafting-menu=Перегруповує бойові предмети й рецепти в окремі рядки за сімействами турелей і боєприпасів, стінами, допоміжними спорудами й військовими витратними матеріалами. Сумісні боєприпаси й турелі з інших модів упорядковуються автоматично, де можливо.
cds-cannon-projectile-friently-fire=Вмикає або вимикає зіткнення гарматних снарядів із дружніми об'єктами.
cds-cannon-projectile-explosion-friently-fire=Вмикає або вимикає зіткнення вибуху гарматних снарядів із дружніми об'єктами.
cds-artillery-shell-range-modifier=Бонус дальності важкої турелі з артилерійськими боєприпасами. (100% — без бонусу)
cds-basic-cannon-turret-health=Здоров'я базової гарматної турелі.
cds-basic-cannon-turret-min-range=Мінімальна дальність базової гарматної турелі в клітинках. Ближчі цілі не обстрілюються.
cds-basic-cannon-turret-range=Максимальна дальність базової гарматної турелі в клітинках. Дальші цілі не обстрілюються.
cds-basic-cannon-turret-turn-range=Кут сектора, у якому базова гарматна турель атакує цілі (у градусах).
cds-basic-cannon-turret-fire_rate=Скільки разів на секунду (за 60 кадрів) стріляє базова гарматна турель
cds-rapid-cannon-turret-health=Здоров'я вдосконаленої гарматної турелі.
cds-rapid-cannon-turret-min-range=Мінімальна дальність вдосконаленої гарматної турелі в клітинках. Ближчі цілі не обстрілюються.
cds-rapid-cannon-turret-range=Максимальна дальність вдосконаленої гарматної турелі в клітинках. Дальші цілі не обстрілюються.
cds-rapid-cannon-turret-turn-range=Кут сектора, у якому вдосконалена гарматна турель атакує цілі (у градусах).
cds-rapid-cannon-turret-fire_rate=Скільки разів на секунду (за 60 кадрів) стріляє вдосконалена гарматна турель
cds-heavy-cannon-turret-health=Здоров'я важкої гарматної турелі.
cds-heavy-cannon-turret-min-range=Мінімальна дальність важкої гарматної турелі в клітинках. Ближчі цілі не обстрілюються.
cds-heavy-cannon-turret-range=Максимальна дальність важкої гарматної турелі в клітинках. Дальші цілі не обстрілюються.
cds-heavy-cannon-turret-turn-range=Кут сектора, у якому важка гарматна турель атакує цілі (у градусах).
cds-heavy-cannon-turret-fire_rate=Скільки разів на секунду (за 60 кадрів) стріляє важка гарматна турель
cds-heavy-cannon-shell-range-modifier=Бонус дальності важкої турелі з цими боєприпасами. (100% — без бонусу)
cds-heavy-cannon-shell-damage-area=Ефективна площа вибуху від влучання. Усі вороги в межах стількох клітинок від вибуху отримають шкоду.
cds-heavy-cannon-shell-physical-damage=Фізична шкода важкого великокаліберного снаряда.
cds-heavy-cannon-shell-explosion-damage=Вибухова шкода важкого великокаліберного снаряда.
cds-heavy-cannon-shell-stack-size=Скільки боєприпасів уміщується в один слот інвентарю.
cds-heavy-cannon-shell-weight=Вага боєприпасу для розрахунку місткості ракети.
mds-basic-fire-pattern=Форма зони, у якій базова турель атакує цілі.
mds-basic-fire-arc-degree=Кут сектора, у якому базова турель атакує цілі. Використовується, лише якщо «Схема вогню» — «Сектор».
mds-basic-fire-rate=Скільки разів на секунду (за 60 кадрів) стріляє базова турель
mds-basic-min-range=Мінімальна дальність базової турелі в клітинках.
mds-basic-max-range=Максимальна дальність базової турелі в клітинках.
mds-advanced-fire-pattern=Форма зони, у якій вдосконалена турель атакує цілі.
mds-advanced-fire-arc-degree=Кут сектора, у якому вдосконалена турель атакує цілі. Використовується, лише якщо «Схема вогню» — «Сектор».
mds-advanced-fire-rate=Скільки разів на секунду (за 60 кадрів) стріляє вдосконалена турель
mds-advanced-min-range=Мінімальна дальність вдосконаленої турелі в клітинках.
mds-advanced-max-range=Максимальна дальність вдосконаленої турелі в клітинках.
mds-ballistic-fire-pattern=Форма зони, у якій балістична турель атакує цілі.
mds-ballistic-fire-arc-degree=Кут сектора, у якому балістична турель атакує цілі. Використовується, лише якщо «Схема вогню» — «Сектор».
mds-ballistic-fire-rate=Скільки разів на секунду (за 60 кадрів) стріляє балістична турель
