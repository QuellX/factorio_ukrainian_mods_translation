[tips-and-tricks-item-description]
spidertron-automation=Автоматизація павукотронів, раніше Constructron-Continued.\n\n[font=default-bold]Автоматизовані павукотрони[/font]\nможуть пересуватися, задавати логістичні запити, будувати, демонтувати, ремонтувати, вдосконалювати об'єкти/креслення й знищувати ворогів будь-якого розміру будь-де на мапі, беручи предмети з вашої логістичної мережі, — найкраща автоматизація «запусти й забудь» і зручність для мегабаз із неперевершеним масштабуванням.\n\n[font=default-bold]Що таке конструктрон?[/font]\nЦе буквально автоматичний павукотрон. Жодної чорної магії чи людини за завісою. Усю поведінку можна відтворити в базовій грі.\n\n[font=default-bold]Що таке станція обслуговування?[/font]\nЦе обмежений робопорт лише з логістичною зоною, що слугує домівкою для конструктронів. Крім того, можна використовувати більше станцій, щоб позначати інші мережі: конструктрони перевірятимуть кожну станцію на наявність предметів, яких їм бракує.\n\n[font=default-bold]Як це налаштувати?[/font]\nКрок 1) Дослідіть павукотрони\nКрок 2) Розмістіть станцію обслуговування у своїй логістичній мережі\nКрок 3) Розмістіть один чи кілька конструктронів\nКрок 4) Налаштуйте сітку обладнання конструктрона(-ів)\nКрок 5) Розмістіть привид чи креслення (будь-де на мапі).\n\nДоки всі потрібні предмети є у вашій логістичній мережі, конструктрон(-и) рушатимуть до привида й будуватимуть його.\nДемонтаж і вдосконалення конструктрони теж виконуватимуть автоматично.\n\n[font=default-bold]Як керувати завданнями?[/font]\nЗавданнями, їх станом, налаштуваннями тощо можна керувати з інтерфейсу конструктронів. Типове поєднання клавіш для нього — SHIFT+C+C. Також кнопку моду можна знайти на панелі ярликів.\n\n[font=default-bold]Що означають кольори?[/font]\nБілий = простій\nСиній = будівництво\nЧервоний = демонтаж\nЗелений = вдосконалення\nФіолетовий = ремонт\nЧорний = знищення\n\n[font=default-bold]Що вміє мод:[/font]\nБудувати й відбудовувати знищені об'єкти\nДемонтувати\nВдосконалювати\nРемонтувати\nЗнищувати (полювати на кусак)\nПеревозити предмети між станціями.\n\n[font=default-bold]Чого мод не вміє:[/font]\nЧарівним чином будувати привиди посеред озера без шляху туди (чи привиди насипу)\nСтворювати предмети з повітря. Якщо предметів бракує — фабрика мусить рости.
sa-ctron-ui=Центр керування конструктронами — основний спосіб керувати завданнями конструктронів; це централізований вузол для стеження за їхньою діяльністю й керування нею.\n\n[font=default-bold]Як відкрити центр керування[/font]\n\nГаряча клавіша: SHIFT + C + C (Shift + подвійне C)\n\nЦе поєднання відкриває центр керування конструктронами, даючи миттєвий доступ до всіх функцій завдань.\n\n[font=default-bold]Інтерфейс[/font]\nВ інтерфейсі можна:\nПереглядати завдання: стежити за всіма активними й очікуваними завданнями.\nКерувати завданнями: скасовувати окремі завдання.\nЗнаходити завдання: швидко бачити на мапі, де виконуються завдання, і призначеного виконавця.\nПереглядати подробиці: відкривати екран подробиць завдання, щоб бачити виконавця, його інвентар, а також переглядати й керувати активними логістичними запитами.
sa-settings=Налаштування моду доступні через інтерфейс конструктронів (SHIFT+C+C) > Налаштування.\n\nБільшість налаштувань задаються для кожної поверхні, яку можна вибрати у випадному списку поверхонь.\n\nНаведіть курсор на поля значень, щоб побачити підказки про дію кожного параметра.
sa-selection-tool=Інструментом вибору конструктронів можна вручну запускати завдання демонтажу, будівництва й знищення.\nЦе особливо корисно, якщо автоматичні завдання вимкнено, а ви хочете запускати їх вручну та/або не давати конструктронам працювати в будівельному радіусі робопорта.\n\nГаряча клавіша: SHIFT + C\n\nДії:\nЛКМ = вибрати привиди об'єктів, щоб запустити завдання будівництва.\nПКМ = вибрати об'єкти, щоб запустити завдання демонтажу.\nSHIFT + ЛКМ = відкрити активне завдання вибраних конструктронів (корисно, якщо вони в русі й по них важко клацнути).\nSHIFT + ПКМ = вибрати ворожі об'єкти, щоб запустити завдання знищення.\n
sa-stations=[item=service_station] визначає домівку для [item=constructron].\n\nСтанції обслуговування також є можливою точкою отримання предметів для конструктронів, якщо предмета немає в їхній початковій домівці. Це особливо корисно для допоміжних фабрик, відокремлених від основного виробництва (наприклад, окремої фабрики насипу).\n\nСтанції можуть запитувати доставку певних предметів, якщо в їхній логістичній мережі їх менше за певну кількість, — через завдання автоматизації вантажів (див. цю категорію порад).\n\nКілька станцій в одній логістичній мережі особливого сенсу не мають, хіба що як ближчі точки вивантаження для завдань автоматизації вантажів.\n\nНайближча до вільного конструктрона (білого кольору) станція вибирається як початкова домівка для завдання.\n\nВ іншому станції — повноцінні робопорти, хоч і з обмеженим радіусом.
sa-general-jobs=Типово ввімкнено завдання будівництва, демонтажу, вдосконалення й ремонту.\n\nЗавдання будівництва запускаються, коли гравець розміщує привид чи кілька привидів кресленням.\nЗавдання демонтажу запускаються, коли гравець позначає об'єкт для демонтажу.\nЗавдання вдосконалення запускаються, коли гравець позначає об'єкт для вдосконалення.\nЗавдання ремонту запускаються автоматично, якщо об'єкт пошкоджено.\n\nПриклад використання:\nГравець розміщує [item=service_station] в логістичній мережі (зазвичай біля основного виробництва), потім розміщує [item=constructron] і оснащує його робопортами й обладнанням для вироблення енергії. Тепер можна будувати привиди та/або креслення будь-якого розміру будь-де на мапі. Конструктрони зчитують розміщені привиди, обчислюють потрібні предмети й шлях туди.\n\nПредмети мають бути в логістичній мережі станції. Конструктрони чекатимуть, доки буде доставлено всі предмети, але запит можна скасувати — тоді вони збудують що можуть і повернуться по решту, коли предмети з'являться в логістичній мережі (мережах), де є станція.
sa-cargo-jobs=Задайте вантажні запити на [entity=service_station], куди потрібно доставляти вантаж. [entity=constructron] автоматично доставлятимуть предмети на станцію, коли досягнуто порогу запиту. Завдання перевіряються кожні 10 секунд. \n\nСтанція обслуговування конструктронів має бути і в логістичній мережі, де є предмети, і в мережі, куди їх треба відвезти. Станції джерела й призначення не мають бути в одній логістичній мережі. \n\n[font=default-bold]Інструкція:[/font]\nКрок 1) Розмістіть станцію обслуговування конструктронів у мережі-джерелі\nКрок 2) Розмістіть станцію обслуговування конструктронів у мережі призначення\nКрок 3) Переконайтеся, що логістичні роботи є в обох мережах\nКрок 4) Відкрийте інтерфейс станції призначення й клацніть «Автоматизація вантажів»\nКрок 5) Додайте предмет(и), які конструктрони мають привозити на цю станцію\nКрок 6) Задайте поріг запиту — мінімальну кількість, що має бути в цій мережі. Завдання запускаються, коли предметів менше\nКрок 7) Задайте кількість запиту — скільки вказаного предмета привозити, коли досягнуто порогу
sa-destroy-jobs=Завдання знищення — наступальна здатність [entity=constructron], призначена здебільшого підтримувати територію вільною від ворогів, а не розчищати її.\n\nЗавдання знищення можна ввімкнути в інтерфейсі конструктронів (SHIFT+C+C) > Налаштування. Переконайтеся, що вибрано потрібний тип і кількість боєприпасів, які конструктрони братимуть на завдання (примітка: це діє на всі завдання, не лише знищення, бо це також захист конструктронів у будь-яких завданнях).\n\nПісля ввімкнення, щойно сканування сектора радаром виявить вороже лігво чи юніта, створюється завдання знищення й призначається конструктрон.\n\nГравець може вручну запустити завдання знищення інструментом вибору (SHIFT+C) поєднанням SHIFT+ПКМ.\n\nКонструктрони можуть використовувати атомні ракети, щоб ефективно знищувати скупчення ворожих гнізд. Це вмикається збільшенням кількості на екрані налаштувань.\n\nПомічники можуть значно збільшити вогневу міць, коли конструктрон на завданні знищення стикається з великим гніздом, — він кличе на допомогу інші конструктрони. Завдання помічників вмикаються збільшенням кількості на екрані налаштувань.

