companion-search-hotkey=Змушує дрона заново обшукати місцевість, якщо він завис і не реагує. Також виводить технічні дані про стан дрона для налагодження.

[settings]
set-challenge-mode=Спочатку компаньйон слабкий, але з часом покращується і зрештою стає значно кращим дроном, ніж без цього налаштування. Бережіть свого єдиного початкового компаньйона! Подробиці — в описі моду. Наполегливо рекомендовано почати нову гру, але можна ввімкнути й посеред збереження.
companion-voice-lines=Хочете, щоб компаньйон кидав дотепні фрази під час роботи?
set-update-interval=Скільки тіків компаньйони чекають, перш ніж перевірити нові завдання? Менше = швидша реакція, більше = краща продуктивність. Примітка: дуже мале значення разом із великою кількістю компаньйонів, імовірно, обвалить ваш UPS. Рекомендовано додавати щонайменше 2 на кожного компаньйона, що працюватиме одночасно (тобто два компаньйони = 7, три = 9 тощо). Типово: 5
companion-idle-chatter-delay=Скільки секунд у середньому компаньйон має чекати, перш ніж сказати фразу від нудьги? Мінімум: 5 секунд, типово: 600 (десять хвилин).
set-fuel-preference=Позначте, якщо хочете, щоб компаньйон спершу використовував ваше найкраще паливо (уранове, ракетне, реактивне тощо). Зніміть позначку, якщо хочете, щоб спершу він використовував найгірше (гній, деревину, вугілля тощо).
set-mode=Це налаштування має лише чотири варіанти: "0", "1", "2" і "3". \n\nЗалиште 0 для "звичайного режиму" без жодних додаткових можливостей. \n\nВведіть 1 для "режиму випробування": дрон спочатку слабкий, потім поступово покращується і зрештою стає навіть сильнішим, ніж у звичайному режимі \n(ПРИМІТКА: рекомендовано нову гру, але не обов'язково). \n\nВведіть 2 для "поблажливого режиму": без прогресії, зате зі значно простішими рецептами, щоб дрон підходив для складних оверхол-модів, як-от Angel's чи Bob's. \n(ПРИМІТКА: для ванільної гри не рекомендовано — надто легко) \n\nНарешті, введіть 3 для "комбінованого" режиму, що поєднує 1 і 2: простіші рецепти ТА прогресія з часом.

