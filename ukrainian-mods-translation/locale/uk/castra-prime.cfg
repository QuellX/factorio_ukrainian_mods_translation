data-collector-electric-engine-unit=Кидає [item=electric-engine-unit] на землю.
data-collector-castra-data=Кидає [item=castra-data] на землю.
combat-roboport=Випускає бойових роботів, коли поблизу виявлено ворогів. Заряджайте [item=defender-capsule], [item=distractor-capsule] або [item=destroyer-capsule] — одна капсула на кожен випуск. Спрацьовує кожні 5 секунд.\n\nРадіус виявлення: 20 клітинок (+1 за кожен рівень якості)\nРоботів за випуск: 5 (+1 за кожен рівень якості)\nЯкість роботів відповідає якості завантаженої капсули.
data-emission=Викид даних Кастри:
military-transport-belt=Конвеєр з вищою стійкістю до шкоди.
military-splitter=Розподільник з вищою стійкістю до шкоди.
military-underground-belt=Підземний конвеєр з вищою стійкістю до шкоди.
military-loader=Завантажувач з вищою стійкістю до шкоди.
carbon-fiber-wall=Міцніша за кам'яні стіни й відбиває 5% фізичної шкоди назад на найближчих нападників. Також її можна будувати на воді й інших океанах.
