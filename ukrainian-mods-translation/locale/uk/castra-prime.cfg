[mod-setting-description]
castra-prime-forge-glow=Вмикає шар світіння на кузні, щоб вона світилася під час роботи.
castra-prime-extend-data-spoilage=Збільшує час псування бойових пакетів даних з 1 до 5 хвилин.
castra-prime-disable-artillery=Не дає ворожим базам будувати артилерійські турелі. Рекомендовано для довгих проходжень.
castra-prime-buffed-forge=Збільшує швидкість виготовлення кузні до 3,0, бонус продуктивності до 50% і знижує енергоспоживання до 2,5 МВт.
castra-prime-gates-progression=Якщо ввімкнено (типово), ресурси Кастри потрібні для прогресу пізньої гри: літієві батареї потрібні для виготовлення рейкотронів і прометієвих дослідницьких пакетів, а бойова наука — для прометієвої науки й дослідження продуктивності досліджень. Вимкніть, щоб Кастра стала необов'язковою додатковою планетою.
castra-prime-suppress-research-msg=Приховує повідомлення про хід ворожих досліджень. Корисно гравцям, які хочуть глибшого занурення без постійних сповіщень.
castra-prime-research-rate-multiplier=Множить швидкість досліджень ворожої фракції. Типове 1.0 — як в оригінальному моді. Менші за 1.0 значення сповільнюють ворожі дослідження, більші — пришвидшують. Діапазон: від 0.01 до 100. ПРИМІТКА: ворожі дослідження обмежені рушієм, тож збільшення може працювати не так, як очікується.
castra-prime-nauvis-nukes=Якщо ввімкнено, бойовий дослідницький пакет прибирається з технології ядерної бомби, тож її можна дослідити, не відвідуючи Кастру.
castra-prime-buff-equipment=Посилює енергетичний щит MK3 (450 HP, відновлення 18/с, споживання 300 кВт) і батарею MK3 (місткість 300 МДж), додані цим модом. Якщо вимкнено, використовуються значення оригінального мода.
castra-prime-disable-enemy-nukes=Не дає ворожим турелям заряджати ядерні боєприпаси: ядерні й водневі бомби в ракетних турелях та ядерні артилерійські снаряди (Церіс/Мараксис) в артилерійських. Наявні ядерні боєприпаси залишаться до пострілу. Не вилучає наявні ядерні боєприпаси з турелей.
castra-prime-disable-land-mines=Наявні міни не зникнуть
castra-prime-nerf-enemy-bases=Зменшує здоров'я, стійкості й швидкість відновлення всіх ворожих збирачів даних на 50%.

