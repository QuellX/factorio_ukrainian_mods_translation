[tips-and-tricks-item-description]
castra-briefing=[planet=castra] — мілітаризована пустка, окупована ворожою фракцією, яка вивчає й копіює ваші технології та з часом постійно вдосконалює свою оборону.\n\nБази з [entity=data-collector] випромінюють забруднення даними й періодично кидають [item=castra-data] — збирайте їх швидко, бо вони псуються за хвилину. Що довше збирачі працюють безперешкодно, то більше їхні бази вдосконалюються новими турелями, стінами, робопортами й сонячними панелями.\n\nРозміщуйте [entity=jammer-radar] біля ворожих збирачів, щоб поглинати забруднення даними й сповільнювати вдосконалення баз і появу предметів.\n\n[item=millerite] — основна руда, з якої виготовляють [item=nickel-plate] нікелеві пластини для більшості місцевих рецептів. [fluid=hydrogen-sulfide] видобувається з [entity=hydrogen-sulfide-vent]. Поклади [item=gunpowder] можна видобувати безпосередньо. Океани [fluid=light-oil] можна викачувати [entity=offshore-pump]. Також є [item=copper-ore] і [item=uranium-ore].\n\n[entity=forge] — планетарна виробнича будівля з вбудованими бонусами продуктивності та якості. Щоб її відкрити, потрібно обробити всі три унікальні ресурси Кастри; вона потрібна для виробництва [item=battlefield-science-pack].
castra-lithium-supply=На [planet=castra] немає літію. Щоб виготовляти [item=lithium-battery], потрібно або імпортувати [item=lithium] з іншої планети, або експортувати [item=nickel-plate] і виробляти батареї деінде.

[shortcut-name]
castra-enemy-research=Стежити за ворожими дослідженнями Кастри
