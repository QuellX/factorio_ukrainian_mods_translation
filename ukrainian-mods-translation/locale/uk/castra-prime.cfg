[entity-description]
forge=Покращує виробництво боєприпасів і зброї.
data-collector=Зібравши достатньо даних, кидає предмет на землю або створює ворога.
data-collector-electronic-circuit=Кидає [item=electronic-circuit] на землю.
data-collector-advanced-circuit=Кидає [item=advanced-circuit] на землю.
