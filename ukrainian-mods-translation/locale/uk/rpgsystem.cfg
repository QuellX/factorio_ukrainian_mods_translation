charxpmod_death_penal=Відсоток досвіду, що втрачається під час смерті
charxpmod_time_ratio_xp=Гравець отримує досвід пропорційно до свого часу гри
charxpmod_print_xp_user=Виводити весь отриманий досвід повідомленнями в чаті
