[item-description]
cybersyn-combinator=Розмістіть біля зупинки потяга, щоб додати її до залізничної мережі Cybersyn. Тоді ця зупинка зможе запитувати чи постачати предмети, про які їй повідомляє логічна мережа.
cybersyn-provider-id=Унікально ідентифікує цю зупинку для Cybersyn
cybersyn-requester-id=Унікально ідентифікує цю зупинку для Cybersyn
cybersyn-refueler-id=Унікально ідентифікує цю зупинку для Cybersyn

[entity-name]
cybersyn-combinator=Кібернетичний комбінатор
cybersyn-combinator-output=Вихід кібернетичного комбінатора

[entity-description]
cybersyn-combinator=Має 5 різних режимів. Проте для початку вистачить режимів станції та депо.

[technology-name]
cybersyn-train-network=Залізнична мережа Cybersyn

[technology-description]
cybersyn-train-network=Контролери зупинок потягів, здатні координувати входи й виходи цілої економіки.

[virtual-signal-name]
cybersyn-priority=Пріоритет станції
cybersyn-request-threshold=Поріг запиту
cybersyn-fluid-request-threshold=Поріг запиту рідин
cybersyn-locked-slots=Заблоковані комірки на вантажний вагон
cybersyn-reserved-fluid-capacity=Резерв місткості на вагон-цистерну

[virtual-signal-description]
cybersyn-priority=Станції з вищими значеннями обслуговуються раніше за станції з нижчими. Значення можуть бути від'ємними. Типовий пріоритет — нуль, його можна змінити в налаштуваннях мапи.
cybersyn-request-threshold=Задає поріг, вище якого запитані на цій станції предмети спричиняють доставку. Стосується предметів без власного порогу. Якщо станція використовує параметр [font=default-bold]Пороги в стосах[/font], це значення автоматично перераховується в стоси кожного відповідного предмета. Для станцій без цього сигналу є також налаштування мапи.\n\n[color=yellow]Якщо місткість жодного потяга не досягає цього порогу, відповідні доставки неможливо виконати.[/color]
cybersyn-fluid-request-threshold=Задає поріг, вище якого запитані на цій станції рідини спричиняють доставку. Стосується рідин без власного порогу. Для станцій без цього сигналу є також налаштування мапи.\n\n[color=yellow]Якщо місткість жодного потяга не досягає цього порогу, відповідні доставки неможливо виконати.[/color]
cybersyn-locked-slots=Залишає вільною задану кількість комірок у кожному вантажному вагоні. Корисно за неточного завантаження, щоб надлишкові предмети могли потрапити у вагон.\nНе впливає на пороги, але може зменшувати фактичний обсяг завантаження.
cybersyn-reserved-fluid-capacity=Залишає вільним заданий об'єм у кожному вагоні-цистерні. Корисно за неточного перекачування, щоб надлишок рідини в трубах міг потрапити у вагон.\nНе впливає на пороги, але може зменшувати фактичний обсяг завантаження.

[cybersyn-messages]
nonempty-train=Потяг затримано в депо, бо в ньому ще є вантаж
unexpected-train=Потяг неочікувано повернувся в депо, не завершивши доставку
stuck-train=Потяг застряг
cannot-path-between-surfaces=Потяг намагається виконати доставку між двома непов'язаними поверхнями; можливо, варто розмістити їх у різних мережах
depot-broken=Потяг загубився, бо його депо зламано
refueler-broken=Потяг загубився, бо його заправну станцію зламано
station-broken=Потяг загубився, бо одну з його станцій доставки зламано
train-lost-in-teleport=Потяг загубився під час телепортації ліфтом (можливо, прототип вагона було вилучено)
train-at-incorrect=Потяг зупинився на станції, куди він не мав доставляти
missing-train=Не знайдено жодного потяга у відповідній мережі для доставки з __2__ до __1__
no-train-has-capacity=Не знайдено потяга з достатньою вантажопідйомністю для доставки з __2__ до __1__
no-train-matches-r-layout=Не знайдено потяга з дозволеного списку __1__ для доставки
no-train-matches-p-layout=Не знайдено потяга з дозволеного списку __2__ для доставки до __1__
station-non-default-priority=Потяг спрямовано не туди через пріоритет Factorio на цій станції. Нетиповий пріоритет Factorio разом із Project Cybersyn ОБОВ'ЯЗКОВО спричинить неправильні доставки. Виправити проблемні станції можна командою /cybersyn-fix-priorities.
fix-priorities-command-help=Скидає пріоритет проблемних зупинок потягів до 50
find-problems-command-help=Знаходить зупинки потягів, що спричиняють проблеми в мережі Cybersyn
recalculate-train-size-command-help=Перерахувати місткість вагонів усіх потягів
abolish-same-depot-command-help=Прибирає налаштування «Вимагати те саме депо» з усіх депо й потягів і встановлює ліміт потягів для всіх депо. [color=yellow]Спершу збережіть гру.[/color]
abolish-same-depot-command-result=Змінено депо: __1__, потягів: __2__. Технічні подробиці — у factorio-current.log.
control-train-group=Групу потягів __1__ тепер використовує Cybersyn для депо __2__. [color=yellow]Не[/color] змінюйте базовий розклад групи.
train-group-schedule-broken=Група потягів __1__ має порожній базовий розклад. Після доставки потягам нікуди їхати.
train-schedule-broken=Потягу нікуди їхати після доставки.
elevator-connected=Ліфт __1__ під'єднано до Cybersyn
elevator-disconnected=Ліфт __1__ від'єднано від Cybersyn
other-elevator-enabled=[img=virtual-signal/se-warning] Потяги й далі користуватимуться ним, бо ліфт __1__ досі під'єднано. [color=cyan]Дайте ліфтам різні назви, щоб уникнути цього.[/color]
other-elevator-disabled=[img=virtual-signal/se-warning] Потяги також користуватимуться ліфтом __1__, хоча його від'єднано. [color=cyan]Дайте ліфтам різні назви, щоб уникнути цього.[/color]

[cybersyn-problems]
no-problems-found=[img=item/construction-robot] Роботи перевірили всі ваші станції Cybersyn за списком і не мають про що повідомити [img=virtual-signal/signal-check].
double-station=має більше одного комбінатора Cybersyn у режимі станції.
double-station-control=має більше одного комбінатора Cybersyn у режимі керування станцією.
double-depot=має більше одного комбінатора Cybersyn у режимі депо.
double-refueler=має більше одного комбінатора Cybersyn у режимі заправної станції.
station-and-depot=не може бути одночасно запитувачем/постачальником і депо.
station-and-refueler=не може бути одночасно запитувачем/постачальником і заправною станцією.
depot-and-refueler=не може бути одночасно депо й заправною станцією.
non-default-priority=використовує пріоритети, які спрямовуватимуть потяги Cybersyn не туди. Скиньте до 50 і за потреби використовуйте [virtual-signal=cybersyn-priority] Cybersyn.
priority-was-reset=пріоритет скинуто до 50.
name-overlap-with-depot=має таку саму назву, як депо Cybersyn. Це призведе до примарних доставок, бо потяги, що прибувають сюди з попередньої доставки, не скидатимуть розклад доставки.
name-overlap-with-refueler=має таку саму назву, як заправна станція Cybersyn.
derelict-combinator=розташований недостатньо близько до зупинки потяга.

[cybersyn-gui]
combinator-title=Кібернетичний комбінатор
operation=Режим
comb1=Станція
depot=Депо
refueler=Заправна станція
comb2=Керування станцією
wagon-manifest=Керування вагоном
switch-provide=Лише постачати
switch-request=Лише запитувати
switch-provide-tooltip=Обмежити цю станцію лише постачанням предметів у мережу. Типово вона і запитує, і постачає.
switch-request-tooltip=Обмежити цю станцію лише запитом предметів з мережі. Типово вона і запитує, і постачає.
network=Мережа
network-tooltip=Сигнал визначає, до якої мережі належить цей комбінатор. Потяги відправлятимуться з депо до станцій-постачальників і запитувачів, лише якщо всі вони мають той самий сигнал.
allow-list-description=Автоматичний дозволений список
allow-list-tooltip=Зазвичай запит на доставку може виконати будь-який потяг із достатньою вантажопідйомністю. Якщо позначено, потяг також має бути в «дозволеному списку» цієї станції. Потяги додаються до нього автоматично, якщо кожен їхній вагон можуть завантажувати чи розвантажувати маніпулятори або помпи цієї станції.
allow-list-refresh-description=Оновити дозволений список
allow-list-refresh-tooltip=Дозволений список визначається під час розміщення комбінатора на основі об'єктів навколо. Оскільки це витратна операція, поза цією подією вона виконується рідко. Ця кнопка змушує комбінатор негайно перерахувати свій дозволений список.
allow-list-preview=Дозволений список
allow-list-preview-tooltip=Список потягів, яким дозволено зупинятися на цій станції.\n[img=item/locomotive] = Локомотив\n[img=item/cargo-wagon] = Предмети\n[img=item/fluid-wagon] = Рідини\n[img=cybersyn-both-wagon] = Обидва\n[img=utility/rail_path_not_possible] = Бракує станції\n[img=entity/entity-ghost] = Комбінатор — привид
allow-list-no-station=Не пов'язано із зупинкою потяга
is-stack-description=Пороги в стосах
is-stack-tooltip=Якщо позначено, усі пороги запиту цієї станції тлумачаться як кількість стосів, а не загальна кількість предметів. Пороги для рідин не змінюються.
enable-inactive-description=Умова бездіяльності
enable-inactive-tooltip=Якщо позначено, потяги на цій станції мають дочекатися бездіяльності на додачу до виконання наказу доставки. Корисно, коли перед від'їздом потяга мають завершитися певні дії, напр. маніпулятори мають звільнити руки.
use-same-depot-description=Вимагати те саме депо
use-same-depot-tooltip=Якщо позначено, потяги з цього депо завжди повертаються в нього. Якщо ні, потяг може повернутися в будь-яке депо з такою самою назвою.\n\n[color=yellow]Несумісне з перериваннями, які мають спрацювати перед поверненням у депо.[/color]
depot-bypass-description=Обхід депо
depot-bypass-tooltip=Якщо позначено, потягам із цього депо не обов'язково стояти в ньому, щоб отримати нові накази, — достатньо не мати поточних активних наказів. Вони все одно повернуться в це депо, якщо бракує палива й немає доступних заправних станцій.
enable-slot-barring-description=Блокувати комірки без фільтра
enable-slot-barring-tooltip=Якщо позначено, усі комірки сусіднього вагона без фільтра натомість блокуються, щоб у них не можна було завантажити предмети.
enable-circuit-condition-description=Логічна умова
enable-circuit-condition-tooltip=Якщо позначено, потяги перед від'їздом зі станції вимагатимуть логічної умови [virtual-signal=signal-check]>0. Цей сигнал має надходити до зупинки потяга, а зупинка має передавати сигнали потягу. Корисно, коли перед від'їздом потяга мають завершитися складніші дії, з якими не впорається умова бездіяльності.
enable-train-count-description=Увімкнути лічильник потягів
enable-train-count-tooltip=Якщо позначено, на виході комбінатора керування станцією буде сигнал [virtual-signal=signal-T]. Його значення — кількість потягів із доставками до/з цієї станції.
enable-manual-inventory-description=Ручне керування запасами
enable-manual-inventory-tooltip=[color=yellow]Розширена функція[/color], корисна для кількох станцій зі спільними запасами. Якщо вимкнено, Cybersyn автоматично коригує запаси станції з урахуванням потягів, що прибувають. Якщо увімкнено, це коригування треба робити вручну, додаючи вихід цього комбінатора керування станцією до сигналу вантажу.
disable-manifest-description=Без маніфесту завантаження
disable-manifest-tooltip=Якщо позначено, потягам не треба виконувати маніфест завантаження, щоб від'їхати. Наприклад, це корисно, якщо запитаних товарів може вже не бути, бо вони зіпсувалися.\n\n[color=cyan]Потрібно ввімкнути щонайменше одну іншу умову очікування.[/color]
