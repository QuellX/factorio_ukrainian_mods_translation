[mod-setting-description]
cybersyn-enable-planner=Увімкнути або вимкнути алгоритм центрального планування. Якщо вимкнено, нові потяги не відправлятимуться.
cybersyn-ticks-per-second=Скільки разів на секунду центральний планувальник оновлює стан мережі й планує доставки. Значення округлюється вгору до дільника 60. Значення 0 зупиняє всі відправлення.
cybersyn-update-rate=Скільки станцій за тік можна опитати чи запланувати для них доставки. Більше значення дозволяє центральному планувальнику тримати актуальніший стан мережі, але ціною продуктивності.
cybersyn-request-threshold=Типовий поріг запиту, якщо станція не отримує сигнал порогу запиту. Коли станція отримує від'ємний сигнал предмета, що перевищує її поріг запиту, і існує станція з додатним сигналом, більшим за поріг, між ними планується доставка цього предмета.
cybersyn-fluid-request-threshold=Типовий поріг запиту рідин, якщо станція не отримує сигнал порогу запиту рідини. Для рідин замінює поріг запиту. 0 — вимкнути.
cybersyn-priority=Типовий пріоритет, якщо станція, депо чи заправна станція не отримує сигнал пріоритету. Станції з вищим пріоритетом отримують доставки раніше за станції з нижчим.
cybersyn-locked-slots=Типова кількість заблокованих комірок на вантажний вагон, якщо станція не отримує сигнал «заблоковані комірки на вантажний вагон». Якщо станція-постачальник має X заблокованих комірок на вагон, накази потягів, що забирають з неї, змінюються так, щоб у кожному вантажному вагоні лишалося щонайменше X порожніх комірок. Це потрібно для правильної роботи станцій-постачальників з кількома предметами.
cybersyn-reserved-fluid-capacity=Типовий резерв місткості на вагон-цистерну, якщо станція не отримує відповідного сигналу. Якщо станція резервує місткість, накази потягів, що забирають з неї, змінюються так, щоб у кожному вагоні-цистерні лишався щонайменше заданий порожній об'єм. Це потрібно для неточного завантаження, наприклад через з'єднувальні труби.
cybersyn-network-flag=Типовий набір підмереж, які обслуговує станція без сигналу мережі. Це ціле число тлумачиться побітово, даючи 32 можливі підмережі.
cybersyn-fuel-threshold=Яка частка паливного інвентарю потяга має бути заповнена, щоб пропустити заправку. Якщо 1, потяги завжди заїжджатимуть на заправну станцію після доставки.
cybersyn-depot-bypass-enabled=Якщо позначено, потяг після доставки й заправки може отримати нове замовлення з мережі, не повертаючись у депо.
cybersyn-warmup-time=Скільки секунд кібернетичний комбінатор чекає перед під'єднанням до мережі Cybersyn. Це пільговий період, щоб змінити чи виправити логічну мережу, перш ніж потяги почнуть їздити до щойно побудованої з креслення станції.
cybersyn-stuck-train-time=Через стільки секунд після відправлення потяга надійде сповіщення, що потяг, імовірно, застряг і не завершив доставку. Імовірно, гравцеві доведеться налагодити мережу, щоб визволити потяг.
cybersyn-track-request-wait-times=Якщо позначено, відстежує, скільки станції чекають на запитані предмети, і показує це в менеджері Cybersyn. Може впливати на продуктивність дуже великих баз. Типово вимкнено.
cybersyn-enable-analytics=Якщо позначено, вмикає аналітику завантаженості потягів і доставок. Додає вкладки «Завантаженість» і «Розбивка» в менеджер Cybersyn. Може впливати на продуктивність дуже великих баз. Типово вимкнено.
cybersyn-allow-cargo-in-depot=Якщо позначено, потягам дозволено мати вантаж у депо: сповіщення не створюються, і потяг не затримується. Крім того, потяги з наказами відвідати станції-запитувачі з позначеною «Умовою бездіяльності» чекатимуть бездіяльності замість спорожнення. Корисно для систем, де депо обробляють надлишковий вантаж. Лише для досвідчених гравців.
cybersyn-manager-updates-per-second=Як часто оновлюється меню менеджера Cybersyn. Щоб це налаштування діяло, менеджер Cybersyn має бути активним.
cybersyn-manager-result-limit=Обмежує кількість відповідних об'єктів (напр. станцій, потягів), щоб скоротити час оновлення списку.\n-1 — показувати всі результати.

