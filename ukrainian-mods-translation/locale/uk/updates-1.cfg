[mod-setting-description]
ltn-interface-console-messages=Показувати повідомлення LTN у чаті консолі. Вимкніть, щоб приглушити сповіщення про доставки й попередження лише для цього гравця (корисно в мультиплеєрі).
ltn-limit-eligible-trains=Максимальна кількість потягів, що вибираються з пулу доступних потягів для доставки. Покращує продуктивність у великих мережах. 0 — вимкнено.
lightning-strike-chance=Імовірність того, що кожна подія грози на планеті спричинить справжній удар блискавки в землю. 0 — без ударів; 1 — кожна подія. Потрібен Space Age. Не впливає на спалахи та звук грому
