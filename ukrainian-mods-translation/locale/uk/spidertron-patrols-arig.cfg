[tips-and-tricks-item-description]
sp-spidertron-patrols=Огляд основних функцій, доданих модом [font=default-bold]Spidertron Patrols[/font].\n\nЯкщо меню розкладу не вміщується на екрані, спробуйте зменшити [font=default-semibold]масштаб інтерфейсу[/font] або вимкнути [font=default-semibold]пласке меню персонажа[/font] в Налаштування > Інтерфейс.
sp-dock=[entity=sp-spidertron-dock] дозволяє автоматично завантажувати й розвантажувати павукотрони за допомогою маніпуляторів. Док автоматично під'єднується до першого павукотрона, що зупинився над ним, і від'єднується, коли той іде геть.
sp-spidertron-automation=Отримайте [item=sp-spidertron-patrol-remote] з панелі праворуч у меню павукотрона або натиснувши __CONTROL__spidertron-enhancements-spidertron-patrol-pipette__, вибравши павукотрон.\nБлимаюче число показує, яку маршрутну точку зараз вибрано. __ALT_CONTROL__2__use-item__ створить нову маршрутну точку після вибраної. __ALT_CONTROL__2__sp-replace-previous-waypoint__ перемістить вибрану маршрутну точку у вказане місце.\nЩоб вибрати маршрутну точку для вставлення після неї чи заміни, натисніть кнопку [img=item.sp-spidertron-patrol-remote] у рядку цієї точки в меню розкладу.\n\n__ALT_CONTROL__1__sp-delete-all-waypoints__ — видалити всі маршрутні точки.\n__ALT_CONTROL__1__sp-toggle-spidertron-automatic-manual__ — перемкнути автоматичний/ручний режим павукотрона, який зараз вибрано, відкрито, під'єднано до пульта в руці або яким ви керуєте.
sp-wait-conditions=Умови очікування можна задати для кожної маршрутної точки в меню розкладу. Вони працюють подібно до умов очікування потягів, але кожна точка може мати лише одну умову. Якщо потрібно поєднати кілька умов в одній точці, часто можна досягти схожого результату, розмістивши кілька маршрутних точок в одному місці, кожну з окремою умовою. Якщо це не допомагає, використайте умову очікування [font=default-semibold]Логічна умова[/font] і під'єднайте комбінатори до [entity=sp-spidertron-dock] у цьому місці.
sp-automatic-refueling=Якщо транспорту потрібне паливо, використовуйте умову очікування [font=default-semibold]Повний бак[/font], щоб транспорт не залишав маршрутну точку, доки не заправиться повністю. Є два способи автоматичної заправки:\n\n- Налаштуйте [entity=sp-spidertron-dock] на під'єднання до інвентарю «Паливо» транспорту, а потім завантажуйте паливо маніпуляторами.\n- Додайте логістичний запит палива безпосередньо на транспорті — його доставлятимуть [entity=logistic-robot]. Доставлене паливо потрапить одразу в паливний інвентар транспорту.
sp-aircraft-automation=Літаки з [font=default-bold]Lex's Aircraft[/font] також можна автоматизувати за допомогою [item=sp-spidertron-patrol-remote] та [entity=sp-spidertron-dock].
sp-submarine-automation=Підводні човни з [font=default-bold]Maraxsis[/font] також можна автоматизувати за допомогою [item=sp-spidertron-patrol-remote] та [entity=sp-spidertron-dock].\nВикористовуйте умову очікування [font=default-semibold]Занурення[/font] у маршрутній точці над западиною, щоб зануритися в западину чи вийти з неї.
arig-briefing=[planet=arig] — гаряча планета з безкраїми пустелями, де цінні ресурси можна знайти лише під землею або в [tile=arig-sand] за допомогою [entity=offshore-pump]. Постійні піщані бурі роблять використання [entity=roboport] неможливим, а більша частина поверхні непридатна для будівництва без [item=planetaris-sandstone-foundation].\nБазові ресурси можна отримати, просіюючи [fluid=planetaris-sand] у [entity=planetaris-sifter]\nНепотрібні предмети можна позбутися, перемістивши їх безпосередньо в [tile=arig-sand].\nСкидання вантажу на планету заблоковано, доки не досліджено відповідну технологію (окрім [item=construction-robot])
arig-exploring=Іноді ходити по піску дуже важко — пам'ятайте, що кактус чудово допомагає рухатися швидше! Лише остерігайтеся колючок.
rail-support-deep-sand=Після дослідження [technology=rail-support-foundations] опори для рейок можна будувати на [tile=arig-deep-sand]

