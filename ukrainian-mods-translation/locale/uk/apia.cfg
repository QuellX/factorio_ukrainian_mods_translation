[space-location-description]
apia=Одна з планет подвійної планетної системи з густою й в'язкою атмосферою. Поверхня складається з безлічі дрібних островів, що дрейфують в океанах поживного маточного молочка місцевих бджіл. Фауна — симбіоз медоносних комах і безхребетних личинок.
carnova=Найбільш масивна планета подвійної планетної системи з кисневою атмосферою. Планету вкриває океан рідини, за складом схожої на кров. Поверхня всіяна безліччю островів з плоті, з яких виходять кісткові мінеральні відклади. Фауна — хижі риби, що мешкають у морях.
apia-carnova-orbit=Центр обертання подвійної планетної системи.

