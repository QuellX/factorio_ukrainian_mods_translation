carnova-briefing=Інструктаж щодо Carnova

[tips-and-tricks-item-description]
apia-briefing=[planet=apia] — одна з планет подвійної планетної системи [planet=apia]-[planet=carnova]. Через густу атмосферу робота [entity=logistic-robot] і [entity=construction-robot] вимагає дуже багато ресурсів. Через щільну хмарність [entity=solar-panel] також значно менш ефективні.\nУсю поверхню вкривають моря [fluid=royal-jelly], у яких живуть [entity=larvae]. Затверділі рештки цих істот можна переробляти на [item=stone] і [item=phosphorus].\nНа планеті також живуть медоносні комахи, що населяють [entity=wild-hive]. Їх можна використовувати для виробництва [item=honeycombs], [item=honeycombs-iron] і [item=honeycombs-copper]. Тип стільників залежить від ґрунту, на якому стоїть вулик. Переробка стільників дає [item=iron-ore], [item=copper-ore], [item=honey] і [item=wax].\nЩе один важливий ресурс планети — [item=phosphorus], а також [fluid=phosphoric-acid].
apia-honeycombs=Поверхня [planet=apia] складається з безлічі островів з родючим ґрунтом серед океану [fluid=royal-jelly]. [entity=artificial-hive] може виробляти різні види стільників залежно від ґрунту під ним. Для [item=honeycombs] потрібен [tile=apia-biome4], для [item=honeycombs-copper] — [tile=apia-biome5], а для [item=honeycombs-iron] — [tile=apia-biome6].\nКрім того, придатну для бджільництва територію можна розширити штучним ґрунтом: [item=artificial-honey-soil], [item=artificial-copper-soil] і [item=artificial-iron-soil].
carnova-briefing=[planet=carnova] — одна з планет подвійної планетної системи [planet=apia]-[planet=carnova]. Поверхню вкривають океани [fluid=blood], де часто трапляються нерестовища місцевої фауни — [entity=piranha].\nОсновне джерело базових ресурсів — [item=bones], що складаються з мінералів і кальцію. З них можна отримати базові ресурси: [item=iron-ore], [item=copper-ore], [item=stone], [item=phosphorus] і [item=calcite].\nПоверхня складається з безлічі островів з [item=flesh], яку можна переробити на [item=proteins] і [item=lipids]. Альтернативним промисловим джерелом кислоти буде [fluid=phosphoric-acid].
