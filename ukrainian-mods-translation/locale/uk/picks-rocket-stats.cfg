[mod-setting-gui-description]
pi_rss_set_startt_rb_1=Середня кількість запущених ракет або вантажу за одиницю часу рахується від початку гри (тік 1).
pi_rss_set_startt_rb_2=Середня кількість запущених ракет або вантажу за одиницю часу рахується від запуску першої ракети.\n\nЦей варіант можливий і корисний лише для ігор, розпочатих із цим модом, або якщо мод додано до збереження, де ще не запускали жодної ракети.
pi_rss_set_startt_rb_3=Середня кількість запущених ракет або вантажу за одиницю часу рахується від часу (реального часу гри), введеного нижче.
pi_rss_set_but_cancel=Закрити налаштування й відкинути зміни
pi_rss_set_but_default=Скидає налаштування до типових значень. Значення застосовуються до гри кнопкою «Застосувати».
pi_rss_set_but_apply=Закрити налаштування й застосувати зміни
pi_rss_set_seperator_dd=Десятковий роздільник і роздільник тисяч можна вибрати зі списку.\nЩоб задати роздільники довільно, виберіть «Власні роздільники».

