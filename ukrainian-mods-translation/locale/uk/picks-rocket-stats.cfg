pi_rss_sortorder_tt=Вантаж і астронавти (гравці) сортуються відповідно до вибору в списку.\n- Без сортування\n- За кількістю за зростанням\n- За кількістю за спаданням\n- За назвою за зростанням (А–Я)\n- За назвою за спаданням (Я–А)\n- За якістю за зростанням (від звичайної до легендарної) (лише вантаж)\n- За якістю за спаданням (від легендарної до звичайної) (лише вантаж)
pi_rss_not_translated=Не вдалося перекласти елементів: __1__.\nІмовірно, бракує якогось мода або мод не надає локалізованих назв для всіх елементів вантажу.\nЧерез це сортування може бути неправильним.

[item-name]
pi-space-rocket=Космічна ракета
