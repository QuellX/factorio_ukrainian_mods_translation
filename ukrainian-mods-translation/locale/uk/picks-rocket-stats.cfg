pi-rss-hide-empty=Ховати статистику, коли вона порожня
pi-rss-show-tb=Показувати кнопку перемикання
pi-rss-thousands-separators=Показувати роздільник тисяч
pi-rss-update-average=Автоматично оновлювати середні значення
pi_rss_avarage_update_min=Інтервал оновлення (хвилини)
pi-rss-show-surfaces=Показувати значення для кожної поверхні

[mod-setting-description]
pi-rss-show-heading=Якщо вибрано, показуються заголовки стовпців.
pi-rss-show-in-stats=Можна вибрати, що показувати: запуски ракет, космічні польоти гравців (астронавтів) за іменами, корисний вантаж ракет або будь-яке їх поєднання.
pi-rss-track-items=Виберіть предмети для відстеження. Щоб використовувати білий і чорний списки, виберіть «Списки фільтрів».
pi-rss-whitelist=Внутрішні назви предметів через кому, які слід відстежувати. Інші предмети не відстежуватимуться й не показуватимуться в статистиці. Залиште порожнім або виберіть «Усі предмети» у «Відстежувані предмети», щоб дозволити всі предмети.\n\nЩоб дізнатися внутрішню назву предмета, відкрийте в грі «Налаштування налагодження» клавішею F4 і на вкладці «always» увімкніть «show-debug-info-in-tooltips». Внутрішня назва показуватиметься в підказці предмета.
pi-rss-blacklist=Внутрішні назви предметів через кому, які слід ігнорувати. Ці предмети не відстежуватимуться й не показуватимуться в статистиці, навіть якщо вони є в «білому списку». Залиште порожнім або виберіть «Усі предмети» у «Відстежувані предмети», щоб дозволити всі предмети.\n\nЩоб дізнатися внутрішню назву предмета, відкрийте в грі «Налаштування налагодження» клавішею F4 і на вкладці «always» увімкніть «show-debug-info-in-tooltips». Внутрішня назва показуватиметься в підказці предмета.
pi-rss-show-average=Показує середню кількість запущених ракет, космічних польотів гравців (астронавтів) або запущеного вантажу за одиницю часу.\n\nУ нових іграх час рахується від першої запущеної ракети.\n\nЯкщо мод додано до наявного збереження, де ракети вже запускалися, час рахується після 8 годин.
pi-rss-average-per=Задає проміжок часу, за який рахується середнє значення.
pi-rss-hide-empty=Якщо жодної ракети не запущено, а отже немає вантажу для показу, інтерфейс буде повністю приховано, ніби мод вимкнено.
pi-rss-show-tb=Показує кнопку вгорі ліворуч, якою можна показувати й ховати вікно статистики.\n\nТакож показувати й ховати вікно статистики можна власною комбінацією клавіш.
pi-rss-thousands-separators=Показує роздільник тисяч у значеннях. Його можна вільно вибрати в налаштуваннях у грі.\nТипово — англійський роздільник тисяч (,).
pi-rss-update-average=Якщо увімкнено, середнє значення оновлюється через заданий проміжок, навіть якщо жодної ракети не запущено.
pi_rss_avarage_update_min=Через скільки хвилин оновлювати середнє значення (від 1 до 120 хвилин; типово = 15 хвилин)\nЗапуск ракети скидає відлік.
pi-rss-show-surfaces=Якщо увімкнено, можна вибрати поверхню й переглянути запуски ракет і перевезений вантаж чи астронавтів (гравців).\nОсобливо в Space Age можна переглядати значення для окремих планет.

