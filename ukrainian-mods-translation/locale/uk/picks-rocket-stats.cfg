pi_rss_stats_surface_tt=Показуються лише запущені ракети, їхній вантаж і запуски астронавтів (гравців) для вибраної поверхні.\nЯкщо вибрати «Усі», показується сума запусків ракет, вантажу й запусків астронавтів (гравців) для всіх поверхонь.
