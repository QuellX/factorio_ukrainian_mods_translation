[mod-name]
PicksRocketStats=Picklocks: статистика ракетної шахти

[mod-description]
PicksRocketStats=Цей мод показує статистику запусків ракет, як у ванільній Factorio до версії 1.0, і не тільки:\n- Вікно статистики вмикається кнопкою або комбінацією клавіш\n- Значення можна показувати загалом або для кожної поверхні\n- Показ кількості запущених ракет\n- Space Age: показ запущених астронавтів (гравців) за іменами\n- Показ кількості, (Space Age:) якості й типу запущеного корисного вантажу\n- Перемикач показу середньої кількості запущених ракет і вантажу\n- Сортування астронавтів (гравців) і вантажу за зростанням чи спаданням кількості, назви або якості (лише вантаж)\n- Приховування заголовків стовпців для компактного вигляду\n- Час запусків для розрахунку середніх значень налаштовується в грі\n\nПідтримувані мови: німецька, англійська

