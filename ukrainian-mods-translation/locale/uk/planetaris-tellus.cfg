[tips-and-tricks-item-description]
tellus-briefing=[planet=tellus] — заражена бактеріями й паразитами планета; пилок в атмосфері допомагає [entity=small-wasp] поширюватися й пошкоджує деякі матеріали. Дослідивши теллуріанські технології глибше, можна знайти рішення.\nХлорофіл і міцелій можна вирощувати за допомогою [entity=condensing-agricultural-tower] і переробляти в [entity=planetaris-bioassembler].\nТут немає [entity=iron-ore], [entity=copper-ore], [entity=crude-oil], [entity=coal] і [entity=uranium-ore], але рослини дають альтернативні способи виробництва потрібних предметів.\nБільшість продуктів землеробства з часом псуються. Навіть [item=planetaris-bioengineering-science-pack] має обмежений термін і не накопичується. До того ж патологічні матеріали можуть породжувати ворогів, якщо зіпсуються: наприклад, [item=planetaris-pathological-science-pack] вибухне [entity=big-wasp].
tellus-bioassembler=[entity=planetaris-bioassembler] дає змогу створювати ексклюзивні теллуріанські процеси й матеріали.\n[entity=planetaris-bioassembler] живі: їх потрібно садити з [item=planetaris-bioassembler-seed] на будь-якому природному ґрунті. Як і всі рослини, [entity=planetaris-bioassembler] гинуть: коли починається вмирання, згодуйте їм [item=nutrients] за рецептом відновлення, поки вони не розклалися й не загинули остаточно.\n[entity=planetaris-bioassembler] можуть розміщувати [entity=construction-robot].
tellus-roots=Труби легко роз'їдає пилок, а теллуріанські машини не можуть під'єднуватися до [entity=pipe], тож для транспортування рідин потрібно створити [entity=planetaris-root]. Наповнювати корені рідинами з труб і викачувати рідину з коренів у труби можна за допомогою [entity=planetaris-root-filler].

