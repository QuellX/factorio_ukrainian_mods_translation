[mod-setting-description]
balanced-mode=Збалансований режим: ретельно відібрані рецепти. Незбалансований режим: цілковитий хаос. Купа рецептів, багато з яких жахливо потужні.
mupgrade-disable=[color=255,125,0]УВАГА[/color] Вимкнення Machine Upgrades призводить до того, що всі ефекти технологій Machine Upgrades (напр., складальні автомати +10% продуктивності) перестають діяти. Використовуйте це, лише якщо:\n1) гра аварійно завершується, і журнал збою радить увімкнути це налаштування,\n2) ви вже повідомили про збій розробникові відповідного мода й чекаєте виправлення,\n3) І Machine Upgrades є залежністю іншого мода.\nЦе ручне перевизначення лише для екстрених випадків. Типово вимкнено.
settings-napalm-art-clusters=Кількість осередків вогню
settings-napalm-art-area=Розмір зони ураження
Quality-Asteroids-Expanded-more-children=Зі стрибків якості утворюються додаткові уламки. На великих астероїдах це може позначитися на продуктивності.
quick-bar-layout-mode=Виберіть, чи гаряча клавіша перемикає між 2 розкладками (1–4 і 5–8), чи по черзі перебирає 3 розкладки.
quick-bar-anchor-position=Видимий слот (1–4), у якому панель 0 залишається закріпленою, поки інші 3 слоти по черзі показують панелі 1–9.
razi-enable-enemy-routing=Якщо увімкнено, Razi Protocol переносить ворогів із підтримуваних модів на тематичні планети й вимикає появу ванільних ворогів на цих світах. Вимкніть, щоб появою ворогів керували самі моди ворогів і планет.
razi-hide-redundant-assembler-tiers=Приховує складальні автомати 4-го рівня з Planetaris Hyarion і Lithium Battery разом з їхніми предметами, рецептами й відкриттями. Цю роль уже виконує раніший вдосконалений складальний автомат Krastorio 2, тож вони лише захаращують прогресію й Факторіопедію.
real-steam-enable-runtime-effects=Вмикає або вимикає всі ефекти пари Real Steam під час гри.
real-steam-density=Визначає, як часто Real Steam показує пару. Висока — більше помітних витоків і пари від машин; низька — найкраще для дуже великих фабрик. Витоки з труб залишаються вибірковими й контрольованими, щоб цілі трубопроводи не диміли.
real-steam-include-boilers=Дозволяє котлам, теплообмінникам і підтримуваним мідним котлам IR3 випускати легку робочу пару.
real-steam-include-pipes=Дозволяє паровим трубам, з'єднанням підземних труб і підтримуваним паровим трубопроводам IR3 випускати невеликі цівки витоків. Витоки з'являються переважно на вибраних поганих ущільненнях і з'єднаннях підземних труб, щоб цілі трубопроводи не диміли.
real-steam-weather-integration=Якщо встановлено Real Rain або Real Wind, грози й пориви вітру сильніше розносять пару, а кожен мод лишається необов'язковим і самостійним.
real-steam-quality-reduces-leaks=Якщо увімкнено, паросилове обладнання вищої якості показує менше витоків Real Steam. Звичайна якість має стандартний вигляд; незвичайна, рідкісна, епічна й легендарна стають дедалі чистішими.
real-steam-replace-boiler-smoke=Параметр запуску, що замінює ванільний вихлопний дим котлів на м'якший клуб пари Real Steam.
real-wind-intensity=Визначає швидкість вітру, ефекти листя в лісі, силу поривів і частоту звуків вітру.
real-wind-enable-leaves=Створює листя й уламки, що летять за вітром, і невеликі вихори листя біля всіх дерев на Наувісі.
real-wind-enable-tree-sway=Додає мерехтіння гілок, хвилі по кронах і пориви вітру навколо всіх дерев на Наувісі. Спрайти дерев у Factorio не можуть справді гнутися, тож рух імітується вітровими накладними ефектами.
real-wind-enable-sounds=Додає позиційні звуки лісового вітру від найближчих дерев під час поривів на Наувісі.
real-wind-sound-volume=Загальний множник гучності звуків Real Wind. Звук вітру йде від найближчих дерев і стихає з відстанню.
real-wind-apply-surface-wind=Змінює вітер поверхні Наувіса, щоб дим, чутливий до вітру, рухався за поточним напрямком вітру. Якщо встановлено обидва моди, грози Real Rain можуть його посилювати.
real-wind-effect-interval=Кількість тіків між проходами створення візуальних ефектів. Менші значення виглядають густіше, але більше навантажують UPS.
rci-silo-recipes=Дає змогу задати рецепт для кожної ракетної шахти. Тож нові компоненти потрібні, лише якщо вони потрібні саме цій шахті. У режимі «Проміжний контейнер» не використовується.
rci-processing-unit=Додає блоки керування ракетою, які виготовляються з процесорів. У режимі «Проміжний контейнер» не використовується.
rci-low-density-structure=Додає секції каркаса ракети, які виготовляються зі структур малої щільності. У режимі «Проміжний контейнер» не використовується.
rci-rocket-fuel=Додає гіперголеву суміш, яка виготовляється з ракетного палива. У режимі «Проміжний контейнер» не використовується.

