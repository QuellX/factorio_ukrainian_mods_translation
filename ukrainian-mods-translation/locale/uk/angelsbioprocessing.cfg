angels-crop-farm=Поле для посіву насіння та вирощування культур, а також садів.
angels-temperate-farm=Поле для посіву насіння та вирощування культур, а також садів. Підтримує помірний клімат для спеціалізованих рослин.
angels-desert-farm=Поле для посіву насіння та вирощування культур, а також садів. Підтримує сухий клімат для спеціалізованих рослин.
angels-swamp-farm=Поле для посіву насіння та вирощування культур, а також садів. Підтримує вологий клімат для спеціалізованих рослин.
angels-seed-extractor=Видобуває насіння з рослин, а також із садів. Може також виробляти зразки інопланетної флори із садів.
angels-composter=Перетворює будь-який органічний матеріал на компост.
angels-bio-processor=Перетворює зібрані рослини на органічні проміжні продукти.
angels-bio-press=Видобуває олію з органічного матеріалу.
angels-nutrient-extractor=Виробляє поживну пульпу з органічного матеріалу.
angels-temperate-garden=Джерело зразків інопланетної флори та насіння, пристосованого до помірного клімату.
angels-desert-garden=Джерело зразків інопланетної флори та насіння, пристосованого до сухого клімату.
angels-swamp-garden=Джерело зразків інопланетної флори та насіння, пристосованого до вологого клімату.
angels-puffer-nest=Місцеві пуфери цієї планети видихають корисні гази.
angels-temperate-tree=Рідкісний вид дерева, багатий на органічну смолу.
angels-desert-tree=Рідкісний вид дерева, багатий на органічну гуму.
angels-swamp-tree=Рідкісний вид дерева, багатий на органічні полімери.
angels-bio-generator-temperate-1=Перетворює саджанці на насіння дерев. Спеціалізований для помірного клімату.
angels-bio-generator-desert-1=Перетворює саджанці на насіння дерев. Спеціалізований для сухого клімату.
angels-bio-generator-swamp-1=Перетворює саджанці на насіння дерев. Спеціалізований для вологого клімату.
angels-bio-arboretum-1=Захищене місце для вирощування та заготівлі дерев.
angels-bio-hatchery=Затишне місце, де можуть вилуплюватися яйця пуферів.
angels-bio-refugium-biter=Тут, надійно відгороджених від зовнішнього світу, можна вирощувати кусак.
angels-bio-refugium-fish=Більше, ніж просто прикраса: може стати домом для різноманітних риб.
angels-bio-refugium-puffer=Тут смердить, але пуфери почуваються в цій наповненій газом вежі як удома.
angels-bio-butchery=Забиває тварин, виробляючи м'ясо.

