[entity-description]
angels-algae-farm=Місце для вирощування водоростей у контрольованій аквакультурі.
angels-algae-farm-2=Місце для вирощування водоростей у контрольованій аквакультурі.
angels-algae-farm-3=Місце для вирощування водоростей у контрольованій аквакультурі.
