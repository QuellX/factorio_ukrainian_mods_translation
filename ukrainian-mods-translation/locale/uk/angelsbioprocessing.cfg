[item-description]
angels-solid-saw=«Він пиляв, він різав, він трощив.»
angels-temperate-1=Дика. Рослина з місць, де не ступала нога людини.
angels-temperate-2=Пухнаста. Від неї хочеться до ліжка.
angels-temperate-3=Кисла. Найкраща в гострому соусі.
angels-temperate-4=Пристосовна. Годиться для багатьох речей.
angels-temperate-5=Смачна. Дуже широка палітра смаків.
angels-desert-1=Солодка. Від неї тепло й млосно на серці.
angels-desert-2=Організована. Росте рівними рядами.
angels-desert-3=Продуктивна. Завжди шикується в рівні ряди.
angels-desert-4=Завзята. Завжди динамічна.
angels-desert-5=Солона. Поводьтеся з нею обережно.
angels-swamp-1=Горіхова. Від неї трохи їде дах.
angels-swamp-2=Жвава. Здається, росте попри будь-які умови.
angels-swamp-3=Владна. Не переборщіть.
angels-swamp-4=Двійкова. Або росте, або ні — нічого посередині.
angels-swamp-5=Пряна. Здається, кричить на вас.
angels-crop-farm-processed=Сільськогосподарський продукт, отриманий з:
raw-fish=Дружнє нагадування тим, хто знав Factorio ще до того, як завітав Angel.
angels-alien-fish-1-raw=Найменш смертоносна риба на цій інопланетній планеті.
angels-alien-fish-2-raw=Не звертають уваги на оточення, дуже невибагливі істоти.
angels-alien-fish-3-raw=З першого погляду чарівна риба, але не зліть її.
angels-bio-raw-meat=На смак як курятина...
angels-bio-tile=Посилює природну здатність ґрунту поглинати забруднення, зменшуючи хмару забруднення вашої бази. Трохи збільшує швидкість бігу й чудово підходить для покриття зовнішньої частини бази.\n[font=default-semibold][color=1,0.9,0.75]Поглинання забруднення:[/color][/font] __1__ /с
angels-bio-yield-module=Модуль, що збільшує продуктивність, але придатний лише для сільськогосподарських процесів.
angels-bio-yield-module-2=Модуль, що збільшує продуктивність, але придатний лише для сільськогосподарських процесів.
angels-bio-yield-module-3=Модуль, що збільшує продуктивність, але придатний лише для сільськогосподарських процесів.

