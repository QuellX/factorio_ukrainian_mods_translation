[tips-and-tricks-description]
angels-bioprocessing-intro=Досліджуйте цю інопланетну планету, щоб знайти флору (рослинне життя) та фауну (тваринне життя) і використати їх собі на користь. Цей мод пропонує альтернативи нафтохімічним процесам і заохочує дослідження довкілля.\n
angels-bioprocessing-intro-nauvis=[font=default-bold]Обробка Наувіса[/font]:\n - [img=item/angels-algae-farm] Вирощування водоростей — ранні методи отримання рослинної маси.\n - [img=item/angels-bio-arboretum-1] Лісове господарство на основі вирощування місцевих дерев для деревини, смоли, пластмаси та гуми.\n
angels-bioprocessing-intro-vegetables=\n[font=default-bold]Обробка рослин[/font]:\n - [img=item/angels-desert-garden] Деякі місцеві рослини містять насіння, з якого виростають корисні культури.\n - [img=item/angels-crop-farm] Садіть і вирощуйте ці культури для отримання корисних продуктів.\n
angels-bioprocessing-intro-animals=\n[font=default-bold]Обробка тварин[/font]:\n - [img=item/angels-bio-refugium-fish] Деякі місцеві риби — корисне джерело харчування та олійних продуктів.\n - [img=item/angels-bio-refugium-puffer] Деякі невеликі місцеві літаючі створіння досить вправно переробляють небезпечні гази на корисні продукти.
angels-bioprocessing-nauvis=Дослідження та використання швидкорослих водоростей — найперша частина цього мода. Знайдені в різних біомах особливі дерева дозволяють вирощувати дерева відновлювано, а водоростеві ферми культивують невибагливу рослинність із великим споживанням води для корисних ранніх матеріалів, як-от целюлози та метанолу.\nПогляд на те, як світ використовував рослини для нехарчових цілей у доіндустріальну епоху.\n\nЦя частина мода зосереджена на вирощуванні водоростей і дерев з використанням відходів і води.
angels-nauvis-algae=Дослідження та використання швидкорослих водоростей для отримання корисних продуктів.\n\n
angels-nauvis-notes-algae-green=[font=default-bold]ПРИМІТКА[/font]: Метанол у побуті називають деревним спиртом, оскільки зазвичай його отримували, спалюючи деревину й конденсуючи пари.\n\n
angels-nauvis-notes-algae-brown=[font=default-bold]ПРИМІТКА[/font]: Карбонат натрію традиційно отримували, висушуючи й спалюючи морські водорості, доки промислова революція не знайшла альтернативних і стійкіших методів.\n              Альгінова кислота зазвичай міститься в клітинних стінках рослин. Особливо багато її в рослинних камедях. Вона досить липка, тому може використовуватися як зв'язувальна речовина у виробництві паперу.\n\n
angels-nauvis-notes-algae-brown-lithia= - Бурі водорості також можна переробляти на [item=angels-solid-lithium] як альтернативу використанню [fluid=angels-thermal-water].\n
angels-nauvis-notes-algae=\n[font=default-bold]ПРИМІТКА[/font]: Обробку водоростей зазвичай використовують на початку гри для виробництва складних матеріалів, доки не стануть доступні інші методи, адже біообробка зазвичай повільна й погано масштабується під пізніші потреби.
angels-nauvis-trees=Досліджуючи планету, ви знайдете різні види листяних дерев на додачу до хвойних дерев базової гри.\nВидобувайте з них насіння та почніть вирощувати власні дерева як відновлюване джерело [item=wood]. Досконаліша обробка дає досконаліше вирощування дерев, дозволяючи видобувати з цих особливих дерев смолу, пластмасу та гуму.\n\nЦі дерева позначено на мінімапі [font=default-bold]світло-блакитним квадратом[/font], і вони трапляються в різних біомах залежно від рівня вологості.\n
angels-nauvis-notes-trees=[font=default-bold]ПРИМІТКА[/font]: Оскільки місця появи особливих дерев залежать від вологості, а не від конкретних «біомів», моди на кшталт Alien Biomes не заважають появі дерев. Утім, частота їх появи досить низька.
angels-nauvis-arbor=Особливі дерева можна перетворити на генератори насіння. Вони створюють насіння ціною легкодоступних матеріалів ([item=angels-solid-mud], [item=angels-solid-soil], [item=angels-solid-sand]) і трохи вологи ([img=fluid/water] води, [img=fluid/angels-water-light-mud] легкої мулистої води або [img=fluid/angels-water-saline] солоної води).\nЦе насіння потім можна вирощувати в [img=item/angels-bio-arboretum-1] дендрарії, отримуючи [img=item/angels-solid-tree] дерева на деревину або дерева та живицю залежно від типу дерева (див. попередню пораду).
angels-nauvis-arbor-compost=\n\n[font=default-bold]ПРИМІТКА[/font]: Щоб отримати ґрунт або добриво для дендраріїв (деяким рецептам вони не потрібні), вам доведеться виробляти компост.\n  - [img=item/angels-solid-compost] Компост можна отримати, відправляючи більшість матеріалів біообробки (водорості, деревину, целюлозу, насіння, культури) до [img=item/angels-composter] компостера.\nПовний перелік матеріалів для компостування див. у комірці складника компостера; не всі вони перетворюються 1 до 1, тож шукайте ефективніші.\nПізніші технології дозволять розмножувати ці особливі дерева, але спершу їх доведеться знайти в дикій природі.
angels-bioprocessing-vegetables=Досліджуючи планету, ви знайдете [img=item/angels-desert-garden][img=item/angels-swamp-garden][img=item/angels-temperate-garden]сади, які можна дослідити й переробити на насіння. Це насіння дозволяє вирощувати рослини самостійно. Переробляйте ці рослини на поживні речовини, паливо та олії. Сади також можна переробляти на [img=item/angels-token-bio]зразки флори для дослідження вдосконалених фермерських будівель, як-от покращень ферм, ефективніших рецептів деревини та досконаліших процесів.\n\nЦі сади позначено на мінімапі [font=default-bold]світло-зеленим квадратом[/font], і вони трапляються в різних біомах залежно від рівня вологості.\n
angels-vegetables-farming=Коли сади оброблено в [img=item/angels-seed-extractor]екстракторі насіння й отримано насіння культур, настав час садити й вирощувати рослини для отримання корисних продуктів.\n\n
angels-vegetables-notes-gardens=\n\n[font=default-bold]ПРИМІТКА[/font]: Оскільки місця появи садів залежать від вологості (як і для дерев), а не від конкретних «біомів», моди на кшталт Alien Biomes не заважають появі садів. Утім, частота їх появи досить низька.
angels-vegetables-crops=Обробка культур у [img=item/angels-bio-processor]біопроцесорі дає певні результати залежно від рецепта; це може бути поєднання таких продуктів:\n
angels-vegetables-notes-crops=\n\n[font=default-bold]ПРИМІТКА[/font]:\nЛише [img=item/angels-solid-corn]кукурудзу та [img=item/angels-solid-fruit]фрукти можна перетворити на [img=fluid/angels-liquid-fermentation-raw]основу для бродіння, з якої отримують [img=fluid/angels-gas-ethanol]етанол або [img=fluid/angels-liquid-acetic-acid]оцтову кислоту.\nУсі невдосконалені продукти можна перетворити на [img=fluid/angels-liquid-nutrient-pulp]поживну пульпу, з якої отримують дуже корисний [img=fluid/angels-gas-acetone]ацетон та різноманітні інші нафтохімічні продукти — від олив до синтез-газу.
angels-bioprocessing-animals=[font=default-bold]ЛОВИ, ДОСЛІДЖУЙ, ЯЙЦЕПЕРИМЕНТУЙ[/font]:\n\nЦя частина мода зосереджена на дикій природі Наувіса: від рибництва, розведення й вирощування пуферів до розведення кусак для вдосконалених матеріалів, що використовуються в ракетному паливі, модулях чи вдосконаленій зброї.\n
angels-animals-notes-fish=\n[font=default-bold]РИБА[/font]: Ловіть рибу (4 види [img=item/raw-fish] [img=item/angels-alien-fish-1-raw] [img=item/angels-alien-fish-2-raw] [img=item/angels-alien-fish-3-raw]) і розводьте її як відновлюваний спосіб відновлення здоров'я або як [img=item/angels-bio-raw-meat] їжу для інших тварин. Рибу також можна переробляти на олії та [img=item/angels-fish-pulp] пульпу для процесів, подібних до фермерських. З [img=fluid/angels-liquid-polluted-fish-atmosphere] забрудненої води для риб можна видобувати [img=item/angels-crystal-splinter-raw] кристалічні скалки для обробки кристалів.
angels-animals-notes-puffers=\n\n[font=default-bold]ПУФЕРИ[/font]: Досліджуйте планету, щоб знайти [img=entity/angels-puffer-nest] гнізда пуферів і отримати яйця пуферів (у дикій природі трапляються лише [img=item/angels-bio-puffer-1] газові пуфери, [font=default-bold]жовтий квадрат[/font] на мапі). Розводьте своїх смердючих пуферів, щоб отримати різні способи обробки газів. Вилуплення яєць у циклі розведення дає [img=item/angels-bio-puffer-egg-shell] шкаралупу, яку можна подрібнити й поєднати із забрудненою водою для риб, щоб отримати [img=item/angels-crystal-shard-raw] кристалічний уламок вищого рівня.\n[font=default-bold]ПРИМІТКА:[/font] Будьте обережні з шансами мутації пуферів.
angels-animals-notes-biters=\n\n[font=default-bold]КУСАКИ[/font]: Проведіть кілька експериментів з пуферами — можливо, вам вдасться вивести власних ручних кусак. Вивчайте їх, щоб отримувати кристали, які стануть у пригоді для підвищення продуктивності або швидкості фабрики.\nРозведення кусак за допомогою королев може дати всі три рівні кристалів ([img=item/angels-crystal-splinter-raw]скалки, [img=item/angels-crystal-shard-raw] уламки та [img=item/angels-crystal-full-raw] необроблені кристали) залежно від розміру (малий, середній, великий відповідно).\n[font=default-bold]ПРИМІТКА:[/font] Кусаки з'їдають досить багато [img=item/angels-bio-alien-processed-meat] інопланетно обробленого м'яса, тож на цьому етапі подбайте про достатню кількість [img=item/angels-bio-butchery] забитих пуферів і риби.

[tips-and-tricks-sub]
angels-algae-green=Живуть у [fluid=angels-water-mineralized] і виробляють [item=angels-cellulose-fiber], яке можна перетворити на [fluid=angels-gas-methanol].
angels-algae-brown=Живуть у [fluid=angels-water-saline] і виробляють [item=angels-solid-sodium-carbonate] разом з [item=angels-solid-alginic-acid]. Останню можна поєднати з [item=angels-cellulose-fiber], щоб отримати [item=angels-solid-paper].
angels-algae-blue=Живуть у [fluid=angels-water-yellow-waste] і [fluid=angels-gas-carbon-dioxide]. Виробляють багаті на азот сполуки, як-от [fluid=angels-gas-ammonia].\n
angels-algae-red=Живуть у [fluid=angels-thermal-water] і [fluid=angels-gas-ammonia]. Виробляють багаті на кальцій сполуки, як-от [item=angels-solid-calcium-carbonate].\n
angels-trees-swamp=Болотне дерево трапляється у «вологих» районах з вологістю близько __1__ (зазвичай темно-зелені або сині трав'янисті ділянки).\nБолотні дерева використовуються для виробництва деревини або як рання сировина для виробництва [img=item/angels-bio-plastic] пластмаси.\n\n
angels-trees-temperate=Дерево помірного клімату трапляється в «помірних» районах з вологістю близько __1__ (зазвичай світло-зелені трав'янисті ділянки).\nДерева помірного клімату використовуються для виробництва деревини або як рання сировина для виробництва [img=item/angels-bio-resin] смоли.\n
angels-trees-desert=Пустельне дерево трапляється в «сухих» районах з вологістю близько __1__ (зазвичай піщані/червоно-піщані ділянки).\nПустельні дерева використовуються для виробництва деревини або як рання сировина для виробництва [img=item/angels-bio-rubber] гуми.\n
angels-farm-seeds-to-crops=\nПомістіть ці культури в [img=item/angels-crop-farm] базову ферму або покращену ферму відповідного типу ([img=item/angels-swamp-farm] болотну, [img=item/angels-temperate-farm] помірного клімату, [img=item/angels-desert-farm] пустельну), щоб виростити їх.\nОбробляти культури можна в [img=item/angels-bio-processor] біопроцесорі, а насіння повертати в [img=item/angels-seed-extractor] екстрактор насіння для відновлення.\n\n
angels-crops-special-products=\nВключно з одним із наступного з найдосконаліших культур ([img=item/angels-swamp-5], [img=item/angels-temperate-5], [img=item/angels-desert-5]):
angels-fish-artifacts= Обробляйте їхню воду, щоб видобувати [img=fluid/angels-alien-spores] інопланетні спори, які можна далі переробити на [img=item/angels-alien-artifact] інопланетні артефакти.
angels-fish-artifacts-bob= Обробляйте їхню воду, щоб видобувати [img=fluid/angels-alien-spores] інопланетні спори, які можна далі переробити на [img=item/bob-alien-artifact] інопланетні артефакти.
