ltn-fuel-station=Позначає цю зупинку як заправну станцію.\n[color=red]Усі сигнали запитувача й постачальника ігноруються.\nЦе несумісно із сигналом депо.[/color]\nУтримуйте [color=blue]SHIFT[/color], щоб прибрати сигнали запитувача й постачальника\n\n[color=blue]Типово:[/color] [color=green]Ні[/color] (не позначено)

