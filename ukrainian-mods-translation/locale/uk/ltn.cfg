ltnm-status-description=У 2.0 ми втратили інформацію про значення сигналу :(. \n[img=flib_indicator_green]1 = нормальний стан\n[img=flib_indicator_blue]n = потяг під керуванням LTN стоїть на зупинці, n = кількість потягів\n[img=flib_indicator_yellow]n = зупинка бере участь у запланованій доставці, n = кількість потягів\n[img=flib_indicator_white]1 = помилка — не ініціалізовано\n[img=flib_indicator_red]1 = помилка — коротке замикання\n[img=flib_indicator_red]2 = помилка — зупинку деактивовано

