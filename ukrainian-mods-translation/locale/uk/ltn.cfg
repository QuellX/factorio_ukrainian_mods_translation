[mod-setting-description]
ltn-dispatcher-route-cache-lifetime=Визначає, як довго LTN кешує обчислений маршрут.\nБільші значення покращують продуктивність, менші — швидше враховують нові маршрути.
ltn-dispatcher-stop-updates-per-tick=Обмежує кількість зупинок, що оновлюються за тік.\nМенші значення покращують продуктивність.
ltn-provider-ignore-stopped-train=Так (типово):\nІгнорувати зупинений потяг на зупинці запитувача під час розрахунку поставки до запитувача.
ltn-schedule-fuel-station=Увімкнути дозаправлення потягів на заправних станціях.\nНадсилає потяги на дозаправлення, якщо в них мало палива, а в їхній поточній мережі є заправна станція.
ltn-schedule-reset-interrupts=Видаляти всі переривання розкладу потяга, коли він досягає депо.
ltn-schedule-reselect-depot=(Це налаштування не діє, якщо «Перевезення завершується запитувачем» вимкнено.) Якщо увімкнено, депо, куди поїде потяг, вибирається заново.
ltn-fuel-station-interrupt=Якщо увімкнено, для відправлення потяга на дозаправлення використовується переривання Factorio. Це типовий варіант, і змінювати його варто лише тоді, коли переривання спричиняє проблеми. Якщо вимкнено, LTN динамічно змінює розклад потяга, щоб відправити його на дозаправлення. Це потребує більше обчислень, але дає змогу краще керувати дозаправленням (наприклад, потяг не буде відправлено на дозаправлення, коли він прибуває на тимчасову зупинку).
ltn-advanced-cross-surface-delivery=Якщо увімкнено, LTN вибиратиме потяги з інших поверхонь для виконання доставок або спершу відправлятиме потяги на інші поверхні, щоб забрати вантаж. Не вмикайте, якщо ваша мережа не охоплює кілька поверхонь і не з'єднана між ними (напр., космічним ліфтом Space Exploration).
ltn-depot-fudge-factor=Найбільша різниця у відстані між депо та постачальником, яка вважається рівною під час вибору вільного потяга.
ltn-depot-stop-limit-trains=[font=default-semibold][color=red][ЕКСПЕРИМЕНТАЛЬНО!][/color][/font] Визначає поведінку налаштування «Ліміт кількості потягів» для зупинок-депо LTN.
hps__lse-debug-mode=Вмикає налагоджувальну інформацію.
hps__lse-use_elevator_clearance=Потяги, які виїжджають із ліфта й прямують просто до пункту призначення, де за лімітом потягів залишилося лише одне місце, смикатимуться й показуватимуть повідомлення «[color=purple]Місце призначення зайняте[/color]». Щоб цього уникнути, потяг може спершу заїхати на проміжну станцію.\nТака станція [color=cyan]не повинна мати ліміту потягів[/color] і має бути щонайменше [color=cyan]на повну довжину потяга[/color] від точки виїзду з ліфта.\n\nЦе налаштування додає такі станції до кожної доставки LTN, що проходить через ліфт. Наступне налаштування задає назву всіх цих станцій.\n\nОскільки запитувачі й постачальники LTN рідко мають ліміти потягів Factorio, ця функція здебільшого корисна для депо з лімітом потягів.
hps__lti-debug-mode=Вмикає налагоджувальну інформацію.

[string-mod-setting]
ltn-depot-stop-limit-trains-0=Скидати ліміт потягів (типово)
ltn-depot-stop-limit-trains-1=Установлювати ліміт потягів 1
ltn-depot-stop-limit-trains-2=Не змінювати ліміт потягів
hps__lse-debug-mode-0=0: лише критичні
hps__lse-debug-mode-1=1: помилки й попередження
hps__lse-debug-mode-2=2: повідомлення
hps__lse-debug-mode-3=3: повний журнал налагодження

