[mod-setting-description]
powered-concrete-connector-grid-size=Визначає, скільки живильних плиток підлоги групується за кожним прихованим з'єднувачем. 1 — точна поведінка плитка за плиткою, типово. 4 — необов'язковий збалансований режим для UPS. Більші значення ще сильніше зменшують кількість прихованих опор для величезних баз, але покриття живленням усередині кожної клітинки стає менш точним.
nanobots-auto-defense-threshold=Коли набоїв у турелі менше за цей поріг, запускається поповнення.
nanobots-auto-defense-delivery=Скільки набоїв доставляти в турель.
nanobots-auto-defense-artillery-threshold=Окремий поріг для артилерії.
nanobots-auto-defense-artillery-delivery=Окрема кількість доставки для артилерії.
nanobots-auto-defense-gun-turrets=Автоматично поповнювати кулеметні турелі.
nanobots-auto-defense-artillery-turrets=Автоматично поповнювати артилерійські турелі.
nanobots-auto-defense-modded-turrets=Автоматично поповнювати ракетні, рейкотронові турелі та турелі з модів, що стріляють набоями. Визначаються за типом об'єкта (ammo-turret, artillery-turret).
nanobots-auto-defense-ammo-type-priority=Який тип набоїв використовувати першим, коли доступно кілька. Діє в мирному режимі (або завжди, якщо бойовий режим вимкнено).
nanobots-auto-defense-ammo-quality-priority=Яку якість використовувати першою, коли той самий тип набоїв має кілька якостей. Діє в мирному режимі (або завжди, якщо бойовий режим вимкнено).
nanobots-auto-defense-warning-interval=Як часто показувати попередження, коли ТУРЕЛЬ не вдається поповнити (немає сумісних набоїв). 30-300 с.
nanobots-auto-defense-scan-interval=Базовий інтервал сканування (60 тіків = 1 секунда). З адаптивним скануванням: удвічі коротший у бою, у 1,5 раза довший у мирний час.
nanobots-auto-defense-max-per-tick=Максимум турелей, що обробляються за одне сканування.
nanobots-auto-defense-combat-mode=Автоматично перемикає пріоритет набоїв залежно від присутності ворогів. У БОЮ: завжди найкращі набої. У МИРНИЙ ЧАС: ваші налаштування пріоритету нижче. Вимкніть, щоб завжди використовувати ручні налаштування.
nanobots-auto-defense-auto-enable-combat=Автоматично ВМИКАЄ систему доставки, коли поруч вороги, і ВИМИКАЄ, коли спокійно. На відміну від бойового режиму пріоритету, який змінює лише те, ЯКІ набої використовувати.
nanobots-auto-defense-adaptive-scan=Сканує швидше, коли поруч вороги (удвічі), і повільніше в мирний час (інтервал ×1,5). Економить UPS у спокійні періоди.
nanobots-auto-defense-show-projectile=Показувати снаряд, що летить від гравця до турелі під час кожної доставки набоїв. Вимкніть для кращої продуктивності на мегабазах.
nanobots-auto-defense-low-nano-threshold=Коли набоїв у нано-емітері стає стільки, показати попередження зі звуком. 0 — вимкнути.
nanobots-low-nano-warning-interval=Як часто повторювати попередження, коли НАНОЗАРЯДИ закінчуються (плаваючий текст). Від 30 с до 5 хв.
nanobots-wrong-ammo-warning-interval=Як часто попереджати, що автооборону призупинено, бо заряджено не будівельні набої (напр. термітів). 0 — вимкнути.
nanobots-debug-repair-system=Показувати журнал системи ремонту й будівництва. [font=default-semibold]Потрібен рівень журналу ≥ "standard"[/font]
nanobots-debug-defense-system=Показувати журнал доставки набоїв автооборони. [font=default-semibold]Потрібен рівень журналу ≥ "standard"[/font]

