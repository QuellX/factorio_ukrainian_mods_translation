[mod-setting-description]
s6x-voidcraft-science=Дає змогу безпосередньо створювати дослідницькі пакети ремеслом порожнечі.
s6x-centrifuge-tinting=Замінюється Bluetonium, якщо його встановлено.
s6x-voidtronics-ratio=Старі версії Voidcraft використовували співвідношення 28:1, але 24:1 виявилося кращим для балансу гри.
s6x-max-vc-coherence=Старі версії Voidcraft дозволяли лише 1000 настою когерентності на рецепт, але деяким новим рецептам потрібно більше, тож максимум збільшено до 5000. Однак можна повернути старе значення, якщо це якось ламає вашу базу.
s6x-vc-recipe-signals=Обмежує, які рецепти Voidcraft показує в інтерфейсі сигналів, щоб не засмічувати його.
s6x-old-prismatic-carbonization=Повертає застарілий рецепт «Призматичне вуглецювання», якщо він вам справді потрібен.
s6x-old-entropic-conjuration=Повертає попередні рецепти ентропійного викликання.
s6x-old-void-rocket-parts=Повертає попередній рецепт ракетобудування порожнечі.
s6x-old-prismorphing=Повертає старі рецепти призмоморфінгу «призматична конверсія».
s6x-prismorph-in-chemical-plant=Дозволяє призмоморфінг у хімічному заводі, навіть якщо зазвичай потрібен призмозмішувач.
s6x-restore-prism-catalyze=Знову вмикає призматичний каталіз. Призматичний каталіз вимикається з Space Age, Iridescent Industry чи pHactorio, і в майбутній версії його буде прибрано.
s6x-auto-module-categories=Пробує автоматично скласти список придатних категорій модулів і застосувати його. Іноді покращує сумісність із модами. Вмикайте лише за потреби.
s6x-no-random-rune=Не дає випадкових побічних продуктів під час ремесла порожнечі з рунами швидкості й ощадливості.
s6x-voidworks-no-scrap=Починаючи з Voidcraft 2.0, рецепти майстерень порожнечі дають брухт, як і більшість інших рецептів.
s6x-no-voidcraft-in-space=Забороняє будувати споруди ремесла порожнечі в космосі. Лише для Space Age. Не діє, якщо використовується Arcanyx і ремесло порожнечі обмежене Arcanyx.
s6x-no-resource-depletion=Бури й верстати-качалки більше не виснажують ресурси. Майже як ремесло порожнечі, тільки з-під землі.
s6x-prismite-ore-scrap=Рецепти з призмітом, що мали б давати залишки призміту, натомість даватимуть призмітову руду.
s6x-wood-raw-fish=Ремесло порожнечі з деревиною може давати сиру рибу, як і без Space Age.
s6x-coh-catalyst-reliability=У відсотках. 100 — каталізатор завжди повертається, як у попередніх версіях Voidcraft.
s6x-void-pure-reliability=У відсотках. 100 — ви ніколи не отримаєте розірваний фіал порожнечі як випадковий результат.
s6x-primordial-voidforge-changes=Повертає попередню конфігурацію первісної кузні порожнечі: швидкість 5 і підтримка рун.
s6x-orichalcum-fragments=Вмикає уламки орихалку, навіть якщо не використовуються Iridescent Industry чи Scrappy Industry.
s6x-prismite-ore-stone-crush=Випадковим побічним продуктом подрібнення призмітової руди стає камінь замість піску.
s6x-make-in-foundry=Дає змогу виготовляти майстерні порожнечі й руни в ливарнях.
s6x-voidforge-simple=Вмикає повітку порожнечі — просту й дешеву майстерню порожнечі. Раніше доступна лише у світах Void Block.
s6x-void-beacon-support=Визначає, чи руни потребують особливого маяка порожнечі, чи їх можна вставити у звичайний маяк, чи вони взагалі не підтримують маяки.
s6x-vc-empowered-void-fuel=Додає посилене паливо порожнечі — потужнішу версію палива порожнечі. Раніше було частиною Arcanyx і без Arcanyx менш корисне.
s6x-vc-petrochem-restore=Повертає старі нафтохімічні рецепти ремесла порожнечі, що були дещо надто сильними порівняно з іншими рецептами ремесла порожнечі.
s6x-old-fulgoran-scrap=Повертає рецепт брухту Фульґори, коли Scrappy Industry не використовується. Без Scrappy Industry цей параметр нічого не робить.

