s6x-void-electric-engine=Войдтроніку можна використати, щоб покращити двигун порожнечі... і він і далі іноді справді працюватиме.
s6x-void-runestone=Руновий камінь має чимало застосувань, але передусім із нього кують магічні руни, що посилюють ремесло порожнечі.
s6x-voidcraft-module=Особливі таємні руни для пришвидшення ремесла порожнечі.
s6x-voidcraft-module-eff=Особливі таємні руни для підвищення ощадливості ремесла порожнечі.
s6x-voidcraft-module-greater=Потужніші руни для ще швидшого ремесла порожнечі.
s6x-voidcraft-module-top=Ці рідкісні й потужні руни дають змогу надзвичайно швидко творити ремеслом порожнечі, але потребують багато енергії.
s6x-voidcraft-module-eff-greater=Потужніші руни для ще ощадливішого ремесла порожнечі.
s6x-voidcraft-module-eff-top=Ці рідкісні й потужні руни дають змогу надзвичайно ощадливо творити ремеслом порожнечі, заощаджуючи багато енергії.
s6x-voidcraft-module-prod=Особливі таємні руни для збільшення виходу ремесла порожнечі, корисні, коли є вхідні інгредієнти.
s6x-voidcraft-module-prod-greater=Потужніші руни для ще більшої кількості продуктів ремесла порожнечі.
s6x-voidcraft-module-prod-top=Ці рідкісні й потужні руни дають змогу отримувати ремеслом порожнечі багато додаткових продуктів.
s6x-runic-conjuring=Достатньо потужним ремеслом порожнечі можна викликати з порожнечі навіть самі руни.
