[recipe-description]
void-gem=Самоцвіт порожнечі горезвісно складно різьбити, і процес часто зазнає невдачі.
s6x-voidtronic-randomize=Спроба пристосувати войдтроніку працювати як звичайна електроніка.
s6x-voidtronic-advanced-randomize=Спроба пристосувати войдтроніку до складнішої електроніки.
s6x-voidtronic-processing-randomize=Спроба пристосувати войдтроніку до досконалого процесора.
s6x-void-engine-unit-randomize=Спроба пристосувати двигун порожнечі працювати як звичайний двигун.
s6x-void-electric-engine-unit-randomize=Спроба збудувати сумісний електродвигун з войдтроніки й двигуна порожнечі.
s6x-void-rocket=Спроба збудувати робочу ракету з ракетних частин, виготовлених ремеслом порожнечі.
s6x-void-safe-disposal=Безпечно спорожнює й повертає фіал порожнечі.
s6x-void-safe-disposal-rupture=Безпечно позбувається розірваного фіала порожнечі.
s6xvc-scrap=Ремесло порожнечі й так викликає чимало випадкового мотлоху, тож не дивно, що ним можна викликати... випадковий мотлох.
s6x-apo-result=Щоб створити очищений іхор порожнечі, потрібен [item=disgusting-slime,quality=legendary] легендарний огидний слиз.

