[item-description]
s6x-voidcraft-speed-module=Підвищує швидкість майстерні порожнечі ціною значно більшого енергоспоживання.
s6x-voidcraft-eff-module=Зменшує енергоспоживання майстерні порожнечі.
s6x-voidcraft-prod-module=Дає більше продуктів за цикл ремесла порожнечі. Марна, якщо немає вхідних інгредієнтів.
s6x-dangerous-eggs=Це яйце вже почало вилуплюватися!
s6x-coherence-catalyst=Після використання каталізатор когерентності стає інертним, і щоб відновити його, треба покласти його в піч.
s6x-coherence-catalyst-sa=Після використання каталізатор когерентності стає інертним і 20 секунд не може використовуватися знову.
s6x-coherence-catalyst-expended=Цей каталізатор когерентності тепер інертний. Щоб відновити його, треба покласти його в піч.
s6x-coherence-catalyst-expended-sa=Цей каталізатор когерентності тепер інертний. Знову використовувати його можна буде через 20 секунд.
void-pure-container-full=Цей фіал містить безформну порожнечу. Її треба негайно використати чи безпечно утилізувати.
void-pure-container-rupture=Цей фіал розірвався й ось-ось вибухне. Треба безпечно його утилізувати. І швидко!
gleba-wood=Як звичайна деревина, але з Ґлеби. Перетворюється на звичайну деревину. Не думайте про це надто багато.

