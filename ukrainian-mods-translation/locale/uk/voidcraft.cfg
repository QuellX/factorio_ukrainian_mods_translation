s6x-void-science-pack=Дає змогу досліджувати мистецтво ремесла порожнечі.
s6x-esoteric-science-pack=Дає змогу досліджувати глибші таємниці ремесла порожнечі.
s6x-celestial-science-pack=Дає змогу досліджувати далекі куточки Всесвіту ремеслом порожнечі.
s6x-void-science-pack-vc=Ремеслом порожнечі, звісно, можна проводити експерименти, що глибше вивчають його природу.
s6x-esoteric-science-pack-vc=Дослідження глибших таємниць ремесла порожнечі самим ремеслом порожнечі.
s6x-celestial-science-pack-vc=Лише найпотужніші майстерні порожнечі можуть викликати цей досконалий таємнознавчий пакет.
s6x-entropic-conjuration=Використовує властивий ремеслу порожнечі хаос, щоб викликати... щось.
s6x-entropic-conjuration-adv=Закликає потужніші сили хаосу, щоб викликати ще екзотичніші речовини.
s6x-industrial-voidcraft=Стабільніші форми ремесла порожнечі для викликання різних корисних промислових продуктів.
s6x-crystal-fabrication=Алхімічний процес створення синтетичних уламків порожнечі й спосіб надійніше викликати їх із порожнечі.
s6x-voidgems=Очищені й концентровані уламки порожнечі.
s6x-voidtronics=Електроніка з ремесла порожнечі, що іноді навіть справді працює.
