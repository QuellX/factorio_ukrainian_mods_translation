items=Бажана кількість палива в твердопаливних пристроях.\n\n[color=128,206,240]Поточне правило: твердопаливні пристрої __plural_for_parameter__1__{0=не отримуватимуть палива|1=отримуватимуть 1 одиницю палива|rest=отримуватимуть палива (одиниць: __1__)}__.[/color]
