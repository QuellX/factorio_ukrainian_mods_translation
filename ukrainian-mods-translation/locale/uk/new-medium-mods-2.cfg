[mod-setting-description]
nb1-ghost-scanner-areas-per-tick=Скільки логістичних комірок (або ділянок області) сканується кожен тік. Менші значення покращують UPS. Типово=5.
nb1-ghost-scanner-update-interval=Мінімальна кількість тіків між повними пересканування кожного сканера. Якщо сканерів багато, фактичний інтервал подвоюється. Типово=180.
nb1-ghost-scanner-area-scan-delay=Мінімальний проміжок у тіках між порціями сканування. Типово=5.
nb1-ghost-scanner-max-results=Обмежує кількість привидів, знайдених за прохід сканування. 0 знімає обмеження. Менші значення покращують UPS. Типово=1000.
nb1-ghost-scanner-show-hidden=Звітувати також про приховані предмети (напр. комірки запитів LTN).
nb1-ghost-scanner-negative-output=Видавати значення як від'ємні числа (корисно для комбінаторів запитів).
nb1-ghost-scanner-round-to-stack=Округлювати кількість предметів угору (або вниз, коли увімкнено «Інвертувати вихід») до повного стосу.
nb1-ghost-scanner-area-max-side=Максимальна довжина сторони (у клітинках) для виділення в режимі області. Більші виділення відхиляються. Типово=512.
nb1-ghost-scanner-overlay-border-color=Колір (разом з альфою) рамки навколо виділення в режимі області, коли курсор над сканером.
nb1-ghost-scanner-overlay-fill-color=Колір (разом з альфою) заливки всередині виділення в режимі області, коли курсор над сканером. Зменште альфу, щоб бачити об'єкти під нею.
mpp-lane-filling-info-duration=Відлік починається після закриття меню планувальника
mpp-performance-scaling=Множник обсягу обчислень за тік.\nЗменште нижче 1, щоб уникнути підвисань.\n(Перевірити витрату часу: F4 → show-time-usage → mining-patch-planner)
modlist_ui_thumbnail_mode=[font=default-bold][color=red]Типово: без мініатюр[/color][/font]\nКерує завантаженням мініатюр під час запуску. Текстові дані доступні завжди.\n\n[font=default-bold]Без мініатюр[/font] — найбезпечніше.\n[font=default-bold]Відповідно до версії[/font] — завантажує мініатюри лише модів, що відповідають поточній гілці Factorio, тобто 2.0 чи 2.1.\n[font=default-bold]Найновіші[/font] — завантажує найновішу доступну мініатюру незалежно від гілки Factorio.\n\n[color=gray]Оновлюйте встановлені моди. Якщо завантаження мініатюр спричиняє проблеми під час запуску, див. FAQ на сторінці мода.[/color]
modlist_ui_default_sort_field=[font=default-bold]Типово: немає[/font]\nВиберіть типовий стовпець сортування під час відкриття Modlist UI.\n[color=gray][font=default-bold]Немає[/font] або нейтральний стан сортування без напрямку означає припустимий [font=default-semibold]порядок завантаження модів[/font].[/color]
modlist_ui_default_sort_dir=[font=default-bold]Типово: за зростанням[/font]\nВиберіть типовий напрямок сортування для вибраного стовпця.\n[color=gray]Нейтральний стан сортування без напрямку означає припустимий [font=default-semibold]порядок завантаження модів[/font].[/color]
modlist_ui_mini_default_position=[font=default-bold]Типово: ліворуч від панелі швидкого доступу[/font]\nВиберіть типову позицію міні-віджета.\n[color=gray][font=default-bold]Ctrl+Shift+клік[/font] на кнопці [▶] повертає міні-віджет у вибрану типову позицію.[/color]
modlist_ui_mini_width=[font=default-bold]Типово: 280 px[/font]\nЗадає ширину міні-віджета від 160 до 400 пікселів.\n[color=gray]В автоматичній позиції [font=default-bold]Над ToolEquip[/font] віджет натомість має ширину ToolEquip — 188 px. Вручну розміщений віджет використовує це налаштування.[/color]
modlist_ui_mini_rotation_seconds=[font=default-bold]Типово: 3 секунди[/font]\nСкільки кожен мод залишається видимим, перш ніж міні-віджет перейде до наступного.

