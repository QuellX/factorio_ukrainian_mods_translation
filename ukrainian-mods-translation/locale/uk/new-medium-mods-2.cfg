inventory-cleanup-configure=Налаштовується за допомогою [font=default-bold]особистих логістичних комірок[/font].
inventory-cleanup-configure-description=Типово __CONTROL__inventory-cleanup__ розподіляє предмети на кшталт сирих руд, компонентів і дослідницьких пакетів, а також вміст сміттєвих комірок.\n\n[font=default-bold]Як налаштувати[/font]\nДодатково це можна налаштувати особистими логістичними комірками. Комірки мають мінімальну й максимальну кількість. __CONTROL__inventory-cleanup__ розподіляє всі предмети понад максимальну кількість (і понад мінімальну, якщо увімкнено налаштування нижче).\n\n[font=default-bold]Ігнорування предметів[/font]\nЩоб виключити певні предмети, додайте їх у логістичні комірки із запитаною кількістю 0 і нескінченним максимумом.
