[space-location-description]
tenebris=Таємнича темна планета, вічно оповита тінню через густу атмосферу, що поглинає світло. Поверхню слабо освітлюють біолюмінесцентні флора й фауна, що процвітають без сонячного світла й кидають слабкі відблиски на ландшафт пурпурових і глибоких синіх відтінків. Tenebris — суворий і загадковий світ, де технології й світло необхідні, щоб вижити серед вічного мороку.
black-hole=Чорна діра, знайдена на шляху до зруйнованої планети. Довкола неї немає жодного астероїда, але вона може знадобитися для чогось іншого... Ця красуня варта того, щоб звернути з курсу, хіба ні?

