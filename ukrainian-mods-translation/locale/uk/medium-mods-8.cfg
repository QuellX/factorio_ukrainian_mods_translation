[item-description]
luciferin=Біолюмінесцентний порошок, що випромінює м'яке синьо-зелене сяйво; використовується в передових енергетичних і світлових технологіях.
lucifunnel=Біолюмінесцентна рослина з ніжним лійкоподібним листям, що випромінює неземне синьо-зелене сяйво. Її закручені вусики й химерні візерунки на листі створюють у темряві заворожливе видовище, схоже на підводні корали чи інопланетну флору. Люцифунель процвітає за слабкого освітлення, де випромінює м'яке примарне світло, приваблюючи нічних запилювачів і огортаючи все довкола містичною аурою.
lucifunnel-seed=Рідкісна світна насінина, що випромінює м'яке синьо-зелене сяйво; необхідна для вирощування біолюмінесцентної флори.
quartz-ore=Блискучий, схожий на кристал мінерал, що трапляється в нерівних земляних покладах; цінується в ремеслі й промисловості.
quartz-crystal=Прозорий склоподібний мінерал з гострими гранями, цінований за красу й міцність у ремеслі й промисловості.
chitin=Міцний шаруватий матеріал з екзоскелетів, відомий своєю пружністю й довговічністю.
tenecap=Тьмяний коричневий гриб.
tenecap-spore=Невелика жменька спор, зібраних з гриба тінешапки.
chitosan=Очищений легкий матеріал, отриманий з хітину, відомий своєю гнучкістю й міцністю.
biobeacon=Маяк, насичений біолюмінесцентною силою; приймає всі модулі, що й звичайний маяк, а також [item=productivity-module].
void-core-inert=Повністю вичерпане ядро порожнечі. Його потрібно перезарядити в космосі
void-bacteria=Бактерії, мутовані так, щоб перетворювати предмети на порожнечу. Довго не виживають поза своїм субстратом.
voidp-void-science-pack=Якщо довго вдивлятися в дослідницький пакет порожнечі, він попросить нарешті покласти його в ту кляту лабораторію.
void-data-disk=Зберігає матерію у вигляді даних. Максимум 512 мегатиронів.
unstable-void-matter=Матерія порожнечі, надто нестабільна для будь-якого використання. Найкраще, що можна зробити, — переробити її
void-promethium=Прометій, насичений порожнечею, надто нестабільний для будь-якого використання
void-assembler=Складальник, видання порожнечі
void-pylon=Здатний перетворювати матерію на дані. То це і є "глибинне навчання"?

