[tips-and-tricks-item-description]
tenebris-briefing=[planet=tenebris] — планета, оповита вічною темрявою: сонячна енергія тут марна, і нічне бачення теж не працює. Планета кишить багатоніжками — сильними й отруйними, але вони не займатимуть вас, якщо не стати в них на шляху. Енергію на планеті дає [item=luciferin] — сполука, що дає змогу створювати біолюмінесцентні механізми, яким не потрібна енергія для роботи. Вантажні капсули можуть збиватися з курсу під час посадки на цю планету; можливо, технології, які ми тут дослідимо, допоможуть цього уникнути?\n\nВам знадобиться [entity=bioinfusor], щоб наділити машини біолюмінесцентними властивостями, які дають їм змогу працювати без енергії.

