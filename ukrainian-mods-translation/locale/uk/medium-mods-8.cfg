[technology-description]
promethium-crushing=Прометій — чудовий будівельний матеріал для ядер порожнечі, але його потрібно обробити.
promethium-void-culture=Схоже, залізні й мідні бактерії можна мутувати так, щоб вони перетворювали прометій
void-crystals=Культури самі не можуть виростити справжні кристали порожнечі, але з відповідною основою й лютим холодом Аквіло вони мають виростити гарні кристали
void-core-chunk=Перш ніж перетворити кристали на ядра, їх треба належно обробити.
void-core-base=Шматки можна з'єднати, просто нагрівши до високої температури. Однак їх треба повільно відпалювати, щоб основа не тріснула. Це має бути легко, адже кристалізаційне покриття теж потребує відпалу... Правда ж?
void-core-activation=Останній крок. Для активації ядра потрібне лише сильне електромагнітне поле
voidp-void-science-pack=Кінець! Поки що...
crystalization-plating=Літій-гольмієвий сплав — чудова основа для вирощування кристалів. Але це потребує контрольованого відпалу, що повертає фторований кетон кімнатної температури, — ще одна температура, з якою доведеться мати справу
void-control-unit=Дослідження прометію відкриє вам цю давню забуту технологію. Що значить "це просто заміна ассета"?
void-data-disk=Зберігає матерію у вигляді даних. Максимум 512 мегатиронів.
void-conversion-1=Дослідіть способи перетворювати матерію на порожнечу
void-conversion-2=Дослідіть способи перетворювати матерію на порожнечу: повернення
void-conversion-3=Дослідіть способи перетворювати матерію на порожнечу: трилогія
void-pylon=Пілони здатні перетворювати матерію на дані. Дехто називає це "глибинним навчанням"...

