[command-help]
slw-debug=Показує відомості про зону, частки фракцій, клімат у вашій позиції та кількість ворогів поблизу за фракціями. Необов'язковий параметр: радіус у клітинках (типово 512).

[slw-zonelist]
header=Місцева фауна
header-tooltip=Ворожі фракції, що живуть на цьому світі, і частка суходолу кожної. Фактична кількість гнізд різниться: деякі фракції будують щільніші бази.
unsurveyed=Місцева фауна невідома. Обстежте цей світ з орбіти через віддалений перегляд навігаційного супутника або висадіться на ньому, щоб з'ясувати, хто живе на поверхні.
no-enemies=На цьому світі ворожої фауни не виявлено.
guardians=Охоронці склепінь
guardians-value=Електричні вороги
guardians-tooltip=Електричні вороги охороняють стародавні споруди цього світу (піраміду склепіння чи руїни), хоч яка місцевість довкола.

[space-exploration-local-wildlife]
menu_space-exploration-local-wildlife=Місцева фауна
title_space-exploration-local-wildlife=Місцева фауна
page_space-exploration-local-wildlife_text_1=Кожен світ за межами Наувісу має власну місцеву фауну. Замість тих самих кусак усюди кожну планету й місяць населяють ворожі фракції, що пасують до її місцевості й ресурсів. Наувіс зберігає звичних ванільних кусак, тож решта Всесвіту на контрасті здається чужою.\n\n[font=heading-2][color=#ffe6c0]Обстеження світу[/color][/font]\nНе можна знати, хто живе на світі, доки ви його не побачили. Щойно світ обстежено — з орбіти через віддалений перегляд навігаційного супутника або висадкою на нього, — Атлас Всесвіту показує для нього розділ «Місцева фауна»: фракції, що там живуть, і частку суходолу кожної. Наведіть на запис, щоб побачити, чому вона там.\n\n[font=heading-2][color=#ffe6c0]Загроза[/color][/font]\nSpace Exploration і далі визначає, скільки ворогів має світ; Local Wildlife визначає лише, які саме. Світ із загрозою 0% лишається вільним від ворожої фауни.
menu_slw_factions=Фракції й місцевість
title_slw_factions=Фракції й місцевість
page_slw_factions_text_1=Кожна фракція живе в місцевості, що їй пасує:\n\n[font=heading-2][color=#ffe6c0]Морозні кусаки[/color][/font] — замерзлий сніг і лід\n[font=heading-2][color=#ffe6c0]Вибухові кусаки[/color][/font] — вулканічний ґрунт і лавові поля\n[font=heading-2][color=#ffe6c0]Токсичні кусаки[/color][/font] — сухий пурпуровий ґрунт\n[font=heading-2][color=#ffe6c0]Електричні вороги[/color][/font] — вологі пурпурові й сині болота\n[font=heading-2][color=#ffe6c0]Арахніди[/color][/font] — пустелі\n[font=heading-2][color=#ffe6c0]Броньовані кусаки[/color][/font] — холодні голі скелі\n[font=heading-2][color=#ffe6c0]Ванільні кусаки[/color][/font] — усе інше\n\nФракція з'являється, лише якщо встановлено її мод. Без нього її місцевість дістається типовій фауні світу (електричні болота — спершу токсичним кусакам).\n\n[font=heading-2][color=#ffe6c0]Одна фракція на базу[/color][/font]\nКожна база належить одній фракції, вибраній у її центрі. Бази, що зростаються, зберігають ту саму фракцію, якщо вона пасує до ґрунту.\n\n[font=heading-2][color=#ffe6c0]Розширення[/color][/font]\nКоли вороги розширюються, нова база отримує фракцію, що пасує до ґрунту, на якому її збудовано.
menu_slw_planets=Характер планети
title_slw_planets=Характер планети
page_slw_planets_text_1=[font=heading-2][color=#ffe6c0]Тематичні фракції[/color][/font]\nКоли світ уперше обстежують, його місцевість наноситься на мапу. Фракція заселяє світ, лише якщо її місцевість вкриває щонайменше 15% суходолу, а світ має не більше двох тематичних фракцій — тих двох, що мають найбільше землі. Менші ділянки іншої місцевості дістаються типовій фауні світу.\n\n[font=heading-2][color=#ffe6c0]Типова фауна[/color][/font]\nТипова фауна займає всю землю, на яку не претендує жодна тематична фракція. На більшості світів це ванільні кусаки, але основний ресурс світу може це змінити:\n[item=se-holmium-ore] Гольмій — електричні вороги\n[item=se-beryllium-ore] Берилій — токсичні кусаки\n[item=se-iridium-ore] Іридій — броньовані кусаки й арахніди\n[item=se-vulcanite] Вулканіт — вибухові кусаки\n[item=se-cryonite] Кріоніт — морозні кусаки\nТематична фракція може збігатися з типовою, що робить її ще поширенішою.\n\n[font=heading-2][color=#ffe6c0]Світи з вітамеланжем[/color][/font]\nБагаті екосистеми навколо [item=se-vitamelange] вітамеланжу приваблюють трохи токсичних і броньованих кусак до звичайної фауни.\n\n[font=heading-2][color=#ffe6c0]Рідна планета[/color][/font]\nНа Наувісі завжди лише ванільні кусаки.
menu_slw_guardians=Стародавні охоронці
title_slw_guardians=Стародавні охоронці
page_slw_guardians_text_1=Щось досі захищає стародавні споруди, розкидані Всесвітом. На світах із ворожою фауною електричні вороги скупчуються навколо пірамід склепінь і руїн, хоч яка місцевість довкола.\n\nПерший вхід у склепіння може розбудити охоронця біля його піраміди.
menu_slw_heavy=Левіафани й матки
title_slw_heavy=Левіафани й матки
page_slw_heavy_text_1=Деякі фракції мають рівні левіафанів і маток, значно сильніших за гігантських. Вони не блукають незайманими світами, тож одразу після прибуття ви їх не зустрінете.\n\nЩойно ваше забруднення досягне гнізда, воно може почати їх породжувати, а вороги, що розширюються, можуть будувати черв'яків-левіафанів і маток на забрудненій землі. Тримайте забруднення подалі від місцевої фауни, щоб тримати подалі й їх.

