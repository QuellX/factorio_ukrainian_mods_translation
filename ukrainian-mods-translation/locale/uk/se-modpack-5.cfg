[tips-and-tricks-item-description]
slw-local-wildlife=Світи за межами Наувісу населяють власні ворожі фракції. Подробиці — на сторінках «Місцева фауна» в Informatron.
slw-planet-wildlife=Світи за межами Наувісу мають власну фауну, що відповідає місцевості: морозні кусаки в льодах, вибухові на вулканічному ґрунті, арахніди в пустелях тощо. Обстежте світ віддаленим переглядом або висадіться на нього, а тоді подивіться розділ «Місцева фауна» в Атласі Всесвіту.
slw-leviathans=Вороги-левіафани й матки з'являються, лише коли ваше забруднення досягає їхніх гнізд. Тримайте забруднення подалі від фауни, щоб тримати подалі й їх.
slw-resource-worlds=Основний ресурс світу визначає його фауну. Гольмієві світи кишать електричними ворогами, берилієві — токсичними кусаками, іридієві — броньованими кусаками й арахнідами, вулканітові — вибуховими кусаками, а кріонітові — морозними кусаками.
slw-ancient-guardians=Електричні вороги охороняють піраміди склепінь і руїни на світах із ворожою фауною. Готуйтеся до опору, коли шукатимете стародавні технології.
