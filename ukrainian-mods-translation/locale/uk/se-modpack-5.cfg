[mod-setting-description]
fill4me-maximum-fuel-value=Не заправляти автоматично паливо, теплотворність якого перевищує задане значення. Ракетне паливо — 100000000 (100 мільйонів). Тверде паливо — 12000000 (12 мільйонів). 0 — заправляти будь-яке.
fill4me-maximum-ammo-value=Не заряджати автоматично боєприпаси, шкода яких перевищує задане значення. Не розрізняє артилерію й кулі. Використовуйте обережно. 0 — заряджати будь-які.
fill4me-refill-ignores-range-limit=Якщо ввімкнено, діє оригінальна поведінка моду: можна перезаправити будь-яку турель чи машину, хоч як далеко вона є. Якщо вимкнено, турелі поза відстанню «відкрити або отримати доступ» не можна перезаправити, доки ви не підійдете ближче.
fill4me-ignore-ammo-radius=Позначте, щоб ігнорувати радіус боєприпасів під час заряджання турелей. ПРИМІТКА: турель може стріляти по надто близьких цілях і пошкодити чи знищити себе.
fill4me-ammo-load-limit=Виберіть спосіб обмеження кількості боєприпасів, що заряджаються в турелі/зброю. «Відсоток» заряджає до максимального відсотка від того, що є в інвентарі. «Кількість» заряджає до певного числа. «Обидва» вибирає менше з двох значень.
fill4me-ammo-load-percent=Відсоток наявних боєприпасів, що заряджається в турель, якщо обмеження за відсотком.
fill4me-ammo-load-count=Максимальна кількість, що заряджається в турель, якщо обмеження за кількістю.
fill4me-blacklist-fuel=Введіть внутрішні назви джерел палива через кому. Команда «/f4m.list_fuel» показує джерела палива. Приклад: «small-electric-pole,wood»
fcpu-gui-editor-autoscroll=Прокручувати до рядка з поточною інструкцією
fcpu-debug-mode=Формат виведення налагоджувальної інформації
fcpu-program-lines=Більші значення можуть зробити інтерфейс повільним
rq-notifications=Якщо ввімкнено, у чаті з'являтиметься повідомлення, коли ваша команда завершує дослідження. Зручно мати історію завершених досліджень у чаті.
rq-pause-game=Ставити гру на паузу, поки відкрите вікно черги досліджень. Працює лише в одиночній грі.
rq-sync=Як ванільна черга досліджень взаємодіє з розширеною.
slw-zonelist-enemies=Додає розділ «Місцева фауна» до відомостей про планету в Атласі Всесвіту Space Exploration зі списком ворожих фракцій на обстеженому світі й часткою суходолу кожної.
slw-resource-defaults=На планетах з одним із цих основних ресурсів вказана фракція замінює ванільних кусак на всьому суходолі, не зайнятому тематичними фракціями планети (звичайна місцевість і біоми, не вибрані для планети): гольмій — електричні вороги; берилій — токсичні кусаки; іридій — броньовані кусаки й арахніди (порівну, по базах); вулканіт — вибухові кусаки; кріоніт — морозні кусаки. Діє на щойно згенерований суходіл.
slw-planet-min-coverage=Коли створюється планета, її клімат оцінюється по всій поверхні. Тематична фракція допускається на планету, лише якщо її біоми вкривають щонайменше цю частку суходолу. Менші ділянки її біому дістаються типовій фракції планети: ванільним кусакам, якщо основний ресурс планети не задає іншу. Рідні планети, як-от Наувіс, завжди мають лише ванільних кусак. Діє лише на планети, створені після зміни.
slw-planet-max-factions=Не більше стількох тематичних фракцій на планету — тих, що мають найбільше покриття біомом. 0 — без обмежень. Ванільні кусаки, додаткові фракції вітамеланжу й охоронці стародавніх технологій не враховуються. Діє лише на планети, створені після зміни.
slw-unify-bases=Кожна ворожа база — це одна фракція, визначена в її центрі або продовжена від бази, якої вона торкається, тож бази на межі біомів не змішують фракції.
slw-heavy-need-pollution=Вороги-левіафани й матки, значно сильніші за гігантських, з'являються лише тоді, коли ваше забруднення досягає гнізда. Вони ніколи не розміщуються під час генерації планети, гніздо без забруднення ніколи їх не породжує, а під час розширення на незабруднену землю будується гігантський черв'як.
slw-hover-explain=Тимчасовий засіб налагодження. Наведення на вороже гніздо чи черв'яка показує мітку з біомом, кліматом, шансом появи кожної фракції там, загрозою планети й тим, як там опинилася база.
slw-fix-se-climate=Space Exploration 0.7.57 зберігає налаштування вологості й aux (типу місцевості) кожної планети під старими назвами Factorio 1.1, які Factorio 2.x ігнорує, тож усі планети отримують середню вологість і aux. Якщо ввімкнено, новостворені планети використовують задумані SE значення: сухі планети стають пустелями, а планети з високим aux — пурпуровими. Це змінює місцевість нових планет. Наявні планети не змінюються.
slw-vitamelange-toxic-share=Частка появ на звичайному суходолі, що припадає на токсичних кусак на планетах із вітамеланжем.
slw-vitamelange-armoured-share=Частка появ на звичайному суходолі, що припадає на броньованих кусак на планетах із вітамеланжем.
slw-guardians-enabled=Електричні гнізда скупчуються навколо пірамід стародавніх склепінь і руїн на планетах із загрозою понад 0.
slw-guardian-radius=Максимальна відстань у клітинках між гніздом охоронців і його стародавньою спорудою.
slw-guardian-nests-max=Кількість гнізд охоронців на споруду за повної загрози. На планетах з меншою загрозою їх менше.
slw-vault-guardian-enabled=Коли хтось уперше входить у склепіння, біля його піраміди з'являється електричний бос.
slw-retheme-expansions=Коли вороги будують нову базу, вона стає фракцією, що відповідає біому, де її збудовано.

