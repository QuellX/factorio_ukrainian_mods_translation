[string-mod-setting-description]
rq-sync-disabled=Вимикає ванільну чергу досліджень.
rq-sync-sync=Синхронізує зміни між ванільною й розширеною чергою досліджень.
rq-sync-wait=Чекає, доки завершиться ванільна черга, перш ніж обробляти розширену.
rq-sync-freeze=Заморожує ванільну чергу досліджень, доки не завершиться розширена.
rq-sync-move-head=Переносить технології, додані у ванільному інтерфейсі, на початок розширеної черги.
rq-sync-move-tail=Переносить технології, додані у ванільному інтерфейсі, у кінець розширеної черги.
rq-sync-hybrid=Синхронізує перші 4 місця ванільної черги з верхом розширеної черги. Останні 3 місця лишаються вільними, щоб додавати нові технології в розширену чергу через ванільний інтерфейс.

