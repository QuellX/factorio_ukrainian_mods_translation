[item-description]
RTZiplineTrolley=Цей моторизований візок канатної дороги працює від електрики, що тече кабелем, по якому він їде. Встановіть контролер, виберіть візок і натисніть клавішу канатної дороги (типово F) біля опори ЛЕП, щоб поїхати, і «Взаємодію» ще раз, щоб зістрибнути. Автоматично зупиняється в тупиках.\nСпоживає 450 кВт.
RTZiplineTrolley2=Удвічі швидший за звичайний візок канатної дороги! Споживає 1 МВт. Графічний дизайн — моя пристрасть :)
RTZiplineTrolley3=Удвічі швидший за швидкий візок канатної дороги! Споживає 5 МВт.
RTZiplineTrolley4=Удвічі швидший за прудкий візок канатної дороги! Споживає 10 МВт.
RTZiplineTrolley5=Значно швидший за експрес-візок канатної дороги! Чи зможете ви взагалі кермувати на такій швидкості? Споживає 50 МВт.
RTZiplineControls=Встановіть пару таких у слот боєприпасів електричного візка канатної дороги, щоб керувати його рухом.
RTZiplineCrankControls=Утримуйте клавішу пострілу під час поїздки, щоб отримати додаткове прискорення. Може рухати візок навіть без живлення в мережі. Потребує заміни через деякий час.
RTProgrammableZiplineControls=Ці контролери можна запрограмувати, щоб вони самі возили вас між будь-якими двома терміналами канатної дороги без кермування.
RTLickmawBalls=Цей соковитий фрукт — справжній хіт на Sawcon.\n\nПід час сесії запитань і відповідей з розробниками на LAN-вечірці Space Age розповіли, що колись під час розробки вони справді були в грі. Критики вважають їх вилучення найбільшим провалом доповнення, і саме це заважає йому здобути мультивсесвітнє визнання.
RTAIZiplineControls=Цей контролер може провести електричний візок канатної дороги до будь-якої опори ЛЕП в електромережі. Під час поїздки наведіть курсор на будь-яку опору й натисніть клавішу канатної дороги, щоб автоматично поїхати туди.
RTItemShellItem=Використовується для вистрілювання стосів предметів з електромагнітних гармат

[mod-setting-name]
RTStreamSetting=Кинуті предмети як снаряди
RTThrowersSetting=Увімкнути базові функції метальників
RTBounceSetting=|-Увімкнути зведені кидки й спеціальні відбивні платформи (потрібна базова відбивна платформа)
RTTrainRampSetting=Увімкнути залізничні трампліни. Також вмикає вагони з бойовим вантажем, якщо ввімкнено зведені кидки
RTMagRampRange=Макс. дальність магнітного трампліна
RTTrainBounceSetting=|-Увімкнути відбивні платформи для потягів (потрібні залізничні трампліни)
RTImpactSetting=Увімкнути ударні вагони й ударні розвантажувачі
RTZiplineSetting=Увімкнути електричні канатні дороги
RTZiplineSmoothSetting=Рух на канатній дорозі
RTModdedThrowers=|-Увімкнути варіанти метальників із модів (потрібні ввімкнені базові метальники)
RTThrowersDynamicRange=|-Увімкнути обчислення дальності метальників
RTOverflowComp=Запобігання переповненню метальників
RTOverflowTimeout=Тайм-аут переповнення
RTSpillSetting=Поведінка розсипаних предметів
RTImpactGrouping=Групування предметів в ударних вагонах
RTShowRange=Показувати індикатор дальності після будівництва
RTChestPop=Предмети розлітаються зі знищених скринь/транспорту
RTVehicleCharacterKnockback=Транспорт відкидає гравців під час удару
RTPlatformLooseItems=Незакріплені предмети на космічних платформах відлітають під час злету
RTTrapdoorSetting=Увімкнути вагони з донним люком
RTItemCannonSetting=|-Увімкнути гармати для предметів, рикошетні панелі й жолоби
MiningSpeedDebuffTime=Штраф до швидкості видобування для об'єктів, що перекриваються (секунди)
RTZiplineDisablesBotsSetting=Канатна дорога вимикає особисті робопорти

[mod-setting-description]
RTStreamSetting=Кинуті предмети представлені ігровими об'єктами-снарядами, що менше навантажує гру. Якщо вимкнено, кинуті предмети малюються спрайтами, що перекидаються в польоті, — це веселіше й не займає слотів ігрових об'єктів, але більше навантажує. Зміна цього налаштування знищує всі предмети, що зараз у польоті.
RTBounceSetting=Сигнальна відбивна платформа й детонаторна відбивна платформа
RTZiplineSmoothSetting=На більших швидкостях і з близько розташованими опорами погойдування камери може в декого викликати запаморочення.
RTModdedThrowers=Вмикає варіанти метальників для маніпуляторів із модів, інакше створюються лише метальники для ванільних маніпуляторів.
RTThrowersDynamicRange=Дальність маніпуляторів-метальників обчислюватиметься на основі дальності вкладання оригінального маніпулятора. (Інакше всі метальники матимуть дальність 15, крім довгорукого з дальністю 25 незалежно від інших модів)
RTOverflowComp=Вмикає або вимикає логіку, що допомагає мінімізувати переповнення, коли метальники розкидають предмети всюди. Для розрахунків конвеєри мають «інвентар» на 8 слотів, тож стосові маніпулятори з >8 предметами в руці, націлені на конвеєр, ніколи не кидатимуть.
RTOverflowTimeout=Якщо запобігання переповненню ввімкнено, це час у секундах, який метальник чекає щоразу, коли не знаходить вільного місця в інвентарі цілі, перш ніж перевірити знову. Це обмежує лаги від постійних перевірок вільного місця.
RTSpillSetting=Розсипати — якщо кинутий предмет не вміщується туди, куди впав, він падає на підлогу.\nРозсипати й позначити — падає на підлогу й позначається для збору роботами.\nЗнищити — знищує предмет, якщо той не вміщується, ціною забруднення.
RTThrowersSetting=Вмикає базові функції маніпуляторів-метальників, відбивних платформ, катапульт для гравців і люків. Має бути ввімкнено для створення метальників із модів.
RTImpactGrouping=Максимальна кількість снарядів, що створюються для кожного виду предметів в ударному вагоні. Менше снарядів зменшує лаги, групуючи більше предметів у кожному снаряді, але виглядає значно менш круто.
RTShowRange=Індикатори дальності відбивних платформ і конвеєрних трамплінів в альтернативному режимі можна вмикати й вимикати клацанням. Це налаштування визначає, чи видимі вони типово після першого будівництва.
RTChestPop=Половина предметів у скрині чи транспорті розлітається й розсипається по землі, коли їх знищено.
RTTrapdoorSetting=Якщо ввімкнено залізничні трампліни, вмикає також трампліни-перемикачі донних люків.
MiningSpeedDebuffTime=Після прибирання того, що зазвичай перекриває інший об'єкт (люки, залізничні трампліни), швидкість видобування знижується на цей час, щоб випадково не прибрати об'єкт під ним.
RTZiplineDisablesBotsSetting=Чи вимикати автоматично особисті робопорти на канатній дорозі. Якщо ввімкнено, після сходження з канатної дороги налаштування особистого робопорта повертаються до попередніх.

[virtual-signal-name]
DirectorBouncePlateUp=Відскок угору
DirectorBouncePlateRight=Відскок праворуч
DirectorBouncePlateDown=Відскок униз
DirectorBouncePlateLeft=Відскок ліворуч
ThrowerRangeSignal=Дальність метальника
StationTrapdoorWagonSignal=Перемкнути донні люки

[virtual-signal-description]
DirectorBouncePlateUp=Задайте предмет у цьому слоті, щоб він відскакував угору після приземлення на цю відбивну платформу
DirectorBouncePlateRight=Задайте предмет у цьому слоті, щоб він відскакував праворуч після приземлення на цю відбивну платформу
DirectorBouncePlateDown=Задайте предмет у цьому слоті, щоб він відскакував униз після приземлення на цю відбивну платформу
DirectorBouncePlateLeft=Задайте предмет у цьому слоті, щоб він відскакував ліворуч після приземлення на цю відбивну платформу
ThrowerRangeSignal=Метальники, що отримують цей сигнал, налаштовують дальність відповідно до його значення. Якщо сигнал є і на червоному, і на зеленому проводі, значення додаються. Дальність не може перевищувати ліміт метальника.
StationTrapdoorWagonSignal=Якщо на залізничну зупинку подано цей сигнал [virtual-signal=StationTrapdoorWagonSignal], вагони з донним люком у потягах, що на ній зупиняються, перемикають стан люка після прибуття й повертають його після відправлення.

[magnet-ramp-stuff]
Step2=Тепер клацніть на прямі рейки або відбивну платформу для потягів у межах дальності, щоб задати дальність стрибка магнітного трампліна.
missing=Магнітний трамплін зник. Що ви НАРОБИЛИ?!
BeyondRange=Поза дальністю або не по центру трампліна. Макс. дальність — __1__ клітинок.
StraightRail=Це не прямі рейки й не відбивна платформа для потягів
set=Задана дальність: __1__ клітинок. Потрібна енергія: __2__ Дж
unable=Тут неможливо збудувати трамплін, спробуйте ще раз

[zipline-stuff]
reqs=Щоб їздити лініями електропередач, мені потрібен електричний візок канатної дороги з установленим і вибраним контролером.
terminalReqs=Щоб користуватися терміналами канатної дороги, мені потрібен електричний візок канатної дороги з установленим і вибраним програмованим контролером.
range=Я не дотягнуся.
