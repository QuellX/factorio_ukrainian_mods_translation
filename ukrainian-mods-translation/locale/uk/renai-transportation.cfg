[entity-description]
RTBouncePlate=Предмети або гравці, кинуті на відбивну платформу, відскочать уперед ще на 10 клітинок. Працює в усіх 4 напрямках. Клацніть, щоб перемкнути показ дальності в альтернативному режимі, і натисніть «Взаємодія» (типово F), щоб налаштувати дальність відскоку.
BouncePlate5=Предмети або гравці, кинуті на відбивну платформу, відскочать уперед ще на 5 клітинок. Працює в усіх 4 напрямках. Клацніть, щоб перемкнути показ дальності в альтернативному режимі, і натисніть «Взаємодія» (типово F), щоб налаштувати дальність відскоку.
BouncePlate15=Предмети або гравці, кинуті на відбивну платформу, відскочать уперед ще на 15 клітинок. Працює в усіх 4 напрямках. Клацніть, щоб перемкнути показ дальності в альтернативному режимі, і натисніть «Взаємодія» (типово F), щоб налаштувати дальність відскоку.
PrimerBouncePlate=Гранати, капсули, міни, ракети, снаряди та інші предмети після відскоку від неї будуть зведені для спрацювання. Додаткова потужність збільшує дальність до 40 клітинок. Предмети, які не можна звести, відскакують лише на 10 клітинок.\nНатисніть «Взаємодія» (типово F), щоб перейти в режим розсіювання. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
PrimerSpreadBouncePlate=Гранати, капсули, міни, ракети, снаряди та інші предмети після відскоку від неї будуть зведені для спрацювання. Додаткова потужність збільшує дальність до 37–40 клітинок з розкидом 40 клітинок. Предмети, які не можна звести, відскакують лише на 10 клітинок.\nНатисніть «Взаємодія» (типово F), щоб перейти в точний режим. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
SignalBouncePlate=Діє як комбінатор сталих. Сигнал вмикається/вимикається, коли від неї відскакують предмети чи гравці. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
DirectedBouncePlate=Як звичайна відбивна платформа, але спрямована. Відскок на 10 клітинок. Клацніть, щоб перемкнути показ дальності в альтернативному режимі, і натисніть «Взаємодія» (типово F), щоб налаштувати дальність відскоку.
DirectedBouncePlate5=Як звичайна відбивна платформа, але спрямована. Відскок на 5 клітинок. Клацніть, щоб перемкнути показ дальності в альтернативному режимі, і натисніть «Взаємодія» (типово F), щоб налаштувати дальність відскоку.
DirectedBouncePlate15=Як звичайна відбивна платформа, але спрямована. Відскок на 15 клітинок. Клацніть, щоб перемкнути показ дальності в альтернативному режимі, і натисніть «Взаємодія» (типово F), щоб налаштувати дальність відскоку.
DirectorBouncePlate=Розподільна відбивна платформа якимось чином розрізняє предмети, що на неї падають, і відбиває їх у різні боки залежно від того, як ви її запрограмуєте. Клацніть, щоб задати фільтри предметів.
OpenContainer=Залізна скриня без кришки, щоб у неї могли падати предмети.
PlayerLauncher=Станьте зверху й натисніть «Взаємодія» (типово F), щоб метнути себе вперед на 10 клітинок. Приземліться на відбивну платформу, щоб стрибнути ще далі.
HatchRT=Встановіть люк на щось з інвентарем, щоб кинуті предмети могли туди падати.
RTThrower-EjectorHatchRT=Люк, що не приймає предмети в об'єкт, на якому стоїть, а викидає предмети звідти назовні на 20 клітинок.\nСТРІЛКА ПАДІННЯ ПІД ЧАС РОЗМІЩЕННЯ НЕТОЧНА ЧЕРЕЗ ОБМЕЖЕННЯ FACTORIO; після будівництва дальність стане 20.
RTVacuumHatch=Люк, абияк приєднаний до помпи. Засмоктує предмети з підлоги в зоні 5x5 перед собою й передає в те, що позаду.
RTTrainRamp=Для потяга, що злітає з цього трампліна, «поточне призначення» в розкладі зсувається на одну зупинку вперед. Це дає змогу спрямовувати автоматичні потяги на потрібний трамплін за допомогою зупинки після трампліна, не псуючи маршрут. Натисніть «Взаємодія» (типово F), щоб вимкнути пропуск зупинки, коли він не потрібен.\nПам'ятайте, що потяг може сповільнитися, якщо наближається до зупинки або якщо наступна зупинка після стрибка недосяжна. Швидкість потяга на трампліні визначає, як далеко він полетить. Потяги мають заїжджати на трамплін строго прямо.
RTTrainRampNoSkip=Для потяга, що злітає з цього трампліна, «поточне призначення» в розкладі НЕ змінюється. Натисніть «Взаємодія», щоб повернути режим пропуску.\nПам'ятайте, що потяг може сповільнитися, якщо наближається до зупинки або якщо наступна зупинка після стрибка недосяжна. Швидкість потяга на трампліні визначає, як далеко він полетить. Потяги мають заїжджати на трамплін строго прямо.
RTTrainBouncePlate=Потяги, що приземляються на ці збільшені відбивні платформи, знову відскакують уперед. Досі доволі примхливі, додані здебільшого заради мемів.
RTTrainDirectedBouncePlate=Як звичайна спрямована відбивна платформа, але для потягів. Досі доволі примхливі, додані здебільшого заради мемів.
RTMagnetTrainRamp=Клацніть, щоб задати, куди мають приземлятися потяги, що злітають з цього трампліна. Потужні електромагніти спрямовують вагони до потрібної точки приземлення, витрачаючи приблизно 200 кДж на клітинку за стрибок, які одразу забираються з буфера трампліна. Для роботи магнітів буфер має бути повним, інакше трамплін діє як звичайний. Коли стрибки йдуть ланцюжком, стежте, щоб хоча б один вагон завжди повністю стояв на землі. Потяги пропускають зупинку в розкладі, злітаючи з нього; перемикається «Взаємодією» (типово F)
RTMagnetTrainRampNoSkip=Клацніть, щоб задати, куди мають приземлятися потяги, що злітають з цього трампліна. Потужні електромагніти спрямовують вагони до потрібної точки приземлення, витрачаючи приблизно 200 кДж на клітинку за стрибок, які одразу забираються з буфера трампліна. Для роботи магнітів буфер має бути повним, інакше трамплін діє як звичайний. Коли стрибки йдуть ланцюжком, стежте, щоб хоча б один вагон завжди повністю стояв на землі. Потяги НЕ пропускають зупинку в розкладі, злітаючи з нього (перемикається «Взаємодією»)
RTMagnetRail=Потужний електромагніт під керуванням магнітного залізничного трампліна. Відштовхує або притягує вагони, допомагаючи їм досягти потрібної дальності стрибка. Частинки — це візуалізація магнітного поля. Мабуть.
RTMagnetRampDrain=Цей буфер живить електромагнітні платформи, приєднані до магнітного трампліна, віддаючи їм усю енергію під час стрибка. Розмір буфера залежить від дальності стрибка, а заповнюється він зі швидкістю 40 МВт.
RTImpactUnloader=Коли потяг врізається в нього, усі приєднані ударні вагони відкривають люки, і їхній вміст вилітає назовні. Що швидше зіткнення, то більше предметів вилітає й то далі вони летять. Після удару «поточне призначення» потяга в розкладі зсувається на одну зупинку вперед, що дає змогу автоматизувати процес зупинкою після ударного розвантажувача й локомотивом, повернутим назад. Максимальну кількість створюваних снарядів можна налаштувати в параметрах мода.
RTSwitchTrainRamp=Діє як звичайний залізничний трамплін, але ще й перемикає стан вагонів з донним люком, що злітають з нього. Перемкнений так вагон повертає стан після приземлення.
RTSwitchTrainRamp-placer=Діє як звичайний залізничний трамплін, але ще й перемикає стан вагонів з донним люком, що злітають з нього. Перемкнений так вагон повертає стан після приземлення.
RTSwitchTrainRampNoSkip=Діє як звичайний залізничний трамплін без пропуску зупинки, але ще й перемикає стан вагонів з донним люком, що злітають з нього. Перемкнений так вагон повертає стан після приземлення.
RTMagnetSwitchTrainRamp=Діє як звичайний магнітний залізничний трамплін, але ще й перемикає стан вагонів з донним люком, що злітають з нього. Перемкнений так вагон повертає стан після приземлення.
RTMagnetSwitchTrainRamp-placer=Діє як звичайний магнітний залізничний трамплін, але ще й перемикає стан вагонів з донним люком, що злітають з нього. Перемкнений так вагон повертає стан після приземлення.
RTMagnetSwitchTrainRampNoSkip=Діє як звичайний магнітний залізничний трамплін без пропуску зупинки, але ще й перемикає стан вагонів з донним люком, що злітають з нього. Перемкнений так вагон повертає стан після приземлення.
RTTrapdoorSwitch=Перемикач, що відкриває/закриває люки вагонів з донним люком, які проїжджають по ньому.
RTTrapdoorSwitch-placer=Перемикач, що відкриває/закриває люки вагонів з донним люком, які проїжджають по ньому.
RTTrainRamp-placer=Для потяга, що злітає з цього трампліна, «поточне призначення» в розкладі зсувається на одну зупинку вперед. Це дає змогу спрямовувати автоматичні потяги на потрібний трамплін за допомогою зупинки після трампліна, не псуючи маршрут. Натисніть «Взаємодія» (типово F), щоб вимкнути пропуск зупинки, коли він не потрібен.\nПам'ятайте, що потяг може сповільнитися, якщо наближається до зупинки або якщо наступна зупинка після стрибка недосяжна. Швидкість потяга на трампліні визначає, як далеко він полетить. Потяги мають заїжджати на трамплін строго прямо.
RTMagnetTrainRamp-placer=Клацніть, щоб задати, куди мають приземлятися потяги, що злітають з цього трампліна. Потужні електромагніти спрямовують вагони до потрібної точки приземлення, витрачаючи приблизно 200 кДж на клітинку за стрибок, які одразу забираються з буфера трампліна. Для роботи магнітів буфер має бути повним, інакше трамплін діє як звичайний. Коли стрибки йдуть ланцюжком, стежте, щоб хоча б один вагон завжди повністю стояв на землі. Потяги пропускають зупинку в розкладі, злітаючи з нього (перемикається «Взаємодією»)
RTImpactUnloader-placer=Коли потяг врізається в нього, усі приєднані ударні вагони відкривають люки, і їхній вміст вилітає назовні. Що швидше зіткнення, то більше предметів вилітає й то далі вони летять. Після удару «поточне призначення» потяга в розкладі зсувається на одну зупинку вперед, що дає змогу автоматизувати процес зупинкою після ударного розвантажувача й локомотивом, повернутим назад. Максимальну кількість створюваних снарядів можна налаштувати в параметрах мода.
RTPayloadWagon=Коли цей вагон аварійно приземляється, предмети всередині, які можна звести, зводяться й розлітаються в радіусі 10 клітинок. Вибухівка (саме предмет «вибухівка», а не «речі, що вибухають») у вагоні збільшує радіус розльоту на 0,2 клітинки, максимум +30 клітинок при 150 вибухівки. Щоб обмежити лаги, вилітає лише 1 повний стос кожного предмета, який можна звести.
RTImpactWagon=Коли потяг із такими вагонами врізається в ударний розвантажувач, усі приєднані ударні вагони відкривають люки, і їхній вміст вилітає назовні. Що швидше зіткнення, то більше предметів вилітає й то далі вони летять. Максимальну кількість створюваних снарядів можна налаштувати в параметрах мода, щоб зменшити лаги.
RTTrapdoorWagon=Коли донний люк цього вагона відкритий, вантаж випадає знизу.
RTZiplineTerminal=Якщо у вас є програмований контролер канатної дороги, клацніть на цей термінал, щоб запрограмувати контролер маршрутом до будь-якого іншого термінала в тій самій мережі — тоді він сам поведе туди візок.
RTThrower-PrimerThrower=Гібрид метальника й турелі! Цей метальник жбурляє у ворогів предмети, які можна звести (гранати, капсули, ракети тощо). Він стріляє з упередженням по рухомих цілях, тож може влучити по своїх трохи позаду дальності наведення.
RTBeltRamp=Цей високошвидкісний похилий конвеєр безперервно запускає предмети зі свого кінця. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
RTfastBeltRamp=Цей надшвидкісний похилий конвеєр безперервно запускає предмети зі свого кінця. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
RTexpressBeltRamp=Цей шалено швидкий похилий конвеєр безперервно запускає предмети зі свого кінця. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
RTturboBeltRamp=Цей гіпершвидкісний похилий конвеєр безперервно запускає предмети зі свого кінця. Клацніть, щоб перемкнути показ дальності в альтернативному режимі.
RTItemCannon=Завантажує предмети в капсули й майже миттєво розганяє їх до неймовірних швидкостей у стволі потужними електромагнітами й надпровідниками. Стріляє лише ПОВНИМИ стосами. Кожен постріл витрачає весь енергобуфер, який треба перезарядити перед наступним пострілом. Натисніть «Взаємодія», щоб увімкнути/вимкнути лазерний приціл гармати.
RTRicochetPanel=Відхиляє капсули з предметами, випущені з електромагнітних гармат, сфокусованими спалахами магнітного поля. Кожен спалах витрачає енергобуфер. Якщо під час удару капсули буфер заповнений менш ніж на 75%, енергії може не вистачити, щоб безпечно її відбити.
RTCatchingChute=Ловить капсули з предметами в польоті й кладе вміст у приєднану скриню.
RTMergingChute=Об'єднує траєкторії капсул з предметами, що летять з двох різних напрямків, спрямовуючи їх в один вихід. Якщо під час удару капсули буфер заповнений менш ніж на 75%, енергії може не вистачити, щоб безпечно її перенаправити.
RTDivergingChute=Капсули з предметами, що влітають у вхід, по черзі вилітають з двох виходів. Якщо під час удару капсули буфер заповнений менш ніж на 75%, енергії може не вистачити, щоб безпечно її перенаправити.

