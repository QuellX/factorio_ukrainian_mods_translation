[mod-setting-description]
agb-feedback-mode=Показувати або приховувати спливаючий текст «Бракує предметів» під час наведення на привиди, які не можна збудувати.
blend-ratio=Коефіцієнт змішування кольору станції з кольором потяга. Що більше значення, то швидше колір станції наближається до кольору потяга.
bottleneck-analyzer-sample-rate=Як часто машини опитуються для даних про вузькі місця. Менші значення дають детальніші дані, але використовують більше пам'яті й процесора.
bottleneck-analyzer-enabled=Увімкнути або вимкнути вибірку вузьких місць. Вимкніть, щоб перевірити навантаження на процесор.
bottleneck-analyzer-max-samples=Кількість вибірок на рецепт, що зберігаються в кільцевому буфері. Більші значення дають довшу історію, але збільшують розмір файлу збереження.
bottleneck-analyzer-diagnostics=Записувати діагностику кожного проходу в script-output/bottleneck-diagnostics.log для подальшого аналізу припущень вибірки.
enemy-alert-minimum-attack-group-size=Показувати сповіщення про атаку, лише коли група має щонайменше стільки учасників. Не впливає на сповіщення про збирання й розширення
enemy-alert-expand-arrive=Спрацьовує, коли ворожа група прибуває на місце розширення й починає будувати нову базу
enemy-alert-other-surfaces=Отримувати сповіщення з інших планет, космічних платформ і поверхонь із модів
enemy-alert-charted-areas-only=Отримувати сповіщення, лише коли активність відбувається в чанку, розвіданому вашою фракцією. Поточне покриття радарами не потрібне
pink-plasma=Зазвичай плазма в трубах показується темно-синьою, дуже схожою на окисник, що не пасує до рожевого значка плазми. Це налаштування змінює колір на рожевий.
duct-extend=У Space Age трубні мережі мають максимальну протяжність, після якої потрібна помпа або щось подібне. Типово для труб — 320, для плазмових повітроводів — 32.
super-cheap=Робить рецепти плазмових повітроводів надзвичайно дешевими: 5 вольфраму, 5 надпровідників -> 10 плазмових повітроводів. Перенесено з мода «plasma duct tweak». Не рекомендується.
fusion-unlock=Відкриває плазмові повітроводи разом із дослідженням термоядерного синтезу. Перенесено з «plasma duct tweak». Рекомендується тим, хто не любить прометій.
itsabouttime-show-clock=Чи показувати ігровий годинник.
itsabouttime-clock-precision=Це налаштування визначає, як часто оновлюється годинник, в ігрових хвилинах.\n\nЗалежно від планети одна реальна секунда може відповідати кільком ігровим хвилинам (до 16 ігрових хвилин за секунду на Вулканусі). Надто часте оновлення годинника може сильно відволікати й дратувати.\n\nЗ «Динамічною точністю» точність підбирається для кожної планети так, щоб годинник оновлювався приблизно раз на секунду.

