ui-site-area-tooltip=Вибрати чи змінити область цього родовища
ui-site-area-caption=Змінити область цього родовища, наприклад після того, як ви перенесли ресурси в інше місце. Якщо треба просто об'єднати родовища, скористайтеся інструментом об'єднання. Утримуйте SHIFT (= додати) і CTRL (= відняти), щоб змінити режим інструмента. Примітка: родовища завжди включають усі ресурси в межах вибраних чанків мапи. Попередження: це можна скасувати лише скиданням усіх даних поверхні.
