[mod-setting-description]
enemy-alert-expand-arrive-alert=Спрацьовує, коли ворожа група прибуває на місце розширення й починає будувати нову базу
rb-enable-show-hidden=Якщо ввімкнено, в інтерфейсі книги рецептів з'явиться кнопка «Показати приховане».\n[font=default-bold]УВАГА:[/font] цей параметр може значно знизити продуктивність і збільшить розмір файлів збереження.
bet-battery-slots=Кількість паливних комірок акумуляторно-електричного локомотива. Мод збалансовано під одну комірку, і грати варто саме так. Цей параметр існує, щоб обійти помилку в моді LTN, який створює нездійсненні умови заправлення для локомотивів, що приймають лише один предмет палива. Якщо використовуєте LTN, встановіть 2, а множник місткості — 0,5. [1 – 5]
bet-capacity-multiplier=Місткість чотирьох рівнів акумуляторних блоків потяга базується на повних інвентарях потяга з вугіллям, твердим паливом, ракетним паливом чи ядерним паливом. Якщо цього замало або вам потрібна більша місткість раніше, збільште цей множник. Час заряджання й інгредієнти акумуляторів відповідно зростуть. [0,1 – 100]
bet-charging-efficiency=1,0 — ідеальна ефективність заряджання. Значення нижче 1 — для додаткового виклику, вище 1 — щоб схитрувати й отримати безкоштовну енергію. [0,1 – 1000]

