br-tracer-style-realistic=Реалістичний
br-tracer-style-enhanced=Покращений
br-tracer-style-arcade=Аркадний
br-impact-layering-clean=Чисто
br-impact-layering-balanced=Збалансовано
br-impact-layering-full=Повністю
br-combat-fx-preset-subtle=Стримано
br-combat-fx-preset-balanced=Збалансовано
br-combat-fx-preset-cinematic=Кінематографічно

[string-mod-setting-description]
br-tracer-style-realistic=Тьмяніші, тонші, менше світіння. Найкраще для реалістичних трасерів.
br-tracer-style-enhanced=Рекомендоване типове значення. Добре видно вночі, але менш схоже на лазер, ніж у старих версіях.
br-tracer-style-arcade=Яскравіші ігрові трасери для тих, хто хоче максимальної помітності.
br-impact-layering-clean=Менше додаткових шарів влучань. Найкраще для великих баз і щільних стін турелей.
br-impact-layering-balanced=Рекомендоване типове значення. Влучання помітні, але поле бою не тоне в диму.
br-impact-layering-full=Максимальна деталізація влучань. Найкраще для скриншотів, невеликих боїв і кінематографічної гри.
br-combat-fx-preset-subtle=Чистіша картинка для великих баз і важких боїв турелей.
br-combat-fx-preset-balanced=Рекомендоване типове значення: помітні бойові ефекти без перебору.
br-combat-fx-preset-cinematic=Більше диму, сильніше світіння й потужніші влучання. Найкраще для скриншотів і невеликих боїв.
