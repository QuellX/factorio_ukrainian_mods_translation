[mod-setting-description]
br-combat-fx-preset=Масштабує візуальні ефекти, не змінюючи шкоди зброї. "Стримано" — чистіше, "Збалансовано" — задумане типове значення, "Кінематографічно" — насиченіше й яскравіше.
br-physical-bullets=Перетворює миттєву шкоду від куль гвинтівки на видимі фізичні снаряди-трасери.
br-bullet-glow=Додає фізичним кулям невелике тепле світіння/трасер.
br-bullet-inaccuracy=Що більше значення, то сильніше фізичні кулі відхиляються. Типове значення налаштоване на видиму стрілянину, не роблячи турелі марними.
br-bullet-range=Максимальна дальність згенерованих фізичних куль.
br-bullet-speed=Початкова швидкість згенерованих фізичних куль. Більші значення — різкіше; менші — трасери помітніші.
br-gun-autoaim=Гвинтівки гравця автоматично наводяться на ворогів, а не стріляють лише в заданому напрямку.
br-bullet-magazine-size=Розмір магазину для кульових набоїв, змінених цим модом.
br-bullet-smoke-trails=Додає ледь помітні димні смуги за згенерованими кулями.
br-impact-fx=Додає невеликі хмарки/іскри від влучань згенерованих куль, дробу та інших налаштованих снарядів, де це безпечно.
br-enemy-hit-fx=Додає влучанням снарядів ефект бризок плоті, щоб було відчутно, що жуки отримують шкоду.
br-structure-hit-fx=Додає уламки/дим від влучань у стіни, будівлі та інші тверді цілі.
br-ground-impact-dust=Додає хмарки пилу від влучань, щоб промахи й потужні влучання відчувалися фізичніше.
br-spitter-impact-fx=Додає бризки кислоти/дим від влучань перетворених снарядів плювак.
br-impact-layering=Визначає, скільки додаткових шарів диму/пилу додається до влучань. "Чисто" — легше, "Збалансовано" — рекомендовано, "Повністю" — насиченіше.
br-big-fight-fx-cap=Обмежує додаткові шари диму від влучань куль/дробу. Менші значення — чистіша картинка у великих боях турелей.
br-ammo-identity-tracers=Надає трасерам різні кольори: звичайні набої — жовті, бронебійні — червоно-помаранчеві, уранові — зелені.
br-tracer-style=Визначає помітність згенерованих трасерів. "Покращений" — рекомендоване типове значення, "Реалістичний" — тьмяніший і тонший, "Аркадний" — яскравіший і ігровіший.
br-tracer-scale=Масштабує тіло трасера. Типове значення налаштоване на читабельні нічні бої, без ефекту лазера.
br-tracer-glow-strength=Масштабує світло й ореол трасерів. Типове значення залишає їх помітними, але менш схожими на промені.
br-tracer-smoke-realism=У реалістичному режимі використовує легший дим трасерів, щоб кулі виглядали як розпечені смуги, а не димові промені.
br-shotgun-rework=Покращує поведінку дробу, дальність, відчуття зіткнень і темп стрільби дробовика.
br-shotgun-autoaim=Дробовики гравця автоматично наводяться на ворогів. Утримуйте звичайні клавіші примусової стрільби для ручного режиму.
br-shotgun-dynamic-spread=Розкид дробовика вужчий біля курсора й ширший на відстані.
br-shotgun-magazine-size=Розмір магазину для набоїв дробовика, змінених цим модом.
br-shotgun-range=Максимальна дальність налаштованого дробу.
br-shotgun-fire-rate=Множник швидкострільності дробовика після переробки. 1.0 — задумане типове значення.
br-shotgun-pellet-smoke=Додає дробу ледь помітний дим для відчуття потужності зблизька.
br-physical-rockets=Ракети поводяться радше як випущені боєприпаси, а не як самонавідні.
br-rocket-speed=Початкова швидкість фізичних ракет.
br-rocket-wobble=Відхилення напрямку/дальності фізичних ракет. Більші значення роблять ракети менш ідеально точними.
br-rocket-smoke-trails=Додає сумісним ракетам додатковий димний слід.
br-heavy-impact-fx=Додає ракетам, гарматним снарядам і боєприпасам, що летять дугою, потужніші ефекти диму/вибуху, де це безпечно.
br-arcing-throwables=Гранати й метальні капсули летять помітною дугою.
br-arcing-cannon-shells=Гарматні снаряди летять важчою помітною дугою.
br-cannon-smoke-trails=Додає димні сліди гарматним снарядам.
br-arcing-atomic-bomb=Атомні бомби летять повільнішою помітною дугою.
br-walls-block-spitters=Перетворює струмені плювак на фізичні снаряди, що можуть зіткнутися зі стінами й об'єктами.
br-turret-leading=Додає упередження снарядів для ванільних і сумісних модифікованих кулеметних турелей.
br-turret-ammo-buffer=Мінімальний розмір інвентарю набоїв кулеметних турелей. Більше значення зменшує короткі сповіщення про брак набоїв, поки маніпулятори поповнюють турелі під час важких боїв. Встановіть 1 для ванільного запасу.

