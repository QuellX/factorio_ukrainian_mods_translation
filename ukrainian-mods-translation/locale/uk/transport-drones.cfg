dispatcher-desc=Покладіть дрони в сині комірки. Диспетчер відправляє їх у депо, яким потрібно більше, і збирає надлишок. Червоні комірки зарезервовано для дронів, що повертаються, і вони відправляються першими.
central-dispatch-label=Централізоване відправлення
central-dispatch-tooltip=Якщо ввімкнено, диспетчер відправляє власні дрони забирати предмети з депо пасивного/активного постачання й доставляти їх у депо запиту/буферні/зберігання, яким вони потрібні. Депо зберігання наповнюється лише з депо активного постачання; депо пасивного постачання ніколи не спорожнюється в депо зберігання.
central-dispatch-slider-label=Розподіл дронів:
central-dispatch-slider-tooltip=Максимальний відсоток дронів диспетчера (в інвентарі й у рейсах разом), які можуть одночасно бути на централізованих доставках.
configure-requests-label=Налаштувати запити
configure-requests-tooltip=Відкрити список запитів цього депо — рідний редактор запитів Factorio. Умова ввімкнення/вимкнення й режим роботи логічної мережі — в тому самому вікні.
configure-requests-machine-tooltip=Відкрити власне вікно цього депо, позаду бака: рецепт, що називає запитувану рідину, і умову ввімкнення/вимкнення. Бак перед ним і містить рідину.
storage-limit-label=Макс. зберігання:
storage-limit-tooltip=Обмежує загальну кількість предметів, яку запитує це депо, незалежно від кількості дронів. Залиште порожнім для типової поведінки (кількість дронів × місткість). Також можна задати записувачем логічної мережі.
request-limit-label=Ліміт запиту:
request-limit-tooltip=Обмежує, скільки рідини запитує це депо. Залиште порожнім для типової поведінки (повна місткість бака чи ящика). Також можна задати записувачем логічної мережі.
payload-override-label=Вантаж:
payload-override-tooltip=Скільки один дрон забирає за рейс. Залиште порожнім для автоматичної кількості, показаної сірим: один стос плюс те, що додали дослідження транспортної місткості. Число тут може лише зменшити її — як перевизначення розміру захвату маніпулятора; введіть базовий розмір стосу, щоб дрони повністю ігнорували дослідження.
payload-override-tooltip-push=Скільки один дрон везе за одне проштовхування. Залиште порожнім, щоб надсилати вантаж, якого хоче депо призначення. Число тут може лише зменшити його, тож кожне проштовхування з цього депо — не більше цієї кількості.
payload-override-auto-tooltip=Автоматичний вантаж: один стос, помножений на бонус транспортної місткості. Перевизначення вантажу не може перевищувати це значення.
full-loads-only-label=Лише повні вантажі
full-loads-only-tooltip=Якщо ввімкнено, дрон відправляється, лише коли може забрати цілий вантаж і в депо є місце для всього. Запобігає дрібним частковим доставкам.
full-loads-only-tooltip-push=Якщо ввімкнено, це депо проштовхує вантаж, лише коли має цілий вантаж для рейсу. Запобігає дрібним частковим проштовхуванням; тайм-аут мінімального вантажу цього не скасовує.
transfer-to-depot-label=Перенести предмети:
transfer-to-depot-tooltip=Перенести відповідні предмети з вашого інвентарю у вихід цього депо.
transfer-all-to-depot=Усі
transfer-all-to-depot-tooltip=Перенести всі відповідні предмети з вашого інвентарю в це депо.
transfer-stack-to-depot=×1
transfer-stack-to-depot-tooltip=Перенести один стос відповідних предметів з вашого інвентарю в це депо.
quality-label=Якість:
quality-tooltip=Виберіть якість предметів, що запитуються з дорожньої мережі.
channel-label=Канал:
channel-tooltip=Бітова маска каналу для розділення мережі. Депо взаємодіють, лише якщо їхні канали мають хоча б один спільний біт (побітове І ≠ 0).\n\n-1 = усі канали (типово)\n1, 2, 4, 8... = окремі канали\n3 = канали 1 + 2\n\nЩоб ізолювати групу депо, переведіть усі депо цієї групи з типового (-1) на спільні ненульові біти — навіть одне депо на -1 лишається досяжним для всіх.\n\n0 повністю вимикає депо: воно не збігається ні з чим, навіть з іншими депо на типовому каналі.\n\nСхоже на ідентифікатори мережі LTN.
channel-status-default=Відкрите для: усіх депо (типово)
channel-status-isolated=Ізольоване: не збігається з жодним депо, навіть з іншими на типовому каналі
channel-status-channels=Канали: __1__
allow-central-dispatch-label=Дозволити централізоване відправлення
allow-central-dispatch-tooltip=Якщо ввімкнено, диспетчер дронів може взаємодіяти з цим депо — забирати предмети з депо пасивного/активного постачання чи доставляти предмети в депо запиту/буферні/зберігання (депо зберігання наповнюється лише з депо активного постачання). Вимкніть, щоб виключити це депо з централізованого відправлення, зберігши його власні операції з дронами.
storage-filter-label=Фільтр зберігання:
storage-filter-tooltip=Необов'язково. Без фільтра це депо приймає все, що в нього проштовхує депо активного постачання. Виберіть предмет чи рідину, щоб закріпити його за одним типом.
map-button-tooltip=Клацніть, щоб наблизити це депо
drones-active-available-tooltip=Активні дрони доставляють предмети. Вільні дрони простоюють і готові до відправлення.
drone-bar-tooltip=Вільно __1__%
dispatcher-user-bar-tooltip=Вхідні комірки: __1__ / __2__
dispatcher-return-bar-tooltip=Комірки повернення: __1__ / __2__
priority-slider-tooltip=Пріоритет (0–100). Вищі значення переважають під час вибору постачання.\nМожна перевизначити сигналом логічної мережі [virtual-signal=signal-P].
priority-override-tooltip=Перевизначено сигналом логічної мережі [virtual-signal=signal-P]
channel-override-tooltip=Перевизначено сигналом логічної мережі [virtual-signal=signal-C]
storage-limit-override-tooltip=Перевизначено записувачем логічної мережі або ручним лімітом зберігання
storage-limit-cap-tooltip=Фактична фізична місткість депо (комірки дронів × розмір стосу або ліміт виходу рідини для рідинних депо). Значення «Макс. зберігання», більше за це, автоматично обмежується — воно не може перевищити те, що депо фізично вміщує.
request-limit-cap-tooltip=Фактична фізична місткість депо (місткість рідини бака чи ящика). Значення «Ліміт запиту», більше за це, автоматично обмежується — воно не може перевищити те, що депо фізично вміщує.
filter-label-tooltip=Фільтрувати всі вкладки за певним сигналом предмета чи рідини
network-dropdown-tooltip=Виберіть дорожню мережу для показу
surface-dropdown-tooltip=Виберіть планету чи поверхню для перегляду
drone-open-inventory-tooltip=Відкрити скриню дронів, щоб керувати транспортними дронами
drone-back-to-depot-tooltip=Повернутися до батьківського депо
priority-signal-chooser-tooltip=Віртуальний сигнал, що зчитується з дротів для перевизначення пріоритету
channel-signal-tooltip=Сигнал [virtual-signal=signal-C] на дротах перевизначає канал
writer-use-as-limit=Значення сигналу як макс. кількість предметів
writer-use-as-limit-tooltip=Використовує найбільше значення сигналу предмета/рідини з дроту як ліміт зберігання цього депо. Обмежено макс. кількістю комірок дронів × місткість.
writer-set-recipe=Примусовий рецепт із сигналу
writer-set-recipe-tooltip=Примусово задає рецепт депо за першим сигналом предмета/рідини на дроті.
writer-no-signal=Немає сигналу на дроті
writer-condition-label=Умова ввімкнення/вимкнення:
writer-condition-tooltip=Депо ввімкнене, коли ця умова виконується. Очистьте сигнал, щоб вимкнути керування логічною мережею.
configure-condition-label=Умова ввімкнення/вимкнення
configure-condition-tooltip=Відкрити умову ввімкнення/вимкнення цього депо
writer-depot-disabled=Вимкнено логічною мережею
writer-rhs-switch-signal=Порівнювати із сигналом
writer-rhs-switch-constant=Порівнювати з константою
writer-condition-value=Поточне значення
depot-status-enabled=Увімкнено — умову записувача виконано
depot-status-disabled=Вимкнено — умову записувача не виконано
reader-extra-signals=Додаткові сигнали
reader-show-drones=Кількість дронів
reader-show-active=Активні дрони
reader-show-fuel=Доступне паливо
reader-show-returning=Стоси, що повертаються

[item-description]
transport-drone=Перевозить предмети між депо дорожньою мережею.\n[font=default-bold]Бонуси якості:[/font]\n  Швидкість: +15% незвичайна, +30% рідкісна, +50% епічна, +80% легендарна.\n  Економія палива: 10% незвичайна, 20% рідкісна, 30% епічна, 45% легендарна.

[entity-description]
request-depot=[color=orange]Замінено депо запиту й рідинним депо запиту.[/color] Його більше не можна виготовити, і його буде прибрано в одному з наступних випусків. Наявні перетворено автоматично; розмістіть запасне — і воно стане відповідним новим депо.\nВідправляє дрони забирати предмети з депо пасивного постачання в дорожній мережі.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
supply-depot=Робить свій інвентар доступним для дорожньої мережі.\n[font=default-bold]Якість:[/font] інвентар: 80/100/125/175/250 комірок.
supply-depot-chest=Робить свій інвентар доступним для дорожньої мережі.\n[font=default-bold]Якість:[/font] інвентар: 80/100/125/175/250 комірок.
buffer-depot=[color=orange]Замінено буферним депо й рідинним буферним депо.[/color] Його більше не можна виготовити, і його буде прибрано в одному з наступних випусків. Наявні перетворено автоматично; розмістіть запасне — і воно стане відповідним новим депо.\nДіє і як депо запиту, і як постачальник.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
request-depot-item=Відправляє дрони забирати предмети з депо пасивного постачання в дорожній мережі. Запитує лише предмети; для рідини збудуйте рідинне депо запиту.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
request-depot-fluid=Відправляє дрони забирати рідину з дорожньої мережі й тримає її в баку, звідки її беруть труби. Запитує лише рідини; для предмета збудуйте депо запиту.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
buffer-depot-item=Діє і як депо запиту, і як постачальник. Запитує лише предмети; для рідини збудуйте рідинне буферне депо.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
buffer-depot-fluid=Діє і як депо запиту, і як постачальник рідини, тримаючи її в баку, звідки її беруть труби. Запитує лише рідини; для предмета збудуйте буферне депо.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
fuel-depot=Доставляє паливо іншим депо в дорожній мережі.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
active-depot=Активно проштовхує будь-які предмети зі свого інвентарю в депо запиту дорожньої мережі. Рецепт не потрібен — подавайте предмети конвеєрами чи маніпуляторами. Проштовхує лише предмети; для рідини збудуйте рідинне депо активного постачання.\n[font=default-bold]Якість:[/font] інвентар: 80/100/125/175/250 комірок. Комірки дронів: 5/6/7/8/10.
active-depot-fluid=Активно проштовхує рідину, подану в нього трубами, в депо дорожньої мережі, яким вона потрібна. Проштовхує лише рідини; для предмета збудуйте депо активного постачання.\n[font=default-bold]Якість:[/font] комірки дронів: 5/6/7/8/10.
active-depot-chest=Внутрішнє сховище депо активного постачання. Предмети, вкладені сюди, автоматично проштовхуються в депо запиту.
storage-depot=Пасивний склад дорожньої мережі. Депо активного постачання проштовхують у нього надлишкові предмети — будь-які, якщо фільтр зберігання не закріплює його за одним предметом, — а депо запиту беруть із нього раніше, ніж з будь-якого депо пасивного постачання. Зберігає лише предмети; для рідини збудуйте рідинне депо зберігання.\n[font=default-bold]Якість:[/font] інвентар: 80/100/125/175/250 комірок.
storage-depot-fluid=Пасивний рідинний склад дорожньої мережі: бак, що наповнюється з труби чи з рідинних депо активного постачання, тримає ту рідину, що надійде першою (якщо фільтр зберігання не закріплює іншу), і ділиться нею з усіма під'єднаними трубами в обох напрямках, хоч куди вказують стрілки труб. Зберігає лише рідини; для предмета збудуйте депо зберігання.
storage-depot-chest=Пасивний склад дорожньої мережі. Депо активного постачання проштовхують у нього надлишкові предмети — будь-які, якщо фільтр зберігання не закріплює його за одним предметом, — а депо запиту беруть із нього раніше, ніж з будь-якого депо пасивного постачання.\n[font=default-bold]Якість:[/font] інвентар: 80/100/125/175/250 комірок.
fluid-depot=Робить свій запас рідини доступним для дорожньої мережі. Наповнюється з труби з будь-якого з трьох відкритих боків.
transport-depot-reader=[color=orange]Знято з ужитку — під'єднуйте дріт до самого депо.[/color] Під'єднайте дріт логічної мережі просто до депо, і його власне вікно матиме ці налаштування. Цей пристрій більше не можна виготовити чи розмістити.\nВидає вміст депо чи постачання мережі як сигнали логічної мережі. В інтерфейсі можна перемикатися між вмістом депо, повним постачанням мережі чи постачанням мережі без цього депо.
transport-depot-writer=[color=orange]Знято з ужитку — під'єднуйте дріт до самого депо.[/color] Під'єднайте дріт логічної мережі просто до депо, і його власне вікно матиме ці налаштування. Цей пристрій більше не можна виготовити чи розмістити.\nКерує під'єднаним депо за умовами логічної чи логістичної мережі. Також може перевизначати кількість запиту для депо запиту/буферних. Зчитує [virtual-signal=signal-P] з дротів, щоб перевизначити пріоритет депо.
road-network-reader=Зчитує загальну кількість вибраних предметів у всіх депо пасивного постачання дорожньої мережі. Підтримує кілька сигналів одночасно.
road-network-reader-filtered=Зчитує загальне постачання дорожньої мережі без інвентарю під'єднаного депо. Розмістіть поруч із депо пасивного постачання чи буферним. Запобігає петлям зворотного зв'язку логічної мережі.
depot-drone-chest=Зберігає транспортні дрони цього депо. Кількість комірок залежить від якості депо.
buffer-depot-chest-logistic=[color=orange]Знято з ужитку — депо більше не взаємодіють з логістичними роботами.[/color] Залишено лише для перетворення наявних збережень і буде прибрано в одному з наступних випусків.
request-depot-stock-chest=Містить предмети, зібрані дронами цього депо.\n[font=default-bold]Якість:[/font] інвентар: 7/8/10/11/14 комірок.
buffer-depot-stock-chest=Містить предмети, зібрані дронами цього депо, і пропонує їх дорожній мережі.\n[font=default-bold]Якість:[/font] інвентар: 7/8/10/11/14 комірок.
depot-drone-requests=Містить список предметів, які це депо запитує в дорожньої мережі. Логістичні роботи сюди ніколи не доставляють — це сам запит, а не сховище.
depot-enable-condition=Містить умову ввімкнення/вимкнення цього депо. Під'єднайте дріт до депо й задайте умову тут — депо не працює, доки умова не виконана.
drone-dispatcher=Приймає транспортні дрони через маніпулятори. Під'єднується до дорожньої мережі для подальшого розподілу дронів.\n[font=default-bold]Якість:[/font] інвентар: 10/12/14/16/20 комірок.
drone-dispatcher-chest=Приймає транспортні дрони через маніпулятори. Під'єднується до дорожньої мережі для подальшого розподілу дронів.\n[font=default-bold]Якість:[/font] інвентар: 10/12/14/16/20 комірок.

