supply-threshold-retired=[Transport Drones] Поріг постачання прибрано. Депо більше не резервують запас у дорожній мережі, а перевизначення сигналом логічної мережі [virtual-signal=signal-T] більше нічого не робить. Задане вами значення поки що зберігається в збереженні й буде відкинуте в одному з наступних випусків.
multi-pipe-retired=[Transport Drones] Кожне рідинне депо тепер має трубні з'єднання з трьох боків. Дослідження «Багатотрубні з'єднання» й прапорець у кожному депо прибрано, бо вмикати більше нічого. [font=default-bold]Перевірте наявні депо[/font]: труба, що раніше проходила повз лівий чи правий бік депо, не торкаючись його, тепер під'єднається до нього. Поставте помпу між депо й рештою лінії, якщо хочете тримати їх окремо.
cargo-offset-shifted=[Transport Drones] Бічні трубні з'єднання рідинних депо зсунуто на одну клітинку від центру, тож сусідні депо більше не з'єднують труби лоб у лоб. [font=default-bold]Перевірте наявні депо[/font]: трубу, прокладену до бічного з'єднання, може знадобитися зсунути на одну клітинку.
bot-interop-retired=[Transport Drones] Депо більше не взаємодіють з мережею логістичних роботів. Прапорець [font=default-bold]Дозволити логістичних роботів[/font] прибрано, кожне депо, де його було ввімкнено, повернуто до звичайної скрині, а роботи більше не забирають предмети з депо й не поповнюють їх дронами. Дослідження «Транспортна логістика» прибрано разом із ним — дрони й роботи тепер працюють як дві повністю окремі системи. Якщо роботи виносили для вас предмети з депо, дайте їм власну скриню й переносьте предмети маніпуляторами.
request-chest-arrived=[color=orange][Transport Drones][/color] Депо запиту й буферне депо більше не запитують свій предмет [font=default-bold]рецептом[/font]. Відкрийте одне з них і натисніть [font=default-bold]Налаштувати запити[/font], щоб отримати рідний список запитів Factorio з пошуком, якістю й спільними логістичними групами. Наявні запити перенесено автоматично, нічого не втрачено. Окремий випадний список якості прибрано — вибирайте якість у самому рядку запиту. Рідинні версії не змінилися й зберігають вибір рецепта.
depot-combinators-retired=[color=orange][Transport Drones][/color] Зчитувач і записувач депо прибрано. Кожне депо тепер приймає дріт логічної мережі напряму, тож під'єднуйте дріт до самого депо й налаштовуйте все з його власного вікна. Ваші наявні зчитувачі й записувачі прибрано, а їхні дроти перенесено на депо поруч, тож ваші мережі досі досягають тих самих депо й нічого не треба переподключати. Їх більше не можна виготовити чи розмістити, а ті, що лишилися в кресленнях, просто пропускаються.
depot-combinator-networks-merged=[color=orange][Transport Drones][/color] У __1__ ваших депо зчитувач і записувач депо були в [font=default-bold]окремих логічних мережах[/font]. Депо має одне з'єднання дроту, тож ці дві мережі тепер з'єднано на депо — а отже, власні показники депо тепер можуть досягати його власної умови ввімкнення. Перевірте ці депо: __2__
condition-editor-native=[color=orange][Transport Drones][/color] [font=default-bold]Умова ввімкнення/вимкнення[/font] більшості депо тепер задається в рідному вікні логічної мережі Factorio, а не рядком у панелі депо. Для паливного, рідинного, гірничого чи рідинних депо запиту, буферного, активного постачання й зберігання під'єднайте дріт і відкрийте депо — умова у [font=default-bold]власному вікні машини[/font] поруч із панеллю. Для депо запиту чи буферного депо вона у вікні [font=default-bold]Налаштувати запити[/font]. Задані вами умови перенесено у відповідне вікно автоматично. Для депо пасивного постачання, активного постачання, зберігання чи диспетчера дронів вона за кнопкою [font=default-bold]Умова ввімкнення/вимкнення[/font] у власній панелі депо.
legacy-depot-deprecation=[color=orange][Transport Drones][/color] Депо запиту й буферне депо замінено окремими версіями для [font=default-bold]предметів[/font] і [font=default-bold]рідин[/font]. Ваші перетворено автоматично, нічого не втрачено. Старі більше не можна виготовити, і їх буде прибрано в одному з наступних випусків; старі креслення працюватимуть доти, а будь-яке старе депо, яке ви збудуєте, перетвориться на відповідний новий тип під час розміщення.
