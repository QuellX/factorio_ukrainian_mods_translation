[mod-setting-description]
nullius-early-transport-drones=Переносить транспортні дрони з ери робототехніки в еру керування рухом у Nullius.
transport-depot-update-interval=Як часто (у тіках) кожне депо виконує логіку оновлення. Менші значення — швидша реакція, але більша вартість для UPS. Типово: 30 тіків (0,5 секунди).
fuel-fluid=Рідина, що слугує паливом для транспортних дронів. Усі паливні депо мають постачати цю рідину. Мод може заявити власну бажану паливну рідину, яка тоді замінює цей параметр; увімкніть «Використовувати моє налаштування палива замість заявленого модом», щоб зберегти цей параметр.
fuel-fluid-override=Якщо ввімкнено, ваші власні параметри «Паливо транспортних дронів», «Паливо транспортного дрона на один дрон» і «Місткість рідини транспортного дрона» завжди мають перевагу, навіть якщо мод заявив власне бажане паливо. Якщо вимкнено (типово), заява мода, якщо вона є, має перевагу над тими з цих трьох параметрів, які вона заявляє. Потребує перезапуску.
fuel-amount-per-drone=Кількість паливної рідини, що витрачається на одне відправлення дрона. Більші значення збільшують витрату палива на рейс. Мод, що заявляє власне бажане паливо, може заявити й цю кількість, яка тоді замінює цей параметр; увімкніть «Використовувати моє налаштування палива замість заявленого модом», щоб зберегти цей параметр.
drone-fluid-capacity=Максимальна кількість рідини, яку один транспортний дрон везе за рейс доставки, — той самий ліміт і для доставок палива, і для будь-якої рідини, яку запитує депо запиту/рідинне депо. Це НЕ розмір бака депо; див. «Місткість виходу рідини депо запиту» нижче. Мале значення тут означає лише більше рейсів, а не меншу загальну кількість. Мод, що заявляє власне бажане паливо, може заявити й цю місткість, яка тоді замінює цей параметр для кожного рідинного рейсу, паливного чи ні; увімкніть «Використовувати моє налаштування палива замість заявленого модом», щоб зберегти цей параметр.
fluid-depot-capacity=Максимальна місткість сховища рідинних депо. Більша місткість дає змогу відправити більше дронів, перш ніж депо заповниться. Для порівняння: ванільний резервуар вміщує 25 000. Потребує перезапуску.
request-depot-fluid-capacity=Місткість вихідного буфера рідини депо запиту — увесь бак депо, а не вантаж одного дрона. Окремо від «Місткість рідини транспортного дрона» вище, що визначає, скільки один дрон везе за рейс; дрони роблять кілька рейсів, щоб заповнити цей буфер. Збільшення цього значення НЕ прискорює видачу рідини депо — лише дає змогу зберігати більше. Буфер — це резервуар, що спорожнюється в під'єднані труби, як будь-який резервуар, тож більше значення — лише більший буфер, а не повільніший. Залиште типове значення, якщо вам спеціально не потрібен більший буфер. Для порівняння: ванільний резервуар вміщує 25 000. Потребує перезапуску.
fuel-consumption-per-meter=Паливо, що витрачається транспортними дронами на кожен метр. 0 вимикає витрату палива.
drone-pollution-per-second=Забруднення, що викидає кожен активний транспортний дрон за секунду. 0 вимикає забруднення від дронів.
transport-drone-pathfinder-max-steps=Максимум кроків пошуку шляху за тік. Більші значення покращують маршрути дронів, але коштують UPS. Типово у Factorio: 1000.
transport-drone-pathfinder-max-work=Максимум роботи пошуку шляху за тік. Більші значення покращують маршрути дронів, але коштують UPS. Типово у Factorio: 8000.
transport-drone-pathfinder-use-cache=Увімкнути кешування шляхів для глобального пошуку шляху. Вимкніть для точнішого, але дорожчого пошуку шляху. Типово у Factorio: увімкнено.
transport-drone-router=Як планується шлях дрона до депо. Граф (типово): мод сам планує кожен маршрут через перехрестя дороги, вибираючи найшвидший, а не найкоротший шлях, тож швидку дорогу варто прокладати; маршрут, до якого дорога не може приєднатися, переходить на пошук шляху. Рушій: одна команда пошуку шляху на маршрут, як у цьому моді до 2.0.128. Кеш маршрутів (експериментально): мод запам'ятовує кути кожного маршруту, який повертає пошук шляху, і веде наступні дрони ними відрізок за відрізком, забуваючи всі маршрути поверхні, щойно там прокладено чи прибрано клітинку дороги. Можна змінювати будь-коли; дрони, що вже в дорозі, закінчують за тим планом, що в них є.
transport-drone-sound-volume=Гучність звуку двигуна транспортного дрона (0 — тиша, 100 — типово).
transport-drone-appearance=Яку модель має транспортний дрон із відкритим кузовом — той, що везе руду й інший сипкий вантаж. Стосується лише цього дрона; дрони з контейнерами й цистернами поки не мають другої моделі. Bubbles — графіка, з якою мод постачався завжди. MoSII — новіша модель, позначена як бета, бо використовує накладки кольору й вантажу оригіналу: колір вашої фракції й руда в кузові малюються там, де вони були на старому шасі, тож на новому трохи зміщені. Лише зовнішній вигляд — на поведінку дрона не впливає. Потребує перезапуску.
transport-drones-road-tile-whitelist=Шаблони через кому для сторонніх клітинок, що вважаються дорогами для дронів. Прості записи збігаються з назвами предметів (шаблони Lua), записи з @ — з підгрупами предметів. Типово: ^Arci%-,^dect%-concrete%-grid$,@py-tiles. Потребує перезапуску.
transport-drones-road-tile-blacklist=Шаблони через кому для клітинок, що виключаються з доріг для дронів; застосовуються після білого списку й автовизначення (у разі конфлікту перемагає чорний список). Той самий синтаксис, що й у білого списку: прості записи збігаються з назвами предметів (шаблони Lua), записи з @ — з підгрупами предметів. Не може прибрати власні клітинки дороги/швидкої дороги цього моду. Типово: порожньо (нічого не виключено). Потребує перезапуску.
transport-drones-diagonal-check=Якщо ввімкнено, дрони не можуть зрізати діагональні кути між клітинками, що не є дорогою. Не дає дронам зрізати шлях через проміжки. Потребує перезапуску.
transport-drone-load-balance-threshold=Депо пасивного постачання з оцінкою в межах цього порогу від найкращої вважаються рівноцінними, і одне з них вибирається випадково. Розподіляє навантаження між сусідніми депо. 0 — завжди вибирати одне найкраще депо.\n\nПримітка: це фіксований поріг оцінки, а не відсоток. Оцінка поєднує пріоритет і відстань, тож депо з різними пріоритетами матимуть великі розриви в оцінці, що перевищують цей поріг. Балансування найкраще працює, коли депо мають однаковий пріоритет.
transport-drone-item-availability-bonus=Наскільки (у клітинках) депо пасивного постачання, що може виконати все замовлення, переважає те, що не може виконати нічого. Постачальник із половиною замовлення отримує половину бонусу. 0 — вибирати лише за пріоритетом і відстанню; якщо підняти вище за звичайну відстань між вашими депо, повний постачальник перемагатиме, хоч як далеко він є. Типово 50.
transport-drone-priority-weight=Якщо більше 0, замінює абсолютну систему пріоритетів зваженим зміщенням: пріоритет × вага. Тоді пріоритет — м'яка перевага, яку може переважити відстань. 0 — абсолютний пріоритет (типова поведінка).
transport-drone-max-dispatches-per-tick=Максимальна кількість дронів, яку одне депо може відправити за один цикл оновлення. Запобіжник від некерованого відправлення в екстремальних ситуаціях. У звичайній грі природні обмеження (інвентар дронів, паливо) зупиняють відправлення задовго до цієї межі. Збільште для дуже великих мегабаз із сотнями дронів на депо.
transport-drone-redispatch-interval=Як часто (у тіках) депо з невиконаним попитом повторно пробують відправляти дрони між звичайними циклами оновлення. Менші значення — плавніша поява дронів, але трохи більше навантаження на UPS. Типово 10 тіків = 6 спроб відправлення за секунду. 1 — максимальна швидкість реакції.
transport-drones-space-platform-roads=Дозволити розміщувати клітинки дороги на фундаментах космічних платформ. Вимкніть, якщо іншому моду потрібно забороняти розміщувати клітинки на фундаментах космічних платформ. Потребує перезапуску.
active-depot-min-load-percent=Мінімальний вантаж, з яким депо активного постачання відправляє дрон, у відсотках від повної доставки. Нижче цього дрон чекає, доки накопичиться більше предмета, замість майже порожнього рейсу. 0 — відправляти будь-яку кількість одразу (стара поведінка).
active-depot-min-load-timeout=Скільки (у тіках) предмет може бути нижче мінімального вантажу, перш ніж депо активного постачання все одно його відправить. Не дає повільному надходженню предмета чекати вічно. 0 — ніколи не обходити мінімальний вантаж.
request-depot-default-drone-count=Коли депо запиту щойно збудовано, його запит дронів (скільки дронів воно просить у диспетчера) починається з цього значення замість 0, тож не треба відкривати панель кожного нового депо, щоб знову задати те саме число. Наявні депо не змінюються, і це ніколи не перевизначає кількість дронів, уже збережену в кресленні чи відновлену скасуванням/повтором. Автоматично обмежується місткістю комірок дронів нового депо. Типово: 0 (стара поведінка, депо починають без запиту).
transport-depot-default-channel=Канал, з якого починає кожне щойно розміщене депо, замість -1 (усі канали). Наявні депо зберігають свій канал, а депо, збудоване з креслення, скасування чи вставлення, бере канал креслення — креслення, створене до появи цього параметра, будує на -1, як і завжди. 0 ізолює кожне нове депо, доки ви не задасте йому канал. [virtual-signal=signal-C] на дроті все одно його перевизначає. Типово: -1 (стара поведінка, усі канали).
enable-drone-dispatcher=Якщо ввімкнено, будівля диспетчера дронів доступна (відкривається дослідженням «Транспортна система»). Вимкніть, щоб прибрати диспетчери з гри. Потребує перезапуску.
enable-active-depot=Якщо ввімкнено, будівля депо активного постачання доступна (відкривається дослідженням «Активне транспортне постачання»). Вимкніть, щоб прибрати депо активного постачання з гри. Потребує перезапуску.
enable-storage-depot=Якщо ввімкнено, будівля депо зберігання доступна (відкривається дослідженням «Активне транспортне постачання»). Вимкніть, щоб прибрати депо зберігання з гри. Потребує перезапуску.
transport-drone-stack-size=Кількість транспортних дронів у стосі інвентарю. Впливає на те, скільки дронів вміщують інвентарі дронів депо. Потребує перезапуску.
dispatcher-depot-capacity=Максимальна місткість палива депо-диспетчера. Має бути достатньою, щоб вмістити паливо для всіх призначених дронів (кількість дронів × паливо на дрон). Типово: 50 000. Потребує перезапуску.
road-walking-speed-modifier=Множник швидкості ходьби на клітинках дороги. Типово: 1,5, як мод завжди використовував до появи цього параметра. Потребує перезапуску.
fast-road-walking-speed-modifier=Множник швидкості ходьби на клітинках швидкої дороги. Типово: 2, як мод завжди використовував до появи цього параметра. Потребує перезапуску.
road-recipe-yield=Кількість клітинок дороги за одне виготовлення рецепта дороги. Типово: 10, як мод завжди використовував до появи цього параметра. Потребує перезапуску.
fast-road-recipe-yield=Кількість клітинок швидкої дороги за одне виготовлення рецепта швидкої дороги. Типово: 10, як мод завжди використовував до появи цього параметра. Потребує перезапуску.
transport-drones-no-drone-alert=Показувати сповіщення «У депо немає дрона» на екрані й на мапі для кожного депо без дронів. Для кожного гравця: вимкнення ховає сповіщення лише для вас. Типово: увімкнено.
transport-drones-log-level=Скільки діагностичних подробиць мод виводить у ваш чат. Для кожного гравця. «Налагодження» пояснює, чому депо не відправляє дрони. Типово: вимкнено.
transport-drones-log-file-level=Скільки діагностичних подробиць мод записує в factorio-current.log. Діє на всю гру. Типово: попередження.

