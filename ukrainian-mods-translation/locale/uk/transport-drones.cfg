fuel-fluid-changed-warning=Паливо транспортних дронів змінилося з «__1__» на «__2__». Кожне депо в цьому збереженні досі містить «__1__», і його більше ніщо не поповнює — депо бачать порожнє паливо й перестають відправляти дрони. Поверніть параметр «Паливо транспортних дронів» на «__1__», щоб їх відновити.
