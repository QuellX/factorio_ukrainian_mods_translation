[transport_drones_pages]
welcome-1=Ласкаво просимо до Transport Drones!\nTransport Drones — мод, що додає новий спосіб переміщувати матеріали фабрикою.
fuel-depot-1=Усе перевезення в дорожній мережі потребує палива. Паливо доставляють [font=default-bold]паливні депо[/font].\n\nПрацює все просто:\n - Розмістіть паливне депо в дорожній мережі.\n - Підведіть паливо трубами.\n - Додайте транспортні дрони.\n\nТепер паливне депо відправлятиме транспортні дрони до депо в дорожній мережі.
drones-1=[font=default-bold]Транспортні дрони[/font] — виконавці, що перевозять матеріали між депо. Кожен завжди закріплений лише за одним депо. Для роботи їм потрібне паливо, і під час руху вони забруднюють.
request-depot-1=Щоб переміщувати предмети в дорожній мережі, використовуйте [font=default-bold]депо запиту[/font]. Вони відправлятимуть дрони до найближчого депо пасивного постачання із запитаним предметом.\nКількість предметів, яку збирає депо запиту, залежить від кількості дронів у ньому. За кожен дрон депо запиту збільшує запитану кількість на місткість дрона.\n\n    Приклад 1: якщо дрони вміщують 1 стос (без вдосконалень), а ви поклали 5 дронів, депо запиту відправлятиме дрони, доки в його інвентарі не буде 5 стосів.\n    Приклад 2: якщо дрони вміщують 2 стоси (1 вдосконалення місткості), а ви поклали 10 дронів, депо запиту відправлятиме дрони, доки в його інвентарі не буде 20 стосів.\n\nТак можна налаштовувати запитувану кількість з урахуванням потрібної пропускної здатності, відстані між депо запиту й пасивного постачання тощо. Кількість запиту можна перевизначити записувачами транспортного депо.\n\nДодаткові елементи на панелі пріоритету:\n - [font=default-bold]Макс. зберігання[/font]: обмежує загальну кількість предметів, яку запитує депо, незалежно від кількості дронів.\n - [font=default-bold]Вантаж[/font]: скільки один дрон забирає за рейс. Порожньо — автоматична кількість (один стос, помножений на бонус дослідження місткості); число може лише зменшити її. Введіть базовий розмір стосу, щоб повністю ігнорувати дослідження.\n - [font=default-bold]Лише повні вантажі[/font]: дрони відправляються, лише коли можуть забрати цілий вантаж, що запобігає дрібним частковим доставкам.\n\nНалаштувати депо запиту просто:\n - Розмістіть депо запиту в дорожній мережі.\n - Виберіть предмет для запиту.\n - Покладіть транспортні дрони.\nДепо запиту спершу запитає з мережі паливо. Щойно воно матиме паливо, почне відправляти дрони по запитаний предмет.
supply-depot=[font=default-bold]Депо пасивного постачання[/font] (і рідинні депо) — пасивні учасники дорожньої мережі. Вони роблять свій вміст доступним для депо запиту в дорожній мережі.
road-network=[font=default-bold]Дорожня мережа[/font] — система, у якій депо з'єднані між собою, і дорога, якою їздять транспортні дрони. Дорожню мережу будують просто клітинками дороги. Усі з'єднані клітинки дороги — частина однієї дорожньої мережі. Дві роз'єднані ділянки дороги — окремі дорожні мережі, і їхні депо не постачають одне одному.
buffer-depot=[font=default-bold]Буферне депо[/font] діє і як депо запиту, і як депо пасивного постачання.\n\nХороший приклад використання — збирати руду з далеких аванпостів для розподілу між багатьма сусідніми депо запиту. Буферне депо може мати багато дронів, а сусіднім депо запиту потрібно лише 1–2 дрони на короткий рейс до буфера.
circuit-connectors=Дроти логічної мережі дають змогу зчитувати дані з депо й дорожньої мережі та записувати їх, тож логістичні умови й логіка логічної мережі можуть керувати їхньою поведінкою. Під'єднайте дріт просто до депо — див. [font=default-bold]Під'єднання дроту до депо[/font]. [font=default-bold]Зчитувач дорожньої мережі[/font] — окрема будівля для зчитування мережі в цілому.
wire-a-depot=Кожне депо приймає дріт логічної мережі напряму — комбінатор будувати не треба. Під'єднайте червоний чи зелений дріт до депо й відкрийте його вікно.\n\n[font=default-bold]Зчитування дроту.[/font] [virtual-signal=signal-P] задає пріоритет депо, а [virtual-signal=signal-C] — його канал. [font=default-bold]Умова ввімкнення[/font] вмикає й вимикає депо: вимкнене депо запиту перестає відправляти дрони, а вимкнене депо пасивного постачання перестає пропонувати свої предмети мережі. Депо запиту чи буферне депо також може брати запитуваний предмет і його кількість просто з дроту.\n\n[font=default-bold]Запис на дріт.[/font] Розділ показників у вікні депо визначає, що депо видає назад на той самий дріт: власний вміст, підсумки мережі чи додаткові сигнали кількості дронів, палива, місткості й розмірів стосів. Обидва кольори дротів зчитуються й записуються разом.\n\n[font=default-bold]Куди під'єднується дріт.[/font] У депо пасивного постачання, активного постачання, зберігання чи диспетчера дронів ваш дріт під'єднується до прихованої скрині всередині будівлі — саме її вибирає курсор. Ця скриня вже повідомляє свій вміст, тож депо не надсилає його вдруге.\n\nОдне з'єднання дроту — одна мережа: те, що депо видає на дріт, може досягати його власної умови ввімкнення. Якщо вам цього не треба, тримайте зчитування й умову на різних депо.
transport-depots=Транспортні депо — об'єкти дорожньої мережі, що координують перевезення предметів і рідин. Вони керують вмістом і запитами дорожніх мереж. До дорожньої мережі вони під'єднуються через попереджувальну плиту на землі, і саме звідти й туди відправляються дрони.
network-reader=[font=default-bold]Зчитувач дорожньої мережі[/font] може зчитувати вміст дорожньої мережі, до якої під'єднаний. Відкрийте зчитувач і задайте в його комірках один чи кілька сигналів предметів/рідин. Зчитувач постійно оновлюватиме кожен сигнал загальною кількістю цього предмета в усіх депо пасивного постачання мережі.\n\nМожна стежити за кількома сигналами одночасно — кожна комірка відстежує свій предмет незалежно.\n\nТак можна, наприклад, вмикати чи вимикати певні виробничі лінії, якщо кількість руди в дорожній мережі падає нижче певного значення, або вмикати резервне сховище.
filtered-reader=[font=default-bold]Зчитувач дорожньої мережі (без депо)[/font] працює як звичайний зчитувач дорожньої мережі, але не враховує інвентар під'єднаного депо в підсумках.\n\nЦе запобігає петлям зворотного зв'язку, коли постачання мережі керує депо пасивного постачання. Наприклад, якщо треба вимикати депо пасивного постачання, коли в мережі досить предметів, використовуйте цей зчитувач, щоб не враховувати власні предмети депо.\n\nРозмістіть його поруч із депо (як зчитувач/записувач депо), спрямувавши до депо.
