[technology-description]
autodriving=Керуйте машинами віддалено!\nТри натискання «Q» поспіль з порожньою рукою автоматично кладуть пульт у курсор.
autodriving-effect=Відкриває ярлик пульта Autodrive.
autodriving-enemy-tech=Машина виявлятиме й обстрілюватиме ворогів поблизу в межах дальності своєї зброї.\n\n[font=default-semibold]Можливості:[/font]\n  • Сканує область навколо машини й автоматично атакує цілі бортовою зброєю.\n  • Налаштовувані фільтри цілей: гнучкий пріоритет 5 категорій (бази, черв'яки, юніти ближнього/дальнього бою, інше), вогонь по курсору й окремі фільтри зброї.\n  • Щоб узяти керування на себе, натисніть клавішу примусової стрільби (модуль передає керування, поки ви стріляєте, + 3 с).
autodriving-cleaver-tech=Дає машинам змогу під час руху автоматично прокладати шлях крізь дерева й каміння лазерними захисними модулями в сітці обладнання.
autodriving-fuel-tech=Машина заправлятиметься зі свого багажника.
autodriving-ammo-tech=Машина перезаряджатиме боєприпаси зі свого багажника.
autodriving-logistic-tech=Машина взаємодіятиме з логістичною мережею, коли запаркована. Комірки багажника з фільтрами поповнюються, як скриня запиту, а комірки без фільтрів вивантажуються, як скриня активного постачання.
autodriving-circuit-tech=Машина взаємодіятиме з логічною мережею через канал Shortwave. Пов'яжіть машину з радіо, вибравши обидва пультом, а тоді відправляйте її в нову позицію сигналами X і Y через радіо!
autodriving-follow-tech=Машина слідуватиме за гравцем.
autodriving-repair-tech=Оснащує машини бортовим ремонтним ботом, що працює від енергії сітки й ремонтних пакетів у багажнику.
autodriving-small-repair-tech=Компактний пасивний ремонтний бот для сітки обладнання машини.
autodriving-legacy-repair-tech=Модуль ремонтного пакета, рівень __1__.

