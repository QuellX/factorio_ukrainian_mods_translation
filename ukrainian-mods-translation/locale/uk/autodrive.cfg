[item-description]
autodrive-control=ЛКМ: вибрати машини (клацанням чи рамкою). ПКМ: відправити вибрані машини в точку.\nТри натискання «Q» поспіль з порожньою рукою автоматично кладуть пульт у курсор.

[factoriopedia-description]
autodrive-control=Керування:\n• [font=default-semibold]ЛКМ[/font] — вибір (клацанням чи рамкою).\n• [font=default-semibold]ПКМ[/font] — відправити.\n• [font=default-semibold]Shift + ПКМ[/font] — додати точку маршруту в чергу.\n• [font=default-semibold]Ctrl + Shift + ПКМ[/font] — зациклити маршрут у патрулювання.\n\nГаряча клавіша:\n• Три натискання [font=default-semibold]«Q»[/font] поспіль з порожньою рукою миттєво беруть пульт.

[equipment-description]
autodrive-ammo-sensor=Машина перезаряджатиме боєприпаси зі свого багажника.
autodrive-circuit-sensor=Машина взаємодіятиме з логічною мережею через канал Shortwave. Виберіть радіопультом машину й радіо, щоб пов'язати їх!\nПідказка: сигнали X і Y відправляють машину в задану позицію!
autodrive-enemy-sensor=Машина виявлятиме й обстрілюватиме ворогів поблизу в межах дальності своєї зброї.\n\n[font=default-semibold]Можливості:[/font]\n  • Сканує область навколо машини й автоматично атакує цілі бортовою зброєю.\n  • Налаштовувані фільтри цілей: гнучкий пріоритет 5 категорій (бази, черв'яки, юніти ближнього/дальнього бою, інше), вогонь по курсору й окремі фільтри зброї.\n  • Щоб узяти керування на себе, натисніть клавішу стрільби (Пробіл чи C) — модуль одразу передає керування, поки ви стріляєте, + 3 с.
autodrive-cleaver-sensor=Машина виявляє дерева й каміння на своєму шляху й автоматично знищує їх лазерними захисними модулями у своїй сітці обладнання.
autodrive-follow-sensor=Машина слідуватиме за гравцем, який увімкнув режим слідування в інтерфейсі.
autodrive-fuel-sensor=Машина заправлятиметься зі свого багажника.
autodrive-logistic-sensor=Машина взаємодіятиме з логістичною мережею, коли запаркована. Комірки багажника з фільтрами поповнюються, як скриня запиту, а комірки без фільтрів вивантажуються, як скриня активного постачання.
autodrive-repair-sensor=Бортовий ремонтний бот машини (2×2). Ремонтує машину ремонтними пакетами з багажника коштом енергії сітки.\nСпоживання енергії: 10 кДж за ОЗ (половина від енергощитів через витрату ремонтних пакетів). Ефекти кількох модулів сумуються.\nШвидкість ремонту машини залежить від швидкості ремонтного пакета й робочої швидкості бота.\n[font=default-semibold]Робоча швидкість бота (залежить від якості):[/font]\n  • [color=220,220,220]Звичайна:[/color] 10,0% швидкості інструмента (~12,0 ОЗ/с з базовим пакетом)\n  • [color=130,220,100]Незвичайна:[/color] 13,0% (~15,6 ОЗ/с)\n  • [color=100,180,255]Рідкісна:[/color] 16,0% (~19,2 ОЗ/с)\n  • [color=220,130,255]Епічна:[/color] 19,0% (~22,8 ОЗ/с)\n  • [color=255,180,60]Легендарна:[/color] 25,0% (~30,0 ОЗ/с)
autodrive-small-repair-sensor=Компактний ремонтний бот машини (1×1). Ремонтує машину ремонтними пакетами з багажника коштом енергії сітки.\nСпоживання енергії: 10 кДж за ОЗ (половина від енергощитів через витрату ремонтних пакетів). Сумується без обмежень.\nШвидкість ремонту машини залежить від швидкості ремонтного пакета й робочої швидкості бота.\n[font=default-semibold]Робоча швидкість бота (залежить від якості):[/font]\n  • [color=220,220,220]Звичайна:[/color] 2,0% швидкості інструмента (~2,4 ОЗ/с з базовим пакетом)\n  • [color=130,220,100]Незвичайна:[/color] 2,6% (~3,1 ОЗ/с)\n  • [color=100,180,255]Рідкісна:[/color] 3,2% (~3,8 ОЗ/с)\n  • [color=220,130,255]Епічна:[/color] 3,8% (~4,6 ОЗ/с)\n  • [color=255,180,60]Легендарна:[/color] 5,0% (~6,0 ОЗ/с)
autodrive-thought-sensor=Показує думки ШІ й поточний стан колом-контуром на землі:\n• Темно-синій: їде маршрутом автопілота.\n• Світло-зелений: обчислення шляху й пошук маршруту.\n• Червоний: шлях не знайдено / ціль заблоковано.\n• Помаранчевий: вибирається з застрягання й обходить перешкоди.\n• Фіолетовий: чекає в черзі на відправлення колони.\n• Блакитний: очікування / готовий до наказів.\n• Обертовий приціл під машиною: жовтий — стеження за ціллю, червоний — ціль захоплено в зоні вогню.
autodrive-legacy-repair-sensor=Модуль ремонтного пакета, рівень __1__.

