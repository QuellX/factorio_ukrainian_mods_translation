[mod-setting-description]
autodrive-render-names=Вмикає чи вимикає показ власних назв над машинами.
autodrive-render-color=Колір тексту власних назв над машинами.
autodrive-follow-proximity=Відстань від гравця (у клітинках), у межах якої для машин супроводу не визначається застрягання.\nТипово: 20
autodrive-vehicle-max-speed=Максимальна швидкість (у км/год) окремих автономних машин під керуванням автопілота. Задає абсолютну межу швидкості незалежно від потужності двигуна чи типу палива.\nТипово: 150 км/год
autodrive-convoy-max-speed=Максимальна крейсерська швидкість (у км/год) машин, що рухаються організованою колоною. Зберігає безпечні інтервали в шикуванні й проходження поворотів.\nТипово: 150 км/год
autodrive-convoy-distance=Мінімальна відстань до цілі (у клітинках), за якої група наземних машин переходить у режим організованої колони. Типово: 100.
autodrive-convoy-min-vehicles=Мінімальна кількість наземних машин у групі для режиму колони. Типово: 2.
autodrive-formation-spacing-mult=Чистий проміжок між машинами в довжинах корпусу (0 — впритул, 1 — проміжок в одну довжину корпусу). Типово: 1,0.
autodrive-formation-spacing-padding=Додатковий фіксований запас у клітинках між машинами понад проміжок корпусу. Типово: 1,0.
autodrive-repair-energy-per-hp=Енергія, що витрачається на ремонт 1 ОЗ (типово 10 кДж — рівно половина від особистих енергощитів з урахуванням витрати міцності ремонтних пакетів).
autodrive-path-show=Вмикає чи вимикає показ ліній маршруту автопілота на землі й на мапі.
autodrive-patrol-path-show=Вмикає чи вимикає показ ліній циклічних маршрутів патрулювання.
autodrive-path-line-width=Товщина (у пікселях) ліній маршруту автопілота. Типово: 5,0
autodrive-path-dash-length=Довжина окремих штрихів у лініях маршруту автопілота. Типово: 0,5
autodrive-path-gap-length=Відстань між штрихами в лініях маршруту автопілота. Типово: 4,0
autodrive-visual-show-status-ring=Вмикає кільце-контур на землі під машиною, що показує поточний стан ШІ.
autodrive-visual-show-stuck-arcs=Вмикає обертові помаранчеві дуги навколо корпусу машини під час маневрів виходу із застрягання.
autodrive-visual-show-combat-crosshair=Вмикає тактичний бойовий приціл під машиною під час сканування сектора й активної стрільби.
autodrive-visual-show-scanner-safe=Показує схвалені вільні точки-кандидати під час сканування для порятунку машини.
autodrive-visual-show-scanner-blocked=Показує заблоковані/небезпечні точки-кандидати (перешкоди, вода, лава, машини).
autodrive-visual-show-scanner-target=Показує вибране кільце цілі втечі й лінію вектора тяжіння.
autodrive-path-color=Колір і прозорість стандартних ліній маршруту автопілота. Типово: тактичний зелений
autodrive-patrol-path-color=Колір і прозорість ліній циклічних маршрутів патрулювання. Типово: тактичний фіолетовий
autodrive-visual-stuck-arcs-color=Колір обертових дуг під час маневрів виходу із застрягання.
autodrive-visual-combat-crosshair-color=Колір тактичного бойового прицілу під машиною.
autodrive-visual-scanner-safe-color=Колір вільних точок-кандидатів, оцінених сканером оточення.
autodrive-visual-scanner-blocked-color=Колір заблокованих точок-кандидатів, оцінених сканером оточення.
autodrive-visual-scanner-target-color=Колір вибраної вільної точки порятунку й вектора тяжіння.
autodrive-visual-order-reticle-color=Колір і прозорість тактичних позначок-дужок у точках призначення під час наказів машинам. Типово: приглушений зелений
autodrive-enable-compress-ground=Вмикає обробку й згладжування маршрутів для колісних/гусеничних наземних машин. Якщо вимкнено, машини їдуть сирим нестиснутим маршрутом рушія Factorio на C++. Типово: вимкнено
autodrive-enable-compress-water=Вмикає безпечне для води стиснення маршрутів для човнів і кораблів. Типово: вимкнено
autodrive-enable-compress-amphibious=Вмикає стиснення маршрутів амфібій для ховеркрафтів, що перетинають і сушу, і воду. Типово: вимкнено
autodrive-enable-obstacle-repulsion=Векторне поле відштовхування, що м'яко зсуває точки маршруту від берегів, скель і перешкод на відкриту місцевість. Типово: вимкнено
autodrive-enable-corner-rounding=Згладжує різкі повороти в плавні дуги точок маршруту, запобігаючи заносам і розворотам на місці. Типово: вимкнено
autodrive-enable-segment-subdivision=Ділить довгі відрізки маршруту на частини по ~5 клітинок, щоб лінії маршруту плавно зникали позаду машин. Типово: увімкнено
autodrive-enable-string-pulling=Спрямляє зигзаги точок маршруту по прямих лініях видимості, зберігаючи запас безпеки. Типово: вимкнено
autodrive-enable-collinear-reduction=Прибирає зайві колінеарні точки на прямих ділянках. Типово: вимкнено
autodrive-enable-legacy-repair=Вмикає 3 рівні класичних модулів ремонтних пакетів (миттєвий ремонт без витрати енергії).
