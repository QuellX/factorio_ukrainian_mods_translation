[mod-setting-description]
ab-bobenemies-ai-performance-balance=Коригує розмір груп розповсюдження, коли встановлено Bob's Enemies. Вимкнення відновлює обидва збережені початкові значення діапазону, але не фактор еволюції із налаштувань запуску. Не змінює характеристики ворогів, швидкість еволюції чи звичайні атаки через забруднення.
ab-bobenemies-expansion-group-cap=Обмежує базовий розмір груп розповсюдження ворогів Factorio 2.1, коли встановлено Bob's Enemies. Якщо початковий мінімум перевищує обмеження, AngelBob тимчасово знижує й його до обмеження. Діапазон: 5-15; рекомендовано: 8. Менші значення можуть зменшити навантаження на Commander. Вимкніть балансування, щоб відновити обидва початкові значення.
ab-bobenemies-evolution-group-size-factor=Множник розповсюдження для нових мап, коли встановлено Bob's Enemies. Рекомендовано 6; стандартне значення 2.1 — 8. Потрібен перезапуск/перезавантаження модів. Перевірені збереження Factorio 2.1.19 зберігають свій фактор після перезавантаження. Ця функція ніколи не записує фактор під час гри. Головний перемикач під час гри не скасовує це налаштування.
ab-enable-diagnostics=Вмикає внутрішньоігрову діагностику для /ab-diagnostics. Не впливає на завантаження прототипів.
ab-extended-infinite-ores=Визначає, чи Angel's Infinite Ores залишається без змін, чи також додає придатним твердим планетарним родовищам нескінченні ядра в стилі Angel's. Потребує Angel's Infinite Ores і впливає лише на новозгенеровану місцевість.
ab-generic-planet-bootstrap=Аналізує непідтримувані сторонні планети й додає лише мінімально необхідні обмежені планетою рецепти Angel's для руд, нафтохімії чи базових боєприпасів для правдоподібного місцевого старту. Підтримувані планети ніколи не змінюються.

[string-mod-setting]
ab-extended-infinite-ores-angels-only=Лише руди Angel's
ab-extended-infinite-ores-all-planetary-ores=Усі планетарні руди

[string-mod-setting-description]
ab-extended-infinite-ores-angels-only=Звичайна поведінка Angel's Infinite Ores. Жодних додаткових прототипів ресурсів чи правил генерації мапи.
ab-extended-infinite-ores-all-planetary-ores=Додає нескінченні ядра в стилі Angel's придатним твердим мінеральним родовищам на їхніх планетах. Брухт, рідини, біологічні родовища, астероїдні та особливі ресурси не змінюються.

