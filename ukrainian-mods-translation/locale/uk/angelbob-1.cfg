[entity-description]
ab-planet-starter-machine=Стартова машина низької продуктивності без імпорту для __1__. Замініть її звичайною спеціалізованою машиною, щойно це стане можливим.
ab-muluna-vacuum-furnace=Парова піч низького тиску для обмеженої обробки злитків на Мулуні та місцевого виробництва для зворотних рейсів.
ab-process-steam-boiler=Спалює звичайне паливо для отримання ізольованої технологічної пари. Не під'єднуйте її вихід до ванільної парової енергомережі.
ab-muluna-ground-water-bore=Видобуває місячну ропу з мілких покладів Мулуни замість чистої води.
ab-fulgora-ground-water-bore=Видобуває електролітичний шлам з підповерхневих порожнин Фульґори замість чистої води.
ab-vulcanus-ground-water-bore=Видобуває геотермальну ропу з розломів Вулкануса замість чистої води.
ab-arig-ground-water-bore=Видобуває солоні ґрунтові води з водоносних шарів Арігу замість чистої води.
ab-aquilo-ground-water-bore=Видобуває замерзлу ропу з крижаних шарів Аквіло замість чистої води.
ab-gleba-ground-water-bore=Видобуває органічні ґрунтові води з боліт Ґлеби замість чистої води.
ab-hyarion-ground-water-bore=Видобуває кристалічну пульпу з покладів Харіона замість чистої води.
ab-paracelsin-ground-water-bore=Видобуває кислу ропу з водоносних шарів Парацельсина замість чистої води.
ab-maraxsis-ground-water-bore=Видобуває глибинну ропу з пластів морського дна Мараксиса замість чистої води.
planetaris-arig-roboport-2=Робопорт Bob's 2-го рівня, герметизований і посилений для абразивних пилових бур Арігу.
planetaris-arig-roboport-3=Робопорт Bob's 3-го рівня з вдосконаленою фільтрацією пилу Арігу та армованим склом.
planetaris-arig-roboport-4=Робопорт Bob's 4-го рівня з максимальним захистом від пилу Арігу та оригінальною логістичною продуктивністю.

