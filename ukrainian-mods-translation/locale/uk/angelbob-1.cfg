[fluid-description]
ab-process-steam=Пара для машин технологічних процесів, а не генераторів. Навмисно несумісна з ванільними паровими енергомережами.
ab-ammoniacal-mineral-slurry=Аміачна пульпа з дрібними мінеральними частинками, вимитими з льоду та реголіту Аквіло.
ab-muluna-lunar-brine=Мінеральна ропа низької гравітації, яку потрібно відфільтрувати, щоб отримати трохи придатної води.
ab-fulgora-electrolytic-sludge=Струмопровідний забруднений шлам, корисний лише після повільної аварійної обробки.
ab-vulcanus-geothermal-brine=Гаряча мінеральна ропа з розломів Вулкануса, багата на відходи сполук сірки.
ab-arig-saline-groundwater=Солоні ґрунтові води Арігу зі слідами пустельних мінералів і нафтохімії.
ab-aquilo-frozen-brine=Переохолоджена ропа з багатими на аміак домішками з крижаних шарів Аквіло.
ab-gleba-organic-groundwater=Біологічно забруднені ґрунтові води, що потребують очищення перед використанням.
ab-hyarion-crystal-slurry=Мінеральна пульпа з дрібними кристалами з водоносних порожнин Харіона.
ab-paracelsin-acidic-brine=Кисла ропа, придатна для хімічного вилучення, а не як чиста вода.
ab-maraxsis-deep-brine=Глибинна ропа морського дна, яку потрібно обробити, щоб отримати придатну воду.
ab-groundwater-placeholder=Внутрішня рідина для сумісності. Зазвичай не повинна з'являтися.

[item-description]
ab-volcanic-mineral-residue=Побічний продукт видобутку на Вулканусі, який можна переробити на подрібнені руди Angel's.
ab-process-steam-boiler=Ранній твердопаливний котел, що фізично відокремлює технологічну пару від енергетичної.
ab-planet-starter-machine=Стартова машина низької продуктивності без імпорту для __1__. Замініть її звичайною спеціалізованою машиною, щойно це стане можливим.
ab-lunar-mineral-residue=Блідий місячний реголіт, збагачений уламками анортиту, кристалами глинозему та алюмінієвмісними мінеральними вкрапленнями.
ab-ferrous-bioleached-pulp=Жива мінеральна пульпа, що дозріває в подрібнений сапфірит.
ab-cupric-bioleached-pulp=Жива мінеральна пульпа, що дозріває в подрібнений стиратит.
ab-jivolite-bioleached-pulp=Жива мінеральна пульпа, що дозріває в подрібнений дживоліт.
ab-crotinnium-bioleached-pulp=Жива мінеральна пульпа, що дозріває в подрібнений кротиній.
ab-rubyte-bioleached-pulp=Жива мінеральна пульпа, що дозріває в подрібнений рубіт.
ab-bobmonium-bioleached-pulp=Жива мінеральна пульпа, що дозріває в подрібнений бобмоній.
ab-muluna-aluminium-cable=Алюмінієвий дріт, витягнутий за допомогою пари, для допоміжної електроніки Мулуни.
ab-legacy-tungsten-ore=Прихований псевдонім для сумісності зі старими збереженнями та міграціями сторонніх модів.
ab-legacy-tungsten-plate=Прихований псевдонім для сумісності зі старими збереженнями та міграціями сторонніх модів.
ab-legacy-tungsten-carbide=Прихований псевдонім для сумісності зі старими збереженнями та міграціями сторонніх модів.
ab-muluna-vacuum-furnace=Парова піч низького тиску для обмеженої обробки злитків на Мулуні та місцевого виробництва для зворотних рейсів.
ab-arig-heavy-mineral-sand=Щільні мінерали-домішки, сконцентровані з пустельного піску Арігу. Придатні лише для підтримки виробництва подрібнених руд на рівні обслуговування.
ab-muluna-ground-water-bore=Видобуває місячну ропу з мілких покладів Мулуни замість чистої води.
ab-fulgora-ground-water-bore=Видобуває електролітичний шлам з підповерхневих порожнин Фульґори замість чистої води.
ab-vulcanus-ground-water-bore=Видобуває геотермальну ропу з розломів Вулкануса замість чистої води.
