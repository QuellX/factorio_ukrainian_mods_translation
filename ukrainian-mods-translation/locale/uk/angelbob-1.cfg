help=Обмежує базовий розмір груп розповсюдження, тимчасово знижуючи мінімум лише за потреби.\nМенші значення можуть зменшити навантаження на Commander. Вимкніть балансування, щоб відновити початковий діапазон.\nФактор запуску: Налаштування > Налаштування модів > Запуск; потрібен перезапуск/перезавантаження модів.\nНаявні збереження зберігають свій фактор, який може відрізнятися від вибраного в налаштуваннях запуску.\nПеремикач: Налаштування > Налаштування модів > Мапа. Натисніть AB ШІ ще раз, щоб закрити.

