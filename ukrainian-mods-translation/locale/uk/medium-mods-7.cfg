[mod-setting-description]
lex-tech=Ставить Lex's Aircraft за технологію «Вдосконалена аеродинаміка». Використовуйте, лише якщо встановлено Lex's Aircraft.
lock-surfaces-space-age=Обмежує літаки за умовами поверхні. Стосується лише Space Age.
experimental-features=Вмикає функції, що ще в розробці. Немає гарантії, що цей параметр щось робить.
space-age-easy-mode=Повертає рецепти й технології літаків високого рівня до стану, ніби Space Age не ввімкнено.
carbon-fiber-aircraft=Додає літаки з вуглецевого волокна, що мають удвічі меншу вагу й здоров'я, ніж стандартні.
use-old-stats=Використовує старі характеристики літаків з 2.0.2 замість перебалансованих, які зараз у розробці.
disable-tank-controls=Літаки поводяться реалістичніше: танкове керування вимикається, і з'являється радіус розвороту.
xy-item-weight=Посилює ключові проміжні компоненти, як-от [item=kr-electronic-components], що інакше мають низькі значення. Посилює ключові інгредієнти будівель, як-от [item=kr-inserter-parts], щоб будівлі можна було виготовляти на місці.
xy-processing-unit-alt=[color=yellow]Увага: може спричинити незначні проблеми в наявних збереженнях.[/color] [recipe=kr-bio-processing-circuit] виконується в [entity=biochamber] і використовує відповідну кількість [item=advanced-circuit]. Прив'язує [item=processing-unit] Cerys з азотної кислоти до Cerys і перебалансовує його під стандарти K2. Змінює [item=processing-unit] Paracelsin з азотної кислоти, щоб узгодити з іншими рецептами, але з однією [item=advanced-circuit] менше.
xy-move-lab-category=Переносить усі лабораторії на вкладку науки з мода Science group. Це відбувається автоматично, якщо у вашій грі >10 лабораторій. Можна залишити ввімкненим, навіть якщо нічого не змінюється.
xy-moshine-connection-length=Збільшує відстань від [planet=nauvis] і [planet=vulcanus] до Moshine до 10000 і 25000 км відповідно. Щільність астероїдів не змінюється.
xy-paracelsin-tech-card=[color=orange]Увага: виправлення дуже рекомендовано залишити ввімкненими. Впливає на збереження, де вже виробляються гальванізаційні дослідницькі пакети[/color]. Налаштування залишено, бо інший мод теж додає технологічну картку гальванізації.
xy-paracelsin-tech-card-endgame=[color=orange]Увага: впливає на збереження фінальної гри.[/color] Дослідження, що потребують [item=promethium-science-pack], також потребуватимуть технологічної картки гальванізації. Потрібне ввімкнене «Додати/замінити технологічну картку гальванізації».
xy-secretas-polish=[color=orange]Увага: впливає на збереження, де вже досягнуто Secretas.[/color] Змінює багато рецептів мода, щоб вони були менш божевільними й потребували матеріалів з інших модів і K2
xy-adv-chem-plant-rebalance=[color=yellow]Увага: може спричинити незначні проблеми в наявних збереженнях.[/color] Міняє місцями більшість характеристик [entity=kr-advanced-chemical-plant] і електрохімічної установки Paracelsin (яка з'являється пізніше). Вартість [entity=kr-advanced-chemical-plant] зменшується, а електрохімічна установка дорожчає.
xy-lab-recipe-changes=[color=yellow]Увага: може спричинити незначні проблеми в наявних збереженнях.[/color] [entity=kr-singularity-lab] потребує кріолабораторій Muluna замість [entity=biolab] або [item=quantum-processor], якщо Muluna не встановлено. Кріолабораторія потребує досліджень та інгредієнтів з Paracelsin, якщо його встановлено. Перебалансовує кріолабораторію й [entity=kr-singularity-lab] та застосовує до них множник витрати дослідницьких пакетів за якістю.
xy-advanced-centrifuge-rebalance=Удвічі зменшує швидкість, але додає +50% продуктивності вдосконаленій центрифузі, щоб наблизити її до балансу Space Age, а не K2. Переносить технологію з [item=kr-matter-tech-card] на [item=electromagnetic-science-pack]. Суттєво змінює рецепт будівлі.
xy-arig-belts=[color=yellow]Увага: може спричинити незначні проблеми в наявних збереженнях.[/color] Робить найліпші конвеєри продовженням гіперконвеєрів Arig, а не турбоконвеєрів SA, для кращої інтеграції. Також додає гіперзавантажувач. Усі найліпші конвеєри потребують гіперконвеєрів, а рецепти гіперконвеєрів змінено в стилі K2.
xy-apia-artillery-rebalance=[color=yellow]Увага: може спричинити незначні проблеми в наявних збереженнях.[/color] Збільшує шкоду фосфорних артилерійських снарядів [item=artillery-shell-with-phosphorus] до рівня інших артилерійських снарядів і уніфікує рецепт з ядерними/антиматерієвими артилерійськими снарядами. Також уніфікує розмір стосу й вагу.
xy-apia-biosolar-rebalance=[color=orange]Увага: дуже рекомендовано залишити ввімкненим, бо інакше біосонячна панель робить очищувачі повітря K2 цілком непотрібними.[/color] Зменшує поглинання забруднення [entity=bio-solar-panel] біосонячною панеллю на 90% (вона все одно поглинає забруднення як 200 дерев замість 2000). Як компенсацію збільшує сонячну потужність до 120 кВт. Уніфікує розмір стосу до 50 і вагу до 40 кг.
xy-tech-inflation=[color=yellow]Увага: ускладнює гру, але рекомендовано.[/color] Множить вартість технологій після перших трьох ванільних планет. Разом з можливостями K2 гравець здатен масштабуватися дуже сильно. Це вимагатиме будувати на рівні «кілобаз» і заохочує третю базу до пізньої/фінальної гри: рекомендовано 1000–3000+ SPM до [item=promethium-science-pack] і >10000 SPM, щоб завершити фінальну гру за розумний час. Не впливає на технології Moshine. Не впливає на технології-«вдосконалення».\n[font=default-bold]Це налаштування підійде не всім. Типово воно вимкнене лише тому, що суттєво вплине на наявні бази середньої гри й пізніше.[/font]
xy-tech-inflation-scale=Базові множники:\n[item=kr-advanced-tech-card] 2x\n[item=metallurgic-science-pack][item=electromagnetic-science-pack][item=agricultural-science-pack](усі) 5x\n[item=cryogenic-science-pack] (або гідравлічний чи гальванізаційний) 6x\n[item=kr-matter-tech-card] 10x\n[item=kr-singularity-tech-card] 15x\n[item=promethium-science-pack] 25x\n[item=kr-intergalactic-transceiver] 50x\nЗастосовується найбільший відповідний множник. Деякі ключові технології, як-от [technology=quantum-processor] і [technology=legendary-quality], також дорожчають, як і відкриття пізніших планет.\nЗміна цього налаштування множить наведені вище множники, але не нижче 1x.
xy-maraxsis-moshine-connection=[color=yellow]Увага: може спричинити проблеми, якщо вимкнути посеред гри.[/color] Додає нове сполучення між Maraxsis і Moshine довжиною 15000 км — коротше за інші маршрути. Має таке саме різноманіття астероїдів, як інші маршрути до Maraxsis. Потребує ввімкнених налаштування «Збільшити відстань до Moshine», Maraxsis й Moshine, інакше нічого не робить.
xy-advanced-tank-expensive-research=Дослідження [technology=kr-advanced-tank] додатково потребує [item=metallurgic-science-pack] [item=electromagnetic-science-pack] [item=agricultural-science-pack], щоб заохотити використання [entity=spidertron] для бою
lithium-battery-fusion-generator=Діє, лише якщо ВЕС фінальної гри вимкнено, інакше рецепт змінюється автоматично. Змінює базовий рецепт, додаючи літієві батареї.
lithium-battery-fusion-reactor-equipment=Діє, лише якщо ВЕС фінальної гри вимкнено, інакше рецепт змінюється автоматично. Змінює базовий рецепт, додаючи літієві батареї.
lithium-battery-railgun=Діє, лише якщо ВЕС фінальної гри вимкнено, інакше рецепт змінюється автоматично. Змінює базовий рецепт, додаючи літієві батареї.
lithium-battery-railgun-turret=Діє, лише якщо ВЕС фінальної гри вимкнено, інакше рецепт змінюється автоматично. Змінює базовий рецепт, додаючи літієві батареї.
lithium-accumulator-quality=Для звичайного й літієвого акумуляторів. Діє, лише якщо літієві акумулятори ввімкнено
lithium-roboport-mk3-radius=Радіус 25 означає зону 50x50
hea-endgame=Додає високоентропійний сплав (ВЕС), новий виробничий ланцюжок, зміни рецептів і реорганізацію технологій. Усе це додає ще один рівень складності
hea-promethium=Замінює квантовий процесор двигуном з високоентропійного сплаву
hea-assembling-machine-4=Діє, лише якщо ВЕС фінальної гри ввімкнено. Якщо ввімкнено складальний автомат 4 з мода Hyarion, складальний автомат 4 з ВЕС стає складальним автоматом 5
hea-thruster=Діє, лише якщо ВЕС фінальної гри ввімкнено
hea-belt=Діє, лише якщо ВЕС фінальної гри ввімкнено. Щоб використовувати без ВЕС, завантажте мод PromethiumBeltRebalance
hea-belt-speed=Діє, лише якщо ВЕС фінальної гри ввімкнено.
hea-belt-tech-cost=Діє, лише якщо ВЕС фінальної гри ввімкнено. Якщо ВЕС вимкнено, а мод PromethiumBeltRebalance увімкнено, вартість технології задається в тому моді
