[technology-description]
gunships-carbon-fiber=Легка альтернатива звичайним бойовим літакам. Важить удвічі менше й споживає вдвічі менше палива.
jets-carbon-fiber=Легка альтернатива звичайним реактивним літакам. Важить удвічі менше й споживає вдвічі менше палива.
cargo-planes-carbon-fiber=Легка альтернатива звичайним вантажним літакам. Важить удвічі менше й споживає вдвічі менше палива.
flying-fortress-carbon-fiber=Легка альтернатива звичайній літаючій фортеці. Важить удвічі менше й споживає вдвічі менше палива.
lithium-accumulator=Літієвий акумулятор з більшою місткістю та швидкістю заряджання й розряджання.
lithium-battery-mk4=Літієві батареї дають змогу виготовити потужну особисту батарею MK4.
lithium-roboport-mk3=Робопорт, що вміщує більше роботів і швидше їх заряджає. Також збільшує зону будівництва.
lithium-shield-mk3=Енергетичний щит MK3 може поглинати більше шкоди.
hea-processing=Розробка високоентропійного сплаву дає новий метал з високою міцністю.
hea-engine=Цей вдосконалений двигун — найсучасніша технологія. Має високу стійкість до тепла й тиску, а також вражаючу потужність.
automation-4=Складальний автомат останнього покоління, здатний на ще вищу швидкість виробництва.
automation-5=Складальний автомат останнього покоління, здатний на ще вищу швидкість виробництва.
hea-thruster=Відкриває потужний прискорювач з високоентропійного сплаву. Цей монстр має вчетверо більшу тягу за базовий прискорювач, але й удесятеро більші потреби в паливі.

