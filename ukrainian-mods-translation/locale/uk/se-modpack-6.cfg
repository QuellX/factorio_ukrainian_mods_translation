[mod-setting-description]
ltnm-iterations-per-tick=Зменште це число, якщо є проблеми з продуктивністю.
inv_sensor_update_interval=Як часто оновлюються інвентарі.\nТипово = 10
inv_sensor_find_entity_interval=Як часто шукаються нові/змінені об'єкти.\nТипово = 120
inv_sensor_read_grid=Вимкніть, щоб покращити продуктивність\nТипово = Увімк.
inv_sensor_BBox_range=Довжина прямокутника пошуку перед датчиками.\nУВАГА: після зміни цього значення об'єкти можуть виявлятися неправильно!\nТипово = 1.5
inv_sensor_BBox_offset=Половина ширини прямокутника пошуку.\nУВАГА: після зміни цього значення об'єкти можуть виявлятися неправильно!\nТипово = 0.2

[gui]
ltnm-alert-delivery-failed=Доставка не вдалася
ltnm-alert-delivery-failed-description=Потяг виконував завдання надто довго, і LTN його покинула, або потяг став недійсним з іншої причини. Скільки LTN чекає на потяг, можна налаштувати в налаштуваннях моду.\n\nЗапланований вантаж показано зеленим.
ltnm-alert-provider-missing-cargo=Постачальник — бракує вантажу
ltnm-alert-provider-missing-cargo-description=Не весь запланований вантаж завантажено, перш ніж потяг залишив постачальника.\n\nЗелений — запланований вантаж, червоний — фактичний.
ltnm-alert-provider-unscheduled-cargo=Постачальник — незапланований вантаж
ltnm-alert-provider-unscheduled-cargo-description=Потяг залишив постачальника з незапланованим / небажаним вантажем.\n\nЗелений — запланований вантаж, червоний — незапланований.
ltnm-alert-requester-remaining-cargo=Запитувач — залишок вантажу
ltnm-alert-requester-remaining-cargo-description=Не всі матеріали вивантажено з потяга, перш ніж він залишив станцію, і він повернувся в депо із залишком вантажу.\n\nЗалишки показано червоним.
ltnm-alert-requester-unscheduled-cargo=Запитувач — незапланований вантаж
ltnm-alert-requester-unscheduled-cargo-description=Потяг прибув до запитувача з незапланованим / небажаним вантажем.\n\nЗелений — запланований вантаж, червоний — незапланований.
