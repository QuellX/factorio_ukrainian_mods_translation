[string-mod-setting-description]
real-smoke-density-subtle=Дуже легкий дим, найкраще для величезних фабрик або слабких серверів.
real-smoke-density-balanced=Рекомендовано типово. Помітний, але без безладу.
real-smoke-density-heavy=Густіший дим для насиченішої промислової атмосфери.
real-smoke-density-cinematic=Максимум диму для знімків екрана й потужних ПК.
real-smoke-smoothness-performance=Найменше навантаження. Дим випускається рідше.
