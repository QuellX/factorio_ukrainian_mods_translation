[mod-setting-description]
shibadisaster-cwa-enable-paracelsin-changes=Змінює погоду Paracelsin на тему вулканічної зими. Це впливає на видимість і зручність гри, тому типово вимкнено.
shibadisaster-cwa-pelagos-enable-tropical-recolor=Перефарбування вже додано в сам Pelagos, тож тепер воно типово вимкнене!
shibadisaster-cwa-panglia-enable-antilinear-fog=Додає ефект туману над зонами прискореного часу
paint-fluid-wagon=Для правильної роботи потрібен мод маски вагона-цистерни.
u-loco=Має бути 3- або 6-значним шістнадцятковим числом або порожнім. \nТиповий сірий = [color=#E4D1C7][font=default-bold]E4D1C7[/font][/color]\nОригінальний червоний [item=locomotive] = [color=#EA1100][font=default-bold]EA1100[/font][/color]
u-cargo-wagon=Має бути 3- або 6-значним шістнадцятковим числом або порожнім. \nТипово = [color=#6D3A00][font=default-bold]6D3A00[/font][/color]
u-fluid-wagon=Має бути 3- або 6-значним шістнадцятковим числом або порожнім. \nТипово = [color=#C8C8C8][font=default-bold]C8C8C8[/font][/color]
custom-colors-list=Вмикає власні кольори на вкладці "Мапа".
loc-eqpm-grid-w=Типово = 2\nМін. = 2\nМакс. = 16
loc-eqpm-grid-h=Типово = 4\nМін. = 2\nМакс. = 16
loc-eqpm-module=Розмістіть у сітці обладнання локомотива, щоб вимкнути автоматичне фарбування відповідного потяга. Потрібна сітка обладнання локомотива.
atp-ltn-paint=Фарбує потяги, відправлені Logistic Train Network, коли вони виїжджають з депо. (Зазвичай коли вмикається жовтий вогник)
atp-custom-colors-enable=Вимкнено: не використовувати власні кольори\nПріоритет: власні кольори мають перевагу над базою кольорів мода.\nЛише: використовуються лише власні кольори, база кольорів мода ігнорується.
atp-custom-colors-list=Значення має бути відформатоване як таблиця, ось так:\n\n[font=default-bold]{\n['item1']={r=000,g=000,b=000,a=000}\n['item2']={r=255,g=255,b=255,a=255}\n}[/font]\n\n[font=default-small]Назва предмета може містити лише літери, цифри, "-" або "_".\nЗначення rgb і a мають бути від 0 до 255.\nПрактичного обмеження кількості рядків таблиці немає.[/font]
real-smoke-enabled=Головний перемикач усіх ефектів Real Smoke.
real-smoke-real-rain-integration=Якщо встановлено Real Rain, усі стадії від мряки до мусону поступово розріджують дим і посилюють його знесення вітром.
real-smoke-real-wind-integration=Якщо встановлено Real Wind, поточна швидкість вітру й пориви додають диму більше бічного руху й різноманітності шлейфа.
real-smoke-density=Визначає, скільки диму з'являється навколо під'єднаних гравців. Зони сканування, що перекриваються, не обробляють одне джерело двічі.
real-smoke-smoothness=Визначає, як часто випускаються менші клуби диму. "Стиль 120 FPS" і "Ультрареалізм" — візуальні пресети, а не справжня симуляція 120 UPS.
real-smoke-black-strength=Визначає, наскільки темним і густим виглядає сажовий дим. "М'який" найкраще, якщо чорний дим усе ще здається надто важким.
real-smoke-scan-radius=Як далеко навколо кожного під'єднаного гравця Real Smoke шукає активні машини й транспорт. Менші значення краще для UPS.
real-smoke-machines=Додає дим працюючим котлам, печам і твердопаливним бурам.
real-smoke-vehicles=Додає вихлопний дим локомотивам, автомобілям і танкам, що рухаються.
real-smoke-events=Додає короткі густі хмари диму до підтримуваних подій ракет і вибухів.
real-smoke-debug-stats=Періодично виводить кількість створених клубів диму для тестування.

