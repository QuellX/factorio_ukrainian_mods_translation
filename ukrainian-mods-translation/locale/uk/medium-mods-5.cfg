color-length-error=Automatic Train Painter | [img=utility/warning_icon] Попередження: неприпустима довжина типового значення кольору [font=default-large-bold]__1__[/font] [font=default-large-bold](__2__)[/font]. Має бути 3, 6 або порожньо.
invalid-custom-table=Automatic Train Painter | [img=utility/warning_icon] Попередження: не вдалося створити коректну таблицю з введеного рядка.
invalid-custom-item-name=Automatic Train Painter | [img=utility/warning_icon] Попередження: знайдено неприпустиму назву предмета: [font=default-large-bold]"__1__"[/font] \nНазва може містити лише літери, цифри, "-" або "_"\n
invalid-custom-color-key=Automatic Train Painter | [img=utility/warning_icon] Попередження: знайдено неприпустимий ключ кольору: [font=default-large-bold]"__1__"[/font] для предмета [font=default-large-bold]"__2__"[/font] \nЗнайдено: [font=default-large-bold]"__3__"[/font], очікувалося "abgr"\nТаблиця кольорів має містити значення "r", "g", "b" і "a"
invalid-custom-color-value=Automatic Train Painter | [img=utility/warning_icon] Попередження: неприпустиме значення R G B A: [font=default-large-bold]"__1__" = "__2__"[/font] для предмета [font=default-large-bold]"__3__"[/font]
possible-custom-color-values=Значення R G B A мають бути від 0 до 255 включно.\n
custom-colors-not-loaded=Automatic Train Painter | [img=utility/warning_icon] Попередження: власні кольори не відформатовано як таблицю. Кольори не завантажено.
