[entity-description]
real-smoke-light=Невеликий брудний клуб диму від твердопаливних машин.
real-smoke-industrial=Середній сірий промисловий дим, що здіймається, розширюється й розсіюється.
real-smoke-soot=М'який сіро-чорний сажовий дим для котлів і бруднішого вихлопу без утворення величезних чорних хмар.
real-smoke-heavy=Густий темний дим для щільного вихлопу й вибухів.
real-smoke-exhaust=Вихлопний дим транспорту й локомотивів.
real-smoke-blast=Коротка густа хмара диму для вибухів і запусків ракет.

