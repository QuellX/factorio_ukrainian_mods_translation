real-smoke-smoothness-ultra-real=Найплавніший візуальний пресет. Легший шаруватий дим і щільніший розкид для реалістичнішого вигляду з високим FPS.
real-smoke-black-strength-soft=М'яка сіро-чорна сажа. Найкраще, якщо темний дим усе ще здається надто важким.
real-smoke-black-strength-realistic=Рекомендовано. Помітна сажа без величезних чорних хмар.
real-smoke-black-strength-strong=Сильніший темний дим для вигляду брудної фабрики.

