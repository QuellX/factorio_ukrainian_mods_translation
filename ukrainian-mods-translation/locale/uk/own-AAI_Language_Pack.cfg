tick_limit-tooltip=Обробляти тільки кожні X тиків. 60 = раз на секунду. 0 = вимкнено. Більша кількість не так сильно сповільнить вашу гру, але використання меншої кількості структур є набагато кращим.
output_pulse=Вихідний імпульс
output_pulse-tooltip=Якщо позначено, вихідні сигнали пульсують протягом 1 такту під час сканування, а потім зникають до наступного такту сканування (визначається частотою такту). Якщо не позначено, сигнали залишаються до наступного сканування.
