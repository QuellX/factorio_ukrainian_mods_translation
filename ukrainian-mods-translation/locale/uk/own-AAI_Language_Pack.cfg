vehicle-collection-interval=Гірничодобувна машина: Інтервал збору

[mod-setting-description]
aai-containers-resize-1x1=Збільшити відстань між контейнерами, через яку можна проходити.
aai-containers-scale-icons=Зробити значок вмісту, що показується в Alt-режимі, різного розміру залежно від площі контейнера.
aai-containers-progression=Розмір інвентарю Дерев'яної скрині, Залізної скрині, Сталевої скрині, Великої скрині, Контейнера і Складу. ПЩ = Постійна щільність на комірку для сталі+. Попередження: Контейнери з великим розміром інвентарю зменшують UPS, не рекомендується перевищувати максимальний розмір інвентарю в 540 комірок.
aai-containers-number-icons=Показувати розмір контейнера числом у верхньому лівому кутку значка.
start-with-basic-logistics=Почніть з кількох ранніх технологій, які ви попередньо вивчили, щоб одразу створювати конвеєри та твердопаливні машини.
quick-start-science=Кількість наукових пакетів автоматизації, які міститиме корабель, що зазнав аварії.
aai-fast-motor-crafting=Робить __ITEM__motor__ створює із залізної пластини за той самий час, що й залізні шестерні у ванілі. __ITEM__iron-gear-wheel__ 0.2с __ITEM__motor__ 0.3с __ITEM__copper-cable__ 0.2с, __ITEM__electric-motor__ 0.4с.
aai-wide-drill=Додає більший електричний гірничий бур зі збільшеним радіусом дії, швидкістю та додатковим слотом для модулів. Цей параметр нічого не робить, якщо встановлено Space Age.
aai-burner-turbine-efficiency=Змінює паливну ефективність твердопаливного турбогенератора.
aai-fuel-processor=Додає паливний процесор для перетворення хімічного палива на універсальне перероблене паливо та отримання енергії в процесі (відсоток отримання енергії - інший параметр). Якщо вимкнено, технологія буде прихована на початку гри.
aai-fuel-processor-efficiency=Відсоток бонусної енергії, яка буде отримана після переробки. Більші значення зменшують витрати енергії паливним переробником.
aai-stone-path=Додати грубу кам'яну кладку для доріжок, яку можна викласти з каменю.
wide-flashlight=Замінити ліхтарик персонажа на ширшу версію.
enhanced-nightvision=Скорегувати колір нічного бачення LUT. Не перенасичує екран, а лише додає легкого зеленого відтінку деяким тіням.
night-lut-set=Сила ефекту нічної темряви.
aai-loaders-mode=Визначає, як завантажувачі AAI працюють у грі. Рекомендованим режимом є змащення; в іншому випадку, навіть при високих витратах, навантажувачі мають занадто багато переваг над маніпуляторами.
aai-loaders-lubricant-recipe=Чи додавати простий, але неефективний рецепт, що дозволяє виробляти мастило безпосередньо з сирої нафти.\n\nЗа замовчуванням встановлено значення "Авто", що умовно увімкне цей рецепт, якщо рецепти поглибленої переробки нафти та важкої нафти на мастило не змінено з ванілі. Цей параметр нічого не робить, якщо для параметра "Режим роботи" встановлено значення, відмінне від "Змащення".
aai-loaders-fit-assemblers=Збільшити розмір складальних автоматів на 8%, щоб завантажувачі зображалися належним чином.
aai-max-structs-per-tick=Покращуйте UPS, обмежуючи кількість структур, які можна обробити в кожному кадрі. Вищі значення означають більше потенційне навантаження на UPS, 0 означає необмежену кількість. Якщо ви вибрали 0, можливо, варто обмежити структури іншими способами, наприклад, відключити живлення структур, коли вони не потрібні, або надсилати сигнали імпульсами, а не безперервно.
aai-structs-tick_limit=AAI За замовчуванням частота тиків для нових розміщених структур
aai-structs-output_pulse=AAI Налаштування імпульсного виходу за замовчуванням для нещодавно розміщених конструкцій
start-with-unit-remote-control=Почніть з безплатного пульта дистанційного керування
start-with-random-color=Гравці з'являються з випадковим кольором.
pathfinding-visualisation-cutoff=Детальний жовтий шлях, що показує результати пошуку шляху одиниці. Процес не швидкий, тому не використовується для великих відстаней. Зменшуйте число, щоб зменшити діапазон, на якому використовується ця візуалізація. 0 вимикає візуалізацію для пришвидшення роботи.
hand-deploy-vehicle-ai-default=Яке налаштування ШІ слід використовувати за замовчуванням, коли транспортні засоби розгортаються вручну.
exclude-vehicles=Непрограмовані транспорти. Введіть "entity-name" транспортів, які потрібно виключити, через 1 пробіл.
restrict-remote-actions-to-player-ids=Якщо встановлено, лише вказані ідентифікатори гравців можуть використовувати віддалені дії одиниці та шляху, розділені 1 пропуском.
passenger-no-control-alert=Дозволяє вимкнути повідомлення "Для ручного керування автомобілем перемкніть стан ШІ на: Auto або OFF." повідомлення.
aai-remove-ai-on-mine=Рецепт перетворення транспорту зі ШІ на транспорт без ШІ вилучено, щоб зменшити захаращеність меню створення. Натомість ви можете повернути ШІ-версію транспорту, видобувши його.
aai-attack-target-fallback=Якщо ціль атаки не знайдено, шукайте невійськові об'єкти. Це налаштування призначене для PvP і може знизити продуктивність гри.
start-with-vehicle-miner=Додає безплатний гірничодобувну машину MK1 до інвентарю космічного корабля у вільній грі.
vehicle-mining-multiplier=Множник до швидкості видобутку шахтних машин. Встановлення значення 50 означає, що транспортні засоби видобувають на половинній швидкості.
vehicle-mining-disallow-resources=Введіть "ім'я ресурсу" ресурсів, які ви хочете заборонити, відокремлюючи декілька з них пробілом. Знайдіть імена за допомогою опції налагоджувальних підказок F4.
vehicle-mining-interval=Кількість тиків між обробкою видобутку, низька - більш плавний видобуток, висока - економія UPS.
vehicle-mining-requires-movement=Транспортний засіб може мінувати тільки під час руху, або гравцем, або будь-яким модом ШІ транспортного засобу (наприклад, AAI Programmable Vehicles з інструментом шляху).
vehicle-collection-interval=Кількість кліків між збором дерев, каміння та наземних об'єктів, низька - частіше, висока - економить UPS.

