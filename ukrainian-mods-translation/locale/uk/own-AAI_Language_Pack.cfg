[item-description]
burner-turbine=Автономний генератор електроенергії, простий, але неефективний.
processed-fuel=Ефективне паливо, призначене для живлення транспортних засобів, але може використовуватися і для інших цілей.
area-mining-drill=Велика кар'єрна установка зі збільшеним радіусом дії, швидкістю та додатковими слотами для модулів.
tile-scan=Введіть сигнал відстані для сканування випадкових плиток у цьому діапазоні. Сканувати певну плитку за допомогою сигналів X-плитки та Y-плитки. Використовуйте "Відстань" за плитками X і Y для сканування випадкових плиток навколо плиток XY. Повертає позицію відсканованої плитки, а також ворогів, ресурси, споруди, юнітів, транспортні засоби, землю або воду на цільовій плитці.
zone-scan=Ввести тип зони, за введеним значенням вибирається n-на плитка зони цього типу, або використати від'ємне значення, щоб вибрати плитку зони у зворотному порядку. Виводить розташування плитки зони.
zone-control=Введіть координати плитки по осях X та Y, щоб очистити зони від вказаної плитки. Якщо також введено тип зони, то вказаний тип зони буде розміщено на вказаній плитці.
unit-scan=Введіть ідентифікатор транспорту або ідентифікатор гравця (вкладка "Віртуальні сигнали"), виберіть n-й об'єкт цього типу в порядку розміщення або використовуйте від'ємне значення, щоб вибрати у зворотному порядку (найновіший - першим). Виводить "кількість" об'єктів цього типу та деталі вибраного об'єкта, включаючи позицію, міцність, інвентар та внутрішні таймери.
unitdata-scan=Введіть ідентифікатор транспорту або ідентифікатор гравця (вкладка "Віртуальні сигнали"), виберіть n-й об'єкт цього типу у порядку розміщення або використовуйте від'ємне значення, щоб вибрати у зворотному порядку (найновіший - першим). Виводить всі дані сигналів, які зберігаються у транспортному засобі. Збережені сигнали використовуються для цілей інвентаризації транспортних засобів під час взаємодії з перевізниками, або можуть бути використані для розрізнення одиниць, позначення ролей тощо.
unitdata-control=Введіть ідентифікатор транспорту, як у випадку зі сканером даних агрегату, а також будь-які сигнали, які ви хочете зберегти для цільового транспорту. Вхідні сигнали перезаписують ВСІ поточні сигнали, збережені на транспортному засобі. Якщо ви хочете змінити існуючі сигнали, вам потрібно спочатку просканувати дані автомобіля, внести зміни, а потім зберегти змінені сигнали назад до автомобіля.
path-scan=Введіть ідентифікатор шляху, щоб отримати кількість маршрутних точок, або ідентифікатор шляху та ідентифікатор маршрутної точки, щоб просканувати певну цільову точку. Поверніть дані XY для позиційних маршрутних точок або ідентифікатор цілі для нестатичних маршрутних точок.
path-control=Введіть Ідентифікатор шляху та Ідентифікатор маршрутної точки, щоб призначити дані маршрутній точці. Відсутність даних обнуляє маршрутну точку. Дані XY встановлюють статичну позицію. Встановіть динамічну маршрутну точку з ідентифікатором гравця, ідентифікатором юніта, ідентифікатором позиційного маяка або ідентифікатором складу транспортних засобів.
vehicle-depot=Швидко переносити предмети до та з транспортів, що знаходяться поблизу, на основі вхідного сигналу. Подайте позитивний сигнал, щоб прийняти предмет від транспортів. Встановіть від'ємний сигнал, щоб віддати товар транспортам.
path-remote-control=Створюйте та редагуйте шляхи з маршрутними точками для транспортів. Можна зробити або створити, натиснувши клавішу "Створити/Переключити пульт" (за замовчуванням Y).
cannon-shell-precision=Подібно до гарматного снаряда, але націлений на одну ціль, а не на лінію для зменшення супутньої шкоди.
explosive-cannon-shell-precision=Подібно до розривного гарматного снаряда, але вражає одну ціль, а не лінію, що зменшує супутні пошкодження.
vehicle-deployer=Розгортає транспорт автомобільного типу. Будь-які підключені сигнальні дані зберігаються на транспорті під час його розгортання, інакше використовуються значення за замовчуванням. Сигнальні дані транспорту використовуються для цільової кількості товару на транспорті, щоб транспорти-перевізники могли обмінюватися запасами, якщо вони знаходяться в межах досяжності (запаси, що перевищують це значення, будуть перекинуті на транспор-перевізник, якщо він погодиться їх прийняти). Сигнальні дані про перевізників визначають їхню максимальну місткість, а не цільову кількість.
position-beacon=Статичний маяк (комбінатор), який виводить свій ідентифікатор і позицію. Може використовуватися як маршрутна точка за допомогою пульта дистанційного керування.
vehicle-flame-tank=Танк з вогнеметом. Вогняний танк має хороше прискорення, пристойну броню і вогнетривкий.
vehicle-flame-tumbler=Високошвидкісна таранна машина, захищена від пошкоджень при зіткненні та озброєна вогнеметом. Підходить для швидкого штурму баз, розвідки дикої місцевості та наїздів на ворога. Може бути автоматизований за допомогою модифікації AAI Programmable Vehicles.
vehicle-hauler=Високопродуктивний універсальний транспорт для переміщення предметів. Hauler був розроблений для використання з модом AAI Programmable Vehicles і може діяти автономно, якщо його правильно запрограмувати, наприклад: збирати ресурси від шахтарів і доставляти їх на склади.
mortar-bomb=Дугова вибухівка дуже великої дальності дії.
mortar-cluster-bomb=Дугова вибухівка великої дальності, що розривається на частини.
ironclad-cannon=Стріляє гарматними снарядами середньої дальності з малою траєкторією польоту.
ironclad-mortar=Стріляє далекобійними мінометними мінами з високою траєкторією польоту.
vehicle-laser-tank=Потужний лазерний танк з важкою бронею. Може стріляти сфокусованими / проникаючими променями для ураження однієї цілі / площі.
laser-cannon-battery-focussed=Єдина ціль
laser-cannon-battery-piercing=Удари по декількох цілях
vehicle-miner=Екскаватор, який може видобувати тверді корисні копалини, такі як вугілля, камінь, руди, а також збирати врожай з будь-яких дерев на своєму шляху (і може споживати деревину як паливо). Швидкість видобутку 1.
vehicle-miner-mk2=Швидкість видобутку 3
vehicle-miner-mk3=Швидкість видобутку 6
vehicle-miner-mk4=Швидкість видобутку 12
vehicle-miner-mk5=Швидкість видобутку 24
vehicle-warden=Високопотужна машина підтримки, оснащена радаром. Може стріляти електрошоковими імпульсами, збирати наземні об'єкти на великій площі та ремонтувати сусідні транспорти та споруди за допомогою ремонтних пакетів. Завдяки програмованим транспортним засобам AAI він може забезпечувати ресурсами сусідні транспорти, такі як тягач, але з більшим радіусом дії.
electro-bolter-gun=Використовує електрошокові імпульсні боєприпаси
zone-planner=Дозволяє розміщувати та видаляти зони, які можна використовувати для позначення ділянок або впливу на програмовані транспортні засоби. Утримуючи клавішу Shift, перетягуйте зони з області.

