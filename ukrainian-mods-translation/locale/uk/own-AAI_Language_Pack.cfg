basic-logistics-1=Швидші та гнучкіші способи транспортування.
basic-logistics-2=Швидші та гнучкіші способи транспортування.
burner-mechanics=Прості двигуни, які дозволяють створювати багато пристроїв з автономним живленням.
electricity=Основи: Твердопаливні генератори, електродвигуни та малі опори ЛЕП.
electronics=Електронні схеми відкривають багато можливостей.
electric-lab=Наука, що працює на електриці
basic-fluid-handling=Основи управління рідинами в трубопроводах.
steam-power=Більш ефективне використання енергії пари.
concrete-walls=Міцніші стіни з бетону.
steel-walls=Ще міцніші стіни з дуже високою стійкістю до пошкоджень. Шипи також завдають невеликої шкоди нападнику.
engine=Двигуни з високим співвідношенням потужності до ваги для транспортних засобів і робототехніки.
electric-engine=Великі багатофазні безщіточні двигуни.
automobilism=Швидкісні транспортні засоби.
fuel-processing=Переробляє будь-яке хімічне паливо на перероблене паливо. Енергетична цінність підвищується на __1__% і має гарне прискорення транспортного засобу.
sand-processing=Дроблення, подрібнення та фільтрація сировини на чистий пісок.
glass-processing=Перетоплення піску на скло.
industrial-furnace=Більша, швидша і з більшою кількістю модулів, ніж електрична піч. На відміну від більшості інших печей, рецепт потрібно вибирати (дозволяє працювати з рідинами).
area-mining-drill=Велика кар'єрна установка зі збільшеним радіусом дії, швидкістю та додатковими слотами для модулів.
medium-electric-pole=Більш гнучкі способи розподілу електроенергії.
aai-loader-lubricated-shared=Переміщує предмети в або з контейнера або машини зі швидкістю повного конвеєра еквівалентного ярусу. Не потребує витрат енергії.\n[img=tooltip-category-consumes] [font=default-bold][color=#f5cb48]Споживає[/color][/font] __1__[fluid=__2__] на хвилину
aai-loader-expensive-shared=Переміщує предмети в або з контейнера чи машини з такою швидкістю, що дозволяє завантажити повний конвеєр відповідного рівня без затримок. Не потребує енергії.
programmable-structures=Скануйте плитки, щоб виявити ресурси, ворогів і споруди. Автоматично розміщуйте зони за координатами. Скануйте положення плиток зон.
tanks=Потужна наступальна машина з важкою бронею та гарматою.
vehicle-deployment=Автоматично розгортати транспорт з позиції транспорту. Комбінатор, що додається, дозволяє вам встановити UnitData, з якими розгортаються транспорти, щоб ви могли змінювати їхні налаштування обміну інвентарем.
vehicle-depot=Звідси транспорти можуть швидко скидати або забирати товари. Зміна запасів відбувається на основі даних одиниці транспорту та змінених налаштувань депо (комбінатор).
programmable-vehicle-structures=Скануйте стан та інвентар транспорту. Автоматично надсилати команди транспорту, щоб він рухався в певному напрямку, за координатами або слідував за гравцем чи іншим транспортом. Скануйте або встановлюйте UnitData, щоб змінити пам'ять транспорту і змінити налаштування обміну інвентарем.
position-beacon=Статичний маяк (комбінатор), який виводить свій ідентифікатор і позицію. Може використовуватися як маршрутна точка за допомогою пульта дистанційного керування.
aai-signal-transmission=Дозволяє надсилати та приймати сигнали логічної мережі без обмежень у відстанях. Працює навіть між різними поверхнями або планетами.
vehicle-flame-tank=Танк з вогнеметом, хорошим прискоренням, пристойною бронею та вогнетривкістю.
vehicle-flame-tumbler=Дуже швидкісний таранний автомобіль, захищений від пошкоджень при зіткненні та озброєний вогнеметом.
basic-vehicles=Основні транспорти для переміщення речей. Вони не мають швидкості високопродуктивних автомобілів чи міцності танків.
ironclad=Важкий металевий човен, озброєний далекобійним мінометом та гарматою. Великий розмір вантажу дозволяє перевозити предмети між островами. Зброя може використовувати як мінометні, так й танкові боєприпаси. Найпростіше сідати та виходити з Ironclad з мілководдя (мод Alien Biomes).
vehicle-laser-tank=Швидкий і смертоносний танк з лазерною гарматою. Може стріляти сфокусованими / проникаючими променями для ураження однієї цілі / площі.
vehicle-miner=Екскаватор, який може видобувати тверді корисні копалини, такі як вугілля, камінь, руди, а також рубати дерева.
vehicle-miner-mk2=Швидше видобуток, швидше водіння, більша потужність, краща ефективність, менше забруднення.
vehicle-miner-mk3=Швидше видобуток, швидше водіння, більша потужність, краща ефективність, менше забруднення.
vehicle-miner-mk4=Швидше видобуток, швидше водіння, більша потужність, краща ефективність, менше забруднення.
vehicle-miner-mk5=Швидше видобуток, швидше водіння, більша потужність, краща ефективність, менше забруднення.
vehicle-warden=Високопотужна машина підтримки з радаром та електрозарядною гарматою. Може збирати наземні об'єкти на великій території, а також ремонтувати транспорти та споруди поблизу за допомогою ремонтних пакетів.

