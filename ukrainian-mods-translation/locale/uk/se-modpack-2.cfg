[setting-description]
kry-spidertron-squad1=Налаштування оснащення зброєю для кожного павукотрона. Вводиться як послідовність до 6 видів зброї, розділених пробілами, комами чи крапками з комою, з такими допустимими значеннями:\nsmg, shotgun, flamethrower, tank, rocket\n\nПеред списком зброї можна додати прізвисько — у грі воно відображатиметься як "прізвисько" Оснащення павукотрона. Інакше — "Оснащення павукотрона N"
kry-spidertron-squad1-space-age=Налаштування оснащення зброєю для кожного павукотрона. Вводиться як послідовність до 6 видів зброї, розділених пробілами, комами чи крапками з комою, з такими допустимими значеннями:\nsmg, shotgun, flamethrower, tank, rocket, tesla, railgun\n\nПеред списком зброї можна додати прізвисько — у грі воно відображатиметься як "прізвисько" Оснащення павукотрона. Інакше — "Оснащення павукотрона N"
kry-spidertron=Допустимі значення: [необов'язкове прізвисько]: smg, shotgun, flamethrower, cannon, rocket
kry-spidertron-space-age=Допустимі значення: [необов'язкове прізвисько]: smg, shotgun, flamethrower, tank, rocket, tesla, railgun

