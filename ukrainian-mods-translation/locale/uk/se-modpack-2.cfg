[mod-setting-description]
tree-healing-operation-interval=Час (у тіках) між перевірками підчанка на дерева або лікуванням партії дерев.\n\nЯкщо гра підгальмовує й інші параметри не допомагають, збільшення цього числа має робити це рідше.
tree-healing-chunk-selection-method=Як вибираються чанки, дерева в яких лікуються. Випадковий виглядає природніше, а послідовний легше відстежувати.\n\nНе впливає на продуктивність. Це суто справа смаку.
tree-healing-chunk-subdivisions=На скільки частин ділиться кожен чанк під час пошуку дерев. Число задається для однієї сторони, тож фактична кількість підчанків — це його квадрат (2 поділи = 4 підчанки тощо).\n\nЯкщо гра підгальмовує, спробуйте збільшити це число.
tree-healing-trees-per-heal=Кількість дерев, що лікуються за одну партію.\n\nЯкщо гра підгальмовує, спробуйте зменшити це число.
tree-healing-mark-active-chunk=Чи позначати на мапі шпилькою чанк, з яким мод зараз працює. Корисно для налагодження чи просто щоб спостерігати за роботою моду.\n\nНе впливає на продуктивність. Це суто справа смаку.
kry-spidertron-damage=Впливає на модифікатор затримки послідовної стрільби, даючи бонус шкоди до цього значення залежно від кількості зброї. Числа базуються на швидкості перезаряджання ракетниці. Ванільний павукотрон має модифікатор ×2.
kry-spidertron-nickname=Прізвисько для оригінального павукотрона. Відображатиметься як "прізвисько" Оснащення павукотрона. Якщо порожньо — "Оснащення павукотрона 1"
flow-config-denylist=Список назв труб через кому, до яких Flow Config не застосовуватиметься. Якщо під час завантаження чи гри виникає помилка з певним типом модових труб, додайте його сюди! (наприклад, factory-,mypipe)
fp-freeze-factory=Якщо ввімкнено, усі машини, конвеєри, потяги, турелі й вороги на поверхні вашої справжньої фабрики перестають оновлюватися, поки хтось перебуває в кімнаті планування, і продовжують точно з того самого стану, коли ви виходите. Ваш справжній персонаж ніколи не переміщується й не зачіпається — на поверхню планування вирушає лише тимчасове тіло-замінник, — тож цей параметр стосується лише машин. У мультиплеєрі це заморожує спільну поверхню для всіх, хто на ній, а не лише для вас.
fp-freeze-evolution=Якщо ввімкнено, фактор еволюції ворогів (кусак/плювак) перестає зростати, поки хтось перебуває в кімнаті планування, і зростає далі, коли виходить останній планувальник. Призупиняється лише зростання еволюції — забруднення, лігва й усе інше не зачіпаються. У мультиплеєрі це спільне: еволюція продовжиться лише тоді, коли вийдуть усі планувальники.
fp-persist-inventory=Типово ВИМКНЕНО. Вибір предметів дає будь-який предмет безкоштовно й без обмежень, тож усе, що лишається у вас у руках під час виходу з кімнати планування, зазвичай викидається — інакше це був би простий спосіб безкоштовно дублювати предмети в справжній інвентар. Вмикайте, лише якщо вам саме це потрібно (наприклад, у творчому/пісочничному збереженні); це особистий вибір кожного гравця, що ніколи не впливає на інших.
fp-use-planning-force=Типово УВІМКНЕНО. У кімнаті планування вас зазвичай переводять в окрему фракцію, щоб вікно виготовлення показувало всі рецепти. Вимкніть, якщо інший мод вилітає, коли змінюється фракція гравця (для TaskList мод уже вимикає це автоматично). Усе працює й без цього; вікно виготовлення тоді показує лише те, що відкрила ваша фракція.
fp-show-top-button=Для кожного гравця. Вимкніть, щоб сховати кнопку на верхній лівій панелі кнопок модів. Гаряча клавіша Ctrl+P і кнопка на панелі ярликів працюють і далі.
fp-floor-style=Для кожного гравця, лише зовнішній вигляд. "Лабораторна шахівниця" — оригінальна двоколірна підлога. Інші варіанти малюють спокійну однорідну підлогу, на яку приємніше дивитися під час довгих сесій.
spitter-spit-blockable=Плювки плювак можуть блокуватися стінами. Перетворює плювки плювак на снаряди, які можна заблокувати. Якщо вимкнено, плювок — це струмінь, що дугою перелітає через стіни.
worm-spit-blockable=Плювки черв'яків можуть блокуватися стінами. Перетворює плювки черв'яків на снаряди, які можна заблокувати. Якщо вимкнено, плювок — це струмінь, що дугою перелітає через стіни.
rockets-blockable=Ракети можуть стикатися з деревами й ворожими стінами. Добре для PvP.
pools-affect-structures=Калюжі, як-от кислотні калюжі черв'яків, діють на споруди.
pools-affect-flying=Калюжі, як-от кислотні калюжі черв'яків, діють на літаючих юнітів (їдкі випари).
shotguns-hit-friendly=Якщо ввімкнено, дріб може влучати в дружні споруди, як-от дерев'яні скрині.
unit-speed=Швидкість кусак і плювак, 100 — без змін.
unit-health=Здоров'я кусак і плювак, 100 — без змін.
unit-range=Дальність плювак, 100 — без змін.
worm-health=Здоров'я черв'яків, 100 — без змін.
worm-range=Дальність черв'яків, 100 — без змін.
spawner-health=Здоров'я лігв кусак і плювак, 100 — без змін.

