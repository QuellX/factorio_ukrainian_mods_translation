[mod-description]
space-exploration-official-modpack=Офіційна збірка модів Space Exploration. Містить обов'язкові й рекомендовані моди. Якщо вам не потрібні всі рекомендовані моди, не використовуйте збірку: просто встановіть основний мод Space Exploration, і всі потрібні залежності встановляться самі.
factory-planning-room=Натисніть гарячу клавішу чи кнопку, щоб відкрити приватну поверхню планування, над якою ви літаєте й будуєте з вільною камерою (без редактора мапи, без прав адміністратора й без власного тіла), поки ваша справжня фабрика заморожена (не вся гра), а справжній персонаж нікуди не рухається. Вибір предметів із пошуком дає будь-який розміщуваний предмет безкоштовно й без обмежень — і нічого не позначається дослідженим. Миттєва побудова за кресленнями, кілька аркушів з назвами (перехід/дублювання/експорт у креслення/видалення), панель статистики аркуша (кількість об'єктів, швидкості виробництва предметів, підказки "що додати" й оцінка енергобалансу), індикатор заморожування, підтримка Space Age під час заморожування й будівництва, напівпрозорий HUD, перемикач мови EN/RU і вбудований посібник INFO з посиланням на Discord. Вийдіть будь-коли, щоб повернутися точно туди, де зупинилися.
combat-mechanics-overhaul=Переробляє деякі бойові механіки й налаштування зіткнень. Стіни блокують більшість ворожих снарядів, що летять над ними, як-от плювки плювак і ворожі дробові набої. Ваші снаряди й далі без проблем пролітають над власними стінами. Літаючі юніти й машини можуть літати над стінами, але в них усе одно можна влучити снарядами. Юнітам і спорудам призначаються відповідні теги (біологічний/механічний і літаючий/наземний рухомий/наземний нерухомий), щоб певні ефекти на них діяли або ні. Має кілька параметрів, зокрема щоб на літаючих юнітів і машини не діяли кислотні калюжі на землі. Також надає іншим модам деякі утиліти зіткнень.

