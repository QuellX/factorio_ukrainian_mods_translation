[entity-description]
shield-projector=Створює захисне силове поле. Потрібно більше енергії, коли проєктор заряджається або коли щит отримує пошкодження. Може блокувати ворожі снаряди, якщо встановлено мод "Оновлення бойової механіки".\nПеремикання щита за допомогою [__CONTROL__shield-projector-mode-toggle__].

