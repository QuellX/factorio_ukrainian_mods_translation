[tips-and-tricks-description]
angels-petrochem=Мод, що перебудовує нафтохімічну переробку, роблячи її складнішою та псевдореалістичною (без надмірностей).\nСировину потрібно обробляти й перетворювати в хімічних виробничих ланцюжках, щоб отримати:\n__1__\n Мод також додає нову свердловину: __2__
angels-air-filtering=Кисень та азот — ключові базові матеріали для багатьох промислових процесів, частина з яких є в цьому моді. Наприклад, використання [fluid=angels-gas-oxygen] замість звичайного повітря підвищує ефективність виплавки. Тому вміння розділяти повітря на [fluid=angels-gas-oxygen] та [fluid=angels-gas-nitrogen] — ключова технологія.
angels-air-filtering-notes=\n\n[font=default-bold]ПРИМІТКА[/font]: Атмосфера Землі складається приблизно з 21% кисню та 79% азоту.\nЦей мод використовує інше співвідношення, щоб зменшити марнування азоту на початку гри та кисню наприкінці. Ми можемо собі це дозволити, бо Наувіс — не Земля.
