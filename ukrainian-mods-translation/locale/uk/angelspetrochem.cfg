[technology-description]
kovarex-enrichment-process=Усе потрібне, щоб використати надлишки урану-238. Перетворюйте його на плутоній-239 у циклах розмноження.
angels-thorium-power=Усе потрібне для використання енергетичних циклів на основі торію. Якщо у вас є надлишки плутонію-239 чи кюрію-245, можна отримати ще й приріст енергії.
angels-fusion-power=Усе потрібне для запуску й підтримання термоядерної енергії за допомогою мюонів і дейтерію.
angels-fluid-control=Надає засоби для керування потоком рідин.
angels-basic-chemistry=Знання для виробництва й поводження з базовими хімічними складниками.
angels-water-chemistry=Збагачення та обробка важкої води.
angels-sulfur-processing=Сірка — дуже реакційноздатний неметал з широким спектром застосувань.
angels-nitrogen-processing=Азот — неметал з широким спектром застосувань.
angels-chlorine-processing=Хлор — реакційноздатний галоген з широким спектром застосувань.
angels-advanced-gas-processing=Альтернативні способи фракціонування короткоцепних вуглеводнів.
angels-oil-processing=Ключова технологія переробки довгоцепних вуглеводнів.
angels-advanced-oil-processing=Альтернативні способи фракціонування довгоцепних вуглеводнів.
