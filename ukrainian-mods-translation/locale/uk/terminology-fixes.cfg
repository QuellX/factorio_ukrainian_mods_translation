[tips-and-tricks-item-description]
mis-introduction=Натисніть кнопку на панелі швидких дій або __CONTROL__mis-give-module-inserter__, щоб отримати вкладач модулів. Якщо ви тримаєте модуль, його буде вибрано.\nУтримуйте __CONTROL__select-for-blueprint__ і протягніть мишею, щоб заповнити вибрані машини модулями.\nПротягніть __CONTROL__reverse-select__, щоб запитати один модуль.\nПротягніть __CONTROL__select-for-cancel-deconstruct__, щоб очистити запити модулів.\n__CONTROL__mis-cycle-module-forwards__ і __CONTROL__mis-cycle-module-backwards__ перемикають модулі по колу.\n[item=mis-insert-remove-modules] — вийняти модулі.

