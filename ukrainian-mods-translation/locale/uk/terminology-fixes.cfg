[item-description]
vehicle-chaingunner=Транспорт Chaingunner — це, по суті, кулеметна турель на гусеницях. Його можна автоматизувати за допомогою мода Programmable Vehicles.
electroshock-pulse-ammo=Електричний імпульс по площі, призначений оглушати й знерухомлювати біологічних ворогів. Вистрілюється з турелі «Електроболтер» Наглядача.
unit-remote-control=Виділяйте транспорт звичайним протягуванням. Клацання з Shift надсилає команду пошуку шляху (використовує ШІ кусак, тож може поводитися трохи незграбно). Клацання з Shift по області розподіляє команди по вибраній області: що більша область, то менше юніти штовхаються між собою. Якщо після вашої команди транспорт отримає нову команду від вежі керування юнітами, вашу команду буде скасовано.
unit-control=Введіть ID транспорту, як для сканера юнітів, плюс командний сигнал. Прямі командні сигнали — кут і швидкість або зміщення в під-клітинках X і Y (перетворюються на кут і швидкість). Задайте непряму команду пошуку шляху координатами X-клітинки та Y-клітинки (використовує ШІ кусак, тож може поводитися трохи незграбно).

[entity-description]
vehicle-chaingunner=Транспорт Chaingunner — це, по суті, кулеметна турель на гусеницях. Його можна автоматизувати за допомогою мода Programmable Vehicles.
unit-control=Введіть ID транспорту, як для сканера юнітів, плюс командний сигнал. Прямі командні сигнали — кут і швидкість або зміщення в під-клітинках X і Y (перетворюються на кут і швидкість). Задайте непряму команду пошуку шляху координатами X-клітинки та Y-клітинки (використовує ШІ кусак, тож може поводитися трохи незграбно).
kr-crash-site-building=[color=red]Увага![/color] Якщо розібрати цю будівлю, ви отримаєте трохи сировини, але збудувати її знову не зможете!
se-electric-boiler=Створює пару з води, використовуючи електричну енергію. Процес енергоефективний на 90%, тому ви не отримаєте енергію. Високотемпературна пара використовується для зберігання енергії. Низькотемпературна пара використовується для виготовлення.

[technology-description]
vehicle-chaingunner=Кулеметна турель на гусеницях для мобільної оборони та штурму ворожих баз.
gates=Базові секції стіни, що відчиняються за потреби. Можна керувати логічною мережею.
dect-advanced-gate=Міцніші за звичайні ворота, ці вдосконалені секції стіни відчиняються за потреби. Можна керувати логічною мережею.
kr-enriched-ores=Збагачення руд перед виплавкою значно підвищує вихід продукції, але дає побічні продукти.
se-space-elevator=Може використовувати дроти і поїзди між поверхнею планети або місяця та її орбітою. Дивись Космічні ліфти в [img=virtual-signal/informatron] Інформатроні для отримання додаткової інформації [__CONTROL__informatron__].
se-electric-boiler=Створює пару з води, використовуючи електричну енергію. Процес енергоефективний на 90%, тому ви не отримаєте енергію. Високотемпературна пара використовується для зберігання енергії. Низькотемпературна пара використовується для виготовлення.
se-bio-upgrade-dexterity=Збільшує швидкість виготовлення.

[mod-setting-description]
deadzone-construction-denial-range=Створює нічийну землю між ворожими базами. Забороняє будувати споруди в межах досяжності наявних ворожих споруд. Вороги не можуть будувати лігва чи черв'яків надто близько до ваших турелей, а ви не можете будувати турелі надто близько до них.
waterway_reach_increase=Збільшення досяжності гравців при утриманні водних шляхів, буїв, портів тощо. Дозволяє встановлювати та зносити водні шляхи з великої відстані. Встановіть значення "0", щоб вимкнути збільшення досяжності.
cen-auto-ghost-cursor=Коли предмет у курсорі закінчується, замінювати його курсором-привидом. Замінювати курсор-привид справжнім предметом, коли той потрапляє в інвентар.
dectorio-signals=Вмикає додаткові сигнали для ліхтарів і логічної мережі
ick-prepare-uninstall=[img=utility.danger_icon] Обережно! Це налаштування ввімкне все вимкнене спорядження в усьому збереженні. Можна ввести один із чотирьох варіантів:\n\n- [color=yellow]uninstall[/color] = дозволяє безпечно видалити цей мод. \n- [color=yellow]active-defense-equipment[/color] = вмикає всю особисту лазерну оборону, дозволяючи безпечно вимкнути налаштування __1__. \n- [color=yellow]belt-immunity-equipment[/color] = вмикає все спорядження для ігнорування конвеєрів, дозволяючи безпечно вимкнути налаштування __2__. \n- [color=yellow]night-vision-equipment[/color] = вмикає всі пристрої нічного бачення, дозволяючи безпечно вимкнути налаштування __3__.\n\nЯкщо видалити мод або вимкнути згадані налаштування, не скориставшись спершу цим, усе вимкнене спорядження буде втрачено.
se-electric-boiler=Додає в гру електричний котел.
se-scan-max-range=Супутникове сканування: Максимальна можлива дальність сканування (у клітинках) від початкової точки поверхні. Планети ніколи не скануватимуться за межами їхнього радіуса, максимальний радіус планет 10000 клітинок. Значення понад 10000 клітинок застосовуються тільки до космічних зон.

[aai-programmable-vehicles]
page_aai-programmable-vehicles_text_1=[font=heading-2][color=#ffe6c0]Способи використання мода[/color][/font]\nІснує багато речей, які програмовані транспортні засоби можуть зробити лише кількома клацаннями миші, що може зробити їх вартими випадкового встановлення у грі. Ви можете використовувати мод у дуже простий спосіб, або ви можете довести програмовані транспорти до крайнощів і спробувати автоматизувати якомога більше за допомогою транспортів. Майте на увазі, що велика кількість автоматизованих транспортів може вимагати витрат на UPSі не дуже добре підходить для мегабази. \n\n[font=heading-2][color=#ffe6c0]Основні дії[/color][/font]\nЩоб керувати одиницями, ви повинні спочатку створити ШІ-версію транспортного засобу, а потім розмістити його на землі.\n\nНатисніть Y, щоб отримати доступ до пульта дистанційного керування одиницею або пульта дистанційного керування маршрутом.\n\nМаючи пульт дистанційного керування одиницею в руках, клацніть і перетягніть область виділення, щоб вибрати одиниці.\n\nВиділення може бути збережено клавішами Ctrl+1 або будь-яким номером від 1 до 9. \n\nВибір можна завантажити комбінацією клавіш CTRL + SHIFT + 1 або будь-яким числом від 1 до 9.\n\n(Примітка: Якщо у вас встановлено Space Exploration, ці клавіші конфліктуватимуть із закріпленими локаціями, тому вам слід переприв'язати один набір.)\n\nЩоб віддати юнітам команду, натисніть клавіші Shift+клацніть на землі, коли юніти вибрані, щоб змусити їх попрямувати туди. Ви також можете перетягнути область замість клацання, щоб розподілити юнітів по вибраній області.\n\nЯкщо ви відправите команду на порожню місцевість, юніти спробують туди піти. Якщо ви натиснете на іншу одиницю ШІ, вона спробує слідувати за нею. Якщо ви натиснете на гравця, вони спробують слідувати за гравцем.\n\nЯкщо ви дасте команду слідувати кільком юнітам, вони спробують створити захисну бульбашку і утримувати певний кут замість того, щоб слідувати під будь-яким кутом.\n\nЮніти зазвичай намагатимуться використовувати пошук шляху, щоб дістатися до цільового місця. Якщо це не вдається, вони намагаються їхати прямо, поки не зіткнуться з чимось, а потім знову намагаються знайти шлях.\n\nБільшість юнітів завдають набагато меншої шкоди від удару, ніж у ванілі (достатньо, щоб спрацювала подія пошкодження, і код зміг переключити режими). Танки і вогнемет все ще завдають багато шкоди від удару, тому будьте обережні, автоматизуючи їх всередині баз.\n\nВибравши інструмент прокладання шляху (двічі натисніть Y), ви можете розмістити маршрутні точки на вибраному шляху (він створить новий шлях, якщо такого шляху не існує). Щоб перевірити це, створіть 3 точки на нерівній траєкторії за межами бази. Після створення маршрутних точок ви можете вибрати їх в інтерфейсі для редагування. Зауважте, що ви можете змінити маршрутну точку з позиції, щоб націлити її на іншу машину ШІ.\n\nЩоб призначити юніта на шлях, переконайтеся, що потрібний шлях завжди показує початкову маршрутну точку за допомогою параметрів шляху. Виберіть юніт за допомогою інструмента «Дистанційний контролер юніта», а потім віддайте йому наказ рухатися безпосередньо на початкову точку шляху. Якщо на шляху є інший транспортний засіб, депо або гравець, вони можуть заважати виконанню наказу, тож початкові точки шляху на вільних ділянках є надійнішими.\n\n[font=heading-2][color=#ffe6c0]Деякі основні випадки використання[/color][/font]\nДе мій транспорт? Якщо ви прив'язали свій автомобіль до групи управління 1 (за допомогою Ctrl+Shift+1), то натискання Ctrl+1 виділить ваш автомобіль. Клацніть на собі клавішею Shift, і вона під'їде до вас, і буде слідувати за вами.\n\nОсобистий водій: Можливо, точне водіння у вашій базі просто не для вас. Переведіть машину в режим «AI On» і скажіть їй, куди їхати. Він відвезе вас туди, куди вам потрібно, а ви зможете зосередитися на інших справах, поки його везуть.\n\nПерсональна доставка та збір сміття: Шлях йде від вас до місця вивантаження, потім до місця забирання і назад до вас. Ви можете поставити свій транспорт на цьому шляху, щоб він вивіз сміття, яке ви йому дали, а потім забрав припаси і доставив їх вам.\n\nБазова атакуюча сила: Візьміть групу чайнгунерів і скосіть ворожі бази.\n\nОсновна атакуюча формація: Накажіть групі чайнґуннерів прибути до місця розташування вашого персонажа. Вони сформують навколо вас захисне коло. Ви можете рухатися до ворожих баз пішки або на власному транспорті, в той час як інші транспорти намагатимуться підтримувати коло.\n\n[font=heading-2][color=#ffe6c0]Додаткові ігрові механіки[/color][/font]\nНічийна земля: Ви і ваші вороги обмежені в тому, де ви можете розміщувати нові споруди. Ворожі черв'яки та лігва не можуть з'являтися в радіусі дії ваших споруд. Так само ви не можете будувати турелі в зоні досяжності ворожих лігв або черв'яків. Ворожі кусаки зариваються в землю біля лігв і руйнують будівництво над ними.
page_vehicles_text_1=[font=heading-2][color=#ffe6c0]Базовий ігровий транспорт[/color][/font]\n\n[font=heading-3]Автомобіль[/font]\nАвтомобіль добре підходить як особистий транспорт, якщо у вас немає доступу до Вогнемета. Невелика група машин може стати гарною силою швидкого реагування для полювання на невеликі групи кусак, які обійшли захист, і знищення їх до того, як вони досягнуть чогось важливого.\n\n[font=heading-3]Танк[/font]\nТанки можуть створити потужну атакувальну формацію. Будьте обережні з боєприпасами, які вони використовують, додано 2-й варіант боєприпасів, які не завдають пробиття і випадкових пошкоджень транспортам, які вони перестрілюють. Зональна шкода може доповнювати шкоду від лазерних танків і танків з полум'ям.\n\n[font=heading-2][color=#ffe6c0]Транспорт AAI[/color][/font]\n\n[font=heading-3]Тягач[/font]\nБазовий транспорт, призначений для перевезення вантажу. Він може ініціювати обмін інвентарем із сусідніми транспортами, наприклад, зі складом транспортів. Це дозволяє йому збирати ресурси у шахтарів і доставляти їх на склади, або збирати паливо і боєприпаси зі складу і доставляти їх атакуючим формуванням.\n\n[font=heading-3]Гірник[/font]\nВидобуває руду, збирає врожай, дерева, поглинає каміння. Існує 5 рівнів, які покращують швидкість видобутку, швидкість пересування, вантажопідйомність та інші речі. Хоча ви можете покладатися у видобутку корисних копалин виключно на шахтарів, це не обов'язково робити лише тому, що ви встановили цей мод. Шахтарі можуть бути особливо корисними в ситуаціях, коли цільові ресурси віддалені і довгу статичну лінію постачання буде важко захистити (особливо з модом Rampant AI), але деякі машини охорони біля ресурсів і захисні деталі для тягача будуть менш вразливими. Шахтарі також корисні для видобутку невеликих родовищ ресурсів там, де немає сенсу створювати повноцінну залізничну станцію.\n\n[font=heading-3]Чейнґуннер[/font]\nЯкщо ви візьмете кулеметну турель і прикріпите до дна кілька перевернутих транспортних конвеєрів, то отримаєте щось на кшталт чейнґаннера. Він добре підходить для зачистки ворожих баз на початку гри. Наприкінці гри кілька штук можуть бути корисними для знищення слабших ворогів, на яких не варто витрачати важку зброю.\n\n[font=heading-3]Наглядач[/font]\nВдосконалений транспорт. Він має ті ж можливості для перевезення інвентарю, що і тягач, але якщо тягач чудово підходить для доставки, то наглядач часто краще доглядає за невеликою групою транспортних засобів або патрулює периметр бази. Наглядач має радар, тому мати 1 машину з дистанційною атакою корисно, щоб бачити, куди ви прямуєте. Він може стати хорошим сховищем боєприпасів для сусідніх транспортів, тому, коли в інших транспортах закінчуються боєприпаси або паливо, він може дати їм дозаправку. У нього є ремонтний промінь, тому якщо в інвентарі є ремонтні пакети, він може відремонтувати сусідні транспорти або споруди. Наглядач, який патрулює за стіною, може підтримувати її в належному стані без допомоги будівельних роботів. Зброя наглядача наносить по цілі імпульс АОЕ, який уповільнює ворогів. Уповільнення ускладнює атаку інших машин перед смертю і може зробити невелику групу машин набагато більш живучою.\n\n[font=heading-3]Полум'яний танк[/font]\nПолум'яний танк - це хороший танк для передньої лінії. Він має невелику дальність стрільби, але дуже важку броню і достатню швидкість, щоб залишатися в авангарді типової формації. Два варіанти боєприпасів: вогнемет або реактивний вогонь. Якщо ви використовуєте вогнеметні боєприпаси, будьте обережні з іншими транспортами, що проїжджають через вогонь. Полум'яний танк вогнестійкий, але більшість інших транспортних засобів - ні.\n\n[font=heading-3]Лазерний танк[/font]\nВажкий танк, який не жертвує надто великою швидкістю. Потужна лазерна гармата завдає величезної шкоди. Вона міцніша і завдає більшої шкоди по одній цілі, ніж стандартний танк, але ушкодження від вибухових снарядів все одно може бути корисним.\n\n[font=heading-3]Факел полум'я[/font]\nФакел полум'я надзвичайно швидкий і створений як таранна машина. Він в першу чергу призначений для ручного керування поза базою, де ви можете нестримно їздити і пробивати перешкоди, не турбуючись про супутні пошкодження. Вогнемет діє як допоміжна зброя, а основною зброєю є таран. Швидкість транспорту означає, що в більшості випадків полум'я падає позаду вас, але це корисно для спалення сліду кусак, що переслідують вас. При автономному використанні вогнемет є чудовим особистим транспортним засобом і може безпечно проїхати через вашу базу. Факели можуть використовуватися в транспортних формаціях, але вони крихкі порівняно з іншими транспортами на передовій.\n\n[font=heading-3]Незабаром[/font] \nЗаплановані й інші транспортні засоби, такі як кораблі, кораблі-двигуни та інші незвичайні транспортні засоби.\n\n[font=heading-2][color=#ffe6c0]Сторонні транспортні засоби[/color][/font] \nІснує багато транспортних засобів, виготовлених іншими виробниками модів, які працюють з програмованими транспортами AAI. Остерігайтеся зловживати будь-якими транспортами з інших модів, які мають багато зброї або надмірну потужність. Якщо оптимальна формація транспортів не містить принаймні 3 типи транспортів, спробуйте обмежитися більш збалансованим набором опцій.

