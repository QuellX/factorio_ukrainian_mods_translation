zonelist-resources-disclaimer-tooltip=Усі значення ресурсів є оцінними, заснованими на щільності елементів.\nВони відповідають налаштуванням генерації мапи в грі.\nФактичні розміри родовищ ресурсів будуть різнитися, і їхня поява може бути заборонена через воду, радіус поверхні або певні вимоги до клітинок.
page_space_exploration_text_1=Ласкаво просимо в дослідження космосу (Space Exploration). У моді вже багато всього, але він все ще має [font=default-bold]експериментальний[/font] статус і перебуває у стадії активної розробки. Можуть бути помилки.\n\n[font=heading-2][color=#ffe6c0]Експериментальний статус?[/color][/font]\nSpace Exploration як і раніше, швидко змінюється, і я весь свій час вкладаю в розробку ключових функцій розширення сумісності мода. [color=red]Не рекомендується грати з модами, відмінними від необхідних та рекомендованих.[/color]\n\nПоки що в експериментальному статусі: якщо мод викликає такі проблеми, як пошкодження гри/файл збереження, збої, неприпустиме дерево технологій або основний ігровий процес, він буде швидко позначений як несумісний для захисту нових гравців. Це означає, що якщо ви використовуєте багато модів, більш ймовірно, що один з них може бути позначений як несумісний, пізніше через проблему, яку ви ще не виявили. Ви, звичайно, можете редагувати свій файл info.json, щоб спробувати несумісні моди, але ви робите це на свій страх та ризик: якщо стан вашої гри стане неграбальним, у цьому випадку я не зможу вам допомогти.\n\nДеякі додаткові відомості щодо сумісності модів можна знайти на вікі-сайті Space Exploration. Якщо ви хочете допомогти з сумісністю модів, зв'яжіться з нами Discord, але також майте на увазі, що це не буде високим пріоритетом до пізніших етапів розробки Space Exploration.\n\n[font=heading-2][color=#ffe6c0]Рекомендовані моди[/color][/font]\n • Module Inserter. Дозволяє вам вставляти модулі в машини із супутникового режиму.\n • Grappling Gun. Дозволяє вам перестрибувати через будинки, озера, і виходити з бою, якщо вас сповільнили. У космосі можна повернутися на космічну платформу, якщо впадете. Також дозволяє сідати на космічні кораблі (особливо корисно, якщо вони рухаються).\n • Inserter Fuel Leech. Це тільки для паливного етапу AAI, дозволяє твердопаливним маніпуляторам брати собі паливо з об'єкта, з якого вони беруть предмети.\n • Text Plates. Дозволяє наносити текст на землю, що є корисним для маркування планет, станцій, зон стикування космічних кораблів і т.д.\n • Combat Mechanics Overhaul. Допомагає із захистом, коли ви за межами планети, якщо включена опція "Стіни блокують плювки". Стіни дешевше ремонтувати, ніж турелі.\n • Bullet Trails. Малює траси куль, щоб ви могли бачити, куди вони летять, або в кого стріляють ваші турелі.\n • Milestones. Відслідковує етапи розвитку і як швидко ви їх досягаєте.\n• FNEI або Recipe Book. Перегляд рецептів.\n\n[font=heading-2][color=#ffe6c0]Моди, що змінюють гру[/color][/font]\nSpace Exploration сам собою вимагає від 70 до 700 годин, загалом близько 400 годин. Не рекомендується грати з іншими модами, які сильно змінюють гру, оскільки вони мають тенденцію порушувати більшу частину балансу ресурсів на планеті, логістики предметів, планів будівництва та загального прогресу гри. Якщо ви вперше граєте в Space Exploration, вам слід уникати інших великих модів, інакше ви не дізнаєтесь, що було зламано.\n\nБільшість інших модів, що змінюють гру, позначені як несумісні, якщо дерево технологій значно порушене. Довгостроковий намір у тому, щоб додати сумісність із кількома обраними модами, переконавшись, що й основні механіки та особливості збережені задоволення розробників модів.\nKrastorio 2 є прикладом цієї роботи, яка вже значною мірою виконана.\n\n[font=heading-2][color=#ffe6c0]Рекомендовані налаштування[/color][/font]\nВи ПОВИННІ включити всі клітинки ландшафту мода Alien Biomes, інакше гра збоїть на пізніх стадіях.\n\nОскільки гра триває довше, ніж зазвичай, рекомендується розпочинати гру з низьким коефіцієнтом еволюції ворогів.\n\nВи не повинні встановлювати високі налаштування ресурсів для своєї стартової планети, якщо ви не граєте з ресурсомісткими рецептами, такими як висока складність рецептів або режим марафону. Якщо ресурси встановлені надто високо, це зменшить потребу в розширенні на інші планети.\n\n[font=heading-2][color=#ffe6c0]Корисні URL-адреси[/color][/font]\nПодивіться вікі по Дослідженню космосу тут: [color=blue]https://spaceexploration.miraheze.org[/color]\nОтримайте допомогу або стежте за розвитком у Discord: [color=blue]https://discord.gg/ymjUVMv[/color]\n\nНа цей мод я витратив понад 4000 годин. Якщо він вам подобається, подумайте про підтримку мене на Patreon: [color=blue]https://www.patreon.com/earendel[/color]
page_beacons_text_1=[color=#ffe6c0][font=heading-2]Перевантаження маяка[/font][/color] [img=virtual-signal/se-beacon-overload]\nПеревантаження маяка - це переробка механіки маяка в Factorio. На виробничі машини може впливати лише 1 маяк, якщо на них впливає більша кількість маяків, вони перевантажуються та зупиняють виробництво.\n\nЦя переробка дозволяє використовувати більше модулів у маяках та сприяє використанню більш потужних модулів як у маяках, так і у складальних автоматах для отримання максимальних бонусів. Ця зміна також дозволяє та просуває ширший діапазон дизайнів фабрик.\n\nБазовий маяк окремо набагато потужніший, ніж "ванільний" маяк, але не може складати ефекти кількох маяків на одній машині, тому максимальне посилення, яке ви можете забезпечити, менше в порівнянні з "ванільним". Більш потужні маяки здатні набагато перевершувати максимальне прискорення машини, доступне в ванільній грі.\n\nПочинаючи з Маяка великого охоплення, гравці можуть відчути значну економію модулів, а також свободу створювати складний дизайн, що обертається навколо великих будівель чи будівель з кількома входами рідин чи матеріалів.\n\nМашини, на які впливають більше одного маяка будуть позначені значком «Перевантаження маяка» і призупинять все виробництво. Вони, як і раніше, споживатимуть мінімальну кількість енергії.\n\nРізні типи маяків корисні з різних причин. Базові маяки споживають дуже мало енергії, тому їх можна використовувати для енергозберігаючих збірок. Маяки великого охоплення мають великий радіус дії, тому вони є найбільш ефективним варіантом, якщо ви зможете вплинути на безліч машин. Компактні маяки мають невеликий радіус дії, але високу ефективність передачі, тому вони більш ефективні з точки зору модулів, якщо більша площа буде витрачена марно.

