[mod-description]
real-rain=Кінематографічний дощ для Factorio 2.1: поетапні грози, режими "лише дощ" і "гроза", шаруваті опади, пориви вітру, бризки з урахуванням покриття, синхронізовані грім і блискавки, зниження сонячної енергії, вимивання забруднення, гасіння пожеж, набори продуктивності й безпечна обробка космічних платформ.

