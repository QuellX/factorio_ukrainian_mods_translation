[mod-setting-description]
real-rain-enabled=Вмикає або вимикає погоду, візуальні ефекти, звуки й ігрові ефекти Real Rain.
real-rain-aaa-preset="Стримано" — легкий дощ. "Збалансовано" — типовий кінематографічний варіант. "Буря" і "Мусон" збільшують густоту, бризки, вітер і частоту грому.
real-rain-intensity=Основний множник візуальної густоти. Більші значення роблять дощ густішим, але більше навантажують UPS/GPU.
real-rain-wind-strength=Визначає, як часто використовуються видимі кути поривів вітру. 0 — дощ здебільшого прямий.
real-rain-ground-splashes-enabled=Додає невеликі бризки/брижі довкола поля зору. Вимкніть для кращої продуктивності.
real-rain-tile-splashes-enabled=Дощ сильніше розбризкується на бетоні/заводській підлозі, м'якше на ґрунті/траві й утворює брижі на воді.
real-rain-biome-ambience-enabled=Змінює звуки дощу біля лісів, заводської підлоги й води, щоб дощ відчувався частиною світу.
real-rain-wind-sound-enabled=Додає час від часу низький шум поривів вітру під час сильніших видимих поривів.
real-rain-ups-mode="Кінематографічно" — найгустіші ефекти. "Збалансовано" — рекомендовано. "Економія UPS" зменшує кількість частинок і спрощує логіку бризок.
real-rain-nauvis-only=Дощ лише на Наувісі. Вимкніть, лише якщо хочете, щоб інші згенеровані поверхні планет/супутників теж мали цикл погоди. Космічні платформи завжди пропускаються.
real-rain-storm-stages-enabled=Дощ поступово проходить етапи мряки, дощу, зливи, грози й іноді мусону, а потім стихає.
real-rain-monsoon-chance=Імовірність, що новий дощ стане рідкісним інтенсивним мусоном.
real-rain-post-rain-enabled=Після закінчення дощу ще недовго тривають брижі в калюжах і тихі краплі, а не все зупиняється миттєво.
real-rain-post-rain-min-seconds=Мінімальна тривалість затихання після дощу.
real-rain-post-rain-max-seconds=Максимальна тривалість затихання після дощу.
real-rain-wet-min-hours=Мінімальна можлива тривалість дощу в ігрових годинах.
real-rain-wet-max-hours=Максимальна можлива тривалість дощу в ігрових годинах.
real-rain-wet-power=Визначає, чи дощі переважно коротші, чи довші. 1 — рівномірно; більші значення — частіше коротші дощі.
real-rain-dry-mean-hours=Середній сухий час між дощами в ігрових годинах. Менші значення — частіші дощі.
real-rain-thunder-sound-enabled=Відтворює природні та примусові звуки грому в підтримуваних режимах грози.
real-rain-volume-modifier=Множник гучності звуків дощу від 0 до 1.
real-rain-thunder-volume-modifier=Множник гучності грому від 0 до 1.
real-rain-thunder-layering-enabled=Додає відкладені розкоти грому після близьких ударів блискавки. Грози стають глибшими, лише невелика звукова витрата.
real-rain-lightning-visual-enabled=Показує короткі біло-блакитні спалахи світла під час блискавок. Звук грому може лишатися ввімкненим, коли це вимкнено.
real-rain-min-thunder-chance=Базова імовірність грому. Менші значення — грім рідкісний.
real-rain-max-thunder-chance=Пікова імовірність грому. Більші значення — грози гучніші й активніші.
real-rain-fire-extinguish-enabled=Якщо ввімкнено, дощ шипить і гасить пожежі.
real-rain-solar-power-multiplier=Ефективність сонячних панелей під час дощу у відсотках від звичайної на цій поверхні. -1 вимикає ефект; 50 — половина; 0 — без сонячної енергії.
real-rain-pollution-cleanup-per-minute=Скільки забруднення прибирається з кожного чанка за хвилину дощу. 0 вимикає вимивання.
real-rain-pollution-max-chunks-per-tick=Максимум чанків забруднення, що обробляються за тік. Менші значення покращують продуктивність на дуже великих мапах.

