fmf-auto-join=Суміжні [entity=duct-small] автоматично об'єднуються в [entity=duct].\nСуміжні [entity=duct] автоматично об'єднуються в [entity=duct-long].\nЦю функцію можна вимкнути в налаштуваннях мода — тоді стануть доступні рецепти [entity=duct] та [entity=duct-long].
