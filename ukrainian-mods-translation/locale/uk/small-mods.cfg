[mod-setting-description]
module-category-defaults-dynamic=Чи автоматично визначати додаткові категорії модулів, які слід обробляти як ванільні категорії модулів (типово увімкнено).
elevated-pipes--opacity=0 — невидимі, 0.5 — прозорі, 1 — суцільні.
elevated-pipes--freezes=Зрештою, вони ж підняті над холодною землею.
autodeconstruct-pipe-name=Перелік назв об'єктів-труб через кому, яким надається перевага при заміні бурів, що використовують рідину.
autodeconstruct-ore-blacklist=Перелік назв ресурсних об'єктів через кому, вичерпання яких не запускатиме жодного знесення.
valves-pump-speed=Кількість рідини, що перекачується щосекунди, коли клапан відкритий. Стосується всіх клапанів цього мода: переливного, наповнення та одностороннього. Обмежується максимальним потоком рідини, заданим службовою константою `max_fluid_flow`.
valves-disable-py-migration=Вимикає автоматичну міграцію клапанів PyIndustry на цей мод.
Use-Mod-Color-for-pipes=Замінити нудний ванільний колір труб на колір, заданий модом.
Use-Mod-Color-for-heat-pipes=Замінити нудний ванільний колір теплових труб на колір, заданий модом.
Use-Mod-Color-for-roboports=Замінити нудний ванільний колір робопортів на колір, заданий модом.
Use-Mod-Color-for-steam-generators=Замінити нудний ванільний колір генераторів на колір, заданий модом.
discoscience-high-quality=Цікавіші візерунки. Вимкніть для покращення продуктивності.
inventory-repair-interval=Як часто виконувати ремонт, у тіках. Обсяг ремонту за інтервал коригується так, щоб загальна швидкість не змінювалася. Менші значення можуть вплинути на продуктивність.\n\n[color=blue]Типово:[/color] __1__\n[color=blue]Мінімум:[/color] __2__
inventory-repair-order=Обирати найшвидший чи найповільніший ремонтний набір. Інструменти з нескінченною міцністю та найбільшою швидкістю обираються першими незалежно від цього налаштування.
galaxy-background-enabled=Чи додавати фон для всіх підтримуваних зоряних систем.
universe-widget-enabled=Чи вмикати повноекранний фон зоряного неба на зоряній мапі.
universe-background-flicker-enabled=Чи має повноекранний фон зоряного неба мерехтіти під час руху камери.
asteroid-belt-1-enabled=Чи вмикати пояс астероїдів між Фульґорою та Аквіло.
asteroid-belt-2-enabled=Чи вмикати пояс астероїдів між краєм Сонячної системи та Зруйнованою планетою.
