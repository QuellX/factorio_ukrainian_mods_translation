[mod-setting-description]
visible-planets-disable-mp-parallax=Вимикає паралакс у мережевій грі, оскільки він може дивно поводитися для гравців, окрім хоста. Має перевагу над налаштуванням вище.
visible-planets-vanilla-compat=Типово VP замінює нову ванільну реалізацію фонів планет. Це налаштування змусить VP пропускати БУДЬ-ЯКУ планету, для якої вже підготовлено гарний фон. (Планети з модів без ванільної реалізації використовуватимуть VP як зазвичай.)
visible-planets-planetslib-compat=Якщо увімкнено, супутники з модів показуватимуть позаду себе своє материнське тіло, а планети із супутниками аналогічно показуватимуть свої супутники. (Працює лише для супутників PlanetsLib.)
visible-planets-planetslib-scale=Масштаб тіл, що відображаються завдяки сумісності з PlanetsLib, відносно материнського тіла.
visible-planets-planetslib-x=Позиція X першого фонового зображення. Для планет із кількома супутниками додаткові зображення створюються відносно цієї позиції.
visible-planets-planetslib-y=Позиція Y першого фонового зображення. Для планет із кількома супутниками додаткові зображення створюються відносно цієї позиції.
visible-planets-planetslib-dist=Відстань від центру материнського тіла для зображень PlanetsLib. За малих значень тіла відображатимуться під основною планетою.
visible-planets-planetslib-init-angle=Початковий кут першого фонового зображення в градусах. Мало корисний, якщо увімкнено обертання планети, але корисний в інших випадках.
visible-planets-planetslib-spacing-mult=Типово тіла розташовані рівномірно навколо материнського тіла. Множник менше 1 зближує їх. Значення понад 1 дадуть нерівномірні інтервали.
visible-planets-planetslib-tint=Менші значення роблять фонові зображення темнішими. Значення 1 — звичайний вигляд.
visible-planets-enable-blur=Застосовує ефект розмиття до спрайтів видимих планет. Може знизити продуктивність.
visible-planets-blur-intensity=Керує силою ефекту розмиття. Більші значення роблять планету більш розмитою.
milestones_write_file=Якщо позначено, час досягнення віх дописуватиметься у файл milestones-MAPSEED.txt у теці script-output у машинозчитуваному форматі.\nУ мережевій грі файл записується лише на вашому комп'ютері. Щоб записувати файл на виділеному сервері, використовуйте налаштування «Записувати віхи у файл (сервер)» на вкладці «Мапа».
milestones_write_file_server=Якщо позначено, час досягнення віх дописуватиметься у файл milestones-MAPSEED.txt у теці script-output у машинозчитуваному форматі.\nЗапис відбувається лише на виділеному сервері. Якщо ви граєте не на виділеному сервері, це налаштування ні на що не впливає. Щоб записувати файл на своєму комп'ютері, використовуйте налаштування «Записувати віхи у файл (гравець)» на вкладці «Для гравця».
milestones_global_announcements=Якщо позначено, віхи оголошуватимуться всім командам у командній мережевій грі.\nЯкщо не позначено — лише вашій команді.\nНе впливає, якщо ви граєте без команд.
rain-enabled=Вмикає або вимикає погоду, візуальні ефекти, звуки та ігрові ефекти Dynamic Rain
rain-allowed-planets=Внутрішні назви планет або поверхонь через кому, на яких дозволено дощ. Назви чутливі до регістру. Для Space Exploration використовуйте назву зони, наприклад: nauvis, Foenestra, Foenestra Orbit
rain-wet-min-minutes=Мінімально можлива тривалість дощу в хвилинах
rain-wet-max-minutes=Максимально можлива тривалість дощу в хвилинах
rain-wet-power=Визначає, чи будуть дощі коротшими або довшими. 1 — рівномірно; більші значення віддають перевагу коротким дощам, менші — довгим
rain-dry-mean-minutes=Середній сухий час між дощами в хвилинах. Менші значення — частіші дощі
rain-intensity=Основний множник візуальної щільності. Більші значення роблять дощ густішим, але знижують UPS
min-thunder-chance=Базовий шанс грому. Менші значення роблять грім рідкісним
max-thunder-chance=Піковий шанс грому. Більші значення роблять грім частішим у пікові моменти
lightning-visual-enabled=Показує короткі синьо-білі спалахи, що супроводжують блискавку. Звук грому може залишатися увімкненим, коли це вимкнено
thunder-sound-enabled=Відтворює звуки грому перед дощем і під час нього. Спалахи блискавок можуть залишатися увімкненими, коли це вимкнено
rain-volume-modifier=Множник гучності дощу від 0 до 1
thunder-volume-modifier=Множник гучності грому від 0 до 1
fire-extinguish-chance=Шанс, що дощ загасить вогонь. 0 — ніколи; 1 — завжди
rain-solar-power-multiplier=Ефективність сонячних панелей під час дощу у відсотках.\n-1 = без впливу;\n50% = половина ефективності;\n100% = повна ефективність;\n0% = без енергії;
rain-pollution-cleanup-per-minute=Скільки забруднення прибирається з чанка за хвилину (забруднення/хв) під час дощу.\n0 = вимкнено
rain-pollution-max-chunks-per-tick=Максимальна кількість чанків, що перевіряються кожен тік для очищення забруднення. Менші значення покращують продуктивність; на великих мапах очищення може стати менш точним
PlanetsLib-warn-on-hidden-prerequisites=Попереджає гравця під час завантаження гри з прихованими передумовами.
PlanetsLib-update-vanilla-recipe-productivity-techs=Додає всі відповідні рецепти до ванільних технологій продуктивності рецептів, якщо їх ще не додано. Під час звичайної гри має залишатися увімкненим, але може спричиняти проблеми сумісності зі старішими модами.
PlanetsLib-unlink-hidden-prerequisites=Якщо технологія є передумовою, але прихована, її буде вилучено з передумов, щоб наступна технологія не була заблокована.
PlanetsLib-enhanced-tooltips=Додає до прототипів нові підказки, що показують користувачеві раніше приховану інформацію.
PlanetsLib-enable-entity-replacements=Вмикає заміни об'єктів, не прив'язані до іншого налаштування запуску. Допомагає під час видалення модів на випадок, якщо автори модів не прив'язали свої заміни об'єктів до налаштування.
PlanetsLib-disable-all-entity-replacements=Примусово вимикає всі заміни об'єктів у всіх модах. Не повинно знадобитися, якщо тільки якийсь мод не налаштовано вкрай неправильно.
PlanetsLib-enable-runtime-rocket-silo-replacements=Якщо планети мають множник підйомної сили ракети або множник ракетних частин, під час гри застосовуватимуться заміни ракетних шахт. Вимкніть це налаштування, щоб безпечно вимкнути цю поведінку й скасувати заміни у збереженнях, якщо якийсь мод використав цю функцію небезпечно.
PlanetsLib-enable-lab-science-pack-preview-size-change=Масштабує розмір значків дослідницьких пакетів на лабораторіях у докладному режимі залежно від кількості пакетів, які лабораторія може приймати.
todolist-show-button=Якщо увімкнено, кнопка «Список справ» завжди показуватиметься вгорі ліворуч.\nЯкщо вимкнено, список справ відкривається лише гарячою клавішею (типово Shift+T).
todolist-show-log=Якщо увімкнено, мод виводитиме налагоджувальні повідомлення в чат.\nУвага: їх дуже багато :)
todolist-window-height=Висота вікна списку справ. Типово 600.
todolist-auto-assign=Якщо в грі лише один гравець, автоматично призначати завдання йому.
todolist-click-edit-task=Якщо увімкнено, клік середньою кнопкою відкриватиме вікно редагування. Типово — правою кнопкою.
todolist-translation-mode=Стиль тексту списку справ. «Журнал квестів» змінює формулювання на стиль журналу квестів.

