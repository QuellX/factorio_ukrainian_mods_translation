[technology-description]
linox-technology_planet-discovery-linox=Вивчаючи сонце, ми виявили крихітну планету на надзвичайно близькій орбіті. Але це дуже незвично: за всіма відомими законами фізики планети, такі близькі до своєї зорі, мали б або впасти на неї під дією гравітації, або бути розірваними припливними силами, тож їхнє існування неможливе. Що ж це таке? А головне… ви справді збираєтеся досліджувати це пекло?
linox-technology_exploring-linox-landing-site=[color=yellow][font=default-bold]Це дослідження потребує космічної платформи на орбіті Linox.[/font][/color]\n\nЯк і передбачав Informatron, у планети немає твердої поверхні. Однак якщо космічна платформа безпосередньо обстежить поверхню з орбіти, можливо, щось і знайдеться…
linox-technology-trigger-description_lorax-talking=Відкривається під час розмови з L.O.R.A.X.
linox-technology-trigger-description_lorax-purchase=Придбайте цю технологію в L.O.R.A.X.
linox-technology_facility-upgrade=Щоб вибратися з Linox, цей тісний комплекс треба індустріалізувати. Тут так тісно, що навіть для парковки немає місця.
linox-technology_planetary-power-network=У цьому комплексі вже є величезна планетарна енергомережа. Якщо зможете її використати, не доведеться будувати мережу заново. Інакше кажучи, не доведеться мучитися з хаотичним клубком ЛЕП.
linox-technology_planetary-power-network-capacity=Збільшує ємність планетарної енергомережі. Кожен рівень додає ще 5 ГДж ємності.
linox-technology_facility-factoryizing=Приберіть з комплексу все непотрібне обладнання, щоб звільнити місце для фабрики. Та навіть тоді місця, схоже, замало.
linox-technology_expanding-factory=Приберіть із комплексу ще більше мотлоху, щоб звільнити місце. Тільки не викиньте випадково сімейні фото.
linox-technology_cargo-elevator=Розробіть транспортну систему, здатну з'єднати поверхню Linox з її підземними комплексами.
linox-technology_rocket-silo-foundation=Поверхня Linox — море надгарячої лави, тож звичайні фундаменти тут непридатні. До того ж входи в комплекс не витримують ваги ракетних шахт, тож придатної основи для будівництва немає. Розробка спеціальної плавучої платформи, здатної витримати ракетну шахту, дасть хоча б невелику ділянку для будівництва.
linox-technology_laboratory-database=База даних дослідницької лабораторії Linox може містити корисні технології нашої цивілізації… а може бути забита суцільними дорослими дурницями.
linox-technology_linox-petrochemicals=Купаючись у величезній енергії сонця, Linox може використати своє екстремальне середовище для унікальних нафтохімічних технологій.
linox-technology_recursive-blueprint=Дослідники Linox автоматизували навіть креслення комплексу, щоб якнайкраще використати обмежений простір. За допомогою цієї технології креслення можуть автоматично будувати мікрофабрики. Хто б міг подумати, що фабрика поміститься на долоні!
linox-technology_tungsten-processing=Деталі з обробленого вольфраму мають значно кращу термостійкість і зносостійкість. Виделка з такого матеріалу навіть не погнеться від гарячої їжі.
linox-technology_turbo-pump=Розбираючи мотлох, ми знайшли креслення нової помпи. Згідно з нотатками, її спроєктували всього за хвилину, задіявши всю обчислювальну потужність планетарного комп'ютера. Її характеристики перевершують наявні помпи. Навіщо для звичайної помпи знадобився планетарний комп'ютер і що тривало цілу хвилину — загадка, але якщо працює, то працює.
linox-technology_core-roboport=Утомившись дивитися, як роботи роєм облипають робопорти, наче вулик, аби підзарядитися, дослідники розібрали наявні робопорти й створили нову конструкцію. Цей робопорт має дуже малий радіус дії, але компенсує це надзвичайно швидким заряджанням і численними зарядними портами.
linox-technology_enhanced-space-engineering=Щоб запускати ракетні шахти на Linox, потрібно розуміти поведінку сонця й мати високоякісні високоефективні матеріали.
linox-technology_advanced-rocket-silo=Вдосконалені ракетні шахти працюють учетверо швидше за звичайні й можуть бути завантажені на космічну платформу. Болісно повільні звичайні шахти були вкрай неефективні. Пропустивши зайві процедури й застосувавши високопродуктивні самарієві двигуни, час запуску вдалося скоротити до 75%. Крім того, оптимізація витрат матеріалів зробила шахти досить легкими, щоб розмістити їх на борту космічної платформи — вражає!
linox-technology_safety-of-entering-orbit=Збільшує ймовірність збереження вантажу під час входу з орбіти на 5% за рівень. Щоб захистити цінний вантаж від безжальної люті сонця, це дослідження необхідне.
linox-technology_sintering-machine=Пресуючи очищені порошкові матеріали за високої температури, можна легко отримати вироби потрібної форми без складної обробки. Так використовується рівно стільки матеріалу, скільки потрібно, без витрат на обробку — ідеально для керівників, що люблять рахувати.
linox-technology_planetary-mining-technology=Колись Linox був величезною гірничою планетою, що постачала ресурси для роботи лабораторій. Можливо, ми зможемо перейняти звідси корисний досвід.
linox-technology_mantle-extraction=Базова планетарна гірнича технологія. Пробиває десятки кілометрів углиб до мантії, щоб видобувати лаву. Лава стає доступною будь-де, але процес споживає величезну кількість енергії й спричиняє значне забруднення.\n\nОбережно: щойно цей об'єкт запрацює, екологічні організації розлютяться й кинуться на вас із піною біля рота. Але зручність понад усе, правда?
linox-technology_stone-extraction=Камінь можна отримувати просто з лави. Якщо з неї виходять залізо й мідь, то чому б не камінь?
linox-technology_tungsten-extraction=Вольфрам можна отримувати просто з лави. Якщо з неї виходять залізо й мідь, то чому б не вольфрам?
linox-technology_casting-stone-brick=Виготовляє цеглини в ливарні. Електричні печі тепер побачиш хіба що на Аквіло.
linox-technology_rare-earth-refining=Вилучає з лави розчинені в ній сліди рідкісноземельних елементів. Цей процес дає величезну кількість відходів і забруднює довкілля, але на безлюдній планеті це навряд чи когось хвилює.
linox-technology_samarium-centrifugation=Відокремлює самарій від рідкісноземельної руди центрифугуванням. З самарію можна робити постійні магніти, що зберігають магнітні властивості навіть за надзвичайно високих температур, тож машини із самарієм надійно працюють у суворих умовах.
linox-technology_ultra-deep-drilling=Навіть на планеті, вкритій морями лави, досі лишилися залишки природних ресурсів. У цій лабораторії є бурові установки, що видобувають ресурси з великих глибин. Люди справді невгамовні істоти.
linox-technology_linox-supercomputer=Linox — одне з найгірших можливих середовищ для роботи комп'ютерів. Але робота не чекає. Завдяки вольфраму й допомозі L.O.R.A.X з виправленням помилок суперкомп'ютери тепер можна використовувати навіть на Linox.
linox-technology_samarium-data-card=Насправді самарій — не той магніт, що працює за найвищих температур, але я чув, що його магнітна сила значно більша, тож він корисніший. У світі стільки всього цікавого, і так шкода, що неможливо все це зрозуміти!
linox-technology_lorax-support=Налаштовано інтерфейсну систему, щоб L.O.R.A.X міг вам допомагати. Поки що L.O.R.A.X лише координує виробництво даних, але продуктивність виготовлення карт даних зростає аж на 25%. Зрештою, калькулятор найкраще проявляє себе, коли ним рахують.
linox-technology_power-converter=Відновлення мегаперетворювача енергії в планетарній енергомережі відкриє високоємну систему накопичення енергії на цілих 5 ГДж. Однак L.O.R.A.X чомусь помітно незадоволений цією системою...
linox-technology_tungsten-sintering-processing=Спіканням вольфрамову руду можна одразу перетворити на придатні вольфрамові вироби. Цей метод значно швидший і ефективніший за традиційну обробку, а головне — прибирає цілий етап, тож виробництво стає набагато менш нудним.
linox-technology_froth-flotation-processing=Пінна флотація використовує схильність гідрофобних частинок відокремлюватися від води. Коли в пульпу подають бульбашки, гідрофобні частинки чіпляються до піни й спливають на поверхню, тож їх легко відокремити.\n\nВ одній маленькій східноазійській країні є мем «Вода знає відповідь». Мені це нагадує катування водою, але певно, це просто збіг.
linox-technology_dysprosium-extraction=Пінною флотацією та низкою інших етапів можна видобути високочистий і надзвичайно цінний диспрозій. Цей порошок можна використати для виготовлення карт даних — або продати на ринку за ціною від 200 до понад 1000 доларів за кілограм.
linox-technology_dysprosium-data-card=Диспрозій можна назвати «чарівним пилом» постійних магнітів, проте у 2021 році в усьому світі його виробили лише близько 3100 тонн. Чи варто витрачати такий рідкісний метал на виготовлення карт даних?
linox-technology_dysprosium-exoskeleton-equipment=Погляньте на старий екзоскелет: тонкі ноги, що ось-ось зламаються, смішне енергоспоживання 200 кВт і рух, повільніший за вмираючого равлика. Дратує, правда? Що ж, посипте його дрібкою чарівного диспрозієвого пилу — і бум, миттєвий приріст продуктивності, майже як магія! І все це лише за 39 999 доларів!
linox-technology_build-data-catalog=За словами L.O.R.A.X, наші дослідницькі здобутки помітно накопичуються, і їх, схоже, треба систематизувати. Упорядкування зібраних даних підвищить продуктивність виготовлення вдосконалених карт даних і відкриє дослідження вищого рівня.
linox-technology_chemical-particle-filtering=Вибірково відокремлює потрібні частинки хімічними методами. Цей процес потребує чималих знань з хімії, але, найімовірніше, L.O.R.A.X і машини впораються за нас. Зрештою, вчитися новому важко.
linox-technology_waste-water-treatment=Насправді «очищення стічних вод» — лише ввічливий спосіб сказати, що ви їх викидаєте. Як і мантійний екстрактор, цей об'єкт, мабуть, найменш улюблений в екологічних організацій, хоча до Linox вони навряд чи дістануться.
linox-technology_neodymium-extraction=Відкриває процес видобування неодиму. Видобування рідкісноземельних елементів — справа клопітка, потребує величезних ресурсів і води та дає величезну кількість відходів. Але заради неодиму воно того варте. Ви вже на Linox, то чому б не довести справу до кінця?
linox-technology_neodymium-data-card=Неодим використовують для виготовлення найпотужніших у світі постійних магнітів, і нині його можна знайти майже в будь-якому трохи дорожчому електричному пристрої навколо вас. Власне, електрику для комп'ютера, на якому ви читаєте цей текст, могли виробити неодимові магніти.
linox-technology_neodymium-permanent-magnet=Змішавши порошок неодиму з диспрозієм і залізом і спікши суміш, отримують знаменитий неодимовий постійний магніт. Насправді треба додати ще й бор, але це складно і для розробників, і для гравців, тож ми його пропустили. Головне, що цей магніт надзвичайно корисний.
linox-technology_neodymium-permanent-magnet-generator=Нарешті ми можемо представити вам цей продукт. Неодимові постійні магніти дають змогу працювати з величезною енергією в малому просторі. Цей генератор виробляє аж у 43 рази більше енергії, ніж звичайна парова турбіна! А як бонус — величезний теплообмінник у комплекті.
linox-technology_erbium-extraction=Відкриває процес видобування ербію. Він дуже схожий на видобування неодиму, але це точно не через лінощі. Виявляється, усі рідкісноземельні елементи виробляють саме так: здебільшого додаючи реагенти й концентруючи в сотні разів. Не дивно, що це спричиняє величезне забруднення.
linox-technology_erbium-data-card=Ербій здебільшого використовують як домішку для оптичного підсилення. Кажуть, його додавання в оптоволокно значно покращує якість сигналу. Можливо, ви навіть користуєтеся оптоволокном з ербієм, коли під'єднуєтеся до серверів багатокористувацької гри!
linox-technology_erbium-beacon=Ербій справді зменшує втрати оптичного сигналу, але, чесно кажучи, не знаю, як це пов'язано з маяками у Factorio. Хай там як, ербій може покращити роботу маяка, дозволяючи встановити до 4 модулів. Також можна вдосконалити наявні маяки!
linox-technology_rare-earth-powder-productivity=Покращує виробництво рідкісноземельних елементів. Невеликий бонус — менше забруднення.
linox-technology_get-cargo-landing-pad=Отримайте від L.O.R.A.X контроль над головним вантажним посадковим майданчиком. Це дасть змогу приймати вантажі з орбіти.
linox-technology_basic-material-sintering-processing=Переробляє залізну й мідну руду спіканням на готові вироби. Надавати матеріалам потрібної форми силою — давня традиція, що сягає кам'яної доби.
linox-technology_sintering-machine-productivity=Підвищує продуктивність спікальної машини. Схоже, виходить більше, ніж ви вклали матеріалів… може, це і є «творення»?
linox-technology_ground-platform-expansion=Якщо подумати, підземний комплекс і так стоїть посеред справжнього моря лави, то чому б не розширити наземну платформу ще більше? Усвідомивши це, я негайно побіг до L.O.R.A.X і зажадав пояснити, чому розширення неможливе. Відповідь була: «Бо ви ніколи цього не просили». Знову ж таки, навіть дрібниці важливі — завжди кажіть уголос.
linox-technology_samarium-robotics=Використовуючи високотемпературні властивості самарію, літаючі роботи можуть стати міцнішими й вогнестійкими, а також тимчасово працювати з 300% перевантаженням. Як то кажуть, «швидко їсти — швидко какати».
linox-technology_dysprosium-electric-motor-robot=Додавання слідових кількостей диспрозію в двигуни літаючих роботів може підвищити енергоефективність до 25%. Диспрозій справді схожий на чарівний порошок, але не їжте його — це важкий метал.
linox-technology_neodymium-permanent-magnet-inserter=Завдяки величезному крутному моменту двигунів на неодимових постійних магнітах продуктивність маніпуляторів можна підняти до революційного рівня. Їхні руки рухаються так швидко, що відстежити їх неозброєним оком майже неможливо. У вас може навіть запаморочитися голова, тож, дітки, не повторюйте цього вдома.
linox-moshine-technology_neodymium-crushing=На Moshine можна легко видобувати високочистий природний неодим. Достатньо просто подрібнити цей природний неодим, щоб одразу отримати порошок неодиму. Такий рідкісний високочистий рідкісноземельний елемент просто лежить на землі — Moshine справді рай для магнітників!
linox-technology_planetary-power-converter-capacity=Розширює ємність перетворювача енергії. Кожен рівень додає ще 2,5 ГДж.\n\nНавіть покинутий на століття, він досі працює на людство. Хіба ми не можемо вкласти хоч трохи? Будь ласка, поважайте права машин.
linox-technology_outer-corridor-open=Відкриває зовнішній коридор навколо комплексу. Спочатку цей коридор був повністю завалений лавою й камінням, але L.O.R.A.X розчистив його, поки ми були зайняті іншим. До речі, у журналах дослідників не було особливих скарг на туалети.
linox-technology_adding-pipeline=Додає новий трубопровід установки глибинного буріння. Нові трубопроводи встановлюються на стінах внутрішнього коридору у випадкових місцях.\n\nОскільки установку глибинного буріння спочатку не проєктували для під'єднання до лабораторії, трубопровід, на жаль, не можна розмістити будь-де. Натомість L.O.R.A.X удосконалив трубопровід, щоб можна було вибрати, який ресурс він видає. Кмітливо, правда?
linox-technology_pipeline-productivity=Підвищує продуктивність установки глибинного буріння.\n\nНасправді гравцеві в цьому дослідженні робити майже нічого, адже взаємодіяти з установкою глибинного буріння безпосередньо не можна. Усі її вдосконалення виконує L.O.R.A.X. Зі зростанням рівня дослідження його робоче навантаження, схоже, неймовірно зростає. До речі, я все думав, чому останнім часом трубопроводом піднімається якийсь дивний отруйний газ… L.O.R.A.X, тільки не кажи, що ти…
linox-technology_chemical-tank-productivity=Підвищує базову продуктивність хімічних чанів. Згідно з Біблією, Бог колись відмив світ Всесвітнім потопом. Вам ніколи не було цікаво, звідки взялося стільки води?
linox-technology_chemical-filter-productivity=Підвищує базову продуктивність хімічних фільтрів. Усім відомо, що суп із більшою кількістю гущі ситніший. Треба як слід вишкрябати дно каструлі.
linox-technology_distribution-request-planner=Додає інструмент, що полегшує налаштування логістичних скринь запитів. Вручну задавати предмети одну за одною в кожній скрині запитів — надто примітивно й нудно. Звільніться від цієї тяжкої праці за допомогою інструмента автоматизації!
linox-technology_linox-science-pack=Дослідницький пакет, що містить усе, що може запропонувати Linox. Якщо ви це читаєте, значить, ви ввімкнули складний режим. Життя підкине вам чимало жорстоких випробувань, але я певен, що ви подолаєте кожне з них.

