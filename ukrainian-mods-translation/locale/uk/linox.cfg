[entity-description]
linox-npc_lorax=Колосальний штучний інтелект, що керує всією планетою Linox.
linox-npc_network-terminal=Термінал, що надає доступ до планетарної мережі Linox.
linox-npc_power-converter=Величезний вузол керування енергією, що керує електромережею комплексів Linox.
linox-building_advanced-rocket-silo=Високопродуктивна ракетна шахта, здатна працювати в надзвичайно суворих умовах. Працює вчетверо швидше за звичайну ракетну шахту і може бути завантажена на космічну платформу.
linox-building_cargo-elevator=Конвеєр для переміщення предметів через термінали комплексу Linox.
linox-building_cargo-landing-pad=Цей вантажний посадковий майданчик призначений для досліджень і не придатний для масштабної логістики. Натисніть __CONTROL__toggle-driving__ біля майданчика, щоб спуститися до підземного комплексу.
linox-building_planetary-power-network=Енергомережа, що з'єднує всю планету Linox.
linox-building_core-roboport=Компактний робопорт із дуже малим радіусом дії, але винятково швидким заряджанням.
linox-building_deep-oil-pumpjack=Видобуває сиру нафту, що досі збереглася глибоко під землею.
linox-building_fluid-elevator=Труба для переміщення рідин через термінали комплексу Linox.
linox-building_fluid-elevator-input=Помпа для переміщення рідин через термінали комплексу Linox.
linox-building_fluid-elevator-output=Помпа для переміщення рідин через термінали комплексу Linox.
linox-building_mantle-extractor=Пробиває планетарну кору колосальним буром, сягаючи мантії, щоб видобувати лаву. Лава стає доступною будь-де, але процес споживає величезну кількість енергії й спричиняє значне забруднення.
linox-building_sulfuric-acid-pumpjack=Видобуває сірчану кислоту, що досі збереглася глибоко під землею.
linox-building_turbo-pump=Високопродуктивна помпа, що споживає багато енергії в обмін на видатну продуктивність.
linox-building_linox-supercomputer=Особливий суперкомп'ютер, здатний витримати суворі умови Linox. Схоже, L.O.R.A.X потай ним цікавиться.
linox-building_sintering-machine=Машина, що нагріває порошкові матеріали й пресує їх під високим тиском у тверді блоки.
linox-npc_power-converter-circuit-input=Подавайте сюди сигнали логічної мережі, щоб керувати перетворювачем енергії.
linox-npc_power-converter-circuit-output=Зчитуйте тут вихід логічної мережі й використовуйте його в логіці керування.
linox-hidden_reactive-power=Реактивна потужність виникає, коли перетворювач енергії не може ефективно керувати електрикою.
linox-building_chemical-tank=Хімічний чан може виконувати складні хімічні процеси з великими об'ємами рідини.
linox-building_outlet=Скидний випуск дає змогу зливати стічні води в океан. Риби якось це з'їдять чи вип'ють і, мабуть, очистять... правда ж?
linox-building_chemical-filter=Хімічний фільтр вибірково вилучає потрібні речовини з розчину фізичними й хімічними процесами. Як той прискіпливий, що вибирає лише найсмачніше.
linox-building_huge-heat-exchanger=Загрозливо величезний теплообмінник. Може обробляти до 250 МВт теплової енергії.
linox-building_neodymium-permanent-magnet-generator=Генератор на неодимових постійних магнітах. Завдяки потужній магнітній силі неодиму високоефективний і потужний генератор вдалося стиснути до такого розміру.
linox-building_erbium-beacon=Кажуть, ербій підвищує ефективність маяка й дає змогу встановити вдвічі більше модулів. Відчуваєте неймовірну силу рідкісноземельних елементів?
linox_samarium-construction-robot=Будівельні роботи, посилені самарієм, можуть працювати з 300% перевантаженням, стають вогнестійкими й міцнішими.
linox_samarium-logistic-robot=Логістичні роботи, посилені самарієм, можуть працювати з 300% перевантаженням, стають вогнестійкими й міцнішими.
linox-building_neodymium-bulk-inserter=Посилений неодимом об'ємний маніпулятор має значно більший крутний момент і може працювати надзвичайно швидко.
linox-building_neodymium-stack-inserter=Посилений неодимом стосовий маніпулятор має значно більший крутний момент і може працювати надзвичайно швидко.
linox-special_circuit-pole=Під'єднайте сюди дроти, щоб зв'язати логічну мережу між поверхнею й підземеллям.
linox-special_facility-elevator=Натисніть __CONTROL__toggle-driving__ біля ліфта, щоб увійти.
linox-special_emergency-escape-shuttle=[color=yellow]Після демонтажу його неможливо відновити![/color]\n\nЯкщо Linox став для вас тяжким тягарем, чому б не покинути все й не відпочити деінде якийсь час?
linox-special_internel-pipeline=Цей трубопровід отримує ресурси від підземної установки глибинного буріння. Оскільки установку глибинного буріння спочатку не проєктували для прямого під'єднання до лабораторії, трубопровід, на жаль, не можна розмістити будь-де. Натомість L.O.R.A.X удосконалив трубопровід, щоб можна було вибрати, який ресурс він видає.

