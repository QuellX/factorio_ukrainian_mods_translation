[mod-setting-description]
linox-settings_enable-moshine-neodymium-recipe=Якщо ввімкнено, з неодиму планети Moshine можна отримувати порошок неодиму.
linox-settings_allow-hopper-launcher=Якщо ввімкнено, пускові установки Hopper можна розміщувати на Linox, зокрема на клітинках термінальної платформи.
linox-settings_compatibility-aai-signal-transmission=Якщо ввімкнено, Linox візьме цей мод під контроль і вбудує його у свій ігровий процес.
linox-settings_compatibility-distribution-request-planner=Якщо ввімкнено, Linox візьме цей мод під контроль і вбудує його у свій ігровий процес.
linox-settings_rbp-example-multiplay-language=Цей параметр локалізує описи в прикладі рекурсивних креслень і використовується лише в мультиплеєрі. Якщо вибрано «Авто», автоматично використовується перша виявлена мова. Навіть якщо вибрати іншу мову, залежно від кешу локалізації може відображатися інша.
linox-settings_rbp-example-local-language=Цей параметр локалізує описи в прикладі рекурсивних креслень. Якщо вибрано «Авто», автоматично використовується поточна мова гри. Навіть якщо вибрати іншу мову, залежно від кешу локалізації може відображатися інша.
linox-settings_easy-mode_anywhere-mantle-extractor=Знімає обмеження на розміщення мантійних екстракторів.
linox-settings_easy-mode_remove-vanilla-circuit-collision=Прибирає колізії з ванільних пристроїв логічної мережі, щоб вони більше не заважали рухатися. Не діє, якщо завантажено мод «Squeak Through 2».
linox-settings_hard-mode_no-logistic-system=Прибирає вимогу дослідження «Логістична система» з технології відкриття планети Linox і прибирає всі логістичні предмети зі стартового спорядження.\n\n[color=yellow]Увага: з цим параметром стартові приклади не працюватимуть правильно. Він прибирає лише залежності від логістичної системи в межах Linox і не прибирає саму технологію «Логістична система» з гри.[/color]
linox-settings_hard-mode_no-starter-pack=Прибирає всі стартові предмети, що зазвичай видаються після відкриття фабричного майданчика. Щоб просуватися, гравцям доведеться здобути кожен предмет самостійно.
linox-settings_hard-mode_use-surface-condition=Вмикає обмеження поверхні, тож усі кінцеві продукти Linox можна виготовляти лише на Linox.\n\n[color=yellow]Увага: через обмежений простір Linox ви можете зіткнутися з серйозними логістичними вузькими місцями, які важко розв'язати.[/color]\n\n[color=red]Небезпечно: це надзвичайно болісно![/color]
linox-settings_hard-mode_disable-mantle-extractor=Прибирає мантійний екстрактор і всі пов'язані з ним дослідження.
linox-settings_hard-mode_enable-science-pack_aquilo=Вмикає рецепт дослідницького пакета Linox і вимагає його в дереві технологій Аквіло.\n\n[color=yellow]Увага: через обмежений простір Linox ви можете зіткнутися з серйозними логістичними вузькими місцями, які важко розв'язати.[/color]
linox-settings_hard-mode_enable-science-pack_promethium=Вмикає рецепт дослідницького пакета Linox і вимагає його в дереві технологій прометію.\n\n[color=yellow]Увага: через обмежений простір Linox ви можете зіткнутися з серйозними логістичними вузькими місцями, які важко розв'язати.[/color]
linox-settings_hard-mode_enable-science-pack_infinite=Якщо дослідницькі пакети Linox використовуються в деревах технологій Аквіло й прометію, вони також знадобляться для нескінченних досліджень.\n\n[color=yellow]Увага: через серйозні обмеження простору на Linox ви можете зіткнутися зі складними логістичними вузькими місцями.[/color]

