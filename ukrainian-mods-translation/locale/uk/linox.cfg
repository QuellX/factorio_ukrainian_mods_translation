[tile-description]
linox-tile_linox-terminal-platform=Платформа, що тримає термінали комплексу Linox. Вона недостатньо міцна для будівель, тож на ній можна розміщувати лише обмежений набір споруд.
linox-tile_linox-hazard-terminal-platform=Платформа, що тримає термінали комплексу Linox. Вона недостатньо міцна для будівель, тож на ній можна розміщувати лише обмежений набір споруд.
linox-tile_linox-facility-platform=Ця платформа тримає комплекс Linox. Вона недостатньо міцна для більшості споруд, тож на ній можна розміщувати лише певні будівлі.
linox-tile_linox-hazard-facility-platform=Ця платформа тримає комплекс Linox. Вона недостатньо міцна для більшості споруд, тож на ній можна розміщувати лише певні будівлі.

