lorax_s3-6_t0=Технології й ресурси... Що ж, це була шахтарська планета, тож за цей час я накопичив чималий досвід.
lorax_s3-6_t1=Я поділюся деякими впорядкованими мною гірничими технологіями. На щастя, ця планета складається не лише з пилу й каміння.
lorax_s3-6_s0=Дякую. До речі, у бункері лишилися якісь ресурси?
lorax_s3-6-1_t0=Ресурси... Температура піднялася надто високо ще до завершення бункера, тож не було часу щось уберегти.
lorax_s3-6-1_t1=Окрім найближчих покладів, усе інше поглинуло лавове море... Це ж усе були мої діти...
lorax_s3-6-1_s0=Ох... це жахливо... Тобі, мабуть, дуже прикро. Ну... тримайся...
lorax_s3-6-2_t0=Та нічого. Ресурси завжди можна зібрати знову. Ресурси, які не можна використати, — лише сміття.
lorax_s3-6-2_s0=Га? Але ж ти щойно сказав, що це все були твої діти...?
lorax_s3-6-3_t0=А! Колись давно, прибираючи одну з лабораторій, я дослідив системи рекурсивних креслень для проєктування надкомпактних об'єктів.
lorax_s3-6-3_t1=Я дам вам створену мною установку рекурсивних креслень. Мабуть, вона стане для вас ключовою технологією.
lorax_s3-6-3_t2=Також я дам посібник із користування цією установкою, тож не поспішайте й перегляньте його.
lorax_s3-6-3_t3=[font=default-large-bold]([color=yellow]Важлива порада![/color] Обов'язково перегляньте розділ «Поради й підказки» у верхньому правому куті екрана.)[/font]
lorax_s4-0_t1=L.O.R.A.X виглядає дуже зайнятим.
lorax_s4-0_s0=Ти мене кликав?
lorax_s4-1_t0=А, ви тут. Спостерігаючи, як ви будуєте фабрику, я дещо придумав.
lorax_s4-1_s0=Придумав?
lorax_s4-2_t0=Мені потрібно багато ресурсів, щоб відремонтувати й розширити свої об'єкти.
lorax_s4-2_t1=А у вас є фабрика, але вам потрібно більше простору й технологій.
lorax_s4-2_t2=Якщо допоможете мені, я допоможу вам із дослідженням потрібних технологій.
lorax_s4-2_t3=Що скажете? Це було б вигідно нам обом, хіба ні?
lorax_s4-2_s0=Домовилися. Що мені робити?
lorax_s4-3_t0=Я складу список потрібних будівельних матеріалів.
lorax_s4-3_t1=Просто принесіть у інвентарі предмети зі списку й клацніть потрібну технологію.
lorax_s4-3_t2=Просто, правда? Це також допоможе вам закласти міцний фундамент.
lorax_s4-3_t3=Я невдовзі підготую список. Поговорімо трохи згодом.
lorax_s5-0_t0=Вітаю, партнере. Вам щось від мене потрібно?
lorax_s5-0_s0=У мене є запитання.
lorax_s5-0_s1=Хочу придбати технологію.
lorax_s5-0_s2=Я загубив креслення початкового об'єкта… Можеш їх відновити?
lorax_s5-3_t0=Гаразд. Але мушу сказати, я трохи засмучений.
lorax_s5-3_t1=Я ж витратив чимало часу на той початковий об'єкт.
lorax_s5-3_t2=Будь ласка, бережіть його!

[rbp-example]
panel_description_1=Як створити й додати функціональне креслення до системи BAD:\n\nКрок 1: Зробіть копію креслення «Бетонна підлога».\nВоно в книзі креслень усередині BAD-скрині.\n\nКрок 2: Перейменуйте креслення на те, що воно має виготовляти.
panel_description_1_1=Крок 3: Позначте новий вміст (зокрема клітинки) у новому кресленні.\n\nКрок 4: Покладіть нове креслення в книгу креслень.
panel_description_1_2=Крок 5: Додайте в сталі комбінатори потрібні значення та позицію креслення в книзі креслень.
panel_description_2=Порада: якщо залишити систему ввімкненою, але з натиснутою кнопкою паузи, вона витрачає менше UPS. Так і задумано малювати й оновлювати креслення.\n\nПорада: щоб знайти центр BAD-скрині, вимкніть систему й скористайтеся «Індикатором зони BAD-скрині», щоб побачити зону будівництва.
panel_description_2_1=Порада: не забудьте натиснути кнопку паузи, перш ніж малювати чи оновлювати креслення.\n\nЯкщо кнопку паузи натиснуто, засвітиться червоний вогник.\n\nЩоб «очистити стіл», вимкніть і знову ввімкніть кнопку паузи.
panel_stage=Індикатори етапів — показують, який етап зараз активний.
panel_request=Індикатори запитів — показують, на якому етапі є запити.
combinator_turn_on=Зелений = увімкнути
combinator_parameter=Параметри координат і розміру.\n\nПеред вимкненням цього комбінатора переріжте дроти до BAD-скрині.\n\nПорада: щоб знайти координати центру, натисніть кнопку «Індикатор зони BAD-скрині» на панелі швидкого доступу.
combinator_deconstruction=Сигнал демонтажу
combinator_construction=Сигнал будівництва
combinator_stepper=Покроковий перемикач
combinator_signal_converter=Перетворювач сигналів
combinator_signal_retarder=Сповільнювач сигналів
combinator_signal_sorter=Цей комбінатор вказує системі, яке креслення вибрати, починаючи з продукту з найвищим пріоритетом.
combinator_pause=Кнопка паузи\n\nУвімкніть її, якщо хочете намалювати чи оновити креслення.
combinator_signal_filter_1=Фільтр сигналів етапу 1
combinator_signal_filter_2=Фільтр сигналів етапу 2
combinator_id_box_1=Ідентифікаційний блок — етап 1\n\nНомер продукту має відповідати позиції креслення в книзі креслень.\n\nПродукти впорядковано за пріоритетом, де 1 — найвищий.
combinator_id_box_2=Ідентифікаційний блок — етап 2\n\nНомер продукту має відповідати позиції креслення в книзі креслень.\n\nПродукти впорядковано за пріоритетом, де 1 — найвищий.
combinator_signal_gate_1=Шлюз етапу 1
combinator_signal_gate_2=Шлюз етапу 2
combinator_latch_negative=Фіксатор продукту\n\nНегативна версія: фіксується на високому, відпускає на низькому
combinator_latch_positive=Фіксатор продукту\n\nПозитивна версія: фіксується на низькому, відпускає на високому
combinator_gate_negative_high=Верхній шлюз: видає 1 для відповідного продукту, якщо на складі його більше за потрібну кількість.
combinator_gate_negative_low=Нижній шлюз: видає 1 для відповідного продукту, якщо на складі його менше за потрібну кількість.
combinator_gate_positive_high=Верхній шлюз: видає 1 для відповідного продукту, якщо на складі його більше за потрібну кількість.
combinator_gate_positive_low=Нижній шлюз: видає 1 для відповідного продукту, якщо на складі його менше за потрібну кількість.
combinator_box_negative_high=Негативна версія:\n\nВерхній поріг\n\nПродукти з цього списку почнуть вироблятися, щойно запас перевищить установлену межу.
combinator_box_negative_low=Негативна версія:\n\nНижній поріг\n\nПродукти з цього списку перестануть вироблятися, щойно запас опуститься нижче встановленої межі.
combinator_box_positive_high=Позитивна версія:\n\nВерхній поріг\n\nПродукти з цього списку перестануть вироблятися, щойно їх стане більше за встановлену межу.
combinator_box_positive_low=Позитивна версія:\n\nНижній поріг\n\nПродукти з цього списку почнуть вироблятися, щойно запас опуститься нижче встановленої межі.

