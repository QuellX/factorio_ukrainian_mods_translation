[recipe-description]
linox-recipe_advanced-acid-neutralisation=Перетворює сірчану кислоту на високотемпературну пару. На Linox цей процес можна виконувати ефективніше особливим методом.
linox-recipe_rare-earth-refining=Хімічно переробляє величезну кількість каменю, видобуваючи рідкісноземельні елементи з дивовижним виходом 2%. Яскравий приклад передових технологій Linox.
linox-recipe_samarium-centrifugation=Відокремлює самарій від рідкісноземельної руди центрифугуванням.
linox-recipe_rapid-distillation=Швидко запікає сиру нафту в надгарячій лаві, отримуючи дорогоцінне вугілля. Хоч процес і неефективний, цей екстремальний спосіб відображає винахідливість Linox.
linox-recipe_lava-based-rocket-fuel=Якщо додати трохи енергії до достатньо гарячої лави, вона виділяє надвисокотемпературний газ, придатний як ракетне паливо.
linox-recipe_froth-flotation-processing=Пінна флотація використовується для розділення гідрофобних і гідрофільних матеріалів.
linox-moshine-recipe_neodymium-crushing=Подрібнення неодимової руди, видобутої на Moshine, дає змогу легко отримати чистий порошок неодиму.

