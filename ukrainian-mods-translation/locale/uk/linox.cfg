linox-settings_hard-mode_no-starter-pack=[color=red]<Складно>[/color] Прибрати стартовий набір
linox-settings_hard-mode_use-surface-condition=[color=red]<Складно>[/color] Увімкнути обмеження поверхні Linox
linox-settings_hard-mode_disable-mantle-extractor=[color=red]<Складний режим>[/color] Вимкнути мантійний екстрактор
