[system]
cargo-pod-lost=Немає дозволу на вантажний посадковий майданчик. Вантаж втрачено.
cargo-pod-stop=Вантажна капсула не може знайти придатну поверхню для посадки. Процедуру посадки скасовано.
elevator-found=Оглядаючи посадковий майданчик, ви знайшли підозрілий ліфт, що веде вниз, до внутрішніх приміщень комплексу.\nСкористатися ліфтом можна за допомогою функції [shortcut=linox-shortcut_enter-elevator].
game-tip=[font=default-large-bold][color=yellow]Важлива порада![/color] Обов'язково перегляньте розділ «Поради й підказки» у верхньому правому куті екрана. Там регулярно оновлюватиметься вся інформація, потрібна для проходження![/font]
lava-dive=__1__ загинув(-ла) :: Спроба безрозсудної посадки в лаву.
rocket-silo-limit=На Linox можна використовувати лише вдосконалені ракетні шахти.
entrance-limit=Цю будівлю можна розміщувати лише на терміналі комплексу Linox.
heavy-limit=Ця будівля надто важка, щоб розмістити її тут.
elevator-down=Ви спустилися ліфтом углиб комплексу.
elevator-up=Ви піднялися ліфтом на поверхню.
cargo-allow=Доступ вантажів на планету Linox надано.
cargo-pad-allow=Отримано контроль над вантажним посадковим майданчиком на планеті Linox.
linox-orbit=СИСТЕМА :: Дослідження «Розвідка посадкової зони Linox» потребує космічної платформи на орбіті Linox. Дослідження скасовано.
settings-warning=[img=virtual-signal.signal-alert] Попередження :: Параметри мапи для рекурсивних креслень не відповідають рекомендованим.\nЯкщо позицію зони X,Y не встановлено на «Центр», приклади рекурсивних креслень для комплексів Linox можуть працювати неправильно.
