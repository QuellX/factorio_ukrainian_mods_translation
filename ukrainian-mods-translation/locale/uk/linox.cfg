[item-description]
rare-earth-powder=Рідкісноземельний порошок, змішаний з різними мінералами й камінням.
samarium-powder=Чистий порошок самарію, відокремлений від рідкісноземельного порошку. Спіканням із нього можна отримати самарій.
samarium=Самарій слугує матеріалом для постійних магнітів, здатних працювати за надзвичайно високих температур.
tungsten-gear-wheel=Матеріали з вольфраму мають дуже високу робочу температуру й чудову довговічність.
tungsten-stick=Матеріали з вольфраму мають дуже високу робочу температуру й чудову довговічність.
dysprosium-powder=Відомо, що диспрозій покращує характеристики постійних магнітів і має магнітострикцію — його довжина змінюється залежно від магнітного поля. Кажуть, його надзвичайно складно видобувати.
dysprosium-exoskeleton-equipment=Посилений вольфрамовою сталлю й оснащений штучними диспрозієвими м'язовими волокнами, що знижують енергоспоживання й підвищують продуктивність.
neodymium-oxide=Цей цінний оксид неодиму — результат нескінченного очищення. Тепер випаліть його за високої температури, щоб прибрати атоми кисню й отримати чистий неодим.
neodymium-powder=Нарешті чистий неодим. Змішайте цей порошок із залізом і диспрозієм, а потім спечіть, щоб створити неодимовий магніт. Чимале випробування, чи не так? Ой, обережно, не спітнійте над порошком.
neodymium-permanent-magnet=Постійний магніт із неодиму. Створює неймовірно сильне магнітне поле й використовується у високопродуктивних пристроях. Власне, неодим став найбільш видобуваним рідкісноземельним елементом у світі майже винятково завдяки цьому магніту.
erbium-oxide=Цінний оксид ербію, здобутий із великими труднощами. Тепер його лише треба випалити за високої температури, щоб отримати чистий ербій.
erbium-powder=Чистий порошок ербію. Ербій здебільшого використовують як легувальну домішку для оптичного підсилення, а додавання його в оптоволокно значно покращує якість сигналу. Бережіть очі!
linox-item_lava-data-card=Кажуть, у лаві Linox розчинено майже всі мислимі речовини. Навіть лава має чого нас навчити.
linox-item_rare-earth-data-card=Рідкісноземельні елементи використовують як хімічні каталізатори або для значного покращення властивостей матеріалів. Чому в цьому світі так багато всього, що треба вивчити?
linox-item_samarium-data-card=Кажуть, розуміючи самарій, можна глибше зрозуміти електромагнітні поля за високих температур. Скільки ж іще нам треба вчитися?
linox-item_dysprosium-data-card=Диспрозій часто додають у неодимові постійні магніти, а також використовують у виробництві напівпровідників і спеціальних сплавів, як-от терфенол. Ходять чутки, що чарівники полюбляють додавати його в зілля.
linox-item_neodymium-data-card=Неодим використовують для виготовлення найпотужніших відомих сьогодні постійних магнітів, і він є майже в будь-якому дорогому електронному пристрої. Власне, електрику для комп'ютера, на якому ви читаєте цей текст, цілком можуть виробляти за допомогою неодимових магнітів.
linox-item_erbium-data-card=Ербій здебільшого використовують як домішку для оптичного підсилення. Кажуть, його додавання в оптоволокно значно покращує якість сигналу. Можливо, ви навіть користуєтеся оптоволокном з ербієм, коли під'єднуєтеся до серверів багатокористувацької гри!
linox-item_linox-science-pack=Дослідницький пакет, що містить усе, що може запропонувати Linox.
linox-tool_badchest-area-viewer=Показує робочу зону BAD-скрині.

[mod-description]
linox=Linox — надзвичайно руйнівний світ, ще ближчий до сонця, ніж Вулканус. Сонячні корональні викиди й спалахи сягають самої поверхні, знищуючи все на своєму шляху, а величезні гравітаційні сили сонця невпинно скручують і деформують усю планету, створюючи екстремальне й вороже середовище. Чи лишилося на такому світі хоч щось, що варто видобувати?

