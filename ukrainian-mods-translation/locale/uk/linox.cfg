[tips-and-tricks-item-description]
linox-tips-and-tricks_briefing=[planet=linox-planet_linox] — надзвичайно руйнівний світ, ще ближчий до сонця, ніж Вулканус. Сонячні корональні викиди й спалахи сягають самої поверхні, знищуючи все на своєму шляху, а величезні гравітаційні сили сонця невпинно скручують і деформують усю планету, створюючи екстремальне й вороже середовище. Чи лишилося на такому світі хоч щось, що варто видобувати?
linox-tips-and-tricks_language-settings=Перш ніж поринути в Linox, наполегливо радимо налаштувати показані на зображенні параметри відповідно до вашої мови. Ці налаштування локалізують приклад рекурсивних креслень і дуже допоможуть під час проходження.\n\nКрім того, якщо змінити мову в особистих налаштуваннях і знову попросити L.O.R.A.X відновити приклад, можна отримати його іншою мовою.
linox-tips-and-tricks_exploration-log-1=Далекі сканування показують, що сильна спека величезного сонця розплавила поверхню, тож знайти придатні місця для посадки складно. Щоб дослідити планету, космічна платформа має спершу обстежити з орбіти відповідні посадкові зони. Посадка тут зараз означає вірну смерть.
linox-tips-and-tricks_exploration-log-2=Після численних спроб сканувати поверхню з космічного корабля на радарі нарешті щось з'явилося. На диво, невідомий [entity=cargo-landing-pad] зухвало стоїть посеред лавового океану. Під час спроби віддаленого доступу з'ясувалося, що майданчик налаштовано відхиляти всі типи посадки. Через суворі протоколи безпеки змінити це найближчим часом не вдасться, але, зважаючи на звички нашої цивілізації, навряд чи він відхилить пілотовану посадку.\n\nПримусова пілотована посадка можлива, але попереджаємо: через інтенсивну корональну активність сонця й відмову майданчика приймати вантажі жодної підтримки з орбітальної платформи отримати не вдасться. Виживання не гарантовано. Продовжити?
linox-tips-and-tricks_cargo-loss=[planet=linox-planet_linox] настільки близько до свого сонця, що сонячна корона й спалахи сягають поверхні планети. Через це вантажні капсули можуть бути пошкоджені чи знищені, і успішно приземляється лише близько 30% вантажу. Шанс успішної посадки можна підвищити дослідженням «Безпека виходу на орбіту».\n\n * Вантажні капсули, в яких перебуває гравець, не можуть бути знищені.\n * Базовий шанс успіху: 30%\n * Кожен рівень дослідження «Безпека виходу на орбіту» збільшує шанс успіху на 5 відсоткових пунктів.\n * Успіх обчислюється для кожної комірки вантажної капсули. Втрачені предмети видаляються з відповідних комірок.
linox-tips-and-tricks_placement_restriction=На [tile=linox-tile_linox-terminal-platform], [tile=linox-tile_linox-hazard-terminal-platform], [tile=linox-tile_linox-corridor] і [tile=linox-tile_linox-datacenter] можна розміщувати лише дуже обмежений набір об'єктів.\nЗокрема, [entity=linox-building_cargo-elevator] і [entity=linox-building_fluid-elevator] можна розміщувати лише на [tile=linox-tile_linox-terminal-platform] і [tile=linox-tile_linox-hazard-terminal-platform].
linox-tips-and-tricks_planetary-power-network=На Linox уже встановлено величезну планетарну енергомережу. Тому опори ЛЕП не потрібні, а наземна й підземна енергомережі з'єднані між собою.
linox-tips-and-tricks_npc-system=NPC — особливі об'єкти, що впливають на перебіг гри й показують свої імена жовтим унизу. З деякими NPC можна взаємодіяти, клацнувши на них.
linox-tips-and-tricks_recursive-blueprints=Система рекурсивних креслень дає змогу повністю автоматизувати розміщення й демонтаж креслень. За допомогою цієї системи можна автоматизувати виробництво різних предметів навіть у вкрай обмеженому просторі.\nУ підказках нижче ми коротко представимо приклад рекурсивних креслень, що входить до Linox, і пояснимо, як він працює.\n\nУвага: симуляція на цій сторінці трохи відрізняється від прикладу в грі, бо налаштована так, щоб наочно показати типову роботу системи рекурсивних креслень.
linox-tips-and-tricks_example-turn-on=Щоб запустити приклад, потрібні два кроки.\n\nСпершу у верхній частині прикладу знайдіть [item=constant-combinator], що видає сигнал [virtual-signal=signal-green], і ввімкніть його.\n\nДалі один раз перемкніть сигнал паузи внизу (увімкніть і вимкніть), щоб скинути систему. Після цього система працюватиме нормально.
linox-tips-and-tricks_bad-chest=Креслення, які використовує схема прикладу, лежать у книзі креслень усередині [item=blueprint-deployer2], показаного на схемі. Порядок креслень у цій книзі дуже важливий — про це в наступній підказці.
linox-tips-and-tricks_id-box=Посередині прикладу є два [item=constant-combinator]. Ці ID-блоки визначають, яке креслення з книги креслень у [item=blueprint-deployer2] буде використано для певного сигналу предмета.\nНаприклад, якщо сигнал [item=iron-plate] має значення 4, то коли надходить сигнал [item=iron-plate], використовується четверте креслення в книзі. Менші значення (креслення вище в книзі) мають вищий пріоритет.\n\nАле чому [item=constant-combinator] два? Дізнайтеся на наступній сторінці!
linox-tips-and-tricks_negative-signal=Унизу прикладу є чотири [item=constant-combinator], що видають сигнали предметів. Ці комбінатори задають умови виведення сигналів предметів. Два ліві видають інвертовані сигнали предметів, корисні для креслень, що зменшують запас потрібних предметів.\n\nПерший комбінатор вимикає сигнал, коли запас потрібного предмета падає нижче певної кількості. У прикладі сигнал [item=stone] має значення 1500. Тобто коли [item=stone] стає 1500 чи менше, сигнал вимикається. Зауважте, що це умова вимкнення: сигнал не ввімкнеться знову, якщо кількість зросте понад 1500. Умову ввімкнення задають у другому комбінаторі.\n\nДругий комбінатор вмикає сигнал, коли запас потрібного предмета перевищує певну кількість. У прикладі сигнал [item=stone] має значення 3000. Тобто коли [item=stone] перевищує 3000, сигнал вмикається.
linox-tips-and-tricks_positive-signal=Два праві комбінатори також видають сигнали предметів і, на відміну від інвертованих, корисні для креслень, що збільшують запас потрібних предметів.\n\nТретій комбінатор вмикає сигнал, коли запас потрібного предмета падає нижче певної кількості. У прикладі сигнал [item=iron-plate] має значення 500. Тобто коли [item=iron-plate] стає 500 чи менше, сигнал вмикається. В іншому він працює так само, як інвертовані сигнали.\n\nЧетвертий комбінатор вимикає сигнал, коли запас потрібного предмета перевищує певну кількість. У прикладі сигнал [item=iron-plate] має значення 2000. Тобто коли [item=iron-plate] перевищує 2000, сигнал вимикається.
linox-tips-and-tricks_hover-tips=Комбінатори в прикладі містять різні важливі описи. Обов'язково клацніть на комбінатор або наведіть на нього курсор, щоб переглянути подробиці.
linox-tips-and-tricks_bad-chest-area-viewer=Індикатор зони BAD-скрині наочно показує і робочу зону, і центральну точку BAD-скрині. Робоча зона визначає, де діють команди демонтажу, а центральна точка — де розміщуються креслення, тож уважно це перевіряйте.
linox-tips-and-tricks_adjust-blueprint-origin=Іноді креслення може розміститися не там, де ви задумали, як показано червоним.\nЩоб виправити це, змініть початок координат креслення в редакторі креслень (показано помаранчевим), змінивши значення X і Y, зараз установлені на 6 і 8.\nЦі значення змінюють точку прив'язки креслення (верхню ліву клітинку квадрата з піктограмою прапорця).\nПісля зміни значень креслення має розміщуватися правильно, як показано зеленим.
linox-tips-and-tricks_power-converter=Перетворювач енергії — система, що забезпечує комплекси Linox великою ємністю енергії. Внизу цього особливого акумулятора є вхід і вихід логічної мережі, до яких можна під'єднати дроти, щоб безпосередньо керувати перетворювачем енергії.
linox-tips-and-tricks_reactive-power=Вітаю, партнере. Це L.O.R.A.X. Я терміново зв'язуюся з вами, бо перед використанням перетворювача енергії є важливе питання.\n\nЗараз основна схема перетворювача енергії пошкоджена. Через це [color=yellow]увімкнення перетворювача енергії може спричинити «реактивну потужність», що збільшить загальне енергоспоживання аж удвічі[/color]. Щоб розв'язати цю проблему, треба реалізувати роботу основної схеми безпосередньо сигналами логічної мережі.\n[color=yellow]Наше завдання — подавати належну кількість допоміжної енергії, щоб компенсувати реактивну потужність.[/color] Не хвилюйтеся. Це не так складно, як здається, а різниця з попереднім станом — лише трохи нижча точність.\n\n\nПеретворювач енергії видає такі сигнали:\n\n[virtual-signal=signal-P] показує поточне загальне енергоспоживання без реактивної потужності, у ватах (Вт).\n[virtual-signal=signal-O] показує вихід перетворювача енергії, що компенсує реактивну потужність, у ватах (Вт).\n\n[color=yellow]Наша мета — тримати значення [virtual-signal=signal-O] якомога ближчим до [virtual-signal=signal-P].[/color]\nВеличину [virtual-signal=signal-O] не можна задати напряму. На неї можна впливати лише опосередковано через вхідні сигнали.\n\n\nПеретворювач енергії приймає такі вхідні сигнали:\n\n[virtual-signal=signal-E] ненульове значення вмикає перетворювач енергії. Ви отримуєте 5 ГДж ємності, але починає виникати реактивна потужність.\nЯкщо не хочете керувати реактивною потужністю, цим сигналом можна вимкнути перетворювач енергії, але ви втратите його ємність.\n\n[virtual-signal=signal-I] керує виходом перетворювача енергії.\nЗначення [virtual-signal=signal-I] 1 чи більше збільшує вихід.\nЗначення [virtual-signal=signal-I] -1 чи менше зменшує вихід.\n\nВихід перетворювача енергії не можна задати напряму; його можна лише збільшувати чи зменшувати додатними чи від'ємними вхідними значеннями.\n\n\nЯкщо порівнювати з автомобілем, [virtual-signal=signal-I] працює як педаль газу.\nНавіть якщо втиснути педаль до упору, автомобілю потрібен час, щоб набрати максимальну швидкість.\n\nДодаючи чи віднімаючи сигнал [virtual-signal=signal-I] у потрібний момент, можна вивести перетворювач енергії на потрібний рівень.\n\nЯкщо керувати правильно, частка реактивної потужності в статистиці енергії значно знизиться. Удачі!
linox-tips-and-tricks_placement_restriction_2=На клітинках [tile=linox-tile_linox-facility-platform] і [tile=linox-tile_linox-hazard-facility-platform] дозволено розміщувати скрині, [item=linox-building_core-roboport] і [item=accumulator]. Для всього іншого діють ті самі обмеження розміщення, що й в обмеженні 1.
