[fluid-description]
low-concentration-neodymium-solution=Розчин, що містить неодим, хоча його ледве помітно.
high-concentration-neodymium-solution=Розчин, що містить неодим, тепер помітно насиченіший.
neodymium-solution=Повністю концентрований розчин неодиму — сповнений потенціалу, як дитина з безмежними можливостями.
waste-water=Непотрібні стічні води з фабрики. Жахливо смердять.
low-concentration-erbium-solution=Розчин із низькою концентрацією ербію. Ледве можна сказати, що ербій там є.
high-concentration-erbium-solution=Розчин із високою концентрацією ербію. Тепер ербій помітно присутній.
erbium-solution=Розчин, готовий до вилучення ербію. Попереду захопливі часи.

