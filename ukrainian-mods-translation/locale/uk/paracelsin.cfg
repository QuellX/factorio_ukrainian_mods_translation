[mod-setting-description]
paracelsin-zinc-implementation=Додає гальванізаційний дослідницький пакет до деяких технологій Аквіло, додає цинковий припій до квантових процесорів, а електричні котушки — до рейкотронів, рейкотронових турелей, термоядерних реакторів, термоядерних генераторів і портативних термоядерних реакторів. Мод розраховано на гру з увімкненим налаштуванням.

