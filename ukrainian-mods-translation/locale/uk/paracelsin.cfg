[tips-and-tricks-item-name]
paracelsin-briefing=Брифінг: Парацельсин
fulgoran-log=Фульґорський журнал

[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin] — замерзла пустка, як і [planet=aquilo], але на відміну від аміачного світу має тверду поверхню. Під землею планета приховує великий океан [fluid=nitrogen], який витікає на поверхню, утворюючи [tile=nitrogen-lake]. Планета багата на [item=sphalerite] та [item=tetrahedrite] — сполуки [item=zinc], — а також на [item=vaterite]. Поверхню також усіяно [entity=water-cryovolcano].
fulgoran-log=Усередині [entity=crashed-fulgoran-pod] разом із кресленнями ви знайшли повідомлення. Завдяки дослідженням на Фульґорі вам вдалося його перекласти: «Вітаємо всі форми життя, які можуть знайти це. Ми — фульґорці, і ми надіслали ці капсули в цю замерзлу пустку на пошуки нафти. Наше прагнення до зростання мало деякі незначні наслідки для довкілля нашої планети — не те щоб нас це турбувало, — але також вичерпало більшість наших улюблених запасів нафти й залишило нам чималий запас побічних продуктів її переробки. Якщо ви знаєте місце, де є нафта, будь ласка, зв'яжіться з нашим найближчим планетарним форпостом. Якщо ваша планета наразі не здатна до космічних подорожей, будь ласка, передайте це повідомлення тим, хто здатен. А якщо на той час ми вже вимремо... Ну, навряд чи ми можемо зазнати невдачі.» З вас і фульґорців вийшли б чудові друзі.
