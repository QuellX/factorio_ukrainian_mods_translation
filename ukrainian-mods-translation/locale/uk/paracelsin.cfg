[technology-description]
planet-discovery-paracelsin=Замерзла пустка з дуже активним кріовулканізмом. Поверхню вкривають озера [fluid=nitrogen], що витікають з підземного океану. Поверхню всіяно [entity=water-cryovolcano] поряд із жилами [item=tetrahedrite] та [item=sphalerite], необхідних для видобутку [item=zinc]. Невеликими жилами трапляється також [item=vaterite]. Усе, що побудовано на планеті, слід постійно підігрівати, інакше воно замерзне, а всі небажані побічні продукти видобутку цинку потрібно утилізувати.
cryovolcanic-power=Усередині замерзлої [entity=crashed-fulgoran-pod] знайшлися стародавні креслення особливого електрогенератора, що використовує рідку воду з [entity=water-cryovolcano] для вироблення електрики, та надзвичайно швидкого, але неефективного [entity=burner-pumpjack]. З їхньою допомогою можна запустити енергетику на планеті.
nitric-acid-handling=Проаналізувавши спонтанні хімічні реакції, що відбуваються на [entity=big-metallic-rock], ми можемо відтворити їх для виробництва [fluid=nitric-acid].
vaterite-processing=Розділіть [item=vaterite] на складові.
sphalerite-processing=Переробляйте [item=sphalerite] на [fluid=zinc-concentrate], [item=iron-ore] та [item=sulfur].
tetrahedrite-processing=Переробляйте [item=tetrahedrite] на [fluid=zinc-concentrate], [item=copper-ore] та [item=sulfur].
zinc-extraction=Переробляйте [fluid=dirty-zinc-solution] на [item=zinc] різними способами.
electrochemical-plant=Виробнича установка, що використовує електрохімію для всіляких хімічних процесів.
mechanical-plant=Виробнича установка, що використовує вдосконалені механічні процеси для виготовлення різних предметів.
galvanization-science-pack=Дозволяє вивчати більше, ніж базові застосування гальванізації.
vaterite-processing-productivity=Збільшений вихід з [recipe=vaterite-processing].
zinc-piping=Міцніші ізольовані труби з [item=zinc-plate]. Не замерзають на холодних поверхнях, як-от [planet=paracelsin] чи [planet=aquilo], і можуть транспортувати рідини під землею на більші відстані.
axe-mining-speed=Оцинкувавши та відремонтувавши кайло, можна досягти вищої швидкості ручного видобування.
advanced-repair-device=Технологія нанороботів, що ремонтує швидше та довше, ніж звичайний [item=repair-pack].
solar-matrix=Хоча сонячна енергія на [planet=paracelsin] зовсім непридатна, парацельсинські технології відкривають нові сонячні застосування.
accumulator-v2=Потужніші акумулятори, що використовують [item=supercapacitor] та [item=electric-coil] для зберігання більшої кількості енергії.
elevated-pipe=Міцні опорні конструкції, що дозволяють розміщувати труби високо над землею.
galvanized-steel=Нанесення [item=zinc] на [item=steel-plate] робить їх міцнішими та стійкими до корозії.
vaterite-formation=Через нестачу великих покладів [item=vaterite] на планеті ми маємо дослідити спосіб його синтезу.
macerating=Змінена конструкція дробарки, здатна подрібнити будь-який предмет на пил.

