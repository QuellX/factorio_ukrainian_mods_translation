[space-location-description]
paracelsin=Замерзла пустка з дуже активним кріовулканізмом. Поверхню вкривають озера [fluid=nitrogen], що витікають з підземного океану. Поверхню всіяно [entity=water-cryovolcano] поряд із жилами [item=tetrahedrite] та [item=sphalerite], необхідних для видобутку [item=zinc]. Невеликими жилами трапляється також [item=vaterite]. Усе, що побудовано на планеті, слід постійно підігрівати, інакше воно замерзне, а всі небажані побічні продукти видобутку цинку потрібно утилізувати.

