[mod-setting-description]
planet-crucible-vanilla-change-amount=Чи додавати вміст Крусібла до деяких технологій і рецептів, що відкриваються на Аквіло.
planet-crucible-add-science-pack-prod=Чи додавати нескінченні технології продуктивності дослідницьких пакетів.
planet-crucible-difficulty=Впливає на силу гравітації Крусібла й на те, наскільки небезпечне необережне поводження з металевим воднем.
planet-crucible-update-asteroid-resistances=Чи оновлювати стійкості астероїдів з урахуванням типів шкоди, яку може завдавати [entity=planet-crucible-laser-turret]. Для балансу це налаштування слід увімкнути, але його можна вимкнути заради сумісності.

[string-mod-setting-description]
planet-crucible-vanilla-change-amount-all=Додає продукти виробничих ланцюжків Крусібла до більшості рецептів, що відкриваються на Аквіло. Так мод задумано грати, особливо якщо його встановлено як єдину додаткову планету; для проходжень з багатьма додатковими планетами може пасувати гірше.
planet-crucible-vanilla-change-amount-no-recipes=Додає дослідницький пакет високого тиску до більшості технологій, що потребують пакетів усіх інших внутрішніх планет.
planet-crucible-vanilla-change-amount-no-technologies=Додає дослідницький пакет високого тиску лише до прометієвого дослідницького пакета й технологій продуктивності досліджень.
planet-crucible-vanilla-change-amount-none=Не змінює наявних рецептів і технологій.

