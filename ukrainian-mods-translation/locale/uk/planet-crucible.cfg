[technology-description]
planet-discovery-crucible=Великий щільний кам'янистий світ із нищівною гравітацією й атмосферним тиском. Через сильну гравітацію, щоб збудувати ракету на [space-location=crucible], доведеться опанувати ресурси планети. Можливостей безліч... якщо витримаєте тиск.
planet-crucible-kiln=Велика піч, що працює безпосередньо від тепла. Окрім звичайної виплавки, приймає рідини, що критично для переробки [item=planet-crucible-skarn].
planet-crucible-emulsion-processing=Дає змогу переробляти [fluid=planet-crucible-emulsion] на корисні рідини, іноді отримуючи необроблений [item=planet-crucible-diamond].
planet-crucible-skarn-processing-adv=Розкриває весь потенціал [item=planet-crucible-skarn].
planet-crucible-pressure-forge=Виробнича установка для процесів високого тиску.
planet-crucible-hydrogen-processing=Водень під високим тиском має багато корисних властивостей, але не пробачає необережного поводження.
planet-crucible-hydrogen-metallization=Створюйте металевий водень — святий Грааль фізики високих тисків.
planet-crucible-science-pack=Вдосконаленіші застосування високого тиску.
planet-crucible-rocket-part=Збудуйте ракету, здатну вийти на орбіту [space-location=crucible].
planet-crucible-gem-synthesis=Ефективніші рецепти [item=planet-crucible-ruby] і [item=planet-crucible-diamond].
planet-crucible-thruster=Використовуйте металевий водень, щоб легше вибратися з глибокого гравітаційного колодязя [space-location=crucible].
planet-crucible-military=Використовуйте металевий водень, щоб виготовляти боєприпаси в космосі без астероїдів.
planet-crucible-lithium-hydride=Ефективніші рецепти металізації водню.
planet-crucible-night-vision-mk2=Компактніший [item=night-vision-equipment].
planet-crucible-personal-laser-mk2=Потужніший [item=personal-laser-defense-equipment].
planet-crucible-offshore-pump=Вдосконалена [entity=offshore-pump], здатна працювати за сильної гравітації [space-location=crucible].
planet-crucible-optics=Вдосконалені засоби фокусування й керування світлом.
planet-crucible-laser=Досконаліша лазерна зброя, якій для фокусування збільшеної енергії потрібна лінза.
planet-crucible-lens-one=Фокусувальна лінза для [entity=planet-crucible-laser-turret], що завдає ударної шкоди.
