[tips-and-tricks-item-description]
planet-crucible-briefing=[planet=crucible] — щільна планета без [entity=iron-ore], [entity=copper-ore], [entity=uranium-ore], [entity=stone], [fluid=water] і [entity=crude-oil], але всі потрібні предмети можна виготовити з [entity=planet-crucible-skarn] і [entity=planet-crucible-emulsion].\n[entity=solar-panel] тут ефективніші. Довкілля негостинне, але природних небезпек немає.\n[tile=planet-crucible-lava] можна викачувати лише пізніше, а засипати насипом — ще значно пізніше, але через неї можна прокладати надземні рейки.
planet-crucible-gravity=[img=utility/warning_icon]УВАГА[img=utility/warning_icon] Через екстремальну гравітацію й атмосферний тиск [planet=crucible] звичайного [item=rocket-fuel] недостатньо, щоб вийти в космос.\nПісля посадки на [planet=crucible] вам доведеться використати [item=planet-crucible-science-pack], щоб дослідити спосіб покинути планету.
planet-crucible-metallic-hydrogen=Через високу густину енергії й низьку стабільність [tooltip=металевий водень,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum] надзвичайно небезпечний, і під час його виробництва потрібні запобіжні заходи.\n[tooltip=Металевий водень,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum] у будь-якій формі вибухає, якщо його знищити, і не переробляється, але його можна безпечно переробити повторно в [entity=planet-crucible-pressure-forge]. Також його можна безпечно утилізувати в космічній порожнечі.\n[tooltip=Найменш стабільні форми,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-unstable-enum] металевого водню зрештою вибухнуть самі, якщо їх належно не переробити чи не утилізувати, тож їх не можна накопичувати.
planet-crucible-metallic-hydrogen-enum=Металевий водень:\n[item=planet-crucible-denatured-hydrogen] Денатурований водень\n[item=planet-crucible-denatured-hydrogen-critical] Денатурований водень (критичний)\n[item=planet-crucible-hydrogen-plate] Воднева пластина (стабільна)\n[item=planet-crucible-hydrogen-plate-activated] Воднева пластина (активна)\n[item=planet-crucible-hydrogen-plate-unstable] Воднева пластина (нестабільна)\n[item=planet-crucible-hydrogen-plate-critical] Воднева пластина (критична)\n[item=planet-crucible-lithium-hydride] Гідрид літію\n[item=planet-crucible-hydrogen-cable] Воднева нитка
planet-crucible-metallic-hydrogen-unstable-enum=Найменш стабільний металевий водень:\n[item=planet-crucible-denatured-hydrogen] Денатурований водень\n[item=planet-crucible-denatured-hydrogen-critical] Денатурований водень (критичний)\n[item=planet-crucible-hydrogen-plate-activated] Воднева пластина (активна)\n[item=planet-crucible-hydrogen-plate-unstable] Воднева пластина (нестабільна)\n[item=planet-crucible-hydrogen-plate-critical] Воднева пластина (критична)
planet-crucible-space-platform=[img=utility/warning_icon]УВАГА[img=utility/warning_icon] Через екстремальну гравітацію [planet=crucible] космічним платформам потрібна значна тяга, щоб дістатися [space-location=crucible-orbit]. Платформа має вирушати, лише якщо здатна тримати швидкість значно вищу за __1__ км/с.\nБіля [planet=crucible] мало астероїдів, тож, можливо, доведеться використати [item=planet-crucible-science-pack], щоб дослідити альтернативні способи отримання потрібних ресурсів у космосі.

