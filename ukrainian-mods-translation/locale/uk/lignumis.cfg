deep-miner=Відкриває доступ до величезних покладів золота, раніше недосяжних.
steam-automation=Дає змогу досліджувати складніші технології на основі виробів з деревини й золота.
wood-liquefaction=Перетворення деревини на рідину відкриває нові можливості.
provisional-rocketry=Нам треба якось вибратися з цього супутника. Це наш єдиний шанс!
basic-gun-turret=Найпростіший автоматичний захист. Небагато, але поки має вистачити.
basic-construction-robotics-gold=Найпростіша допомога в особистих будівельних потребах.
basic-construction-robotics-copper=Найпростіша допомога в особистих будівельних потребах.
wood-logistics=Повільне, але автоматичне перевезення вантажів.
tree-seeding=[entity=burner-agricultural-tower] дає змогу садити насіння в придатний ґрунт. Посаджене насіння виростає в дерева, які можна збирати.\n[entity=tree-plant] росте на траві й землі. [entity=gold-stromatolite] росте на [tile=natural-gold-soil].
active-noise-cancelling=Допомагає впоратися з шумом.
quality-assembler=Високоякісний складальний автомат для виготовлення лише найякісніших машин з особливого ресурсу, що є лише на Лігнумісі.
gold-module=Опануйте якісне складання, щоб відкрити бездоганний модуль, що дає змогу виготовляти найкращі доступні предмети.
