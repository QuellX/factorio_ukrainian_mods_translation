provisional-rocket-silo-button-tooltip-inventory=Ваш особистий інвентар має бути порожнім!
provisional-rocket-silo-button-tooltip-target=Ви ще не знаєте, куди тікати!
provisional-rocket-silo-description=Заповніть інвентар ракети й запустіть її, щоб утекти на __1__.\nНе забудьте взяти матеріали, щоб швидко налагодити виробництво заліза, міді й деревини.

