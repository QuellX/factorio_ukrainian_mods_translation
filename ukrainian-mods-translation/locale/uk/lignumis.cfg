lignumobile-basics=Навчіться виготовляти особистий транспорт. На жаль, вам бракує якогось міцнішого матеріалу.
lignumobile=Ви знайшли відповідні матеріали й продовжуєте дослідження, поєднуючи наявні знання з новими матеріалами, щоб створити робочий транспортний засіб.
