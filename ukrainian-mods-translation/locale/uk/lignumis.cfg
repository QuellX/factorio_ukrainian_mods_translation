[tips-and-tricks-item-description]
lignumis-briefing=[planet=lignumis] — супутник [planet=nauvis], з якого потрібно втекти, щоб отримати доступ до вдосконаленіших технологій. Основні ресурси — [item=wood], [item=gold-ore], [item=peat] і [item=stone]. На супутнику немає заліза й міді, тож ваші можливості дуже обмежені: єдиний доступний метал — на перший погляд не надто цінна [item=gold-ore]. Електрику ви відкриєте лише після втечі.\n\n[img=utility/warning_icon] Лігнуміс впливає на решту гри, змінюючи ванільні рецепти й технології. Загляньте в налаштування мода, щоб налаштувати їх на свій смак. Або встановіть Director's Cut з порталу модів для повного досвіду.
lignumis-burner-agriculture=Постачати сільськогосподарським вежам і насіння, і паливо складніше, ніж у вдосконаленого електричного аналога. Через обмеження рушія маніпулятори продовжують брати насіння й ігнорують паливо, якщо воно лежить на неправильному боці конвеєра. Використовуйте логічні схеми або кілька маніпуляторів, щоб уникнути таких проблем.
lignumis-noise=Мешканці [planet=lignumis] чутливі до [img=airborne-pollutant/noise] гучних звуків. Усе механічне, що ви створюєте, потенційно доволі гучне. Тримайте базу невеликою й ставте стіни, щоб шум лишався всередині.\nДеякі засоби зниження шуму: [img=item/wooden-wall] стіни, [img=entity/tree-01] дерева, [img=item/efficiency-module] модулі ощадливості, [item=active-noise-cancelling-tower].
lignumis-steam=[entity=steam-assembling-machine] і [entity=steam-inserter] дають нові інструменти для швидшого будівництва й компактніших виробничих ланцюжків. Через брак кращих технологій спалювання [item=moist-stromatolite-remnant] у [entity=desiccation-furnace] — ваше єдине джерело [fluid=steam]. Балансуйте пару, спалюючи надлишок вологих решток строматоліту у звичайних печах.\n\n[img=utility/warning_icon] Виробленої [fluid=steam] не вистачить, щоб живити всю базу. Зберігайте старі твердопаливні установки, де можливо.
lignumis-escaping=[entity=provisional-rocket-silo] дає змогу взяти з собою чималий запас. Беріть переважно інфраструктурні предмети для швидкого старту на Наувісі. Паливо, золото й дослідницькі пакети залиште.\n\n[img=utility/warning_icon] Досліджувати все перед відльотом не обов'язково, але варто. Або принаймні переконайтеся, що зможете продовжити дослідження після відльоту.\n[img=utility/warning_icon] Ваша база й далі шумить, коли вас немає. До того ж вороги продовжать розширюватися. Переконайтеся, що база захищена, перш ніж відлітати.
