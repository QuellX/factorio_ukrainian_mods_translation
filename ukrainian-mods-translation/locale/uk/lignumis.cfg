[mod-setting-description]
lignumis-belt-progression=Жовті конвеєри потребуватимуть для виготовлення дерев'яних конвеєрів.
lignumis-inserter-progression=Жовті електричні маніпулятори потребуватимуть для виготовлення твердопаливних маніпуляторів.
lignumis-ammo-progression=Магазини з набоями потребуватимуть для виготовлення магазинів з дерев'яними дротиками.
lignumis-technology-progression=Додає дерев'яні й парові дослідницькі пакети до більшості технологій пізньої гри. Якщо вимкнути, дослідницькі пакети Лігнуміса втрачають значення в пізній грі.
lignumis-circuit-progression=Електронні схеми потребуватимуть для виготовлення базових схем.
lignumis-assembler-progression=Складальний автомат 1 потребуватиме для виготовлення твердопаливних складальних автоматів.
lignumis-lumber-mill-more-recipes=Лісопилка також може виготовляти базові турелі, твердопаливні складальні автомати й твердопаливні маніпулятори. Покращує баланс використання деревини, коли ввімкнено всі телескопічні рецепти, і допомагає в марафонах.
lignumis-early-robots=Особисті роботи переносяться з парової на дерев'яну науку й стають трохи швидшими.
lignumis-lab=Переносить рецепт конвеєра в дослідження логістики й використовує дерев'яні конвеєри в рецепті лабораторії, щоб її можна було виготовити одразу після посадки на Наувісі.
lignumis-nauvis-steam-start=Замість того, щоб відкриватися як передумова автоматизаційного дослідницького пакета, електрику доводиться досліджувати цим пакетом, що змушує починати на Наувісі з твердопаливних і парових машин.
lignumis-fulgora-wood=Додає дерев'яні шестерні до переробки брухту як основне джерело деревини. Вимкніть, якщо маєте інше джерело деревини або все імпортуєте з інших планет.
lignumis-extended-compatibility=Ще більше наближає мод до оверхолу. Замінює наявні механіки як у ванільній грі, так і в планетних модах, напр., вимагає глибинного бура для видобування урану на Наувісі й жеод на Харіоні.
lignumis-double-rocket=Імпровізована ракета може везти 80 слотів замість 40.
lignumis-sciences-spoil=І дерев'яні, і парові дослідницькі пакети псуються для додаткової складності.
lignumis-infinite-astroponics-productivity-research=Дослідження продуктивності астропоніки нескінченне, а не обмежене 5-м рівнем (що дає 50% продуктивності).
lignumis-electric-lumber-mill=Лісопилка споживатиме електрику замість твердого палива й відкриватиметься після дослідження електрики.
lignumis-k2so-gold-tech-card=Технології пізньої гри, що потребували б дерев'яних і парових дослідницьких пакетів, натомість потребують золотих технологічних карток, виготовлених із золота Лігнуміса. Потрібні ввімкнені прогресивні технології.

