[technology-description]
panglia_planet_discovery_panglia=Панглія — дивний пишний супутник Ґлеби, де можна отримувати енергію з рослинності, знайти дивні матеріали, що самі розмножуються, і місця, де час неприродно викривляється.
panglia_branbalite_slurry=Дуже поживна рослина.
panglia_branbalite_slurry_to_crudeoil=Перетворюйте бранбаліт на сиру нафту.
panglia_panglite_multiplication=Пангліт — інопланетний сплав, що необмежено розростається під час нагрівання.
panglia_panglite_fiber=Надзвичайно стійкий і універсальний матеріал завдяки здатності самовідновлюватися під дією тепла.
panglia_panglite_glass=Поєднання пангліту й скла в тонкі шари дає змогу використовувати заломлення лазера для роботи в мікроскопічному масштабі.
panglia_advanced_optics_nanotech=Створіть машину на основі панглітового скла, що може картографувати й змінювати елементи на молекулярному рівні, як-от геноми.
panglia_dna_manipulation=Створюйте нові організми, складаючи унікальну ДНК.
panglia_simulation_chamber=Утримує організми у відносному стазисі.
panglia_simulation_matrix=Створіть повну віртуальну реальність, до якої під'єднаєте свої організми, щоб вони прожили цілком вигадане життя.
panglia_sentient_processor=Завантажте свідомість у комп'ютер. Поєднання біології та ШІ може бути найдосконалішою формою обчислювальної потужності.
panglia_worker-robots-speed=Повна переробка внутрішніх схем дає змогу роботам працювати ще швидше.
panglia_worker-robots-storage=Розумніший спосіб захоплювати й перевозити предмети. Роботи отримують більше місця для вантажу.
panglia_crusher=Подрібнює будь-який матеріал на дуже тонкий композитний порошок.
panglia_igneous_rock_to_lava=Переплавляйте магматичні породи на лаву.
panglia_tech_timewarp_data=Збирайте [font=moshine-data][color=#d699ff]time_flow.data[/color][/font] у зонах викривлення часу, щоб зрозуміти, як впливати на плин часу.
panglia_tech_timewarp_data_nocolor=Збирайте time_flow.data у зонах викривлення часу, щоб зрозуміти, як впливати на плин часу.

