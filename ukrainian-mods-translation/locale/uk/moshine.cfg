moshine-briefing=[planet=moshine] — гаряча вулканічна планета, багата на [item=sand] (що відкриє [item=silicon] і [item=glass]) та [item=neodymium] (добра основа для [item=magnet]). Тут так спекотно, що важко збудувати [entity=accumulator], але, на щастя, гарячі [entity=steam-geyser] трапляються всюди. Радимо взяти із собою щонайменше одну [entity=foundry], щоб переробляти [fluid=molten-iron] із залізних озер. [fluid=crude-oil] отримуйте зрідженням вугілля.

