multi-ore=Містить різні руди. Є [color=red]малий[/color] шанс видобути [color=red]велику[/color] жилу неодиму (1 з 300+).
neural_computer=Працює як лабораторія: відкриває технології, розвиваючи віртуальний інтелект. Ядра ШІ значно пришвидшують його.
