[technology-description]
planet-discovery-moshine=Дуже сонячна планета, багата на неодим, кремній і сонячну енергію. Таємничі розбиті зонди містять чимало знань, які можна використати, щоб розсунути межі штучного інтелекту.
moshine-concrete-from-molten-iron-and-sand=Виготовляйте бетон з розплавленого заліза й піску.
moshine-petroleum-from-sand-sulfur-steam-carbon=Виготовляйте нафтовий газ з піску, сірки й вугілля
moshine-tech-silicon=Дає змогу перетворювати пісок на кремній.
moshine-tech-glass=Виплавка піску дає скло.
moshine-tech-silicon-cell=Кремнієві комірки — невід'ємна частина комп'ютерів.
moshine-tech-silicon-carbide=Карбід кремнію використовується як потужний ізолятор.
moshine-tech-magnet=Переробляйте неодим і залізо на потужні магніти. Неодим — дуже рідкісний метал, але трапляється зазвичай у великих кількостях.
moshine-tech-datacell-empty=Дає змогу обробляти дані й зберігати їх у комірках.
moshine-tech-data-processor-building=Обробник даних перетворює дані й виконує пов'язані з даними завдання.
moshine-tech-neural_computer=Нейрокомп'ютер здобуває нові знання, обробляючи величезні обсяги інформації.
moshine-tech-data-extractor=Дає змогу отримувати й розшифровувати дані з розбитих зондів на Мошайні.
moshine-tech-3d-data-storage=Голографічні ядра — оптимальний спосіб розмістити складну модель ШІ, а згодом навчити її.
moshine-tech-data-processor=Дає змогу створювати складний штучний інтелект, але обережно: його перша форма вибухонебезпечна.
moshine-tech-ai-trainer=Моделі ШІ можна оптимізувати, навчаючи їх на самих собі, щоб досягти небачених рівнів досліджень.
moshine-tech-ai-tier=Навчання експоненційно потужніших ядер ШІ.
moshine-tech-processing-grid=Виконує надзвичайно складні операції.
tech-space-trains=Магнітні потяги з більшою місткістю й експрес-швидкістю.
minimalist-rails=Міцніші рейки, що передають енергію, з мінералів Мошайна.
minimalist-elevated-rails=Надземна версія неодимових рейок.
moshine-tech-cosmicscanner=Скануйте далекий всесвіт. Відгук на потужний сигнал, який він надсилає, може дати нам багато даних про всесвіт і те, як він влаштований.
moshine-tech-cosmic-data-outsignal-creation=Коли ви зрештою збудуєте [entity=moshine_cosmicscanner], доведеться створити складний сигнал із точними координатами, щоб сподіватися записати якісь корисні дані.
moshine-tech-cosmicscanner-construction1=Починає проєкт [entity=moshine_cosmicscanner] — гігантської енергоненажерної космічної мегаструктури, що надсилає сигнальні промені в далекий космос і збирає [font=moshine-data][color=#8086ff]cosmos.data[/color][/font].
moshine-tech-cosmicscanner-construction1_nocolor=Починає проєкт [entity=moshine_cosmicscanner] — гігантської енергоненажерної космічної мегаструктури, що надсилає сигнальні промені в далекий космос і збирає cosmos.data.
moshine-tech-opticalfiber-storage-tank=Дає змогу зберігати дані на сервері даних.

