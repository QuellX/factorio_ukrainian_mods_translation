[tips-and-tricks-item-name]
recursive-pb-common=Recursive blueprints+
recursive-bp-offset-tool=Обчислювач зміщень

[tips-and-tricks-item-description]
recursive-pb-common=Мод BR+ складається з 2 пристроїв для автоматизованого використання креслень.\nУсі пристрої керуються логічними сигналами.\n\n[font=default-bold]Спільні сигнали для всіх пристроїв[/font]\nТипово значення сигналів [img=virtual-signal.signal-X] і [img=virtual-signal.signal-Y] вказують, на скільки клітинок від цього пристрою потрібно відступити по горизонталі й вертикалі (додатні напрямки — праворуч і вниз). Якщо є сигнал [virtual-signal=rbp-absolute]>0, ці сигнали тлумачаться як абсолютні координати.\nДалі в цих підказках сукупність цих трьох сигналів позначається як [color=yellow]координати[/color].\n\nЗначення сигналів [img=virtual-signal.signal-W] і [img=virtual-signal.signal-H] задають ширину й висоту ділянки.\nПоложення ділянки можна задати двома способами: коли [color=yellow]координати[/color] вказують на кут ділянки або на центр.\nТочку вибирає сигнал [virtual-signal=rbp-center]: >0 — центр; <0 — кут; =0 — визначається налаштуванням мода (для мапи) "[font=default-bold]__1__[/font]".\nЯкщо точкою вибрано кут ділянки, ширина й висота фактично задають зміщення від [color=yellow]координат[/color], тож можна використовувати від'ємні значення.\nЯкщо точкою вибрано центр ділянки, від'ємні ширина й висота не мають сенсу, тож у такому разі знак чисел ігнорується.\nДалі в цих підказках сукупність цих шести сигналів позначається як [color=yellow]ділянка[/color].
recursive-pb-scanner=Підраховує кількість об'єктів у вказаній [color=yellow]ділянці[/color] й видає результат сигналами для логічної мережі.\nОскільки деякі категорії об'єктів, як-от будівлі та їхні привиди, позначаються однаковими сигналами, потрібно задати фільтр сканування сигналом [img=virtual-signal.signal-F]. Конкретні значення фільтра можна дізнатися в самому сканері, натиснувши кнопку сигналу фільтра.\nСканування відбувається не постійно, а лише коли змінюється будь-який вхідний сигнал.

[rbp-tnt-description-parts]
tool-area-viewer=[font=default-bold]Візуальна перевірка[/font]\nПісля подачі на пристрій сигналів з [color=yellow]координатами[/color] чи [color=yellow]ділянкою[/color] можна перевірити, куди ці сигнали вказують. Для цього виділіть один або кілька пристроїв інструментом "Індикатор ділянки скрині B.A.D.".
deployer-intro=Ця версія керується лише ванільними сигналами.
deployer-control=Сигнал [img=virtual-signal.signal-0] означає "використати предмет з інвентарю". Дія залежить від того, який предмет в інвентарі.\n(Раніше використовувався сигнал [img=item.construction-robot], але його замінено віртуальним сигналом, тобто не сигналом-[font=default-bold]предметом[/font]. Для старих креслень див. налаштування мапи, щоб змінити керувальний сигнал)
deployer-plans=Буде використано план знесення/поліпшення для вказаної [color=yellow]ділянки[/color]. Установник ніколи не позначає для знесення сам себе.\nЯкщо сигнал [img=virtual-signal.signal-0]<0, план знесення/поліпшення використовується в режимі "скасування".
deployer-book=Дія залежить від вибраного предмета.\nЯкщо сигнал [img=virtual-signal.signal-0]<0, знак числа ігнорується, а план знесення/поліпшення використовується в режимі "скасування".
deployer-misc=[font=default-bold]Додаткові команди.[/font]\nСигнал [img=item.deconstruction-planner] використовується як окрема команда:\n-1 = План знесення без фільтра для вказаної [color=yellow]ділянки[/color]. Установник ніколи не позначає для знесення сам себе.\n-2 = Позначити установник для знесення.\n-3 = Скасувати знесення у вказаній [color=yellow]ділянці[/color].\nНаступні 4 команди використовують сигнали-предмети для налаштування фільтра плану знесення:\n-4 = Знесення, білий список.\n-5 = Знесення, чорний список.\n-6 = Скасування знесення, білий список.\n-7 = Скасування знесення, чорний список.\nКрім сигналів-предметів, у фільтрі також використовуються: [img=virtual-signal.signal-T] = дерева, [img=virtual-signal.signal-R] = каміння, [img=virtual-signal.signal-C] = скелі.
deployer-copy=[font=default-bold]Копіювання/видалення креслень.[/font]
blueprint-item=Розгортає креслення у вказаних [color=yellow]координатах[/color]. Режим будівництва "примусовий": ставить що може, не зважаючи на перешкоди, додає насип на воду, а дерева/каміння/скелі, що заважають, позначаються для знесення.\nЩоб змінити центр креслення, увімкніть розмір сітки (рекомендовано 1x1) і задайте абсолютну точку прив'язки.\nДодаткові параметри:\nсигнал __1__ повертає креслення. 1 -> 90° за годинниковою, 2 -> 180°, 3 -> 90° проти годинникової.\n__2__>0 — використовувати "надпримусовий" режим будівництва (тобто "примусовий" + дружні будівлі, що заважають, позначаються для знесення).
book-navigation=Сигнал __1__ вказує номер слота в книзі, який використовувати. Якщо у вибраному слоті є книга, вибирається слот, на який вказує сигнал __2__. Якщо там знову книга, для наступного вибору використовується сигнал __3__ і так далі аж до сигналу __4__.
action-copy-bp=__1__ Скопіювати креслення або книгу креслень в інвентар установника.\nОригінальне креслення має бути в скрині (або в маніпуляторі зі зчитуванням вмісту руки) в тій самій логічній мережі, що й скриня установника. Якщо в мережі кілька креслень, копіюється те, до якого найменше переходів по проводах.
action-delete-bp=__1__ Видалити креслення або книгу креслень з інвентарю установника.\n(Сторонні предмети не видаляються, тож не намагайтеся використовувати спеціалізований пристрій як смітник!)
action-debug=[font=default-bold]Налагодження[/font]\nСигнал [img=virtual-signal.signal-L] використовується для показу налагоджувальних повідомлень (потрібно ввімкнути умову спрацювання в налаштуваннях мода). Кожне спрацювання показує в чаті розташування установника, назву креслення й місце його розгортання (якщо задано [color=yellow]координати[/color]).\n[color=yellow][font=default-bold]Увага[/font][/color]: чат може пропускати деякі повідомлення, якщо вони з'являються дуже швидко.
deployer2-intro=Ця версія керується власними сигналами мода.\n\n[font=default-bold]Керувальний сигнал[/font]\nДля керування використовується сигнал __1__. Дія та додаткові параметри залежать від значення сигналу. У дужках вказано сигнали, що впливають на дію.
deployer2-timings=[font=default-bold]Сигнал часу[/font]\nПристрій виконує команди щотіку. Передбачається, що сигнали команд подаються імпульсами. Якщо з якоїсь причини керувальна команда подається безперервним сигналом, слід використати необов'язковий сигнал __1__, що задає інтервал повторення команди. Внутрішній таймер скидається, коли змінюються сигнали __1__ або __2__. Зміни інших сигналів ігноруються.
deployer2-navigation=[font=default-bold]Сигнали навігації книгами креслень[/font]\nСигнал __1__ означає "навігація вкладеними книгами креслень".
deployer2-library=Сигнал __1__ вказує номер слота в бібліотеці креслень мапи. (Наразі використовується командами #1, #2 і #102)
deployer2-wires=[font=default-bold]Використання проводів[/font]\nТипово обидва проводи установника працюють як спільний вхід.\nПозначка [color=yellow]2W[/color] означає розділення вхідних проводів. Будь-яка команда з позначкою [color=yellow]2W[/color] ділить входи на основний і додатковий. Провід, на який надійшов сигнал __1__, стає [color=yellow]основним[/color]. Якщо цей сигнал надійшов з обох проводів, команда ігнорується.\nОсновний провід зчитує команди й параметри, як і для будь-яких інших команд.\nДодатковий провід використовується лише командами з позначкою [color=yellow]2W[/color]. Зазвичай це для зчитування/запису віддалених сигналів.
deployer2-com-header=[font=default-bold]Перелік команд[/font]
deployer2-com1=[font=default-bold][[color=red]1[/color]][/font] — використати предмет з інвентарю. Дія залежить від того, який предмет в інвентарі.
deployer2-com1-plans=Буде використано план знесення/поліпшення для вказаної [color=yellow]ділянки[/color].
deployer2-com1-book=Дія залежить від вибраного предмета.
deployer2-com2=[font=default-bold][[color=red]2[/color]][/font] — те саме, що й [font=default-bold][[color=red]1[/color]][/font], але якщо предмет виявиться кресленням, до нього застосовується параметризація (заміна сигналів-параметрів вказаним сигналом, а також заміна вказаних чисел іншими).
deployer2-com2-signals=[font=default-bold]Заміна параметрів:[/font] числові сигнали (від [img=virtual-signal.signal-0] до [img=virtual-signal.signal-9]) вказують, який сигнал змінити. Значення числового сигналу вказує, який із присутніх сигналів (за збігом значення) підставити замість відповідного параметра. Виняток: значення від 1 до 9 підставляють відповідний числовий сигнал, значення 10 — сигнал [img=virtual-signal.signal-0].\nНаприклад, щоб замінити [img=item.parameter-1] на [img=item.iron-gear-wheel], мають бути сигнали [img=item.iron-gear-wheel]=11 і [img=virtual-signal.signal-1]=11.
deployer2-com2-numbers=[font=default-bold]Заміна чисел:[/font] пара буквених сигналів ([img=virtual-signal.signal-A]-[img=virtual-signal.signal-K], [img=virtual-signal.signal-B]-[img=virtual-signal.signal-L] і так далі до [img=virtual-signal.signal-J]-[img=virtual-signal.signal-T]) вказує, яке число знайти й на яке його замінити.\nНаприклад, щоб замінити "5001" на "10", мають бути сигнали [img=virtual-signal.signal-A]=5001 і [img=virtual-signal.signal-K]=10.
deployer2-com2-info=[font=default-bold]Примітка:[/font] ця параметризація не підтримує параметри-компоненти рецептів, формули й фільтри/пріоритети турелей. Якщо щось зовсім піде не так, у чаті з'явиться повідомлення про помилку. Будь ласка, повідомляйте про такі випадки авторові мода.
deployer2-com10=[font=default-bold][[color=red]10[/color]][/font] — План знесення без фільтра для вказаної [color=yellow]ділянки[/color] (__1__)
deployer2-com11=[font=default-bold][[color=red]11[/color]][/font] — План знесення з фільтром (сигнали-предмети) для вказаної [color=yellow]ділянки[/color] (__1__)\n__2__>0 — лише дерева й каміння. У такому разі сигнали-предмети ігноруються.\n__3__>0 — вказані предмети додаються до фільтра з позначкою "будь-яка якість".
deployer2-com20=[font=default-bold][[color=red]20[/color]][/font] — План поліпшення без фільтра для вказаної [color=yellow]ділянки[/color] (__1__)
deployer2-com30=[font=default-bold][[color=red]30[/color]][/font] — Зчитати сигнали з комбінатора сталих у вказаних [color=yellow]координатах[/color] ([color=yellow]2W[/color] __1__)\n__2__ — вибір секції для зчитування (0 — зчитати все).\n__3__>0 — зчитати сигнали з вказаної секції, навіть якщо її вимкнено.
deployer2-com31=[font=default-bold][[color=red]31[/color]][/font] — Записати сигнали в комбінатор сталих у вказаних [color=yellow]координатах[/color] ([color=yellow]2W[/color] __1__)\n__2__>0 — зберегти вибрану секцію вимкненою.
deployer2-com32=[font=default-bold][[color=red]32[/color]][/font] — Увімкнути/вимкнути комбінатор сталих у вказаних [color=yellow]координатах[/color] (__1__)
deployer2-com33=[font=default-bold][[color=red]33[/color]][/font] — Очистити комбінатор сталих у вказаних [color=yellow]координатах[/color].
deployer2-com34=[font=default-bold][[color=red]34[/color]][/font] — Зчитати сигнали з логічних проводів у вказаних [color=yellow]координатах[/color] ([color=yellow]2W[/color] __1__)\n__1__ — визначає, який провід зчитувати: 1 — червоний, 2 — зелений, 3 — обидва.
deployer2-com40=[font=default-bold][[color=red]40[/color]][/font] — Очистити вихідні сигнали.
deployer2-com41=[font=default-bold][[color=red]41[/color]][/font] — Скинути стан входів/виходів установника.
deployer2-com100=[font=default-bold][[color=red]100[/color]][/font] — Скопіювати креслення або книгу креслень в інвентар скрині B.A.D. (пошук по проводах) (__1__)\n__2__>0 — дозволити замінити поточний (не порожній) вміст інвентарю скрині B.A.D.\n[font=default-bold]Примітка:[/font] оригінальне креслення має бути в скрині (або в маніпуляторі зі зчитуванням вмісту руки) в тій самій логічній мережі, що й скриня B.A.D. Якщо в мережі кілька креслень, копіюється те, до якого найменше переходів по проводах.
deployer2-com101=[font=default-bold][[color=red]101[/color]][/font] — Скопіювати креслення або книгу креслень в інвентар скрині B.A.D. (пошук за координатами) (__1__)\n[font=default-bold]Примітка:[/font] оригінальне креслення має бути в скрині у вказаних [color=yellow]координатах[/color]. Скриня B.A.D. може копіювати сама з себе — так можна витягти вміст книги креслень.
deployer2-com102=[font=default-bold][[color=red]102[/color]][/font] — Скопіювати креслення або книгу креслень в інвентар скрині B.A.D. з бібліотеки креслень (__1__)\n
offset-tool0=Цей інструмент обчислює значення сигналів, які вкажуть на ділянку, вибрану інструментом. Параметри інструмента — в налаштуваннях мода (для гравця).\nЩоб скористатися, візьміть інструмент (на панелі швидких дій) і виконайте такі кроки:
offset-tool1=1. Вибір точки відліку: утримуючи __CONTROL__select-for-cancel-deconstruct__, виберіть [entity=blueprint-deployer2], [entity=recursive-blueprints-scanner] або будь-яку потрібну будівлю.
offset-tool2=2. Вимірювання зміщення: утримуючи __CONTROL__select-for-blueprint__, виберіть потрібну [color=yellow]ділянку[/color]. У чаті з'являться обчислені значення зміщень, які можна використати як є або перейти до наступного кроку.
offset-tool3=3. Запис у комбінатор сталих: утримуючи __CONTROL__reverse-select__ або __CONTROL__deselect__, виберіть [entity=constant-combinator], у який записати результат останнього вимірювання. Запис відбувається лише в першу секцію; наявні значення потрібних сигналів буде перезаписано.
offset-tool4=Примітка: точка відліку й останнє вимірювання зберігаються окремо для кожного гравця, тож між цими кроками інструмент можна "кинути".

[mod-description]
rec-blue-plus=Автоматизуйте креслення, щоб побудувати фабрику, що розширюється сама.\nФорк Recursive Blueprints з новими дрібними функціями.

[controls]
give-rbp-tool=Обчислювач зміщень
give-rbp-area-viewer=Індикатор ділянки скрині B.A.D.

[shortcut-name]
give-rbp-tool=Обчислювач зміщень
give-rbp-area-viewer=Індикатор ділянки скрині B.A.D.

[entity-name]
blueprint-deployer=Установник креслень
blueprint-deployer2=Скриня B.A.D.
recursive-blueprints-scanner=Сканер ділянки

[item-description]
blueprint-deployer=[font=default-bold][color=yellow]Увага:[/color] цей пристрій застарів! Його не прибрано з мода повністю лише для сумісності зі старими кресленнями.[/font]\nАвтоматично будує вкладене креслення.
blueprint-deployer2=(Blueprint Automated Deployment — автоматичне розгортання креслень) Автоматично будує вкладене креслення.
recursive-blueprints-scanner=Підраховує кількість об'єктів у ділянці.
rbp-tool=Обчислює розмір вибраної ділянки й зміщення відносно вибраного об'єкта.\nЛКМ — вибрати ділянку.\nShift+ЛКМ — вибрати об'єкт як точку відліку.\nПКМ — записати останні дані в комбінатор сталих.
rbp-area-viewer=Показує поточну вибрану ділянку скрині B.A.D.

[mod-setting-name]
recursive-blueprints-area=Положення X,Y ділянки
recursive-blueprints-logging=Журнал установника
recursive-blueprints-deployer-deploy-signal=Сигнал розгортання для установника
recursive-blueprints-tool-area=Обчислювач зміщень: положення X,Y ділянки
recursive-blueprints-tool-coordinates=Обчислювач зміщень: точка відліку
recursive-blueprints-limit-library=Заборонити копіювання з бібліотеки креслень
recursive-blueprints-alerts-interval=Мін. інтервал між сповіщеннями

[mod-setting-description]
recursive-blueprints-area=Типово тлумачити отримані координати (сигнали X і Y) як "кут" або "центр" ділянки (для сканера, плану знесення й плану поліпшення).
recursive-blueprints-logging=Умова показу налагоджувальних повідомлень.
recursive-blueprints-deployer-deploy-signal=Якщо вибрано "Обидва", пріоритет має сигнал "0".\nВикористовуйте сигнал "0" (нуль) замість сигналу будівельного робота для узгодженості з вкладеною навігацією, а також щоб не керувати установником сигналами-предметами.
recursive-blueprints-tool-area=Положення якої точки ділянки обчислювати?
recursive-blueprints-tool-coordinates=Які координати використовувати?\nДля відносних координат потрібно вибрати будівлю як точку відліку (Shift+ЛКМ, щоб вибрати).
recursive-blueprints-limit-library=Обмежує роботу команд #2 і #102 з бібліотекою креслень. Цим командам потрібно скопіювати креслення/книгу з бібліотеки в предмет, для чого використовуються функції експорту/імпорту в текст. Великі креслення й книги можуть спричиняти лаги під час використання цих команд. Позначте, щоб знайти винуватця таких лагів.
recursive-blueprints-alerts-interval=Повідомлення про помилки цього мода надсилаються в чат. Щоб уникнути спаму, однотипні повідомлення не з'являтимуться вказану кількість тіків.

