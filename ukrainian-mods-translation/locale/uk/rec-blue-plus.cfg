[virtual-signal-description]
rbp-book-layer1=Вказує номер слота в книзі креслень.
rbp-book-layer2=Вказує номер слота в книзі креслень, що лежить у книзі креслень.
rbp-book-layer3=Вказує номер слота в книзі креслень, що лежить у книзі креслень, що лежить у... (сподіваюся, ви зрозуміли).
rbp-book-layer4=Номер слота в 4-му шарі вкладених книг.
rbp-book-layer5=Номер слота в 5-му шарі вкладених книг.
rbp-book-layer6=Номер слота в 6-му шарі вкладених книг. Якщо ви активно користуєтеся цим сигналом, ви — рекурсивний майстер рекурсивних креслень!
rbp-command=Команда для скрині Blueprint Automated Deployment. Опис команд — у порадах і хитрощах.
rbp-cancel=Скасовує знесення або поліпшення під час використання відповідних планів.
rbp-enviroment=Вмикає фільтр "лише дерева й каміння" для параметричного знесення (команда 11).
rbp-invert-filter=Використовувати чорний список у параметричному знесенні.
rbp-rotate-bp=Повернути креслення під час розгортання. (1->90° за годинниковою, 2->180°, 3->90° проти годинникової)
rbp-superforce=Використовувати надпримусовий режим під час розгортання креслення або знесення.
rbp-quality=Використовувати "будь-яку якість" у фільтрах параметричного знесення (команда 11).
rbp-center=Отримані сигнали "X" і "Y" тлумачитимуться як центр ділянки замість лівого верхнього кута.
rbp-absolute=Отримані сигнали "X" і "Y" тлумачитимуться як абсолютні координати замість зміщення.
rbp-wait=Не повторювати команду миттєво, коли керувальний сигнал подається безперервно. Докладніше — в порадах і хитрощах.
rbp-library=Вказує номер слота в бібліотеці креслень мапи.

