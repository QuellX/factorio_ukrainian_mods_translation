kr-faq=[font=default-bold]Я дивлюся на нафтове родовище, і воно показує X, а в очікуваному видобутку — інше число. Чому?[/font]\n     Родовище показує кількість циклів видобутку. За один цикл видобувається 20 одиниць нафти. Відповідно, очікуваний видобуток — це кількість циклів * 20.\n\n[font=default-bold]Як зібрати криповину?[/font]\n     [technology=military-science-pack] відкриває [item=kr-creep-collector] — швидкий і простий спосіб збирати криповину. Можна збирати її й вручну, але це довго!\n\n[font=default-bold]Де взяти [item=space-research-data]?[/font]\n     Замість запуску ракети з [item=satellite] ці дані доведеться виробляти в космосі.\n\n[font=default-bold]Я не люблю радіацію. Можна вимкнути радіаційну шкоду?[/font]\n     Див. сторінку [font=default-bold]Команди[/font].

