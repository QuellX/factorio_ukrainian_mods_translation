page_delivery_cannons_text_1=Доставочні гармати — це рейкотрони з вибуховим прискоренням і міжпланетною дальністю. Вони призначені для відправлення міцних однорідних ресурсів, що витримують раптове прискорення. Вони не можуть відправляти складніші виготовлені компоненти чи споруди.\n\nДоставочна гармата має лише точку прицілювання, вона не знає, що в цій точці, і стрілятиме вантажем, доки має енергію та заповнену капсулу доставки. Якщо хочете додати умови пострілу, обмежте можливість гармати завантажувати ресурси чи капсули.\n\nКоли капсула доставки падає на землю, вона пошкоджує місцевість, а більшість ресурсів знищується. Скриня доставочної гармати безпечно ловить капсулу, доки скриня не заповнена. Кілька гармат можуть стріляти різними ресурсами в одну скриню.\n\nРадимо або тримати цільові скрині порожніми, або обмежувати завантаження гармат за допомогою передачі сигналів.\n\nДоставочні гармати мають місткість 1 ГДж і споживають 50 МВт під час заряджання. Дальність доставочної гармати обмежена енергією, яку вона може накопичити. Постріл на більшу відстань потребує більше енергії. Деякі пункти призначення можуть потребувати більше енергії, ніж вміщує гармата, тож вона ніколи не вистрілить. Можна побудувати ретрансляційну станцію доставочних гармат на півдорозі, щоб відправити вантаж у 2 етапи.\n\n[img=item/se-delivery-cannon-weapon] [font=heading-2][color=#ffe6c0]Доставка зброї[/color][/font]\nБойові доставочні гармати працюють подібно до звичайних, але стріляють зброєю замість ресурсів. Окрім стандартного режиму стрільби, бойові доставочні гармати мають режими __1__ та __2__.\n\nРежим __1__: бойова доставочна гармата автоматично вибирає нову ціль після кожного пострілу. Автоматично вимикається, коли в цільовій зоні не лишається ворогів. Під час вибору нових цілей черв'яки й лігва мають пріоритет над рухомими ворогами. Автоматична стрільба не така точна, як ручний вибір цілі: у [color=cyan]1%[/color] випадків гармата схибить і влучить у випадкове місце цільової зони.\n\nРежим __2__: бойова доставочна гармата чекає, доки гравець не вибере ціль [img=item/se-delivery-cannon-artillery-targeter-se-iridium-piledriver] пультом наведення. Коли ціль вибрано, одна бойова доставочна гармата з відповідним типом боєприпасів і достатньою для пострілу енергією вистрілить у вибране місце й повернеться в режим очікування. Якщо пультом вибрано кілька цілей, вони стають у чергу: щойно гармати в режимі __2__ звільняються, вони стріляють по цілях із черги. Якщо по цілі, вибраній [img=item/se-delivery-cannon-artillery-targeter-se-iridium-piledriver] пультом наведення, не вистрілили протягом кількох хвилин, вона скасовується — тоді побудуйте більше бойових доставочних гармат або використовуйте режим __1__.
