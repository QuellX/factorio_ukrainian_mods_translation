[string-mod-setting-description]
se-print-meteor-info-always=Завжди показувати сповіщення про метеори.
se-print-meteor-info-current-zone-only=Показувати сповіщення лише про метеори, що падають у зоні, яку ви переглядаєте. Якщо зона — планета чи місяць, показуються сповіщення і для основної поверхні, і для орбіти.
se-print-meteor-info-breakthrough-only=Показувати сповіщення лише про метеори, що були в зоні досяжності оборони, але не були повністю збиті. Це може статися через промахи або брак боєприпасів чи енергії в оборони.
