page_spaceships_text_2=Ваша поточна межа навантаження на цілісність: [color=cyan]__1__[/color].\nЗараз у вас космічних кораблів: [color=cyan]__2__[/color].\nМаксимальна досягнута швидкість космічного корабля: [color=cyan]__3__[/color] (лише серед наявних кораблів).
page_spaceships_construction_text_1=[font=heading-2][color=#ffe6c0]Огляд[/color][/font]\nКосмічні кораблі складаються з багатьох плиток і дрібніших компонентів, що разом утворюють корабель вашої власної конструкції. Проєктування корабля схоже на будівництво маленької рухомої бази.\n\nПочніть із плану підлоги з настилу космічного корабля. Не будуйте завеликий корабель: перші кораблі матимуть суворі обмеження розміру, які розширюються дослідженнями. Розмістіть стіни космічного корабля по краях, щоб утворити перебірки, і переконайтеся, що немає проміжків (зокрема по діагоналі). Розмістіть консоль космічного корабля десь усередині: це серце корабля, через яке ви ним керуєте. Після розміщення консолі кілька разів спалахує імпульс — консоль визначає, які частини правильно приєднані, які правильно герметизовані, а що відпаде під час запуску. Якщо якісь клітинки блимають червоним, конструкція має проблему, яку можна діагностувати в консолі. Також потрібні резервуар ракетного прискорювача й ракетний двигун. Резервуар прискорювача зберігає паливо для виходу в космос і забезпечує вертикальний зліт і посадку. Ракетні двигуни — для повільнішого польоту в космосі до пункту призначення. Також радимо якусь оборону спереду (завжди на півночі), бо туманність, у якій ви перебуваєте, повна уламків.\n\n[font=heading-2][color=#ffe6c0]Навантаження на цілісність[/color][/font]\nСпочатку розмір корабля сильно обмежений навантаженням на цілісність, яке дозволяє ваш рівень технологій. Нові технології дозволяють будувати більші кораблі. Навантаження на цілісність рахується з 2 частин:\n\nЧастина А. Навантаження на корпус, що залежить переважно від розміру й форми корабля.\nЧастина Б. Навантаження контейнерів, що залежить від місткості корабля для предметів і рідин.\n\nЗагальне навантаження на цілісність — більше з двох значень, вони не додаються. Якщо навантаження конструкції 250, а контейнерів 280, навантаження на цілісність буде 280.\n\nШкала навантаження на корпус показує 3 значення. Перше — поточне навантаження зі знижкою за порожні плитки корабля. До 10% розміру корабля не враховуються в навантаженні, якщо це порожні плитки. Цей вільний простір віднімається в розрахунку й корисний для коридорів. Друге значення — навантаження без знижки, воно допомагає оцінити навантаження, якщо заповнити всю внутрішню частину спорудами. Третє — максимальне навантаження, яке дозволяє ваш рівень технологій.\n\nДуже довгі тонкі кораблі або кораблі з дуже тонкими секціями посередині менш міцні, ніж округліші конструкції. Широкі кораблі міцні, але мусять розчищати більше астероїдів.\n\nДеякі споруди мають особливий вплив на цілісність чи швидкість корабля, як-от нексус.\n\n[font=heading-2][color=#ffe6c0]Обтічність[/color][/font]\nЦя ділянка космосу — запилена туманність. Якщо зробити корабель обтічним, максимальна швидкість зросте приблизно на 30%. Уникайте пласкої коробчастої передньої частини, але будувати клин не обов'язково. До 1/3 передньої частини корабля може бути пласкою без штрафу. Круглі форми також підходять. Щоб перевірити обтічність, можна вручну запустити перевірку цілісності.\n\n[font=heading-2][color=#ffe6c0]Швидкість[/color][/font]\nШвидкість корабля залежить від тяги двигунів відносно ваги корабля (приблизно — навантаження на цілісність). Двигуни можна розміщувати в кораблі чи на ньому, але двигуни в кормовій частині з порожнім простором позаду ефективніші. Повністю закриті двигуни мають 60% ефективності. Двигуни на краю корабля також мають невелику перевагу.\n\nМожна задати цільову швидкість. Якщо корабель її перевищує, він почне вимикати двигуни, щоб точніше дотримуватися цільової швидкості й заощаджувати паливо. Є 3 варіанти обмеження швидкості, тож можна додатково знизити швидкість у районах із великою кількістю астероїдів, які інакше подолали б вашу оборону.\n\n[font=heading-2][color=#ffe6c0]Далекі перельоти[/color][/font]\nПлануючи далекі подорожі, пам'ятайте, що в супутниковому режимі можна багато чого зробити, поки ваше тіло в дорозі. Також можна віддавати накази кораблям дистанційно через супутниковий зв'язок.\n\n[font=heading-2][color=#ffe6c0]Виробничі машини[/color][/font]\n[color=#ffaaaa]Увага: виробнича машина для космосу зможе використовувати рецепти, спільні з наземними спорудами, лише коли корабель на землі. Якщо під час посадки встановлено космічний рецепт, складники буде втрачено. Деякі наземні виробничі машини можуть працювати в космосі, але втрачають можливість використовувати модулі продуктивності. Якщо корабель злітає з модулями продуктивності в таких машинах, модулі знищуються.[/color]\n\n[font=heading-2][color=#ffe6c0]Сигнали космічного корабля[/color][/font]\nДо верхньої правої частини консолі можна під'єднати дроти окремо від основної конструкції, бо вона видає власні сигнали:\n[img=item/se-spaceship-console] Число консолі — ID космічного корабля.\n[img=virtual-signal/signal-speed] Сигнал швидкості — швидкість корабля: -1, якщо зупинений, -2, якщо на якорі.\n[img=virtual-signal/signal-distance] Сигнал відстані — відстань до вибраного пункту призначення: -1, якщо прибув, -2, якщо на якорі, -3, якщо пункт призначення не задано.\n[img=virtual-signal/se-planet-orbit] Четвертий сигнал — поточний пункт призначення, якщо він є.\n[img=virtual-signal/signal-D] У різних ділянках космосу кораблю трапляється більше чи менше астероїдів. Щільність астероїдів у поточному місці корабля показує сигнал D.\n[img=virtual-signal/signal-A] Якщо корабель на якорі, сигнал A показує ID зони стоянки.\n\n[font=heading-2][color=#ffe6c0]Передача логічних сигналів[/color][/font]\nЗатискачі космічного корабля мають точку під'єднання живлення й логічної мережі у верхньому куті. Коли затискачі з'єднуються під час автоматичної посадки, мережі живлення й логічні сигнали об'єднуються, дозволяючи передавати енергію та сигнали між кораблем і місцем посадки.
page_spaceships_automation_text_1=Є два способи автоматизувати космічний корабель. Ним можна керувати, як потягом, за допомогою розкладу. Або вручну — через логічну мережу.
page_spaceships_automation_scheduler_text_1=[font=heading-2][color=#ffe6c0]Політ за розкладом[/color][/font]\nРозклад космічного корабля дозволяє автоматизувати кораблі майже так само, як потяги. Розклад може містити кілька затискачів, до яких корабель має летіти, і умови, за яких йому дозволено злітати до наступного затискача в розкладі. Затискачам можна задавати окремі пріоритети й ліміти кораблів. Переривання дозволяють динамічно спрямовувати корабель. Розклад корабля зберігається в його групі розкладу, і кілька кораблів можуть мати спільну групу розкладу.\n\n[font=heading-3][color=#ffe6c0]Затискачі[/color][/font]\nЗатискач можна вважати аналогом зупинки потяга. Затискач має дві ідентифікаційні властивості: напрямок (ліворуч чи праворуч) і назву (як у зупинок потягів). Розклад ігнорує ID затискача. Щоб затискач у розкладі вважався допустимим пунктом призначення, він має мати правильні напрямок і назву.\n\nЯкщо кораблю підходять кілька затискачів, він вибере затискач із найвищим пріоритетом. Якщо найвищий пріоритет мають кілька затискачів, корабель вибере маршрут із найменшим dV.\nТакож можна задати ліміт кораблів для затискача. Як і з потягами та лімітами потягів, кораблі резервують затискач на початку подорожі. Якщо до затискача вже прямує (або стоїть біля нього) достатньо кораблів для досягнення ліміту, інші кораблі не зможуть його вибрати й полетять до наступного допустимого пункту або чекатимуть.\nЛіміт можна також задати логічною мережею сигналом [img=virtual-signal/signal-L], а пріоритет — сигналом [img=virtual-signal/signal-P].\n\n[font=heading-3][color=#ffe6c0]Переривання[/color][/font]\nПереривання може створити в розкладі тимчасовий пункт призначення (або кілька), якщо виконано певні умови. Усі переривання перевіряються по черзі один раз, коли виконано всі умови очікування поточного пункту. Перервати переривання (наразі) неможливо.\n\n[font=heading-3][color=#ffe6c0]Зміна маршруту[/color][/font]\nКорабель ніколи не змінює маршрут посеред польоту через ризик залишитися без палива, за кількома винятками: якщо затискач призначення знищено, корабель змінить маршрут, можливо, до іншої зони. Прибувши в зону призначення й намагаючись сісти, корабель періодично переносить резервування на інші затискачі з тією самою ідентифікацією та рівним або вищим пріоритетом, щоб сісти швидше.\n\n[font=heading-3][color=#ffe6c0]Гравітаційний маневр[/color][/font]\nПункт призначення можна позначити як гравітаційний маневр: корабель летітиме, доки не наблизиться до цієї зони, а потім продовжить рух до наступного пункту розкладу. Корабель не сідатиме, тож затискачі в цій зоні не потрібні.
page_spaceships_automation_circuits_text_1=[font=heading-2][color=#ffe6c0]Політ за логічною мережею[/color][/font]\nОсновна конструкція консолі приймає вхідні сигнали з лівого боку:\n[img=virtual-signal/signal-speed] Сигнал швидкості задає цільову швидкість і вмикає двигуни. Від'ємний сигнал натомість зупиняє двигуни.\n[img=virtual-signal/se-spaceship-launch] Додатний сигнал запуску космічного корабля запускає його.\n[img=virtual-signal/se-planet-orbit] Сигнал пункту призначення задає пункт призначення (сигнал зони видно на бічній панелі Атласу Всесвіту, щойно ви збудуєте космічний корабель).\n\nПримітка: щоб пункт призначення було задано, мають збігатися і тип сигналу (напр. [img=virtual-signal/se-planet-orbit] чи [img=virtual-signal/se-asteroid-belt]), і його значення/ID.\n\nПримітка: консоль не прийматиме сигнали [img=virtual-signal/se-spaceship-launch] запуску чи [img=virtual-signal/signal-speed] швидкості, доки гравець хоча б раз не запустить корабель і не ввімкне двигуни вручну. Це запобігає випадковому запуску кораблів із креслень, поки роботи ще їх будують.\n\nПримітка: консоль перевіряє зміни вхідного сигналу лише раз на секунду; щоб корабель зреагував, потрібен сталий сигнал, імпульси тривалістю в один тік не спрацюють.\n\n[font=heading-2][color=#ffe6c0]Автоматична посадка[/color][/font]\nЩоб корабель сів, консоль має отримати пару сигналів якоря, а саме:\n«якір лівим затискачем» ([img=virtual-signal/se-anchor-using-left-clamp]) з «якір до правого затискача» ([img=virtual-signal/se-anchor-to-right-clamp])\n«якір правим затискачем» ([img=virtual-signal/se-anchor-using-right-clamp]) з «якір до лівого затискача» ([img=virtual-signal/se-anchor-to-left-clamp])\n\nЗначення сигналу «якір … затискачем» має збігатися зі значенням затискача на кораблі.\nЗначення сигналу «якір до …» має збігатися зі значенням затискача в пункті призначення.\nЦі значення можна переглянути й змінити в меню затискача. Якщо для обох сигналів консолі знайдено відповідність, корабель спробує сісти, з'єднавши ці два затискачі. Будьте обережні.\n\nКорабель завжди віддає перевагу затискачу з найвищим пріоритетом, який можна задати логічною мережею сигналом [img=virtual-signal/signal-P]. Ліміти кораблів ігноруються.\n\n[font=heading-2][color=#ffe6c0]Затискачі[/color][/font]\nЩоб задати ID затискача, відкрийте його меню й змініть числове значення сигналу затискача на потрібний ID. Тип сигналу затискача змінювати не потрібно.\n\nЗатискач на якорі можна вимкнути, подавши на нього червоний сигнал.\n\n[font=heading-2][color=#ffe6c0]Приклад посадки[/color][/font]\nКорабель має лівий затискач з ID 315. У меню цього затискача сигнал [img=virtual-signal/se-anchor-using-left-clamp] зі значенням 315.\nМісце посадки має правий затискач з ID 147. У меню цього затискача сигнал [img=virtual-signal/se-anchor-using-right-clamp] зі значенням 147.\nЩоб корабель сів, використовуючи ці два затискачі, на лівий бік консолі треба подати такі сигнали:\n[img=virtual-signal/se-anchor-using-left-clamp] 315\n[img=virtual-signal/se-anchor-to-right-clamp] 147
