[technology-description]
cargo-landing-pad=Дозволяє доставляти продукцію запуску ракет і вантажні капсули ракет на названий посадковий майданчик. Подальші дослідження дозволяють також повертати ракетні частини.
se-fusion-reactor-equipment=Живить модулі спорядження.
se-antimatter-reactor-equipment=Живить модулі спорядження.
antimatter-reactor-equipment=Живить модулі спорядження.
se-space-simulation-dual=Ефективніше моделювання завдяки поєднанню двох дисциплін.
se-space-simulation-triple=Ще ефективніше моделювання завдяки поєднанню трьох дисциплін.
se-space-simulation-quad=Найефективніше моделювання, що поєднує всі дисципліни. Його неможливо виконати на стандартних суперкомп'ютерах.
se-kr-rare-metal-substrate=Краще розуміння потреб наших носіїв даних привело до ідеї покращеної базової підкладки, яка хоч і потребує рідкісніших металів, але виробляється ефективніше.
se-kr-efficient-fabrication=Оскільки у виробничих ланцюжках потрібно дедалі більше електронних компонентів, додавання літію в їхнє виробництво зменшує втрати основних матеріалів.
se-kr-fuel-refining=Подальше розширення потребуватиме кращого перероблення палива.
se-kr-nutrient-enrichment=Збагачення поживними речовинами робить виробничі ланцюжки ефективнішими.
se-kr-transceiver-trigger=Активація трансивера дозволила вам зв'язатися з ширшою галактикою й визначити своє місце в ній. Тепер, маючи власний космічний корабель, ви можете врятувати себе.
se-kr-catalysed-condensation=Кріоніт використовується для швидкого охолодження доступної атмосфери до щільнішої рідкої форми. Проте через швидкість охолодження в рідині залишаються небажані домішки з атмосфери, тож перед розділенням її потрібно додатково очистити.
se-kr-catalysed-electrolysis=Виявилося, що іридій та його оксид знижують енергію, потрібну для електролізу води, дозволяючи швидше й з меншими витратами енергії розкладати воду на складові елементи.
epic-quality=Можливо, це вдасться знайти десь у вашій сонячній системі.
se-always-researched=Ця прихована технологія має ефекти, які ми не показуємо.

