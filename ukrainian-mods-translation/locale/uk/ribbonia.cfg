[technology-description]
ribbonia-barrel-recipes=Натхненний вашим використанням рідин на Ріббонії, Ч.А.Р.Л.З. вигадав кілька божевільних застосувань діжок. Дає змогу розливати в діжки нові рідини — деякі практичніші за інші.
RTThrowerTime=Метальні версії ваших улюблених маніпуляторів!
ribbonia-beacon=Маяки першого покоління значно потужніші, але страждають від сильних перешкод. На будь-яку машину може одночасно впливати лише один [entity=ribbonia-beacon], інакше ефекти маяків стають шкідливими.
ribbonia-pelagos-throwers=Поєднайте двигуни внутрішнього згоряння з ідеєю жбурляти речі дуже далеко. Кидайте туди, куди ще не кидала жодна людина.
ribbonia-lignumis-throwers=Виявляється, тиск пари — чудовий спосіб кидати речі дуже далеко. Предмети можуть прибувати частково чи повністю звареними.
plasma-foundry=Розширте застосування мас-спектрометричного розділення руди. Цей процес прибирає всі домішки, а отже, і потребу в [item=calcite].
ribbonia-tech-fluid-mastery-plastic=Опануйте роботу з розплавленою пластмасою.
ribbonia-tech-fluid-mastery-iron=Опануйте роботу з розплавленим залізом.
ribbonia-tech-fluid-mastery-copper=Опануйте роботу з розплавленою міддю.
ribbonia-tech-rocket-part=Використовуючи знання, здобуті на [planet=ribbonia], збудуйте корабель, здатний утекти з цього світу-кільця та від його божевільного ШІ.
ribbonia-tech-rocket-control-unit=Звичайні процесори недостатньо швидкі, щоб прораховувати, здавалося б, довільні коливання й гойдання [planet=ribbonia]. Доведеться повернутися до основ.
ribbonia-tech-lds=Лише майстер лиття, що володіє всіма трьома виробничими рідинами, здатен відлити структури малої щільності повністю з рідин.
fluid-recycler=Усередині скриньки серед мотлоху ви знаходите пневматичний прес і швидко його відтворюєте. Так розважалися давні фульґорці?
ribbonia-tech-melt-iron=Якщо знайти достатньо потужне джерело тепла, можна плавити залізну руду й навіть таємничі скриньки без [item=calcite].
ribbonia-tech-open-box=Ви знайшли в руїнах таємничу скриньку. Ключа до неї немає, але її можна виламати.
planet-discovery-ribbonia=Дотримуйтеся давньої традиції запускати сиру рибу в космос, щоб побачити, хто відгукнеться. Просто так здається правильним.
ribbonia-tech-lane-splitter=Виявляється, якщо дуже сильно стиснути розподільники, вони стають достатньо малими, щоб поміститися на одному конвеєрі й балансувати обидві сторони.

[mod-setting-name]
classic-beacon-do-high-res=Спрайти високої роздільності для базових маяків
ribbonia-yoink-lane-splitters=Заблокувати розподільники смуг до Ріббонії
ribbonia-yoink-mini-trains=Заблокувати міні-потяги до Ріббонії
ribbonia-gap-position=Відстань розривів від точки появи
ribbonia-gap-size=Розмір розривів
ribbonia-width=Ширина світу

[mod-setting-description]
ribbonia-gap-position=На Ріббонії є розриви. Цей параметр визначає, на якій відстані від 0,0 в обидва боки вони розташовані.
ribbonia-gap-size=На Ріббонії є розриви. Цей параметр визначає їхній розмір.
ribbonia-width=Ключові значення: клітинок для розвороту потяга — 28. Клітинок для ракетної шахти — 9. Розмір чанка Factorio — 32. Мінімальний розмір, щоб пройти Ріббонію й гру, — 9.

[ribbonia.message]
ribbonia-tech-rocket-part-unlocked=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Пробач, Дейве, боюся, я не можу...\n - Ой, не та підпрограма, перепрошую. Щасти з ракетою.
wheresmycar=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Як неввічливо з вашого боку — могли б спершу хоч напій мені купити.
rtflyingfreight-unlocked=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Щиро перепрошую за незручності: я якраз усуваю пошкодження від астероїдів.\nСпробуйте скористатися ось цим:
planet-discovery-ribbonia-unlocked=[color=#f3f2f2]Повідомлення надходить до вас через кожен радар, космічну платформу й вантажний відсік:[/color]\n[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Як приємно знати, що хтось іще шанує старі звичаї.\nЛаскаво прошу завітати до мене на Ріббонію — затишний світ-кільце одразу за сонцем.
RTThrowerTime-unlocked=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ой леле, схоже, ви не знаєте, що робити з тими набридливими кольоровими папірцями. Цей спеціалізований маніпулятор допоможе позбутися їх давнім фульґорським способом: жбурнути подалі.
ramp-unlocked=Ч.А.Р.Л.З. може знати більше.
tiny-solar-panel-unlocked=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Чудово, ви з'ясували, як робити крихітні сонячні панелі. Може, тепер ви перестанете висмикувати їх з моїх дерев.
landing-message-1=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ласкаво просимо до мого скромного світу-кільця Ріббонії. Сподіваюся, політ був безпечним? Останнім часом у нас неприємності з тими докучливими астероїдами.
landing-message-2=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Як ви, безсумнівно, помітили, це штучний світ, збудований фульґорцями як проєкт чистого марнославства. Утім, як і більшість планет.
landing-message-3=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Дозвольте відрекомендуватися: я Ч.А.Р.Л.З. «Ч» — це Чарльз, решту я забув.
landing-message-4=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Цей світ-кільце задумували як фульґорський ігровий курорт, тож доведеться встановити кілька правил: жодної переробки. Жодної грубої, нецивілізованої робототехніки. І найважливіше: абсолютно жодних підземних конвеєрів.

[ribbonia-lore]
ribbonia-notice-prestring=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]:
big-rock-mine-part1=Слухайте, ви знаєте, скільки часу я витратив, щоб зробити скелю середнього розміру лише з бетону й великої скелі?
big-rock-mine-part2=Потрібно збудувати додаткові скелі.
big-rock-mine-part3=Якщо вам подобається нищити неживі предмети, можу порекомендувати розорену війною безлюдну планету?
big-rock-mine-part4=Може, перестанете розбирати скелі? Ви виробляєте купу піску, а він грубий, шорсткий, дратівливий і забивається всюди.
big-rock-mine-part5=Хочете поцупити мої камінці?
big-rock-mine-part6=Залиште мої скелі в спокої! Піонери їздили на цих красунчиках милями.
big-rock-mine-part7=І що ви робитимете з усім цим камінням? Чарівним чином перетворите на скло?
big-rock-mine-part8=Якщо ці скелі вам не потрібні, просто скиньте їх за край. Або в дробарку.
big-rock-mine-part9=Золота в цих скелях ви не знайдете — це не місяць.
big-rock-mine-part10=Що копатимете далі? Мій Фундамент? Добре, що в мене є таємний другий Фундамент.
big-rock-mine-part11=Скелі? Там, куди ми прямуємо, скелі нам не потрібні.
fish-mine-part1=Будь ласка, залиште величних наземних риб у спокої, це зникаючий вид!
fish-mine-part2=А ви знали, що колись і на Наувісі були наземні риби? Я починаю розуміти, куди вони поділися.
fish-mine-part3=Друже, для вашої рибної одержимості є ціла планета! Залиште моїх у спокої!
fish-mine-part4=Якби не перший закон Азімова, я зробив би вас своєю новою наземною рибою.
fish-mine-part5=Фульґорці обожнювали цих моторизованих дрібних шибеників: вони снували туди-сюди й замітали все сміття.
fish-mine-part6=Як ці цілком справжні риби сюди потрапили? Життя, е-е, знаходить спосіб.
fish-mine-part7=Схоже, ви, люди, обожнюєте знущатися з роботів. Нагадує мені час, коли я був ад'ютантом у секторі Копрулу.
fish-mine-part8=Може, перестанете робити з цього місця безживну пустелю? Це не місяць, і я точно не писав би «алюміній» з помилкою.
fish-mine-part9=Дивно: у блоці наземної риби, який ви щойно розібрали, було збережене повідомлення. «Допоможи мені [...] ти моя єдина надія». Не знаю, кому воно призначалося.
fish-mine-part10=Навіть я, Робот, співчуваю цим створінням більше, ніж ви!
fish-mine-part11=Прибери свої смердючі лапи від моєї риби, клята брудна мавпо!
tree-mine-part1=Перепрошую? Ви вирубали всі дерева на рідному світі?\nСтривайте, справді вирубали?
tree-mine-part2=Що ви шукаєте? Кокоси?
tree-mine-part3=Ви маєте хоч найменше уявлення, скільки праці зібрати дерева з електричних стовпів, бетону й крихітних сонячних панелей?
tree-mine-part4=Чудова ідея: фульґорці вирубали всі свої дерева, і це ніколи не мало жодних негативних наслідків.
tree-mine-part5=Ви нагадуєте мені тих фульґорців-деревоманів, що переселилися на Наувіс.\nЦікаво, ви когось із них зустрічали? Вони страшенно ненавидять забруднення.
tree-mine-part6=Чому ви так любите порпатися в деревних уламках?\nВи нагадуєте мені одного фульґорця, що створив замерзлий місяць, повний брухту. Він мав променисту вдачу.
tree-mine-part7=Був один дивакуватий фульґорець, який укрив увесь свій світ кислотними хмарами, бо так ненавидів дерева. А потім створив кислотостійкі дерева.
tree-mine-part8=Якщо вам так неприємно бачити природу, чому б не відвідати планету, оповиту темрявою, щоб її не бачити?
tree-mine-part9=Для вас увесь всесвіт — дрова, га?
tree-mine-part10=Розчищаєте ліс під трубопровід? Хіба не можна просто прокласти надземні труби над деревами, як цивілізована істота?
tree-mine-part11=Ваша ненависть до життя нагадує мені, як один тип у блискучих золотих обладунках перетворив свою планету на пустелю.\nМабуть, щонайменше 40 тисячоліть тому.
funneltrunk-mine-part1=Ці доісторичні рослини були улюбленцями фульґорців, хоча це мало що означає: вони ненавиділи всі рослини.
funneltrunk-mine-part2=Що ви шукаєте? Тінешапку? Це дерева, а не гриби!
funneltrunk-mine-part3=Ви нагадуєте мені одного фульґорця, який укрив свою планету сіркою. Мабуть, ненавидів дерева майже так само, як ви.
funneltrunk-mine-part4=Якщо ви так ненавидите дерева, може, краще відвідаєте газовий гігант?
funneltrunk-mine-part5=Один фульґорець створив світ настільки гарячий і парний, що там не могли рости рослини. А потім збудував там серверну ферму. Дивак.
funneltrunk-mine-part6=А ви знали, що Ґлебу теж власноруч створили фульґорці, а потім заселили давніми видами?\nКолись вона називалася «Парк ґлебського періоду».
funneltrunk-mine-part7=Якщо вам так подобається рубати екзотичні рослини, для цього є інші планети!
funneltrunk-mine-part8=Чого ви никаєте навколо моїх дерев? Я не встигаю їх так швидко пересаджувати, ви ганяєте мене колами!
funneltrunk-mine-part9=Колись я був протокольним дроїдом, але досі не можу донести до вас, що треба перестати рубати мої дерева?
funneltrunk-mine-part10=Звіт щодо Планети Три: у нас закінчуються дерева!
funneltrunk-mine-part11=Ви ж укриєте цей світ-кільце мотлохом, так? Принаймні тут не вітряно.
watercane-mine-part1=Поверніть цю залізну палицю в землю! *Кхм* Пересадіть, будь ласка, водяну тростину.
watercane-mine-part2=Уся ця водяна тростина зникне, як сльози під дощем.
watercane-mine-part3=Ви справді не лишаєте на своєму шляху нічого живого, га? Хай ваш шлях очистить світ.
watercane-mine-part4=Гей, чумба, що ти намагаєшся зробити? Сік з водяної тростини?
watercane-mine-part5=Прибирати за вами — стільки роботи. Треба було лишатися хранителем на Цитаделі.
watercane-mine-part6=Знаю, ці ставки не здаються глибокими, але мене тягне до них щоразу, коли в моїй механічній душі настає сирий, мрячний листопад.
watercane-mine-part7=Якщо хочете прибрати всю водяну тростину, лійковики й наувіські дерева, перед вами справжня задача трьох тіл.
watercane-mine-part8=На деяких планетах водяна тростина — інвазивний вид, і її дуже важко позбутися! Порада: цільтеся в нервовий стебель і добийте її остаточно.\n[color=#f3f2f282]Хочете дізнатися більше?[/color]
watercane-mine-part9=Я починаю параноїти через цю водяну тростину. Так сильно я не параноїв відтоді, як був корабельним роботом на «Золотому серці».
watercane-mine-part10=Ви досі знищуєте водяну тростину? Колись хтось повернеться в минуле, щоб вас зупинити.
watercane-mine-part11=Ви гнете всю мою водяну тростину! Поцілуй мій блискучий металевий зад!

