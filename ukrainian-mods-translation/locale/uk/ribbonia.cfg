[tips-and-tricks-item-description]
ribbonia=[space-location=ribbonia] — штучний світ-кільце під керуванням [entity=ribbonia-charles], божевільного фульґорського ШІ. Щоб вижити тут, вам доведеться опанувати роботу з розплавленою пластмасою, термоядерною плазмою й літаючими потягами в обмеженому просторі.
