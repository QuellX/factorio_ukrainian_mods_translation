[entity-description]
ribbonia-beacon=Значно потужніший за новіші покоління [entity=beacon], але страждає від сильних перешкод. Будь-яка машина під впливом більш ніж одного [entity=ribbonia-beacon] зазнаватиме шкідливих ефектів.
huge-satellite-asteroid=Космічне сміття давно зниклої цивілізації. Хоча такі уламки бувають доволі великими, вони дуже крихкі й руйнуються звичайною стрільбою чи електрикою.
big-satellite-asteroid=Космічне сміття давно зниклої цивілізації. Хоча такі уламки бувають доволі великими, вони дуже крихкі й руйнуються звичайною стрільбою чи електрикою.
medium-satellite-asteroid=Космічне сміття давно зниклої цивілізації. Хоча такі уламки бувають доволі великими, вони дуже крихкі й руйнуються звичайною стрільбою чи електрикою.
small-satellite-asteroid=Космічне сміття давно зниклої цивілізації. Хоча такі уламки бувають доволі великими, вони дуже крихкі й руйнуються звичайною стрільбою чи електрикою.
exposed-machinery=Купа таємничих скриньок, що сплавилися докупи за тисячоліття. Видобувається лише за допомогою [fluid=fusion-plasma].
mystery-box=Купа таємничих скриньок, що сплавилися докупи за тисячоліття. Видобувається лише за допомогою [fluid=fusion-plasma].
fulgoran-fusion-generator=Ця зліплена абияк машина скидає більше енергії, ніж перетворює, але поки зійде.
ribbonia-charles=Фульґорці доручили Ч.А.Р.Л.З. збудувати й обслуговувати [planet=ribbonia]. Це найдавніша істота з усіх, кого ви зустрічали.
ribbonia-land-fish=Хоча це явно робот-пилосос, що підтримує чистоту на [planet=ribbonia], Ч.А.Р.Л.З. наполягає, щоб ви називали їх «наземними рибами».

