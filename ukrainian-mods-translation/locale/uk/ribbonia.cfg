[recipe-description]
bulk-barrel-casting=Діжки, вироблені масово. Чудово, якщо треба позбутися непотрібних рідин. Або відкрити пивоварню.
ribbonia-rocket-part=Елегантна деталь ракети для цивілізованіших часів.
ribbonia-alien-science-pack=Нагорода від Ч.А.Р.Л.З. за допомогу в поширенні його впливу запуском супутників.

[technology-name]
ribbonia-barrel-recipes=Божевільна робота з рідинами
