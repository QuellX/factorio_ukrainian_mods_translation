[tile-description]
fulgoran-space-platform=Відкритий фундамент [planet=ribbonia]. Технологія настільки розвинена, що від магії її не відрізнити.
ribbonia-gap=Фундамент світу-кільця, сильно пошкоджений метеоритним дощем. Ч.А.Р.Л.З. ще нескоро зможе це полагодити.
ribbonia-water=Спершу це можна сплутати з водою, але придивившись, бачите, що хтось... просто пофарбував землю в синій? Ч.А.Р.Л.З. дозволить тут будувати, якщо присипати це землею. Слизько.
ribbonia-void=Це явно просто порожній простір, але Ч.А.Р.Л.З. іноді називає його «зоряним морем», «безмежжям» або «астральним планом».

[item-description]
molten-plastic-barrel=Розплавлена пластмаса в діжці. Згодом перетвориться на грудку пластмаси.
lava-barrel=Лава в діжці. Згодом перетвориться на камінь.
thruster-oxidizer-barrel=Окисник прискорювача в діжці вищої якості, достатньо міцній, щоб його втримати.
thruster-fuel-barrel=Паливо прискорювача в діжці високої якості, достатньо міцній, щоб його втримати.
steam-barrel=Пара в діжці. Згодом вийде з діжки.
molten-iron-barrel=Розплавлене залізо в діжці. Згодом перетвориться на грудку заліза.
molten-copper-barrel=Розплавлена мідь у діжці. Згодом перетвориться на грудку міді.
ribbonia-beacon=Значно потужніший за новіші покоління [entity=beacon], але на будь-яку машину може впливати лише один базовий маяк, інакше будуть негативні наслідки.
ribbonia-satellite=Це старий код, але він проходить перевірку.
ribbonia-rocket-control-unit=Спеціальний механізм, потрібний лише для найвищих досягнень ракетобудування.
ribbonia-alien-science-pack=Справді інопланетне дослідження, зосереджене здебільшого на просторовому мисленні та методах виготовлення з рідин.
cake=Люта суміш консервантів зі слідами замороженого юмако — цей торт ніколи не зіпсується.
loser-ticket=Програшний квиток з таємничої скриньки, на ньому чиєсь обличчя.
burned-loser-ticket=Програшний квиток з таємничої скриньки, обпалений, але чомусь не згорілий.
crumbled-loser-ticket=Програшний квиток з таємничої скриньки, зім'ятий, але чомусь не знищений.

