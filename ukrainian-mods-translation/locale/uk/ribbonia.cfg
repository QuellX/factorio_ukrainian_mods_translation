ribbonia-fuel-cell-productivity=Продуктивність реакторного палива
ribbonia-special-fuel-productivity=Продуктивність спеціалізованого палива
plasma-nuclear-fuel=Іонізація ракетного палива
ribbonia-tech-rocket-part=Проєкт «Одіссея»
ribbonia-tech-rocket-control-unit=Блок керування ракетою
ribbonia-tech-lds=Лиття структури малої щільності повністю з рідин
