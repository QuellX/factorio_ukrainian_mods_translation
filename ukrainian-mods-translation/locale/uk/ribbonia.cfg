ribbonia=Досліджуйте покинутий фульґорський світ-кільце Ріббонію — штучну планету, де просторове мислення й винахідливість стануть ключем до виживання. Чи впораєтеся ви з Ч.А.Р.Л.З. — божевільним і самотнім ШІ?

