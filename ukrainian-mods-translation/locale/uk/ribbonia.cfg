ribbonia-tech-rocket-part=Задоволений вашим технологічним прогресом, Ч.А.Р.Л.З. нарешті дозволить вам покинути [planet=ribbonia].
fluid-recycler=Дає змогу вичавлювати рідкі інгредієнти з різних компонентів, як-от риби, батарей чи навіть вибухівки!

[compat]
k2-ribbonia-alien-science-pack=Інопланетна технологічна картка
outer-rim-manufactory=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Бували на Секретасі, так? Той старий Вармайнд досі грається зі своїми кораблями?
tiny-solar-matrix=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Тук-тук, Нео. Це наймиліша й найкрихітніша сонячна матриця, яку ви бачили!
diesel-assembling-machine=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Викопне паливо? На моїй планеті? Дозволю.
kr-air-purifier=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Перепрошую? Це повітря вручну фільтрують найякісніші фульґорські фільтри.
cerys-fulgoran-reactor=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Це зліпив той божевільний мешканець місяця? Простежте, щоб воно не опромінило мої схеми.
planetaris-hyper-transport-belt=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Гей, чому цей конвеєр такий піщаний?
lumber-mill=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Лісопилка? Хіпі.
big-crusher=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ці дробарки щороку стають дедалі більшими.
maraxsis-conduit=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Потрібно збудувати додаткові пілони.
blueprint-deployer2=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Скриня B.A.D.? Ви водилися з тим ботаном Л.О.Р.А.К.С.? Принаймні він нарешті заводить друзів.
linox-building_mantle-extractor=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ви свердлите мій реактор? Л.О.Р.А.К.С. за це заплатить!
ribbonia-beacon=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: А, елегантний маяк для цивілізованіших часів. Беремо маяк нового покоління, посилюємо антену, виламуємо захисні функції. Мені подобається.
steam-assembling-machine=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Машина на парі? Це що, якась третя промислова революція?
burner-assembling-machine=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Вам же довелося відкрити електрику, щоб сюди дістатися, так?
catalytic-chemical-plant=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Це перефарбована хімічна установка? Ліниво, але дозволю.
steam-recycler=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Я ж сказав — жодної переробки! Стривайте, він працює на парі? Навіщо?
gold-railgun-turret=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ваш золотий пістолет проти мого Walther PPK?
machining-assembler=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Цей складальник виглядає дуже продуктивним хлопцем.
wsr-big-assembler=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ну й велетень! З якого місяця ви його поцупили?

