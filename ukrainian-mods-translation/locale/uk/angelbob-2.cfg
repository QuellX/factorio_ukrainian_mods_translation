[recipe-description]
ab-external-planet-bootstrap=Обережний перехідний рецепт сумісності AngelBob для __1__. Доступний лише на цій сторонній планеті.
ab-vulcanus-lava-smelting=Високопродуктивна місцева виплавка злитків AngelBob з лави та кальциту на Вулканусі.
ab-vulcanus-emergency-plate=Навмисно неефективне аварійне перетворення. Основний шлях виробництва — лиття розплавленого металу Angel's.
ab-vulcanus-plastic-support=Місцеве допоміжне виробництво пластмаси на Вулканусі з вуглецю з вугілля, низька продуктивність.
ab-vulcanus-starter-volcanic-residue=Вилучення вулканічного залишку до появи ливарні для запуску виробництва вольфраму на Вулканусі.
ab-vulcanus-starter-tungsten-carbide=Малопродуктивний стартовий рецепт на Вулканусі до появи ливарні для отримання першого карбіду вольфраму.
ab-vulcanus-starter-tungsten-plate=Малопродуктивний стартовий рецепт на Вулканусі для першої ливарної вольфрамової пластини.
ab-vulcanus-ore-extraction=Вулканічний видобуток лише на Вулканусі. Продукція потрапляє у звичайний ланцюжок рафінування руд Angel/Bob.
ab-custom-progression-route=Допоміжний спеціалізований рецепт прогресу; див. вимоги до поверхні та машини цього рецепта.
ab-paracelsin-water-harvesting=Збирає базовий запас води з атмосфери Парацельсина.
ab-space-platform-rocket-booster=Повільне, матеріаломістке виробництво ракетних прискорювачів для оборони платформи. Лише на космічних платформах.
ab-process-steam-boiler=Будує окремий твердопаливний котел для технологічної пари. Його вихід має залишатися відокремленим від ванільних парових двигунів і турбін.
ab-planet-bootstrap=Повільний і дорогий резервний рецепт без імпорту з використанням __1__. Повне виробництво Angel/Bob та спеціалізоване виробництво навмисно сильніші.
ab-planet-emergency-route=Обмежене аварійне виробництво для __1__. За можливості замініть звичайним спеціалізованим ланцюжком.
ab-planet-support-route=Допоміжне виробництво на рівні обслуговування для __1__. Не замінює звичайну логістику чи спеціалізований ланцюжок.
ab-planet-specialist-route=Планетоспецифічне виробництво для __1__, відокремлене від загальних рецептів Angel/Bob.
foundry-tungsten-plate=Лиття вольфрамової пластини з проміжних продуктів вольфраму Angel/Bob і розплавленого заліза на Вулканусі.
planetaris-calcite-from-pure-sand=Видобування кальциту з чистого піску Арігу.
planetaris-carbon-from-pure-sand=Видобування вуглецю з чистого піску Арігу.
planetaris-sulfur-from-pure-sand=Видобування сірки з чистого піску Арігу.
ab-muluna-crushed-alumina-to-alumina=Рафінування подрібненого глинозему Мулуни в ланцюжок глинозему Angel/Bob за допомогою пари.
ab-muluna-crushed-aluminium-to-alumina=Рафінування багатого на метал подрібненого алюмінію Мулуни в глинозем без обходу прогресу алюмінію Angel/Bob.
ab-muluna-molten-aluminium-from-alumina=Переробка глинозему Angel/Bob на розплавлений алюміній на Мулуні з використанням місцевого тепла, пари та вуглецю.
ab-muluna-cast-aluminium-plate=Лиття розплавленого алюмінію в алюмінієві пластини Angel/Bob на Мулуні.
ab-muluna-draw-aluminium-cable=Волочіння алюмінієвої пластини в алюмінієвий дріт за допомогою пари на Мулуні.
ab-muluna-vacuum-furnace=Будує парову піч низького тиску для обробки злитків лише на Мулуні без відкриття повної доменної виплавки Angel's.
ab-vulcanus-foundry-tungsten-carbide-specialization=Використовує фінальний ливарний порошок вольфраму Angel's, вуглець, кальцит і лаву для ефективного виробництва карбіду лише на Вулканусі без обходу рафінування вольфраму.
planetaris-arig-roboport-2=Перетворює робопорт Bob's 2-го рівня на пилостійкий логістичний вузол Арігу.
planetaris-arig-roboport-3=Перетворює робопорт Bob's 3-го рівня з використанням армованого скла Арігу та діамантових ущільнень.
planetaris-arig-roboport-4=Перетворює робопорт Bob's 4-го рівня з використанням максимального захисту від пилу Арігу.
ab-low-gravity-provisioning=Повільний рецепт виживання за низької гравітації для Мулуни та космічних платформ. Не призначений для масового виробництва.
ab-low-gravity-maintenance-plate=Повільний рецепт виживання за низької гравітації для виробництва базових пластин на Мулуні та космічних платформах. Не призначений для масового виробництва.
ab-low-gravity-maintenance-ore=Обмежений допоміжний рецепт перетворення астероїдів на руду за низької гравітації для виживання на Мулуні та космічних платформах. Не є повним ланцюжком обробки руд.
ab-space-firearm-magazine=Виробляє базові магазини з набоями із залізної пластини та вуглецю на Мулуні та космічних платформах.
ab-low-gravity-provisioning-firearm-magazine=Виробляє базові магазини з набоями з двох залізних пластин і вуглецю на поверхнях з низькою гравітацією.
ab-space-platform-iron-plate=Відновлює залізну руду з астероїдів вуглецем у дробарці астероїдів для практичного обслуговування корабля після вдосконаленої обробки астероїдів.
ab-space-platform-firearm-magazine=Виготовляє базові боєприпаси для оборони корабля із залізної руди з астероїдів і вуглецю без відкриття повноцінної виплавки в космосі.
ab-fulgora-silicon-wafer-to-powder=Відновлення кремнієвого порошку з пластин для ланцюжків цементу, скла, нітриду кремнію та скловолокна на Фульґорі.
ab-fulgora-wooden-board-to-wood=Відновлення невеликої кількості деревини з дерев'яних плат для рейок і базової логістики на Фульґорі.
ab-fulgora-scrap-washing-primary-aggregate=Промивайте брухт лігроїном Фульґори та водою, щоб отримати змішаний первинний рудний агрегат.
ab-fulgora-scrap-washing-catalyst-aggregate=Використовуйте нафтохімію та первинний агрегат, щоб концентрувати сліди руд пізньої Фульґори.
ab-fulgora-solid-resin-liquefaction=Зріджуйте відновлену смолу нафтохімією Фульґори для вдосконалених друкованих плат Angel/Bob.
ab-fulgora-glass-to-glass-fiber=Витягуйте скло в скловолокно на Фульґорі, використовуючи перший етап безперервного лиття Angel's.
ab-fulgora-naphtha-to-mineral-oil=Рафінуйте лігроїн Фульґори в мінеральну оливу для місцевого виробництва мастила.
ab-fulgora-heavy-oil-to-naphtha=Перетворює мазут Фульґори зі старих збережень на лігроїн для поточного нафтохімічного ланцюжка Angel/Bob.
ab-fulgora-mineral-oil-lubricant=Виробляйте мастило з мінеральної оливи Фульґори без імпорту нафтопродуктів.
ab-fulgora-ferric-chloride-solution=Використовуйте місцево відновлену залізну руду та кислотну хімію для прогресу друкованих плат на Фульґорі.
ab-low-gravity-water-boiling=Повільний рецепт кип'ятіння води за низької гравітації для виживання на Мулуні та космічних платформах. Не є загальною заміною планетарного котла.
ab-muluna-lunar-mud=Обробляйте парою місячний мінеральний залишок і місцевий лід, щоб отримати трохи мулу для стартового будівництва на Мулуні.
ab-muluna-lunar-clay=Концентруйте місячний мул Мулуни з мінеральним залишком у глину без відкриття повного ланцюжка промивання Angel's.
ab-muluna-lunar-clay-brick=Випалюйте невелику партію глиняних цеглин у паровій дробарці для першої вакуумної печі Мулуни. Не є рецептом для масового виробництва глини.
ab-muluna-return-rocket-fuel=Повільне виробництво ракетного палива лише на Мулуні з місцевого окисника, глинозему та вуглецю. Не замінює звичайне ракетне паливо деінде.
ab-muluna-return-low-density-structure=Повільне виробництво структури малої щільності лише на Мулуні з алюмінію та місцевих матеріалів низької гравітації.
ab-muluna-return-titanium-plate=Вилучення невеликої кількості титанових пластин з місячного мінерального залишку для зворотних ракет.
ab-muluna-return-titanium-pipe=Формування титанової пластини в трубу для частин зворотної ракети Мулуни.
ab-muluna-return-heat-shield-tile=Повільне виробництво теплозахисту лише на Мулуні з титану, глинозему, вуглецю та пари.
ab-muluna-return-electronic-circuit=Повільне виробництво електронних схем лише на Мулуні з алюмінієвого дроту, алюмінієвої пластини, вуглецю та пари.
ab-muluna-return-advanced-circuit=Повільне виробництво покращених схем лише на Мулуні для електроніки зворотних ракет. Не є загальною заміною Фульґори.
ab-muluna-return-processing-unit=Повільне виробництво процесорів лише на Мулуні для зворотних ракет без відкриття повноцінної електронної планети.
ab-aquilo-ammonia-washing=Промивайте лід Аквіло аміачним розчином, отримуючи мінеральну пульпу для аварійної стартової обробки.
ab-aquilo-wash-saphirite=Повільне промивання аміачної мінеральної пульпи в подрібнений сапфірит для старту на Аквіло.
ab-aquilo-wash-stiratite=Повільне промивання аміачної мінеральної пульпи в подрібнений стиратит для старту на Аквіло.
ab-aquilo-wash-jivolite=Повільне промивання аміачної мінеральної пульпи в подрібнений дживоліт для старту на Аквіло.
ab-aquilo-wash-crotinnium=Повільне промивання аміачної мінеральної пульпи в подрібнений кротиній для старту на Аквіло.
ab-aquilo-wash-rubyte=Пізнє допоміжне промивання на Аквіло для невеликої кількості подрібненого рубіту.
ab-aquilo-wash-bobmonium=Пізнє допоміжне промивання на Аквіло для невеликої кількості подрібненого бобмонію.
ab-aquilo-ice-regolith-processing=Вимивайте мінеральні частинки з льоду Аквіло аміачним розчином для базового забезпечення каменем.
ab-aquilo-synthetic-resin=Невелике виробництво смоли лише на Аквіло з аміаку, води та вуглецю для стартової електроніки.
ab-aquilo-insulating-board=Невелике виробництво базових плат лише на Аквіло для запуску виробництва схем, а не повноцінний електронний ланцюжок.
ab-aquilo-bob-lithium-preparation=Підготовка літію Bob's з літію Space Age для холодних хімічних ланцюжків Аквіло.
ab-aquilo-bob-lithium-plate-preparation=Підготовка літієвої пластини Bob's з літієвої пластини Space Age для холодних хімічних ланцюжків Аквіло.
ab-aquilo-lithium-ion-battery-assembly=Використовуйте літієву пластину Аквіло, аміак і холодний фторований кетон для покращеного складання літієвих батарей без перенесення виробництва електроніки на Аквіло.
ab-aquilo-silver-zinc-battery-assembly=Використовуйте холодний фторований кетон Аквіло з імпортованими сріблом і цинком для покращеного складання срібно-цинкових батарей.
ab-aquilo-coolant-regeneration=Відновлюйте відпрацьований охолоджувач холодним фторованим кетоном Аквіло для холодної хімії та підтримки термоядерного синтезу.
ab-aquilo-liquid-nitrogen-condensation=Конденсуйте невелику кількість рідкого азоту на Аквіло за допомогою аміачної хімії та холодного фторованого кетону.
ab-aquilo-fluoroketone-cooling=Використовуйте кріогенні умови Аквіло, щоб перетворювати гарячий фторований кетон назад на холодний.
ab-arig-heavy-mineral-sand=Концентруйте водою важкі мінерали-домішки з пустельного піску Арігу. Малопродуктивний допоміжний рецепт, а не масовий видобуток.
ab-arig-wash-saphirite=Промивання важкого мінерального піску Арігу в невелику кількість подрібненого сапфіриту для місцевого обслуговування.
ab-arig-wash-stiratite=Промивання важкого мінерального піску Арігу в невелику кількість подрібненого стиратиту для місцевого обслуговування.
ab-arig-wash-jivolite=Промивання важкого мінерального піску Арігу в невелику кількість подрібненого дживоліту для місцевого обслуговування.
ab-arig-acid-wash-crotinnium=Використовуйте кислоту й нафтохімію Арігу, щоб вилучити сліди подрібненого кротинію після компресійної науки.
ab-arig-acid-wash-rubyte=Використовуйте кислоту й нафтохімію Арігу, щоб вилучити сліди подрібненого рубіту після компресійної науки.
ab-arig-acid-wash-bobmonium=Використовуйте кислоту й нафтохімію Арігу, щоб вилучити сліди подрібненого бобмонію після компресійної науки.
ab-muluna-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку ропи на Мулуні.
ab-fulgora-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку шламу на Фульґорі.
ab-vulcanus-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку геотермальної ропи на Вулканусі.
ab-arig-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку солоних ґрунтових вод на Арігу.
ab-aquilo-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку замерзлої ропи на Аквіло.
ab-gleba-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку органічних ґрунтових вод на Ґлебі.
ab-hyarion-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку кристалічної пульпи на Харіоні.
ab-paracelsin-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку кислої ропи на Парацельсині.
ab-maraxsis-ground-water-bore=Пристосувати свердловину ґрунтових вод для видобутку глибинної ропи на Мараксисі.
ab-muluna-bore-water-processing=Фільтрація місячної ропи в невелику кількість води та мінеральні побічні продукти.
ab-fulgora-bore-water-processing=Відстоювання електролітичного шламу в аварійну воду та забруднені відходи.
ab-vulcanus-bore-water-processing=Конденсація геотермальної ропи в обмежену кількість води із залишком сірчанокислих відходів.
ab-arig-bore-water-processing=Очищення солоних ґрунтових вод в обмежену кількість води та мінеральні побічні продукти Арігу.
ab-aquilo-bore-water-processing=Розморожування замерзлої ропи в обмежену кількість води та багаті на аміак побічні продукти.
ab-gleba-bore-water-processing=Очищення органічних ґрунтових вод у воду та біологічні відходи.
ab-hyarion-bore-water-processing=Відстоювання кристалічної пульпи в сліди води та мінералізовані побічні продукти.
ab-paracelsin-bore-water-processing=Нейтралізація кислої ропи в обмежену кількість води та хімічні відходи.
ab-maraxsis-bore-water-processing=Очищення глибинної ропи в обмежену кількість води та солоні побічні продукти.
ab-muluna-lunar-concrete=Обробка парою місцевої глиняної цеглини, місячного мінерального залишку та льоду в бетон для будівництва ракетної шахти на Мулуні.
ab-fulgora-hydrogen-fluoride-recovery=Відновлення обмеженої кількості фторованих травильних хімікатів з фульґорського електронного брухту. Не замінює виробництво фтору на Аквіло.
ab-fulgora-silicon-wafer-manufacturing=Місцеве виробництво кремнієвих пластин з кремнієвого порошку, скла та відновлених травильних хімікатів замість перероблення транзисторів.
ab-fulgora-carbon-residue=Відновлення помірної кількості твердого вуглецю із залишків фульґорського лігроїну та пари.
ab-fulgora-synthetic-coal=Зв'язування відновленого фульґорського вуглецю із залишками лігроїну в обмежену кількість синтетичного вугілля.
ab-fulgora-cobalt-trace-recovery=Вилучення слідів кобальту з фульґорських рудних агрегатів за допомогою місцевої хімії вилуговування. Низький вихід підтримує електроніку, не замінюючи повноцінну металургію кобальту.
ab-paracelsin-vaterite-concrete=Малоефективний процес виробництва бетону на Парацельсині з місцевого ватериту для раннього будівництва.
ab-space-platform-copper-plate=Обробка міді з астероїдів лише у вигляді предметів для підтримки платформи в дробарці або дробарці 2.
ab-space-platform-steel-plate=Повільне виробництво сталі на платформі із залізних пластин і вуглецю в дробарці або дробарці 2.

