[technology-description]
ab-vulcanus-ore-extraction=Необов'язковий видобуток подрібнених руд Angel's з вулканічних залишків на Вулканусі зі збереженням рафінування Angel/Bob.
planetaris-glass=Використовуйте чистий пісок Арігу, щоб покращити виробництво скла понад стандартне рафінування.
planetaris-heavy-glass=Використовуйте вольфрамове армування та чистий пісок Арігу для створення армованого скла для вдосконалених технологій Арігу.
planetaris-big-chest=Ущільніть склади Angel/Bob у дорогі компактні контейнери Арігу.
maraxsis-hydrolox-fuel=Поєднайте гідравлічну обробку Мараксиса з кріогенною наукою Аквіло для виробництва ракетного палива пізнього космосу без заміни прогресу палива Angel/Bob.
ab-vulcanus-foundry-tungsten-specialization=Відкриває покращений ливарний рецепт на Вулканусі — від фінального ливарного порошку вольфраму Angel's до канонічного карбіду вольфраму. Виплавка вольфраму Angel's 3 залишається обов'язковим.
planetaris-arig-roboport-2=Потребує базового пилостійкого робопорта Арігу та технології робопорта Bob's 2-го рівня.
planetaris-arig-roboport-3=Зберігає логістичну продуктивність робопорта Bob's 3-го рівня, додаючи посилений захист від пилу Арігу.
planetaris-arig-roboport-4=Зберігає логістичну продуктивність робопорта Bob's 4-го рівня, додаючи максимальний захист від пилу Арігу.

[console]
factorio-update-required=[Інформація Muluna] Planet-muluna показує це повідомлення про рідинні блоки при кожній ініціалізації. AngelBob Space Age Rebalance перевіряє рідинні блоки пари та вакуумної печі Мулуни у Factorio 2.1; жодних дій не потрібно, якщо ви не помічаєте змішування рідинних мереж.

