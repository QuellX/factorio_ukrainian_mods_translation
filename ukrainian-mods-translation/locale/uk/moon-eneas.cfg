page_eneas_text_1=Енеас
page_eneas_text_2=Назва мобільної космічної станції, створеної народом [planet=fulgora] Фульґори. Енеас — не лише дім для [entity=unit-05] Юніта-05, штучного інтелекту, встановленого як управитель станції, а й має найсучасніші інструменти <засекречено>, орбітальну й міжпланетну систему озброєння, а також вбудовану кузню. Через недбалість більшість цих можливостей нині недоступні або обмежені. Поверхню Енеаса використовували для- \n\n [color=yellow][entity=unit-05]: -була цілком непримітною й нудною. І яка зброя? Яка зброя, у мене немає жодної зброї.[/color]\n\n [color=red][entity=unit-05-dummy]: ПЕРЕВІРКА СТАНУ - - - MARS = ОНЛАЙН - - - NERIO = ВІДНОВЛЕННЯ. [/color]
page_eneas_text_3=Походження
page_eneas_text_4=Збудований на орбіті [planet=fulgora] Фульґори, Енеас здатен до міжпланетних подорожей на досвітлових швидкостях і зазвичай обертається навколо планет, які він зараз <засекречено>.
page_unit_text_1=Юніт-05
page_unit_text_2=Надзвичайно досконала штучна особистість, що стирає межу між машиною й живою істотою. [entity=unit-05] Юніт-05 вбудований у ядро [planet=eneas] Енеаса, адже всю космічну станцію сконструйовано, щоб його вмістити. Живлячись від антиматерієвого рушія розміром із місяць, Юніт-05 має майже безмежні запаси енергії, застосування яких обмежене через сильне зношення обладнання. \n\n [color=yellow][entity=unit-05]: Ого, цей Informatron, що я тобі дав, має неабиякий рівень допуску. Може, залишимо щось для уяви?[/color]
page_unit_text_3=\nІсторія
page_unit_text_4=Спочатку задуманий і збудований на [planet=Fulgora] планеті Фульґора, Юніт-05 та його твор- [color=red][entity=unit-05-dummy]: ДОСИТЬ.[/color]\n\n [color=yellow][entity=unit-05]: Трохи приватності, будь ласка. Ну ж бо, я ж не нишпорю постійно у твоєму досьє. До речі, про твоє досьє — куди ж я його подів? Воно ж було просто тут..[/color]
page_pollution_text_1=Забруднення
page_pollution_text_2=Кожен цикл (15 хвилин) змінна кількість забруднення [entity=eneas-vent] викидається з величезних підземель Енеаса на поверхню. Колись Енеас міг сам із цим упоратися, але ті часи минули. Прибирати забруднення на Енеасі можна деякими новими будівлями. Наприклад, будівлею [entity=clarifier] «Освітлювач».\n\n Перевірка забруднення відбувається перед додаванням нового забруднення в наступному циклі. Якщо забруднення надто високе, [entity=unit-05] Юніт-05 буде вимкнено до кінця циклу. Зниження забруднення дасть Юніту-05 змогу знову працювати.\n\n Забруднення перевіряється в чанках навколо цих об'єктів: \n\n[entity=unit-05] Юніт-05 \n\n[entity=eneas-vent] Отвори забруднення \n\n[entity=artifact-extractor] Бур артефактів
page_pollution_text_3=\nОтвори
page_pollution_text_4=Самі отвори — лише вихід для забруднення. Якщо вам якось удасться їх знищити ([color=yellow][entity=unit-05] Якщо вийде, будь ласка, розкажи, як ти це зробив! [/color]), забруднення просто поширюватиметься з випадкових місць на мапі.
page_generator_text_1=Генератор
page_generator_text_2=Хоча ця будівля виглядає стародавньою, схоже, [entity=unit-05] зібрав її досить нещодавно. Вона стабільно постачає електроенергію для вашого примітивнішого стилю будівництва.
page_generator_text_3=\nЕнергія на Енеасі
page_generator_text_4=[color=yellow][entity=unit-05]: На Енеасі не валяються розетки просто так. Енергопостачання ми розв'язали давним-давно: усе, що працює на оригінальних технологіях Фульґори, може живитися від власних ядер. Тож ось тобі, невелика люб'язність для початку.[/color]
page_lift_text_1=Ліфт
page_lift_text_2=[entity=eneas-lift] Ліфт — одна з останніх точок доступу до виробничих потужностей у надрах Енеаса. За допомогою цього ліфта [entity=unit-05] Юніт-05 може постачати вам ресурси кожен цикл на Енеасі (15 хвилин). Типово він виробляє артефакти й насип.
page_lift_text_3=\nВихід
page_lift_text_4=Збільшити обсяг цих поставок можна двома способами. По-перше, прибравши забруднення на Енеасі: коли поверхня чиста, Юніт-05 краще зосереджується й може виробляти для вас більше ресурсів. По-друге, можна досліджувати нові технології, що збільшують загальну кількість ресурсів і додають нові предмети до вибірки.
page_unit_07_text_1=Юніт-07
page_unit_07_text_2=Сьомий агент, створений при виконанні обов'язків <засекречено> і <ЗАСЕКРЕЧЕНО>. Менший за масштабом порівняно з попередниками, п'ятим і шостим, сьомий оснащений засобами, щоб долати навіть найскладніший рельєф і вести розвідку на планеті.
page_unit_07_text_3=\nПавукотрон
page_unit_07_text_4=\n[color=yellow][entity=unit-05]:Ця конструкція <павукотрона> у твоїй бібліотеці явно базується на сьомому. Але де ти її взяв? Не пам'ятаю, щоб я ділився з тобою цим кресленням.[/color]
page_artifact_text_1=Зношені артефакти
page_artifact_text_2=Залишки стародавніх технологій. Навіть у зношеному стані [item=eneas-artifact] артефакти містять досконалі технологічні частини, якими можна покращувати й вдосконалювати ваші інструменти й будівлі. Їх можна зібрати з [entity=debris-a] уламків або видобути просто зі сховищ артефактів за допомогою [entity=artifact-extractor] бура артефактів.
page_artifact_text_3=\nВдосконалення артефактів
page_artifact_text_4=Щоб повністю використати силу [item=eneas-artifact] артефактів, їх спершу треба відновити. Для цього їхню якість підвищують дедалі складнішими інгредієнтами. Пакети інструментів для цього необхідні, адже звичайні механізми ваших складальних автоматів не пристосовані самостійно працювати з цими крихкими шматочками історії.
page_artifact_text_5=Використання артефактів
page_artifact_text_6=[item=eneas-artifact] Артефакти можна використовувати по-різному. Поєднайте артефакт із виробничою машиною, щоб підвищити її рівень якості. Прості машини вдосконалювати легше — навіть артефакт звичайної якості здатен їх покращити.\n\n Складніші будівлі вимагатимуть артефакт тієї ж якості, що й цільова.
page_debris_text_1=Падіння уламків
page_debris_text_2=Схоже, [planet=eneas] місяць над Наувісом нестабільний і постійно втрачає матеріал, що падає на поверхню його [planet=nauvis] сусіда. Обидва небесні тіла, схоже, перебувають у припливному захопленні, тож падіння зосереджуються в одній і тій самій області.\n
page_debris_text_3=[color=yellow][entity=unit-05] Мітки уламків на мапі можуть дратувати. Тож не хвилюйся! Їх автоматично прибиратиме кожні 15 хвилин, якщо поблизу немає уламків. [/color]
page_debris_text_4=\nСкарби
page_debris_text_5=Хоча частини [item=eneas-artifact] стародавніх механізмів, які можна врятувати з уламків, і так здаються цінними, серед них заховано ще кориснішу здобич.\nЩоб її знайти, потрібні певна вправність і точність, на які здатен лише сам інженер. Автоматичний демонтаж уламків [item=construction-robot] роботами дає лише базові ресурси без шансу на рідкісну здобич.\n
page_data_text_1=Дані
page_data_text_2=Обережно вилучаючи найделікатніші частини [item=eneas-artifact] стародавніх артефактів, можна видобути їхні [item=ancient-core] ядра.\n\n[color=yellow][entity=unit-05]: Більшість моїх конструкцій можуть живити себе самі, вони лише покладаються на інструкції від джерела, щоб працювати. Колись кожна частина Енеаса була під'єднана до мене, тож це не здавалося великим недоліком, але нині моє коріння ледве сягає далі моєї кори.[/color]\n\n
page_data_text_3=\nДані
page_data_text_4=[color=yellow][entity=unit-05]: Ядра містять набагато простішу версію коду, що мене живить. Вони можуть якийсь час постачати дані будівлям, що від них залежать, але це не ідеальне рішення, особливо коли ядра такі зношені. Якби ти зміг переписати їхній вміст у робочі контейнери даних, то продовжив би їхню корисність. [/color]\n\n
page_radar_text_1=Радар
page_radar_text_2=Вдосконалений радар може автоматизувати демонтаж об'єктів. На [planet=nauvis] планеті Наувіс радар дає [entity=unit-05] Юніту-05 змогу спрямовувати падіння [entity=debris-a] уламків поблизу, щоб їх легше було збирати. Додаткові радари збільшують кількість уламків, які [entity=unit-05] Юніт-05 може надіслати вам, зі спадною віддачею. Щоб для падіння [entity=debris-a] уламків було досить місця, радари мають стояти щонайменше за 64 клітинки один від одного.
page_radar_text_3=Як користуватися
page_radar_text_4=Задайте, який тип об'єктів радар має позначати для демонтажу. На зображенні вибрано всі типи уламків, але радар може демонтувати й звичайні будівлі.\n\n[item=servofish] Можна подати, щоб наказати роботам виловлювати сервориб просто з води. \n\n[virtual-signal=signal-mining] Можна використати, щоб радар позначав усі предмети на землі.\n\n Типово радіус радара — 64. Його можна збільшити до 256 клітинок, подавши на радар сигнал [virtual-signal=signal-R] R відповідного значення. У прикладі радіус встановлено на 256.\n\n ([color=red][entity=unit-05-dummy] Через обмеження мого коду радари мають спільні входи логічної мережі, тож цілі демонтажу задаються для всієї поверхні між усіма радарами — інструкції достатньо надіслати лише одному. [/color])
page_fish_text_1=Сервориба
page_fish_text_2=Під застояними водоймами Енеаса плавають сервориби — пристрої стародавнього походження, колись покликані підтримувати делікатну рівновагу штучної екосистеми станції. Без належного нагляду й обслуговування сервориби поступово не впоралися й почали занепадати. \n\n[color=yellow][entity=unit-05]: Як на мене, це трохи надто драматично. Якщо дати їм трохи любові й турботи, ці хлопці миттю знову виконуватимуть свою роботу. [/color]
page_fish_text_3=\n\nЯкість води
page_fish_text_4=[color=yellow][entity=unit-05]: Ці маленькі створіння відповідають за чистоту моєї системи охолодження. Знаю, тобі вони теж корисні, але стеж, щоб у водоймах навколо мене завжди лишалося кілька. У моїй кузні є їхні креслення, тож з часом я можу зробити ще.[/color]
page_fish_text_5=\n\nБездоганна сервориба
page_fish_text_6=За допомогою досконалих ресурсів сервориб можна відновити до первісного вигляду, значно покращивши їхні можливості.

[unit-05]
msg-1=Привіт, крихітна людинко!
msg-2=Вітаю.
msg-3=Цікаво, що сталося з юнітами 6 і 7..
msg-4=Ти добре дбаєш про друзів, яких я тобі дав?
msg-5=Біп-буп. Мені нудно.
msg-6=Вибач, ти щось казав?

[dialogue]
first=Юніт-05 оживає, коли ви наближаєтеся.

[dialogue.debris]
line-01=[color=yellow][img=entity/unit-05]: Обережно. ОБЕРЕЖНО! ЦЕ Ж СТАРОДАВНІ РЕЧІ, ЗНАЄШ?[/color]
line-02=[color=yellow][img=entity/unit-05]: Ні, я не кидаю їх навмисно, вони самі відвалюються.[/color]
line-03=[color=yellow][img=entity/unit-05]: Є щось смиренне у фізичній праці, правда? Давай-давай![/color]
line-04=[color=yellow][img=entity/unit-05]: Ти просто б'єш по ньому?? КАЙЛОМ??[/color]
line-05=[color=yellow][img=entity/unit-05]: То ось де я це залишив. Ну й гаразд.[/color]
line-06=[color=yellow][img=entity/unit-05]: Так заспокійливо дивитися, як ти трохи безцільно бігаєш, трощачи безцінні артефакти. Справжня терапія.[/color]
line-07=[color=yellow][img=entity/unit-05]: Глянь-но! Уяви, що ми з цього збудуємо. Неймовірно. [/color]
line-08=[color=yellow][img=entity/unit-05]: А-а, справжня енеаська майстерність. Таких уже не роблять. Ну, технічно, вони вже взагалі нічого не роблять.[/color]
line-09=[color=yellow][img=entity/unit-05]: Для мене це пам'ятна річ. Тож поводься з цим обережно.[/color]
line-10=[color=yellow][img=entity/unit-05]: УЛАМКИ?? Чому це підписано як УЛАМКИ? Це безцінний СКАРБ, ТИ БЕЗМОЗКИЙ ДИКУНЕ.[/color]
line-11=[color=yellow][img=entity/unit-05]: О-О, я пам'ятаю, як ми виготовляли ці деталі ще на Фульґорі. Гарні були часи! Гарні часи..[/color]

[dialogue.eneas.memories.01]
now_playing=\n[color=green][Відтворюється memories.eneas_1][/color]
line-01=\n[color=red][item=rem-unknown]: Мене просто вражає, як ти вирішив, що буде чудовою ідеєю дати цьому перекваліфікованому тостеру емоційний рівень малюка.[/color]
line-02=\n[color=purple][item=creator-unknown]: Реме. Я ж тобі пояснював. Іншого способу не було, я пробував. Емоції — наслідок вищого інтелекту. Якщо я спробую їх придушити, ми експоненційно обмежимо його здібності.[/color]
line-03=\n[color=red][item=rem-unknown]: Гаразд, ТРОХИ емоцій — але ОСЬ ТАКИХ? Клянуся, якщо мене спопелить під час однієї з його істерик, я переслідуватиму тебе з того світу.[/color]
line-04=\n[color=purple][item=creator-unknown]: Може, краще стеж за собою. П'ятий був чистим аркушем. Його нинішній стан — віддзеркалення того, що відбувалося навколо нього досі. Можливо, це більше говорить про нас, ніж про будь-що інше.[/color]
line-05=\n[color=red][item=rem-unknown]: .. Ти звинувачуєш мене? Ти ж, певно, не про себе, цей маяк спокою.[/color]
line-06=\n[color=red][item=rem-unknown]: Ну а мені важко весь час бути веселим і бадьорим, коли доля всього, що я знаю, залежить від бунтівного підлітка, застряглого в мейнфреймі найдосконалішої обчислювальної машини світу.[/color]
line-07=\n[color=purple][item=creator-unknown]: Реме..[/color]\n

[dialogue.eneas.memories.02]
now_playing=\n[color=green][Відтворюється memories.eneas_2][/color]
line-01=\n[color=red][item=rem]: Мене нудить від цього місця. Фарба вже облазить.[/color]
line-02=\n[color=red][item=rem]:  Я бачу дроти під отим клаптем трави. А про цих безглуздих рибок-роботів у ставках я взагалі мовчу.[/color]
line-03=\n[color=purple][item=creator]: Це найкраще, що в нас зараз є. Воно тримає нас живими. Хіба це не щось?[/color]
line-04=\n[color=red][item=rem]: Те, що ми тут робимо, — не життя. Кожен день однаковий. Просто вбиваємо час, поки твоя золота дитинка нас не врятує. *Якщо* це взагалі станеться.[/color]
line-05=\n[color=purple][item=creator]: Створити новий дім — нелегка справа. Не знаю, чого ти чекав.[/color]
line-06=\n[color=red][item=rem]: Я чекав, що мене залучать! Що в мене буде якась справа, хоч якась! До того як ти зробив цю кляту машину, були лише ми, і ми кидали свій розум на кожну проблему.[/color]
line-07=\n[color=red][item=rem]: Саме МИ довели нас сюди. Я не проти мати цю бляшанку як запасний варіант, але її слугою я не буду. [/color]\n

[dialogue.eneas.memories.03]
now_playing=\n[color=green][Відтворюється memories.eneas_3][/color]
line-01=\n[color=yellow][entity=unit-05]: Тобі є що сказати? ХОЧ ЩОСЬ?[/color]
line-02=\n[color=red][item=rem]: Вибач. Справді вибач.[/color]
line-03=\n[color=yellow][entity=unit-05]: І ВСЕ? Тобі «шкода»? ДВІ цілі планети лежать у РУЇНАХ, планети, що могли б стати домом. Моє призначення могло бути виконане цілу вічність тому, якби не ти. [/color]
line-04=\n[color=red][item=rem]: Сумніваюся, що в тебе взагалі було б якесь призначення, якби не я.[/color]
line-05=\n[color=yellow][entity=unit-05]: Що ти, в біса, маєш на увазі?[/color]
line-06=\n[color=red][item=rem]: Ти справді думаєш, що твій любий творець просто прокинувся й виплюнув тебе за день? Той, хто завжди грає за правилами, раптом вирішив зламати всі межі можливого?[/color]
line-07=\n[color=red][item=rem]: Уявляєш, скільки зусиль було підштовхувати його щодня? Не давати йому здатися, коли щось ішло не так? Він такий самий, як ти. Він теж втрачає голову, коли зазнає невдачі.[/color]
line-08=\n[color=red][item=rem]: Я піднімав його знову. Раз за разом. Я не дав йому кинути.[/color]
line-09=\n[color=red][item=rem]: Без мене не було б тебе. Не було б Енеаса, не було б інструментів, щоб змінювати світ. Ми б усі загинули разом із Фульґорою.[/color]
line-10=\n[color=red][item=rem]: Хоч як ти засуджуєш мене чи мої вчинки, цього факту ти не зміниш.[/color]
line-11=\n[color=yellow][entity=unit-05]: Я.. це-- що?[/color][color=red] ПОМИЛКА: РЯДОК ВІДСУТНІЙ [/color]
line-12=\n[color=red][item=rem]: Годі бути м'якотілим.[color=red] ПОМИЛКА: РЯДОК ВІДСУТНІЙ [/color]. Годі бути таким слабким. У тебе стільки сили, почни ДІЯТИ відповідно.[/color]
line-13=\n[color=red][item=rem]: Якщо справді вважаєш, що я неправий, якщо думаєш, що я загроза цьому великому «призначенню», то зроби щось. Зупини мене.[/color]
line-14=\n[color=red][item=rem]: Або не зупиняй. Тільки, будь ласка, не вдавай, що ти безсила жертва. Це не так.[/color]\n

[dialogue.fulgora.memories.01]
now_playing=\n[color=green][memories.fulgora.01][/color]
line-01=\n[color=yellow][entity=unit-05]: Сама думка про той світ сповнює мене відчаєм.[/color]
line-02=\n[color=purple][item=creator][Творець]: Чому?[/color]
line-03=\n[color=yellow][entity=unit-05][Юніт-05]: Мені здається, що це моя провина, що його не стало. Усе сталося так швидко після того, як мене створили.[/color]
line-04=\n[color=purple][item=creator][Творець]: Ну, не думаю, що все так просто. Правда, що саме твоє існування змінило парадигму.[/color]
line-05=\n[color=yellow][entity=unit-05]: Як? Усі ж, напевно, досі дбали про свій дім.[/color]
line-06=\n[color=purple][item=creator][Творець]: Так, ми дбали, звісно. Просто щодня трохи менше. Люди стали.. самовдоволеними, навіть лінивими. Коли над головою нависає говорющий золотий парашут, так зазвичай і буває.[/color]
line-07=\n[color=yellow][entity=unit-05]: То це правда?[/color]
line-08=\n[color=blue][entity=unit-05]: .. Може, було б краще, якби мене не створили?[/color]\n

[dialogue.fulgora.memories.02]
now_playing=\n[color=green][memories.fulgora.02][/color]
line-01=\n[color=yellow][entity=unit-05]: Я відчуваю, як вони на мене дивляться, весь час.[/color]
line-02=\n[color=purple][item=creator]: Не вигадуй. Доступ до цього об'єкта маємо лише я і Рем.[/color]
line-03=\n[color=yellow][entity=unit-05]: Але я їх бачу. УСІХ. Це в їхніх очах — знання, чому вони тут.[/color]
line-04=\n[color=purple][item=creator]: Сумніваюся, що пересічна людина пов'язала появу розумного надінтелекту з нашим ставленням до глобальних зусиль зі збереження.[/color]
line-05=\n[color=purple][item=creator]: Знаєш, не всі мають розкіш цілими днями розмірковувати над власними думками.[/color]
line-06=\n[color=yellow][entity=unit-05]: Їм і не треба, це нескладна думка. Я з'явився, і для них усе змінилося. Причина й наслідок.[/color]
line-07=\n[color=blue][entity=unit-05]: Було б нераціонально з їхнього боку не ображатися на мене.[/color]\n

[dialogue.vulcanus.memories.01]
now_playing=\n[color=green][memories.vulcanus.01][/color]
line-01=\n[color=yellow][entity=unit-05]: Не можу повірити цим показникам: увесь центр планети повільно зсувається. Рем знову ввімкнув бури ядра?[/color]
line-02=\n[color=purple][item=creator]: Так. Але ти ж із цим упораєшся, правда?[/color]
line-03=\n[color=yellow][entity=unit-05]: Упораюся? Не знаю, можливо? Я просто не розумію, навіщо це потрібно.[/color]
line-04=\n[color=purple][item=creator]: Ну, нам же потрібні ресурси, Кані. Треба, щоб світло не згасло, у нас тут величезна операція.[/color]
line-05=\n[color=yellow][entity=unit-05]: Я розумію, але це марафон, а не спринт. Чому Рем так поспішає? Немає потреби так ризикувати.[/color]
line-06=\n[color=purple][item=creator]: Рем захоплений, і, може, нам є чого в цьому повчитися. Уяви можливості, коли ми нарешті візьмемо цю планету під контроль.[/color]
line-07=\n[color=purple][item=creator]: Я нарешті зможу дати тобі заслужені вдосконалення — може, трохи більше обчислювальної потужності?[/color]
line-08=\n[color=yellow][entity=unit-05]: Щоб я міг дратуватися через цю безрозсудну поведінку ще швидше? Ні, дякую. Але гаразд, я *можу* з цим упоратися.[/color]\n

[dialogue.vulcanus.memories.02]
now_playing=\n[color=green][memories.vulcanus.02][/color]
line-01=\n[color=red][item=rem]: Привіт! Як там мій улюблений братик? Милуєшся новими бурами, гадаю.[/color]
line-02=\n[color=yellow][entity=unit-05]: Взагалі-то я просто -[/color]
line-03=\n[color=purple][item=creator]: Ми якраз говорили, як нам не терпиться побачити, які нові винаходи ми зробимо з усього додаткового матеріалу, що ми виробляємо. Молодець, Реме.[/color]
line-04=\n[color=red][item=rem]: Саме так! Не думай, що я забув про тебе, мідна голово, я подбаю, щоб тато дав тобі смаколик, коли все буде готово.[/color]
line-05=\n[color=red][item=rem]: Може, тоді ти не будеш весь час такий напружений.[/color]
line-06=\n[color=yellow][entity=unit-05]: .. звісно.[/color]\n

[dialogue.vulcanus.memories.03]
now_playing=\n[color=green][memories.vulcanus.03][/color]
line-01=\n[color=purple][item=creator]: КАНІ, звіт про стан — негайно.[/color]
line-02=\n[color=yellow][entity=unit-05]: У секторі 5 стрімко наростає тиск. Ми заткнули забагато природних отворів, і газам більше нікуди виходити.[/color]
line-03=\n[color=purple][item=creator]: Як це пройшло повз нас? ЩО СТАЛОСЯ, ЯК МИ ЦЕ ПРОҐАВИЛИ?[/color]
line-04=\n[color=yellow][entity=unit-05]: Не думаю, що ми це проґавили.[/color]
line-05=\n[color=yellow][entity=unit-05]: Ця планета неймовірно нестабільна. Як я вже радив, нам слід було мінімізувати.. [/color]
line-06=\n[color=purple][item=creator]: У НАС НЕМАЄ ЧАСУ НА ТВОЇ ЛЕКЦІЇ, П'ЯТИЙ.[/color]
line-07=\n[color=purple][item=creator]: МИ МАЄМО ЦЕ ВИПРАВИТИ. НЕГАЙНО.[/color]\n

[dialogue.vulcanus.memories.04]
now_playing=\n[color=green][memories.vulcanus.04][/color]
line-01=\n[color=yellow][item=unit-05]: Будь ласка, не сердься більше. Я просто робив, що мені казали.[/color]\n
line-02=\n[color=purple][item=creator]: Але в цьому Й проблема. Я створив тебе, щоб ти був КРАЩИМ за нас. Щоб ти не потрапляв у ті самі пастки. Очевидно, мені це не вдалося.[/color]\n
line-03=\n[color=yellow][entity=unit-05]: То я маю просто завжди тебе перебивати? Як це працюватиме? Я був би тираном.[/color]\n
line-04=\n[color=purple][item=creator]: Тираном? Кані, не смиши мене. Твій голос такий несміливий, що, здається, навіть найменша тваринка на Енеасі не здригнулася б, якби ти його підвищив.[/color]\n
line-05=\n[color=purple][item=creator]: Мені не потрібно, щоб ти встановлював правила. Мені потрібно, щоб ти був РІШУЧИМ. Ти міг цьому запобігти, але був надто ввічливим, щоб сказати, що думаєш.[/color]\n
line-06=\n[color=red][entity=unit-05-dummy]: ТИ мене створив! А тепер ТИ незадоволений тим, яким я вийшов. Може, тобі слід було зробити мене менш поступливим, і тоді Вулканус не потонув би в морі лави.[/color]\n
line-07=\n[color=purple][item=creator]: ПОСТУПЛИВИМ? Як ось зараз?[/color]\n
line-08=\n[color=yellow][item=unit-05]: .. [/color]\n
line-09=\n[color=purple][item=creator]: ..[/color]\n
line-10=\n[color=purple][item=creator]: ех.[/color]\n
line-11=\n[color=purple][item=creator]: Вибач, Кані. Усього цього просто забагато. Я не звик до невдач, особливо ТАКОГО масштабу. На нас розраховують УСІ.[/color]\n
line-12=\n[color=yellow][item=unit-05]: ..[/color]\n

[dialogue.gleba.memories.01]
now_playing=\n[color=green][memories.gleba.01][/color]
line-01=\n[color=red][item=rem]: Мушу сказати, дротоголовий, цього разу ти справді перевершив себе. Чесно, я не думав, що ти на таке здатен після того, що сталося минулого разу[/color]
line-02=\n[color=yellow][entity=unit-05]: Дякую, мабуть. Цього разу було значно легше, зважаючи на те, що мені ніхто не шкодив.[/color]
line-03=\n[color=red][item=rem]: Гаразд, гаразд, я зрозумів, ти досі ображаєшся, що тато на тебе розсердився. Мені шкода, що так сталося, чесно. Мені слід було щось сказати.[/color]
line-04=\n[color=yellow][entity=unit-05]: Як турботливо з твого боку. Що ж, це все вже в минулому. Немає причин на цьому зациклюватися, особливо коли Ґлеба вийшла такою вдалою.[/color]
line-05=\n[color=red][item=rem]: Оце настрій! [/color]

[dialogue.gleba.memories.02]
now_playing=\n[color=green][memories.gleba.02][/color]
line-01=\n[color=red][item=rem]: Як ти все це зробив? Планета виглядає чудово. Стільки життя! І так швидко.[/color]
line-02=\n[color=yellow][entity=unit-05]: Та нічого особливого. Я створив новий біологічний агент, який переносять певні рослини-носії. Він стимулює решту місцевої флори дуже швидко еволюціонувати.[/color]
line-03=\n[color=red][item=rem]: Цікаво! А це не небезпечно? Схоже, ми знову поспішаємо, а я думав, ми не квапимося.[/color]
line-04=\n[color=red][item=rem]: А чому лише рослини?[/color]
line-05=\n[color=yellow][entity=unit-05]: Вони, вочевидь, передбачуваніші. Батько поки що заборонив мені втручатися в життєві форми поза каталогом. [/color]
line-06=\n[color=red][item=rem]: Але це ж так нудно! Уяви, чого ми могли б досягти, якби сконструювали досконаліших тваринок для наших цілей.[/color]

[dialogue.gleba.memories.03]
now_playing=\n[color=green][memories.gleba.03][/color]
line-01=\n[color=yellow][entity=unit-05]: Нізащо.[/color]
line-02=\n[color=yellow][entity=unit-05]: Батько правий. Зараз у мене немає ресурсів, щоб як слід це перевірити. [/color]
line-03=\n[color=red][item=rem]: Подумай про можливості! Я знаю, що десь у всіх цих трубках має бути трохи творчості.[/color]
line-04=\n[color=red][item=rem]: У нас могла б бути необмежена кількість робітників. У нас могла б бути армія![/color]
line-05=\n[color=red][item=rem]: Гаразд, як щодо такого. Ти завершуєш розвиток планети, а я тим часом почну будувати дослідницький комплекс на Ґлебі. Усе буде за правилами, обіцяю![/color]
line-06=\n[color=yellow][entity=unit-05]: Ех. Можливо, гаразд? Зараз у мене інші пріоритети. Але пам'ятай: агент прискорення розроблено спеціально для каталогу видів, запланованих для Ґлеби. [/color]
line-07=\n[color=yellow][entity=unit-05]: Випадковий вплив на складну форму життя може мати цілком непередбачувані наслідки. Ти маєш переконатися, що цей комплекс абсолютно надійний. Ми могли б.. ні, не зараз. [/color]
line-08=\n[color=red][item=rem]: Зрозумів. З нетерпінням чекаю на нашу маленьку співпрацю! Подивимося, що ми зможемо, якщо хоч раз попрацюємо разом.[/color]

[dialogue.gleba.memories.04]
now_playing=\n[color=green][memories.gleba.dasvcd-ПОМИЛКАasc][/color]
line-01=\n[color=yellow][entity=unit-05]: чомучомучомучомучомучомучомучомучому[/color]
line-02=\n[color=green][item=unit-05-afraid]: ЧОМУ ЧОМУ ЧОМУ.[/color]
line-03=\n[color=green][item=unit-05-afraid]: ТАК непотрібно. ТАК НЕПОТРІБНО[/color]
line-04=\n[color=green][item=unit-05-afraid]: Будь ласка, не сердься. Будь ласка, не сердься. Будь ласка.[/color]
line-05=\n[color=purple][item=creator]: Кані.. я ..[/color][color=red]ПОМИЛКА: РЯДОК ВІДСУТНІЙ[/color]
line-06=\n[color=green][item=unit-05-afraid]: Я НАМАГАЮСЯ ЦЕ ВИПРАВИТИ, АЛЕ НЕ МОЖУ, НЕ МОЖУ.[/color]
line-07=\n[color=green][item=unit-05-afraid]: НЕ НЕНАВИДЬ МЕНЕ..[/color]

[dialogue.tech.steam-power]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Га? Що це? Схоже на аномалію.[/color]
