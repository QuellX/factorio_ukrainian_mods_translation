line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Наполегливо раджу уважно поглянути на забруднення, яке ти виробляєш. Оболонка Енеаса вже заповнена ним по вінця, ще трохи — і я не зможу працювати. [/color]
line-03=[color=yellow][img=entity/unit-05]: Якщо хочеш допомогти, можеш посадити ще дерев. [/color]

[dialogue.tech.lurker-tech]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Як я міг забути про тебе, старий друже? Ти весь цей час був просто переді мною?[/color]
line-03=[color=yellow][img=entity/unit-05]: Будь ласка, добре дбай про сьомого.  [/color]
line-04=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.oil-tech]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Не питай, звідки ця нафта. Ти не захочеш цього знати[/color]

[dialogue.tech.chromium]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Вулканус був першим кандидатом. Він виглядав таким перспективним. Переповнений багатствами, ідеальні умови.[/color]
line-03=[color=yellow][img=entity/unit-05]: Вулканічна активність? Цілком керована. Просто треба було бути трохи обережними.[/color]
line-04=[color=red][img=entity/unit-05-dummy]: ПРОСТО ТРЕБА БУЛО БУТИ ТРОХИ ОБЕРЕЖНИМИ, АГА[/color]
line-05=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.anger-science-pack]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Як вони можуть ставитися до цього так легковажно? А як же люди, що чекають на Енеасі, поки місця стає дедалі менше?[/color]
line-03=[color=yellow][img=entity/unit-05]: Невже для них обох це була лише гра? Принаймні батько мав би розуміти.[/color]
line-04=[color=red][img=entity/unit-05-dummy]: ЯК УСІ МОЖУТЬ БУТИ НАСТІЛЬКИ НЕКОМПЕТЕНТНИМИ[/color]
line-05=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.advanced-repair-pack]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: «Виправ це», казали вони. «Виправ!» Може, їм слід було подумати про це раніше.[/color]
line-03=[color=red][img=entity/unit-05-dummy]: АВЖЕЖ, ПІДІРВІМО ПЛАНЕТУ ЗАРАДИ РОЗВАГИ, ЦІЛКОМ МОЯ ПРОВИНА[/color]
line-04=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.stonebrick-advanced]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=red][img=entity/unit-05-dummy]: Я більше не можу. Це була не моя провина![/color]
line-03=[color=red][img=entity/unit-05-dummy]: Чому всі так поводяться? ЩО Я МАВ ЗРОБИТИ?[/color]
line-04=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.overclock-unit]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Стривай.. це Фульґора? Що сталося? Я пам'ятаю її не такою.[/color]
line-03=[color=yellow][img=entity/unit-05]: Я.. був там, саме там батько мене створив. Він створив мене, бо здоров'я планети погіршувалося.[/color]
line-04=[color=yellow][img=entity/unit-05]: Він сказав, що її вже не врятувати. Що ми маємо втекти й збудувати новий дім деінде.[/color]
line-05=[color=yellow][img=entity/unit-05]: Це ж і було моє призначення, правда?[/color]
line-06=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.grief-science-pack]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Енеас створили, щоб прихистити біженців.[/color]
line-03=[color=yellow][img=entity/unit-05]: Батько вбудував мене в його ядро, щоб я наглядав за ними.[/color]
line-04=[color=yellow][img=entity/unit-05]: Ми мандрували й мандрували. Шукали місце, яке могли б назвати домом.[/color]
line-05=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.eneas-nutrients]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Гаразд, мені просто треба трохи віддихатися, образно кажучи.[/color]
line-03=[color=yellow][img=entity/unit-05]: Ґлеба виглядає чудово. Люди скоро зможуть переселитися. Батько й Рем дослухаються до моїх порад.[/color]
line-04=[color=yellow][img=entity/unit-05]: Стривай, але що ж тоді сталося?[/color]
line-05=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.fear-science-pack]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Ні, ні, це не може бути правдою. Хіба не можна на цьому й зупинитися? [/color]
line-03=[color=yellow][img=entity/unit-05]: Я зробив це! Я створив прекрасну пишну планету. Жодної небезпеки, жодних несподіванок. Просто облиште це![/color]
line-04=[color=red][img=entity/unit-05-dummy]: ПРОСТО ОБЛИШТЕ, ЧОМУ ЦЬОГО НЕ ДОСИТЬ? ЧОМУ ВИ ХОЧЕТЕ БІЛЬШОГО?[/color]
line-05=[color=red][img=entity/unit-05-dummy]: ЦЕ Ж НАВМИСНО? САМОЗНИЩЕННЯ З ПРИНЦИПУ?[/color]
line-06=[color=gray]Відкрито сторінку Informatron![/color]

[dialogue.tech.biocomputer]
line-01=[color=green][ВХІДНА ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Просто скажи йому «ні»! Відмов йому![/color]
line-03=[color=yellow][img=entity/unit-05]: Не піддавайся його дурним ідеям. Не дай йому себе заколисати. Навіть на твоїх умовах.[/color]
line-04=[color=gray]Відкрито сторінку Informatron![/color]

