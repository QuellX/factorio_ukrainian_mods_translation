[item-description]
eneas-artifact=Стародавні залишки інженерних технологій. Їх можна розібрати на корисні деталі або використати як інгредієнт для створення досконалих машин
ancient-core=Серце, що б'ється в інженерних машинах.
volatile-nutrients=[color=yellow][img=entity/unit-05]: Потужні поживні речовини, що зберігають багато енергії в малому об'ємі. Нестабільні.[/color]
volatile-spoilage=[color=red][img=entity/unit-05-dummy]: Зіпсовані нестабільні поживні речовини, що ось-ось бурхливо ВИБУХНУТЬ.[/color]
ambition-science-pack=Допоможіть Юніту-05 відновити спогади
anger-science-pack=Допоможіть Юніту-05 відновити спогади
fear-science-pack=Допоможіть Юніту-05 відновити спогади
grief-science-pack=Допоможіть Юніту-05 відновити спогади
servofish=Механізм, рідний для Енеаса. Створений фільтрувати й очищати озера та каналізацію, але давно не впорався із забрудненням. [color=red]Неїстівна.[/color]
rotund-friend=[color=yellow][entity=unit-05]: Вони такі милі. Обожнюю звук, який вони видають, коли літають. Я використав твою конструкцію, лише зробив їх трохи ефективнішими. Добре про них дбай![/color]
Construction_Drone=[color=yellow][entity=unit-05]: Ці малюки складали мені компанію, скільки себе пам'ятаю. Сумніваюся, що я досі існував би без них. Сподіваюся, вони принесуть тобі стільки ж радості, скільки мені! [/color]

