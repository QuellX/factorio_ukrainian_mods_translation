[entity-description]
debris-a=Великі чужорідні уламки з одного з місяців Наувісу. Містять сліди стародавніх технологій. Під час ручного видобування можуть дати ще [color=yellow]цінніші предмети[/color].
debris-b=Середні чужорідні уламки з одного з місяців Наувісу. Містять сліди стародавніх технологій. Під час ручного видобування можуть дати ще [color=yellow]цінніші предмети[/color].
debris-c=Малі чужорідні уламки з одного з місяців Наувісу. Містять сліди стародавніх технологій. Під час ручного видобування можуть дати ще [color=yellow]цінніші предмети[/color].
eneas-vent=Під поверхнею [planet=eneas] Енеаса заточено майже безмежну кількість бруду й забруднення. Час від часу цей отвір викидає токсичні гази, що відволікають Юніта-05.\n\n Блокування чи знищення отвору не допоможе: гази завжди знайдуть шлях на поверхню.
auto-deconstruct-radar=Вдосконалений радар зі значно більшим радіусом постійного огляду. На Наувісі ці радари притягують до себе падіння [entity=debris-a] уламків. Кілька радарів збільшують шанс додаткових уламків, зі спадною віддачею.\n\n Радар також може віддавати автоматичні накази на демонтаж за сигналами логічної мережі. Докладніше — на відповідній сторінці Informatron.
eneas-lift=Перевозить ресурси з підземних виробничих потужностей Енеаса на поверхню. Кількість за цикл залежить від рівня забруднення на Енеасі.\n\nВихід можна ще покращити, досліджуючи технології, пов'язані з [entity=eneas-lift] ліфтом.\n\n [color=red][img=entity/unit-05-dummy] УВАГА, БУДЬ-ЯКИЙ ПРЕДМЕТ, ЩО ЗАЛИШИВСЯ В ЛІФТІ, БУДЕ ВИДАЛЕНО ПІД ЧАС НАСТУПНОЇ ПОСТАВКИ [/color]
eneas-generator=Будівлі на основі стародавніх технологій живлять себе самі, тож великі електростанції не потрібні.\n\n[entity=unit-05] Юніт-05 підготував цей примітивний енергетичний інтерфейс, чекаючи на ваше прибуття.
unit-05=Основна кора [entity=unit-05] Юніта-05. Споживає [item=ambition-science-pack] пакети спогадів, щоб відновлювати втрачені записи пам'яті. \nПотребує живлення від [item=significant-data-card] паливного джерела даних.
rotund-friend=[color=yellow][entity=unit-05]: Вони такі милі. Обожнюю звук, який вони видають, коли літають. Я використав твою конструкцію, лише зробив їх трохи ефективнішими. Добре про них дбай![/color]
gantry=[entity=gantry] Портал може вдосконалювати об'єкти, припарковані в ньому.\n\n Щоб вдосконалити об'єкт, спершу відкрийте інвентар виготовлення портала й виберіть цільову якість. Вона має бути на один щабель вища, ніж у транспорту, який ви вдосконалюєте (наприклад, виберіть рецепт <незвичайна>, щоб вдосконалити звичайний локомотив до незвичайної якості).\n\n Потім подайте в портал потрібні інгредієнти. Якщо від'їхати під час вдосконалення, інгредієнти можуть бути змарновані.

