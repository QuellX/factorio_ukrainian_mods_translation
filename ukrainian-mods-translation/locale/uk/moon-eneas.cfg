[technology-description]
discover-artifact=Хоча справжнє призначення [item=eneas-artifact] артефактів, розкиданих по Наувісу, лишається невідомим, їх можна розібрати на корисні матеріали.
artifact-analysis-basic=[item=eneas-artifact] Артефакти можна використовувати для покращення базових будівель. Щоб покращувати складніші споруди, артефакти спершу треба відновити.
artifact-analysis-advanced=Дає змогу покращувати артефакти до вищих рівнів. Так вони можуть вдосконалювати ширший набір будівель і підвищувати їх до вищої якості.
artifact-analysis-expert=Дає змогу покращувати артефакти до вищих рівнів. Так вони можуть вдосконалювати ширший набір будівель і підвищувати їх до вищої якості.
artifact-analysis-master=Дає змогу покращувати артефакти до вищих рівнів. Так вони можуть вдосконалювати ширший набір будівель і підвищувати їх до вищої якості.
artifact-analysis-grandmaster=У розробці: тут закінчується перша частина Енеаса. Аквіло й фінал гри будуть у другій частині Енеаса.
ancient-core-tech=Вилучайте з артефактів [item=ancient-core], що містять важливі дані й можуть слугувати паливом для досконаліших будівель.
basic-data-management=[ancient-core] Стародавні дані можна використовувати і як паливо для складніших будівель, і для покращення наукових та інтелектуальних частин фабрики.
planet-discovery-eneas=Невеликий непримітний місяць із кліматом, схожим на Наувіс. Ретельніший огляд показує, що саме звідси надходять передачі, які ви отримуєте
artifact-drilling=На Енеасі артефакти можна видобувати просто з-під землі.
ambition-science-pack=Спогади про амбіції
fear-science-pack=Спогади про страх
anger-science-pack=Спогади про гнів
grief-science-pack=Спогади про горе
lesser-ai=Дуже примітивний штучний інтелект, що може допомагати [entity=unit-05] Юніту-05 обробляти його [item=ambition-science-pack] пакети спогадів
advanced-radar=Вдосконалений радар зі значно більшим радіусом постійного огляду. На Наувісі ці радари притягують до себе падіння [entity=debris-a] уламків. Кілька радарів збільшують шанс додаткових уламків, зі спадною віддачею.\n\n Радар також може віддавати автоматичні накази на демонтаж за сигналами логічної мережі. Докладніше — на відповідній сторінці Informatron.
module-tech=Деталі артефактів дають змогу покращувати модулі до вищого рівня раніше, ніж зазвичай
module-tech-2=Стародавні ядра дають змогу покращувати вдосконалені модулі до вищого рівня раніше, ніж зазвичай
engineer-assembler=Вдосконалена складальна лінія, натхненна інженерними технологіями. Має вроджений бонус до продуктивності. Не потребує електрики, але для роботи їй потрібен постійний потік даних.
engineer-roboport=Вдосконалений робопорт, що може обслуговувати більшу площу з тією ж кількістю енергії.
tinker-tech-basic=Вдосконалені артефакти дають змогу створювати предмети постачання альтернативними способами.
tinker-tech-advanced=Вдосконалені артефакти дають змогу створювати предмети постачання альтернативними способами.
lurker-tech=Здається, у каламутних водах Енеаса щось ховається..
supply-tech=Дає [entity=unit-05] Юніту-05 змогу виробляти більше ресурсів за цикл на Енеасі. Також покращує якість наданих [item=eneas-artifact] артефактів.
codex-tech=Дає [entity=unit-05] Юніту-05 змогу виробляти [item=notable-codex] помітні кодекси — більше, коли забруднення низьке. Предмети доставлятимуться щоциклу в [entity=eneas-lift] ресурсний ліфт. \n\nЦі дані — ефективніше паливо, ніж [item=significant-data-card] карти помітних даних.
oil-tech=Дає [entity=unit-05] Юніту-05 змогу виробляти [item=heavy-oil-barrel] діжки нафти — більше, коли забруднення низьке. Предмети доставлятимуться щоциклу в [entity=eneas-lift] ресурсний ліфт.
gantry-tech=[entity=gantry] Портал може вдосконалювати об'єкти, припарковані в ньому.

