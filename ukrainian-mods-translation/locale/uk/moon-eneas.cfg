[mod-setting-description]
moon-eneas-enable-supply-drops=Отримувати одноразові подарунки після дослідження певних технологічних віх
moon-eneas-enable-tech-messages=Отримувати повідомлення в чаті й відеопередачі після дослідження певних технологічних віх
moon-eneas-science-multiplier=Задайте власний множник досліджень для технологій Енеаса, адже на них не діє загальний множник вартості досліджень
moon-eneas-unit-05-talks=Юніт-05 показує повідомлення, коли гравець поруч. На мультиплеєрних серверах це може сильно навантажувати.
tier4-modules=Технології, що відкривають модулі 4-го рівня, натомість вимагатимуть досліджень Енеаса
integrate-lignumis=Різні зміни, що механічно поєднують Лігнуміс і Енеас. Артефакти тепер можна розбирати на золоті пластини. Артефакти потребують додаткового етапу відновлення базовими ремонтними пакетами. І багато інших змін.
