[mod-setting-description]
k2so-cubium-auto-science=Автоматично створює кубічні рецепти для дослідницьких пакетів, які ще не мають ручних кубічних рецептів.
ab-small-armoured-biter-health=Змінити максимальне здоров'я (100% — типове значення, більший відсоток робить ворогів міцнішими)
ab-small-armoured-biter-resistances=Змінити стійкості (100% — типове значення, більший відсоток робить ворогів міцнішими)
ab-small-armoured-biter-spawn-probability=Змінити імовірність появи (100% — клацуни з'являються так само часто, як звичайні кусаки; більший % робить їх появу ймовірнішою)
ab-medium-armoured-biter-health=Змінити максимальне здоров'я (100% — типове значення, більший відсоток робить ворогів міцнішими)
