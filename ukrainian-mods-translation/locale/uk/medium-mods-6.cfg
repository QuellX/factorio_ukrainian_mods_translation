ab-leviathan-armoured-biter-health=Змінити максимальне здоров'я (100% — типове значення, більший відсоток робить ворогів міцнішими)
ab-leviathan-armoured-biter-resistances=Змінити стійкості (100% — типове значення, більший відсоток робить ворогів міцнішими)
ab-leviathan-armoured-biter-spawn-probability=Типово 50%
ab-enable-nest=Якщо увімкнено, клацуни з'являтимуться з власних гнізд, а не з гнізд кусак (несумісно з Rampant)
ab-enable-moisture-check=Якщо увімкнено, гнізда клацунів з'являтимуться лише у вологих місцевостях (несумісно з Rampant)
ab-vanilla-group-scaling=Якщо увімкнено, більші клацуни займають більше місць в атакувальних групах, як великі й гігантські кусаки у ванільній Factorio 2.1. Якщо вимкнено, кожен клацун займає одне місце, як в оригінальній поведінці мода до 2.1.
replace-plastic=Відкриває розплавлену пластмасу там, де зазвичай відкривається звичайна пластмаса. Діє для всіх планет і рецептів. Якщо мод є частиною повного чи часткового оверхолу, з цим параметром рекомендовано використовувати динамічні рецепти.
dynamic-recipes=Автоматично створює еквівалентний рецепт з розплавленою пластмасою для кожного рецепта, що використовує пластмасу. Чудово підходить для великих контентних модів або модів з альтернативними рецептами.
nulls-k2so-backport-K2SO-features=Переносить зміни дизайну й функції з Krastorio 2 Spaced Out.
nulls-k2so-crushing-industry-ratios=Змінює Crushing Industry, щоб використовувати співвідношення руди до пластин як у K2, і додає рецепт збагачення подрібнених руд. Це послаблення до хімічних досліджень і посилення після Вулкануса/Ґлеби, що дає збагаченню руди застосування майже всю гру з Crushing Industry.
nulls-k2so-expanded-alternate-recipes=Додає альтернативні рецепти для проміжних продуктів, щоб зміни Krastorio в цих інгредієнтах були доцільнішими на планетах із модів.
nulls-k2so-expanded-matter-recipes=Додає рецепти перетворення матерії, переважно щоб допомогти отримувати основні ресурси K2SO на планетах, де інакше це було б непрактично.
nulls-k2so-maraxsis-quantum-revert=Скасовує вимоги до будівництва й зміни назви квантового комп'ютера, внесені Мараксисом.
nulls-k2so-modify-recycling-results=Намагається виправити різні невідповідності переробки під час гри з іншими модами.
nulls-k2so-standardize-electrolysis=Переносить рецепти електролізу на електролізний завод K2 (або електромагнітну установку). Наразі впливає лише на Мараксис. Якщо вимкнено, ці машини все одно можна використовувати, але вони не обов'язкові.
nulls-k2so-standardize-stack-sizes=Переносить підхід K2 до розмірів стосів на інші моди: більшість предметів складається до 200, більшість машин — до 50. Місткість ракет не змінюється.

