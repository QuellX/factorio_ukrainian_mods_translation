H-bomb=Модифікований артилерійський снаряд з багатоступеневою ядерною бомбою, що знищує практично все в досить великому радіусі; чудово виводить з ладу важкоброньованих ворогів.
tritium-RTG=Радіоізотопний термоелектричний генератор. Виробляє невелику, але стабільну кількість енергії незалежно від умов довкілля.
