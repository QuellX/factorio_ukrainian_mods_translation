make-promethium-require-new-packs=Прометієва наука потребує нових дослідницьких пакетів
radioactive-ice-fizzle-out-time=Час розпаду радіоактивного льоду (с)
take-value-from-gleba=Перенести продуктивність астероїдів до Aegis
ae-alt-pack-sprites=Альтернативні спрайти дослідницьких пакетів
make-railgun-upgrades-require-new-packs=Нескінченні вдосконалення рейкотрона потребують нових дослідницьких пакетів
add-value-to-fulgora=Дослідження РІТЕГів потребує електромагнітних дослідницьких пакетів
stargate-solar-power=Очікувана сонячна енергія біля зоряних брам
BA-ae-helium-processor-recipe-fix=Сумісність рецептів з Better Aquilo

[string-mod-setting]
stargate-solar-power-very-low-power=Дуже мало сонячної енергії
stargate-solar-power-low-power=Мало сонячної енергії
stargate-solar-power-location-based=Сонячна енергія залежно від місця

[mod-setting-description]
make-promethium-require-new-packs=І прометієва наука, і нескінченна продуктивність технологій тепер потребують легких і пульсарних дослідницьких пакетів.
radioactive-ice-fizzle-out-time=У секундах; навмисно дуже мало, мабуть, не варто зменшувати.
take-value-from-gleba=Продуктивність астероїдів більше не потребує сільськогосподарських дослідницьких пакетів з Ґлеби. Натомість використовуються легкі дослідницькі пакети.
ae-alt-pack-sprites=Якщо ввімкнено, нові дослідницькі пакети матимуть виразніші спрайти, взяті зі спрайта Quality Glassware.\nПоточні спрайти: [img=item/space-logistic-science-pack][img=item/pulsar-science-pack]
make-railgun-upgrades-require-new-packs=Швидкість стрільби рейкотрона тепер потребує легких дослідницьких пакетів./nШкода рейкотрона тепер потребує пульсарних дослідницьких пакетів.
add-value-to-fulgora=Дослідження РІТЕГів потребує ЕМ-дослідницьких пакетів з Фульґори. До того ж РІТЕГи треба виготовляти в ЕМ-установках.
stargate-solar-power=Задає, скільки сонячної енергії доступно платформам біля зоряних брам.
BA-ae-helium-processor-recipe-fix=Змінює рецепт «Ефективне виробництво квантових процесорів» на збалансований під власний рецепт квантового процесора з Better Aquilo

[string-mod-setting-description]
stargate-solar-power-very-low-power=Лише 1% сонячної енергії в космосі біля зоряних брам і між ними. Найскладніший варіант.\nКораблі можуть застрягнути, якщо покладаються лише на сонячну енергію.
stargate-solar-power-low-power=10% сонячної енергії в космосі біля зоряних брам і між ними. Середня складність
stargate-solar-power-location-based=Задає сонячну енергію біля зоряних брам відповідно до їхньої відстані до своїх зір. Найлегший варіант.\nСонячна енергія біля брами Calidus: 150%\nСонячна енергія біля брами Bellicos: 40%
