[achievement-description]
bellicos-milestone-1=Пролетіть 100 000 км у напрямку близької орбіти Bellicos.
bellicos-milestone-2=Досягніть половини шляху до близької орбіти Bellicos. Можливо, варто повернути назад, поки ще можна.
research-with-lightweight=Дослідіть технологію з використанням легких дослідницьких пакетів
research-with-pulsar=Дослідіть технологію з використанням пульсарних дослідницьких пакетів

