space-beryllium-underground-pipe=Спеціально розроблені берилієві підземні труби, які легше прокладати через [item=space-platform-foundation]. (більша довжина)
low-grade-fusion-reactor=Примітивний термоядерний реактор, здатний перегрівати [fluid=steam] до дуже високих температур (1200°C) — настільки, що для максимальної віддачі її, можливо, доведеться змішувати з холоднішою [fluid=steam]. Може не отримувати бонусів сусідства.
high-temp-steam-turbine=Парова турбіна, що витримує вищу температуру [fluid=steam]. Ця турбіна видобуває енергію з [fluid=steam] лише до 800°C, решта тепла марнується.
