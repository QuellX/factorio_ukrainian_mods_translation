[technology-description]
discovery-aegis-outer=Біля орбіти Ґлеби виявлено якийсь високотехнологічний масштабний портал, який, схоже, веде до іншого порталу далеко за межами вашої рідної зоряної системи. По той бік — великий пояс астероїдів, частково з щільно скупчених берилових астероїдів, що обертаються навколо невеликого, але дуже потужного гравітаційного колодязя.\nКораблі, які ви туди відправите, мають бути готові до вищої щільності й міцності астероїдів.
discovery-aegis-inner=Навіть найбезпечнішими маршрутами щільність астероїдів усередині поясу дуже висока. Що ближче ваш корабель до внутрішньої частини поясу, то менше він захищений від іонізованих струменів льоду, які створюють високоенергетичні імпульси чогось схожого на пульсар.\nЯкщо спробуєте пройти, вашому кораблю знадобляться кращі боєприпаси й лазери, щоб випаровувати іонізований лід.
discovery-bellicos=Ви точно визначили розташування гравітаційного колодязя цієї системи — це справді пульсар. Знаючи, де він, можна «безпечно» підлетіти ближче, щоб зібрати більше матеріалів; однак його оточує акреційний диск, що повільно формується, і наближення до нього може швидко створити проблеми. Ближче до орбіти пульсара астероїди також можуть рухатися непередбачувано.\nЛише кораблі з найвищими рівнями зброї мають вирушати в цю подорож.
discovery-aegis-warden=Глибоке дослідження Aegis відкрило вам доступ до Point Warden — щільного скупчення астероїдів за величезним бериловим астероїдом. Тут повно великих берилових астероїдів, але дуже мало впливу Bellicos, тобто менше іонізованих астероїдів і сонячної енергії. \nКораблі-збирачі, що летять туди, мають бути озброєні проти великих астероїдів і не надто покладатися на сонячну енергію
pulsar-science-pack=Вдосконаленіші застосування тритію
space-logistic-science-pack=Вдосконаленіші застосування берилію
beryllium-processing=Дає змогу покривати залізні й мідні компоненти берилієм.
beryllium-solar-panel=Більший і ефективніший варіант сонячної панелі з берилію; також помітно міцніший
space-beryllium-logistic=Заміна важливих залізних деталей звичайних конвеєрів деталями з берилієвим покриттям і використання їх за низької гравітації дає змогу пришвидшити конвеєри без ризику сильного зношування.
lightweight-inserters=Вища теплоємність механічних компонентів дає швидші маніпулятори, однак вони не можуть переносити стільки ж.
space-beryllium-underground-pipe=Підземні труби, змінені для ефективнішої стиковки з космічними платформами, що дає змогу подовжити їх берилієм.
beryllium-liquid-tank=ні.
lightweight-arsenal=Легші й компактніші берилієві боєприпаси, які стріляють далі й швидше з приблизно тією ж смертоносністю, що й звичайні.
tungsten-lightweight-arsenal=Наконечники з вольфрамової сталі на берилієвих кулях, ракетах і великокаліберних снарядах роблять їх ще потужнішими, зберігаючи перевагу в розмірі й вазі.
tritium-extraction=Іонізований лід містить рідкісні ізотопи, що можуть стати в пригоді, якщо їх виділити
the-solution=Сила сонця на вашій долоні... Або на [entity=biter-spawner].
low-grade-fusion=Відкриває базову термоядерну енергію: [item=low-grade-fusion-reactor] — термоядерний реактор, що споживає фіксовану кількість термоядерного палива для нагрівання об'єму [fluid=steam] і стає ефективнішим, що нижча температура вхідної пари (до 80% ККД з [fluid=steam] 15°C), і [item=high-temp-steam-turbine] — парову турбіну, що витримує вищу температуру [fluid=steam].
low-grade-fusion-thrust=Керований синтез тритію може нагріти гарячу пару до стану плазми. Викид цієї високоенергетичної плазми створює велику тягу. Для роботи пара має бути від 500°C до 1200°C.
high-grade-fusion-thrust=Обладнавши [entity=steam-thruster-TT] внутрішньою системою активного охолодження й матеріалами, що витримують вищі температури, можна використовувати значно потужніше паливо — [fluid=helium-thruster-fuel], що дає більшу тягу. Для роботи прискорювача потрібен точний контроль температури пари від 800°C до 1000°C.
tritium-fusion-fuel=Базове термоядерне паливо з тритію; працює в будь-якому термоядерному реакторі.
tritium-RTG=Використайте енергію природного радіоактивного розпаду тритію.
helium-production=Підживлюючи тритій енергією й дуже повільно змушуючи його зливатися з іншими матеріалами, можна отримувати гелій у невеликих кількостях.
circuit-productivity-helium=Точне складання в герметичній атмосфері дає змогу ефективніше виготовляти схеми, особливо складніші.
quantum-processor-helium=Гелій — ідеальне середовище, що не дає перешкодам заважати квантовим процесам, тож квантові чипи можна виготовляти з меншими витратами матеріалів.
space-plateform-productivity=Підвищує продуктивність виробництва платформ
advanced-thruster-fuel-productivity=Підвищує продуктивність тритієвого палива прискорювача
nuclear-isotope-extraction-productivity=Підвищує продуктивність обробки урану й видобування тритію
space-beryllium-transport-belt-beltbox=Відкриває стосувальники для берилієвих космічних конвеєрів.

