[space-location-description]
bellicos-orbit=Усередині акреційного диска, що формується; майже недосяжна, екстремальні умови.
aegis-inner-edge=За поясом астероїдів, але перед акреційним диском, що формується, — відносно спокійна зона порівняно з дорогою сюди.
aegis-outer-edge=Відносно безпечна зона на зовнішньому краї поясу астероїдів Aegis. Тут серед інших очікуваних об'єктів трапляються й берилові астероїди.
aegis-warden=Усередині Aegis лежить величезне скупчення астероїдів, захищене від іонізованих струменів Bellicos гігантським бериловим астероїдом. Затримуватися тут небезпечно через надзвичайну щільність астероїдів і брак сонячної енергії.
calidus-bellicos-stargate-bellicos=Технологія Предтеч. Ця брама-червоточина дає змогу космічним кораблям швидко подорожувати між віддаленими місцями.\nЦя брама розташована за Aegis на безпечній відстані від Bellicos. Вона веде назад до Calidus.

