[mod-setting-description]
li-show-undersupply=Показувати предмети, попит на які перевищує пропозицію, починаючи з найбільшої нестачі.
li-show-suggestions=Показувати пропозиції на основі активності та стану, як-от покращення сховища, зарядної інфраструктури тощо.
li-show-history=Показувати предмети, які доставляють найчастіше, які роботи сумарно переносять найдалі, та предмети з найдовшими окремими поїздками.\n\nСаме показ цих рядків змушує LI записувати історію: доставки мережі відстежуються лише тоді, коли хоча б в одного гравця в ній їх показано. Пропозиція щодо довгих поїздок будується на цій історії, тож теж потребує їх.
li-show-networks-mini-window=Показати або сховати міні-вікно вгорі ліворуч, що показує загальну кількість пропозицій у всіх мережах і дозволяє відкрити вікно мереж.
li-show-main-mini-window=Показати або сховати міні-вікно вгорі ліворуч, що показує загальну кількість бездіяльних логістичних роботів у поточній мережі й дозволяє відкрити вікно Logistics Insights.
li-max-items=Кожен рядок показує до цієї кількості записів: предмети в доставці, підсумки, відстані, предмети з нестачею та пропозиції. Все, що не вміщується, не показується.
li-ui-update-interval=Вікно перемальовується кожні стільки тіків; [font=default-semibold]60[/font] — раз на секунду. Менше — числа точніше відповідають скануванню, більше — трохи економить процесор при кількох гравцях чи великих вікнах.
li-highlight-duration=Скільки секунд підсвічування залишається на мапі. Поїздки, показані з рядка «Найдовша поїздка», залишаються втричі довше, бо за ними довше стежити.\n[font=default-semibold]0[/font] означає [font=default-semibold]безкінечно[/font].
li-show-trip-estimates=Якщо робота вперше помічено, коли він уже несе предмет, момент забирання ніхто не бачив, тож поїздка на мапі починається з місця, де робот випадково опинився. Пунктир показує, наскільки далі могло бути місце забирання.\n\nЗніміть позначку, щоб малювати лише те, що справді спостерігалося. Впливає лише на ваше відображення.
li-initial-zoom=Рівень масштабу при використанні __ALT_CONTROL__1__mine__ для фокусування на окремому предметі. Більше значення — сильніше наближення.\nЗазвичай між [font=default-semibold]0.3[/font] та [font=default-semibold]3[/font].
li-show-all-networks=Зберігати історію, пропозиції та нестачу кожної мережі, яку бачив LI, і показувати всі їх у вікні мереж.\n\nЯкщо вимкнено, зберігаються лише мережі, в яких є гравець: дані інших відкидаються, щойно останній гравець їх залишає, і вони зникають з вікна мереж.
li-gather-quality-data-global=Рахувати роботів і робопорти за якістю, що показується в підказках рядків «Активність» і «Мережа». Коштує одного додаткового запиту на кожного сканованого робота й робопорт; у дуже великій мережі без якості варто вимкнути.
li-calculate-undersupply=Визначати, які предмети запитуються швидше, ніж постачаються. Вимкнення прибирає рядок «Нестача» з вікна кожного гравця, очищує цей стовпець у вікні мереж і позбавляє від сканування кожної скрині запиту.
li-freeze-highlighting-bots=Заморожувати гру для всіх гравців, поки роботи підсвічені, щоб вони лишалися там, де підсвічування. Якщо вимкнено, роботи летять далі й за секунду-дві залишають підсвічування позаду.
li-chunk-size-global=Скільки роботів, робопортів, запитувачів чи скринь зберігання переглядається за раз. Мережа, більша за це значення, сканується за кілька проходів, по одній порції за прохід: 1100 роботів по 500 на порцію — це 3 проходи.\n\nБільше — краще: менше проходів, тож результати надходять швидше й усі роботи видно в один момент. Єдина ціна — більший сплеск навантаження в тік обробки порції, тож зменшуйте лише в разі підвисань. [font=default-semibold]400[/font] підходить більшості комп'ютерів.
li-undersupply-rolling-divisor=За одне сканування нестачі перевіряти лише [font=default-semibold]1/N[/font] запитувачів; для решти використовувати попередній результат. Після [font=default-semibold]N[/font] сканувань кожен запитувач оновлено один раз. Більші значення приблизно пропорційно зменшують навантаження на процесор ціною повільнішого виявлення нових нестач (кілька секунд за типових інтервалів сканування).\n\n[font=default-semibold]1[/font] повністю вимикає цю оптимізацію. Запитувач, вимкнений логічною мережею, помічається одразу; коли увімкнений — перевіряється як будь-який інший.
li-analysis-chunk-divisor=Ділить розмір порції для аналізу нестачі та сховищ, зменшуючи сплески навантаження на тік ціною більшої кількості тіків на кожен прохід аналізу. На сканування не впливає.\n\n[font=default-semibold]1[/font] обробляє всю порцію за тік (найшвидші результати, найбільші сплески). [font=default-semibold]4[/font] обробляє чверть за тік (рекомендовано для великих баз).
li-chunk-processing-interval-ticks=Скільки тіків минає між однією порцією та наступною; [font=default-semibold]7[/font] — близько дев'яти порцій на секунду. Менше — результати надходять швидше й помічається більше забирань, тож більше відстаней вимірюється, а не оцінюється. Більше — навантаження розподіляється рівномірніше.
li-age-out-suggestions-interval-minutes=Коли причину пропозиції усунуто, пропозиція зберігається, виділена сірим, ще стільки хвилин, а потім зникає сама. __CONTROL_KEY_CTRL____CONTROL_STYLE_BEGIN__+__CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ прибирає її одразу.\n\n[font=default-semibold]0[/font] прибирає пропозицію, щойно вона втрачає актуальність.
li-long-trip-min-distance=Як далеко роботи мають перенести предмет, щоб поїздка вважалася «довгою». Вона також має бути набагато довшою за типову поїздку цього предмета. Одна клітинка — один метр, тож [font=default-semibold]200[/font] — трохи більше трьох чанків. Пропозиція стає червоною від 1 км або від подвоєної відстані, якщо та більша.\n\nЗбільште у великій розкиданій базі, де довгі доставки — норма; зменште в компактній базі, щоб виявляти коротші обхідні шляхи.
li-long-trip-suggestions=Наскільки далі, ніж зазвичай, має бути перенесено предмет, щоб його позначило для цієї пропозиції, порівняно з типовою (медіанною) поїздкою цього предмета. [font=default-semibold]Поблажливо[/font] — у 8 разів далі, [font=default-semibold]Звичайно[/font] — у 4 рази, [font=default-semibold]Чутливо[/font] — удвічі.\n\nМінімальна відстань усе одно діє, тож коротку поїздку ніколи не буде позначено, хоч якою чутливою була б ця опція. Поїздка також перестає бути позначеною, якщо вона не повторювалася протягом [font=default-semibold]Зберігати застарілі пропозиції[/font] або трьох хвилин, якщо це менше, тож пропозиція зникає сама, щойно маршрут виправлено.\n\nПропозиція будується на історії доставок, тож з'являється лише для мереж, за якими стежили з увімкненими рядками [font=default-semibold]Історії[/font] для гравця.\n\n[font=default-semibold]Вимкнено[/font] повністю вимикає пропозицію; щоб приглушити лише один маршрут, виключіть його з рядка «Найдовша поїздка».
li-ignore-mobile-trips=Доставки персонажу чи павукотрону та забирання від них не враховуються в рядку «Найдовша поїздка» та в пропозиції щодо довгих поїздок. Така поїздка веде туди, де гравець опинився, тож нічого не каже про те, де допомогло б ближче постачання, і її не можна виключити за місцем призначення, бо воно постійно рухається.\n\nЦі поїздки все одно враховуються в «Усього предметів», «Перенесена відстань» та в середній і медіанній поїздці кожного предмета.
li-background-refresh-interval=Як часто мережі, на які ніхто не дивиться, скануються й аналізуються на пропозиції та нестачу. Сканування розподіляються в межах інтервалу, тож за 5 мереж і 30 секунд кожна сканується приблизно раз на 30 секунд, по одній кожні 6 секунд. Пропозиції щодо кількості роботів шукають тенденції щонайменше за чотири таких інтервали.\n\n[font=default-semibold]0[/font] повністю зупиняє фонове сканування й аналіз: тоді вікно мереж має актуальні дані лише для мереж, у яких є гравець.
li-ignore-player-demands-in-undersupply=Не враховувати особисті логістичні запити гравців у попиті, відносно якого вимірюється нестача. Особисті запити часто навмисно лишають незадоволеними або роблять далеко від будь-якого постачання, і інакше вони показувалися б як нестача.

