[technology-description]
wood-gas-processing=Газифікація деревини використовує хімічну лабораторію для перетворення целюлози та подрібненого глинозему на нафтовий газ і розбавлений бітум. Розбавлений бітум можна перетворити на тверде паливо в хімічній лабораторії.
wood-gas-processing-to-crude-oil=Облагороджування розбавленого бітуму використовує розбавлений бітум і воду для отримання сирої нафти.
advanced-wood-gas-processing=Вдосконалена газифікація деревини перетворює целюлозу, подрібнений глинозем і воду на мазут, дизельне пальне та нафтовий газ на нафтопереробному заводі.
space-science-pack=Виробництво [item=space-science-pack] на [planet=muluna].
muluna-anorthite-processing=Виробництво алюмінію з [item=anorthite-chunk], який можна використовувати як [item=rocket-fuel] та альтернативне джерело [item=copper-cable].
muluna-advanced-stone-processing=Використання [item=crusher] для обробки [item=stone] з вищою продуктивністю.
interstellar-science-pack=Технології для подорожей у глиб космосу.
muluna-nanofoamed-polymers=Відкривається відкриттям будь-яких __1__ планетарних дослідницьких пакетів з такого списку:
muluna-nanofoamed-polymers-2069=Відкрийте будь-які __1__ планетарні дослідницькі пакети з такого списку:
muluna-helium-enrichment=Перероблення гелію дозволяє досліджувати екзотичні технології.
advanced-space-science-pack=Дозволяє виробляти [item=space-science-pack] у космосі.
space-chest-muluna=Скриня, що може зберігати невеликий запас предметів окремо від вантажного відсіку корабля.
muluna-cycling-steam-turbine=Ефективніша парова турбіна, що дозволяє конденсувати частину спожитої пари назад у воду для повторного нагрівання. Надає перевагу гарячішій парі.
muluna-oxygen=Якщо ми хочемо тут щось спалювати, доведеться виробляти власний кисень.
muluna-wood-cultivation=Вирощування [item=wood] у [entity=chemical-plant]. Легко налаштувати, але повільно. Споживає [fluid=carbon-dioxide] і виробляє [fluid=oxygen].
muluna-water-saving-wood-cultivation=Повільніший, але менш водомісткий спосіб виробництва деревини.
muluna-greenhouses=Спеціальні теплиці виробляють [item=wood] та [fluid=oxygen] набагато швидше за хімічні заводи, але перед використанням їх потрібно засіяти [item=muluna-sapling].
muluna-gas-venting=Хоча [item=wood] — чудовий поглинач вуглецю, самої її не вистачить для стабільної роботи електростанції. В аварійних ситуаціях доводиться випускати надлишок газу, щоб уникнути перебоїв живлення.
muluna-fertilized-greenhouses=Поживні речовини з [planet=gleba] дозволяють збільшити вихід [item=wood] у [entity=muluna-greenhouse-wood].
muluna-fertilized-greenhouses-vulcanus=Фторований кетон з [planet=aquilo] дозволяє вирощувати дерева на будь-якій поверхні й додатково збільшити вихід [item=wood] у [entity=muluna-greenhouse-wood].
asteroid-productivity=Збільшений вихід від дроблення астероїдів на космічних платформах і на [planet=muluna].
asteroid-reprocessing=Переробляйте домішки в астероїдах, щоб отримати збалансованіший набір ресурсів на космічних платформах і на [planet=muluna].
advanced-asteroid-processing=Отримуйте ширший спектр ресурсів з астероїдів на космічних платформах і на [planet=muluna].
automation-3=Складальні автомати, здатні обробляти рідинні складники й дані, з додатковою швидкістю та комірками модулів.
muluna-space-telescope=Астрономічні дані, отримані від Зруйнованої планети.
x-asteroid-crushing=Дробіть астероїди в дробарці або вручну.
muluna-gleba-greenhouses=Вирощуйте культури Ґлеби будь-де.
muluna-asteroid-upcycling=Використовуйте астрономічні дані для виявлення й відбору уламків астероїдів високої якості.
rocket-part-productivity-vulcanus=Підвищує продуктивність ракетних частин на Вулканусі.
rocket-part-productivity-fulgora=Підвищує продуктивність ракетних частин на Фульґорі.
rocket-part-productivity-gleba=Підвищує продуктивність ракетних частин на Ґлебі.
rocket-part-productivity-muluna=Підвищує продуктивність ракетних частин на Мулуні.
thruster-fuel-productivity=Підвищує продуктивність палива та окисника прискорювача.
water-recycling-productivity=Підвищує продуктивність конденсації пари.
wood-gas-processing-productivity=Підвищує продуктивність газифікації деревини.

[mod-description]
planet-muluna=Досліджуйте Мулуну — супутник Наувіса, де все обертається навколо дроблення астероїдів, — і зробіть свій перший крок у космос. Відкрийте нові способи використання дробарок, тепер доступних на всіх поверхнях. Використовуйте дослідницький пакет розвідки, щоб покращувати космічні платформи й летіти ще далі в космос.

