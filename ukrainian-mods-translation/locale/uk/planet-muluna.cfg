[item-description]
I-greenhouse=__ITEM__I-greenhouse__ для висаджування та збору врожаю
muluna-satellite-radar=Діє як радар з необмеженою дальністю, розвідуючи ділянки, які гравці переглядають у віддаленому режимі на планетах, навколо яких обертається супутниковий радар. Споживає енергію лише під час використання. Радари вищої якості розвідують більше клітинок і споживають менше енергії на розвідану клітинку.
muluna-greenhouse=Перед розміщенням її потрібно засіяти певною культурою в складальному автоматі.
low-density-space-platform-foundation=Удвічі міцніший і вдвічі менш щільний за стандартний фундамент космічної платформи.
muluna-microcellular-plastic=Пластмаса з мільярдами мікроскопічних пор. Має незвичайні властивості.
muluna-diffused-plastic=Пластмаса, насичена діоксидом вуглецю. Цей діоксид вуглецю недовго залишається в пластмасі, особливо без досконаліших технологій виробництва. Ключем до зменшення браку можуть стати міцніші метали чи кращі хімічні заводи.

