[mod-setting-description]
require-gleba-for-greenhouse-tech=Технологію теплиць не можна дослідити до відкриття Ґлеби.
tree-seed-probability=Середня ймовірність випадіння насіння під час рубання дерева (діапазон: 0-1).
override-space-connection=Змінює маршрути з Наувіса до Вулкануса, Ґлеби та Фульґори, щоб вони пролягали через Мулуну. Змусить кожну платформу, що летить до Наувіса, вручну скинути політ.
space-science-pack-output=Змінює вихід обох рецептів космічного дослідницького пакета.
enable-muluna-satellite-radar=Може спричиняти проблеми з продуктивністю або можливість шкодити іншим гравцям на мережевих серверах.
muluna-hardcore-restrict-crusher=Обмежує рецепти дробарки та дробарки 2 Мулуною й додає алюмінієві пластини до рецепта дробарки.
muluna-hardcore-restrict-asteroid-collector=Обмежує рецепт збирача астероїдів Мулуною й додає до нього алюмінієві пластини.
muluna-change-quality-science-pack-drain=Задумане для Мулуни споживання дослідницьких пакетів можна вимкнути для сумісності з іншими модами.
muluna-hardcore-remove-steam-furnaces=Прибирає з гри будівлі «Кам'яна парова піч» та «Сталева парова піч». Додає реалізму, але значно ускладнює старт на Мулуні без зовнішніх поставок.
muluna-hardcore-remove-starting-cargo-pods=Прибирає стартові вантажні капсули Мулуни. Робить неможливим старт бази на Мулуні без зовнішніх поставок.
muluna-hardcore-lock-recipe-x=Заохочує побудувати невелике дослідницьке виробництво до запуску першої ракети, закриваючи технологію за космічною наукою.
muluna-easy-simple-wood-gasification=Подвоює вихід кожного етапу ланцюжка газифікації деревини, забороняючи модулі продуктивності.
muluna-hardcore-classic-wood-gasification=У 2.0 з ланцюжка газифікації деревини Мулуни прибрали один етап (подрібнена деревина). Цей параметр повертає його.
muluna-easy-vanilla-rocket-part-costs=Типово Мулуна подвоює вартість усіх рецептів ракетних частин, що не використовуються на Мулуні, подвоює максимальну кількість модулів у ракетній шахті й додає десять нових рівнів технологій продуктивності ракетних частин, доступних після відкриття космічної науки. Цей параметр скасовує ці зміни.
muluna-easy-wood-gasification-productivity=Полегшує виробництво нафтопродуктів на Мулуні, додаючи технологію підвищення продуктивності газифікації деревини. Рекомендовано при старті на Мулуні.
muluna-graphics-enable-footstep-animations=Частинки від кроків споживають близько 0,01 мс на гравця на Мулуні за оновлення. На величезних серверах це може спричиняти проблеми з продуктивністю.
muluna-easy-simple-nanofoamed-polymers=Спрощує ланцюжок нанопінних полімерів: псування насиченої пластмаси починається після виготовлення, а не з початком виготовлення.
muluna-easy-revert-changes-to-space-platform-technology=Також скасовує зміни технології прискорювача космічної платформи, роблячи стандартні рецепти палива/окисника прискорювача доступними до прибуття на Мулуну.
muluna-easy-electric-roboports-on-muluna=Підвищує тиск атмосфери Мулуни до 10 гПа, дозволяючи електричним робопортам працювати на Мулуні.
muluna-interstellar-science-pack-dynamic-packs-required=Буде потрібна половина (з округленням угору) усіх планетарних дослідницьких пакетів, що сприяють відкриттю [technology=interstellar-science-pack], замість жорстко заданого значення.
muluna-alternative-automation-pack-recipe=Дозволяє повністю дослідити ранні технології на Мулуні. Завжди увімкнено при старті на Мулуні.
muluna-easy-interstellar-science-pack-compatibility-mode=Дослідницький пакет розвідки додається лише до специфічних для Мулуни та фінальних технологій.
muluna-runtime-locomotive-replacement=Увімкнути заміну локомотивів під час гри, щоб заборонити їм неоксигеноване паливо.

