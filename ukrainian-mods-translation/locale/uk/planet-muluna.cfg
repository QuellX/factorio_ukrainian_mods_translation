[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna] — безкрая сіра кам'яна пустеля. На поверхні повно метеоритів, багатих на метали, паливо та воду, але щоб дістатися цих ресурсів, метеорити спершу потрібно подрібнити в [entity=crusher].\n[entity=metallic-asteroid-chunk]: основне джерело [item=iron-ore]. [entity=carbonic-asteroid-chunk]: основне джерело хімічного палива у вигляді [item=carbon].\n[entity=oxide-asteroid-chunk]: основне джерело [fluid=water]. [entity=anorthite-chunk]: альтернативне джерело [item=copper-cable] та [item=rocket-fuel].\nПаливо не горітиме без штучного джерела [fluid=oxygen]. Нафтопродукти тут неможливо виробити без технологій, що виходять за межі нашого теперішнього розуміння.
space-science=Після відкриття [item=electromagnetic-science-pack], [item=agricultural-science-pack] та [item=interstellar-science-pack] стає можливим виробляти [item=space-science-pack] на космічних платформах з оброблених уламків астероїдів.

