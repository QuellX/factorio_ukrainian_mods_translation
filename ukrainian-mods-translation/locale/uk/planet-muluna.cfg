[entity-description]
E-greenhouse=Висаджуйте насіння, збирайте рослини
muluna-advanced-boiler=Котел, що може працювати в безкисневому середовищі, як-от на [planet=muluna] та на космічних платформах.
space-heating-tower=Теплова вежа, що може працювати в безкисневому середовищі, як-от на [planet=muluna] та на космічних платформах.
muluna-cycling-steam-turbine=Ефективніша парова турбіна, що дозволяє конденсувати частину спожитої пари назад у воду для повторного нагрівання. Надає перевагу гарячішій парі.\n[fluid=steam] Макс. температура: 500 °C\n[fluid=cooled-steam] температура: 100 °C
muluna-rocket-buggy=Більший і швидший автомобіль з ракетницею та сіткою спорядження.
muluna-vacuum-heating-tower=Виробляє тепло з хімічного палива з ще вищою ефективністю. Працює на всіх поверхнях, але споживає [fluid=oxygen] і виробляє [fluid=carbon-dioxide].
muluna-telescope-combinator=Вдивляється у всесвіт, збираючи інформацію про оточення телескопа.\nНа планетах:\n[img=quality.normal]: індекс кожної космічної платформи на орбіті\n[img=quality.uncommon]: стан кожної космічної платформи на орбіті\n[img=quality.rare]: чи може (2) чи не може (1) кожна платформа на орбіті вилетіти\nНа платформах:\n[img=virtual-signal.signal-I]: індекс космічної платформи\n[img=virtual-signal.signal-X]: якщо на космічному маршруті — поточна позиція на ньому\n[img=virtual-signal.signal-L]: якщо на космічному маршруті — його загальна довжина\nТелескоп також видає сигнал для кожного астероїда навколо платформи. Складова [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=Вдивляється у всесвіт, збираючи інформацію про оточення телескопа.\nНа планетах: індекс кожної космічної платформи на орбіті\nНа платформах:\n[img=virtual-signal.signal-I]: індекс космічної платформи\n[img=virtual-signal.signal-X]: якщо на космічному маршруті — поточна позиція на ньому\n[img=virtual-signal.signal-L]: якщо на космічному маршруті — його загальна довжина\nТелескоп також видає сигнал для кожного астероїда навколо платформи. Складова [entity=muluna-telescope].
muluna-telescope=Вдивляється у всесвіт, генеруючи астрономічні дані. Для отримання даних потрібен чистий вид на зорі. У екзотичніших місцях дає більше даних. Також генерує логічні сигнали через [entity=muluna-telescope-combinator]. На кожній планеті можна розмістити лише один телескоп, але на космічних платформах обмежень немає.
muluna-crusher=Дробарка з електродвигуном. Подрібнює предмети з кращою енергоефективністю.
muluna-burner-roboport=Робопорт, що заправляє роботів паливом та окисником замість електрики, дозволяючи їм літати без атмосфери.\nДив. також: [entity=muluna-burner-roboport-roboport]
muluna-burner-roboport-roboport=Робопортова складова [entity=muluna-burner-roboport]

[entity-factoriopedia-description]
muluna-telescope-combinator=Вдивляється у всесвіт, збираючи інформацію про оточення телескопа.\nНа планетах:\n[img=quality.normal]: індекс кожної космічної платформи на орбіті\n[img=quality.uncommon]: стан кожної космічної платформи на орбіті\n      [font=default-bold]1[/font]: очікує стартовий пакет.\n      [font=default-bold]2[/font]: стартовий пакет запитано з логістичної системи.\n      [font=default-bold]3[/font]: стартовий пакет у дорозі.\n      [font=default-bold]4[/font]: рухається маршрутом.\n      [font=default-bold]5[/font]: платформа готова залишити цю планету й не приймає доставки.\n      [font=default-bold]6[/font]: немає станцій у розкладі.\n      [font=default-bold]7[/font]: немає шляху.\n      [font=default-bold]8[/font]: очікує на станції\n      [font=default-bold]9[/font]: призупинено\n[img=quality.rare]: чи може (2) чи не може (1) кожна платформа на орбіті вилетіти\nНа платформах:\n[img=virtual-signal.signal-I]: індекс космічної платформи\n[img=virtual-signal.signal-X]: якщо на космічному маршруті — поточна позиція на ньому\n[img=virtual-signal.signal-L]: якщо на космічному маршруті — його загальна довжина\nТелескоп також видає сигнал для кожного астероїда навколо платформи. Складова [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=Вдивляється у всесвіт, збираючи інформацію про оточення телескопа.\nНа планетах: індекс кожної космічної платформи на орбіті\nНа платформах:\n[img=virtual-signal.signal-I]: індекс космічної платформи\n[img=virtual-signal.signal-X]: якщо на космічному маршруті — поточна позиція на ньому\n[img=virtual-signal.signal-L]: якщо на космічному маршруті — його загальна довжина\nТелескоп також видає сигнал для кожного астероїда навколо платформи. Складова [entity=muluna-telescope].

